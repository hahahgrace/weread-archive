刻都过得飞快，像是在海上航行的风帆，在帆下面，满是财宝，满是欢乐。", "y": "", "d": "2023-02-21"}, {"k": "h", "c": "甘玛拉", "x": "必须自己去亲身体验。", "y": "", "d": "2023-02-21"}, {"k": "h", "c": "在人群中", "x": "得花那么大的代价去追求。\n他看到人们彼此吵架，相互伤害，看到他们为此痛苦而悲伤，对这种痛苦，沙门只是一笑置之。他看到他们为了一些损失而痛心，对这类损失，沙门觉得根本就不值一提。", "y": "", "d": "2023-02-21"}, {"k": "h", "c": "在人群中", "x": "大多数的人就像是一片片落叶，在空中随风飘游、翻飞、荡漾，最后落到地上。有少数人像是天上的星星，循着固定的轨道运行，任何风都吹不到他们那儿，在他们内心中，有他们自己的引导者和方向。", "y": "", "d": "2023-02-21"}, {"k": "h", "c": "摆渡人", "x": "瓦树地瓦一句话也不说，只是抱着期待的心情静静地听。悉达多感觉到他把每个字都听进去了，没有忽略掉任何一点。他倾听的时候毫不厌烦，对事情既不赞美，也不责难，只是仔细倾听。", "y": "", "d": "2023-02-22"}, {"k": "h", "c": "摆渡人", "x": "他不断地向那条河学，尤其是向那条河学习如何倾听，如何用一颗平静的心去倾听，如何用一个等待的、开敞的灵魂去倾听，没有激情，没有愿望，没有判断，没有意见。", "y": "", "d": "2023-02-22"}, {"k": "h", "c": "摆渡人", "x": "每一样东西，没有以前，没有以后，只有现在和现在的实在。”", "y": "", "d": "2023-02-22"}, {"k": "h", "c": "唵", "x": "所有这些微小的、简单的、愚蠢的，却又是无比强大的、重要的、热烈的冲动，在悉达多看来，已不再是微不足道。他看到了人们为了这些冲动而活，看到了人们为了这些欲望而从事伟大的事情，旅行，打仗，受苦受难，发愤图强；看到他们为了这些冲动、欲望而辗转奔波，他很爱他们。在他们的一切欲望和需要中，他看到了生命、活力，也看到了生命的不可磨灭和永恒的梵天。", "y": "", "d": "2023-02-22"}, {"k": "h", "c": "唵", "x": "他明白了真正的智慧是什么，明白了自己在漫长的岁月中探求的真正目标是什么。那目标不是别的，而是在生命的每一个时刻中灵魂的一种准备，一种容纳力，一种思考、感觉和呼吸万物圆融统一思想的秘技。", "y": "", "d": "2023-02-22"}, {"k": "h", "c": "唵", "x": "那条河笑了，是的，人生就是这样的。每样事情，在没有忍受到尽头之前，在没有最后终结之前，都会重演，同样的悲哀也会再度被人历经一次。", "y": "", "d": "2023-02-22"}]}, {"id": "912324", "title": "鼠疫", "author": "[法]加缪", "cats": ["文学-外国文学", "精品小说-社会小说", "文学-经典作品"], "bmCount": 17, "rvCount": 0, "notes": [{"k": "h", "c": "第一部", "x": "然而却有一些城市，一些地区，那里的人们会时不时臆想点别的事。一般说，这并不会改变他们的生活。但毕竟有过臆想，而有了这一点就永远比别的强。", "y": "", "d": "2025-03-11"}, {"k": "h", "c": "第一部", "x": "一切都要求健康的体魄", "y": "", "d": "2025-03-11"}, {"k": "h", "c": "第一部", "x": "天灾人祸本是常见之事，然而当灾祸落在大家头上时，谁都难以相信那会是灾祸。人世间经历过多少鼠疫和战争，两者的次数不分轩轾，然而无论面对鼠疫还是面对战争，人们都同样措手不及。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "第一部", "x": "他们自以为无拘无束，但只要大难临头，谁都不可能无拘无束。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "第一部", "x": "我晚上的时间是神圣不可侵犯的", "y": "", "d": "2025-03-23"}, {"k": "h", "c": "第二部（一）", "x": "那近如昨日却恍如隔世的音容笑貌", "y": "", "d": "2025-03-23"}, {"k": "h", "c": "第二部（一）", "x": "鼠疫带给同胞们的第一个感觉是流放感", "y": "", "d": "2025-03-23"}, {"k": "h", "c": "第二部（一）", "x": "他们强迫自己永远别再考虑解脱的日期，别再将眼光转向未来，而且应当时刻“低着头”过日子。", "y": "", "d": "2025-03-23"}, {"k": "h", "c": "第二部（一）", "x": "说他们在生活不如说他们在漂浮，他们被遗弃在没有方向的日子里和毫无结果的回忆中，这些日子和回忆有如飘忽不定的幽灵，只有情愿在他们痛苦的土地里扎根才可能成形", "y": "", "d": "2025-03-23"}, {"k": "h", "c": "第二部（一）", "x": "我曾非常爱你，但如今我太累了……我离开你并不感到幸福，可是并非需要幸福才能重新开始。", "y": "", "d": "2025-03-24"}, {"k": "h", "c": "第二部（一）", "x": "意识到一种让人别扭的冷漠已开始主宰了他", "y": "", "d": "2025-03-25"}, {"k": "h", "c": "第二部（一）", "x": "因为在怜悯已起不了作用时，人们对怜悯会感到厌倦", "y": "", "d": "2025-03-25"}, {"k": "h", "c": "第二部（一）", "x": "一颗焦虑的心最大的愿望是无休无止地占有所爱之人", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "第二部（二）", "x": "人世间的罪恶几乎总是由愚昧造成，人如果缺乏教育，好心也可能同恶意一样造成损害。", "y": "", "d": "2025-03-29"}, {"k": "h", "c": "第二部（二）", "x": "人有无知和更无知的区别，这就叫道德或不道德，最令人厌恶的不道德是愚昧无知，无知的人认为自己无所不知", "y": "", "d": "2025-03-29"}, {"k": "h", "c": "第二部（二）", "x": "必须以这样或那样的方式斗争而不是屈膝投降", "y": "", "d": "2025-03-29"}, {"k": "h", "c": "第二部（二）", "x": "他没有别的，只有一颗比较善良的心和一个看似滑稽的理想", "y": "", "d": "2025-04-12"}]}, {"id": "3300028279", "title": "羊道三部曲（阿勒泰春夏牧场纪实，李娟一口气必读之作，套装共3册）", "author": "李娟", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 15, "rvCount": 0, "notes": [{"k": "h", "c": "三版自序", "x": "这一次再版，额外想提一下怀特班——被我们抛弃在春牧场上的小狗。那段描写引起许多读者不适，不断发来谴责。他们认为我和我所在的游牧家庭太残忍太自私，没有尽到救助的责任。为此我也曾努力解释过，反复强调当时的危险境地。在第二次出版时，我还增加了更细致的说明。却仍不能让他们释怀。我想，有些东西真的是无法沟通的。但是作家就是帮助沟通的角色，在不同的生存状态和生存文化之间凿空。我不能做到最好，曾经有些沮丧。这次重新读到这一段，突然就释怀了。这些故事里大量提及生存的严酷，是绝大多数读者所陌生的，可能也是刺激他们阅读的因素之一。那样的严酷，大家也许会为之感慨，却无人能够接受吧。在平稳舒适的生活中呆久了的人们，难免以为平稳舒适就是理所当然的。实际不是的。这个地球上绝大多数的人类仍在受苦，如一句网络热议：“他们活着就已经用尽全力。”所以，针对他们的道义上的指责也许只是侥幸出生在优渥环境中的人们的矫情吧。", "y": "", "d": "2023-01-11"}, {"k": "h", "c": "生活又开始了", "x": "若不是满目葱翠，这样的冷真令人灰心。", "y": "", "d": "2023-08-23"}, {"k": "h", "c": "生活又开始了", "x": "云和云之间的天空破碎而湛蓝", "y": "", "d": "2023-08-23"}, {"k": "h", "c": "宁静悠长的下午时光", "x": "阳光从毡房顶的破洞里投进来八个明亮的大星星。", "y": "", "d": "2024-03-07"}, {"k": "h", "c": "宁静悠长的下午时光", "x": "每一天都有一场缓慢无边的下午时光，于是这样的每一天都漫长得似乎经历了好几个白天，这样的一天里似乎能做完好几天的事情。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "宁静悠长的下午时光", "x": "夏牧场真好。牛羊每天都能吃得饱饱的，心满意足。羊羔长得飞快，嗖嗖嗖几下就大了。原先入栏后，还空着大半个羊圈，现在整个羊圈都挤得满满当当。在挤得最紧的角落里，羊羔们想转个身都很难。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "宁静悠长的下午时光", "x": "总之，一年之中最丰盈从容的季节来临了。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "宁静悠长的下午时光", "x": "谁知一躺倒，睡意就像满满一盆水当头泼了下来，浑身透湿。于是眼睛一闭，顺势舒舒服服陷进睡眠的大沙发里了。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "宁静悠长的下午时光", "x": "杨树光洁的树干上遍布枝干断落后的节疤，仿佛睁满了美丽的眼睛。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "自序", "x": "是对记忆的临摹，也是心里的渴望", "y": "", "d": "2023-01-11"}, {"k": "h", "c": "自序", "x": "放弃了判断和驾驭，只剩对此种生活方式诚实的描述，并通过这场描述，点滴获知，逐渐释怀", "y": "", "d": "2023-01-11"}, {"k": "h", "c": "自序", "x": "等这些文字差不多全结束时，仍停不下来，感到有更多的东西萌动不止。", "y": "", "d": "2023-01-11"}, {"k": "h", "c": "自序", "x": "他们与世人相同的那部分，那些相同的欢乐、相同的忧虑与相同的希望。", "y": "", "d": "2023-01-11"}, {"k": "h", "c": "再版自序", "x": "突然间所有生活细节历历在目，所有当时情绪重新漫过头顶。我逐字逐句摸索，像在阳光下富裕而从容地翻晒自己压箱底的珍宝。又像在字里行间涉水前行。身心沉重饱满。", "y": "", "d": "2023-01-11"}, {"k": "h", "c": "再版自序", "x": "它收容我所有混乱、模糊、欲罢不能的心思，将其分摊进数十万字的庞大细节中，一点一点为之洗净铅华。我已分不清这是写作的力量，还是文字自身的力量。永远骄傲，永远羞愧。", "y": "", "d": "2023-01-11"}]}, {"id": "3300150689", "title": "一切愁云消散", "author": "[英]薇塔·萨克维尔- 韦斯特", "cats": ["精品小说-女性小说", "文学-外国文学"], "bmCount": 14, "rvCount": 0, "notes": [{"k": "h", "c": "文前", "x": "心中宁静，一切愁云消散。", "y": "", "d": "2025-08-30"}, {"k": "h", "c": "第一部", "x": "长寿之人起码克服了人类与生俱来的一个缺陷：生命苦短。从永恒的泯灭中偷走二十年，等于向命数宣告自己高出一筹。我们用来衡量人生价值的天平就是这样的微小。", "y": "", "d": "2026-06-22"}, {"k": "h", "c": "3", "x": "证据就是她热切地接受了人生的这一段新旅程，尽管这是最后一段了", "y": "", "d": "2026-06-27"}, {"k": "h", "c": "3", "x": "他们的故事也不过是人类平庸无奇的故事——天知道，在他们自己看来，这一辈子已经够曲折起伏了，殊不知它过于平常，最终无声无息地汇入了芸芸众生的汪洋大海", "y": "", "d": "2026-06-28"}, {"k": "h", "c": "3", "x": "他们来到这里是为了慢慢地黯淡，轻柔地飘散，他们就这样黯淡了，这样飘散了；", "y": "", "d": "2026-06-28"}, {"k": "h", "c": "3", "x": "滚烫的感情冲破束缚，从熔炉中喷涌而出，一颗心仿佛会被复杂而矛盾的欲望撑得迸裂开来，那样的日子已经一去不返；", "y": "", "d": "2026-06-29"}, {"k": "h", "c": "3", "x": "这种细微、默契、将心比心的殷勤构成了他们的关系。", "y": "", "d": "2026-06-29"}, {"k": "h", "c": "3", "x": "可是，不知为什么，翩翩起舞的蝴蝶在她心里始终更重要。", "y": "", "d": "2026-07-01"}, {"k": "h", "c": "第二部", "x": "是的，那就是她，黛博拉·李，不是黛博拉·霍兰，也不是黛博拉·斯莱恩", "y": "", "d": "2026-07-01"}, {"k": "h", "c": "2", "x": "人生就是那片湖，斯莱恩夫人心想，她坐在暖洋洋的南墙下，闻着桃子的香气；湖面水平如镜，用来映照许许多多的倒影，在阳光下金光灿灿，在月色下银辉闪烁，在云朵下幽暗阴沉，在涟漪下层层褶皱；但湖面始终水平如镜，平平整整，界限分明，无法被捏成一个紧绷绷、硬邦邦的小球，小到可以握在手里，而人们在问一个人这辈子是幸福还是不幸时，期待的正是这样的结果。", "y": "", "d": "2026-07-01"}, {"k": "h", "c": "第三部", "x": "规律的生活正合她们的心意", "y": "", "d": "2026-07-06"}, {"k": "h", "c": "1", "x": "他们是两个老人，年逾古稀的老人，老得无时无刻不在感知着衰老，老得像两只猫一样喜欢坐在火炉两边取暖，伸出几乎透明的手，欣赏透过来的粉红色火焰，同时任由谈话时断时续。", "y": "", "d": "2026-07-06"}, {"k": "h", "c": "3", "x": "只有坚不可摧的灵魂才能忍受这样的孤独。", "y": "", "d": "2026-08-03"}, {"k": "h", "c": "3", "x": "一个忠于自己的机会", "y": "", "d": "2026-08-04"}]}, {"id": "29859696", "title": "老实人（伏尔泰作品集）", "author": "[法]伏尔泰", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 12, "rvCount": 1, "notes": [{"k": "h", "c": "第七章 一个老婆子怎样的照顾老实人，老实人怎样的重遇爱人", "x": "老实人以为是做梦，他把一生看做一个噩梦，把眼前看做一个好梦。", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第十二章 老婆子遭难的下文", "x": "几百次想自杀，却始终丢不下人生。这个可笑的弱点，大概就是我们的致命伤：时时刻刻要扔掉的枷锁，偏偏要继续背下去；一面痛恨自己的生命，一面又死抓不放；把咬你的毒蛇搂在怀里抚摩，直到它吃掉你的心肝为止：这不是愚不可及是什么？", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第十八章 他们在黄金国内的见闻", "x": "人多么喜欢奔波，对自己人炫耀，卖弄游历的见闻，所以两个享福的人决意不再享福，去向国王要求离境。", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第二十一章 老实人与玛丁驶近法国海岸，他们的议论", "x": "老实人道：“那末干么要有这个世界呢？”——“为了气死我们的，”玛丁回答。", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第二十五章 佛尼市贵族波谷居朗泰访问记", "x": "能把自己的思想写出来是件美事，也是人类独有的权利", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第二十五章 佛尼市贵族波谷居朗泰访问记", "x": "老实人道：“能批评一切，把别人认为美妙的东西找出缺点来，不也是一种乐趣吗？”玛丁回答：“就是说把没有乐趣当做乐趣，是不是？”", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第三十章 结局", "x": "这一席话又引起众人新的感想：玛丁下了断语，说人天生只有两条路：不是在忧急骚动中讨生活，便是在烦闷无聊中挨日子。", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "第三十章 结局", "x": "由邦葛罗斯代表发言，说道：“师傅，请你告诉我们，世界上为什么要生出人这样一种古怪的动物？”\n修道士回答：“你问这个干什么？你管它做什么？”老实人道：“可是，大法师，地球上满目疮痍，到处都是灾祸啊。”修道士说：“福也罢，祸也罢，有什么关系？咱们的苏丹打发一条船到埃及去，可曾关心船上的耗子舒服不舒服？”", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "第三十章 结局", "x": "谈话之间，听到一个消息，说君士坦丁堡绞死了两个枢密大臣，一个大司祭；他们不少朋友都受了木柱洞腹的极刑。几小时以内，这桩可怕的事沸沸扬扬，传遍各地。", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第三十章 结局", "x": "向老人打听那绞死的大司祭叫甚名字，老人回答：“我素来不知道大司祭等等姓甚名谁。你说的那件事，我根本不晓得。我认为顾问公家事情的人，有时会死于非命，这也是他们活该。我从来不打听君士坦丁堡的事；我不过把园子里种出来的果子送去卖。”", "y": "", "d": "2026-06-21"}, {"k": "h", "c": "第三十章 结局", "x": "老实人问土耳其人：“想必你有一大块良田美产了？”土耳其人回答：“我只有二十阿尔邦地￼；我亲自和孩子们耕种；工作可以使我们免除三大害处：烦闷，纵欲，饥寒。”", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "第三十章 结局", "x": "人天生不是能清闲度日的。”玛丁道：“少废话，咱们工作罢；唯有工作，日子才好过。", "y": "", "d": "2026-06-21"}, {"k": "t", "c": "全书想法", "x": "", "y": "情节好荒诞，但我喜欢这个结尾。\n世界既不完美，也未必有宏大意义。不必感到虚无、也别空谈哲学，而是 —— 劳作、创造，耕种自己的花园。", "d": "2026-06-27"}]}, {"id": "3300055149", "title": "我在北京送快递", "author": "胡安焉", "cats": ["精品小说-纪实小说", "文学-纪实文学"], "bmCount": 13, "rvCount": 0, "notes": [{"k": "h", "c": "7 履新", "x": "我们抱怨各自任职的公司是自然而然和惯常的话题。并不是说我们心里有多么不满，只是这些话能拉近我们的距离，赢得彼此的好感和信任，建立一种同仇敌忾的阶级情谊。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "8 时间成本", "x": "渐渐地，我习惯了从纯粹的经济角度来看待问题，用成本的眼光看待时间。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "8 时间成本", "x": "我不会惯着他那从这么一丁点儿职权中滋生的虚荣心。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "9 投诉和“报复”", "x": "我的“报复备忘录”里总共只记过两个名字，后来都删掉了，一个都没报复。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "11 遣散", "x": "但在我们无产阶级的心里，对于资本家的种种行径，始终保持着万年不变的冷淡和警惕，从不抱有任何幻想。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "1 从第一份工作到第八份工作", "x": "因为我意识到自己想讨好所有人的冲动是盲目和徒劳的。每个人都会以己度人，你永远无法让一个不真诚的人相信你的真诚。反之，你根本没必要向一个真诚的人证明你的真诚。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "1 从第一份工作到第八份工作", "x": "但是当时，我不敢面对领导提要求、谈条件，我觉得这是在搞特殊化，是想谋取特别照顾，可能会招致同事的不满。实际上我想得太多，而且想歪了。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "1 从第一份工作到第八份工作", "x": "人和人之间不需要建立任何交情，只要共同遵守规则，就可以高效地处理各种事情，每个人也可以过得舒适自如。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "2 从第九份工作到第十一份工作", "x": "什么是重要的，什么是不重要的。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "2 从第九份工作到第十一份工作", "x": "如今我不会再为自己和别人的差异感到惶恐不安，相反，我珍视自己的个性。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "3 写作", "x": "相比于限制你做所有你想做的事情，向你灌输你需要些什么并给你途径去实现，无疑是更牢固和持久的促成社会稳定的手段。但这其实仍然是奴役人的方式。而在这样的社会规则下，个人自我实现的最主要手段依然是工作。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "后记 生活的另外部分", "x": "所谓的自由，实际上在于你能意识到什么，而不在于你享有什么。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "后记 生活的另外部分", "x": "因为从更多的生活经验中，我逐渐认识到，怀着怨恨的人生是不值得过的。", "y": "", "d": "2024-02-09"}]}, {"id": "22622979", "title": "绿毛水怪", "author": "王小波", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "序 《绿毛水怪》和我们的爱情", "x": "我们好像在池塘的水底，从一个月亮走向另一个月亮。", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "序 《绿毛水怪》和我们的爱情", "x": "我这一生仅仅因为得到了他的爱就足够了，无论我又遇到什么样的痛苦磨难，小波从年轻时代起就给了我这份至死不渝的爱，就是我最好的报酬。我不需要任何别的东西了。", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "童年时期，回想起来就像整整一生似的。一切都那么清晰、新鲜，毫不褪色", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "还有无数的好书，书名美妙封面美好的书，它们真能在我幼小的心灵里唤起无穷的幻想。", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "大团的蒲公英浮在街道的河流上，吞吐着柔软的针一样的光。", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "我们好像在池塘的水底。从一个月亮走向另一个月亮。", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "我说：“老陈，你别不要脸了。你简直酸得像串青葡萄！”", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "我甚至微微有一点高兴，妖妖倒找到了一个不错的葬身之所！我还有些非非之想，觉得她若有灵魂的话，在海底一定是幸福的。", "y": "", "d": "2025-05-13"}, {"k": "h", "c": "绿毛水怪", "x": "声音是陌生的低沉，它又是那么丰满而柔软，像一只海豹。但是我认出了它的面容，它独一无二的笑容，我在天涯海角也能认出来，它是我的妖妖！", "y": "", "d": "2025-05-13"}]}, {"id": "3300103451", "title": "趁生命气息逗留", "author": "[美]罗杰·泽拉兹尼", "cats": ["精品小说-科幻小说"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "能量涌现", "x": "这是我了解的纽约，我去过的巴黎。瞧见没，我最喜欢的餐点、饮料、雪茄、饭店、公园，还有深夜开车的路段。我在这个地方挖池子、修棚屋、游泳。这个，是我的初吻。这是因为失去而落下的泪水；这是我的自我流放，是孤独，而这是疗愈、惊叹与快乐；这些是我祖母种的水仙花；这则是她的棺椁，周围装点了水仙；这是我喜爱的曲风，这是我的狗，它活了很久，生前一直很快活。所有这些能温暖灵魂、让头脑冷静的事物，都被封在记忆和一个人的自我中。我将它们给你，虽然你来不及了解它们。", "y": "", "d": "2024-07-28"}, {"k": "h", "c": "趁生命气息逗留", "x": "“因为人类在这儿感到快乐。”“理由？”“风景。这儿很美。”", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "“眼睛。”浮罗士德说，“我合成了人类感知器官的类似物，这样我就能像人类一样看、闻、尝、听。现在请向我指出哪个物体，或者哪些物体是美的。”“就我所知，您周遭的一切都是美的。”莫德尔说。", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "“日落开始了。”莫德尔说，“试试那个。”浮罗士德挪了下位置，让眼睛对准落日，又让它们在亮光中眨了眨。余晖散尽。“看起来如何？”莫德尔问。“就像日出，只是方向相反。”“没什么特别的？”“没有。”", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "“有没有触动您的美好事物？”莫德尔问。“我不知道。”浮罗士德说。", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "“遇上那些美好事物时，您怎么知道自己遇到了它们？”“它们将不同于任何我已知的东西。”浮罗士德说。", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "“还是缺了点儿什么。”浮罗士德降落到地面，“收集数据时我模拟了人类的神经脉冲，所以信号输入部分与人类相同，但结果不一致。”“感官无法造就人类。”莫德尔说，“许多生物的感受器官与人类类似，但它们并非人类。”", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "别在问题出现前预设它存在", "y": "", "d": "2024-08-01"}, {"k": "h", "c": "趁生命气息逗留", "x": "浮罗士德观察着周围的展品。他在绘画和雕像前激活新感知器官。他分析了色彩、造型、笔触和艺术品所用材料的性质。“如何？”莫德尔问。“没发现什么东西，”浮罗士德说，“除了形状和颜料，没有其他东西。一点儿也没有。”", "y": "", "d": "2024-08-01"}]}, {"id": "907253", "title": "一个人的好天气", "author": "青山七惠", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "春天", "x": "我突然觉得寂寞起来。我老是这样，刚刚还沉浸在怀念中，转瞬间就会觉得不安。", "y": "", "d": "2018-02-26"}, {"k": "h", "c": "春天", "x": "我不需要春天这样不上不下的季节。连晴天也让人觉得冷，就盼着夏天快点儿来。冬天完了就是夏天该多好。", "y": "", "d": "2020-05-21"}, {"k": "h", "c": "夏天", "x": "夏天的早晨特别好。五点半从家里出来时，天已经亮了，空气特别清新，几乎没有人等车。我吹着口哨，连蹦带跳地走到车站的另一端。", "y": "", "d": "2018-02-26"}, {"k": "h", "c": "秋天", "x": "季节啦、身体啦，这些无关紧要的东西总是在变。", "y": "", "d": "2018-03-01"}, {"k": "h", "c": "冬天", "x": "我好像做不到将其他人和自己紧紧地连结在一起。我也想尝试一个人生活。我希望能有一回，不是别人离开我，而是我离开别人。", "y": "", "d": "2018-03-01"}, {"k": "h", "c": "冬天", "x": "以往每年都盼望的圣诞彩灯，现在也不再觉得兴奋，就让那些快乐的人尽管去快乐去吧。", "y": "", "d": "2018-03-01"}, {"k": "h", "c": "冬天", "x": "不管什么时候，事先预定的别离总是比突然的别离更难。", "y": "", "d": "2018-03-03"}, {"k": "h", "c": "迎接春天", "x": "就这样，我不断地更换认识的人，也不断地使自己进入不认识的人们之中去。我既不悲观，也不乐观，只是每天早上睁开眼睛迎接新的一天，一个人努力过下去。", "y": "", "d": "2018-03-03"}, {"k": "h", "c": "迎接春天", "x": "虽然不会有结果，虽然结局明摆着，但是不管怎么说，开始总是自由的。眼看快到春天了，多少有点不负责任，也可以原谅吧。", "y": "", "d": "2018-03-03"}]}, {"id": "912824", "title": "爱你就像爱生命", "author": "王小波", "cats": ["文学-经典作品"], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "最初的呼唤", "x": "因为认识了你，我太应该有一点长进了。", "y": "", "d": "2018-02-02"}, {"k": "h", "c": "最初的呼唤", "x": "我的良心就是你。", "y": "", "d": "2018-02-02"}, {"k": "h", "c": "最初的呼唤", "x": "为了你我要成为完人。", "y": "", "d": "2018-02-02"}, {"k": "h", "c": "真正的婚姻全是在天上缔结的", "x": "你想知道我对你的爱情是什么吗？就是从心底里喜欢你，觉得你的一举一动都很亲切，不高兴你比喜欢我更喜欢别人。你要是喜欢了别人我会哭，但是还是喜欢你。你肯用这样的爱情回报我吗？就是你高兴我也高兴，你难过时我来安慰你，还有别爱别人！", "y": "", "d": "2018-02-26"}, {"k": "h", "c": "请你不要吃我，我给你唱一支好听的歌", "x": "我把我整个的灵魂都给你，连同它的怪癖，耍小脾气，忽明忽暗，一千八百种坏毛病。它真讨厌，只有一点好，爱你。", "y": "", "d": "2018-02-26"}, {"k": "h", "c": "吾友李银河", "x": "我还希望明白什么是世界上最美最好的东西，我这样的人能做到的东西里什么是最美最好的。我要把它找到，献给别人。", "y": "", "d": "2018-03-03"}, {"k": "h", "c": "人为什么活着", "x": "总之，我认为人不应当忽视自己，生活就是自己啊。总要无愧于自己才好。", "y": "", "d": "2018-03-03"}, {"k": "h", "c": "人为什么活着", "x": "我一正经起来，就觉得自己不坏，生活也真不坏。真的，也许不坏？我觉得信心就在这里。", "y": "", "d": "2018-03-03"}]}, {"id": "3300160150", "title": "她来劈开这山（微信读书特别版）", "author": "病鹤斋", "cats": ["精品小说-女性小说", "个人成长-励志成长", "个人成长-女性成长"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "写给微信读书的读者朋友", "x": "这本书的开篇写了愿景：“劈开山，然后重建一座故事屋。”电子书的评论区也许能成为我们的赛博篝火，我们围着这些字句聊故事，聊自身的感受，聊对未来的想象。然后噼里啪啦，故事屋就在大家的打字声中建成了地基。\n文化和标签会塑造我们，单一的女性形象会限制我们对女性上限的想象与达成。我想通过这些小故事，打破一些旧标签，抛出一些新想象。\n和你们一起。", "y": "", "d": "2025-09-12"}, {"k": "h", "c": "劈山", "x": "我想再去梳一梳秋分时的云。", "y": "", "d": "2025-09-12"}, {"k": "h", "c": "狐妖的心", "x": "这颗野心想要的非常多：想要书中拥有她们的故事，想要朝堂上站满女状元，想要这天地都屏息聆听她们的欲望。", "y": "", "d": "2025-09-12"}, {"k": "h", "c": "消失的圣女", "x": "你饿昏头了，分不清什么是别人教诲你做的、什么是你自己想做的。先吃饱！", "y": "", "d": "2025-09-13"}, {"k": "h", "c": "消失的圣女", "x": "为爱情牺牲的女子发现活着会遇到更多样的爱，朋友的爱，动物的爱，自由的爱。她庆幸自己的一生没有在田埂上戛然而止。", "y": "", "d": "2025-09-13"}, {"k": "h", "c": "消失的圣女", "x": "她们的声音像姐姐，像母亲，像未来的她自己，温和而严肃：\n“弱者的牺牲不是奉献，而是献祭。让弱者奉献，是权力的谎言。\n“活着，才有创造永恒的机会。”", "y": "", "d": "2025-09-13"}, {"k": "h", "c": "美神不会说话", "x": "让你觉得蓬勃的是美，让你觉得震颤的是美。\n所有的美，都以你的感觉为标准。\n所有他人告知你的美，都是为了掌控你而编织的谎言。\n你不必成为美的载体。\n5", "y": "", "d": "2025-09-19"}]}, {"id": "33810356", "title": "禅与摩托车维修艺术", "author": "罗伯特·M.波西格", "cats": ["精品小说-治愈小说", "文学-外国文学"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "1", "x": "他们了解的一切就是此时与此地。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "1", "x": "这的确是件令人迷惘的事，就好像真理已经在敲你的门，而你却说：“走开，我正在寻找真理。”", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "1", "x": "日子就是这样随意，忘掉时间，没有人会催促你，也不用担心浪费时间。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "1", "x": "我们总是很忙，没有时间好好交谈，结果日复一日地过着无聊的生活，单调得让人几年后想起来不禁怀疑，究竟时间都去哪儿了，同时又遗憾于它的流逝。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "1", "x": "“有什么新鲜事儿？”这是一个人们最感兴趣的问题，", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "1", "x": "人们像蝼蚁一样为这些庞然大物做工", "y": "", "d": "2025-02-02"}, {"k": "h", "c": "1", "x": "于是你想，即使我是他们的一分子，也不过是另一只做苦役的蝼蚁罢了。", "y": "", "d": "2025-02-02"}]}, {"id": "935536", "title": "百年孤独", "author": "[哥]加西亚•马尔克斯", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 5, "rvCount": 1, "notes": [{"k": "h", "c": "一", "x": "多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。", "y": "", "d": "2026-11-06"}, {"k": "t", "c": "一", "x": "多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。", "y": "经典开场～终于开始读了！", "d": "2026-11-09"}, {"k": "h", "c": "一", "x": "“我们还没有死人，”他说，“只要没有死人埋在地下，你就不属于这个地方。”", "y": "", "d": "2026-11-09"}, {"k": "h", "c": "二", "x": "骨头里充满了泡沫", "y": "", "d": "2026-11-10"}, {"k": "h", "c": "二", "x": "时间使一切恢复了原样。", "y": "", "d": "2026-11-10"}, {"k": "h", "c": "三", "x": "可见纵然岁月蹉跎天各一方，写信人依然对他深情不改", "y": "", "d": "2026-11-11"}]}, {"id": "23647301", "title": "我要快乐，不必正常", "author": "珍妮特•温特森", "cats": ["文学-经典作品"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "一 错误的婴儿床", "x": "我相信虚构作品以及故事的力量，因为通过它们我们开口说话。我们没有失声。我们所有人都是，在深受创伤时，会发现自己迟疑了，结巴了；在我们的言语中有长长的停顿。想说的话哽住了。我们从他人的语言中找回自己的语言。我们可以求助于诗。我们可以翻开书本。有人在那里等我们，深潜于文字中。", "y": "", "d": "2019-04-22"}, {"k": "h", "c": "二 给所有人的忠告：诞生", "x": "从曼彻斯特沿着M62公路驶向我成长的阿克灵顿，就会看见奔宁山脉，你会惊异于群山兀然出现而沉静无声。这是一片寡言的风光，不苟言笑，不屈不挠。这不是恬适之美。但它很美。", "y": "", "d": "2019-04-22"}, {"k": "h", "c": "二 给所有人的忠告：诞生", "x": "常常满腔怒火，常常绝望。我一直是寂寞的。尽管如此，我过去和现在都热爱生活", "y": "", "d": "2019-04-22"}, {"k": "h", "c": "二 给所有人的忠告：诞生", "x": "她曾对我说，宇宙是一个浩瀚的垃圾桶——我想了一会儿之后，问她桶盖是关着还是开着。“关着的，”她说，“没人逃得了。”", "y": "", "d": "2019-04-22"}, {"k": "h", "c": "二 给所有人的忠告：诞生", "x": "无论多么贫乏，仍要爱生活，无论怎样寻找爱，也要爱自己。不是以自我为中心的方式，那将会与生活和爱背道而驰，而是以鲑鱼一般的决心逆流而上，无论水流多么汹涌，因为这是你的河流……", "y": "", "d": "2019-04-22"}, {"k": "h", "c": "四 书的麻烦……", "x": "外在的任何东西随时都可能被夺走。只有内心的东西才是安全的。", "y": "", "d": "2019-04-23"}]}, {"id": "3300219730", "title": "恨海情天文学短篇集：我爱你，你死吧", "author": "[俄]陀思妥耶夫斯基  [爱尔兰]奥斯卡·王尔德 等", "cats": ["文学-外国文学", "文学-经典作品"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "编者语", "x": "你不再期待爱情给你提供一种健康、平静、满足的生活，因为你真正想要的是存在。", "y": "", "d": "2026-09-27"}, {"k": "h", "c": "编者语", "x": "以一种完整的形式存在", "y": "", "d": "2026-10-18"}, {"k": "h", "c": "编者语", "x": "不好意思，本人没有服从规训和命运的义务。", "y": "", "d": "2026-10-18"}, {"k": "h", "c": "编者语", "x": "这就是文学赋予我们的特权。\n我们得以在文字的庇护下，安全地发一场高烧，做一场酣畅淋漓的噩梦。而当你合上书本，从这些暴", "y": "", "d": "2026-10-19"}, {"k": "h", "c": "编者语", "x": "对身边平凡而温吞的日常生出新的眷恋。", "y": "", "d": "2026-10-19"}]}, {"id": "3300175674", "title": "动物农场", "author": "[英]乔治·奥威尔", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "七", "x": "倘若她设想过未来，那未来社会应该是这样的：动物们不用再忍受饥饿和鞭子的抽打，所有动物都是平等的，每只动物各尽所能地工作，强者保护弱者，就像那天晚上她用前腿护住那群迷途的小鸭子一样。", "y": "", "d": "2026-03-12"}, {"k": "h", "c": "八", "x": "但我们只是夺回了原本就属于我们的东西。", "y": "", "d": "2026-03-12"}, {"k": "h", "c": "九", "x": "不过总体来说，动物们还是比较喜欢这些庆祝活动的。因为这些活动提醒着他们，他们才是自己的主人，他们的劳动是为了自己的利益，这让他们感到莫大的欣慰。", "y": "", "d": "2026-03-12"}, {"k": "h", "c": "十", "x": "雪球当年向动物们描绘的那种让他们无限憧憬的美好生活——装有电灯和供应冷热水的棚屋、一周三天的工作制——再也没有被提起过。拿破仑斥责这些想法违背了动物主义精神。他说真正的幸福在于辛勤的劳动和节俭的生活。", "y": "", "d": "2026-03-13"}, {"k": "h", "c": "十", "x": "只有老本杰明称自己记得漫长生命中的每一个细节，而且他知道生活从来都没有也永远不会变得有多好或是多坏。他说饥饿、苦难与失望是生活永恒不变的规律。", "y": "", "d": "2026-03-13"}]}, {"id": "30986213", "title": "青山七惠作品集（套装共7册）", "author": "青山七惠", "cats": ["文学-经典作品"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "窗灯", "x": "只要一想到植物和悉心照料它们的人，我就不由得感到畏缩。因为我不知道该怎么去爱它们。我觉得那些有心去爱这些不会说话的花花草草的人，一定是大方而从容的人，至少是要比我纯真的人。", "y": "", "d": "2024-08-07"}, {"k": "h", "c": "窗灯", "x": "最西头的公园小树林那边，橘红色的太阳眼看着沉了下去。白天的热气还积留在那里，闷热得令人窒息。", "y": "", "d": "2024-08-07"}, {"k": "h", "c": "窗灯", "x": "我晃晃悠悠地过了小马路，", "y": "", "d": "2024-08-07"}, {"k": "h", "c": "窗灯", "x": "这是我慢吞吞的一天之中，最具有清晰轮廓的、安抚心灵的一段时间。", "y": "", "d": "2024-08-07"}, {"k": "h", "c": "窗灯", "x": "太阳也在每天升起落下——这个夏天，表面上什么变化也没有。", "y": "", "d": "2024-08-08"}]}, {"id": "506698", "title": "十万个为什么（全集）", "author": "方洲", "cats": ["童书-幼儿启蒙"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "人体小奥秘", "x": "由于饮食中缺乏叶酸、维生素B1、B2、B6或缺铜、锌等微量元素，都可以导致头发变白，", "y": "", "d": "2021-11-01"}, {"k": "h", "c": "植物一箩筐", "x": "很多人手上脚上生冻疮，往往是因为用冷水洗暖和的手和脚，或用热水洗冰冷的手和脚，或将冰冷的手和脚烤火造成的。如果我们在洗冷水时，先用少量的冷水揉搓，使手和脚慢慢变凉变冷；洗热水之前，先揉搓一下手和脚，并用少量的热水搓手和脚，使手和脚慢慢温热；烤火之前，由远而近慢慢靠近火边，这样，我们的手脚皮肤从冷变热或从热变冷有一个慢慢适应的过程，就可以大大减少和避免冻疮的形成。植物冬季涂刷白剂，一方面预防寒害冻害，另一方面预防病虫害。", "y": "", "d": "2021-11-01"}, {"k": "h", "c": "植物一箩筐", "x": "植物刷白后，白色可以反射白天的太阳光和各种辐射，避免植物体内温度过高，大大减弱了白天与晚上的温度差异，避免植物受到突然变温的伤害。同时，刷白具有隔热效果，就像我们的手和脸涂防冻霜和护肤霜一样。另外，秋后初冬，许多昆虫喜欢在老树皮的裂缝中产卵过冬，刷白剂对许多害虫有杀灭作用。", "y": "", "d": "2021-11-01"}, {"k": "h", "c": "植物一箩筐", "x": "许多豆类和蔬菜经煮熟后，它们所含的蛋白质和维生素C就会凝固或破坏，供人体吸收的营养已不多。胡萝卜素则不然，它不溶于水，受热的影响很小，经炒、煮、蒸、晒后，胡萝卜素仅有少量被破坏。所以，胡萝卜生、熟食用都适宜，尤其是煮熟后，比其他蔬菜的营养价值高得多。", "y": "", "d": "2021-11-01"}, {"k": "h", "c": "植物一箩筐", "x": "瓜果里的糖分，是由叶子通过光合作用制造的碳水化合物，贮藏在果实里的。光照充足，贮藏的碳水化合物就多。", "y": "", "d": "2021-11-01"}]}, {"id": "933476", "title": "狂人日记：鲁迅小说全集", "author": "鲁迅著", "cats": ["文学-经典作品"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "自序", "x": "“假如一间铁屋子，是绝无窗户而万难破毁的，里面有许多熟睡的人们，不久都要闷死了，然而是从昏睡入死灭，并不感到就死的悲哀。现在你大嚷起来，惊起了较为清醒的几个人，使这不幸的少数者来受无可挽救的临终的苦楚，你倒以为对得起他们么？”“然而几个人既然起来，你不能说决没有毁坏这铁屋的希望。”", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "狂人日记", "x": "凡事总须研究，才会明白。古来时常吃人，我也还记得，可是不甚清楚。我翻开历史一查，这历史没有年代，歪歪斜斜的每叶上都写着“仁义道德”几个字。我横竖睡不着，仔细看了半夜，才从字缝里看出字来，满本都写着两个字是“吃人”！", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "狂人日记", "x": "吃人的是我哥哥！我是吃人的人的兄弟！我自己被人吃了，可仍然是吃人的人的兄弟！", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "狂人日记", "x": "现在晓得他讲道理的时候，不但唇边还抹着人油，而且心里满装着吃人的意思。", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "狂人日记", "x": "四千年来时时吃人的地方，今天才明白，我也在其中混了多年；大哥正管着家务，妹子恰恰死了，他未必不和在饭菜里，暗暗给我们吃。我未必无意之中，不吃了我妹子的几片肉，现在也轮到我自己，……有了四千年吃人履历的我，当初虽然不知道，现在明白，难见真的人！", "y": "", "d": "2021-04-30"}]}, {"id": "812905", "title": "霸王别姬（2020版｜同名电影原著）", "author": "李碧华", "cats": ["精品小说-情感小说", "精品小说-影视原著"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "暑去寒来春复秋", "x": "童稚的悲凉，向远方飘去，只迎上一些背了书包上学堂的同龄小孩，他们在奔跑跳跃追逐，佣人唤不住，过去了。", "y": "", "d": "2018-04-07"}, {"k": "h", "c": "君王意气尽贱妾何聊生", "x": "她毫不犹豫，没有三思，在非常危难，首先想到的是袒护自己人。油煎火燎，人性受到考验——不是你死，就是我亡。", "y": "", "d": "2018-04-17"}, {"k": "h", "c": "君王意气尽贱妾何聊生", "x": "突然数十盏聚光灯齐开，四面八方如乱箭穿心，强光闪刺，小楼大吃一惊，张目欲盲，整个人似被高温熔掉。", "y": "", "d": "2018-04-17"}, {"k": "h", "c": "八千子弟俱散尽", "x": "他挂念：酒泉？是在哪儿呢？也许今生都到不了。当明知永远失去时，特别地觉得他好。恩怨已烟消云散。", "y": "", "d": "2018-04-17"}, {"k": "h", "c": "八千子弟俱散尽", "x": "坟像扁扁的馒头，馊的。营养了黄土地。", "y": "", "d": "2018-04-17"}]}, {"id": "907254", "title": "温柔的叹息", "author": "青山七惠", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "2", "x": "“活在当下的人们的真实记录啊。可宝贵了。”", "y": "", "d": "2018-03-14"}, {"k": "h", "c": "2", "x": "这几行草草的文字就是我的一天。前半部分还是我瞎编的，只有剩下的那部分是我的一天。我的每一天，就是这几行字的复制、粘贴、复制、粘贴，如此延续下去的。", "y": "", "d": "2018-03-14"}, {"k": "h", "c": "4", "x": "我佯装不知地疾步往前走。虽说已经疲惫不堪了，但还是不想停下脚步。仿佛这样走下去，就会越来越远离烦恼似的；就不会老是去想生活如何人生如何之类的问题，而是想那些令人心情愉快的快活事了似的。", "y": "", "d": "2018-03-31"}, {"k": "h", "c": "9", "x": "今后的路途肯定还会这样弯弯曲曲地无尽延伸吧。", "y": "", "d": "2018-04-01"}]}, {"id": "3300020163", "title": "我的阿勒泰（中国版权金奖、“我的阿勒泰”同名电视剧）", "author": "李娟", "cats": ["精品小说-影视原著", "文学-散文杂著"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "四版自序", "x": "但是重读这些文字，看到年轻时候的自己站在那里迎接一切的样子：眼前人生太开阔，太令人迷醉，未来太耀眼，对爱情对生活的本能的热情太激烈……", "y": "", "d": "2022-08-17"}, {"k": "h", "c": "摩托车穿过春天的荒野", "x": "当我站在大地上，用手一指：我要去向那里！于是我就去了。又为突然发现这世上可能真的再没什么做不到的事情而隐隐不安——好像我们正在凭借着摩托车，迫不及待地、极其方便地、迅速而彻底地永远离开了什么……", "y": "", "d": "2022-09-01"}, {"k": "h", "c": "摩托车穿过春天的荒野", "x": "眼前世界通达无碍。", "y": "", "d": "2022-09-01"}]}, {"id": "3300168081", "title": "即使以最微弱的光", "author": "[韩]崔恩荣", "cats": ["精品小说-女性小说", "文学-外国文学"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "一年", "x": "和多希聊天的时候，感觉像是进入温暖的海水里游泳。一切都很自然，宛如温柔地包裹着身体的水。", "y": "", "d": "2026-05-11"}, {"k": "h", "c": "一年", "x": "即将驶出隧道的时候，多希又说：\n我祈祷前辈幸福，还要健康。", "y": "", "d": "2026-05-11"}]}, {"id": "3300056657", "title": "人生借阅室（打开一种人生）", "author": "青山美智子", "cats": ["精品小说-治愈小说"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 朋香 二十一岁女装销售员", "x": "从前的我，待自己多么粗暴啊。对入口的东西、随身的东西一点也不讲究，就这样逐渐怠慢了自己", "y": "", "d": "2025-01-12"}, {"k": "h", "c": "第一章 朋香 二十一岁女装销售员", "x": "我的眼圈红了。然后，我下定了决心。\n从今往后，我一定要……\n自食其力，让自己吃好每一餐。", "y": "", "d": "2025-01-12"}]}, {"id": "22946457", "title": "围城", "author": "钱钟书", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "重印前记", "x": "[插图]\n《围城》一九四七年在上海初版，一九四八年再版，一九四九年三版，以后国内没有重印过。偶然碰见它的新版，那都是香港的“盗印”本。没有看到台湾的“盗印”本，据说在那里它是禁书。美国哥伦比亚大学夏志清教授的英文著作里对它作了过高的评价，导致了一些西方语言的译本。日本京都大学荒井健教授很久以前就通知我他要翻译，近年来也陆续在刊物上发表了译文。", "y": "", "d": "2021-02-18"}, {"k": "h", "c": "一", "x": "忠厚老实人的恶毒，像饭里的砂砾或者出骨鱼片里未净的刺，会给人一种不期待的伤痛。", "y": "", "d": "2024-09-10"}]}, {"id": "41077379", "title": "简爱（世界十大文学名著）", "author": "夏洛蒂·勃朗特", "cats": ["文学-外国文学", "精品小说-情感小说", "文学-世界名著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第二章", "x": "约翰·里德的凶暴专横，他姐妹的傲慢冷漠，他母亲的憎厌，仆人们的偏心，所有这一切，就像污井里的淤泥沉渣，在我乱糟糟的脑海里翻腾了起来。", "y": "", "d": "2024-08-28"}, {"k": "h", "c": "第二章", "x": "寄人篱下，无依无靠", "y": "", "d": "2024-08-28"}]}, {"id": "139417", "title": "三国演义", "author": "[明]罗贯中", "cats": ["文学-古典文学"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 宴桃园豪杰三结义 斩黄巾英雄首立功", "x": "宽和，寡言语，喜怒不形于色；素有大志，专好结交天下豪杰；生得身长七尺五寸，两耳垂肩，双手过膝，目能自顾其耳，面如冠玉，唇若涂脂；中山靖王刘胜之后，汉景帝阁下玄孙，姓刘名备，字玄德。", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "第1章 宴桃园豪杰三结义 斩黄巾英雄首立功", "x": "云长造青龙偃月刀，又名“冷艳锯”，重八十二斤。", "y": "", "d": "2022-09-13"}]}, {"id": "30212113", "title": "那不勒斯四部曲", "author": "埃莱娜·费兰特", "cats": ["精品小说-社会小说", "精品小说-女性小说", "文学-经典作品"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "童年｜堂·阿奇勒的故事｜", "x": "她觉得自己在做一件该做的事情，而我忘记了我出现在那里的原因。唯一可以肯定的是：我在那里是因为她在那里。我们慢慢走向那些年我们最害怕的人，我们去探索、审问自己的恐惧。", "y": "", "d": "2022-09-09"}, {"k": "h", "c": "2", "x": "小孩子不懂“昨天”的意思，也不懂“前天”和“明天”，所有一切都在“当下”", "y": "", "d": "2022-09-09"}]}, {"id": "35008148", "title": "流金岁月（刘诗诗、倪妮主演同名电视剧原著）", "author": "[加]亦舒", "cats": ["精品小说-情感小说"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "", "x": "一个人对另外一个人好，总有原因。", "y": "", "d": "2021-01-03"}, {"k": "h", "c": "", "x": "南孙自小明白，快乐是要去找的，很少有天生幸福的人。", "y": "", "d": "2021-01-03"}]}, {"id": "22486179", "title": "我年轻时的朋友", "author": "艾丽丝·门罗", "cats": ["文学-经典作品"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "我年轻时的朋友", "x": "不再做梦，我猜想是因为梦里的希望过于明显，宽恕过于轻易。", "y": "", "d": "2020-06-09"}, {"k": "h", "c": "我年轻时的朋友", "x": "她漫不经心的幽默，妙趣横生，又绝不冷嘲热讽，还有她的轻快、热切和自信。", "y": "", "d": "2020-09-07"}]}, {"id": "24154318", "title": "我余生的第一天", "author": "维尔吉妮·格里马尔蒂", "cats": ["文学-经典作品"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "2", "x": "玛丽再也不想把自己的心交给另外的人。上一次她把心托付出去，对方却任意糟蹋。她由此推断，人们是不会去珍惜不属于自己的东西的，于是便把自己的心包裹在气泡膜里以避免受伤害。并不是非得两个人在一起才能幸福，否则说得就好像生活不过就是为了爱情，成双结对的人才有资格获得幸福似的。除了爱一个人，明明还有大把事情可以去做……", "y": "", "d": "2020-07-09"}, {"k": "h", "c": "18", "x": "在漫长的几分钟里，一切事情都显得毫无意义了，唯有此刻的圆满，是她从未想过的相遇。她觉得自己每天都比过去更加自由一点。", "y": "", "d": "2020-07-11"}]}, {"id": "907256", "title": "窗灯", "author": "青山七惠", "cats": ["精品小说-女性小说", "文学-经典作品"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "窗灯", "x": "我觉得那些有心去爱这些不会说话的花花草草的人，一定是大方而从容的人，至少是要比我纯真的人。", "y": "", "d": "2018-03-15"}, {"k": "h", "c": "1", "x": "下一个瞬间，意识到“坏了、完了”的那种感觉，就像是绝对不能迟到的考试当天早晨醒来时的那种感觉，让我猛地醒了过来。", "y": "", "d": "2018-03-16"}]}, {"id": "23233558", "title": "云边有个小卖部（彭昱畅主演同名电影原著）", "author": "张嘉佳", "cats": ["精品小说-治愈小说", "精品小说-影视原著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "Chapter 15 除夕", "x": "刘十三向着桃花树举起手掌：“我会好好地吃饭，睡觉，活下去，活得越来越好，好到不得了。”", "y": "", "d": "2020-05-02"}, {"k": "h", "c": "Chapter 16 我爱你", "x": "为别人活着，也要为自己活着。希望和悲伤，都是一缕光。总有一天，我们会再相遇。", "y": "", "d": "2020-05-02"}]}, {"id": "914784", "title": "昨夜的咖喱，明日的面包", "author": "木皿泉", "cats": [], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "闷闷闷", "x": "明明很难过，人却仍然能够体会到幸福，明白这一点之后，对于彻子来说，很多事情都变得可以接受了。", "y": "", "d": "2018-03-21"}, {"k": "h", "c": "福地", "x": "阿宝心想，现在啊，我就是拉链的拉头。这条严严实实关起来的路，正等着我来把它打开。这么一想，阿宝莫名地感到开心，等她回过神来，已经发自内心地笑了出来。", "y": "", "d": "2018-03-21"}]}, {"id": "25803781", "title": "在轮下", "author": "[德]赫尔曼·黑塞", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "引言", "x": "世界上任何书籍都不能带给你好运，但它们能让你悄悄成为你自己。", "y": "", "d": "2025-04-12"}]}, {"id": "40740496", "title": "素食者【2024诺贝尔文学奖得主】", "author": "[韩]韩江", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "4", "x": "不，或许从一开始我就置身于此了，只是现在才醒悟到这一点罢了。", "y": "", "d": "2024-10-11"}]}, {"id": "39961799", "title": "这么多年（全3册）", "author": "八月长安", "cats": ["精品小说-青春文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "楔子 路过蜻蜓", "x": "曾经避之唯恐不及的母亲和弟弟现在却时常给自己打电话，亲昵而自然。过去的种种都被时间泡得褪了色，血缘这种甩不掉的牵连，在见夏越走越快的今天反而显示了它真正的威力。只有他们还在她身边。", "y": "", "d": "2024-09-10"}]}, {"id": "33890216", "title": "人生复本（同名美剧原著）", "author": "布莱克·克劳奇", "cats": ["文学-外国文学", "精品小说-科幻小说", "精品小说-影视原著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第1章", "x": "我只觉得自己年纪越大，懂得越少。", "y": "", "d": "2024-08-02"}]}, {"id": "44346149", "title": "在工作中，看到中国", "author": "网易人间", "cats": ["精品小说-纪实小说", "文学-纪实文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "序 我们工作，然后活着", "x": "是一个工作在不断侵蚀、挤压生活的时代，工作有时就像一个莫比乌斯环，人置身事外，又身处其中，工作和生活的边界似乎越发模糊，天枰两端似乎再难维持平衡。", "y": "", "d": "2024-02-11"}]}, {"id": "3300053214", "title": "雪国", "author": "川端康成", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "雪国", "x": "镜子的衬底，是流动着的黄昏景色，就是说，镜面的映像同镜底的景物，恰似电影上的叠印一般，不断地变换。出场人物与背景之间毫无关联。人物是透明的幻影，背景则是朦胧逝去的日暮野景，两者融合在一起，构成一幅不似人间的象征世界。尤其是姑娘的脸庞上，叠现出寒山灯火的一刹那间，真是美得无可形容，岛村的心灵都为之震颤。", "y": "", "d": "2023-12-16"}]}, {"id": "39940842", "title": "狮子之家的点心日（同名日剧原著）", "author": "小川糸", "cats": ["精品小说-治愈小说", "文学-外国文学", "精品小说-影视原著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第一章", "x": "所谓幸福，或许指的便是明明置身幸福却对幸福恍若不觉，就这样在琐碎无害的牢骚中度过平凡的每一天。", "y": "", "d": "2021-08-09"}]}, {"id": "858485", "title": "外婆的道歉信", "author": "弗雷德里克·巴克曼", "cats": ["精品小说-治愈小说", "文学-外国文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "1 烟草", "x": "外婆耸了耸肩。“如果你摆脱不了坏事，就必须用更多‘好料’去盖过它。”", "y": "", "d": "2021-01-24"}]}, {"id": "26346556", "title": "82年生的金智英", "author": "赵南柱", "cats": ["精品小说-女性小说", "精品小说-影视原著", "文学-经典作品"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第6章 二〇一二年～二〇一五年", "x": "智英，我觉得你不要只想着自己会失去什么，要多想想你会得到什么。成为父母是多么令人感动又有意义的事情啊！而且就算遇到最糟的情况，实在找不到可以托管婴儿的地方，导致你不得不离职，也别担心，我会负责养你们的，不会让你出去辛苦赚钱。”“所以你失去了什么？”“啊？”“你不是说叫我不要老是只想着失去吗？我现在很可能会因为生了孩子而失去青春、健康、工作，以及同事、朋友等社会人脉，还有我的人生规划、未来梦想等种种，所以才会一直只看见自己失去的东西，但是你呢？你会失去什么？”“我……我也一定不会像现在这样自由啊，可能每天都要早回家，所以不能见朋友，在公司加班或者参加同事聚餐可能也会有些不自在，工作完回来还要帮你做家务，肯定会比现在更累。然后呢，身为一家之主的我，嗯……抚养！对，还要抚养你们，所以压力也会非常大。”", "y": "", "d": "2020-01-06"}]}, {"id": "823444", "title": "一个人的朝圣（套装全2册）", "author": "蕾秋·乔伊斯", "cats": ["精品小说-治愈小说", "文学-外国文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第5章 哈罗德、酒保与没有孩子的女人", "x": "“我以前认识一个女孩，非常可爱的一个女孩，住在汤布里其。我亲过的第一个女孩，还有一些其他第一次，你懂的。那女孩会为我做任何事情，但我当时就是不明白，净忙着出人头地去了。一直到好多年以后，收到她的喜帖，才反应过来那个娶到她的家伙有多幸运。”", "y": "", "d": "2019-04-23"}]}, {"id": "236487", "title": "最好的我们（刘昊然、谭松韵主演）", "author": "八月长安", "cats": ["精品小说-影视原著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "别有用心", "x": "我一直很讨厌十一月。北方冬季沉闷而灰暗，十一月尤甚，一个节假日都没有，好像过不到尽头。", "y": "", "d": "2018-11-16"}]}, {"id": "627148", "title": "格林童话精选大全", "author": "[德]格林著 雅瑟编译", "cats": ["童书-儿童文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "青蛙王子", "x": "我哭得很伤心，青蛙就替我把金球捞了上来。可是，青蛙请求我做它的朋友，我做不到，只好跑了回来。可我压根儿没有想到，它会从水潭里爬出来，爬了这么远的路来找我。\n正说着话的当儿，青蛙又在敲门了，接着大嗓门儿叫道：\n“小公主啊我的爱，\n快点把门来打开！\n爱你的人已到来，\n快点把门来打开！\n昨天椴树水潭边，\n潭水深深球不见，\n你亲口许下了诺言。”\n国王听了之后，对小公主说，“你决不能言而无信，快去开门让他进来。”", "y": "", "d": "2018-08-10"}]}, {"id": "847792", "title": "亲爱的生活", "author": "艾丽丝·门罗", "cats": ["精品小说-女性小说", "文学-外国文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "漂流到日本", "x": "他们去看电影时，他从来都不愿在散场后多谈。他会说不错，或者很好，或者还行。他认为多说没有意义。", "y": "", "d": "2018-02-26"}]}]}, {"key": "03_女性人物与传记历史", "name": "女性人物与传记历史", "books": [{"id": "23774475", "title": "曾国藩传（张宏杰全新增补版）", "author": "张宏杰", "cats": ["历史-中国古代", "人物传记-历史人物"], "bmCount": 170, "rvCount": 1, "notes": [{"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "这一次是父子俩第六次并肩去考秀才，对曾麟书来说，则是第十七次踏入考场。如果以单程三百五十里计算，曾麟书为了考一个秀才，已经足足走了一万一千九百里路，而曾国藩也走了近五千里。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "这一年，曾麟书已经四十三岁了。老曾家破天荒地，五六百年，终于出了一个秀才！“五六百载，曾无人与于科目秀才之列。至是乃若创获。”￼", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "为什么秀才考得这样艰难，而考举人却如此顺利呢？这是因为曾国藩已经掌握了考试的诀窍，写应试文章越来越得心应手。事实证明，被学台“悬牌批责”，成了他命运的转折点。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "曾国藩再一次进京拼搏，背水一战，终于高中了进士。￼这一年，他二十八虚岁。这个年纪在今天看起来虽然已经不小，但是在当时算得上“早售”。因为明、清两代，进士的平均年龄为三十八岁。就是说，曾国藩比全国中进士者平均年龄小了整整十岁。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "虽然自己比较笨，但是也能走通百分之九十九的人走不通的科举路，可见只要努力，天底下没有什么事是做不成的。曾国藩在后来的生命历程中，越遇到挫折，越能燃起斗志。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "艰难的科举过程还塑造了曾国藩独特的人生哲学，那就是“尚拙”：崇尚笨拙。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "父亲的教学方法非常简单，就是要求他不读懂上一句，不读下一句。不读完这本书，不摸下一本书。不完成一天的学习任务，绝不睡觉。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "作为一个笨人，曾国藩发现下笨功夫有下笨功夫的好处。\n第一，笨拙的人没有智力资本，因此比别人更虚心，更肯付出。第二，笨拙的人从小接受挫折教育多，总是失败，因此“逆商”也就是逆境商数比较高，抗打击能力特别强。第三，笨拙的人不懂取巧，不走捷径，遇到问题只知硬钻过去，因此做事不留死角。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第一章 曾国藩的七次科举之痛", "x": "他做人讲究“拙诚”，人以伪来，我以诚往，不玩心眼。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "大家都以落第为耻，我却以落第后不能保持平常心为耻！\n读了这些，曾国藩悚然一惊。他这才发现和这些圣贤人物比起来，自己的视野多么狭窄，境界多么低劣。和别人一聊天，说出的都是没有什么见识的话，身上的鄙俗之气在冲了人家一个跟头之后再折回来，自己也闻得清清楚楚。\n如何洗刷自己身上的鄙俗之气，成了曾国藩新的焦虑。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "曾国藩性格中第一个毛病，就是静不下来，生活不规律。\n他的第二个毛病是为人傲慢，修养不好。如前所述，曾国藩是同学中唯一的进士，又点了翰林，因此难免觉得自己很了不起。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "志向非常高远，但是怎么做到呢？曾国藩学做圣人的方法很简单，就是“写日记”。\n曾国藩向唐鉴请教如何自我管理。唐鉴告诉他，最关键的是每天都写日记。这是入圣之基。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "从十月二日起，曾国藩给自己规定了以下基本学习日程：每日楷书写日记，每日读史十页，每日记《茶余偶谈》一则。这是必须完成的课程下限，除此之外，他还每日读《易》，练习作文。通过写日记的方式，曾国藩提高了学习效率。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "动不动就随口夸人，这正是孔子所说的“巧令”，是小人行径。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "评论人、夸奖人要慎重，这样人家才会拿自己的话当回事。“我诚能言必忠信，不欺人，不妄语，积久人自知之。不赞，人亦不怪。苟有试而誉人，人且引以为重。若日日誉人，人必不重我言矣！欺人自欺，灭忠信，丧廉耻，皆在于此，切戒切戒！”￼", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "曾国藩道光二十二年(1842)十月一日以后的日记，跟今人写微博很像。我们知道，一则微博是一百四十个字，曾国藩的日记也不长，一天大概也是一二百字，而且关键是写完之后，他会按倭仁的建议，送给朋友们传阅。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "戒烟过程给了他很大的启发，他领悟到，破除旧习，必须有悍然之力。“遏欲之难，类如此矣！不挟破釜沉舟之势，讵有济哉！”如果没有一点“截断众流”的悍然，一个人不可能走得实、走得远。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第二章 为什么要“学做圣人”", "x": "我们看曾国藩的日记，可以很清楚地看到，他这一生，就是不断自我磨砺的一生。从青年到老年，曾国藩都生活在不停地自省中，每天都在日记中不断反省自己的缺点，纠正自己的行为。从生到死，他都生活在“如履薄冰，如临深渊，战战兢兢”之中。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第三章 惊人的进阶之道", "x": "1)敬。整齐严肃，无时不慎。无事时心在腔子里，应事时专一不杂。清明在躬，如日之升。\n(2)静坐。每日不拘何时，静坐四刻，体验来复之仁心。正位凝命，如鼎之镇。\n(3)早起。黎明即起，醒后勿沾恋。\n(4)读书不二。一书未完，不看他书。东翻西阅，徒徇外为人。\n(5)读史。丙申年购《廿三史》，大人曰：“尔借钱买书，吾不惜极力为尔弥缝，尔能圈点一遍，则不负我矣。”嗣后每日圈点十叶，间断不孝。\n(6)谨言。刻刻留心，第一工夫。\n(7)养气。气藏丹田，无不可对人言之事。\n(8)保身。十月二十二日奉大人手谕曰：“节劳，节欲，节饮食。”时时当作养病。\n(9)日知所亡。每日读书记录心得语，有求深意是徇人。\n(10)月无忘所能。每月作诗文数首，以验积理之多寡，养气之盛否。不可一味耽着，最易溺心丧志。\n(11)作字。饭后作字半小时。凡笔墨应酬，当作自己功课。凡事不留待明日，愈积愈难清。\n(12)夜不出门。旷功疲神，切戒切戒。￼", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "但是，做了一段时间高级官员，曾国藩就不再那么兴奋了。我们看他在北京当官后几年的诗文可知，他的心情是灰色的。\n比如这一首：\n我虽置身霄汉上，器小仅济瓶与罍。\n…………\n似驴非驴马非马，自憎形影良可咍。￼\n这是写给好友刘蓉的。意思是说，别看我现在身居庙堂之高，其实只是庙堂之上一个没用的小摆设。天天这样不上不下、非驴非马地混日子，只觉得自己面目可憎而已。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "这是写给弟弟们的。意思是说，我现在做这么一个小官，每天的工作如同支床石一样，疲倦麻木。我天天想念家乡，如同离了娘的小孩。愁闷极了，不如干脆找几瓶好酒，喝得大醉，什么都不知道好了。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "道光年间从外部看，鸦片战争让中华帝国臣民的自尊心和自信心受到了颠覆性的打击。从内部看，腐败已经渗透了帝国机体的每一个细胞，四肢五脏，无不腐烂，一场翻天覆地的大起义——太平天国起义正在酝酿之中。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "关于咸丰，读史者最熟悉的一个故事，当然是他和奕䜣争储时的那个传说。说是奕詝和奕䜣只差一岁，奕詝居长，但是天资平庸，奕䜣虽居次，但明敏能干。所以选谁为继承人，道光犯了难。于是道光就通知他们到南苑骑射，进一步考查他们。奕詝的老师杜受田知道这是一个关键的时刻，就给自己的弟子出主意，说你奕詝骑射本领远不如弟弟，我们只能另辟蹊径。于是打猎时，奕詝按照他老师的教导，既不上马，也不射箭，见他父亲的时候两手空空。道光很纳闷，问，你怎么回事？奕詝就跪到地下，他说父皇教导我要仁爱，现在是春天了，母兽正是怀孕的时候，我要是把它射死了，连它的没有出生的孩子也都死了，岂不是太残忍了？道光一听，感觉这个孩子挺仁慈，对他很满意。这个故事叫“藏拙示仁”，此事不光见于野史，也载于《清史稿·杜受田传》。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "道光说，让你谈谈见解，你怎么什么都不说呢？奕詝就说，我一看父亲病成这样，我就太难受了，什么话也说不出来。我现在就希望父亲健康长寿，别的我什么都不想。道光很感动，认为还是这个孩子孝顺，于是决定传位给他。其实奕詝如此表现，是因为他老师告诉他，论口才你比不上六阿哥，你要“藏拙示孝”。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "而咸丰皇帝不同于一般皇帝。他是一个特别自卑，因而也特别敏感的人。他之所以自卑，一方面是因为智力平庸，能力平常。有那么一个聪明能干的弟弟奕䜣衬托着，什么事都比弟弟差着一截，从小感觉自不如人。另一方面是因为咸丰身体还有残疾。史载：“文宗体弱，骑术亦娴，为皇子时，从猎南苑，驰逐群兽之际，坠马伤股。经上驷院正骨医治之，故终身行路不甚便。”￼就是说有一次他出去打猎，笨手笨脚，从马上掉了下来，把腿摔折了。后来虽然大夫给接上了，但接得不好，终生走路不便，一瘸一拐，成了一个瘸子，所以这更加重了他的自卑心理。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "自卑的人，最在乎的是你看不看得起我。上台之后，他之所以那么细致地挑剔大臣的礼仪，正是这种自卑的表现。在后来发生的第二次鸦片战争中，他那么执着于中外礼仪之争，也掺杂着同样的原因。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "木秀于林，风必摧之，锋芒毕露，人必非之。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第四章 从前的官场愣头青", "x": "为什么在大清王朝做到“副部长”，却连回家的钱都没有？\n主要原因就是清朝的低薪制。", "y": "", "d": "2024-01-24"}, {"k": "h", "c": "第五章 “曾剃头”的长沙之辱", "x": "他还命人制作了一批木笼，放在车上，那些罪不至死的地痞流氓，抓获之后，枷入木笼游街。游罢了也不取出，还是关在里面，直到站死、饿死为止。\n曾国藩从此成了“曾剃头”。他的铁腕和残忍令人吃惊。儒家本教人以“好生之仁”，曾国藩为什么一出山就杀人如麻呢？", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第五章 “曾剃头”的长沙之辱", "x": "晚清官场最重要的潜规则是“官官相护”。常在河边走，谁能不湿鞋？只有彼此掩盖，才能最大限度地保证大家的安全。动辄咬人，足以令人人自危。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第五章 “曾剃头”的长沙之辱", "x": "这是曾国藩出生以来，第一次遭遇真正的挫折。进秀才的艰难，画稿遭人嘲笑的尴尬，比起这次挫辱来，完全不在同一个档次。堂堂“副部级”官员，差点让闹事的兵痞杀了，还没处讲理。这种难堪在整个大清朝的历史上也不多见。我们可以想象曾国藩是如何心血上冲，夜不能寐的。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第五章 “曾剃头”的长沙之辱", "x": "经过几夜不眠的反思，曾国藩做出了一个出人意料的决定：“好汉打脱牙和血吞。”这是一句湖南土话，好汉被人家打掉了牙，不要吐出来让别人看到，要咽到肚子里，继续战斗。他不再和长沙官场纠缠争辩，而是卷起铺盖，带着自己募来的湘军，前往僻静的衡阳。全省官员瞧不起我，我不争一日之短长。等到我在衡阳练成一支劲旅，打几个胜仗给你们看看，那时自会分出高下。这才是挽回面子的最好办法！", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "咸丰三年(1853)八月，曾国藩带着受伤的自尊心到达衡阳，开始赤手空拳创立湘军。湘军的出现，是曾国藩人生的一件大事，也是中国近代史上的一件大事。因为它不光改变了曾国藩个人命运的走向，也改变了整个国家的走向。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩在出山之初，就暗暗计划，要以训练团练为伪装，创建一支属于自己的军队，凭着这支军队挽救朝廷，再造国家。这是非常危险的事情，是整个大清王朝其他人想都不敢想的事情。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "太平天国起义，与中国历史上所有起义都非常不同。它不仅是清王朝的敌人，也是整个传统文化的敌人。也就是说，如果太平天国建立了大一统王朝，则天下人不光要接受改姓易帜的变化，同时也要接受与中国传统文化完全不同的异质文化的统治。与曾国藩的屡败屡战不同，考秀才四次失利后，洪秀全就放弃了科举生涯，凭着一本传教士发给他的小册子，和自己发高烧时一个离奇的梦，创建了“拜上帝会”，然后到广西劝人敬拜上帝，劝人修善。道光三十年(1850)年底，正当广西各教门纷纷聚众之际，洪秀全也在金田率领自己的教徒宣布起义。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "中国历代农民起义，都是以本土宗教或思想为精神动力，但是拜上帝教的源头却是西方的基督教（虽然经过了洪秀全的创造性发挥）。历代农民起义从来没有有计划地消灭中国文化，但是为了统一思想，洪秀全却宣称中国传统文化均为“妖”书“妖”术，要焚毁所有中国经典，扫灭所有中国传统信仰。所以太平军所到之处，必焚毁孔庙、毁掉神像、拆改庵院，“神佛像非毁坏，即搬去”[插图]。遇到名寺古刹、书院，或者焚毁一空，或者改作兵营、仓库、屠场。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "秦始皇焚书坑儒之后，没有比洪秀全更厉害的文化毁灭者。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩是理学家，在他眼中，儒学是天地间唯一的真理。因此，在曾国藩看来，如果太平天国起义成功，中国将陷入巨大的蒙昧。这是他决定挺身抵抗的根本原因。他在《讨粤匪檄》中说，太平天国不仅是大清这个王朝的敌人，也是中国这个文化体的敌人。“举中国数千年礼义人伦、诗书典则，一旦扫地荡尽。此岂独我大清之奇变，乃开辟以来名教之奇变，我孔子、孟子之所痛哭于九原。”中国几千年来的文化积累，面临全部毁灭的危险。这不只是大清王朝的危机，更是整个中国文化的危机。孔子、孟子知道了，也会在地下痛哭失声。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩不是不知道这件事的风险。曾国藩为人处事表面上看起来保守，但是在根本问题上，却又有着他人所没有的巨大勇气。为了挽救朝廷，更是为了挽救他所珍视的文化传统，他决定放手一搏。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "然而对于一支建设中的军队来说，钱太重要了。钱就是空气，钱就是生命，钱就是润滑剂。没有钱，大至招兵买马，采购武器，小至办公经费，日常吃喝拉撒，哪一步也走不动。曾国藩说“筹饷更难于督兵”，“大抵军政、吏治，非财用充足，竟无下手之处”[插图]。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "可以说，如果没有长沙之辱的刺激，曾国藩不可能克服这五难，开创湘军。长沙之辱如同一根针扎在心里，让他时刻难以自安，终于苦苦支撑，惨淡经营，斩关夺隘，排除万难。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "既然无人会造，曾国藩就自己设计。湖南湖北赛龙舟风气很盛，于是他命人以龙舟为制，造了一批“曾氏战船”。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾氏大雇衡州、永州的能工巧匠，在湘潭设立两个船厂，大量制造快蟹、长龙、舢板战船。“两厂之船，往来比较，互相质证。”[插图]两位军官本身并非工匠，他们只介绍了外地舰船的大体模样，至于船的具体结构尺寸，乃至每一个部件，曾国藩都要和有经验的工匠反复设计，不断试验。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩花费重金，从广东购置大批洋炮，经过反复研试，终于将洋炮安装在战船上，建成了当时中国技术先进、装备精良的内河水师。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "史载曾国藩“创建舟师，凡枪炮刀锚之模式，帆樯桨橹之位置，无不躬自演试，殚竭思力，不惮再三更制以极其精”[插图]。字字不虚。曾国藩身上有着突出的试验精神和开放态度，凡事总愿意亲身经历，亲自体验，勇于尝试，勤于尝试。做事讲究身到、心到、口到、眼到，特别强调要“苦下身段去事上体察一番”[插图]。经过反复试验，终于建成十营水师。曾国藩建军，确实筚路蓝缕。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩咸丰三年(1853)年初开始创办湘军，咸丰四年(1854)年初出师。在这一年多的时间里，除了要逐一解决用人、筹饷、购械、整章、建制等难题之外，还面对着一个更巨大的难题：那就是咸丰皇帝的瞎指挥。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩没有办法，只好以“拖”字诀来解决。于是他精心上了一道奏折，说我积极准备出兵，现在正在筹集饷银和购买洋炮，等大炮安上，军饷到手，就马上出发。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "咸丰三年(1853)十一月，江忠源被太平军围困在庐州，弹尽粮绝，情况万分危急。江忠源亲自写信向曾国藩求救，咸丰皇帝也再一次命曾国藩迅速出兵。曾国藩仍然不为所动。他在十一月二十六日，给皇帝上了封奏折，说明自己为什么不动身。他说，我现在兵练得还不熟，特别是船只没有造齐，大炮没有装完，水勇没有招够，“统计船、炮、水勇三者，皆非一月所能办就”，必须等待从广东购买的西洋大炮全部解到湖南，“明春乃可成行”。“事势所在，关系甚重，有不能草草一出者。”[插图]", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "现在安徽这么紧急，你再固执己见，拒不出兵，那么肯定来不及了。我以为你还算有良心，所以让你出兵，救救燃眉之急。没想到你在奏折里，替我统筹起几省的军务来了。我问你，你的才力，能统筹得了几省的兵力吗？平时你就能吹牛，觉得谁也不如你，把别的官员骂得够呛。怎么现在真有事，你又不敢出兵了？你别说别的，早点儿出兵，早一天就能早顶点儿事。你的兵虽然少，但多少总能发挥点作用。你和我吹过那么多牛，关键时刻，你快点儿给我办出成效来！字字怒火，字字刻薄。当年被曾国藩在《敬陈圣德三端预防流弊疏》中批评时所受到的委屈怨恨喷薄而出。从这种讥讽的口吻中我们可以发现，在咸丰皇帝看来，曾国藩不过是一个好高骛远、纸上谈兵的书生。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "奉到如此严苛之旨，曾国藩毫不害怕，他于十二月二十一日上了一封表面上诚恳、实则强硬非常的回奏。他说：微臣有数条，不得不逐条陈明：", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "最后一条，则是对咸丰表明自己的心迹。曾国藩说，我当初本在家守孝，是你硬让我出山。我出来带兵，本来就没有经验，处处都是困难，所以不得不再三准备。如果你现在非逼着我草率出兵，我肯定会失败。与其失败之后，你治我“大言欺君”之罪，不如我现在受你治我“畏葸不前”之罪。我一个文臣为国练兵，不能在家守孝，已经受到士林的讥讽，现在又以大言欺世，受到全天下的嘲笑，我又有什么面目自立于人世。深夜焦思，只有痛哭。千言万语，就是现在不能出兵，你想怎么处分我，随便吧。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "省城里说什么的都有。有的写信来祝贺我出发，有的写信来责备我迟缓。我都付之一笑。我对个人得失没什么想法，怕的是如果不好好准备，轻率出动，失败之后，整个天下就没有人敢于继续尝试镇压太平天国了。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "江为挚友，吴为恩师，但曾国藩忍心按兵不动，致使江、吴先后兵败自杀，作为省会的庐州、武昌也迭遭沦陷。此时的曾国藩承受的心理压力可想而知。但从战略上看，曾国藩这两次抗疏拒旨，则为造船、购炮与练兵赢得了时间，使湘军免遭轻进覆灭之灾，为日后彻底战胜太平天国积蓄了基本力量。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩后来说，如果他有时间，就会写一本“挺”经，所谓“挺”，就是指在危急时刻，能坚持住。对于这样的“挺”字精神，曾国藩称之为“竖起骨头，竭力撑持”。后来他专作了一副联语，作为“挺”字的注脚：“养活一团春意思，撑起两根穷骨头。”[插图]重重困难之中，曾国藩不止一次想打退堂鼓，但一想起长沙之辱，他便又鼓起了全部斗志。他要让那些当初逼他出走衡阳的湖南官员看一看，到底谁能笑到最后。经过一年时间，曾国藩初步练成了一支一万七千余人的湘军。", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "曾国藩打掉牙和血吞，终于取得了胜利。他用自己的艰苦奋斗，成功地挽回了面子。可以说，没有长沙之辱，就没有曾国藩后半生的功名事业。这一次挫而后奋的成功，给了曾国藩另一次印象极深的自我教育，更强化了他愈挫愈奋、百折不挠的性格特点。多少年后，曾国藩对他的心腹幕僚赵烈文深有感慨地说，天下事有所激有所逼而成者居多。“起兵亦有激而成。初得旨为团练大臣，借居抚署，欲诛梗令数卒，全军鼓噪，入署几为所戕，因是发愤募勇万人，浸以成军，其时亦好胜而已。不意遂至今日。”[插图]", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第六章 湘军为什么牛气", "x": "从这次经验中，曾国藩更是领悟到，对于有志者来说，挫辱是最大的动力，打击是最好的帮助。咬紧牙关，把挫辱活生生吞下，就成了滋养自己意志和决心的营养。这构成了曾国藩生命经验中最核心的部分。几十年后，他还在家书中教育儿子说：“天下事无所为而成者极少，有所贪有所利而成者居其半，有所激有所逼而成者居其半。”[插图]“百端拂逆之时……亦只有逆来顺受之法。”[插图]“所谓‘好汉打脱牙和血吞’……真处逆境之良法也。”[插图]", "y": "", "d": "2024-01-25"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "原本自诩硬汉的他这回有点挺不住了，举动大异常态，整日生闷气，“心殊忧郁”，动不动就骂人。他数着江西的一帮文武骂，骂够了就找几个弟弟的碴儿吆喝，一年当中和曾国荃、曾国华、曾国葆都发生过口角。弟弟们走了后，他又开始骂几个弟媳妇。语言粗俗，蛮不讲理，理学家的风度荡然无存。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "善始者不必善终，行百里者半九十里。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "在极端痛苦中，他拿起了朋友向他推荐的老庄著作。几千年前的圣人之言给了他意想不到的启示，让他恍然见到了另一片天地。他像一个闭关的和尚一样把自己关在屋子里，一坐就是一整天，把自己起兵以来的种种情形在大脑中一遍遍地过。渐渐地，曾国藩静下心来了。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "曾国藩反思到，自己在官场上一再碰壁，碰得鼻青脸肿，不光是皇帝小心眼，大臣多私心，自己的个性、脾气、气质、风格上的诸多缺陷，也是重要原因。回想自己以前为人处世，总是怀着强烈的道德优越感，自以为居心正大，人浊我清，因此高己卑人，锋芒毕露，说话太冲，办事太直，当然容易引起他人的反感。他翻阅旧日信稿，发现了当日武昌告急时，他请求骆秉章发兵援救的一封信。写这封信时，他觉得字字有理有据，今天读来，却发现字字如锥如芒。信中称湖南湖北“唇齿利害之间，此不待智者而知也”￼，不仅没有一点儿商量的口气，还略带嘲讽之意。为了防止骆秉章干预他募练水师，他又在信中早早地表明态度：“其水路筹备一端，则听侍（曾自称）在此兴办，老前辈不必分虑及之。断不可又派员别为措置。”￼仍是一副舍我其谁、比谁都高明的架势。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "行有不得，反求诸己”", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "我之所以愿意为你服务，是因为我认为你是天下奇士，没有人能和你相比。为什么这样说呢？天下只有平实朴素坚定的人能成事，特别是军务。你虽然品级很高，但是没有官僚习气，做什么事都是亲自动手，如同大禹治水那样不畏难苦，所以才能练成湘军。成语说道在屎溺，这对湘军来说居然不是比喻而是实指，也就是说湘军行军时所修的厕所，也有明确的尺寸标准。这是那些只会高谈阔论的人无法想象的。你同时又能做到谦虚谨慎、和蔼可亲，经常向别人请教，愿意让别人给你提意见。这些都是你的优点。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "曾国藩阅读好友来信，反复回忆既往，越来越清楚地看到了自身的致命弱点：太自傲、太急切、一味蛮干、一味刚强。\n曾国藩终于认识到，行事过于方刚者，表面上似乎是强者，实际上却是弱者。这片土地上真正的强者，是表面上看起来柔弱退让之人。所谓“天下之至柔，驰骋天下之至坚”，“江海所以能为百谷王者，以其善下之”。所谓“大柔非柔，至刚无刚”。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "那些他以前所看不起的虚伪、麻木、圆滑、机诈，是在这片土地上生存的必需手段。只有必要时和光同尘，圆滑柔软，才能顺利通过一个个困难的隘口。只有海纳百川，兼收并蓄，才能调动各方面的力量，到达胜利的彼岸。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "指出自己为人处世的四大缺点：偏激，好名，也就是过于重视获得好名声；喜欢公开批评、谈论别人的过恶；做事有始无终；待人接物过于怠慢。\n那么怎么做呢？也是四条：做事平心静气，更多地考虑他人的心理，站在他人立场想问题；更多地揄扬他人，表扬他人的长处；做事有始有终，越到后来越慎重；接人待物要更诚更敬。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "这样的人，才算得上是曾国藩的知音。曾国藩在家期间，胡林翼多次想办法让咸丰重新起用曾国藩。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "咸丰哪里知道，曾国藩在家里，日思夜想，就等着出山的一声召唤。大喜过望的曾国藩不再提任何条件，立刻出山。\n这次出山，曾国藩的朋友们惊讶地发现，曾国藩变了，变得他们几乎不认识了。\n第一，他变得和气、谦虚、周到了。\n以前他做事直来直去，不太讲求虚文俗套。现在则和那些庸官俗吏一样注意礼仪排场。他在给曾国荃的信中说，与人相处，不能过于拙直：“余生平不讲文饰，到处行不动，近来大悟前非。”￼在官场生存，必须习惯官场上虚与委蛇的那一套：“与官员及绅士交际，则心虽有等差而外之仪文不可不稍隆，余之所以不获于官场者，此也。”￼", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "此前，他对人总是持有一种“众人皆醉我独醒”的心态。现在，他努力包容那些丑陋的官场生存者，设身处地地体谅他们的难处，交往时极尽拉拢抚慰之能事，必要时“啖之以厚利”。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "以前曾国藩是斑马群中的野马，自然引起斑马们的群起攻击。现在他也涂上了斑纹，以便让斑马们误认为他是他们的同类。然而这番变化太过迅速，甚至引起了好友们的误解。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "第二，他对皇帝，不再那么直言不讳，而是学会了打太极拳。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第八章 江西困境与“大悔大悟”", "x": "曾国藩原“以忠诚为天下倡”，以为仅凭忠义相激，就可以让部下出生入死，但阅历既久，才发现真正的抱道之士并不如他想象中那样多。他认识到“不妄保举，不乱用钱”，则“人心不附”，只有诱之以“名”，笼之以“利”，才能网罗天下英才。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "胡林翼的性格特点是明敏、坚毅、精于权术。此时他已经以极为高明的手腕，笼络住了湖广总督官文。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "其实曾国藩一生做事，都没有什么特殊的地方，就是做得扎实，做得牢靠。这种作战方式，也是曾国藩独特的人生哲学和思维方式的体现。曾国藩打仗的第一秘诀是“稳”，先立于不败之地。军事首重“自固”，就是先要保存自我，然后才能谈到争取胜利。因为军事不比别的事情，不容许你犯错误，一犯错误，可能生命就没了，没有改正的机会。所以他才要扎硬寨，保证军队先生存下来。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "那么怎么变客为主呢？湘军的攻城法就是变客为主。每攻一座城市，先发挥湘军“民工建筑队”的特长，在城外挖两道长壕，把城围困起来，里面的一道长壕，是为了断绝城中的粮草接济，防止城里人突围。外面的一道长壕，是为了抵抗外来敌方援军的攻击。这样湘军在城墙下有了自己的营盘，就成了主。被围在城里的军队就心慌了，为了不饿死，就不得不主动突围，来到沟边攻打湘军，而不是站在城头上等湘军，太平军就从主成了客。曾国荃拿下吉安，胡林翼拿下九江，都是运用的这个战法。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "有人比较曾国藩和胡林翼，认为曾国藩不如胡林翼“忠纯”。确实，在胡林翼的心中，国重于家。他一生立身行事很少虑及家族和亲人，为朝廷做到了鞠躬尽瘁，死而后已。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "相比之下，曾国藩的“杂念”要多很多。曾国藩一生有两个核心焦虑：一个是自己能不能成为圣贤，挽救国家；另一个是曾氏家族能不能光大和永久。在曾国藩心目中，家族的分量，不亚于朝廷的兴亡。曾国藩在家书中不停地在讨论自己家族的兴衰，“我家气运太盛，不可不格外小心，以为持盈保泰之道”[插图]。他自己的进退考虑，很多时候都是和对家族命运的考虑联系在一起的。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "胡林翼是独生子，又膝下无儿，领兵之时父亲也已经去世，没有太多的直系亲属可以挂念；而曾国藩兄弟五人，姊妹四人，上有父母，下有二子。儒家的理念是家大于国，孝高于忠。一个人，可以为父绝君，却不能为君绝父。因此，曾国藩必须家国兼顾。在为国家鞠躬尽瘁的同时，他对家庭、对家族也投入了大量的时间和精力。这些努力的印迹，就是今天的《曾国藩家书》。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "湘军围城用的是挖沟法，而曾国荃最善于挖沟围城，围得严严实实，滴水不漏，甚至因此得了一个著名的外号“曾铁桶”。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "应该说，安庆之战中的大部分险战、恶战，都是多隆阿打的。在多隆阿的掩护下，曾国荃部把安庆围得越来越紧，进展顺利，安庆一步步陷入绝境之中。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "至此，反曾国藩的势力几乎全部失势。咸丰皇帝也不得不承认自己的战略构想的错误，不得不把全部希望放在湘军身上。何桂清弃城逃走，两江总督的位置空了出来。这个位置顺理成章应该落到正在两江领兵作战的湘军第一号人物曾国藩头上。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "咸丰左思右想，终于把这个职位给了湘军的头号人物曾国藩。咸丰十年(1860)四月二十一日，咸丰帝下令赏曾国藩加兵部尚书衔，署理两江总督。六月二十四日实授。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "也就是说，湘军用大炮轰击太平军密集冲锋队伍，每一炮都会轰倒一片士兵，轰出一片血泊。但是太平军毫不畏死，仍然持续突进。湘军八百杆抬枪、鸟枪片刻不停，太平军一片片倒在阵前，以致后面的军队无法进攻。所以太平军专门派人抬开死尸，清出道路，继续进攻。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "咸丰十一年(1861)八月初一日，湘军挖成了一道通到安庆城下的地道，用火药轰塌数十丈城墙，像决堤的洪水般涌入城内。安庆城中的守兵已经多日没吃到任何东西，“饥极僵仆”，一万余人皆被杀死，安庆城陷。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "安庆的战功，多隆阿与曾国荃贡献最多，多隆阿某种程度上作用更大。曾国荃通过这一战也对多隆阿非常佩服。咸丰十一年(1861)九月，他在给曾国藩的信中说：“多公才智胆略冠绝群雄，实可将四五万人。”但是在战后论功行赏之时，正如曾国藩所预计的那样，曾国荃所获却是更多，“道员曾国荃智勇兼施，着赏加布政使衔，以按察使记名遇缺题奏，并加恩赏穿黄马褂，以示优奖”[插图]。不久又实授为江苏布政使。而多隆阿仅与杨载福等“均着加恩赏给云骑尉世职”[插图]。这个奖赏连曾国藩都感觉太薄了。他在家书中说：“安庆克城，人人优奖，惟多公尚嫌其薄。”", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "多隆阿自然非常生气，安庆之战结束后就和曾氏兄弟生了嫌隙，不久之后他离曾国藩而去。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "结果，就在奏折送走后没几天，八月十日，曾国藩接奉咨文，“惊闻……文宗显皇帝龙驭上宾”[插图]。咸丰皇帝死了，生前根本没有看到这个捷报。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "原来，第二次鸦片战争爆发后，咸丰仓皇逃到承德。不久，战争以中国与列强签订《北京条约》的方式结束。条约签订之后，按理他应该回到北京。但是他待在热河，迟迟不归。因为他喜欢上了行宫的生活。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "曾国藩说：“思我大行皇帝即位至今，十有二年，无日不在忧危之中。”[插图]确实如此。咸丰刚当上皇帝，广西就发生了起义。他无日不派兵，无日不努力，结果局势越来越乱。就在太平天国越来越乱的时候，北方又有捻军起事，活跃于淮河南北，兵力超过十万。东南沿海又有天地会起事，福建、上海、两广到处都有起义者。此外，贵州、云南、四川也是小股起义遍地。关内十八省，已经有十四省战火熊熊。内乱正盛，外夷交并。就在江南大营崩溃的同时，第二次鸦片战争爆发，英法联军纵火焚烧了万园之园圆明园。中国割地赔款，丢失了150多万平方公里的土地。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "咸丰经受不了这样密集的打击，已经接近崩溃。做了十年的皇帝，挑了十年的重担，他终于得出了一个结论：自己不适合当这个皇帝，什么事情，他越是投入指挥，结果就越是不可收拾。如今远离了政务中心北京，来到了边远的热河，这一地理位置的变化使得他顿感轻松。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "当日午后，咸丰帝突然晕厥，醒来后安排后事，命八大臣辅政。第二天凌晨气绝升天。一直到死，咸丰都不知道安庆克复的消息，更不知道平定太平天国起义终于大局已定。回首咸丰这一生，实在是太悲催了。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "八月二十六日，胡林翼走到了生命的终点，时年五十岁。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第九章 安庆这块难啃的骨头", "x": "曾、胡二人，可谓相互理解、相互支持、相互砥砺、相互敬佩的人际交往的典范。胡林翼终生对曾国藩尊重有加，尝谓人曰：“吾于当世贤者，可谓倾心以事矣。而人终乐从曾公，其至诚出于天性，感人深故也。”[插图]曾国藩则说，胡氏一死，“从此共事之人，无极合心者矣”[插图]！多年之后，位重势隆的曾国藩追忆当年，尚不免感慨万端，说靠胡林翼“事事相顾，彼此一家，始得稍自展布有今日，诚令人念之不忘”[插图]。“胡宫保……忧国之诚，进德之猛，好贤之笃，驭将之厚，察吏之严，理财之精，何美不备？何日不新？天下宁复有逮斯人者耶？”[插图]", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十章 与何桂清的恩怨纠葛", "x": "两江总督是清代光绪朝以前唯一统辖三省的总督：江苏、江西和安徽。三个省为什么叫两江呢？这是因为明代的江苏和安徽是一个省，叫江南省。两江地区正当中国南北之接合部，在军事上十分重要，在经济上更举足轻重。两江所征收的漕粮，占全国漕粮总数的一半以上，因此牵动着全国的财政命脉。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十章 与何桂清的恩怨纠葛", "x": "咸丰八年(1858)再度出山之后，曾国藩在官场上已经修炼得相当老到。他的原则是不轻易得罪人，但是对何桂清不同。一是两个集团积怨甚深，二是如果何桂清复出，与祁氏联为一体，又将成为他强有力的对手。因此他一定要斩草除根，置何桂清于死地。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "何桂清集团被彻底拔除，江苏、安徽、江西、浙江四省巡抚全部成了曾国藩的嫡系。为了让湘军尽快建功，朝廷对曾国藩几乎是言听计从，全国范围内相关的封疆大吏进行调整也以是否能配合湘军作战或筹饷为转移。在两广，总督劳崇光因协饷不力被调离，换成和曾国藩关系很好的晏端书，之后曾国藩的好友郭嵩焘又署理广东巡抚。在四川，原湖南巡抚骆秉章调任四川总督，四川布政使刘蓉则是曾国藩同乡密友，在长江上游为湘军协饷。湖南巡抚毛鸿宾是曾国藩同年、旧交，湖北巡抚胡林翼去世后，继任者严树森是胡林翼一手提拔起来的，也绝对可靠。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "在中路，他的弟弟曾国荃部自安庆沿江直下南京，目标是攻取太平天国的首都。在东路，李鸿章创建淮军，奔赴上海，接任江苏巡抚，准备以上海为根据地，进军苏州、常州，进而收复江苏全省。在南路，新任浙江巡抚左宗棠率领楚军进军浙江，收复杭州。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "然而曾国藩说过一句话，“天下无易境，天下无难境；终身有乐处，终身有忧处”[插图]。大功克成之际，往往烦恼尤多。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "曾国藩和曾国荃两个人的性格大不相同。曾国藩人到中年，屡经挫折，久历风波，老成持重，往往事情一发端，他已经看到了结尾。曾国荃则不过是一个湖南乡下土秀才，从军前除了去过一趟北京，没出过远门，也没办过大事，年纪轻，见识窄，经验不足。曾国藩凡事从风险角度考虑比较多，遇事做加法。而曾国荃总是无知者无畏，把事情看得过于简单，遇事做减法。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "南京城墙不仅是中国第一大城墙，也是世界第一大城墙。当初明太祖修这座城池，前后花了二十一年。它周长九十六里，高度、厚度都是全国其他城墙不能比的：城墙基础宽十四米，最宽处达三十米，高十四至二十一米。基础用巨大的条石砌起，墙体用巨砖筑成，规模极其宏大。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "寸心郁郁不自得。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "忧灼过度", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "闷损不堪", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "这段时间是曾国藩一生最痛苦的时期之一。他白天频繁联系各处，全力保障曾国荃的供应，傍晚到后院的小房间里去，跪在蒲垫上默默对天祷告，求老天保佑弟弟平安。上了床又常常一夜无眠，沈葆桢此举如同扎在他心上的一根刺，每一翻身，都感到钻心的痛。\n内心愤怒纠缠如此，但是曾国藩的外在表现却没有任何失态之处。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "也就是说，这些天因为江西布政使有意和自己作对，心里非常愤懑。但是我细思古人办事，岂不也是我和一样，经常会遇到掣肘和拂逆。如果怒他人之拂逆，必欲使之顺从，就会采取霸道手段，诛除异己。时间长了，就会成为不可一世的权臣，给自己带来祸患。如果在他人的反对面前能够动心忍性，修炼自己的心性，委曲求全，而且还以没有“对立面”而忧心，这才是圣贤的用心。所以我正可以借这个不顺心的事来磨砺我的心性。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "这是曾国藩在遇到困难阻碍时的一贯心态。很多大人物都喜欢其他人如同秋草伏风一样，偃伏在自己脚下，让自己的所有决定都得到“坚决贯彻”，“理解的要执行，不理解的也要执行”。曾国藩却不是这样。他的斋名为求阙，一生勤求己过，最喜欢听别人的批评。越是位高权重，他越是主动听取逆耳之言，以克除自己身上的“意气”“客气”和“矜气”。他曾说：“安得一二好友，胸襟旷达、萧然自得者，与之相处，砭吾之短。”￼他有意识地在身边安排几个耿直高洁之人，时时给自己指出缺点。“身旁须有一胸襟恬淡者，时时伺余之短，以相箴规，不使矜心生于不自觉。”￼在给朋友的信中，也经常请求他们“常惠箴言，并赐危论”￼。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "李鸿章到上海之后不久，借上海地利之便，让淮军从武器到训练都迅速西方化，军队战斗力提高很快，用西洋开花大炮拿下苏州、常州等名城，战功赫赫。\n而左宗棠的战功也一样不凡。左宗棠先后收复了金华、富阳，围困杭州。大致在李鸿章收复苏州的同时，左宗棠也攻占了杭州。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "太国天国兴起，内外交困之下，清廷和地方已经形成了“强枝弱干”的局面。奕䜣和慈禧上台之初，曾将天下资源全力向曾国藩倾斜。而现在，形势已经今非昔比，因为除了南京之外，其他地方都大局已定，拿下南京只是时间问题。朝廷的注意力已经开始从对付太平军转移到对付湘军。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "日内郁郁不自得，愁肠九回", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "如果获胜，则自己手握重权太久，已经导致朝廷和各省怀疑自己擅权贪利，此时更加令各处怀疑自己过于专权霸道。反复思考，只有一个办法，那就是告病请退，回家休息二三年。如果太平天国战争顺利结果，他终老于山林之中，不再复出，那么对公家、对个人都是幸事。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "军饷问题暂时解决，但是曾国荃还是拿不出什么可以迅速攻下南京的办法。曾国荃情绪焦躁，因为常常生气，身体越来越差，“肝病已深”￼，给曾国藩的书信中也常有“词气戆激”。\n曾国藩一封又一封地写信劝慰曾国荃，要求他放宽心胸，不要把得失看得那样重。曾国藩说，天下气运，自有天意做主，像攻下南京城这样重要的历史节点，时间掌握在上天手里，而不是他们兄弟手里。因此，只要尽了人事，就可以心地坦然。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十一章 太平天国最后的战役", "x": "古今亿万年无有穷期，人生其间数十寒暑，仅须臾耳。……事变万端，美名百途，人生才力之所能办者，不过太仓之一粒耳。￼\n时间没有穷尽，人生几十年实在是一瞬即过。天下至大，人力所能为者至小。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "在各方压力下，曾国荃精神几乎达到崩溃的边缘，身体也出现严重症状，他身上大面积长癣，吃不下饭，多日连续失眠。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "是啊，曾国藩有太多理由百感交集了。从咸丰三年(1853)创建湘军到今天，整整十二年了。这十二年里，他失去了曾国华、曾国葆两个亲兄弟，也亲手把数万名湘籍老乡送入鬼门关。自己更是三次自杀，数度濒危，承受了超过普通人耐受极限十倍百倍的艰巨，才换来这一张捷报。\n湘军平定太平天国，到底是功还是过，长久以来众说纷纭。从晚清民国时期的革命党人到今天，很多人认为曾国藩镇压了代表进步力量的太平天国运动，是不可饶恕的罪恶。但是也有一些不同角度的分析和判断。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "洪秀全和太平天国如果统一了中国，那就要使中国倒退几个世纪，这是我对洪秀全和太平天国的评价。这个评价把洪秀全和太平天国贬低了，其自然的结果就是把太平天国的对立面曾国藩抬高了。曾国藩是不是把中国推向前进是可以讨论的，但他确实阻止了中国的倒退。这就是一个贡献。……阻止中国的中世纪化，这是曾国藩的大功。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "沿街死尸十之九皆老者，其幼孩未满二三岁者亦斫戮以为戏，匍匐道上。妇女四十岁以下者，一人俱无，老者无不负伤，或十余刀，数十刀，哀号之声达于四远，其乱如此，可为发指。￼", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "沿街的死尸，十有八九是老年人。连不到两三岁的小孩子，也被湘军砍着玩，死在路上。四十岁以下的妇女都被抢走，四十岁以上的，都被砍伤，身上或中十多刀，或中几十刀，哀号之声响彻街道。残酷如此，令人发指。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "他还说，如果你读一遍二十三史，就会知道，历史上做到我这样功名地位的，能得到好下场的极少。我怕我在高位时，不能给你们带来多少好处，当我倒霉时，反倒会带累你们。所以我们兄弟在太平时应该相互提醒劝诫，不要犯大错。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "一个人的地位、权势、声望达到顶点的时候，也就是要走下坡路的时候。稍微处理不慎，就会招致无法预计的危险。因此，越是辉煌的时候，越应该努力保持清醒的头脑，趋福避祸。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "他知道自己兄弟二人权势已达峰巅，现在最需要做的是自剪羽毛。他的应对，一是奏请曾国荃辞职返乡，另一个是主动裁撤湘军。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "其实左宗棠一生于朋友之道不屑于用心讲求，先后绝交的朋友不止曾国藩一人。他和郭嵩焘、李鸿章、沈葆桢也无不闹翻。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "失和之后，曾国藩从来没有公开说过左氏一句坏话，私下里也不怎么对人谈论他与左氏的是非短长，真的做到了“相忘于江湖”。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十二章 “将权位二字，推让少许”", "x": "因此曾国藩去世后，身在西北前线的左宗棠派人千里迢迢送来一副谁也没有料到的挽联，终于承认自己不如曾国藩。其文曰：\n谋国之忠，知人之明，自愧不如元辅。\n同心若金，攻错若石，相期无负平生。￼", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十三章 两江总督的清与浊", "x": "他对此“感激次骨，较之得高爵穹官，其感百倍过之”。按理说，皇帝发了话，这八万两就可以省下了。不过，曾国藩却说，这说好的八万两银子“部费”还是照给。因为阎王好见小鬼难搪，毕竟以后他还需要和户部打交道。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十四章 洋人也是人", "x": "总之，当时中国人对外观念的一个心理症结是无法接受洋人是和中国人平等的“人”，仍然一厢情愿地判定他们是低人一等的半人半兽的生物。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "人们提起曾国藩，一般认为他一生做了两件大事：平定太平天国和兴起洋务运动。其实除此之外，曾国藩一生致力的还有一件大事，那就是培养人才。", "y": "", "d": "2024-01-27"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "一般经过这两项考察后，曾国藩才会确定幕僚的具体工作：有胆气血性者令其领兵打仗，胆小谨慎者令其筹办粮饷，文学优长者办理文案，学问渊博者校勘书籍。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "安排好工作后，接下来的第三步，就是培养。曾国藩认为，人才“大抵皆由勉强磨炼而出”。天生大才极少，中等以下人才都可通过培养教育造就出来。￼", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "李鸿章这样描述曾国藩在众弟子面前的老师形象：“他老人家又最爱讲笑话，讲得大家肚子都笑疼了，个个东倒西歪的。他自家偏一些不笑，以五个指头作耙，只管捋须，穆然端坐，若无其事，教人笑又不敢笑，止又不能止，真被他摆布苦了。”", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "李鸿章这个人身上缺点和毛病确实多。他智商高，才华出众，自小又一帆风顺，因此待人接物，经常盛气凌人，“常显傲慢轻侮之色，俯视一切，揶播弄之”￼。到了曾国藩幕府后，他自恃翰林出身，科名地位比其他人都高，所以经常不自觉地流露出目空一切的气概。曾国藩认为，若将来真要他独当一面，还须再经一番磨炼，所以要先声夺人，在大家面前挫挫他的锐气。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "在曾国藩的影响下，李鸿章从一个爱睡懒觉的年轻人逐渐变得“每日起居饮食均有常度”，李子渊在《合肥诗话》中记载其先伯曾祖少荃公“每日盥毕，据案作书，临摹《怀仁圣教》数百字，饭罢，必绕廊徐行数百步，历数十年，虽笃老未尝或辍，其坚定有恒，亦秉曾公之遗法也”￼。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "国藩对李鸿章这块美玉确实是尽力雕琢，进行了全方位改造。李鸿章爱睡懒觉，曾国藩让他养成了每日早起的习惯；李鸿章平时好说谎吹牛（合肥俗语“打痞子腔”），但在曾国藩面前他从来不敢造次；李鸿章心思太灵，遇事容易动摇，曾国藩经常对他讲“挺”经，教导他遇到困难要挺得住。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "曾国藩身边的幕僚，大部分都是这样，通过与曾国藩朝夕相处，耳濡目染，潜移默化，在不知不觉之中变化气质，增长才干。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "不光是李鸿章对曾国藩充满感激，曾国藩幕府中的大部分人对曾国藩都感激终生。他“能随人之才以成就之，故归之者如流水”￼。同时曾国藩用人，还有一个宗旨，那就是“己欲立而立人，己欲达而达人”，全力给他们制造发展的机会。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "在京期间，曾国藩曾经教李鸿章作文。在幕府中，曾国藩又曾教李鸿章做人。现在，他又给李鸿章上了第三课，建军。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "针对李鸿章与人交接时经常流露出来的傲慢，曾国藩指示他说：\n词气宜和婉，意思宜肫诚，切不可露傲惰之象。阁下向与敌以下交接颇近傲慢，一居高位，则宜时时检点。与外国人相交际，尤宜和顺，不可误认简傲为风骨。风骨者，内足自立，外无所求之谓，非傲慢之谓也。￼", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "李鸿章文笔优长，身上却没有一丝文人所常有的那种书卷气。他天生善于并喜欢处理复杂局面。别人怕事，他则喜事。局面越乱，责任越重，他越高兴。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "这高帽子一戴，让曾国藩没了脾气，只好高姿态地放他一马。李鸿章的情商，实在高出沈、左十倍以上。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "作为学生，李鸿章与老师曾国藩一生有过密切合作，也有过多次冲突，但是高明之处在于，他从来没有与曾国藩撕破脸，懂得有进有退。这是曾国藩日后交班给李鸿章的另一个重要原因。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十五章 与接班人李鸿章共同“剿”捻", "x": "李鸿章比曾国藩年轻十二岁，并且身体健康、精力充沛。他为人直率、热情、精力旺盛、刚强坚毅。曾国藩在平定太平天国后身体出了很大问题，疾病不断，进取心已经大大减弱，李鸿章却总是乐于承担一切繁难，因为他有这个能力和精力，更因为他还没有达到人生的巅峰，实现“封侯”之志。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "天津教案震惊了全世界。这次教案不但死亡者众多，更关键的是，法国高级外交官也死于此难。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "如果教案处理不当发生战争，以清王朝的国力，结果必是再一次割地赔款，这是鸦片战争以来多次中外战争早已经证明了的规律。要避免战争，势必要和洋人妥协。然而晚清以来，有一个规律性现象，那就是在对外交往中，凡是主张强硬，甚至主张“蛮不讲理”的人，通常都会获得民众的热烈欢呼，被称为“民族英雄”。而主张和洋人“讲理”“妥协”的，几乎都会被骂卖国，被称为汉奸，声名尽毁。如郭嵩焘所评论：“一袭南宋以后之议论，以和为辱，以战为高。”￼南宋以后，凡主战者在历史上都得美名，主和者都得骂名。所以鸦片战争以来，凡是涉及夷务的人，大多数都落不到好下场、好名声。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "国藩完全有理由不介入此案。因为他虽然是直隶总督，但是他的职责范围中并不包括外事，外事是由崇厚这个专管三口通商的专员专门负责的。曾纪泽说“此次洋务，本非大人（指曾国藩）专责”￼。就是曾国藩自己也说：“至中外交涉事件，臣素未讲求。”￼同时，上谕也说“（曾国藩）精神如可支持，着前赴天津”。如果他因病推辞，朝廷也不会强迫他前去。所以是否从命，一开始他有点犹豫不决。“接奉廷寄，派余赴天津查办事件，因病未痊愈，踌躇不决。”￼", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "所以后来在给李鸿章的信中，他说：“事端重大，义不敢辞。数日之后，即拟力疾前往。”￼准备病情稍缓，就起程赴津。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "曾国藩的遗嘱与普通人不同，其中并没有什么遗产分割之类的常见内容，重心是放在对后代品性的期许上。他把自己一生为人处世最重要的心得又向儿子们交代一次，那就是为人一定要做到“不忮不求”。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "余生平略涉儒先之书，见圣贤教人修身，千言万语，而要以不忮不求为重。忮者，嫉贤害能，妒功争宠，所谓怠者不能修，忌者畏人修之类也。求者，贪利贪名，怀土怀惠，所谓未得患得，既得患失之类也。忮不常见，每发露于名业相侔、势位相埒之人；求不常见，每发露于货财相接、仕进相妨之际。将欲造福，先去忮心，所谓人能充无欲害人之心，则仁不可胜用也。将欲立品，先去求心，所谓人能充无穿窬之心，而义不可胜用也。忮不去，满怀皆是荆棘；求不去，满腔日即卑污。余于此二者常加克治，恨尚未能扫除净尽。尔等欲心地干净，宜于此二者下功夫，并愿子孙世世戒之。￼", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "人这辈子，最难去除的是嫉妒和贪求。所谓“不忮”，就是克制自己的嫉妒心。“不求”，就是克制自己的贪求心。这两点听起来似乎是老生常谈，事实上很多人，特别是很多当世名公，都处理不好。嫉妒经常出现在功名事业差不多的人之间，贪求常出现在升官发财之际。连左宗棠、郭嵩焘这样的大人物事实上都常在这两点上犯错误。所以他专门强调，这两点不去除，则既难立品，又妨造福。希望曾氏后人能“克治”这两点，做到“心地干净”。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "听说威名素著的曾国藩前来，天津百姓中流传起一则新的谣言，那就是皇上“专调曾国藩来天津驱逐洋人”。他们这些爱国民众，终于有了主心骨，他们都摩拳擦掌，等着和洋人们决战，把中华大地上的所有洋人杀光，还我天朝上国的清净。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "曾国藩一贯主张“明强”，就是说，在判断分析形势的基础上，才能决定是使强还是使柔。中国和西方军事实力的差距太大，避战显然是明智的选择。“故……办理此事，不惮委曲迁就，躬冒不韪，冀以消弭衅端。”￼所以他才定下“不开兵端”的宗旨。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "也就是说，统治者不应该凭着汹汹民意与外国开战。百姓是随势利而转移的，并无定见，他们在自身没有危险时，热衷于低成本爱国。但一旦有事，他们往往并不敢往上冲￼，因此并不足以依恃。鼓动排外热情来对抗外国，只能被人家笑话。办理外交，不能汲汲于个人名声，不能被无定见的舆论裹挟。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "就是在这些力量的推动下，中央在发布曾国藩奏折时，做了这样的处理。\n朝廷这样做，可以把曾国藩贴上卖国软弱的标贴，将民众对朝廷的仇恨转移到曾国藩身上：是曾国藩软弱，而不是朝廷软弱。这样就可以不失民心。朝廷仍然是正确的，只是他曾国藩没有办好。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十六章 天津教案：曾国藩是怎么成为“卖国贼”的", "x": "曾国藩听后大受刺激，“昏晕呕吐，左右扶入卧内，不能强起陪客”￼，“历三时之久，卧床不起，据医家云脉象沉重”￼。\n二十八日，曾国藩自度病体不支，又一次想到了他的学生李鸿章。他希望朝廷命李鸿章带兵来天津，一方面可以武力震慑法方，表明中方的备战决心，另一方面，有着丰富外交经验的李鸿章还可以做曾国藩的助手，直接帮助他处理此事，了此一段残局。因此与崇厚密商后，曾国藩向朝廷建议：“若令李鸿章入陕之师移缓就急，迅赴畿疆办理，自为得力。”￼在同一天致李鸿章的信中，曾国藩更是发出“四顾茫茫，自阁下外，未知巨艰更将谁属”￼的感慨。崇厚也专上一折，说“曾国藩触发旧疾，病势甚重”￼，请再派重臣前来帮办。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "天津教案对曾国藩的精神打击是巨大的。不光是社会各界的痛骂让他深感痛苦，更为重要的是，通过这一教案，他清醒地认识到他所致力的所谓“同治中兴”只是一场梦：这个王朝已经不可挽救了。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "曾国藩的回答是一副对联：“倚天照海花无数，流水高山心自知。”", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "国藩是清王朝的忠臣。为了这个王朝，他拼尽心力。在创办湘军之时，他在给朋友的信中就以精卫自许，称自己的行为是“精卫填海、杜鹃泣山”￼。他这一生都在补天填海。在平定太平天国后，他没有一日懈怠，紧接着就启动了洋务运动。他的目标不只是延长王朝的寿命，更要更新它的精神，脱换它的胎骨，让它有能力来应对几千年未有之重大挑战。而在他和其他所谓“中兴名臣”的努力下，大清王朝也确实一度出现了欣欣向荣之态，史称“同治中兴”。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "他曾经对弟弟曾国潢说：\n诸事棘手，焦灼之际，未尝不思遁入眼闭箱子之中，昂然甘寝，万事不视，或比今日人世差觉快乐。￼\n眼闭箱子，就是棺材。就是说，在公务难以处理、心情焦灼的时候，我经常想早点儿跑到棺材里，往那儿一躺，理直气壮地睡大觉，再也不用醒过来，这样，比活着，那要快乐多了。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "以如此孱弱的身体，承担起挽救国家、填海补天的大业，曾国藩的艰难竭蹶可想而知。在漫长的平定太平天国战争中，曾国藩自述“心已用烂、胆已惊碎”", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "曾国藩毕竟是一个坚忍到底的人。他知道，王朝命数之类的事，是上天做主的，自己不必代为做主。自己能做的，只是尽自己的人事。在生命的尽头，他用尽全力，又在洋务上做了一件大事，那就是奏请派出第一批官费留美学生，推动这个古老而多灾多难的国家向前走了一步。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "晚年的曾国藩虽然已经油尽灯枯，但仍然勤奋有恒，尽管右眼已经失明，左眼的视力也并不好，但他还是每天在处理完公事后读一点儿书。有时眼睛实在太疼，就闭目默诵。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "曾国藩显然意识到了自己的病很严重，他本来以为自己会死在当天。曾国藩女儿说：\n文正公对客，偶患脚筋上缩，移时而复。入内室时，语仲姊曰：“吾适以为大限将至，不自意又能复常也。”￼\n但是曾国藩对死亡毫不畏惧。他丝毫没有打乱自己的生活规律，在这一天接下来还做了这些事：接见了一个叫庞省三的人，然后阅《通鉴》二百二十卷。傍夕小睡。夜阅《宋元学案》吕东莱一卷。二更后，与儿辈讲《孟子》“定于一”章，又阅《吕氏学案》。三更睡。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "同治十一年二月初四日，也就是1872年3月12日，曾国藩的大限终于到了。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "听说曾国藩死前没有经过多少痛苦，一笑而逝，足证这是一个能上感苍天的圣人。活着的时候已经是完人，死后又盖棺论定为圣人。人生如此，夫复何憾。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "挽诗《哭师》中写道：“雷霆与雨露，一例是春风。”", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "立功、立德、立言，曾国藩全做到了。就立功而言，他从一介书生起家，创建军队，统率群雄，挽狂澜于既倒，扶大厦之将倾，使中国传统文化免遭彻底毁灭的命运，使清王朝的生命又延续了六十年，其功不可谓不大。就立德而言，他时时以圣贤标准要求自己，道德修养近乎纯粹，五十年后相继主宰了中国的两个大人物——蒋介石和毛泽东，也不约而同地把他当作过自己的精神偶像。说到立言，他作为中国最后一个大儒，对理学身体力行，登堂入室，造诣很深，留下了洋洋数百万言的全集，其精深博大之处可以让学者终生沉浮其中，其家书语录直到今天仍让普通人受益匪浅。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "所以，他被誉为“古今完人”“功比周公孔孟，名垂万世千秋”。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "当然，曾国藩的一生从一定意义上说也是失败的。他是逐日的夸父、填海的精卫、补天的女娲。然而在垂暮之年，他猛然发现自己一生的奋斗，最后竟然如拔刀斫水，并不能丝毫影响水之东流。他以圣贤自期，然而他遵循圣人之道一丝不苟地苦学苦修，却并没有达到“为天地立心，为生民立命，为往圣继绝学，为万世开太平”的理想。他以一人之力，无法挽回传统社会积千百年形成的强大颓势。他没能探悟到拯救旧世界的真理，没能实现自己澄清天下造福万民，创造一个以儒家学说为指针的太平世界的理想。相反，他眼看着神州不断陆沉，自己却无能为力。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十七章 大清王朝最后的领航者", "x": "曾国藩用自己的一生，证明了人的意志力所能达到的高度。同时，也证明了一个人意志力的局限。他无望的努力在人类精神征途上，树起了一座令人不得不肃然起敬的丰碑。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十八章 曾国藩的遗产", "x": "什么是君子呢？“勤俭自持，习劳习苦，可以处乐，可以处约。此君子也。”在任何环境下，都能找到快乐和内心宁静的人，才是君子。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十八章 曾国藩的遗产", "x": "国藩认为，读书本来是人生的至乐之一，但前提是不把读书当成敲门砖。所以他要求两个儿子读书，一定要体会书中的意思，“得些滋味”，一定要从读书中读出快乐来，如果不快乐，不如不读。他经常对孩子说：“胸中不宜太苦，须活泼泼地，养得一段生机。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十八章 曾国藩的遗产", "x": "但是作为曾国藩的克家之子，曾纪泽拥有一项别人无法比拟的优势：毅力。在曾国藩的言传身教之下，父亲的很多优点，他都继承下来了，特别是对恒心的重视和践行。他和曾国藩一样，“读书不二”，做事也有头有尾，一旦开了头，就绝不会中止。", "y": "", "d": "2024-01-29"}, {"k": "h", "c": "第十八章 曾国藩的遗产", "x": "1878年，左宗棠收复新疆，", "y": "", "d": "2024-01-29"}, {"k": "t", "c": "全书想法", "x": "", "y": "“养活一团春意思，撑起两根穷骨头。” \n以前对曾国藩的了解只停留在历史课本上的几句话，前几天刷微博，看到有人分享曾国藩的十二条戒律，突然想起来我书架上（微信读书）放到快落灰的《曾国藩传》，刚好读完了上一本书，就重新拿起这本传记来读。\n \n整个过程中我有点沉迷，吃饭看、排队看、晚上下班也一直在看，舍不得睡觉。他的一生太“精彩”了，经历跌宕又起伏，而他又足够坦诚，把自己的欣喜、得意、困惑、忧虑、无奈等等都写在了日记和家书中，能让我们尽可能地还原出一个有喜有悲、有血有肉的曾国藩。9小时34分钟，我读完了曾国藩的一生。跟着这本传记，我又了解了一遍晚清历史，了解了很多小时候历史课本上没有篇幅展开来讲的故事。\n \n比如咸丰皇帝悲惨的一生。咸丰刚当上皇帝，广西就发生了起义。他每天派兵，每天努力，结果局势越来越乱。就在太平天国越来越乱的时候，北方又有捻军（反清农民军）起事，活跃于淮河南北，兵力超过十万。东南沿海又有天地会起事，福建、上海、两广到处都有起义者。关内十八省，已经有十四省战火熊熊。内乱正盛，外夷交并。就在江南大营崩溃的同时，第二次鸦片战争爆发，英法联军纵火焚烧了万园之园圆明园。中国割地赔款，丢失了150多万平方公里的土地，咸丰仓皇逃到承德。曾国藩收复安庆之后，立即发出奏折跟咸丰汇报这个好消息，但就在这几天咸丰皇帝死了，他到死都没看到安庆克复的消息，更不知道平定太平天国起义终于大局已定。\n \n比如攻打太平军的过程是如此艰难。曾国藩克服万难赤手空拳创立湘军，在练兵期间不断有城池被围困，皇帝几次三番派他出兵，他顶住压力给湘军争取时间，在此期间他的挚友江忠源和恩师吴文镕先后兵败自杀。曾国藩在九江兵败后也差点自杀，后来攻克极为难打的安庆，雨花台大战，攻坚“天京”...... 整整十二年，这十二年里，他失去了曾国华、曾国葆两个亲兄弟，也亲手把数万名湘籍老乡送入鬼门关。自己更是三次自杀，数度濒危，承受了超过普通人耐受极限十倍百倍的艰巨，才换来“平定太平天国”这一张捷报。\n \n比如天津教案。天津民众反对天主教会在法国武力庇护下肆行宣教，攻击天主教教会，死了很多人，包括法国的高级外交官。教案发生后，七国联合向清政府提出“抗议”，调集军舰到大沽口进行威胁。曾国藩临危受命处理此案。然而晚清以来，在对外交往中，凡是主张强硬，甚至主张“蛮不讲理”的人，通常都会获得民众的热烈欢呼，被称为“民族英雄”。而主张和洋人“讲理”“妥协”的，几乎都会被骂卖国，被称为汉奸，声名尽毁。鸦片战争以来，凡是涉及夷务的人，大多数都落不到好下场、好名声。而办理外交，不能汲汲于个人名声，不能被无定见的舆论裹挟。当时清廷一方面畏敌如虎，在天津教案的处置中不可能既持平处理又维护国权；另一方面又怕过分屈从洋人会激起民愤，危及自己的统治。“内疚神明、外惭清议”，在这种形势之下的外交事务是如此复杂。\n \n比如留美幼童。读传记时看到有人推荐纪录片《幼童》，某天病假在家就去 B 站找出来看。对于留美幼童，我之前唯一的印象是那张印在教科书上的黑白照片。看完纪录片才知道，原来里面还有这么多让人唏嘘的故事，曲折离奇，美丽而让人忧伤。以严苛的条件挑选幼童、留美计划中途夭折、有人在回国路上逃跑、有人病死他乡、有人在战争中献身……历史的一粒尘埃落在具体的人身上，是山一样的重量。\n \n再说回曾国藩。提起曾国藩，一般认为他一生做了两件大事：平定太平天国和兴起洋务运动。有人说历史上只有“两个半”圣人，一个是孔子，一个是王阳明，还有“半个”是曾国藩。他被誉为“古今完人”“功比周公孔孟，名垂万世千秋”。为什么他能成为“内圣外王”的成功典型，成为毛泽东、蒋介石的共同偶像，成为“中兴第一名臣”？读完他的传记，你也许会和我一样找到答案。\n \n浮躁、虚伪、傲慢、好色、贪玩，曾国藩和我们一样有着许多世俗的缺点，但他却因为强大的自我管理能力，养成了慎独、主敬、求仁、守诚等习惯并坚持了一生。\n \n尚拙 —— 曾国藩科举考试考了七次才中秀才。他并不是特别聪明（相对很多同样名垂青史的人而言），艰难的科举过程塑造了他独特的人生哲学，那就是“尚拙”：崇尚笨拙。他没有智力资本，因此比别人更虚心，更肯付出。他不懂取巧，不走捷径，遇到问题只知硬钻过去，因此做事不留死角。\n \n守诚 —— 曾国藩说：“思诚则神钦”。真心诚意地对人对事对物，连神灵都会钦敬有如此品性的人。胡林翼（曾国藩挚友）评价曾国藩说：“人终乐从曾公，其至诚出于天性，感人深故也”。曾胡二人相互理解、相互支持、相互砥砺、相互敬佩，可谓是交友典范。在清代重臣中，他也是第一个主张对洋人“以诚相待”的人。\n \n坚韧 —— 他一生经历过多次屈辱：秀才考试被考官公开批责，说他“文理太浅”（是当时非常严重的批评）；“画图甚陋”遭同事讥笑；因为得罪权贵被“京师权贵唾骂”；在长沙差点让闹事的兵痞杀了，却只能“打脱牙和血吞”......可当他回顾平生几次大堑，他却认为挫辱是他最大的助力。“行有不得，反求诸己。”曾国藩后来说，如果他有时间，就会写一本“挺”经，所谓“挺”，就是指在危急时刻，能坚持住。对于这样的“挺”字精神，曾国藩称之为“竖起骨头，竭力撑持”。后来他专作了一副联语，作为“挺”字的注脚：“养活一团春意思，撑起两根穷骨头。”我很喜欢这副联语。经历过挫折和屈辱，心中反倒能养活一团春，这一团春，温厚平和，能扛得住、撑得起一路上不时会出现的“穷”境。\n \n自省 —— 读到王阳明落第之后说“世以不得第为耻，吾以不得第动心为耻”（大家都以落第为耻，我却以落第后不能保持平常心为耻），曾国藩悚然一惊，他发现和这些圣贤人物比起来，自己的视野多么狭窄，境界多么低劣。和别人一聊天，说出的都是没有什么见识的话，身上的鄙俗之气在冲了人家一个跟头之后再折回来，自己还能闻得清清楚楚。因此他决心改掉自己的坏毛病，朝着圣人去努力。怎么做呢？方法很简单，就是“写日记”。他给自己规定了每天基本的学习日程：每日楷书写日记，每日读史十页，每日记《茶余偶谈》一则；除此之外，他还每日读《易》，练习作文。写完日记之后，他会按倭仁的建议，送给朋友们传阅。看曾国藩的日记，我们可以很明显地感受到，他这一生，就是不断自我磨砺的一生。曾国藩活了62岁，他一生都在不断地完善自己，从青年到老年，他都生活在不停的自省中，每天都在日记中不断反省自己的缺点，纠正自己的行为。遇到其他官员有意和自己作对，心里非常愤懑。但是他细思古人办事，也经常会遇到掣肘和拂逆。如果怒他人之拂逆，必欲使之顺从，就会采取霸道手段，诛除异己。时间长了，就会成为不可一世的权臣，给自己带来祸患。如果在他人的反对面前能够动心忍性，修炼自己的心性，委曲求全，而且还以没有“对立面”而忧心，这才是圣贤的用心。所以他说正可以借这些不顺心的事来磨砺心性。\n \n执行力 —— 在筹建湘军期间，没有人会造船，曾国藩就自己设计，雇衡州、永州的能工巧匠，在湘潭设立船厂，大量制造战船。船的具体结构尺寸，乃至每一个部件，曾国藩都要和有经验的工匠反复设计，不断试验。花费重金从广东购置大批洋炮，经过反复研试，终于将洋炮安装在战船上，建成了当时中国技术先进、装备精良的内河水师。曾国藩身上有着突出的试验精神和开放态度，凡事总愿意亲身经历，亲自体验，勇于尝试，勤于尝试。做事讲究身到、心到、口到、眼到，特别强调要“苦下身段去事上体察一番”。他一辈子强调勤与恒，听起来很老生常谈，但他的厉害之处在于践行终身。\n \n定力 —— 曾国藩为人处事表面上看起来保守，但是在根本问题上，却又有着常人所没有的巨大勇气。江忠源被太平军围困在庐州，弹尽粮绝，情况万分危急。江忠源亲自写信向曾国藩求救，咸丰皇帝也再一次命曾国藩迅速出兵。曾国藩仍然不为所动。奉到咸丰严苛的出兵之旨，曾国藩毫不害怕，“千言万语，就是现在不能出兵，你想怎么处分我，随便吧。”他忍心按兵不动，致使江、吴先后兵败自杀，作为省会的庐州、武昌也相继沦陷。曾国藩顶着巨大的心理压力抗疏拒旨，为湘军造船、购炮和练兵赢得时间，才得以让湘军免遭轻进覆灭之灾，为日后彻底打败太平军积蓄了力量。\n \n领导力 —— 他很会培养人才，先考察，再分配具体工作：有胆气血性者令其领兵打仗，胆小谨慎者令其筹办粮饷，文学优长者办理文案，学问渊博者校勘书籍。曾国藩认为，人才“大抵皆由勉强磨炼而出”。其中最具代表性的当属李鸿章了，曾国藩曾经教李鸿章作文、做人、建军，尽力雕琢这块美玉。李鸿章本人才华和能力就出众超群，加上曾国藩的雕琢，也成了“中兴名臣”之一。\n \n以上，足以解释为什么后人会对曾国藩有如此高的评价。\n \n但他也不是一路都踌躇满志，平步青云。\n \n他也曾迷茫。做了一段时间高级官员，曾国藩就不再那么兴奋了，在给好友和家人的信中，他说“别看我现在身居庙堂之高，其实只是庙堂之上一个没用的小摆设。天天这样不上不下、非驴非马地混日子，只觉得自己面目可憎而已。”“我现在做这么一个小官，每天的工作如同支床石一样，疲倦麻木。我天天想念家乡，如同离了娘的小孩。愁闷极了，不如干脆找几瓶好酒，喝得大醉，什么都不知道好了。”\n \n他也曾忧虑。他的日记中常常出现“寸心郁郁不自得”、“忧灼过度”、“闷损不堪”、“愁肠九回”的字眼。在等弟弟曾国荃攻克南京时，他白天频繁联系各处，全力保障弟弟战场的供应，傍晚到后院的小房间里去，跪在蒲垫上默默对天祷告，求老天保佑弟弟平安。上了床又常常一夜无眠。\n \n他曾经对家人说，“诸事棘手，焦灼之际，未尝不思遁入眼闭箱子之中，昂然甘寝，万事不视，或比今日人世差觉快乐。”（在公务难以处理、心情焦灼的时候，我经常想早点儿跑到棺材里，往那儿一躺，理直气壮地睡大觉，再也不用醒过来，这样，比活着，那要快乐多了。）\n \n他身体并不好，一生与多种严重疾病相伴。在漫长的平定太平天国的战争中，曾国藩自述“心已用烂、胆已惊碎”。（这里得插一句，他活了62岁，多病的情况下算是高寿了，他的养生之道与《黄帝内经》中所说的无异。）\n \n他也不是完全的圣人。曾国藩在长沙办团练时，大力搜“剿”土匪，他命人制作了一批木笼，放在车上，那些罪不至死的地痞流氓，抓获之后，枷入木笼游街。游罢了也不取出，还是关在里面，直到站死、饿死为止。他的铁腕和残忍令人吃惊，从此被人称为“曾剃头”。\n \n水至清则无鱼。那些虚伪、麻木、圆滑、机诈、残忍，或许是在当时那片土地上生存的必需手段。只有必要时和光同尘，才能顺利通过一个个困难的隘口。不过我读曾国藩，并不想站在上帝视角评价他，也不想去纠结他是否被过誉，而是从他修身、处世、治家、做人的原则中，试图学到些什么。\n \n抱着这样的目的，我收获颇多。曾国藩用自己的一生，证明了人的意志力所能达到的高度。他从一介书生起家，创建湘军，平定太平军，挽晚清狂澜于既倒；他自我磨砺大半生，修身修心，作为精神偶像影响了几代人。\n \n同时，他也证明了一个人意志力的局限。晚清时期，内忧外患，他一人之力，如同逐日的夸父、填海的精卫、补天的女娲，根本无法挽回这种强大颓势。他也知道，王朝命数之类的事，是上天做主的，自己不必代为做主。自己能做的，只是尽自己的人事。“古今亿万年无有穷期，人生其间数十寒暑，仅须臾耳。……事变万端，美名百途，人生才力之所能办者，不过太仓之一粒耳。”时间没有穷尽，人生几十年实在是一瞬即过。天下至大，人力所能为者至小。\n \n曾国藩说：“天下无易境，天下无难境；终身有乐处，终身有忧处。”生活，不论是在什么时代，其本质都是一样的，它总是喜忧参半、跌宕起伏，重要的是我们体验了什么，改变了多少。世界以其巨大的未知裹挟着我们，所以我们永远无知。哪怕是曾国藩这样了不起的大儒，也失意、纠结、迷茫、在困难时灰心。\n \n所以我们不必苦闷，“须活泼泼地，养得一段生机”。“养活一团春意思，撑起两根穷骨头”，心里养一股生机勃勃的劲儿，去面对苦闷生活的“穷”境，得些滋味，是我读完曾国藩之后学到的，人生的智慧。", "d": "2024-02-07"}]}, {"id": "36968035", "title": "成为波伏瓦", "author": "凯特·柯克帕特里克", "cats": ["人物传记-女性人物", "个人成长-女性成长"], "bmCount": 113, "rvCount": 0, "notes": [{"k": "h", "c": "前言：西蒙娜·德·波伏瓦——她是谁？", "x": "生活中的每一步都是一个哲学的选择", "y": "", "d": "2024-09-20"}, {"k": "h", "c": "第一章 像个女孩一样长大", "x": "弗朗索瓦丝则要保证她的学识不超出自己的性别所允许的范围。", "y": "", "d": "2024-09-24"}, {"k": "h", "c": "第一章 像个女孩一样长大", "x": "由自己的内在观察到的自己和从外界观察到的自己", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "波伏瓦所受的传统教育告诉她，婚姻就是女性的命运，但是乔·马奇就能够因为自己不想结婚就断然拒绝了这样的命运，波伏瓦想知道，自己也可以这样吗？", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "早在1926年，当波伏瓦还是学生时，她就在日记中思考，究竟要保持多少自我，以及放弃多少自我。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "波伏瓦为此写道：​“我唯一能想象的就是一种爱情兼友谊的关系。在我的眼里，一个男孩和一个女孩，只有彼此交换读书之后的思考，才能永远地连在一起。​”[插图]", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "书籍不仅给波伏瓦提供了知识，也是她从物质和精神双重贫乏的现实世界里逃离的避难所。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "一个女性能够自主做选择，不再为自己的身体感到羞耻的新世界", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "没有人可以一边说着“我在自我牺牲”​，一边心里不觉得苦。我母亲的矛盾在于，她完全相信奉献是伟大而高尚的，但是奉献和自我牺牲所带来的厌恶、欲望和各种苦涩已经到了她自己没法承受的地步。我的母亲一面强迫自己不断地奉献和牺牲，一面苦苦对抗自由被剥夺的痛苦。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "一个人该如何解决这些冲突和矛盾？到底是应该自我奉献地过一生还是应该只为了自己过一生？", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "波伏瓦渐渐觉得只有孤独才是最令人愉快的状态，她想要独自掌控自己的生活。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "好在各种期待压得她喘不过气的同时，终于有一点点新鲜空气进来。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "对于波伏瓦来说，通过婚姻获得男性的帮助，并不如靠她自己的能力来得可靠。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "人类的思想是有限的，既不知道万物的起源，也无从得知其最终的归宿，但是我们至少能尝试去掌握中间的部分，也就是周围与我们紧密相关的一切事物。​”[插图]", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "对自由的渴望让人类想要的不仅仅是“好的事物”​，也不仅仅是“好的决定”​，而是一个完全属于“我自己”的决定。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "后来，波伏瓦反思为何当时自己那么迫切地想要结婚，也许她只是想通过婚姻实现别的目的：只有结了婚，她才能获得家人的爱和尊重。", "y": "", "d": "2024-09-12"}, {"k": "h", "c": "第二章 端方淑女", "x": "波伏瓦在日记里劝慰自己不该为自己的生活而感到羞愧，她被赋予了生命，就应当把生命活到极致，活出最好的可能性。如果完全牺牲自己，奉献他人，实际上是一种道德上的自杀。而且这种自我牺牲比痛苦地抉择多大程度上放弃自我、多大程度上保留自我要来得简单。波伏瓦觉得她需要的是一种平衡，既要为他人奉献，但也不要在为他人奉献的过程中失去自我。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "我很喜欢那些能够重新发现生活的作家，以及那些能够重新发现这些连接生活的作家的哲学家。​”[插图]", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "1926年，波伏瓦终于得出结论，她尊敬那些思考自己人生的人，既不是那些只思考的人，也不是那些只生活不思考的人。[插图]", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "有时候她会一个人在巴黎的街道上散步，有时候她会去看埃莱娜画画。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "尽管家里的气氛很紧张，晚上波伏瓦也常常出去闲逛，但她在学业上依然很优秀。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "学业上的成功不仅为她带来了尊重，还让她感受到深切的孤独和迷茫。她坦言：​“我脱离了自己本来属于的阶层。我到底应该去到哪里？​”[插图]", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "波伏瓦在日记里坚决地写下：​“我的人生只有一次，而且我有很多东西需要表达。他不能把我的人生从我手里偷走。​”然", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "只有通过自由选择和随机应变，真的自我才能显现", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第二章 端方淑女", "x": "波伏瓦身边的人都在谈论着人生选择，比如结婚，但是她们总认为做出这样的选择之后便可以一劳永逸。波伏瓦认为没有什么选择是一劳永逸的，相反，她觉得每一个选择“都处在变化之中，每次我意识到这个选择的时候，我实际上重复了自己的选择”​。那天波伏瓦在日记里总结道，婚姻从本质上来说就是不道德的，今天的自我怎么能够为明天的自我做选择呢？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第三章 信仰上帝还是相信自己？", "x": "波伏瓦对于西蒙娜·薇依的名声早有耳闻，但不是因为西蒙娜·薇依的聪慧过人，而是因为她对他人的苦难有着深切的同情心。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第三章 信仰上帝还是相信自己？", "x": "年轻时的她觉得政治离自己很遥远。一部分原因是她觉得自己无力去改变外部世界，因此只能转而关注她能够控制的范畴，也就是自己的内心世界。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第三章 信仰上帝还是相信自己？", "x": "1929年1月，波伏瓦成为法国史上第一个在男子学校教授哲学课的女教师。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第四章 传奇之前的爱恋", "x": "在这段日子里，波伏瓦最高兴的是，身边的人都希望她成为她自己想成为的样子", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第四章 传奇之前的爱恋", "x": "如果在一个社会里，女性既没有投票权，也不能开设自己的银行账户，甚至连自己生的孩子都不能留在身边，那么她到底有什么权利呢？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第四章 传奇之前的爱恋", "x": "在日记里，波伏瓦写道，她想要哲学指引自己的人生——过思考的一生，而不是只思考不生活，或是只生活不思考。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第六章 她自己的房间", "x": "现在的波伏瓦，可以按自己的想法做事情，也可以随心所欲地打扮自己。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第六章 她自己的房间", "x": "但是，当波伏瓦告诉萨特她的观点时，萨特会对波伏瓦说，你的原创性不够，他甚至对波伏瓦说：​“当你这样想问题的时候，你根本就没有在思考。​”[插图]", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第六章 她自己的房间", "x": "在这之前的一年，波伏瓦读了马克思，开始意识到劳动力和价值之间的重要联系。但是那只是在巴黎时读的文字，跟在一个工厂实地感受到的相差甚远。波伏瓦问工人们要工作多久，工人回答说，8个小时一班的三班倒，波伏瓦听了难过得湿了眼眶", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第六章 她自己的房间", "x": "波伏瓦说她决心不走入婚姻这个资产阶级的制度，而唯一有可能改变她想法的是孩子。在少女时期，波伏瓦曾经想成为一个母亲，但是她现在觉得这已经不可能了。波伏瓦已经看透了，养育孩子只是“毫无目的且不合理地为地球增加人口”。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第六章 她自己的房间", "x": "没有课的时候，波伏瓦一大清早就出门去户外远足。穿着一身旧裙子和帆布鞋，波伏瓦一天能走五六个小时，走到很远的地方。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第六章 她自己的房间", "x": "远离自己最重要的爱人和朋友，波伏瓦不得不忍受孤独，但也正因为如此，波伏瓦知道了自己是靠得住的。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "1943年，波伏瓦就已经在发问：对于社会来说，谁是有用的，谁是无用的？谁又有决定有用和无用的权力？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "每一个有脑子的西方女性肯定都在某一个时间点问过这样的问题：​“像西蒙娜这样的漂亮女孩为什么要去倒贴萨特这种无聊的丑八怪，跟他浪费时间？​”卡", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "在《存在与虚无》里萨特提出，在所有的人际关系里，都是一个人扮演主导者的角色，另一个人扮演被主导者的角色。一个人是“主体”​，他从自己的视角看待世界，而另一个人是“客体”​，他内化了那个统治他的人的视角。萨特认为，有时候我们倾向于去统治别人，有时候也喜欢被别人统治。但是我们从来不会平等地和彼此互动。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "萨特在《存在与虚无》里这样定义“自欺”​：这是一种逃避自由的方式，要么过度认同自己的“真实处境”(facticity)，要么过度认同自己的“超越性”(transcendence)。​“真实处境”是指一个人面对的所有偶然的和没法选择的因素，比如出生的时间和空间、肤色、性别、家庭、受到的教育以及身体。而“超越性”表示的是人能够超越这些属性的自由，指的是一个人如何去对待事实，如何通过行动去塑造自己。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "萨特认为，当“真实处境”和“超越性”出现脱节时，​“自欺”就产生了，这会使得一个人认为自己一定要成为某个样子。萨特用“侍者”举过一个著名的例子：如果一个侍者认为自己永远只能是侍者，认为自己是侍者的“真实处境”决定了自己的存在，那么这就是一种“自欺”的状态。因为这个侍者永远都有自由去选择其他的人生道路，否认这一点就是否认他自己的“超越性”​。不过，如果这个侍者完全不顾自己是一个侍者，试图去做一个首席执行官，那他就是以相反的原因处在另一种“自欺”当中——他没有认识到自己“真实处境”的局限。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "这个例子也许听起来有些无足轻重，但是如果你把侍者换成“犹太人”​“女人”​“黑人”就能看出它的深刻之处。人类的历史充满了这种拿他人“真实处境”的单一面向来以偏概全的做法，这样做的同时也忽略了他们的完整人性。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "萨特认为人类是自由的，不管他们的境况是什么样的，他们都可以自由地通过选择不同的回应方式去“超越”自己的“真实处境”​。而波伏瓦对此提出的质疑是：​“一个被关在闺房里的女性能够超越什么？​”[插图]从理论角度来说，能做出选择的自由和在现实情况里有选择的权力，这两者是有区别的。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "当时的波伏瓦想要知道：什么样的行为和关系才算是道德的？而在回答这个道德问题之前，波伏瓦不得不回答一个基本的存在主义问题：为什么要有这一切，而不是虚无？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "皮洛士是公元前4世纪伊庇鲁斯王国的国王，息涅阿斯是他的谏臣。当他们在商讨皮洛士征服世界的计划时，息涅阿斯问国王皮洛士：​“征服世界和在家歇着有什么区别？​”[插图]", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "有时候，达到目标之后，我们才意识到自己只是为了追求的过程；有时候，一旦得到了，想要的欲望也就随之消散了。所以行动的意义是什么？为什么我们要在意自己的行为道不道德？萨特的《存在与虚无》的结尾和息涅阿斯问国王皮洛士的问题很相似：一个人独醉和成为众国首领并没有什么区别。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "波伏瓦认为这两者是有区别的：独醉的人和众国首领有不同的境况，而且他们改变他人所在的世界的能力也不一样。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "波伏瓦把自己生活里的场景融入哲学论述：曾经有一个小女孩，因为她家公寓门房的儿子去世而哭泣。对此，她的父母有些不耐烦，说道：​“这个小男孩又不是你的兄弟。​”听罢，女孩擦干了眼泪。但是这样教孩子是很危险的。如果为陌生的小男孩哭泣没有用，应该随他去，那人为什么还要为自己的兄弟哭泣呢？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "但是波伏瓦也明白，这世界上有太多苦难和不公，如果真的要在乎，要为之哭泣，那我们就只能整日整日地以泪洗面了。我们的能力有限，也并不总是清楚该去在意什么。如果我们只是去同情所有同样性别、同样国别、同样阶级的人，或者与整个人类认同，那我们也只是在口头上扩大我们在乎的范围罢了。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "真正的问题是：大千世界里，到底什么是我们应该去在意和有所为的呢？波伏瓦对于这个问题的答案是：我们的行动。因为只有行动是唯一属于你，且仅属于你一个人的，这是你成为你自己的方式。只有你能创造和维持连接你和他人的关系，不管那是好的还是坏的。[插图]你和他人的关系并不是先天存在的，必须由你和他人一天一天地去创造以及再创造，有时候能够很好地发展下去，有的时候会被忽视，也有的时候会被滥用消亡。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "萨特相信，人在世上是孤独的，而波伏瓦对此并不认同，她认为，如果人是孤独的，那么人的命运将会很悲惨。只有和他人一起，我们才能成就某些事。", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "波伏瓦写道，每个人都想要找到自己生命的意义和人生的寄托。大部分人，尤其是女性，是在为他人奉献、为他人活着中，找到了寄托。有的人认为自己在上帝那里找到了意义，有的人认为自己在奉献他人的过程中找到了寄托。[插图]但是，通过奉献来合理化一个人的存在的做法是有问题的。首先，如果你所有的快乐都建立在对方是否接受一个他不怎么想要的东西上时，你为之奉献的对象很可能会厌烦你。而且，如果我们用奉献去限制他人的自由，违背他人的意愿，那我们对他人的奉献就有可能变成一种暴政式的绑架。世上这么多的人都想要为另一个人奉献自我，当时的波伏瓦想要知道，有没有可能在奉献的同时不绑架他者？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第九章 被遗忘的哲学", "x": "萨特认为自由是无限制的，但波伏瓦认为我们和他人的选择是相互制约的。因此，光是追求自由还不够，如果想要真正地尊重自己的自由，那么也必须尊重他人的自由，必须以道德的方式去行使自由", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第十章 存在主义女王", "x": "波伏瓦认为，人类在本质上都是模糊的，既是主体也是客体，既是意识也是物质。波伏瓦强调，​“绝对的恶”是指拒绝承认他者的主体性，把他者看作能被折磨和杀害的物", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第十章 存在主义女王", "x": "黑格尔的冥想概念", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第十章 存在主义女王", "x": "个人的就是政治的。哲学家们历来在探究“人类”和“人类的境况”​，那么“女人”呢？有没有“女人的境况”这样的东西？", "y": "", "d": "2024-09-13"}, {"k": "h", "c": "第十一章 美国困境", "x": "能敏锐地感受到人类的困境", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "女性越来越多地追求“加深对自我内在的认知", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "波伏瓦认为还有很多问题需要解决，比如女性气质常常被认为是谦逊的象征，女性缺乏胆量，也害怕承担胆量所带来的后果。波伏瓦写道，女性在孩童时代还有一些自主权，但是长大后就被鼓励为了幸福和爱情放弃这种自主权。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "波伏瓦清楚地陈述了她成熟的女性主义观的核心主张之一：​“最让人恼火和虚假的谬论就是在女性的帮助下被男性创造出来的‘永恒的女性气质’，他们认为女性是凭直觉行事的、迷人的、敏感的。​”[插图]波伏瓦指出，这种女性气质的“陷阱”在于，它常常认为女性不如男性，因而让女性感到分裂。波伏瓦认为，女性气质赋予了女人在男性眼中的价值，但是女人也因此害怕一旦女性气质缺失，自己就失去了价值。尽管女人能够通过接受教育和事业成就实现自己眼里的价值，然而职业女性往往会感到不如其他女性，因为觉得自己缺少魅力，不够敏感，也就是说，缺乏女性气质。相比之下，男人从来无须为了男性气质而牺牲自己的成功，也不必为了感到自在而放弃个人成就：男性的职业成功从来不会造成个人的损失。只有女性受到这种矛盾的折磨：​“她们要么得放弃部分个性，要么得放弃吸引男性的魅力。​”[插图]但为什么获得成功（或者魅力）要付出这么高的代价呢？", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "默达尔为非裔美国人所做的事情，波伏瓦也想要为女性做，她想要展示出文化中根深蒂固的种族主义和性别歧视，以及在面对女性议题时，人们是如何寻找托词的。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "孩子的世界充满了各种有规律的、令人安心的特征，我们很少注意到这些特征，更不用说去质疑了：女孩要穿裙子，8点钟就得上床睡觉。但有些成年人对世界仍然有着相同的被动接受态度：犹太人佩戴大卫之星，晚上9点就要实行宵禁。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "我们必须去选择想要成为什么样的人——不是一劳永逸，而是一而再，再而三，​“每时每刻”都做出这种选择。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十一章 美国困境", "x": "波伏瓦勤奋地工作，白天连续阅读和写作八个小时，晚上吃得少，喝得多。波伏瓦写信告诉阿尔格伦，也许她做什么事情都“有点太疯狂了”​，无论是工作、旅行还是爱情，​“但那是我的方式。我宁
