024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "穷人和老鼠一样，确实可以用这种方法消灭，或者至少把他们赶出人们的视线。需要做的只是下决心把他们当作老鼠对待，并接受“穷人和不幸的人是需要解决的麻烦”。￼", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "在“大量减少”穷人的过程中，工作伦理的贡献是无价的。毕竟，工作伦理主张：无论生活多么悲惨，只要它是由劳动报酬支撑的，就具有道德优越性。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "人们希望，不工作的穷人越是生活堕落，越是深陷赤贫，那些有工作、出卖劳动力换取最微薄工资的穷人的生活就越诱人，至少不至于无法忍受；这样，工作伦理得到了支撑，胜利也触手可及。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "其他援助的废止，也让穷人们再次认真考虑工作伦理的要求。工厂工作的要求确实严苛、令人厌恶，但相较其他选项是否真的那么糟糕？一旦有了比较，工厂中微薄的工资和无趣繁重的苦役，似乎也没那么不能接受，甚至令人向往。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "济贫法保护有工作（潜力）的穷人免受那些彻底无望的闲人的污染，用巨大的、坚不可摧的围墙把那些麻烦圈住，旋即在内外之间又竖起一道效果不亚于有形围墙的无形文化隔离墙。济贫院壁垒之内的流言越是恐怖，工厂工人的奴役看起来就越像自由，他们遭遇的悲惨也越像一种幸运和福祉。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作伦理的核心——基于无条件服从的纪律规范，通过自上而下的有效监督，固化乏味的、规律有序的行为。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "无暇顾及精神上的启蒙或思想上的改造，不指望这些圆形监狱(panoptical institution)的囚徒爱上他们的工作（他认为他们对工作无可救药的厌恶理所当然），也懒得去讴歌工作的高尚道德意义。如果囚犯的行为符合工作伦理的要求，与其说是道德的皈依，不如说是因为没有其他选择，结果看似工作伦理的戒律被他们接受并融入了他们的良知。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "如果一个人不工作，那他就什么都不能做，只能吃变质发霉的面包、喝淡然无味的水，没有人会和他说话……这种激励能恰到好处地促使他竭尽所能地工作”。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "尽其所能地向年轻人灌输着正确的规则和价值观。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "所有实际意图和目的都能归结为（正如边沁以他特有的直率和清醒的头脑所揭示的那样）：当下以及未来，工厂工人的选择大幅减少了。救济院外不救济的原则是推动“没有选择”策略的一种体现。这个策略的另一种体现是引入“仅供生存”(hand-to-mouth existence)的概念——把薪水保持在一个足够低的水平，工人们只能靠它活到第二天的黎明。这样一来，除了继续辛苦工作，他们“别无选择”。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "一个颇为得体的自证方法。给予所有人工作，让所有人都去工作，通常被视为治愈因社会（暂时）的不完美、不成熟导致的一切弊病和麻烦的良方。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作为人们提供了生活所需，工作类型决定了他们在生活中、在“社会”中的合理地位。工作是决定社会地位和自我评价的主要因素：除了那些由于世袭或暴富，可以自给自足悠然生活的人以外，“你是谁”这个问题的答案通常指向人们所在的公司以及该公司的能力。在一个擅长分类且喜欢分类的社会里，工作类型是一种关键的、决定性的分类，是所有其他社会生活的锚点。它将人们分类，让他们找到自己的位置，尊重自己的上级，让下级服从自己。工作类型也定义了人们应该匹配的生活标准，定义了他们应当与谁为伍，应当与谁划清界限。职业生涯标记了人生的旅程，是回溯人生成败最重要的记录，是自信与彷徨、自满与自责、骄傲与耻辱的主要源头。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工厂是现代社会最主要的“圆形监狱”。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工厂生产花样繁多的商品，除此之外，它们也生产顺从于现代国家的公民。第二条生产线并不突出，也很少被提及，但绝非附属。相对于工作生产物质财富的显性功能，它确保了一项更基本的功能——人在社会上的生存。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "失业的人变成了无根浮萍，无人控制，无人监督，不受任何惩罚性规制约束。难怪在19世纪，具有社会意识的医疗科学定义的健康典范，是够胜任工厂工作和兵役的男性形象。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "如果让大部分男性进入工厂工作是生产和维持社会秩序的主要手段，那么以（“养家糊口”的）男性为绝对权威建立强大、稳定的父权制家庭，就成为一个必要的补充。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "在现代安排(modern arrangement)的所有三个可分析层面（个人、社会和系统），工作都占据了重要的位置。此外，正是借由工作，这三个层面联系在一起，实现了彼此之间的沟通和协调。\n因此，现代化体系的实现过程中，工作伦理居功至伟。对于现代工业社会的日常运作和持续发展而言，资本和劳动的共同参与必不可少。工作伦理把这种共同参与视为所有成员（更确切地说，所有男性成员）的道德责任和使命。工作伦理要求人们心甘情愿地、欣然地、热情地拥抱一种无法避免的必然——新经济的实践者在新国家立法者的协助和合谋下，竭尽全力提供的这种不可避免的困境。心甘情愿地接受这种必然，就意味着彻底放弃了对外来的、痛苦的、强加的新规则的抵抗。在工作场所，工人的自治权是不被容忍的。工作伦理要求人们选择一种献身于劳动的生活，但这也就意味着没有选择、无法选择和禁止选择。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作伦理是一种工具，目的是使工人们丧失独立性，服从于工厂制度。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "只是推动工业体系前进的可选手段之一", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作不需要被热爱，也不需要被认为是道德的象征，人们可以公开反感工作，这不会招致纪律的崩坏，因为他们相信当下的忍耐（哪怕是最恶劣的境况）是为了并不遥远的自由而暂时付出的代价。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "美国梦劝告人们，所有工厂里遭受的苦难只是暂时的烦恼，屈从老板的虚妄只是成为老板的必经之路。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "这个新的出路是“物质激励”：对那些放弃自身独立性，服从工厂纪律的工人给予奖励。过去道德说教实现的成就，正越来越多地通过“胡萝卜”的诱惑（无论是否配以“大棒”的协助）来实现。与其宣扬努力工作通向道德高尚的生活，不如告诉大家这是赚取更多金钱的手段。不要在意“更好”，“更多”才是最重要的。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "现在，衡量人们声望和社会地位的是工资的差别，而不是勤于工作的道德或惰于工作的罪恶", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "以经济水平评判人的价值和尊严的倾向", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "这也把人的动机和对自由的渴望牢牢地、不可逆地转向消费领域。这些影响在很大程度上决定了现代社会后续的发展——从生产者社会转向消费者社会。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "我们身处消费者社会。\n我们或多或少都知道，“消费者”意味着什么。顾名思义，消费者是消费的人，消费意味着把东西消耗殆尽：吃穿用度，或以其他方式满足自己的欲望。我们所处的世界，绝大多数情况下，金钱是满足欲望的桥梁，所以作为一个消费者通常也意味着，占有那些注定要被消费的东西：付费购买它们，使其成为自己的专属财产，禁止其他人未经许可使用它们。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费也意味着毁坏。在消费的过程中被消费的事物将不复存在。它们或者在物理上湮灭，如被吃掉或耗尽；或者被剥夺了原本的吸引力，无法再唤起欲望，如被过度使用的玩具或频繁播放的唱片，不再适于消费。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "说我们的社会是一个“消费者社会”，相应的，之前的那个社会（上一章中描述的现代社会的工业化阶段）可以称为“生产者社会”——尽管人类自诞生起就从事生产，并将持续生产直到人类灭亡。之所以称之为“生产者社会”，是因为那时人们主要以生产者的身份参与其中。社会塑造其成员的方式由社会分工的需要决定，社会希望其成员有能力和意愿参与社会分工。在当前这个近现代(late-modern)、次现代(second-modern)或后现代(post-modern)阶段，社会主要要求人们以消费者的能力参与其中，首先依照“消费者”角色需要塑造其成员，并期望他们具有消费的能力和意愿。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "从生产者社会到消费者社会的变迁带来许多意义深远的变化，其中最重要的涉及人们被培养、训练以符合社会认同要求的模式，也即人们融入社会秩序并获取自己一席之地的模式。", "y": "", "d": "2024-02-25"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "圆形监狱的训练方式不适合培育消费者。那套体系擅长训练人们习惯例行的、单调的行为，并通过限制选择或完全取消选择巩固效果。然而，不因循守旧、持续进行选择恰恰是消费者的美德（实际上是“角色要求”）。因此，圆形监狱式训练不仅在后工业化时代大幅减少，而且与消费者社会的需求背道而驰。它擅长培养的气质和生活态度，与理想的消费者大相径庭。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "理想状态下，消费者应该不固守任何东西，没有永久的承诺，没有可以被完全满足的需求，也没有所谓的终极欲望。任何承诺、任何忠诚的誓言，都应该有一个附加的有效期。契约的有效期、既定的时效是最关键的，比契约本身更重要，它不应该超过满足欲望的消费所花费的时间（或欲望消退的时间）。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费总是需要花费时间的，这是消费者社会的桎梏，也是消费品商人的主要烦恼。理想情况下，消费者立刻得到满足——消费应该立刻带来满足感，没有时延，不需要旷日持久的技能学习和准备工作；而一旦消费行为完成，这种满足感就应该尽可能快地消失。如果消费者无法对任何目标保持长期关注和欲望，如果他们没有耐心、焦躁、冲动，尤其是容易激动，又同样容易失去兴趣，“即时满足”就达到了最佳效果。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "如果欲望不用等待就能充分满足，消费者的消费能力可能会远远超越所有先天、后天的需求的限制，或超越消费品物理耐久性的限制。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "对满足感的期待或期望会先于需求，并总是大于现存需求，但又不至于大到使人失去欲望。事实上，越是陌生的需求越具吸引力，能获取的未知生活体验会带来大量的乐趣。前所未有的新鲜的兴奋感，就是消费者游戏的秘密。马克·C.泰勒(Mark C.Taylor)和埃萨·萨里宁(Esa Saarinen)说，“欲望不求被满足。恰恰相反，欲望永无止境”￼，至少这描述了一个理想的消费者的欲望。欲望逐渐消失、消散，看不到复生的征兆，或世界上已经没有什么值得人们向往，这一定是理想的消费者最毛骨悚然的噩梦。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "想要提高消费者的消费能力就不能让他们休息。他们需要不断地接受新的诱惑，持续处于永不枯竭的兴奋之中，持续处于怀疑和不满之中。诱使他们转移注意力的诱饵需要肯定这种怀疑，同时提供一个宣泄的出口：“你以为这就是全部？好戏还在后头呢！”", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "在正常运转的消费者社会中，消费者会主动寻求被诱惑。他们的生活从吸引到吸引，从诱惑到诱惑，从吞下一个诱饵到寻找另一个诱饵，每一个新的吸引、诱惑和诱饵都不尽相同，似乎比之前的更加诱人。他们生活于这种轮回，就像他们的先辈，那些生产者，生活于一个传送带和下一个传送带之间。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "本来是市场选择了他们，并把他们培养成消费者，剥夺了他们不受诱惑的自由，但每次来到市场，消费者都觉得自己在掌控一切。他们可以评判、评论和选择，他们可以拒绝无限选择中的任何一个——除了“必须作出选择”之外。寻求自我认同，获取社会地位，以他人认为有意义的方式生活，这些都需要日复一日地到访消费市场。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "近年来，各个政治派别异口同声地积极鼓吹“消费主导经济复苏”。产出不断下降、订单簿空空如也、商业街门可罗雀，这些都被归咎于消费意愿或“消费者信心”的不足（消费者信心意味着消费者通过信贷消费的欲望强烈到足以压倒对破产的恐惧）。解决所有麻烦、重获转机的希望被寄托于消费者重拾他们的义务——再次购买，大量购买，不断购买。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "“经济增长”是衡量现代社会是否正常有序运行的首要标准。在消费者社会中，与其说经济增长取决于“国家生产力”（即健康充裕的劳动力、充实的财政收入、勇往直前具有企业家精神的资本所有者和经营者），不如说取决于消费者的热情和活力。消费取代了工作，把个人动机、社会整合和系统再生产链接在一起。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "长期的、有保障的、确定性的工作已经很少见。那种古老的、“终身制”的，甚至是世袭的工作岗位，只限于少数古老的行业或职业，数量也正迅速萎缩。新的工作机会设置了期限，到期后的安排另行通知，或者干脆是兼职。它们经常和其他岗位合并，没有任何持续性保障，更不用说永久就业。今天流行的口号是“灵活”，这个越来越时髦的概念代表的是一场几乎没有任何规则的雇佣和解雇游戏，而且在游戏进行时，单方面就可以随时更改规则。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "变化多端、无限创新、飘忽不定的消费品市场，可以很好地解决这类担忧。无论是耐用品，还是易耗品，从定义上来说，消费品就不打算永久存在，不可能提供什么“终身的服务”。消费品意味着消耗殆尽，时间性和短暂性是其内在特征；消费品遍体写满了死亡警告，尽管用的是一种隐形墨水。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "任何规范的唯一目的，都是利用人们自由选择的能动性来限制或完全消除选择自由：除规范所倡导的选项外，人们别无其他选择。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "更多税后收入的吸引力，与其说是来自更多消费，不如说是来自有了更多消费选择的预期、更多购物和选择的乐趣。这种能够更频繁行使选择权的期望具有惊人的诱惑力。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费者恰恰相反。消费彻头彻尾是一种个人的、独立的乃至孤独的活动。这种活动通过不断地满足和唤醒、缓释和激发某种欲望实现，这种欲望通常是一种私人的、难以言表的感觉。根本就不存在什么“集体消费”。在消费过程中消费者确实可能会聚在一起，但即便如此，消费的本质仍然是一种彻头彻尾孤独的、私人的生活体验。聚集只不过凸显了消费行为的私密性，增强了其乐趣。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "选择的自由设定了消费者社会的阶层，设定了消费者社会的成员（消费者）绘制生活理想的框架，为他们定义了自我改善的方向，以及“美好生活”的图景。一个人选择的自由度越大，自由行使的选择权越多，他/她在社会阶层中的地位就越高，获得的社会尊重和自尊就越多，距离“美好生活”的理想也越近。当然，财富和收入也很重要，否则消费选择就会受到限制或被完全剥夺。它们作为资本（用于赚取更多金钱的金钱）的用途没有被遗忘，但是逐渐退居次席，让位于扩大消费选择的范围。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "储蓄增加和消费信贷萎缩绝对是坏消息，信贷的膨胀才是“事情朝正确方向发展”的可靠信号，受到欢迎。消费者社会不会轻易呼吁延迟满足。这是一个信用卡社会，而非存折社会。消费者社会“活在当下”，物欲横流，没有耐心等待。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "诱惑，炫耀未曾经历的奇景，承诺前所未有的体验，贬低尝试过的一切，才是最有效的。当然，前提是信息要有效传达给接收者并将他们的目光都聚焦在那些令人激动的未知体验上。消费，愈发多样化、愈发丰富的消费，对消费者来说必须是一种享受，而不是折磨他们的义务。消费者必须以审美趣味为导向，而不是以道德规范为导向。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费者社会也是咨询和广告的天堂，是预言家、算命先生、贩卖魔法药水的商人和点金术士的沃土。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费美学取代了工作伦理的统治地位。对于合格的消费者来说，世界是一个充满可能性的巨型矩阵，包含着更强烈的感受和更深刻的体验。评判世间万物的标准是激发人们感受和体验的能力——唤起欲望的能力，这是消费生活中最愉悦的阶段，比欲望得到满足更令人陶醉。根据这些能力的差异，所有的人、物、事件被标记在地图上。最常用的地图是美学的，而不是认知的或道德的。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "工作现在首先受到美学的审视。工作的价值取决于产生愉悦体验的能力，不能使人获得“内在满足”的工作没有价值。其他评判标准（包括所谓的道德救赎）则节节败退，无力使某些工作摆脱被美学社会视为“无用”，甚至有损身份的责难。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "从伦理学的角度，严格地说任何工作都有价值，没有哪个低人一等，所有工作都能增加人的尊严，都同样服务于道德得体和精神救赎的事业。工作伦理认为，所有工作就本身而言都是“人性化的”，不管从事者得到的是什么直接乐趣（或没有乐趣）。尽职尽责能带来最直接、最具决定性、最充分的满足感。在这个方面，所有工作都是平等的。有少数幸运儿能够把职业作为真正的使命，并在自我实现时体验到引人入胜、令人沉醉的满足感，但这通常被归因为“职责完成得很好”的意识。这种意识对所有工作的执行者都是成立的，即使是那些最卑微、最没有吸引力的工作。工作伦理传达了一种平等的信息，它淡化了工作之间原本显著的差异，包括带来满足感的能力、带来地位和声望的能力，以及能够提供的物质利益。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "对工作的美学审视则截然不同。它强调了区别，放大了差异。它把某些职业提升到引人入胜的程度，赋予其精致的美学内涵、真正的艺术性体验；其他那些为了生计获取报酬的职业则根本没有任何价值。这些“高大上”的职业对其欣赏者有同等的素质要求——良好的品位、足够的修养、独到的眼光、无私的奉献精神和优秀的教育。其他类型的工作一律被认为是悲剧，一文不值，无论如何也不可能成为人们心甘情愿、自由选择的标的。只有在迫不得已的情况下，在无法获得任何其他生存手段的情况下，才有人会从事这类工作。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "美学已取代伦理学，主导了工作的价值判断。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "工作必须是“有趣的”——多样化、令人兴奋、具有挑战性，包含适度的风险，并不断带来崭新的体验。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "那些单调、重复、例行、缺乏冒险精神、不允许创新、没有挑战、无法带来提升和自信的工作，就是“无聊的”。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "工作的美学价值成为消费者社会的一个有力的层级化因素。诀窍不再是最小化工作时间以腾出更多的休闲空间，而是相反，完全抹去工作与兴趣、爱好、娱乐之间的界限，把工作本身变成最令人愉悦的娱乐。娱乐式工作是一种最令人羡慕的特权，那些有幸得到这种特权的人，一头扎进工作提供的强烈感官享受和令人兴奋的体验中。“工作狂”没有固定的工作时间，7×24小时地专注于工作的挑战。这些人并非过去的奴隶，而是当下幸运和成功的精英。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "富有成就感的工作，能够自我实现的工作，作为人生意义的工作，作为生活核心的工作，作为骄傲、自尊、荣誉和名声的源泉的工作，简而言之，具有使命感的工作，成为少数人的特权，成为精英阶层的特有标志。其他人只能敬畏地远观、艳羡，只能通过低俗小说和肥皂剧来体验。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "这样一来，勤奋和奉献的劝诫显得虚伪、空洞，理智的人最好能够洞察本质，看穿老板所布置游戏中的“使命感”外衣。老板其实并不指望员工们相信自己说的是肺腑之言，他们只希望彼此对这场游戏心照不宣，并据此行事。对老板来说，员工若真的接受所谓的“使命感”会积聚麻烦，下一次“裁员”或“合理化”时，这些麻烦就会爆发。道德说教或许可以在短期获得成功，但长远来看都会适得其反，因为这会转移人们的注意力，使他们偏离真正的使命——身为消费者的追求。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "然而，明星收获的东西多么令人赞叹，他们失去的东西就多么令人胆寒。代价之一是这种荣耀过于短暂，明星从不知名处跃入苍穹，最终又回到不知名处销声匿迹。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "界定了规范也就界定了不正常。工作伦理规范把不正常概括在失业现象中——“不正常”就是不工作。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "把穷人的悲惨遭遇归咎于他们不愿意工作，指控他们道德沦丧，把贫穷说成是对罪恶的惩罚，这是工作伦理在新的消费者社会能做的最后贡献。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "人类历史的大部分时间里，贫穷意味着直接威胁人的物理生存——因为饥饿、病重时无人照顾或缺乏住所而面临死亡的威胁。目前全球仍然有很多地方面临着这样的危险。即使提升穷人的生存条件，使他们脱离仅能勉强生存的境遇，贫穷仍意味着营养不良、变幻莫测的气候的威胁和无家可归——相较于特定社会中公认的营养、衣着和住宿的应有标准而言。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "贫穷并不仅限于物质匮乏和身体上的痛苦，也是一种社会和心理状况。每个社会都有“体面生活”的衡量标准，如果无法达到这些标准，人们就会烦恼、痛苦、自我折磨。贫穷意味着被排除在“正常生活”之外，意味着“达不到标准”，从而导致自尊心受到打击，产生羞愧感和负罪感。贫穷也意味着与既定社会的“幸福生活”无缘，无法享受“生活的馈赠”。随之而来的是怨恨加剧，并以暴力行为、自惭形秽或兼而有之的形式表现出来。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费者社会中，“正常生活”是合格消费者的生活，他们专注于从各种公开的机会中选择，以获取愉悦的感受和生动的体验。“幸福生活”的定义是：抓住很多机会，错过的机会很少，甚至没有，抓住最被人乐道、最被羡慕的机会，而且最好捷足先登，不落于人后。和其他各类社会一样，消费者社会的穷人没有机会过上正常生活，更不用说过上幸福生活。在消费者社会中，一个人无法幸福地生活，甚至无法正常地生活，就意味着他/她是失败的消费者，或者说是有缺陷的消费者。所以，消费者社会的穷人，被社会，也被其自身定义为有瑕疵的、有缺陷的、不完美的、先天不足的消费者。简而言之，就是不合格的消费者。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "正是这种不合格、这种无法履行消费者义务的无能，转化为痛苦，他们被抛弃、被剥夺、被贬低、被排除在正常人共同享用的社会盛宴之外。克服这种不合格被视为唯一的救赎，是摆脱屈辱困境的唯一出路。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "消费世界不允许“无聊”存在，消费文化致力于消除它。按照消费文化的定义，幸福的生活是绝缘于无聊的生活，是不断“有什么事发生”的生活，新鲜又刺激，因为新鲜所以刺激。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "弗洛伊德在消费时代来临之前指出，并不存在所谓的幸福状态，我们只有在满足了某个令人烦恼的需求时，才会获得短暂的幸福，紧接着就会产生厌倦感。一旦欲望的理由消失，欲望的对象就失去了诱惑力。然而，事实证明，消费市场比弗洛伊德更有创造力，它唤起了弗洛伊德认为无法实现的幸福状态。秘诀在于：在欲望被安抚之前激发新的欲望，在因占有而感到厌倦、烦躁之前替换新的猎物。永远不出现厌倦——这才是消费者的生活准则，也是切实可行的准则、触手可及的目标。达不到这个目标的人只能怪自己，并容易成为他人鄙视和谴责的对象。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "想要缓解无聊，就需要花钱。如果想一劳永逸地摆脱这个幽灵的纠缠，达到“幸福状态”，就需要大量的金钱。欲望是免费的，但实现欲望，进而体验实现欲望的愉悦状态，需要资源。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "它们存在的意义是让欲望不断沸腾，永不停歇，也无法停歇，但由于预期的满足而深感欢愉。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "当今社会依赖于“制造人为的、主观的不满足感”，因为本质上“人们满足于自己拥有的东西才是最可怕的威胁”。￼于是，人们真正拥有的东西被淡化，被贬低，被较富裕的人锋芒毕露的奢侈消费所掩盖：“富人成为被普遍崇拜的对象。”", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "对富人唯一重要的是他们的财富为他们打开的广阔前景。他们看起来确实是以消费美学为指引的，他们对消费美学的掌握（而非对工作伦理的服从和经济上的成功）才是他们高人一等的核心，是他们获得普遍崇拜的原因。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "穷人的贫困不但因经济增长而加剧，也因经济衰退和停滞而加剧”。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第二章 从工作伦理到消费美学", "x": "在穷人变得更贫穷的同时，非常富有的人——那些消费美德的典范——却更加富有。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第三章 福利国家的兴衰", "x": "国家有责任和义务保障其所有公民的“福利”——不仅仅是维持生计，而是在身处的社会中有尊严地生存。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第三章 福利国家的兴衰", "x": "通过对被排斥者的污名化，社会主流人群的真正或假定的价值得到了强化：“观察者通过构建他人来构建自己。”", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第三章 福利国家的兴衰", "x": "为什么大多数人现在更喜欢作为消费者进行选择，而不是规避风险，依赖满足所有基本需求的保障型供应？", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "19世纪初，工作伦理的传道者非常清楚他们在宣扬什么。当时，劳动是财富的唯一来源，生产更多的东西基本等同于让更多的人参与生产过程。渴望生产更多产品的企业家队伍不断壮大，不愿意按照企业家提出的条件工作、生产的穷人也越来越多。可想而知，工作伦理可以调和两者的矛盾。工作不仅能够使国家富强，也能帮助个人脱贫致富，这种理念听上去很真诚。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "消费市场做好了准备，并愿意提供这种场所。曾经由专业能力带来的自豪感，现在可以从（以合适的价格）购买精美商品中获得——在迷宫般的大型购物中心发现最好的“店铺”，发现推车上最好的衣服或货架上最好的商品。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "资本家雇用工人不再受限于本地劳动力市场，因此，他们选择基地的首要标准是利润最大化，以及充足的低要求、温顺、不会招惹麻烦的劳动力。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "他们对迷宫法则的熟稔”￼。他们“喜欢创造、竞争和迁移”，他们生活在一个“没有固定价值观、对未来无忧无虑、自我主义和享乐主义”的社会。他们“享受新鲜事物，崇尚冒险精神，唯变化为永恒，以交融为富足”。他们都在不同程度上掌握并实践着“液态生活”(liquid life)的艺术：接受方向的迷失，免疫于晕头转向，容忍旅行计划和方向的缺失，以及无限期的旅行。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "东方预言家老子的超脱和宁静获得启迪，他描述了最可能达到这种效果的生活立场：\n如水般流淌……你灵动前行，顺势而为，从不停顿太久，成为一潭死水，也不依附河岸或礁石——生命中过往的财物、情境或人，甚至不固守自己的见解和世界观，而是聪明地轻轻抓住任何出现在路边之物，随即放手，让它随风而逝……", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "失业”(unemployment)一词，之前通常用于指向没有工作收入的人，它表达出就业才是“正常态”这个假设。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "把工作神话为人类的最高职责、高尚道德的体现、法律和秩序的保障，以及治愈贫困的良方，这种做法与劳动密集型产业产生过共鸣，因为劳动密集型产业需要更多的劳动力以增加产量。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "“经济增长”和就业率的提升，实际上是相互矛盾的；技术进步是以劳动力的替代和淘汰为标准的。在这种背景下，工作伦理的劝诫显得愈发空洞，它不再符合“产业的需要”，也很难被描绘为实现“国家财富”的必经之路。工作伦理能够持续存在，或者说近来在政治主张中有所复苏，只能解释为：在我们这样的后工业时代，在这个消费者社会，人们期望它发挥一些新的作用。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "这个社会中没有哪个行业或职业能够确信自己的长期有用性；这也是底层阶级的危险性为社会提供的一项重要服务——这个社会被太多焦虑困扰，人们根本无法分辨究竟在恐惧什么，如何减缓这种恐惧。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "必须具备发现机会的能力，具备拥抱它们的能力：一些智慧、一些意愿和一些努力。穷人很明显缺少这三种能力。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "：一开始，工作伦理是一种非常有效的手段，它可以帮助急需劳动力的工厂迅速扩充人员。随着劳动力迅速变成提高生产力的障碍，工作伦理仍然可以发挥作用，但这次是作为另一种有效手段：洗涤社会中正常人的双手和良知，帮他们从抛弃同胞致使同胞永久失业的罪责中摆脱出来。在对穷人的道德进行谴责的同时，对非穷人的道德实施赦免，通过这种双管齐下的方法，达到双手和良心的洁净。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "底层阶级在当今富裕社会最重要的作用之一，就是吸纳恐惧和焦虑，过去强大的外部敌人扮演了这个角色，但他们已不复存在。底层阶级是内部的敌人，注定要取代外部敌人，成为保持社会健康的关键药物，成为源于个体不安全感的社会紧张的安全阀。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "消费者需求越大（即市场诱导越有效），消费者社会就越安全，越繁荣。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "那些有欲望并能满足自己欲望的人（已经被诱惑并能按照诱惑的期望行动的人）与那些已经被诱惑却无法按照期望采取行动的人，两者之间的差距越拉越大。市场诱惑，既是伟大的均衡器，也是伟大的分化器。为了取得效果，消费的诱惑、消费更多的理念必须传达到每一个角落，不加区别地传达给每一个愿意聆听的人。然而，总是存在不能够按照诱惑的期望付诸行动的人，他们每天面对着那些获得满足的人展示的令人眼花缭乱的景象。这些人被告知，奢侈的消费是成功的标志，是赢得公众掌声和名誉的捷径。他们还了解到，拥有和消费某些商品，践行这种生活方式，是幸福的必要条件，甚至是实现人类尊严的必要条件。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "如果消费是衡量成功人生的标准，衡量幸福的标准，甚至是衡量尊严的标准，那么人类欲望的潘多拉之盒已经打开，再多的购买和刺激的感觉，都不能唤回过去“达到标准”带来的满足感：现在根本就没有标准可言。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "所有的地方、所有的渠道，传来的都是无比清晰的声音：除了攫取更多，没有其他标准", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 工作伦理和新穷人", "x": "在市场主导的消费者社会中，对那些无法实现欲望的玩家来说，解除他们的武装，剥夺他们的权利，镇压他们，就成为“通过商品诱惑整合社会”这个策略的必要补充。无能、懒惰的玩家必须被排除在游戏之外，他们是这场游戏的废弃品，只要不停止游戏，不停止吸纳参与者，这种废弃品就会源源不断地产生。不停生产这种废弃品还有个重要原因：需要让仍在参与游戏的人看到作出其他选择的可怕后果（他们也被告知这是唯一的后果），这样他们就能够忍受，并愿意忍受这场游戏给他们的生活带来的艰辛压力。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第五章 全球化之下的工作与过剩", "x": "资本主义初期，其动力来自征服并殖民“处女地”——把生产者和生产资料分离，把商业活动和家庭经济分离，从而把非现代化的生活带入市场经济的轨道，并将其变成资本的牧场。一旦这项工作完成，可以改造的“处女地”所剩无几，现代资本主义社会的进一步生存就取决于把已经现代化的部分进一步现代化。这个过程最近被封装在“资产剥离”(asset stripping)这个新潮的概念里。这个重要转变让人们留意到一直存在却又一直被疏忽的现代创造力的特点：它的破坏性。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第五章 全球化之下的工作与过剩", "x": "全球化远没有做到为所有人提供就业和技术，“一些跨国公司正在压榨最贫穷的落后国家，以获取难以想象的利润。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第五章 全球化之下的工作与过剩", "x": "这些商品确实取悦于消费者，但根本无法拯救其生产者于苦难。“耐克运动鞋的轨迹可以追溯到越南的血汗工厂，芭比娃娃的衣服可以追溯到苏门答腊的童工，星巴克的拿铁咖啡可以追溯到危地马拉被烈日炙烤的咖啡园，壳牌石油则可以追溯到尼日尔三角洲被污染的贫困村庄。”", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第五章 全球化之下的工作与过剩", "x": "市场竞争造成的就业环境不稳定，是且将继续是人们对于未来不确定性、对于社会地位和自尊的不安全感的主要根源。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "人存于世的方式多种多样，但每个社会只会选择它偏爱或容许的方式。如果我们把某个人类的集合称为“社会”，那就意味着这些人归属于同一个集合，构成了一个整体。这正是社会作出选择的结果。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "正是这种选择，或者说这种选择的持续沉淀，使得不同的集合大相径庭，当我们谈论不同的社会时，谈论的就是这种不同。一个特定的集合是否是一个“社会”，它的边界在哪里，谁属于或不属于这个集合构成的社会，都取决于作出选择和推动选择的力量，取决于它对个体的控制力和个体的服从程度。这种选择归结为两种强制力，或者说，一种具有两种效果的强制力：秩序和规范。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "渴望把人类世界变成一个无机的世界，在那里一切都完美运行，按部就班，服从于一个超越个体的系统。然而，向往秩序就是向往死亡，因为生命本身就是不断破坏秩序的过程。或者换句话说：对秩序的渴望是一种堂皇的托辞，是强烈厌世的借口。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "任何秩序都在不顾一切地把一致性、规律性和可预测性强加给人类世界，但人类倾向于多样化、反复无常、不可预测。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "人的存在就意味着不断选择并推翻选择，而要阻止人们进一步选择，使当下的选择不被推翻，则需要付出相当大的努力。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "规范告诉人们，在一个秩序井然的社会中，有秩序的行为意味着什么；", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "就秩序而言，被流放、被驱逐的是那些“违反秩序”的人；就规范而言，则是那些“不符合规范”的人。无论哪种情况，责任主要都在于被驱逐者，秩序和规范都预置了责任，先验地决定了“罪”与“罚”。是被驱逐者自己错误的行为，使他们成为被驱逐的对象，他们自己需要承担主要责任。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "这些观点忽略了一种可能性，也阻止人们思考这种可能性，即被驱逐的人可能根本无力对抗自己不幸的命运，更遑论控制。有些人可能只是因为自己的出身“违背了秩序”。他们因为自己无法决定的一些特质而被驱逐，他们没有做错什么，只是“像他们这样的人”不符合其他人的秩序观。另一些人或许也不是因为缺乏意愿而“达不到规范”，而是因为缺乏某些必要的资源——其他人有而他们没有的资源。这些资源供不应求，不可能所有人都充分拥有。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "人们普遍认为，穷人往往安于现状，不会为了更多利益而拼命工作，所以他们的工资必须保持在满足生存的最低水平。这样一来，即使有了工作，穷人也只能勉强糊口，就会为了生存而保持忙碌。用阿瑟·杨格(Arthur Young)的话说，“只要不是白痴，所有人都知道底层阶级必须保持贫穷，否则他们永远不会勤奋”。学识渊博的经济学家忙不迭地立即证明，当工资保持在低水平的时候，“穷人会做更多的工作，实际上生活得更好”，而他们领取高工资时，他们就迷失于无所事事和聚众闹事。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "当今社会主要把其成员看作消费者，其次才部分地将其成员看作生产者。想符合社会规范，成为一个合格的社会成员，就需要对消费市场的诱惑作出及时有效的反应，需要为“清空供给”作出贡献，需要在经济环境出现问题时，积极参与“消费者主导的复苏”。穷人没有体面的收入，没有信用卡和美好前景，他们达不到要求。今天穷人打破的社会规范——使他们“不正常”的规范，是消费能力规范而非就业规范。今天的穷人是“非消费者”，而非“失业者”。他们首先被定义为有缺陷的消费者，因为他们没有履行最重要的社会责任——积极有效地购买市场提供的商品和服务。消费者社会的资产负债表中，穷人明显是负债，无论如何也不能把他们记入现在或未来的资产。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "为了使物理隔离万无一失，人们还可以用精神隔离加强效果，把穷人从道德同情的世界中彻底驱逐出去。在把穷人驱逐出街头的同时，还可以把他们驱逐出整个人类社会，驱逐出道德责任的世界。这是通过改写故事实现的：把剥夺的故事改写为自甘堕落的故事。穷人可以作为“嫌疑惯犯”，一旦日常秩序中出现问题，他们就成为公众追捕的对象。穷人被描绘为懒散、罪恶、缺乏道德标准的人。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "我们越来越失去了对世界质疑的能力", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "我们将不得不放弃目前生活模式中一些神圣不可侵犯的假设（由于缺少反思，它们显得更加神圣）。例如，效率是一件好事，无论它目的何在，也无论它是否会带来痛苦的副作用。再例如，凡是“经济增长”的东西，即统计意义上“今天比昨天多，明天比今天多”的东西，就是好的，而无视其增长过程中对人类生存环境和自然（全人类共享的生存环境）造成的损害。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第六章 新穷人的前景", "x": "对那些因为需要作出巨大的转变而反对的人，我们只能再次引用科尼利厄斯的话来回答。当一个采访者问他：“那么，你想要什么？改变人类吗？”，卡斯托利亚蒂斯回答说：“不，没有那么夸张：我希望人类改变，正像他们已经改变过两三次那样。”[插图]至少现在还有希望，人类能够再次完成同样的壮举。毕竟，正如帕特里克·库里(Patrick Curry)所言，“群体自愿的返璞归真，正成为群体贫困的唯一有意义的替代。”[插图]", "y": "", "d": "2024-02-23"}]}, {"id": "573318", "title": "论人类不平等的起源和基础（果麦经典）", "author": "[法]卢梭", "cats": ["哲学宗教-西方哲学"], "bmCount": 119, "rvCount": 0, "notes": [{"k": "h", "c": "第2章 致辞：献给日内瓦共和国", "x": "我愿意为自己选择这样一个国家：它幸运地没有那么强大的力量，因而没有征服他国的野心，同时更幸运地拥有一个有利的地位，因而也不用害怕他国的征服。", "y": "", "d": "2024-04-17"}, {"k": "h", "c": "第2章 致辞：献给日内瓦共和国", "x": "这个国家除了它自己本身以外，应该是无所畏惧了。", "y": "", "d": "2024-04-17"}, {"k": "h", "c": "第2章 致辞：献给日内瓦共和国", "x": "而对于你们而言，幸福已然存在，你们只需静心享受；只要你们能够满足于自己的幸福，你们便能够获得至高无上的幸福", "y": "", "d": "2024-05-10"}, {"k": "h", "c": "第3章 序", "x": "我们如何在不了解人类的前提下去探讨人类的不平等", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第3章 序", "x": "我们如何能够分清人类特征中哪些是其固有特征，哪些又是环境和进步在其原始状态基础上的增加或改变？", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第3章 序", "x": "这正如那人类灵魂在社会中扭曲的面孔，由于不断发生的上千种原因，在接受诸多知识与谬误的过程中，在身体构造不断变化的过程中，以及在情欲的不断冲击下，它早已改变了原有的样子，变得让我们几乎难以辨认了。我们看到的已经不再是那些根据固定不变的准则行事的存在，不再是具有造物者赋予他们的卓越、崇高的简单的存在，而是自认为合理的情欲与处于错乱状态中的智慧的畸形对立。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第3章 序", "x": "我们获得越多的新知识，就越无法获得理解最重要事情的途径。也就是说，我们越是努力地去研究人类，就越无法理解人类。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第3章 序", "x": "我们应该从人类构造的一系列变化中去寻找将人类区分开来的差别的最初源头。这里存在着一个共识，即人类和其他所有物种一样，在最初状态下是平等的，直到不同的生理原因使一些物种发生一些可以被我们观察到的变化。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第3章 序", "x": "理清人类现在的特征中哪些是最初的特征，哪些是非自然的特征", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第3章 序", "x": "我从那里看到了先于理性存在的两大原则，其中一个原则让我们对自己的幸福(bienêtre)和自我保存产生浓厚的兴趣，而另一个原则就是在看到所有感性存在尤其是同类死亡或者痛苦时会产生天然的反感情绪。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第4章 本论", "x": "我认为在人类中存在两种不平等：一种我称之为自然的或是生理的不平等，这种不平等是由自然造成的，主要体现在年龄、身体、体力、智力以及心灵方面；另一种我们可以称之为精神的或是政治的不平等，这种不平等依靠一种公约，在人类共识的基础上被建立起来，或者至少为人类共识所认可，主要体现为少数人通过损害他人利益而享有的各种特权，例如更加富有、更加尊贵、更加强大，或者甚至让他人臣服。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第4章 本论", "x": "首先，要指出在事物发展进程中，法律得以代替暴力、自然得以服从规律的转折性时刻；其次，要解释通过怎样的一系列“奇迹”，才能使强者服务于弱者，使人民能够以牺牲真正幸福为代价，最终获取一种空想的安宁。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第4章 本论", "x": "所有研究过社会基础的哲学家都意识到了回归“自然状态”的重要性，却没有任何一个做到了这一点。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "第4章 本论", "x": "如果任由人类自由发展，他们的命运将会如何？", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "对于这样的人类，当我们将所有那些后天得到的超自然力量，以及所有那些只有经过长期进化才能获得的非自然能力从他们身上除去，总之，就是将其设想为出自大自然之手时，一个并不比别的动物更加强大或是敏捷，但其构造却是所有生物中最有优势的一个动物。我看见他在橡木树下进食，在任意一条溪流边解渴，在为他提供食物的树下睡觉。就这样，他的需求便已经被完全满足了。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "生活方式的极度不平等导致有的人悠闲过度，而有的人却劳累不已；我们的食欲和性欲都太过容易地被刺激着和满足着；富人家的食物过于精致，他们只摄入增加热量的精华部分，从而减弱了自身的消化功能，而穷人家只能吃粗茶淡饭，而且经常食不果腹，因此一有机会他们便不免贪吃，从而加重了肠胃的负担。彻夜不眠以及种种过度行为；各种情欲的放纵、身体的疲惫以及精神的衰竭；所有状态下的人类都感受到了无尽的忧伤与痛苦，他们的灵魂也因此被无休止地侵蚀着。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "我们所经历的大多数苦难都是我们咎由自取的结果，同时，如果我们能够维持自然赋予我们的简朴、单纯、孤单的生活方式，我们本可以避免所有这些苦难。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "处于自然状态下的人类疾病源头那么少，因此他们既不需要药物，更不需要医生。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "从猎人那里我们不难了解到，他们在捕猎过程中是否经常遇到很多残疾的猎物。他们曾经遇到过不少动物，这些动物虽然身体受过严重创伤，但最终还是很好地结了疤。当它们的骨头甚至是四肢被折断时，在没有外科医生的情况下，它们仅仅依靠时间以及自身机能也能很好地恢复，而不用深受手术刀切口的折磨，也不用被麻醉剂毒害，更不用被禁食弄得筋疲力尽。最后，无论精良的医术对于我们而言有多么地重要，我们总可以断言，虽然野蛮人在受伤时孤立无援，只能依靠自然，但是另一方面，他也只需要为自身的这一损伤担忧。这样说来，他的处境似乎要好过我们。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "无论是马、猫、牛还是驴，生活在丛林中的它们总是比被圈养在家中的它们体格更加强健，精力更加充沛，力量和勇气更加旺盛。它们一旦变成圈养动物，所有这些优势就会丢失大半。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "我们对这些动物所有的照顾与喂养都只会让它们退化。人类又何尝不是如此：在群居与奴隶化的过程中，他逐渐变得虚弱、胆小、卑躬屈膝，安乐而又萎靡的生活方式使他不再充满力量与勇气。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "就算原始人赤裸着身子，居无定所，缺乏所有那些我们认为必不可少实则无用的东西，他们的处境也并没有那么地糟糕，他们的自我保存更不会受到多大的妨碍。即使他们没有厚实的皮毛，但是在炎热的国家，他们根本用不上，而在寒冷的国家，他们又懂得将他们战胜的动物毛皮占为己有；尽管他们只有两条腿奔跑，但是他们还有两只手可以用来防御以及满足各种需求；他们的孩子可能较晚学会走路，而且一开始还走得比较吃力，但是他们的母亲能够非常方便地将他们抱起——这是其他动物所没有的优势，当那些动物被敌人追赶时，它们要么得扔下孩子自行逃跑，要么就得慢下脚步以等待孩子[插图]。最后，除非假设遇到我在下面所要谈的那些独特而又偶然的情况（这些情况极有可能永不会发生），否则我们就有理由认为：第一个为自己做衣服、建房子的人，实际上不过是为自己创造了些很不必要的东西。因为之前在没有这些东西的情况下，他照样活得好好的，我们很难明白为什么在长大后反而不能忍受他从小就能忍受的那种生活。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "触觉和味觉都极其粗糙，而视觉、听觉和嗅觉却异常灵敏。这是动物的一般状态，根据旅行家们的记载，也是大多数野蛮人的状态。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "当我们得知生活在美洲的原始人能够根据气味嗅出西班牙人的行踪，鼻子灵敏度堪比最棒的猎狗时；当我们看见所有这些野蛮人，不因裸体而感到痛苦，吃很多的辣椒来锻炼自己的味觉，而且饮欧洲人的烈酒就像喝水一样时，我们大可不必感到惊讶。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "生理层面的人类，下面，我们将尝试着从形而上和道德的角度出发对人类进行探讨。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "在我看来，所有动物不过是一部部精密的机器，大自然赋予这部机器感官，让它能够自行恢复，并且在某种程度上对一切企图毁灭它或者干扰它的东西实行自卫。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "要知道，精神使感官堕落，而当自然的需求已经得到满足时，意志却还会提出要求。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "一些哲学家甚至进一步指出，一个人与另一个人之间的差距比一个人与一个兽类之间的差距还要大。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "自然支配着一切动物，而兽类总是选择服从。人类本来面临着同样的压力，但他自认为有选择顺从或者反抗的自由。正是因为人类意识到了这一自由，其灵魂的精神性才得以体现。因为即使物理学可以在一定程度上解释感官的机制以及观念的形成，但是在意志或者选择的力量方面，以及对这一力量的感知中，我们只能发现一些纯精神层面的行为，而这些行为是机械规律所无法解释的。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "自我完善的能力", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "这一卓越的、几乎无限的能力却是人类所有苦痛的来源；正是这一能力在时间的长流中将人类从原初状态中拖拽出来，使他不能再过上安静、单纯的生活；正是这一能力在几个世纪中为人类孵化了所有的理智与错误、所有的罪恶与道德，久而久之，将人类变成了统治自己与大自然⒐的暴君", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "野蛮人一开始从事的是纯动物⒑行为：观察和感觉将是他最初的状态，这与所有其他动物毫无差别。愿意和不愿意、欲望和害怕将是他灵魂最初甚至是唯一的运作，直到有一天新的环境带来新的发展。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "当一个人想要或者惧怕一个事物时，要么是因为他产生了“不能得到”的念头，要么就是因为大自然的简单驱使", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "野蛮人没有受到任何理性光芒的照耀，因此他只能体会到由各种自然冲动产生的情欲⒒；他的欲望不会超越身体上的需求；在这个世上，他能够认知的唯一的“好”就是粮食、雌性和休息，而他惧怕的唯一的“恶”就是疼痛和饥饿。这里我说的是疼痛，而不是死亡。因为对死亡以及与之相伴的恐惧的认知是人类摆脱动物状态所获得的最初的认知。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "没有任何事物可以让他的灵魂受到震动，他每日所关注的只有当下的生存，而没有任何未来的概念，无论这个“未来”是多么地近在咫尺。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "居住在加勒比海沿岸的居民到现在仍然只有这样的预见力：早上，他们兴冲冲地卖掉自己的棉床，可是到了晚上却哭着要去买回来，因为他们根本就没有预见到下一个夜晚可能用得上。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "3", "x": "那些居无定所、相互间无任何需求、一辈子很难见上第二面、互不相识、互相不说话的人类究竟能够相互完善与启迪到何种程度呢？", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "一个内心平静、身体健康的自由人还能遭遇何种苦难？", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "在我们周围，我们几乎只能看到那些抱怨自己生存状态的人们，更有甚者，伤心欲绝，想要放弃自己的生命。就连那充满神意的法律与人类的法律的结合也无法阻止这一骚乱的发生。我还想知道，人们可曾听说一个自由的野蛮人动过抱怨生活的念头，并企图轻生？", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "似乎一开始，处于这一状态下的人类相互间并不存在任何形式的道德关系，也不存在任何的共同义务。因此，在这些人类中间，既没有好与坏之分，也没有所谓的罪恶与美德的对立；除非我们从生理意义上来理解这些词，将那些会危害到个体自我保存的品质称为“罪恶”，而将那些能够促进这种自我保存的品质称为“美德”。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "野蛮人之所以并不是恶人，是因为他们并不知道善为何物，而阻止他们“作恶”的，既不是理性的发展，也不是法律的约束，而是情欲的平复和对恶的无知：“这些人因为对恶的无知而得到的好处比那些人对善的感知所得到的坏处还要大些”。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "我这里所说的自然道德就是：怜悯心。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "“自然既然给予人类眼泪，那就表示，它曾给予人类一颗最仁慈的心。”", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "4", "x": "在自然状态下，正是这一怜悯心代替了所有的法律、风俗和道德，因为没有任何一个人会尝试违背它温柔的召唤：正是有了怜悯心，强壮的野蛮人只要能够在别处觅得食物，就绝不会剥夺一个柔弱的小孩或者一个年迈的残疾人本就脆弱的生命；理性正义的崇高准则是“像你希望别人如何对待你那样去对待别人”，而怜悯心却让整个人类遵循另一个天生善良的准则：“在尽可能不损害他人利益的前提下追求自己的幸福。”这一准则可能不如前者那么完备，但是却更加实用。", "y": "", "d": "2024-04-25"}, {"k": "h", "c": "4", "x": "野蛮人的情欲是那样地匮乏，同时又受到怜悯心如此有益的约束，所以与其说他们是邪恶的，不如说他们是野性的。他们所在意的是，如何从可能遭遇的不幸中逃离出来，而不是如何将这一不幸转嫁到他人身上。他们不会陷入异常危险的争论之中：由于他们之间不存在任何形式的交流，因而，他们既不明白虚荣为何物，也不明白敬意是什么，既不明白重视为何物，也不明白蔑视是什么。他们没有任何你我之分的概念，也没有任何真正意义上的正义观念。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "精神层面的爱不过是由社会习惯产生出来的一种人为的情感。妇女们对它尽情吹捧，以便建立她们的权威，让本应服从的女性占据统治地位。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "野蛮人只会听从自己从大自然获得的禀性，而不会跟随他尚未获得的喜好；因此对他而言，所有异性都是同样适合的。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "游荡在浩瀚森林里的野蛮人，没有工业，没有语言，没有住所，没有战争，彼此间也没有任何联系。他对同类没有任何需求，同时也没有任何伤害他们的欲望，而且可能一辈子不会单独认识任何一个其他同类。他不为情欲所牵绊，自给自足，只拥有这一状态下应有的情感与智慧。他只会感受到自己真正的需求，目光只会聚焦到他感兴趣的事物上面，而且他的智慧并不比他的幻想有更多的发展。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "一个人脾气是暴躁还是温柔，体魄是强壮还是柔弱，更应该取决于他被抚养长大的方式是严厉还是阴柔，而不应该归结于其身体的自身构造。精神的力量亦是如此：教育不仅使得受教育的人与未受教育的人之间产生差异，而且也使那些受教育的人在文化程度方面产生差异。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "我们会发现人与人之间的差异更应该源自社会，而不是自然状态，而自然的不平等在人类中的扩大则更应该归咎于制度的不平等。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "只有当人类相互间产生依赖，并且相互间的需求将他们联系起来后，奴役关系才会形成。一个人在被奴化前，必定经过了依赖他人的经历。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "5", "x": "不平等在自然状态下几乎无法被感知，因而几乎不会对这一状态产生任何影响", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "谁第一个将一块土地圈起来，并毫无顾忌地说“这是我的”，然后找到一些足够天真的人对此信以为真，谁就是文明社会真正的创始人", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "人类的第一个感知便是他的存在，而第一个担忧的问题就是他的自我保存。大地的产物为他提供了所有必需的物品，而人类则在本能的驱使下使用着这些大自然的馈赠。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "当人类第一次开始审视自己时，便产生了最初的自尊情绪；也正是如此，当他还不大知道如何区分等级的时候，在他将自己的物种视作第一等的同时，他早已准备将他自己列为同类中的第一等了。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "他们根本不知道远见为何物，他们不仅不会去忧虑尚且遥远的未来，就连近在咫尺的明天也不在他们的考虑范围之内。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "这些舒适的享受会渐渐变成一种习惯，这种习惯最终会使人类几乎完全感受不到幸福，而且同时会转化为真正的需求，那么得不到这些享受所带来的痛苦，将远远大于拥有这些享受时所带来的喜悦。从此，人们将因失去而感到忧伤，却不会因为拥有而感到幸福了。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "1", "x": "由于习惯于频繁的相见，他们从此再也无法离开对方。一种温柔甜蜜的情感便出现在灵魂深处，只要出现稍不如人意之处，这种感情便会变成疯狂的愤怒：嫉妒随爱情而生，一旦反目，就连最温柔的感情也不免引起人类血淋淋的牺牲。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "每个人都开始关注别人，同时也渴望着别人关注自己。公开的称赞变成了一种荣誉。那些唱歌或者跳舞最棒的人，那些最美、最强壮、最聪明或者最雄辩的人便成为人们最为尊重的人。要知道，这是迈向不平等的第一步，同时也是让人类通往邪恶的开始：从这些最初的偏爱出发，一方面诞生了虚荣和蔑视，另一方面也诞生了耻辱和欲望。而由这些新的原因所造成的骚乱最终给予“幸福”与“天真生活”最后一击。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "没有私有制，便不会有不公正。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "当人类满足于简陋的房屋，满足于使用木刺或者鱼刺缝补皮质衣裳，使用羽毛和贝壳打扮自己，在身上涂上不同的颜色，不断完善或者美化他们的弓和箭，使用锋利的石头凿出某些渔船或者某些原始的乐器的时候；总而言之，就是当他们只适应个人劳作，并且只会从事那些不需要多人协作的艺术时，他们过着本能所能够给予他们的最自由、健康、美好与幸福的生活，并且在他们中间继续享受着无拘无束自由交流的乐趣。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "这时，人类所有的能力都已经被开发出来：记忆力与想象力并存着，自尊心被唤醒，理性被照亮，智慧似乎已然达到了它所能达到的最完善的程度。这时，所有来源于自然的品质都已经发挥作用，每个人的等级和命运不仅取决于财富的数量以及每个人有利于人或者有害于人的能力，而且还取决于精神、美貌、力量、技巧、功绩或者才能等种种品质。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "人们必须拥有或者假装拥有这些品质，必须为争取自己的利益而表现出与其真实面目不同的形象。于是“实际是”和“看似”变成两个完全不同的概念，而正是在这一区分中出现了无比奢华的排场、骗人的诡计以及随之而来的所有恶行。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "由于众多新需求的出现，人类从以前自由、独立的状态，变成了现在被整个大自然，尤其是其同类所奴役的状态。在这一状态下，他表面看来是其他同类的主人，但是从某种意义讲来，却同时成为了他们的奴隶。富裕的人需要他人的服务；贫穷的人需要他人的救助；而不穷也不富的中间状态，也绝不可能让他摆脱对其他同类的需求。因此，他必须不断设法引起他人的注意，让他们看到为他工作的好处，无论这一好处是实际的还是表象的。这样就使得他在有的人面前变得狡猾而又虚伪，而在另一些人面前变得专横而又无情，而且，当他不能使一些人畏惧自己，或者当他认为服侍另外一些人对他没有什么好处的时候，他便不得不欺骗他所需要的一切人。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "2", "x": "由于富人和穷人彼此间不同的性格，便诞生了统治和奴役或者暴力和掠夺。对于富人而言，他们一旦体会到统治的快乐，便会立即蔑视所有其他的快乐。同时，由于他们可以用旧奴隶来降服新奴隶，所以他们每天所想，就是如何制服或者奴役他们的邻居。他们就像那些饥肠辘辘的恶狼，一旦尝到人肉的鲜美，便觉得其他食物索然无味，因而最后只想着吞食人类了。", "y": "", "d": "2024-04-19"}, {"k": "h", "c": "3", "x": "在指出这种可能的情境之后，他便理所当然地编造了一系列动听的理由，来诱导他们帮助自己达到目的。他会对他们说：“让我们团结起来吧！愿弱者摆脱压迫，野心得到抑制，我们每个人都能拥有自有之物！让我们制定一些平等、和平的准则吧！每个人都必须遵守这些准则，而且任何人都不会得到偏袒。这样便可以从某种角度弥补财产分布不均所造成的不公，因为强者和弱者需要承担相同的义务。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "太过贪得无厌与雄心勃勃", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "所有人都朝着镣铐的方向奔跑着，满心以为这样便可获得自由。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "拥有足够的理性，来感受一个政治组织所能带来的好处，但却没有足够的经验，来预见可能带来的危险。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "社会和法律的起源", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "弱者有了新的束缚，富人则拥有了新的权力⒙，自然的自由一去不复返，有关财产和平等的法律根深蒂固，一部不得撤销的法律通过一种灵活的窃取方式应运而生，整个人类因为某些野心家的利益而被迫陷入劳动、束缚和苦难之中。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "在这个世界上，我们再也无法找到一个角落，在那里，人们能够打破桎梏，能够避开自己头上的利剑，这把利剑因为时常操纵不当而使每个人感到它永远悬在自己的头上。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "在各个社会中间，人们还以人权的名义，用一些默认的规定减轻了自然法则的效力，以便使社会间的交往成为可能，并使在人类中间已经消失的自然怜悯心得到补偿。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "我们看到成千上万的人相互残杀，却不知道自己为何如此", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "这便是我们看到的将人类划分为不同社会所带来的初步危害。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "在人与人的关系中，一个人可能遭遇的最糟糕的情况，就是让自己任由另一个人摆布", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "正如一匹桀骜不驯的野马会竖起鬃毛，四脚跺地，猛烈地挣扎着冲向唯一的出口，而一匹训练有素的马则会耐心地忍受着长棍和马刺那样，对于野蛮人而言，相比无言的屈从，他更喜欢暴风雨般的自由。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "3", "x": "我深深地感觉到，对自由的思考，从来都不属于奴隶。", "y": "", "d": "2024-05-08"}, {"k": "h", "c": "3", "x": "他们沦落到认为暴君将他们自己的财产留给他们是一种恩惠的地步；当暴君剥削他们时，他是在主持正义，而当暴君让他们活命时，他便是在播撒惠泽。", "y": "", "d": "2024-05-08"}, {"k": "h", "c": "4", "x": "人民已经习惯了依附、安宁和生活的便利，由于他们已经无法挣脱手腕上的铁链，便索性同意增加自己的被奴役程度，以巩固自己内心的宁静。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "4", "x": "法律和私有财产权的形成是不平等形成的第一阶段；法官的设立是第二阶段；而第三个也是最后一个阶段，则是合法权利向专制权力的转变。因此，第一个阶段催生的是贫富的差距，第二个阶段造就的是强弱的悬殊，而第三个阶段诞生的则是主人与奴隶的对立。主人与奴隶的对立正是不平等的最后阶段，是所有其他不平等终将抵达的彼岸。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "4", "x": "如果所有未经堕落与变质的政府都能做到不忘初心，严格按照成立之初的目的行事，那么，这个政府的成立通常就不是必需的；在一个国家里，如果没有任何人规避法律、滥用司法，那么这个国家是既不需要法官也不需要法律的。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "4", "x": "政治层面的区分最终必然导致公民层面的区分。随着不平等在人民与首领之间表现得日益明显，不久这种不平等在个人与个人之间也开始显现出来。它根据人们的情欲、智慧与境遇演变成上千种不同的方式出现在人类面前。一个法官如果想要窃取非法权力，他不可能不去拉拢亲信，然而这样他也被迫要向他们让出部分权力。此外，公民只有受到盲目野心的驱使才会自甘忍受压迫。由于他们更多地向下而不是向上看，对他们而言，统治比自由要来得珍贵。他们之所以同意戴上镣铐，为的只是有朝一日能够将这镣铐强加在他人身上。对于那些无心支配他人的人，人们是很难让他们屈服的。即使是最精明的政治家，最终也无法使那些一心只追求自由的人屈服。", "y": "", "d": "2024-05-08"}, {"k": "h", "c": "5", "x": "当人们刚刚聚集到一个共同的社会中时，他们就被迫相互比较，并从他们不断地互相利用中被迫意识到他们之间的区别。这些区别有多种不同的分类，但是，财富、身份、等级、权力和个人功绩基本上可算作社会中的主要标准。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "在这四种不平等的起源中，个人的品质是其他所有起源的源头，而财富则是它们最终将要达到的形式，因为财富可以对人类起到最直接的作用，而且易于交换，人们可以使用它轻易地得到其他的一切。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "那将所有人吞噬的对名望、荣誉和特权的普遍欲望是如何让人们进行着智慧与力量的练习与较量；它是如何刺激着我们的欲望，并让这一欲望迅速膨胀的；它是如何通过让人类陷入竞争、对立，甚至是沦为敌人，从而使无数有野心的人每日在竞技场内角逐，每天引发无数的挫败、成功与灾难。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "我们之所以看到少数权贵与富人位居权力与财富的顶端，而广大群众则在黑暗与苦难中卑躬屈膝，这是因为前者所享受的东西正是后者所丧失的东西，而且如果状态不被改变，这些群众一旦摆脱悲惨命运，那些享有这些权力和财富的人将快乐不再。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "将人类从自然状态带到文明状态", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "，他们将可以找到那些", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "时代在变，人也在变，而在第欧根尼Diogène[插图]那里，所拥有的所有财产只包括那个木桶、一件斗篷、一根棍子和一个面包袋。有一次第欧根尼正在晒太阳，这时亚历山大大帝前来拜访他，问他需要什么，并保证会兑现他的愿望。第欧根尼回答道：“我希望你闪到一边去，不要遮住我的阳光。”亚历山大大帝后来说：“我若不是亚历山大，我愿是第欧根尼。”", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "人类的灵魂与情欲是如何在缓慢的变化中改变了原有的本质；为何随着时间的流逝，我们的需求与乐趣会改变目标；为何原始人会逐渐消失，而社会呈现在智者面前的只不过是不自然的人类与虚假的情欲的集合，虽然这样的人类与情欲只不过是这些新关系的产物，在自然中没有任何真实的基础。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "野蛮人与文明人在倾向深处是那么地不同，以至于给予文明人至上快乐的东西，却会使野蛮人陷入深深的绝望。野蛮人向往的是安宁与自由，他只想生活得悠闲自在，即使是斯多葛主义式的平静也无法表达他那对所有事物发自内心的漠视。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "相反地，那些始终保持活跃的公民却为找到更加费力的工作而不停地劳累着、焦躁着、痛苦着：他一生都在劳动，直至死亡。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "他奉承着那些他憎恨的强者和那些他鄙视的富人；他不遗余力地献媚，以期得到伺候他们的殊荣；他傲慢地炫耀着自己的卑躬屈膝以及主人的保护，并以自己的奴隶身份为荣，同时轻蔑地谈论着那些无福享受这些荣誉的人。要是让加勒比人知道欧洲公民向往艰辛的劳动，他们该会多么地震惊啊！这种悠闲的野蛮人宁愿接受多少种残酷的死亡，也不愿意过这样一种生活！", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "这便是导致所有差异的真正原因了：野蛮人过着他自己的生活；而社会人则只生活在他人的意见中，因此，他也只有在他人的评价中才能找到自身存在的意义。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "当人们只是一个劲地去问别人自己是谁，而从不敢问自己的内心时，他们尽管身处如此多的哲理、人性、礼节和崇高的哲言中，为何却只能空有一副骗人的、浅薄的外壳，只能拥有没有美德的荣誉、没有智慧的理性，以及没有幸福的享乐。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "这并不是人类原始的状态，正是社会及其孕育的不平等精神改变和歪曲着我们所有的自然倾向。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "5", "x": "不平等在自然状态下几乎不存在，其发展与壮大产生于人类天赋的发展与精神的进步过程中，最后随着私有制与法律的形成而稳定下来，变得合法。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "无论我们对于认识自己有多么地关心，我都不知道我们是否对于身外的一切事物反而认识得更为清楚。我们的器官原本只是用来保证我们的自我保存，而我们却只将它们用于接收外来印象，一心想着往外走，游离于我们之外而存在。我们每天忙着增加感官的功能，增加我们存在的外部范围，却极少使用这个内部感觉。然而，只有这个内部感觉才能够让我们回到自己的真正维度，将所有不属于我们的东西与我们隔离开来。因此，如果我们想要认识自己，我们必须使用这一内部感觉，因为只有通过这一感觉我们才能够对自己做出评价。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "一位非常著名的学者曾经通过计算人类生活的幸福与苦难，然后将两者的总数进行对比，最后得出痛苦大大地超过幸福的结论；而且，总的说来，生命可以说是自然给予人类的一个糟糕的礼物。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "如果他能够一直追溯到自然状态，我们可以预见他将得到非常不同的结论。他将会发现，人类所受的痛苦无非是自作自受，那么，他对大自然也就没有什么可以指摘的了。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "我们观察到人类浩瀚的工作：如此多高深的科学，如此多发明的艺术，如此多被使用的人力——被填平的沟壑，被削平的山峰，被敲碎的岩石，被疏通的河流，被开垦的土地，被凿出的湖泊，被沥干的沼泽，地面上拔地而起的成群建筑，以及大海上乘风破浪的船帆和水手；但另一方面，我们又会通过思考，去寻找所有这些对人类幸福带来的真正好处。我们最终只会被那统治万物的惊人的不平衡所震惊，为人类的盲目而哀恸，他们沉浸在自己疯狂的骄傲与我无法言说的某种对自我的欣赏之中，炽烈地追逐着所有自己可能遭受的苦难。而这些苦难，却是仁慈的大自然已经为人类避开的。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "在人与人的这种交往中，每个个体的理性都给自己指定一些准则，而这些规则与公共理性赋予社会主体的规则却背道而驰；这样一来，在这种交往中，每个人都在他人的不幸中寻求自己的利益。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "我们从同类的损失中获得利益，一个人的损失总是能造就另一个人的幸运。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "我们应当透过彼此间无聊的表面上的亲近来了解内心深处的想法。让我们去思考，当人类被迫相互示好，同时又相互摧毁时；当他们生来由于义务而变成敌人时；当他们为了利益而变得狡诈时，这该是何等的世态？", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "野蛮人一旦吃饱喝足便能够与大自然和谐共存，成为所有同类的好朋友。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "他一开始追求的是获得生活必需品的能力，继而演变为获取剩余的能力，然后，他从中体会到了乐趣，接着获得了无限的财富，然后，他变成了臣民，最后再沦为奴隶。他没有任何喘息的机会，最为奇特的是，需求越是不自然与不紧迫，激情就越是高涨，同时更糟糕的是，为满足这些激情的能力就越是强大。这样一来，在很长一段繁荣时期过后，在耗尽无数财富、蹂躏过许多人类后，我的主人翁终于要扼杀一切，直至成为全宇宙的唯一主人。这即便不是人类生活蓝图的概况，也应当是人类道德蓝图的缩影，或者至少是所有文明人内心深处的隐秘奢望。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "你会观察到令我们难以忍受的精神痛苦，让我们因筋疲力尽而变得悲哀的强烈激情，压在穷苦人民身上的过度工作以及令富人们沉溺其中、使一些人因缺乏它而死亡，而另一些人却因享受过度而丧命的更加危险的安逸生活；你会想到各种食物超出寻常的混合、有毒的作料、腐烂的食物、掺假的药品以及所有那些售卖假药者的诈骗、医生处方的谬误、配制药剂所用的各种有毒器皿；你会注意到那些在人口聚集地由于空气不流通而导致的流行性疾病；那些由于我们过分考究的生活方式，由于室内室外温度的悬殊，由于增减衣服太过不小心以及由我们所追求的一切肉体享受（这种享受随后变成了必要的习惯，当对这一习惯稍有疏忽或不能满足时，往往会使我们丧失健康或生命）所导致的各种疾病；如果你注意到那些烧毁或摧毁整个村庄，在短短一个月内造成上千人丧生的火灾和地震", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "从社会及其所催生的奢侈中，诞生了文艺、工艺、贸易和文字。接着，这些无用之物使工业繁荣起来，在使国家变得富庶的同时，也让它渐渐迷失。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "通常情况下，一门艺术的盈利程度与其实用性成反比，而且最重要的艺术最终往往是最为人所忽视的。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "随着工业和其他艺术的不断发展与壮大，耕种者们被轻视，同时却要负担起国家维持奢侈的所有税务，最终只好在劳苦与饥饿中度过自己艰难的一生。最终，他们被迫离开田地，来到大城市另谋生计。人民愚蠢的目光越是钦羡大都市的美好，国家便越会出现农村被抛弃，田地荒芜，大街上充斥着沦为乞丐或是小偷的人们的不幸景象。这些不幸的人可能最终在车轮刑上或穷困之中结束自己悲惨的一生。正是这样，国家一方面变得富足，而另一方面却逐渐变得脆弱，人口也逐渐萎缩；也正是这样，即使是最为强大的君主专制国家，在一系列努力后，总是会从富足变得荒芜，最终沦为那些遏制不住其侵略野心的弱小国家的猎物。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "难道需要毁掉社会，取消“你的”和“我的”这一区别，然后再回到森林与熊一起生活吗？", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "除自然要求我们拥有的必需的生理需求外，我们所有其他的需求都不过是习惯使然（在养成这一习惯前，这些根本就不是需求），或者是我们的欲望使然。但是人们只能对那些他们了解的事物产生欲望，因此可以推导出，野蛮人只会对他们了解的事物产生欲望，而他们只了解那些他们有能力掌控或容易得到的事物，因此，没有任何事物比他们的灵魂更加安宁，比他们的精神更加受到局限了。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第7章 注释", "x": "我们所有的工作都只共同指向两个目标：一个是为了自己生活的舒适，另一个则是在众人中受到尊重。但是，一个野蛮人却快乐地在森林中，过着孤独的生活，他们或者捕鱼，或者吹着一支粗糙的笛子，他不会吹出什么音调来，也并不想学着吹出什么音调，我们又有什么方法来理解这其中的快乐呢？", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第8章 卢梭致菲洛普利的信", "x": "对于我而言，社会之于人类相当于衰老之于个体，正如个体在衰老时需要拐杖，社会中的人民也需要艺术、法律和政府。两者唯一的区别在于：衰老状态是由人体的特质引起的，而社会状态则是由人类这一种族的性质决定的。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第8章 卢梭致菲洛普利的信", "x": "社会状态并非如您所说，在人类存在之初便存在了，而是如我所证实的那样，是人类在一系列可能存在或者至少相继出现的外界环境的作用下，加快或者减缓其形成的进程。其中甚至有好几个外界环境都取决于人类的意志。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第8章 卢梭致菲洛普利的信", "x": "在这一开放、广阔的庇护所中，严肃的智慧与嬉闹的青春惬意地共存着；这里四处充斥着仁慈、好客、温存以及所有那些一个好的社会应该拥有的魅力；在那里，穷人也能够找到朋友，有指引自己前行的榜样的力量，拥有能够启迪自己、为自己指明方向的理性。正是在这个掺杂着命运、罪恶，有时还有道德的大舞台上面，我们得以欣赏生活这出戏。但是，每个人必须待在自己的国家来完成自己的这一生。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第9章 卢梭生平大事年表", "x": "以《论人类不平等的起源和基础》奉赠伏尔泰，伏尔泰称之为“反人类的新书”。", "y": "", "d": "2024-04-21"}, {"k": "h", "c": "第9章 卢梭生平大事年表", "x": "与伏尔泰、狄德罗等启蒙思想家最后决裂。", "y": "", "d": "2024-04-21"}]}, {"id": "37352810", "title": "一个悲观主义者的积极思考", "author": "叔本华", "cats": ["哲学宗教-西方哲学"], "bmCount": 43, "rvCount": 0, "notes": [{"k": "h", "c": "四 命运与世道", "x": "四、命运与世道\n不以物喜，不为己悲。不管命运如何坎坷不平，我们都应该坦然而对。人生不会永远幸福，也不可能长久地陷于不幸。正所谓“得意不忘形，失意不失态”。", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "人生是一次旅行", "x": "为我们的一生做周详的准备——不管是哪种准备，都是最常见且最严重的愚蠢行为。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "人生是一次旅行", "x": "为某一伟业做准备所逝去的岁月，无意中剥夺了我们去贯彻它的力量。一个人不畏艰难和危险所累积的财富，自己却常常无法享用，勤劳所得只能留给他人；或者是，他多年努力奋斗所获取的职位，却没有能力担任。对他而言，幸福来得太晚，从另一方面说，他自己抵达得太晚，无缘享受幸福。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "人生是一次旅行", "x": "人生好比一次旅行，沿途所见景色跟开始的时候不同，当我们走近些，它又有变化。这就是真实的人生——对我们的愿望而言，更是如此。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "人生是一次旅行", "x": "我们所处的世界是怎样的，主要在于我们以什么方式来看待它，所以不同的人看到不同的世界：有人认为它荒芜、枯燥和肤浅，有人觉得它丰富、有趣而充满意义。", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "人生是一次旅行", "x": "我们所处的世界是怎样的，主要在于我们以什么方式来看待它，所以不同的人看到不同的世界：有人认为它荒芜、枯燥和肤浅，有人觉得它丰富、有趣而充满意义。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "人生是一次旅行", "x": "人生快乐的两大仇敌是痛苦和烦闷。我们可以进一步说，要是我们有运气能离开一个仇敌，我们就按照离开它的多少，而接近另一个仇敌。事实上，人生的过程似乎就是在这两者之间的剧烈摆动。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "认识你自己", "x": "他必须对了解自己的方法有若干进展；他必须知道在一生中他的真正的主要的和最为关键的目标是什么，他最想拥有的快乐是什么；还有，在那之后，什么在他思想中占据着第二和第三的位置；他必须找出，就整体来说，他一生真正的使命是什么，他应该扮演什么样的角色，他跟世界的一般关系如何。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "快乐不过是梦，忧伤却是现实的", "x": "快乐的真正标准就是没有痛苦。", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "快乐不过是梦，忧伤却是现实的", "x": "如果我们没有遭受痛苦，而且又不觉得生活枯燥，世上快乐的必要条件都已经达到了", "y": "", "d": "2021-05-19"}, {"k": "h", "c": "快乐不过是梦，忧伤却是现实的", "x": "“生活幸福”就是指“生活不那么不幸福”——即度过一段可以容忍的生活。", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "快乐不过是梦，忧伤却是现实的", "x": "毫无疑问，我们之所以获得生命，不是去享受此生，而是克服此生的困难——走完人生的路。", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "快乐不过是梦，忧伤却是现实的", "x": "最快乐的命运，不是去体验到最怡人的欣喜或是最大的欢乐，而是把生命带到终点，未遭受到身体或精神上的巨大痛苦。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "两种不幸", "x": "不幸大体有两种：一种只是可能的，大不了是极其可能的；另一种是不可避免的。纵使一定会发生的不幸，什么时候会发生并不确定。整日都为这两类不幸做防备的人，没有片刻会是安宁的。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "两种不幸", "x": "有的不幸是否会发生根本就不确定，有的不幸发生的时间不确定。所以，如果我们不想由于恐惧不幸而失去人生的所有快乐，我们就应该把前类不幸看作永远不会发生，把后类不幸看作不会立刻发生。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "两种不幸", "x": "不幸的事件如果已经发生，无法改变，我们就不应该再认为事情可能会演变为其他的情况，更不应该的是，认为当初如何就可以避免这件事。因为这种想法会增加自己的苦恼，使事情无法忍受，让自己成为自讨苦吃的人。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "两种不幸", "x": "接受一项伟大的真理：事情的发生是必然的结果，是无可避免的。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "适度平衡", "x": "明智人士所致力的是免于痛苦，而不是寻求欢乐。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "享受此刻", "x": "心境平静是享受此刻的必要条件。除非我们能享受一个个的片刻，否则就无缘窥见人生幸福的全貌。我们应该永远记住，“今日”只出现一次，不会再度回来。我们易于忘记，每一天都是生命中不可缺少，因此也就是无从补偿的一部分。", "y": "", "d": "2021-05-19"}, {"k": "h", "c": "理想的社会", "x": "为了做到和谐，它强迫我们蜷缩，甚至是完全变形。", "y": "", "d": "2021-05-19"}, {"k": "h", "c": "伟大的心灵注定是孤独的", "x": "根据长时间与他人相处的经验，我们已不再对别人抱有太大的期望。我们发现，跟人交往得深入一些，并不会有所收获。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "独处的好处", "x": "一个人若能面对自己，独立自处，好处是无穷尽的。西塞罗甚至说过这样的话：一个能够完全自立，并且具备独特才能的人，不可能生活不快乐。一个人愈有独立的才能，别人对他的重要性就愈少。这种自足的感觉，让许多有真才实学的人不致为了跟世人相处而做出相当的牺牲，更别说实际上克制自己去积极参与那些活动。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "社交与年龄", "x": "人与人之间的共同之处，是人们的性格之中最低下、最不高贵，也就是那些平庸、琐碎、卑俗的部分。我们与这些庸人为伍，究竟能获得什么欢乐呢？那些人不能把自己提升到更高的层次，而要把一切拉到跟自己同样的低下。那些人的目的就是这样，我们还能要求他们什么呢？", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "忍受孤独", "x": "让我劝告你，要养成跟人交往时保持着孤单感。一方面学习怎么跟友伴在一起时依然故我，并不立刻说出你的想法；另一方面，对别人所说的话，不必太推敲字义，在道义上或智力上，不要对别人期望过高，并加强对他人意见的淡漠感，就最能练习人人赞美的容忍精神。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "妒忌是人的天性", "x": "如果我们不把自己的命运跟其他更为快乐的人相比，避免自寻烦恼，我们将会对自己所拥有的一切感到高兴。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "妒忌是人的天性", "x": "如果许多人看起来比我们处境更好，应该想一想有多少人比我们处境差。如果实际的灾难降临，最有效的安慰——虽然跟妒忌是同一来源——就是试想别人所遭受的更大的灾难；其次最好的安慰是置身于跟我们同样不幸的人们——我们共忧患的伙伴之中。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "想象做不了判断", "x": "对于任何可能影响我们祸福的事情，注意不要操之过急。不要让我们过分忧心，而要冷静、心平气和地去考虑事情，把这件事看作跟我们关系并不特别密切的抽象问题。在这里，我们不应该让想象扮演任何角色，想象做不了判断——它只会唤起幻象，导致有害而且不时非常痛苦的心情。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "想象做不了判断", "x": "因为早晨是一日的青春，万事万物都如此明艳、新鲜和轻盈", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "持久不变的是人的性格", "x": "所谓人生的幸福和艰辛，并不取决于我们的遭际，而在于我们如何应对它，在于我们感受它的性质和程度。", "y": "", "d": "2021-05-20"}, {"k": "h", "c": "虚荣", "x": "他们把自然秩序倒过来——把他人的意见看成是真实的存在，却把自己的意识当作可疑之物；他们把衍生的次要东西当成主体，同时把他们外界所见到的自身形象，看得比自身还重要。", "y": "", "d": "2021-05-25"}, {"k": "h", "c": "没有人能看到自己的高度之上", "x": "你在他人之中能看见的，局限于你自己所拥有的。", "y": "", "d": "2021-05-25"}, {"k": "h", "c": "处世智慧", "x": "“不轻易爱人，也不轻易恨人”是处世智慧的一半；“不轻易说话，也不轻易听信别人的话”，是另一半。", "y": "", "d": "2021-11-12"}, {"k": "h", "c": "处世智慧", "x": "不管命运如何降临我们身上，不可太高兴，也不可过分悲伤。一方面是由于一切事物都充满变化，我们的运气随时都会变动；另一方面是因为在判定事情对自己是好是坏之时，我们易于受到欺骗。", "y": "", "d": "2021-11-12"}, {"k": "h", "c": "处世智慧", "x": "不管命运如何降临我们身上，不可太高兴，也不可过分悲伤。一方面是由于一切事物都充满变化，我们的运气随时都会变动；另一方面是因为在判定事情对自己是好是坏之时，我们易于受到欺骗。", "y": "", "d": "2021-12-02"}, {"k": "h", "c": "我们并不能真正拥有什么", "x": "命运总是不客气地老早教训我们，我们并不能真正拥有什么", "y": "", "d": "2021-11-12"}, {"k": "h", "c": "我们并不能真正拥有什么", "x": "所谓幸福和欢乐都不过是海市蜃楼，从远处可以见到，一旦接近就消失了。另一方面，折磨和痛苦却是千真万确的，其现实性没有缓冲余地，不容许妄想或虚假的希望置身其间。", "y": "", "d": "2021-11-12"}, {"k": "h", "c": "所有的事物都是稍纵即逝的", "x": "不管你的情况如何，要对自己作出相反的设想：在顺境中，想到不幸；在情投意合时，想到敌对；在天气晴和时，想到密云满布；在热爱中，想到恨；在信任的时刻，想象他人的不义，懊悔自己那么相信人家。同样地，自己在逆境中，要保持欣喜时光所有的轻快感——这真是处世智慧的不竭资源！", "y": "", "d": "2021-11-12"}, {"k": "h", "c": "宠辱不惊", "x": "几乎每个人在一生中都有这样的经验：我们为之悲伤的一些事，以后证明为所发生过的最好的事；或是我们为之欢欣不已的事，竟然成为最大痛苦的来源。", "y": "", "d": "2021-12-02"}, {"k": "h", "c": "宠辱不惊", "x": "我觉得喜事悲事都有许多花招，\n所以它们猛然间出现的面貌，\n未能使我惶悚不知所措。", "y": "", "d": "2021-12-02"}, {"k": "h", "c": "宠辱不惊", "x": "一般而言，面对种种不幸而能保持平静的人，表明他了解人生的路程上有许多可怕的事会发生，他把当前的困难看作只是可能降临的一部分。这是坚忍主义者的气质——永远不忘记人类的悲惨命运，而是总要记住，我们的生存充满痛苦，我们可能遭遇的不幸是无数的。不管是在何处，我们只要四周一望，就能重新感到人类的苦难。眼前看到的尽是人类在挣扎、踉跄受苦——都不过是为了可怜的生存，没有生趣，没有回报！", "y": "", "d": "2021-12-02"}, {"k": "h", "c": "习惯不幸", "x": "我们不应该为那些小事感慨，更别记在心中为之烦恼，而是要跟它们保持距离，把它们看作路上的石头，推开不让其挡路。千万不要去想它们，不容它们在反思中占一席之地。", "y": "", "d": "2021-12-02"}, {"k": "h", "c": "“现在”是唯一的真实和肯定", "x": "让我们记住塞尼加的话：“把每一天都当作独特的一生看待。”我们要尽可能地把每一天过得称心满意，它是我们实际上拥有的唯一时间。", "y": "", "d": "2021-12-02"}, {"k": "h", "c": "在行经世界的道路上", "x": "在世界的某处，在宫殿或是在茅舍，会有某些特别的快乐，一切快乐无非都是自己在身心没有遭受痛苦时所享受到的。", "y": "", "d": "2021-12-02"}]}, {"id": "3300025468", "title": "1844年经济学哲学手稿", "author": "[德]马克思", "cats": ["政治军事-政治"], "bmCount": 35, "rvCount": 0, "notes": [{"k": "h", "c": "编者引言", "x": "一是工人同自己的劳动产品相异化。由于社会的生产资料掌握在资本家手中，工人生产的产品不但不为工人所拥有，反而成为支配工人的异己的敌对的力量。工人生产的产品越丰富，他就越贫穷；工人提供的商品越多，他自己就越是变成廉价的商品", "y": "", "d": "2025-05-14"}, {"k": "h", "c": "编者引言", "x": "劳动本来是人的最基本的实践活动，是人类生命活动的表现。然而在资本主义制度下，劳动对工人来说具有外在的强制的性质。工人在劳动中不是肯定自己，而是否定自己；不是感到愉悦，而是感到不幸；不是自由地发挥自己的体力和智力，而是忍受肉体的摧残和精神的折磨。", "y": "", "d": "2025-05-14"}, {"k": "h", "c": "工资", "x": "工资决定于资本家和工人之间的敌对的斗争。胜利必定属于资本家。资本家没有工人能比工人没有资本家活得长久。资本家的联合是常见的和有效的，工人的联合则遭到禁止并会给他们招来恶果。", "y": "", "d": "2025-05-14"}, {"k": "h", "c": "工资", "x": "工人的生活取决于需求，而需求取决于富人和资本家的兴致。", "y": "", "d": "2025-05-14"}, {"k": "h", "c": "工资", "x": "当资本家赢利时工人不一定有利可得，而当资本家亏损时工人就一定跟着吃亏。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "死的资本总是迈着同样的步子，并且对现实的个人活动漠不关心。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "工人是为他的生存而苦恼，资本家则是为他的死钱财的赢利而苦恼。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "首先，工资的提高引起工人的过度劳动。他们越想多挣几个钱，他们就越不得不牺牲自己的时间，并且完全放弃一切自由，在挣钱欲望的驱使下从事奴隶劳动。这就缩短了工人的寿命。工人寿命的缩短对整个工人阶级是一个有利状况，因为这样就必然会不断产生对劳动的新需求。这个阶级始终不得不牺牲自己的一部分，以避免同归于尽。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "随着工人在精神上和肉体上被贬低为机器，随着人变成抽象的活动和胃", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "由此可见，即使在对工人最有利的社会状态中，工人的结局也必然是劳动过度和早死，沦为机器，沦为资本的奴隶（资本的积累危害着工人），发生新的竞争以及一部分工人饿死或行乞。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "工资的提高在工人身上激起资本家那样的致富欲望，但是，工人只有牺牲自己的精神和肉体才能满足这种欲望。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "在社会的衰落状态中，工人的贫困日益加剧；在增长的状态中，贫困具有错综复杂的形式；在达到完满的状态中，贫困持续不变。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "只得到他不是作为人而是作为工人维持生存所必要的那一部分，只得到不是为繁衍人类而是为繁衍工人这个奴隶阶级所必要的那一部分。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "工人不但远不能购买一切东西，而且不得不出卖自己和自己的人性。", "y": "", "d": "2025-05-15"}, {"k": "h", "c": "工资", "x": "人们却想用这种肤浅的平均计算，在关系到居民中人数最多的阶级的问题上欺骗自己", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "工资", "x": "正是由于生产总量的增长，并且随着生产总量的增长，需要、欲望和要求也提高了，于是绝对的贫困减少，而相对的贫困可能增加。", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "工资", "x": "一个民族要想在精神方面更自由地发展，就不应该再当自己的肉体需要的奴隶，不应该再当自己的肉体的奴仆。因此，他们首先必须有能够进行精神创造和精神享受的时间。", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "工资", "x": "不幸的是，千百万人只有通过那种伤害身体、使道德和智力畸形发展的紧张劳动，才能挣钱勉强养活自己，而且他们甚至不得不把找到这样一种工作的不幸看做是一种幸运。", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "工资", "x": "关于劳动是商品的理论，难道不是披着伪装的奴隶制的理论吗？", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "工资", "x": "劳动就是生命", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "工资", "x": "按照科学的意见，连绵不断的战争是获得和平的唯一手段；这种战争就叫做竞争。", "y": "", "d": "2025-05-17"}, {"k": "h", "c": "资本的利润", "x": "资本，即对他人劳动产品的私有权", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "资本是对劳动及其产品的支配权力。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "资本家拥有这种权力并不是由于他的个人的特性或人的特性，而只是由于他是资本的所有者。他的权力就是他的资本的那种不可抗拒的购买的权力。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "什么是资本？\n“一定量的积蓄的和储存的劳动。”", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "资本是积蓄的劳动。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "基金，资金，是土地产品和工业劳动产品的任何积累。资金只有当它给自己的所有者带来收入或利润的时候，才叫做资本。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "资本家是双重获利：第一，通过分工；第二，一般地通过对自然产品加工时人的劳动的增加。人加进商品的份额越大，死资本的利润就越大。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "利润率不像地租和工资那样，随社会的繁荣而上升，随社会的衰退而下降。相反，利润率很自然地在富国低，在穷国高，而在最迅速地走向没落的国家中最高。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "资本总额和收入总额之间的比例无论在什么地方都决定着勤劳和懒惰的比例：资本占优势的地方，普遍勤劳；收入占优势的地方，普遍懒惰。", "y": "", "d": "2025-05-18"}, {"k": "h", "c": "资本的利润", "x": "出租自己的劳动就是开始自己的奴隶生活；而出租劳动材料就是确立自己的自由……　劳动是人，而劳动材料则根本不包括人。", "y": "", "d": "2025-05-21"}, {"k": "h", "c": "［I］", "x": "最低的和唯一必要的工资额就是工人在劳动期间的生活费用，再加上使工人能够养家糊口并使工人种族不致死绝的费用。按照斯密的意见，通常的工资就是同“普通人”即牲畜般的存在状态相适应的最低工资。", "y": "", "d": "2025-05-14"}, {"k": "h", "c": "［I］", "x": "当资本家赢利时工人不一定有利可得，而当资本家亏损时工人就一定跟着吃亏。", "y": "", "d": "2026-03-02"}, {"k": "h", "c": "［I］", "x": "死的资本总是迈着同样的步子，并且对现实的个人活动漠不关心", "y": "", "d": "2026-03-02"}, {"k": "h", "c": "［I］", "x": "工资的提高引起工人的过度劳动。他们越想多挣几个钱，他们就越不得不牺牲自己的时间，并且完全放弃一切自由，在挣钱欲望的驱使下从事奴隶劳动。这就缩短了工人的寿命。", "y": "", "d": "2026-03-02"}]}, {"id": "25731054", "title": "倦怠社会", "author": "韩炳哲", "cats": ["社会文化-社科"], "bmCount": 35, "rvCount": 0, "notes": [{"k": "h", "c": "前言 倦怠的普罗米修斯", "x": "功绩主体幻想自己身处自由之中，实际上却如同被缚的普罗米修斯。一只鹫鹰每日啄食他的肝脏，肝脏又不断重新生长，这只恶鹰即是他的另一个自我，不断同自身作战。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "前言 倦怠的普罗米修斯", "x": "肝脏自身并无痛觉，而由此导致的疼痛感即是倦怠感", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "2", "x": "在一个匮乏的时代，人们专注于吸收和同化。而在过剩的时代，问题是如何排斥和拒绝。普遍的交流和信息过剩正在威胁全体人类的免疫机制。”", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "超越规训社会", "x": "过去通过权威和禁令分配社会阶级和两性角色，如今每个人必须自发地行动，每个人都有义务去成就他自身", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "超越规训社会", "x": "功绩主体不受外在的统治机构控制，没有外力强迫他工作或剥削他。他是自身的主人和统治者。因此他无须屈从于任何人，或者说只屈从于自身。这正是他有别于规训主体之处。但尽管摆脱了统治机构，却没有导向自由。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "超越规训社会", "x": "工作和效绩的过度化日益严重，直到发展成一种自我剥削。这比外在的剥削更有效率，因为它伴随着一种自由的感觉。剥削者同时是被剥削者。施虐者和受害者之间不分彼此。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "过度的积极性还可以呈现为过度的刺激、信息和资讯，它从根本上改变了注意力的结构和运作方式。感知因此变得分散、碎片化。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "作为一种时间和注意力的管理技术——多工作业(Multitasking)，并不代表文明的进步。多工作业不是人类新掌握的技能，以便适应现代晚期信息社会的需求。更确切地说，它代表了一种倒退。当动物身处野外捕猎区时，普遍存在多任务处理。这种注意力的管理技术是荒野求生的必备技能。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "人类在文化领域的成就，包括哲学思想，都归功于我们拥有深刻、专一的注意力。只有在允许深度注意力的环境中，才能产生文化。这种深度注意力却日益边缘化，让位于另一种注意力——超注意力(Hyperaufmerksamkeit)。这种涣散的注意力体现为不断地在多个任务、信息来源和工作程序之间转换焦点", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "这种注意力不能容忍一丝无聊，因此它也绝不接受一种深度无聊，而这种深度无聊恰恰对于创造活动具有重要意义", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "如果说，睡眠是身体放松的最高形式，那么深度无聊则是精神放松的终极状态。一味的忙碌不会产生新事物。它只会重复或加速业已存在的事物。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "如果一个人在行走时感到无聊，又没有办法忍受无聊的话，他会焦虑、烦躁地转来转去，并且急切地寻找各式各样的活动。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "深度无聊", "x": "只有停留在沉思之中，才能进入悠长、从容的状态", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "1", "x": "，现代人类却被动地陷入一种去个性化的生命过程之中", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "1", "x": "新时代起初以前所未有的、英雄主义的姿态激发了人类的一切潜能，却终结于一片死寂的消极被动之中。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "1", "x": "那么为何在现代晚期，人类的一切活动都降格为劳作？为什么人类变得如此紧张、忙碌？", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "2", "x": "正是在赤裸的、极为易逝的生活刺激下，人类变得过度活跃，以歇斯底里的状态投入工作和生产。", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "2", "x": "工作的加速也和存在的匮乏相关联", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "2", "x": "在这一规训社会中，每个人都身处自己的劳动营里。这种劳动营的特殊之处在于，一个人同时是囚犯和看守、受害者和施暴者。人类以这种方式进行自我剥削。在没有主人的情况下，剥削也能照常进行", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "观看的教育", "x": "人应当学会观看，学会思考，以及学会说话和书写", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "观看的教育", "x": "学习观看意味着“使眼睛适应于宁静、耐性，使自己接近自身”，换言之，使眼睛拥有沉思的专注力以及持久、从容的目光。学习观看是“获得智慧的第一项预备训练”。人们应当学会，“受到刺激不要立刻做出反应，而是能够拥有阻止、隔绝的本能”", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "抄写员巴托比", "x": "充满了高墙和壁垒，它们是属于规训社会的建筑要素", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "抄写员巴托比", "x": "自卑和自责感，也没有对失败的恐惧。他并不熟悉那种不间断的自我谴责和自我攻击", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "1", "x": "倦怠的灵感并不告诉我们去做什么，而是告诉我们可以不做什么”", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "2", "x": "在创世之后，上帝赐福给第七天，定为圣日。为一定目的而劳作的一天不是神圣的，而是那什么都不做的一天。在这一天，无用之用成为可能。它也是倦怠的一天", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "倦怠社会", "x": "每个人都拥有良心，并且感到自己被一个内在的法官注视，此内在法官威吓他，使他充满敬畏（一种与恐惧相结合的尊敬）", "y": "", "d": "2025-01-03"}, {"k": "h", "c": "倦怠社会", "x": "社交网络中的“朋友”承担的主要功能在于，提升个体的自恋式自我感受。他们构成了一群鼓掌喝彩的观众，为自我提供关注，而自我则如同商品一样展示自身。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "倦怠社会", "x": "尼采反对过度活跃。“强大的灵魂”拥有“宁静", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "倦怠社会", "x": "功绩主体同自我抗争，从而陷入一种毁灭性的压力之中，他必须不断超越自身。这种自我剥削，伪装成自由的形式，并以死亡为终结。精力枯竭便是这种绝对化竞争的后果。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "倦怠社会", "x": "功绩社会是自我剥削的社会。功绩主体不断剥削自我，直至精力枯竭", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "倦怠社会", "x": "积极社会摆脱了一切来自他者的约束，却陷入了毁灭性的自我束缚。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "倦怠社会", "x": "自我形成的暴力取代了他者的暴力，前者的破坏力更大，由于受害者生活在一种虚假的自由感之中。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "倦怠社会", "x": "生命远比生物机能和健康要复杂、丰富，简化的生命失去了活力", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "神圣时间——禁锢在没有节日的时代", "x": "在亚里士多德看来，自由人是那些无须顾虑生计、摆脱了其束缚的人。在他面前有三种自由的生命形式可供选择，第一种生命用于享受美的事物，第二种用于为城邦施行善举，最后一种是沉思的生命，通过探索那永不消逝者，而停留在永恒的美的领域。因此真正的自由人是诗人、政治家和哲学家。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "神圣时间——禁锢在没有节日的时代", "x": "我们用越来越劣质的快消品填满世界，世界在商品中窒息。这座百货商店和疯人院并无本质区别。看上去我们似乎拥有了一切，我们却失去了最根本之物，即世界。世界丧失了语言和声音。在交流的喧哗声中，宁静消失了。商品的堆积和大众化填满了一切空白。", "y": "", "d": "2025-01-04"}]}, {"id": "3300051102", "title": "身为女性的选择", "author": "[日]上野千鹤子 [日]信田小夜子", "cats": ["社会文化-社科"], "bmCount": 31, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "与此同时，生育的“生物钟”正一分一秒地在逼近，女人的“赏味期限”已然临期。原本被她们视作依靠的父母，也逐渐转向了老龄、需看护的状态。无论结婚与否，她们都躲不过看护父母的结局", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "前言", "x": "在英语里，同性伙伴大胆露骨的谈话被称作“Locker-room talk”。虽然我将其视作珍宝，不想让别人知道，但是我希望，你也能偷偷加入其中……抱着这样的愿望，我在此送上本书。", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "文库版前言", "x": "这本书最初的书名是《结婚难民》", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "文库版前言", "x": "我认为，“难民”一词能精准地表达出“往前一步是地狱，驻足不前也是地狱”的感觉。", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "文库版前言", "x": "结婚并不能让人生重启，不结婚也不代表前途一片黑暗。家人固然可以提供一定的安全保障，但有时也会化作最大的风险。", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "文库版前言", "x": "婚姻并不会让人生彻头彻尾地改变。有时丈夫和子女能带来好处，有时反倒是没有更好，不过如此而已。婚姻并不是非经历不可的事情，一旦有了这样的观念，人就有余力去思考：什么才是好的婚姻？什么才是好的家庭？我认为，结婚和离婚都能成为一种选项的社会，对女性来说才是更好的社会。", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "文库版前言", "x": "当各位听到来路不明的大叔和大婶唠叨“先赶紧找一个再说”“别挑三拣四了”的时候，请不要理睬那些不负责任的言辞。（笑）因为那种时代早就过去了。\n2011年4月", "y": "", "d": "2025-02-15"}, {"k": "h", "c": "在“40代”开始升高的欲望水压", "x": "因为一切欲望都是由社会催生并煽动的。", "y": "", "d": "2025-02-16"}, {"k": "h", "c": "对“30代”的“相对剥夺”", "x": "烂苹果无须吃到最后一口才幡然醒悟。", "y": "", "d": "2025-02-16"}, {"k": "h", "c": "身为女性的存在证明", "x": "未婚者、非婚者或者离婚者，总之婚姻外的女性与婚姻内的女性有一点绝对的差异，那就是已婚者将“至少有一个男人要我”当作了自己的功勋。这虽然是相对剥夺感的反面，可它确实是身为女性的存在证明。", "y": "", "d": "2025-02-16"}, {"k": "h", "c": "身为女性的存在证明", "x": "这就是社会性别病。正因如此，女人才很难说出“就算不被男人选中，我也是我”", "y": "", "d": "2025-02-16"}, {"k": "h", "c": "舍弃幻想就能脱离苦海", "x": "舍弃幻想就能脱离苦海", "y": "", "d": "2025-02-16"}, {"k": "h", "c": "支配与疼爱互为表里", "x": "那其实就是女人自身创造的“喜马拉雅的新娘”。她们生下一个完全无助的存在，对自己说“他只有我了”，然后实现自我成长。", "y": "", "d": "2025-02-17"}, {"k": "h", "c": "“积久则出”的神话", "x": "因为他们是占有者、支配者，所以不会产生当事者性。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "支配的烙印", "x": "我非常讨厌“疼爱”这个词。还有“宠溺”。这些都是留下占有痕迹的行为。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "将占有误认为爱的女人", "x": "说到社会性别的弊病，若体现在男人身上，是除了占有不懂爱；体现在女人身上，就是把占有误认为爱。这些都是文化洗脑的结果。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "将占有误认为爱的女人", "x": "现在的日本年轻女性也会自我捆绑、自我束缚…", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "将占有误认为爱的女人", "x": "误以为被捆绑、被占有、被束缚才是爱的证明。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "男人的根基被动摇", "x": "男性感到的恐惧，是女方逃离的恐惧。他们最害怕本应由自己支配的东西突然有了自我。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "男人的根基被动摇", "x": "因为他们脆弱的男性自我认知被摇撼了。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "人不打会还手的人", "x": "人不打会还手的人", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "是否存在不加入婚姻制度的选项", "x": "女人只要单身，就要受到十二分的惩罚。这些惩罚存在于经济、社会、自我认知等所有方面。从这个意义上说，不论她们是否加入婚姻制度，是否从属于某个特定的男人，都要受到父权制的支配。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "用伤痕累累的身体守护尊严", "x": "所谓暴力，真正的内涵其实是恐惧。被暴力伤害最深的是人格，而不是肉体。", "y": "", "d": "2025-02-18"}, {"k": "h", "c": "待婚女的困境", "x": "所以我希望“30代”的女性都来读这本书。既然如此，最后就让话题回到“30代”吧。", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "待婚女的困境", "x": "“只要活得够久，单身终会胜利”。", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "丈夫的根基、父母的根基、子女的根基", "x": "我真希望她们别再把自己的人生赌在不确定因素上。", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "女性主义是女强思想吗？", "x": "“自己决定，自己负责”", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "名为“自我实现”的幻想", "x": "把工作等同于自我实现，是彻头彻尾的幻想。", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "非婚化有可能缓解吗？", "x": "我认为应该会有越来越多头脑冷静的婚姻，也就是“结婚并不会决定一切”的婚姻。", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "非婚化有可能缓解吗？", "x": "对婚姻不抱有过度的期待，反而使结婚难度下降了。", "y": "", "d": "2025-02-19"}, {"k": "h", "c": "那“我们”该怎么办？", "x": "请先让自己具备经济实力。赚钱最要紧，我希望她们千万不要放弃经济独立。", "y": "", "d": "2025-02-19"}]}, {"id": "830295", "title": "万万没想到：用理工科思维理解世界", "author": "万维钢", "cats": ["哲学宗教-思维科学"], "bmCount": 30, "rvCount": 0, "notes": [{"k": "h", "c": "Part One 反常识思维", "x": "据说是斯大林说的，“杀死一个人是悲剧，杀死一万个人是统计数字”。这个捐款实验证明，统计数字的力量远远比不上一个人，一个具体的人。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "Part One 反常识思维", "x": "只有刚接触艺术的人才喜欢令人愉快的东西，审美观成熟到一定程度以后我们就觉得快乐是一种肤浅的感觉，改为欣赏愁苦了。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "Part One 反常识思维", "x": "我们不得不在生活中做出各种取舍，而很多烦恼恰恰来自不愿意或者不知道取舍。古人很少有这样的烦恼，他们能有一个选择就已经高兴得不得了了。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "蒙洛迪诺说，人做判断的时候有两种机制：一种是“科学家机制”，先有证据再下结论；一种是“律师机制”，先有了结论再去找证据。世界上科学家很少，你猜绝大多数人使用什么机制思考？每个人都爱看能印证自己已有观念的东西。我们不但不爱看，而且还会直接忽略，那些不符合我们已有观念的证据。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "事实证明福克斯新闻的成功并不在于其拥护政府——它只拥护共和党政府——而在于艾尔斯有最先进的新闻理念：\n \n第一，有线频道这么多，你不可能，也没必要取悦所有观众。你只要迎合一个特定观众群体就可以了。\n第二，要提供有强烈主观观点的新闻。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "给观众想要的东西，比给观众事实更能赚钱。观众想要什么呢？娱乐和确认。观众需要你的新闻能用娱乐的方式确认他们已有的观念。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "可是如果你认为福克斯新闻这么做是为了宣传某种意识形态，你就错了。他们唯一的目的是赚钱。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "今天，我们的媒体和网络上有各种观点鲜明的文章和报道，它们或者骂得特别犀利或者捧得特别动人，观众看得畅快淋漓，十分过瘾。但是这些文章提出什么切实可行的解决方案没有？说过什么能够修正我们现有思想的新信息没有？它们只是在迎合和肯定人们已有的观念而已。因为它们的生产者知道他们不需要取悦所有人。他们只要能让自己的“粉丝基本盘”高兴就已经足够获利的了。他们是“肯定贩卖者”。政治辩论？其实是一种娱乐。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "“确认偏误”（confirmation bias）。如果你已经开始相信一个东西了，那么你就会主动寻找能够增强这种相信的信息，乃至不顾事实。一旦我们有了某种偏见，我们就无法改变主意了。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "别想说服我！", "x": "他提出的核心建议是：要主动刻意地消费，吸收有可能修正我们观念的新信息，而不是吸收对我们现有观念的肯定", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "坏比好重要", "x": "这里涉及一个重要的心理学定律，叫做损失厌恶￼。人们总喜欢获得而害怕失去。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "坏比好重要", "x": "另一个更常见的现象是批评和表扬。比如你写一篇文章，喜欢这篇文章的读者，可能最多也就点下赞，更可能什么都不做。而不喜欢这篇文章的读者则更可能采取行动，要发表一番评论，非得告诉你他的意见。这样一来读者的负面偏见很可能会造成博客上更容易出现负面的评论。但文章的作者可能也有负面偏见，表扬的评论他会不在意，而批评的评论他可能很在意，如果是这样的话，结果就不太好看了。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "最简单概率论的五个智慧", "x": "为偶然事件大惊小怪，甚至一朝被蛇咬十年怕井绳，是幼稚的表现。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "最简单概率论的五个智慧", "x": "理解随机现象最大的一个好处就是你不会再轻易地大惊小怪了。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "Part Two 成功学的解药", "x": "真正有效的办法是“常立志”。意志力是一种通用资源，这意味着你可以通过做一些日常小事来提高意志力，然后把它用在其他事情上。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "刻意练习（deliberate practice）", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "1．只在“学习区”练习；2．把要训练的内容分成有针对性的小块，对每一个小块进行重复练习；3．在整个练习过程中，随时能获得有效的反馈；4．练习时注意力必须高度集中。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "真正提升我们水平的不是文化，不是艺术，不是哲学，不是制度，不是自虐，而是刻意练习。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "真正的练习不是为了完成运动量，练习的精髓是要持续地做自己做不好的事。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "心理学家把人的知识和技能分为层层嵌套的三个圆形区域：最内一层是“舒适区”，是我们已经熟练掌握的各种技能；最外一层是“恐慌区”，是我们暂时无法学会的技能，二者中间则是“学习区”。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "比如说，我们看一本书，如果这本书所说的内容都是我们所熟悉的，完全符合我们已有的观念，这本书就在我们的舒适区内，但如果这本书说的内容与我们原有的观念不符，但是我们思考之后仍然能够理解接受，那么这本书就在我们的学习区内。如果这本书我们根本就理解不了，那么就是在恐慌区。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "在舒适区做事，叫生活；在学习区做事，才叫练习。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "想要把一个动作套路，一个技能，哪怕仅仅是一个生活习惯，甚至是一种心态，“长”在大脑之中，唯一的办法是不断重复。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "计算机编程其实是最容易自学的项目之一，写出来的程序能不能正确运行，计算机立即就可以告诉你。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "刻意练习不好玩。它要求练习者调动大量的身体和精神资源，全力投入。如果你觉得你在享受练习的过程，那你就不是刻意练习。找一本小说边喝咖啡边看，在一个空闲的下午打场球，这样的活动都非常令人愉快，但是做得再多也不会提高技艺。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "练习一万小时成天才？", "x": "练习需要重复，而重复一定不好玩。", "y": "", "d": "2021-10-19"}, {"k": "h", "c": "用强力研读书", "x": "读书的目的是获得见识以及学习高水平的思维方法。", "y": "", "d": "2021-10-20"}, {"k": "h", "c": "用强力研读书", "x": "首先，只有为了理解某个我们原来不懂的东西而读书，才值得认真对待。其次，读书应该以我为主，而不是以书为主。", "y": "", "d": "2021-10-20"}, {"k": "h", "c": "用强力研读书", "x": "一本书应该被读两遍，而且只读两遍。", "y": "", "d": "2021-10-20"}, {"k": "h", "c": "用强力研读书", "x": "强力研读要求读书笔记必须包括四方面的内容：\n \n①清晰地表现每一章的逻辑脉络；\n②带走书中所有的亮点；\n③有大量的自己的看法和心得；\n④发现这本书和以前读过的其他书或文章的联系。", "y": "", "d": "2021-10-20"}]}, {"id": "932498", "title": "存在主义咖啡馆：自由、存在和杏子鸡尾酒", "author": "莎拉·贝克韦尔", "cats": ["哲学宗教-哲学读物"], "bmCount": 28, "rvCount": 1, "notes": [{"k": "h", "c": "第一章 先生，太可怕了，存在主义！", "x": "但作为一个人，我根本没有预先被决定的本性。我的本性，要通过我选择去做什么来创造。", "y": "", "d": "2025-09-20"}, {"k": "h", "c": "第一章 先生，太可怕了，存在主义！", "x": "存在先于本质", "y": "", "d": "2025-09-21"}, {"k": "h", "c": "第一章 先生，太可怕了，存在主义！", "x": "你是自由的人，那就去选择吧——也就是说，去创造(invent)。", "y": "", "d": "2025-09-21"}, {"k": "h", "c": "第一章 先生，太可怕了，存在主义！", "x": "他们想要按照他们的自由理论生活。资产阶级的婚姻模式对他们毫无吸引力，这种婚姻模式里严格的性别角色，遮遮掩掩的出轨行为，以及对财富集聚和儿孙满堂的孜孜追求，也是如此。", "y": "", "d": "2025-09-21"}, {"k": "h", "c": "第二章 回到事物本身", "x": "心灵像一只在公园觅食的松鼠一样跑来跑去，依次抓住一个闪光的手机屏幕，墙上一个遥远的标记，杯子碰撞的声音，一朵看起来像鲸的云，一段有关某个朋友昨天说了什么的回忆，膝盖上的一阵疼痛，紧迫的截稿日期，一种对之后好天气的模糊期待，时钟的一声嘀嗒。一些东方的冥想技巧，力求让这个跑来跑去的东西安静下来，但其艰难程度表明的正是让精神静止不动有多么不自然。要是不管它，只要醒着，心灵就会朝各个方向伸探——甚至在睡梦阶段也还会继续这么做。", "y": "", "d": "2025-09-23"}, {"k": "h", "c": "第二章 回到事物本身", "x": "别想着向外求索；返回你自身。\n真理栖居于灵魂之中。", "y": "", "d": "2025-09-23"}, {"k": "h", "c": "第三章 来自梅斯基尔希的魔法师", "x": "只有在疑问与不适中，哲学才会出现。", "y": "", "d": "2025-09-28"}, {"k": "h", "c": "第五章 嚼碎开花的扁桃树", "x": "在人生的早期阶段，女人和男人的境遇有诸多不同，这只是其中之一；波伏娃后来会在她1949年的著作《第二性》中进一步仔细探究这类反差。与此同时，她能做的就是拼命学习，在友谊中找寻发泄出口，以及愤怒地反抗她的生存的局限性", "y": "", "d": "2025-09-28"}, {"k": "h", "c": "第五章 嚼碎开花的扁桃树", "x": "她对工作的终身奉献，她对旅行的热爱，她不要孩子的决定，以及她非传统意义上的伴侣选择，都表明了她对自由的献身精神。", "y": "", "d": "2025-09-28"}, {"k": "h", "c": "第五章 嚼碎开花的扁桃树", "x": "她心里惊叹道：​“噢，他真是毫无痛苦啊！他的平静冒犯了我。​”此", "y": "", "d": "2025-09-28"}, {"k": "h", "c": "第五章 嚼碎开花的扁桃树", "x": "她以同样的激情探索了这个世界，狂热地旅行与行走。", "y": "", "d": "2025-09-28"}, {"k": "h", "c": "第七章 占领，解放", "x": "当中产阶级出身的年轻萨特做他的文学英雄梦，梅洛-庞蒂在无条件的爱中享受着幸福，波伏娃有她的书和糖果店橱窗时，加缪却在一个沉默和匮乏的世界里长大。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第七章 占领，解放", "x": "毕竟，大多数时候，我们中的大多数人都在自欺，只有这样，生活才能得以维系下去。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第七章 占领，解放", "x": "在这里，萨特恢复了古代的斯多葛派观念：我或许不能选择我会遭遇什么，但从精神上来说，我可以选择如何看待它。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第九章 生平考述", "x": "这个思想自由的女存在主义者，本就因为开放的情感关系、不生孩子和不信神，被认为是一个令人不安的人物。现在，她又写了一本书，里面不但到处都是对女性性经验的描写，甚至还包括了一章讲述女同性恋的内容。连她的朋友也避之不及。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第九章 生平考述", "x": "如果说男人觉得不舒服的话，那阅读它的女人，却常常发现自己开始以一种新的方式来思考人生。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第九章 生平考述", "x": "最初的影响始于幼儿期，她写道。男孩被教导要勇敢，女孩则被认为爱哭和软弱。两种性别的儿童听的是类似的童话故事，但在故事里，男性是英雄、王子或勇士，而女性被锁在塔里、陷入沉睡或被绑在岩石上等待救援。听着这些故事，女孩注意到，母亲大部分时间都留在家里，像个被囚禁的公主，而父亲会到外面的世界，就像一个勇士去参加战争。她明白自己的角色将会朝哪个方向发展。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第九章 生平考述", "x": "长大一些后，女孩学会了举止谦和、得体。男孩们则跑啊，抢啊，爬啊，抓啊，打啊；他们是真的在抓着物质世界，与之较量。而女孩们则穿着漂亮的连衣裙不敢跑，害怕把裙子弄脏。后来，她们穿上了高跟鞋、紧身胸衣和裙子；她们留了长长的指甲，还老怕弄断。如果硬要说她们做成什么事的话，也就是通过无数微小的方式，学会了犹豫，生怕会伤害到纤弱的自己。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第九章 生平考述", "x": "到目前为止，所有这些因素共同阻碍了女性在更广阔的世界中建立权威和代理。", "y": "", "d": "2025-09-29"}, {"k": "h", "c": "第十章 跳舞的哲学家", "x": "我们所有人，都在不停谈论我们曾经是、现在也是的那个孩子。", "y": "", "d": "2025-10-03"}, {"k": "h", "c": "第十章 跳舞的哲学家", "x": "他似乎比其他哲学家活得更真实，她说——更在生活中——但这是因为对他而言，哲学和生活是一回事。", "y": "", "d": "2025-10-04"}, {"k": "h", "c": "第十一章 像这样交叉", "x": "如果必须在两件事之间选择，一件会杀死300人，另一件会杀死3000人，他会怎么选。萨特回答说，从哲学上来看，这有什么差别吗？当然从数学上来讲有差别，但哲学上没有，因为每个个体在自己眼睛中都是一个无限的宇宙，我们没法拿两个无穷来比较，无论是二者中的哪一种情况，生命的损失都是无法估量的灾难。", "y": "", "d": "2025-10-08"}, {"k": "h", "c": "第十一章 像这样交叉", "x": "生活只能倒着被理解", "y": "", "d": "2025-10-08"}, {"k": "h", "c": "第十一章 像这样交叉", "x": "我们永远都不可能真正地及时理解生活，因为在任何一个特定时刻，我们根本无法找到必要的参考系来理解它", "y": "", "d": "2025-10-08"}, {"k": "h", "c": "第十三章 一旦品尝了现象学", "x": "我们之所以可以品尝现象学，就是因为它有一天会从我们身边被带走。我们腾出我们的空间，而森林则再次将其收回。唯一的安慰是，我们曾透过树叶看见了光，我们竟然曾拥有过这种美好", "y": "", "d": "2025-10-12"}, {"k": "h", "c": "第十四章 无法估量的繁盛", "x": "我们现在的自由是什么，我们需要自由来做什么，多少自由可以被容许，在多大程度上自由能被解释为冒犯或越界的权利，以及为了换取舒适和幸福，我们又准备把多少自由拱手送给高高在上的企业实体", "y": "", "d": "2025-10-12"}, {"k": "h", "c": "第十四章 无法估量的繁盛", "x": "思想很有趣，但人更有趣。", "y": "", "d": "2025-10-12"}, {"k": "t", "c": "第十四章 无法估量的繁盛", "x": "还有生命中其余那些美轮美奂、如磷光一般闪耀的繁盛，只要我们有幸能够体验它，它就会继续向人类展示自身。", "y": "庆祝吧，为你能够感受的每一个瞬间。", "d": "2025-10-12"}, {"k": "h", "c": "第十四章 无法估量的繁盛", "x": "还有生命中其余那些美轮美奂、如磷光一般闪耀的繁盛，只要我们有幸能够体验它，它就会继续向人类展示自身。", "y": "", "d": "2025-10-12"}]}, {"id": "3300175061", "title": "女性的权利（果麦经典）", "author": "[英]玛丽·沃斯通克拉夫特", "cats": ["社会文化-社科"], "bmCount": 27, "rvCount": 1, "notes": [{"k": "h", "c": "玛丽·沃斯通克拉夫特：女战士的实验人生", "x": "正是在这种前提下，她建立起了直面苦难的人生信条，其核心理论就是：独立自主重于一切。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "玛丽·沃斯通克拉夫特：女战士的实验人生", "x": "一个女人最需要具备的品质，既不是优雅大方也不是魅力四射，而是充沛的精力和勇气，还有实现自己意志的能力。", "y": "", "d": "2025-12-09"}, {"k": "t", "c": "玛丽·沃斯通克拉夫特：女战士的实验人生", "x": "一个女人最需要具备的品质，既不是优雅大方也不是魅力四射，而是充沛的精力和勇气，还有实现自己意志的能力。", "y": "充沛的精力和勇气，以及实现自己意志的能力。", "d": "2025-12-09"}, {"k": "h", "c": "玛丽·沃斯通克拉夫特：女战士的实验人生", "x": "凡是我决心要做的事，我都义无反顾地做到底。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "引言", "x": "于是，男性用表面上的追捧蒙蔽了女性的智识，以至于在现在的文明女性中，除少数个例外，更多人都在渴望爱情，而不是追求更高的抱负，或是依靠自身的能力和美德赢得他人的尊重。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "引言", "x": "优雅不及美德重要。女性值得称颂的首要目标是树立作为“人”的品格，而不必拘泥于性别，其他的次要目标，都应以这个简单的原则来衡量。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "引言", "x": "缺乏理想，缺乏能够开阔心灵的高尚追求。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "引言", "x": "毕竟，智慧总能支配一切。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "论主流性别观", "x": "可悲的是，女王般的尊崇是如此令人陶醉，以至于在用理性原则改变整个时代观念之前，女性很难认识到，通过自我贬低获得的不当权力实则是一种诅咒，而唯有回归自然的平等状态，才能让人获得真情带来的宁静和满足。", "y": "", "d": "2025-12-11"}, {"k": "h", "c": "论主流性别观", "x": "他们最大的不幸在于，还未习得美德，便先学会了礼节；还未开始思考人类天性中的宏伟蓝图，就先通晓了所谓的人情世故。", "y": "", "d": "2025-12-11"}, {"k": "h", "c": "论主流性别观", "x": "我们不该用女性的狡猾对应男性的智慧，不该用琐碎的操劳取代宏大的追求，更不该为索然无味的乖顺冠以“温柔”之名，用它来代替只有远大理想才能铸就的坚毅品格。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论主流性别观", "x": "有足够的内在力量", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论主流性别观", "x": "不断取悦他人的渴望就会成为她痛苦的源泉", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论主流性别观", "x": "女性最该企盼的是让自己成为顶天立地的人，而不是把所有的幸福都寄托在一个同样受制于人性弱点的男人身上。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论主流性别观", "x": "让两性一同臣服于自然的法则，而不是用性别来区分道德，把女人变成取悦男人的工具。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论主流性别观", "x": "令我折服的也是理智，而非性别", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "可是，如果说良好的体力（加上一定的理智）对男性来说算是个闪光点，那为何女性还要执迷不悟地为弱不禁风的缺陷自豪呢？", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "被这种观念蒙蔽的女性，有时就会以柔弱为荣。有时，她们还会狡猾地以柔弱为手段，抓住男性的弱点反过来获取权力。她们甚至可能会为这种不正当的支配权感到骄傲—正如土耳其的帕夏[插图]一样，她们往往比自己的“主人”拥有更大的实权。但这种权力的代价却是：牺牲永恒的美德，换取短暂的满足；牺牲一生的尊严，换取一时的荣耀。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "很难有足够的力量去超越自身所处的环境", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "以娇柔之名崇尚软弱、扮作软弱，实则违背了自身更宏大的利益", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "她通过锻炼增强了体质，变得活力满满。与此同时，她的心智逐渐成长，理解了人生中要承担的道德责任，也理解了人类的美德和尊严何在。于", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "男性假装自己有权判定什么样的美德对女性是有用的，实则全都是为了自己的便利。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "再论主流性别观", "x": "女性想要获得尊重，就必须发展智识，这是人格独立的唯一基础。我要明确地说，除了理性，女性一定不要向任何权威低头，不要臣服于世俗观念，成为“端庄”的奴隶。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论导致女性堕落的原因", "x": "“我从不希望女性掌控男性，我只希望女性能掌控自己。​”", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论导致女性堕落的原因", "x": "只是一些“消极美德”​：耐心、温顺、好脾气和易配合", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论导致女性堕落的原因", "x": "而女性则恰恰相反，除了一心恨嫁，再无其他途径来发挥才干。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论导致女性堕落的原因", "x": "男人只把享乐视为繁忙工作后的调剂放松，女人却把享乐当作了人生的首要意义。", "y": "", "d": "2025-12-14"}, {"k": "h", "c": "论导致女性堕落的原因", "x": "身心皆强健", "y": "", "d": "2025-12-14"}]}, {"id": "3300025432", "title": "家庭、私有制和国家的起源", "author": "恩格斯", "cats": ["政治军事-政治"], "bmCount": 24, "rvCount": 3, "notes": [{"k": "h", "c": "编者引言", "x": "《共产党宣言》第一章第一句话是：“至今一切社会的历史都是阶级斗争的历史。”", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "分析了国家从阶级对立中产生的历史条件和本质特征，指出了国家必将随着阶级的消灭和共产主义的胜利而消亡的客观规律。", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "“两种生产”理论最初是由马克思和恩格斯在《德意志意识形态》中提出的，他们指出，生命的生产分为两种：一种是“通过劳动而生产自己的生命”，另一种是“通过生育而生产他人的生命”；", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "在恩格斯看来，物质生活资料的生产和人自身的生产之间存在着相互制约、相互影响的辩证关系；", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "恩格斯认为，无论在原始社会还是在阶级社会，物质生产都始终具有决定性的意义。", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "由于文明时代的基础是一个阶级对另一个阶级的剥削，所以它的全部发展都是在经常的矛盾中进行的。生产的每一进步，同时也就是被压迫阶级即大多数人的生活状况的一个退步。对一些人是好事，对另一些人必然是坏事，一个阶级的任何新的解放，必然是对另一个阶级的新的压迫。", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "国家是承认：这个社会陷入了不可解决的自我矛盾，分裂为不可调和的对立面而又无力摆脱这些对立面。而为了使这些对立面，这些经济利益互相冲突的阶级，不致在无谓的斗争中把自己和社会消灭，就需要有一种表面上凌驾于社会之上的力量，这种力量应当缓和冲突，把冲突保持在‘秩序’的范围以内；这种从社会中产生但又自居于社会之上并且日益同社会相异化的力量，就是国家。", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "恩格斯揭示了国家的阶级本质，说明它是在经济上占统治地位的阶级压迫被统治阶级的工具。", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "编者引言", "x": "他指出，既然国家并不是从来就有的，而是阶级矛盾不可调和的产物，那么，“随着阶级的消失，国家也不可避免地要消失。在生产者自由平等的联合体的基础上按新方式来组织生产的社会，将把全部国家机器放到它应该去的地方，即放到古物陈列馆去，同纺车和青铜斧陈列在一起。”", "y": "", "d": "2025-07-29"}, {"k": "h", "c": "二 家庭", "x": "由此可知，只要存在着群婚，那么世系就只能从母亲方面来确定，因此，也只承认女系。", "y": "", "d": "2025-07-31"}, {"k": "h", "c": "二 家庭", "x": "母权制被推翻，乃是女性的具有世界历史意义的失败。丈夫在家中也掌握了权柄，而妻子则被贬低，被奴役，变成丈夫淫欲的奴隶，变成单纯的生孩子的工具了。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "这种家庭形式表示着从对偶婚向专偶婚的过渡。为了保证妻子的贞操，从而保证子女出生自一定的父亲，妻子便落在丈夫的绝对权力之下了；即使打死了她，那也不过是行使他的权利罢了。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "它是建立在丈夫的统治之上的，其明显的目的就是生育有确凿无疑的生父的子女；而确定这种生父之所以必要，是因为子女将来要以亲生的继承人的资格继承他们父亲的财产。", "y": "", "d": "2025-08-04"}, {"k": "t", "c": "二 家庭", "x": "它是建立在丈夫的统治之上的，其明显的目的就是生育有确凿无疑的生父的子女；而确定这种生父之所以必要，是因为子女将来要以亲生的继承人的资格继承他们父亲的财产。", "y": "婚姻制度的核心功能：维护财产私有制和父权制家庭的延续。", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "个体婚制在历史上决不是作为男女之间的和好而出现的，更不是作为这种和好的最高形式而出现的。恰好相反。它是作为女性被男性奴役，作为整个史前时代所未有的两性冲突的宣告而出现的。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "在历史上出现的最初的阶级对立，是同个体婚制下夫妻间的对抗的发展同时发生的，而最初的阶级压迫是同男性对女性的压迫同时发生的。个体婚制是一个伟大的历史的进步，但同时它同奴隶制和私有制一起，却开辟了一个一直继续到今天的时代，在这个时代中，任何进步同时也是相对的退步，因为在这种进步中，一些人的幸福和发展是通过另一些人的痛苦和受压抑而实现的。", "y": "", "d": "2025-08-04"}, {"k": "t", "c": "二 家庭", "x": "在历史上出现的最初的阶级对立，是同个体婚制下夫妻间的对抗的发展同时发生的，而最初的阶级压迫是同男性对女性的压迫同时发生的。个体婚制是一个伟大的历史的进步，但同时它同奴隶制和私有制一起，却开辟了一个一直继续到今天的时代，在这个时代中，任何进步同时也是相对的退步，因为在这种进步中，一些人的幸福和发展是通过另一些人的痛苦和受压抑而实现的。", "y": "在原始共产制的群婚、对偶婚阶段，婚姻以氏族的协作、共同抚育为基础，没有性别压迫属性。\n由于群婚中无法确定生父，血缘只能按母系计算（“只知其母，不知其父”），催生了母系氏族的形成。在母系氏族中，尽管存在性别分工，但男女地位相对平等。\n随着畜牧和农耕等生产力的发展，男性创造的物质财富增加，产生了私有财产的积累。男性需要将财产传给“自己亲生”的子女，而母系继承制无法满足这一需求。于是，男性通过推翻母权制，建立父权制家庭，将女性束缚在专偶制婚姻中。\n恩格斯总结说，专偶制婚姻是私有制催生的、以男性统治为核心的社会结构，标志着性别压迫的制度化。", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "这种权衡利害的婚姻，在这两种场合都往往变为最粗鄙的卖淫——有时是双方，而更常见的是妻子。妻子和普通娼妓的不同之处，只在于她不是像雇佣女工做计件工作那样出租自己的身体，而是把身体一次永远出卖为奴隶。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "在包括许多夫妇和他们的子女的古代共产制家户经济中，由妇女料理家务，正如由男子获得食物一样，都是一种公共的、为社会所必需的事业。随着家长制家庭，尤其是随着专偶制个体家庭的产生，情况就改变了。料理家务失去了它的公共的性质。它与社会不再相干了。它变成了一种私人的服务；妻子成为主要的家庭女仆，被排斥在社会生产之外。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "参加社会生产", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "现代的个体家庭建立在公开的或隐蔽的妇女的家务奴隶制之上，而现代社会则是纯粹以个体家庭为分子而构成的一个总体。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "妇女解放的第一个先决条件就是一切女性重新回到公共的事业中去；而要达到这一点，又要求消除个体家庭作为社会的经济单位的属性。", "y": "", "d": "2025-08-04"}, {"k": "t", "c": "二 家庭", "x": "妇女解放的第一个先决条件就是一切女性重新回到公共的事业中去；而要达到这一点，又要求消除个体家庭作为社会的经济单位的属性。", "y": "回到公共的事业中去", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "专偶制的产生是由于大量财富集中于一人之手，也就是男子之手，而且这种财富必须传给这一男子的子女，而不是传给其他人的子女。为此，就需要妻子方面的专偶制，而不是丈夫方面的专偶制", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "既然专偶制是由于经济的原因而产生的，那么当这种原因消失的时候，它是不是也要消失呢？", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "随着生产资料转归公有，个体家庭就不再是社会的经济单位了。私人的家务变为社会的事业。孩子的抚养和教育成为公共的事情；社会同等地关怀一切儿童，无论是婚生的还是非婚生的。", "y": "", "d": "2025-08-04"}, {"k": "h", "c": "二 家庭", "x": "历史的讽刺又应验了", "y": "", "d": "2025-08-05"}]}, {"id": "41176028", "title": "精英的傲慢：好的社会该如何定义成功？", "author": "迈克尔·桑德尔", "cats": ["社会文化-社科"], "bmCount": 25, "rvCount": 1, "notes": [{"k": "h", "c": "致中文版读者的几句话", "x": "我们如何才能找到理解成功的新方式，变得不那么焦虑，更宽厚、更谦逊，这种方式让我们对公共利益有更强的责任感。", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "他们只看到有人破坏游戏规则，却没有看透这个游戏本身是一个陷阱", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "桑德尔从道德哲学思考出发，揭示了优绩制的不公平性：影响我们成功与否的因素大都不是我们自己能决定的，例如性别、种族、地区、健康状况、天赋、家庭背景等，这些“运气”和你自己其实没有什么关系，却在很大程度上影响了你能否进入大学、能读什么样的大学，进而影响你未来的事业发展。", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "如果我们的命运如此深刻地依赖于我们无法选择的运气，那么我们获得的成就是我们理所当然获得的吗", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "桑德尔援引罗尔斯的观点，认为运气在道德上是一个“任意”的因素，因此依赖运气取得的“优绩”，并没有道德上“应得”的正当性，那么凭借“优绩”获得的社会等级也就谈不上公平。", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "优绩制固化了社会阶层，折断了人们向上攀登的阶梯，实际上造就了新的世袭制。", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "精英阶层能够将优越的社会和经济地位“代际传递”给自己的子女。这当然不能依靠被废弃的世袭制度，而是通过教育。", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "精英阶层找到了保持优势的秘诀：通过支付高额费用，让孩子获得最好的升学训练，从幼儿园一直到高中，外加各种昂贵的课外补习班和培训项目，让他们的子女在各级入学申请中获得难以匹敌的竞争力。顶层富裕家庭对子女的教育投资是惊人的，对每个孩子的累积花费可以高达几百万甚至上千万美元，由此“维护了一个有效的世袭统治阶层", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "推行优绩制导致贫富差距扩大", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "优绩主义侵蚀着公共利益（共同善），它导致了胜利者的傲慢和失败者的屈辱。它鼓励成功者深深沉迷于自己的成功，以至于忘掉了一路上帮助他们的时机和好运，同时也导致他们鄙薄那些比自己不幸、比自己更缺乏资格的人。", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "我们该如何摆脱优绩主义的陷阱呢？桑德尔建议重新思考公民生活中的三个方面：大学的角色、工作的尊严及成功的意义。", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "我们应通过建立更包容和更开放的教育体制来促进机会平等。", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "优绩依赖于运气这种道德上任意的因素", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "扪心自问：“我的成就是否源自我活在一个奖励才能的社会中，而这种才能恰好是我所拥有的？还是因为我只是幸运而已？", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "意识到运气在生活中的作用会让我们变得谦卑。", "y": "", "d": "2024-06-24"}, {"k": "h", "c": "推荐序 优绩主义的陷阱", "x": "但我们很可能会发现，“抱负”和“努力”等品性也仍然与遗传有关，那么彻底的补偿措施只能走向（被我们姑且称为）“基因平等主义”的绝境，否则严格的机会平等仍然无法实现", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "引言 走进大学校园", "x": "因为我们越是认为自己是白手起家、自给自足的，就越难学会感恩和谦卑。而没有感恩和谦卑，我们就很难关心公共利益。", "y": "", "d": "2025-01-18"}, {"k": "h", "c": "1 赢家与输家", "x": "精英阶层的傲慢反映了成功人士倾向于过度沉醉在自己的成功中，而不记得有助于他们成功的时机和好运。", "y": "", "d": "2024-07-01"}, {"k": "h", "c": "阶层跃升的话语", "x": "这一口号取材于一首流行歌曲：​“只要你努力，你就能成功。​”(You can make it if you try.)", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "优绩至上的道德准则", "x": "优绩至上的准则所产生的情感，无论在成功者还是失败者中，在道德上都不受欢迎。在成功者中，优绩至上催生了狂妄自大；在失败者中，优绩至上带来了屈辱和怨恨。", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "优绩至上的道德准则", "x": "精英阶层的傲慢反映了成功人士倾向于过度沉醉在自己的成功中，而不记得有助于他们成功的时机和好运。那些登上顶峰的人自鸣得意地相信他们的成功是自己应得的报酬，而那些居于底层的人是咎由自取", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "优绩至上的道德准则", "x": "强烈感觉到我们的命运具有偶然性，有助于产生某种谦卑：​“若非上帝的恩典，或者命运的安排，我也会遭受如此厄运。​”但", "y": "", "d": "2025-01-05"}, {"k": "h", "c": "天命论思维：过去和现在", "x": "我们越认为自己可以自我实现、自给自足，就越没理由对自己的成功感到愧疚或感恩。\n但即使在今天，我们对成功的态度也并没有像我们想的那样与天命论毫不相关。我们是自由的主体，能够凭借自己的努力发迹、成功，这种想法只是优绩至上主义的一个方面。确信“成功的人理应成功”这一观念同样重要。优绩至上主义中成王败寇的理念让成功者变得傲慢，而让失败者感到屈辱。", "y": "", "d": "2025-01-15"}, {"k": "h", "c": "自由主义的天命论", "x": "优绩至上主义不承认运气，也不承认恩典，想让我们对自己的命运全权负责，认为发生的每件事都是对我们所做的选择和生活方式的奖励或惩罚。这种思维方式颂扬了绝对的关于掌控和支配的道德，并最终助长了精英的傲慢。优绩至上主义让成功人士相信他们自己是在“做上帝的工作”​，并瞧不起不幸的受害者", "y": "", "d": "2025-01-19"}, {"k": "h", "c": "3 阶层跃升的话语", "x": "，我们认为成功不是靠运气或恩典，而是凭借自己的努力和奋斗。这是优绩至上理念的核心。优绩至上主义颂扬自由——凭努力工作掌握自己命运的能力——和应得的权利。如果我要为积累可观的世俗财富——收入和财产、权力和声望——负责，那么我必须配得上这些世俗财富。成功是美德的标志。我发的财是我应得的。", "y": "", "d": "2025-01-20"}, {"k": "t", "c": "英才统治的黑暗面", "x": "人类历史上第一次，下等人没有现成的柱子来支撑自己的自尊。", "y": "读到这里一个激灵！这句话太犀利了… 优绩主义不承认运气，也不承认恩典，你没有成功就是因为不够努力，失败者连“借口”都找不到了。", "d": "2025-01-20"}]}, {"id": "3300024284", "title": "毛泽东选集（全四卷）", "author": "未知作者", "cats": ["政治军事-政治"], "bmCount": 20, "rvCount": 4, "notes": [{"k": "h", "c": "湖南农民运动考察报告", "x": "革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。革命是暴动，是一个阶级推翻一个阶级的暴烈的行动。农村革命是农民阶级推翻封建地主阶级的权力的革命。农民若不用极大的力量，决不能推翻几千年根深蒂固的地主权力。", "y": "", "d": "2024-11-21"}, {"k": "h", "c": "湖南农民运动考察报告", "x": "矫枉必须过正，不过正不能矫枉", "y": "", "d": "2024-11-21"}, {"k": "h", "c": "湖南农民运动考察报告", "x": "共产党对于这些东西的宣传政策应当是：“引而不发，跃如也。”￼菩萨要农民自己去丢，烈女祠、节孝坊要农民自己去摧毁，别人代庖是不对的。", "y": "", "d": "2025-06-15"}, {"k": "h", "c": "实践论", "x": "感觉到了的东西，我们不能立刻理解它，只有理解了的东西才更深刻地感觉它。感觉只解决现象问题，理论才解决本质问题。这些问题的解决，一点也不能离开实践。", "y": "", "d": "2025-06-19"}, {"k": "h", "c": "实践论", "x": "常常听到一些同志在不能勇敢接受工作任务时说出来的一句话：没有把握。为什么没有把握呢？因为他对于这项工作的内容和环境没有规律性的了解，或者他从来就没有接触过这类工作，或者接触得不多，因而无从谈到这类工作的规律性。及至把工作的情况和环境给以详细分析之后，他就觉得比较地有了把握，愿意去做这项工作。如果这个人在这项工作中经过了一个时期，他有了这项工作的经验了，而他又是一个肯虚心体察情况的人，不是一个主观地、片面地、表面地看问题的人，他就能够自己做出应该怎样进行工作的结论，他的工作勇气也就可以大大地提高了", "y": "", "d": "2025-07-05"}, {"k": "h", "c": "实践论", "x": "理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。", "y": "", "d": "2025-07-23"}, {"k": "t", "c": "实践论", "x": "实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。", "y": "感性认识是表面的、浅层的认识，理性认识是经过思考和分析得到的抓住事物本质和规律的认识。\n实践（接触事物）—感性认识（感受&收集现象）—理性认识（提炼本质和规律）—再实践（指导行动）—再认识（不断修正），通过这样循环往复、螺旋上升的过程，我们会不断超越经验局限，接近真理。\n要重视亲身经验，也要积极思考提炼规律，不要只盲目行动不思考，也不要只空谈理论不实践。", "d": "2025-07-24"}, {"k": "t", "c": "矛盾论", "x": "旧过程完结了，新过程发生了。新过程又包含着新矛盾，开始它自己的矛盾发展史。", "y": "矛盾无处不在、无时不有，完美无缺的“理想状态”是不存在的，当下的矛盾解决了，障碍通过了，新的矛盾和障碍又会出现，这是普遍规律。\n所以不该抱有“等我换份工作/结婚/财富自由/退休了就好了”的幻想，因为那个节点一旦到达，新的矛盾必然出现。\n与其被动地等待问题消失或是期望到达某个彼岸，不如主动地分析矛盾、转化矛盾或者学着与矛盾共处。\n\n学会在矛盾中生活是我们的恒久课题。", "d": "2025-07-26"}, {"k": "h", "c": "矛盾论", "x": "一句话，不了解矛盾各方的特点。这就叫做片面地看问题。或者叫做只看见局部，不看见全体，只看见树木，不看见森林。", "y": "", "d": "2025-07-25"}, {"k": "h", "c": "矛盾论", "x": "任何过程如果有多数矛盾存在的话，其中必定有一种是主要的，起着领导的、决定的作用，其他则处于次要和服从的地位。因此，研究任何过程，如果是存在着两个以上矛盾的复杂过程的话，就要用全力找出它的主要矛盾。捉住了这个主要矛盾，一切问题就迎刃而解了。", "y": "", "d": "2025-07-27"}, {"k": "h", "c": "矛盾论", "x":
