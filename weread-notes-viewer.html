"没有生，死就不见；没有死，生也不见。没有上，无所谓下；没有下，也无所谓上。没有祸，无所谓福；没有福，也无所谓祸。没有顺利，无所谓困难；没有困难，也无所谓顺利。", "y": "", "d": "2025-07-27"}, {"k": "h", "c": "矛盾论", "x": "一切矛盾着的东西，互相联系着，不但在一定条件之下共处于一个统一体中，而且在一定条件之下互相转化，这就是矛盾的同一性的全部意义。", "y": "", "d": "2025-07-28"}, {"k": "h", "c": "矛盾论", "x": "客观事物中矛盾着的诸方面的统一或同一性，本来不是死的、凝固的，而是生动的、有条件的、可变动的、暂时的、相对的东西，一切矛盾都依一定条件向它们的反面转化着。", "y": "", "d": "2025-07-28"}, {"k": "h", "c": "矛盾论", "x": "事物矛盾的法则，即对立统一的法则，是自然和社会的根本法则，因而也是思维的根本法则。", "y": "", "d": "2025-07-28"}, {"k": "h", "c": "矛盾论", "x": "按照辩证唯物论的观点看来，矛盾存在于一切客观事物和主观思维的过程中，矛盾贯串于一切过程的始终，这是矛盾的普遍性和绝对性。矛盾着的事物及其每一个侧面各有其特点，这是矛盾的特殊性和相对性。", "y": "", "d": "2025-07-28"}, {"k": "t", "c": "论持久战", "x": "敌强我弱，我有灭亡的危险。但敌尚有其他缺点，我尚有其他优点。敌之优点可因我之努力而使之削弱，其缺点亦可因我之努力而使之扩大。我方反是，我之优点可因我之努力而加强，缺点则因我之努力而克服。", "y": "强大、积极、充满辩证智慧的思维", "d": "2025-09-06"}, {"k": "h", "c": "论持久战", "x": "敌强我弱，我有灭亡的危险。但敌尚有其他缺点，我尚有其他优点。敌之优点可因我之努力而使之削弱，其缺点亦可因我之努力而使之扩大。我方反是，我之优点可因我之努力而加强，缺点则因我之努力而克服。", "y": "", "d": "2025-09-06"}, {"k": "h", "c": "论持久战", "x": "排除一切悲观主义和妥协论，提倡艰苦斗争，实行新的战时政策，熬过这一段艰难的路程。", "y": "", "d": "2025-09-06"}, {"k": "t", "c": "论持久战", "x": "排除一切悲观主义和妥协论，提倡艰苦斗争，实行新的战时政策，熬过这一段艰难的路程。", "y": "在困境中，要相信矛盾的辩证法则，发挥人的主观能动性，事情就一定会往好的方向动态发展；但是在这个过程中，需要保持耐心，克服每一个具体的困难。\n战略上乐观看待，战术上艰苦斗争。", "d": "2025-09-06"}, {"k": "h", "c": "论持久战", "x": "武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物。力量对比不但是军力和经济力的对比，而且是人力和人心的对比。", "y": "", "d": "2025-09-07"}, {"k": "h", "c": "论持久战", "x": "政治是不流血的战争，战争是流血的政治。", "y": "", "d": "2025-09-09"}, {"k": "h", "c": "论持久战", "x": "英勇战斗于前，又放弃土地于后，不是自相矛盾吗？这些英勇战斗者的血，不是白流了吗？这是非常不妥当的发问。吃饭于前，又拉屎于后，不是白吃了吗？睡觉于前，又起床于后，不是白睡了吗？可不可以这样提出问题呢？我想是不可以的。吃饭就一直吃下去，睡觉就一直睡下去，英勇战斗就一直打到鸭绿江，这是主观主义和形式主义的幻想，在实际生活里是不存在的。", "y": "", "d": "2025-09-12"}, {"k": "h", "c": "论持久战", "x": "我们是持久论和最后胜利论者，不是赌汉们那样的孤注一掷论者。", "y": "", "d": "2025-09-12"}, {"k": "h", "c": "论持久战", "x": "只是牺牲会大，要经过一个很痛苦的时期。", "y": "", "d": "2025-09-12"}]}, {"id": "3300004399", "title": "从零开始的女性主义", "author": "[日]上野千鹤子 [日]田房永子", "cats": ["社会文化-社科"], "bmCount": 17, "rvCount": 0, "notes": [{"k": "h", "c": "婴儿潮母亲与失落的一代女儿，价值观的矛盾", "x": "那个时代的女人都会不自觉地选择“被男人挑选”“依附男人”“被男人掌控”的生活方式。", "y": "", "d": "2022-11-29"}, {"k": "h", "c": "如何打断母亲传向女儿的暴力连锁？", "x": "妈妈，就算换一个丈夫，你的不幸也不会消失。”我发现，这不是性格或人际关系的问题，而是那个人所处的社会结构的问题", "y": "", "d": "2022-11-29"}, {"k": "h", "c": "如何打断母亲传向女儿的暴力连锁？", "x": "《父权制与资本主义》", "y": "", "d": "2022-11-29"}, {"k": "h", "c": "如何打断母亲传向女儿的暴力连锁？", "x": "她们别无选择。", "y": "", "d": "2022-11-29"}, {"k": "h", "c": "谁也敌不过名为母亲的女性", "x": "我是在离开这个家以后，重新养育了自己。", "y": "", "d": "2022-11-29"}, {"k": "h", "c": "残疾人人权运动与女性主义。反优生保护法恶改运动", "x": "为自己的独立和权利做斗争", "y": "", "d": "2022-11-29"}, {"k": "h", "c": "第三章 认真思考婚姻·恋爱·育儿", "x": "“我们改变社会的革命虽然失败了，但我会花一辈子，至少改变一个人。”", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "男性不会主动改变是因为坐享“男性既得利益”", "x": "男性不会主动改变是因为坐享“男性既得利益”", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "婚姻、恋爱，不可小看！", "x": "婚姻的确是让对方进入自己的生活、自己进入对方生活的重大选择。也可以说，这是一场赌上一切的战斗。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "经过半个世纪，女性的结婚意愿改变了？", "x": "你看到自己的父母，觉得婚姻是如此无聊的事情，还是想结婚吗？", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "歼灭大叔式思维！", "x": "我们对男性解释性暴力伤害时，经常会说：“你想象一下自己的女朋友或女儿是受害者，就能明白这有多惨无人道了吧？”我觉得这种说法很奇怪。为什么必须要想象自己的女朋友或女儿是受害者？大可以想象自己遭到性侵害的反感与痛苦呀，为何要把受害人先转化为“自己身边的女人”呢？太奇怪了。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "受欢迎的女人即好推倒的女人？", "x": "以前有个单身了好几年的人问我：“怎么才能找到男朋友啊？”我对她说：“你这么多年没有男人都过来了，今后肯定也没问题。”（笑）\n田房 因为有需求肯定已", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "第五章 我是女权主义者？", "x": "女权主义者就是自由的女性。她们可以直言“不要就是不要”，而且没有上下关系。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "男人很清楚自己的权力优势", "x": "人只能凭借自身的经验去理解他人，所以女性一旦主张权利，男性就只会理解为：“哦，你想变成我啊。”这是男性想象力的局限，而且这种理解意味着权力游戏中出现了新的竞争者，他们自然会认为自己的地位受到了威胁。不过在我们看来，则是“我才不想变成你那样！”“谁要变成这么无聊的生物啊！”。（笑）", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "男人很清楚自己的权力优势", "x": "男性要么趾高气扬地否定，要么选择逃避，不会有第三种反应。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "“女权主义者=想当男人的女人”的误解", "x": "媒体总在传播错误的女性主义形象，还制造了诸如“女人帝国”这种讽刺概念，可是，学男人能有什么好处呢？学男人就是成为支配者、掌控权力、向他人施压、散播歧视，那样只会制造新的被压迫者和被歧视者。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "女性主义是让女人坦然接受并爱上女人身份的思想", "x": "女性主义就是女人接受自己、爱自己的思想。现在我觉得，如果有下辈子，我更愿意当女人。", "y": "", "d": "2022-12-10"}]}, {"id": "30993976", "title": "极简主义改变了我", "author": "乔舒亚·贝克尔 埃里克·斯坦福", "cats": ["社会文化-社科"], "bmCount": 16, "rvCount": 0, "notes": [{"k": "h", "c": "家门内的革命", "x": "我就希望我们家也能是这个样子——有让人自由呼吸、享受生活的空间，不要那么多东西挡道。”\n这就是香侬的顿悟时刻，是改变的导火索。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "家门内的革命", "x": "你有没有经历过属于你的“极简顿悟时刻”？某件事让你睁开眼，看见了面前的杂乱，并敦促你行动起来改变现状？如果你还没有经历过，那我希望这本书能起到友善的助推作用。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "家门内的革命", "x": "极简主义并不是让你丢掉心爱的东西，而是丢掉那些让你分心、妨碍你享用心爱之物的东西。#极简之家", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "适用于所有人的美好生活法则", "x": "我对极简主义的定义是：“有意识地提升我们最珍视的事物的地位，把其余一切令我们分心的事物清理掉。”就像我有时喜欢说的，精简实际上是做优化——不断减少拥有物品的数量，直到找到最适合你和家人的那个量级。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "如何拥有极简之家？你需要的都在这里", "x": "当今的社会把囤积越来越多的物品粉饰成幸福的基础，在这样的环境下，“拥有更少物品”需要清醒的觉知、勇气，以及坚持不懈的精神。你必须克服自己的惯性，做出艰难的选择，建立极简生活的新习惯，并且把这种极简的状态维持下去。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "如何拥有极简之家？你需要的都在这里", "x": "当竭力想把东西推销给我们的人高喊着“买买买”的时候，极简主义温柔平和地邀请我们重新思考自己想要追寻的方向，并让我们把目光聚焦到最重要的东西上来。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第二章 贝氏极简整理法", "x": "亲手拿起每一个物件，然后问自己一个问题：我需要它吗？对于每个物件，在以下三个去向中做出选择：放到家里的其他地方、留在原处、不要了。如果你不要它了，再做一次选择：卖掉、捐出去、扔掉、回收。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第二章 贝氏极简整理法", "x": "把一个空间彻底收拾完，再开始下一个。\n○不要中途放弃，直到把整个家全部整理完毕。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "我需要它吗？", "x": "心理学中有个名词叫作禀赋效应（endowment effect），指的是我们倾向于夸大某个物品的价值——只是因为我们拥有它。这就解释了为什么扔东西那么难。它是我的！我们下意识地想要留着它。所以，我们必须有意识地把赋予它的附加价值消解掉。“我需要它吗？”这个问题能帮助我们斩断过度囤积中的非理性情结。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "一段自我激励的旅程", "x": "极简改造的加速器：清理重复物品", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "穷人的朋友", "x": "当你面临比较艰难的决定，或是和家庭成员对某件物品的意见不一致的时候，暂时把这样东西先搁置，在一段时间之内不去用它。我一般都推荐29天。过了这段时间之后再决定它是家庭必需品呢，还是冗余。我把这个方法称作“搁置试验”。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "既公共又私密的空间", "x": "做精简整理、亲手拿起每一件物品的过程中，记得这样问自己：这件东西符合我的目标吗？它是不是非常有用，以至于我必须留着它？它有没有好看到离开它我就不能活？或者它是不是极具纪念意义，一定要留着？换句话说，我需要它吗？只要答案是“不”，那就把它丢弃吧，而且高高兴兴地丢弃它。无论你丢弃的是什么，腾出来的空间都会比它更有价值。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "第四章 个人的避风港", "x": "想想看，这一切都始于她在一个没有杂物的旅馆房间里住了一周。\n旅馆房间可能并不是你家卧室的理想样板。但是，如果你也能花心思把不必要的物品清理出去，你也可以得到一间更安宁、让你更能好好休息的卧室。", "y": "", "d": "2024-02-23"}, {"k": "h", "c": "牢记卧室存在的意义", "x": "一套铺在床上，一套收纳起来或是在洗衣机里，这就足够了。", "y": "", "d": "2024-02-24"}, {"k": "h", "c": "第五章 建立你的标志形象", "x": "我的好朋友考特妮·卡佛把自己的衣橱精简到了一丁点儿大：只放33件衣物。几个月来，她一直穿着这些衣服，最近她对我说：“没有一个人注意到。", "y": "", "d": "2024-02-24"}, {"k": "h", "c": "谁说我们需要常变常新的时尚？", "x": "人们总说，衣橱里挂的衣服越多，生活就会越幸福。但心理体验和科学研究却告诉我们事实并非如此。实际上，选择越多，往往会导致幸福感降低——这就是选择的悖论。更不用说因为勉力想跟上不停变化的时尚潮流而产生的无尽挫败感了。", "y": "", "d": "2024-02-24"}]}, {"id": "23031772", "title": "西西弗神话（果麦经典）", "author": "[法]加缪", "cats": ["哲学宗教-西方哲学", "文学-散文杂著"], "bmCount": 15, "rvCount": 0, "notes": [{"k": "h", "c": "西西弗神话——论荒诞", "x": "吾魂哟勿求永生，\n但尽人事之可能。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞与自杀", "x": "蛀虫自在人心，必须深入人心去寻找。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞与自杀", "x": "自不待言，生活，从来就不是易事。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞与自杀", "x": "情愿死亡就意味确认了——即使本能地确认了这种习惯的可笑性，确认了活在世上缺乏深刻的理由，确认了每天这样躁动的荒谬性，毫无必要受苦受难。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞与自杀", "x": "相信人生的荒诞性，这种认识就必定支配一个人的行为", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞之壁", "x": "起床，乘电车，在办公室或工厂干四小时，吃饭，乘电车，再干四小时，吃饭，睡觉，而且星期一、星期二、星期三、星期四、星期五和星期六，全是同样的节奏，大部分时间里，这条路走得相当顺畅。不过有一天，突然萌生“为什么”的疑问，在这种带有惊讶色彩的厌倦中，一切就开始了。“开始了”，这很关键。一种机械生活的行止，到头来就是厌倦，但是厌倦也同时开启了意识的活动。厌倦唤醒了意识，并且挑起了一系列状况。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞之壁", "x": "回顾生活链条", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞之壁", "x": "厌倦是有益的。因为，一切都始于意识，只有通过意识才有价值。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞之壁", "x": "多少世纪以来，我们所理解的世界，无非是我们事先赋予它的各种形象和图景", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞之壁", "x": "在清醒的某些时刻，他们行为机械的样子，毫无意义的忸怩作态，能把他们周围的一切变得荒谬至极。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "荒诞之壁", "x": "如果能看出世界也同样，会爱和感到痛苦，那么人就会心平气和了。", "y": "", "d": "2025-04-05"}, {"k": "h", "c": "哲学式自杀", "x": "一个人没了希望，并且意识到了无望", "y": "", "d": "2025-04-06"}, {"k": "h", "c": "哲学式自杀", "x": "如果什么也填不满的无底虚无，就隐藏在事物的下面，那么人生除了绝望，又能怎么样呢？", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "哲学式自杀", "x": "如何从世界无意义的一种哲学出发，最终为世界找到一种意义和一种深度", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "哲学式自杀", "x": "思想，就是重新学会观察，就是引导自己的意识，将每个形象都变成一块福地", "y": "", "d": "2025-04-10"}]}, {"id": "3300017874", "title": "厌女（增订本）", "author": "[日]上野千鹤子", "cats": ["社会文化-社科"], "bmCount": 14, "rvCount": 0, "notes": [{"k": "h", "c": "2015年中文版作者序", "x": "比起男人的厌女症，女人的厌女症更加麻烦，因为女人的厌女症是自我厌恶。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第一章 喜欢女人的男人的厌女症", "x": "让我们想想那些被称为“性豪”的男人。他们喜欢夸耀“干”过的女人的数量。其实，这等于是在坦白，自己就是那条巴甫洛夫的狗，只要对方是女人，无论是谁都能让他们发情，对女人的身体、女人的性器甚至女人的符号或片断的肢体部位，都会条件反射地自动发生反应。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第一章 喜欢女人的男人的厌女症", "x": "甚至有女人为了知道什么是女人而研读吉行。的确，别的女人在床上的举止，不问男人是不知道的，所以要向女性经验丰富的男人请教。不过，她们终有一天会发现，那里描写的不是真实的女人，而是男人对女人的幻想。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第一章 喜欢女人的男人的厌女症", "x": "读到那篇随笔时，我被那个艺人的过分坦白吓了一大跳，也知道了靠人气吃饭的男人心理之脆弱。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第二章 男性同性社会性欲望·恐同·厌女症", "x": "厌女症就是绝不将女人视为与自己同等的性的主体，而是将女人客体化、他者化，更直接地说，就是歧视、蔑视。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第二章 男性同性社会性欲望·恐同·厌女症", "x": "所谓说“下流话”​，就是男人共同把女人当作性的客体将之贬低、用语言加以凌辱的一种仪式性交谈。不要以为以下半身为话题就等于下流话。下流话自有一套规则和程序，是男人作为性的主体进行相互确认的仪式。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第四章 “无人气男”的厌女症", "x": "而另一面的现实是，无论美丑老少，每个女人都有可能遭遇强奸。这个事实表明，男人不是对女人的属性而是对女人的符号发生反应而已。有身体障碍的女性，被剥夺了做女人的资格，却成为性骚扰的受害者；有智力障碍的女性，根本不被视为恋爱结婚的对象，却被强奸而怀孕。但是，没有任何一个论者把她们也置于“性弱者”的范畴之中。在“性市场”登场的“选手”中，存在着显著的社会性别的不对称。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第四章 “无人气男”的厌女症", "x": "对男人来说，​“有女朋友”意味着什么呢？为什么他们会说，即使没有学历、工作、收入，​“只要有了女朋友就行”呢？也就是说，为什么“有人气”对于男人会成为超越其他所有社会条件、带来最后逆转的资本呢？那是因为：​“只要有了女朋友”​，我就能成为一个男人。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第四章 “无人气男”的厌女症", "x": "“有女朋友”意味着被女人选上吗？根据在第二章介绍的塞吉维克的“男性同性社会性欲望”的概念，男人不是被女人选上而成为男人的[插图]，男人是在男人集团中被承认为正式成员后才成为男人的，女人只是加入其中的资格条件或成为成员之后的奖励。​“有", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第四章 “无人气男”的厌女症", "x": "对男人来说，女人最重要的功能是保护他的自尊心。无论哪个女人，都有讨男人喜欢的秘诀。那就是，绝不伤害男人的骄傲，一定要不知厌倦地倾听已经听过无数遍的男人的自夸，把自己的脸倾斜45度仰望他[插图]，像唱催眠曲一般在他耳边不断地喃喃低语“你真行，你好了不起”​。如若不信，敬请诸位自己去试一试。要是这个男人在第三者眼中无论如何也很难说有什么了不起，那就再加一句“知道你的好处的，只有我一个”​。然后还加上“你是我唯一的男人”​，就绝对完美无缺了。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第四章 “无人气男”的厌女症", "x": "据胜间本人说，她并不是喜欢有钱的男人，而是经验告诉她：​“面对年收入六百万日元的女人，没有一千万，男人的面子就没法维持。​”可见，她从现实中学到，男女关系的平衡，无论如何终究要让男人居上位，要“女人给男人面子”​，才能够勉强得以维持。那么危险又脆弱的东西，据说就是男人的“自我确认”​。", "y": "", "d": "2024-09-27"}, {"k": "h", "c": "第十六章 厌女症能够超越吗", "x": "让一个男人“成为男人”的，是其他男人；承认一个男人“成为男人”的，也是其他男人。女人至多不过是男人“成为男人”的道具，或作为“成为男人”的证明伴随而来的报酬奖赏而已。", "y": "", "d": "2025-06-28"}, {"k": "h", "c": "第十六章 厌女症能够超越吗", "x": "与此相反，让女人“成为女人”的，是男人；证明一个女人“成为女人”的，也是男人。", "y": "", "d": "2025-06-28"}, {"k": "h", "c": "第十六章 厌女症能够超越吗", "x": "只要女人还是被置于围绕男人（被男人选上）的潜在竞争关系之中，女性之间的同性社会性纽带，即使存在，也是很脆弱的吧。这正可以解释，女人的嫉妒，为什么不是对背叛了自己的男人，而是指向同性的女人。", "y": "", "d": "2024-10-11"}]}, {"id": "925245", "title": "哲学的慰藉", "author": "阿兰·德波顿", "cats": ["哲学宗教-西方哲学"], "bmCount": 12, "rvCount": 0, "notes": [{"k": "h", "c": "Ⅱ 塞内加挫折词典", "x": "哲学的任务是教会我们在愿望碰到现实的顽固之壁时，以最软的方式着陆。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅱ 塞内加挫折词典", "x": "人是什么？就是那轻轻一碰就会破裂的血管……一具脆弱的、赤条条、生来没有防护的身体，有赖于别人的帮助，任凭命运的作弄。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅱ 塞内加挫折词典", "x": "如果你想消除一切担心，那么请设想你所害怕的一切都会发生。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅱ 塞内加挫折词典", "x": "智者不会因为自己身材矮小而妄自菲薄，但是他还是宁愿长得高大。智者可以没有朋友而生活下去，在这个意义上他是自足的，但这不等于他愿意没有朋友。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅱ 塞内加挫折词典", "x": "你问我有哪些进步？我开始成为我自己的朋友。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅲ", "x": "智者知道什么是必然，立即顺从它，而不徒耗精力去抗议。一位智者听说他的行李在转运中遗失了，他几秒钟之内就放弃了。塞内加讲述了斯多葛派对丧失财产的反应：当芝诺收到一次海难的消息，知道他的全部行李都丢失了时，他说“命运之神要我做一个负担轻一些的哲学家”。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅲ", "x": "何必为部分生活而哭泣？君不见全部人生都催人泪下。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅰ", "x": "它教给我们如何无怨无惑地度过一生。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅰ", "x": "自知说了或做了蠢事，那不算什么，我们必须吸取的更加充分而重要的教训是：我们都是大笨蛋。", "y": "", "d": "2024-06-20"}, {"k": "h", "c": "Ⅱ 一则当代的爱情故事加叔本华式的注释", "x": "他不是想要使我们沮丧，而是要使我们摆脱期望，因为期望引发怨恨。", "y": "", "d": "2024-06-21"}, {"k": "h", "c": "Ⅻ", "x": "我们一定要学会忍受无法避免的苦难。", "y": "", "d": "2024-06-21"}, {"k": "h", "c": "XXIII", "x": "使我们感觉好些的不一定对我们好。使我们感到痛的不一定对我们不好。", "y": "", "d": "2024-06-21"}]}, {"id": "3300069385", "title": "社会契约论", "author": "[法]卢梭", "cats": ["哲学宗教-西方哲学"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "第一节 论第一章主旨", "x": "人人生而自由，却无处不在枷锁中。自以为是主子，却更像是奴隶。", "y": "", "d": "2024-04-30"}, {"k": "h", "c": "第二节 论最初的社会", "x": "人的首要法则，是维持生存；人的首要关注，是关注自身。人一旦达到理智年龄，对采取何种适合自身的生存方式而言，他就是唯一的法官，并从此成为自身的主人。", "y": "", "d": "2024-04-30"}, {"k": "h", "c": "第二节 论最初的社会", "x": "人人生而自由平等，仅为自身利益才会让渡自由。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第二节 论最初的社会", "x": "首领对臣民并不存在父爱，取而代之的，是发号施令之乐。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第二节 论最初的社会", "x": "按照这种观点，各色人种就像牛羊一样，分群而居，每一群都有为吃掉它们而看管它们的统治者。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第二节 论最初的社会", "x": "奴隶在枷锁之下丧失了一切，甚至丧失了摆脱枷锁的愿望：他们爱上了被奴役的状况", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第三节 论最强者的权利", "x": "即使是最强者，也绝不可能强大到永远是主人，除非把强力转为权利，把服从转为义务。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第四节 论奴隶制", "x": "让自己成为他人奴隶之人，并不是奉送自己，而是出卖自己，至少也是为生存而出卖自己。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第四节 论奴隶制", "x": "但是，出卖自己，可以换来什么？国王非但不能供养臣民，反而其生存只能依靠臣民。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第四节 论奴隶制", "x": "构成战争状态的，是物与物的关系，而不是人与人的关系。", "y": "", "d": "2024-05-20"}]}, {"id": "23914574", "title": "前端工程化：体系设计与实践", "author": "周俊鹏", "cats": ["社会文化-法律"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 前端工程简史", "x": "最后结合作者的经验，讲述如何以Node.js为底层平台、以webpack为构建体系核心打造一套完整的前端工程解决方案。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.1 前端工程师的基本素养", "x": "Node.js对前端生态的促进，以及对同构开发的支持是PHP、Java等语言远不能比及的，本书所探讨的前端工程方案便是以Node.js为底层平台实现的。“大前端”模式下的前端工程师跨越了之前浏览器与服务器端之间看似难以逾越的鸿沟，踏入了Web服务器端开发领域。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.1 前端工程师的基本素养", "x": "从最初的重交互/UI，轻JavaScript的开发模式，到交互、UI、逻辑一把抓，再到“大前端”的服务器端、客户端全掌控，前端工程师的工作内容和工作职责不断扩宽。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.1 前端工程师的基本素养", "x": "· 硬技能：HTML/CSS/JavaScript。这3项是前端工程师从蛮荒年代发展至今从未脱离的核心技术。· 软技能：用户体验。用户体验是Web产品吸引用户的第一道菜，也是前端工程师工作产出的重点。· 扩展技能：Node.js。并非特指Node.js本身，而是Node.js所代表的Web服务器端知识。即使你不是一个“大前端”，了解Web产品的运行原理也是一个前端工程师必备的素养。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.1 前端工程师的基本素养", "x": "所以，数据结构、算法、软件工程等基础知识对于前端工程师同样重要，这些知识能够决定一个前端工程师的上限。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.2 Node.js带给前端的改革", "x": "除了服务器端开发外，Node.js对前端最大的贡献是丰富了前端工具生态。在Node.js出现以前，没有Grunt、Gulp、webpack等便捷且强大的工具，压缩合并JavaScript、CSS代码对于前端工程师来说是一项非常艰难的任务。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.2 Node.js带给前端的改革", "x": "目前耳熟能详的前端工具，比如Grunt、Gulp、webpack，无一不是由Node.js承载的。结合JavaScript的灵活性与Node.js提供的API，前端工程师可以编写各种工具满足项目的开发需求。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.5 工程化方案架构", "x": "目前市场上流行的前端工具大体分为3类，分别介绍如下。1．工作流管理工具，比如Grunt、Gulp。2．构建工具，比如webpack、rollup。3．整体解决方案，比如FIS、WeFlow。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.5 工程化方案架构", "x": "得益于庞大的生态圈，使用Node.js开发命令行工具并不是一件难事，我们可以借助优秀的辅助工具完成，比如commander.js。", "y": "", "d": "2021-12-07"}, {"k": "h", "c": "1.5 工程化方案架构", "x": "commander.js是一个实现命令行交互的Node.js模块，由著名的工程师TJ Holowaychuk编写。", "y": "", "d": "2021-12-07"}]}, {"id": "23364890", "title": "中国古代文化常识（插图修订第4版）", "author": "王力", "cats": ["社会文化-文化"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 天文", "x": "“五星出东方利中国”是古代星占学上很常见的占辞。《史记·天官书》上说：“五星分天之中，积于东方，中国利；积于西方，外国用兵者利。”在《汉书》《晋书》《隋书》《新唐书》天文志以及《开元占经》里都能见到类似的记载。\n“五星积于东方”和“五星出东方”是指五大行星在某段时期内，在日出前同时出现在东方。这种天象非常罕见，所以引起古人的好奇与重视，把这种天象附会上某种“天意”。比如《文献通考》上就有“周将伐殷，五星聚房”之说。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第一章 天文", "x": "五星聚合一般要几十年乃至上百年才能出现一次。中国上一次出现聚合（间距＜30°）的时间是公元1921年。下一次出现五星聚合的时间则是公元2040年了。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第一章 天文", "x": "金星黎明见于东方叫启明，黄昏见于西方叫长庚，所以《诗经》说“东有启明，西有长庚”", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第一章 天文", "x": "因此后世把兄弟不和睦比喻为参辰或参商。又因为参宿居于西方，心宿居于东方，出没两不相见，所以后世把亲朋久别不能重逢也比喻为参辰或参商。杜甫《赠卫八处士》所说的“人生不相见，动如参与商”，就是这个意思。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第一章 天文", "x": "北斗是由天枢、天璇、天玑、天权、玉衡、开阳、摇光七星组成的，古人把这七星联系起来想象成为古代舀酒的斗形。天枢、天璇、天玑、天权组成为斗身，古曰魁；玉衡、开阳、摇光组成为斗柄，古曰杓(biāo)。北斗七星属于大熊座。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第一章 天文", "x": "古人很重视北斗，因为可以利用它来辨方向，定季节。把天璇、天枢连成直线并延长约五倍的距离，就可以找到北极星，而北极星是北方的标志。北斗星在不同的季节和夜晚不同的时间，出现于天空不同的方位，人们看起来它在围绕着北极星转动，所以古人又根据初昏时斗柄所指的方向来决定季节：斗柄指东，天下皆春；斗柄指南，天下皆夏；斗柄指西，天下皆秋；斗柄指北，天下皆冬。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第一章 天文", "x": "十二星座传入中国居然是在一千多年前，在没有见到考古证据以前，大家一般是很难想象的。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第二章 历法", "x": "以朔望月为单位的历法是阴历，以太阳年为单位的历法是阳历。我国古代的历法不是纯阴历，而是阴阳合历。平年十二个月，有六个大月各三十天，六个小月各二十九天（这是因为月相变化的周期在二十九到三十天之间，现代测得是29.53日），全年总共354天。但是这个日数少于一个太阳年。《尚书·尧典》说：“期三百有六旬有六日”，实际上四季循环的周期约为365虔蚣日，比十二个朔望月的日数约多11虔蚣日，积三年就相差一个月以上的时间，所以三年就要闰一个月，使历年的平均长度大约等于一个太阳年，并和自然季节大致调和配合。", "y": "", "d": "2024-02-09"}, {"k": "h", "c": "第二章 历法", "x": "干支的组合是天干的单数配地支的单数，天干的双数配地支的双数，所以不可能有“甲丑”“乙寅”之类。", "y": "", "d": "2024-02-09"}]}, {"id": "858742", "title": "作为意志和表象的世界", "author": "叔本华", "cats": ["哲学宗教-哲学著作"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "叔本华的生平及哲学", "x": "想一个自己从未深入思考的问题是危险的，我们读书是别人替我们思考，我们不过是在重复作者的精神过程而已。所以一个人如果整日读书，他将逐渐失去思考能力。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "叔本华的生平及哲学", "x": "1803年春天，叔本华在双亲的陪同下，开始周游欧洲各国，三人一行经荷兰远渡英国，再转到法国、意大利、奥地利、瑞士等国，历时近两年，才折回汉堡。即使在游历期间，他的父亲也命他进修英语、法语，母亲嘱咐他写日记，对他的教育丝毫未尝放松。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "译者的话", "x": "意志的本性是恶性循环的，欲望得不到满足，就会痛苦，而偏偏不如意事又十有八九，所以，人生大多数时候是痛苦的。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "译者的话", "x": "其次，纵使欲望得到满足，满足感也无法长久维持，其结果不是产生新的欲望而带来新的痛苦，就是造成厌烦感。所以，人生永远在痛苦和厌烦之间徘徊，所谓快乐只是暂时现象，只是痛苦的间歇：因此，快乐是消极意义上的。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "译者的话", "x": "20世纪的人类身受两大劫难：外来的威胁和恐怖；内心的空虚与苦闷。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "英译者序言", "x": "人类意志永远在痛苦和厌倦之间徘徊，叔本华对此发出忧郁的悲叹。人生一半是失望的痛苦，另一半是厌倦的痛苦", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "第一层面 遵循充足理由原则的表象：经验与科学的对象", "x": "第一层面 遵循充足理由原则的表象：经验与科学的对象\n一\n1\n“世界是我的表象[插图]”——这是一个真理，虽然只有人类才能在反省和抽象意识中思考这个真理，然而，却适用于一切有生命和有认识能力的人。如果人类能在反省和抽象意识中思考这个真理，他就获得了哲学的智慧。", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "第一层面 遵循充足理由原则的表象：经验与科学的对象", "x": "“世界是我的表象￼”——这是一个真理，虽然只有人类才能在反省和抽象意识中思考这个真理，然而，却适用于一切有生命和有认识能力的人。如果人类能在反省和抽象意识中思考这个真理，他就获得了哲学的智慧。因此，人类就会明白，当自己认知太阳和大地时，认知的并非太阳和大地本身，而是见到太阳的眼睛和触摸大地的手；他周围的世界只是表象，只是和意识有关的东西，和人类有关的东西", "y": "", "d": "2022-12-10"}, {"k": "h", "c": "第一层面 遵循充足理由原则的表象：经验与科学的对象", "x": "凡是在知识上存在的东西，包括整个世界，也只是与主体相关的客体，只是知觉者所具有的知觉：总而言之，只是表象。", "y": "", "d": "2022-12-10"}]}, {"id": "36557721", "title": "西西弗神话", "author": "[法]阿尔贝·加缪", "cats": ["哲学宗教-西方哲学", "文学-散文杂著"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "导读", "x": "人的必死性是人类荒诞命运的基础，因此哲学家们试图从这样或者那样的角度确定存在的意义，以求证生命的合法性", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "导读", "x": "起床，电车，四小时待在办公室里，或者在工厂里，吃饭，然后再是电车，四小时的工作，吃饭，睡觉，周一周二周三周四周五和周六，都是同样的节奏，大多数的时间里，这条路也不会有什么问题。只是有一天，突然间就问了个‘为什么’，于是，在这份惊讶所掩藏的厌倦中，一切开始了”。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "导读", "x": "荒诞的命运是任谁都回避不了的，也并不因为清醒的认识就可以避得开", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "导读", "x": "巨石的滚落就好像人的必死性。然而，除了平静地一次又一次地迎接命运的挑战之外，人还有更好的昭示尊严的途径吗？", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "导读", "x": "人是不幸福的，这千真万确；但另一个千真万确的真相是，即便如此，人从来没有停下过追求幸福的脚步。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "荒诞的自由", "x": "以前，是要知道生命是否有意义，值得我们活过。而此时，恰恰相反，正是因为生命很可能没有意义，它才值得更好地活过。经历某一种经验，经历命运，就是充分地接受它。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "哲学与小说", "x": "创造，就是活过两次", "y": "", "d": "2025-02-21"}]}, {"id": "23640906", "title": "毛泽东传（全6卷）", "author": "中共中央文献研究室", "cats": ["政治军事-政治", "人物传记-军政领袖"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 出乡关", "x": "临行前，他改写了一首诗，夹在父亲每天必看的账簿里：“孩儿立志出乡关，学不成名誓不还。埋骨何须桑梓地，人生无处不青山。”", "y": "", "d": "2021-05-06"}, {"k": "h", "c": "第1章 出乡关", "x": "柳潜借给他一套《御批历代通鉴辑览》，共一百一十六卷。他读得很认真。读完后，收获很大，愈发觉得在学校里读书还不如自学。毛泽东对他认定了的事，是敢于采取哪怕惊世骇俗的行动的。他断然决然地从湖南全省高等中学校退学，寄居在长沙新安巷的湘乡会馆，每天步行三里路到浏阳门外定王台的湖南省立图书馆自学。", "y": "", "d": "2021-05-06"}, {"k": "h", "c": "第2章 师范生", "x": "当毛泽东进入一师时，中国正处于令人难熬和困惑的沉闷岁月。皇朝变成了共和，中国却并未由此获得新生。", "y": "", "d": "2021-05-06"}, {"k": "h", "c": "第2章 师范生", "x": "五四前期，毛泽东的思想中有一个最突出的根本点，就是首先要把握住事物的“本原”或“大本大原”。它的意思，是在面对万千事物时，要从大处着眼，首先抓住它的根本。把根本抓住了，其他枝节问题才能迎刃而解。以后，他也常强调要善于抓住要领，抓住主要矛盾，强调纲举才能目张，小道理要服从大道理。", "y": "", "d": "2021-05-06"}, {"k": "h", "c": "第2章 师范生", "x": "毛泽东强调一个人要有坚强的意志。他在《讲堂录》的笔记中就写下：“拿得定，见得透，事无不成。”", "y": "", "d": "2021-05-06"}, {"k": "h", "c": "第3章 五四大潮的洗礼", "x": "毛泽东总是扎扎实实地走自己的路。这是又一次的自我剖析和扬弃。事实的教训，使他终于摆脱开对社会改良道路的最后一点幻想，使他更加义无反顾地走上革命的道路，下这个决心实在是不容易的。一旦下定了决心，他再也没有回过头。", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "第3章 五四大潮的洗礼", "x": "四十年后，他对英国元帅蒙哥马利说：“革命不是哪里想干不想干的问题，我最初就没有想过干革命的问题。我那时当小学教员，当时也没有共产党，是因为形势所逼，不能不干。”", "y": "", "d": "2021-05-18"}]}, {"id": "3300021025", "title": "在熟悉的家中向世界道别", "author": "[日]上野千鹤子", "cats": ["社会文化-社科"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 “独自一人”不可以吗？", "x": "因为我们已经知道，独居生活并没有那么糟糕，真的试一下独居生活的话，甚至会觉得竟然挺不错的。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "第1章 “独自一人”不可以吗？", "x": "因为和别人组成家庭只是人生的一个阶段，一旦过了该阶段，大家都一样，都会变成独居者。或早或晚，每个人都要回到独自一人的状态。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "第1章 “独自一人”不可以吗？", "x": "比起哀叹和警告，积极地去思考应对之策才是要紧事。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "数据显示：“晚年的时候，独居者是最幸福的”", "x": "其实，别人虽然关心你会不会疼，有什么痛苦，但这终归是隔靴搔痒，无法真正体会你的疼痛，所以，你就算说出来也没什么用。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "数据显示：“晚年的时候，独居者是最幸福的”", "x": "反正有什么病痛也只能自己承受，没什么好对人言说的。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "老两口家庭的生活满意度是最低的", "x": "一个人的烦恼，与其说来自自己，不如说来自周围环境。", "y": "", "d": "2025-03-01"}]}, {"id": "38154770", "title": "单向度的人（世纪人文系列丛书·世纪文库）", "author": "赫伯特·马尔库塞", "cats": ["哲学宗教-西方哲学"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "译者的话", "x": "当代工业社会是一个新型的极权主义社会，因为它成功地压制了这个社会中的反对派和反对意见，压制了人们内心中的否定性、批判性和超越性的向度，从而使这个社会成了单向度的社会，使生活于其中的人成了单向度的人。\n“向度”（dimension）一词又可译作“方面”和“维度”，这里把它译作“向度”，主要是想传达原文中的价值取向和评判尺度的意思。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "译者的话", "x": "单向度的人，即是丧失否定、批判和超越的能力的人。这样的人不仅不再有能力去追求，甚至也不再有能力去想像与现实生活不同的另一种生活", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "译者的话", "x": "技术的进步使发达工业社会可以在富裕的生活水平上，让人们满足于眼前的物质需要而付出不再追求自由、不再想像另一种生活方式的代价", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "译者的话", "x": "由于技术进步的作用，发达工业社会虽是一个不自由的社会，但毕竟是一个舒舒服服的不自由社会；虽是一个更有效地控制着人的极权主义社会，但毕竟是一个使人安然自得的极权主义社会。这就是它的新颖之处。", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "单向度的社会", "x": "一种舒舒服服、平平稳稳、合理而又民主的不自由", "y": "", "d": "2025-01-04"}, {"k": "h", "c": "单向度的社会", "x": "不是工作的自由就是挨饿的自由，它给绝大多数人带来了艰辛、不安和焦虑", "y": "", "d": "2025-01-04"}]}, {"id": "33889243", "title": "理想国（汉译世界学术名著丛书）", "author": "[古希腊]柏拉图", "cats": ["哲学宗教-西方哲学", "哲学宗教-哲学著作"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "译者引言", "x": "见仁见智，存乎其人。毁之誉之，各求所安。", "y": "", "d": "2024-05-20"}, {"k": "h", "c": "第一卷", "x": "大大方方，心平气和", "y": "", "d": "2024-05-21"}, {"k": "h", "c": "第一卷", "x": "一个好人，同时忍受贫困、老年，固然不容易，但是一个坏人虽然有钱，到了老年其内心也是得不到满足和宁静的。", "y": "", "d": "2024-05-21"}, {"k": "h", "c": "第一卷", "x": "大凡不亲手挣钱的人，多半不贪财；亲手挣钱的才有了一文想两文。像诗人爱自己的诗篇，父母疼自己的儿女一样，赚钱者爱自己的钱财，不单是因为钱有用，而是因为钱是他们自己的产品。", "y": "", "d": "2024-05-21"}, {"k": "h", "c": "第一卷", "x": "这么说，所有的事物统统都是这样的吗？——它们有用，正义就无用，它们无用，正义就有用了？", "y": "", "d": "2024-05-21"}, {"k": "h", "c": "第一卷", "x": "每一种统治者都制定对自己有利的法律，平民政府制定民主法律，独裁政府制定独裁法律，依此类推。他们制定了法律明告大家：凡是对政府有利的对百姓就是正义的；谁不遵守，他就有违法之罪，又有不正义之名。因此，我的意思是，在任何国家里，所谓正义就是当时政府的利益。政府当然有权，所以唯一合理的结论应该说：不管在什么地方，正义就是强者的利益。", "y": "", "d": "2024-05-24"}]}, {"id": "40457732", "title": "圆圈正义：作为自由前提的信念", "author": "罗翔", "cats": ["社会文化-法律"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "代序：法律人的热点写作", "x": "理查德·巴克斯特说: 我们时常妒忌比我们地位高的人,藐视地位不及我们的人; 垂涎别人的名望、财富, 或者傲慢、冷酷地看待别人的贫寒窘迫。看到外形姣好的人, 则诱发我们的情欲; 看见有残疾的人, 就引发我们的鄙夷之心……我们自己才是自己最大的网罗。", "y": "", "d": "2021-11-11"}, {"k": "h", "c": "代序：法律人的热点写作", "x": "良心是唯一不能从众之事。", "y": "", "d": "2021-11-11"}, {"k": "h", "c": "圆圈正义", "x": "就像康德所说的, 道德本来就不教导我们如何使自己幸福, 而是教导我们如何使自己无愧于幸福。", "y": "", "d": "2021-11-11"}, {"k": "h", "c": "圆圈正义", "x": "世界上最远的距离就是“知道”和“做到”。", "y": "", "d": "2021-11-11"}, {"k": "h", "c": "圆圈正义", "x": "爱不是爱抽象的概念, 而是爱具体的人; 不是爱“人类”, 而是爱“人”。", "y": "", "d": "2021-11-11"}, {"k": "h", "c": "圆圈正义", "x": "人类是抽象的, 并无具体的对象, 无须投入真心, 收放自如, 还可以为自己赢得道德上的优越感, 但具体的人总是有那么多的问题, 总是那么的不可爱。爱是要付出代价、恒久忍耐的。真正的爱永远是对具体个人的爱。", "y": "", "d": "2021-11-11"}]}, {"id": "850101", "title": "一本小小的蓝色逻辑书", "author": "布兰登·罗伊尔", "cats": ["哲学宗教-逻辑学"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "选择性感知", "x": "积极的思考者总是会尽量扩大自己的视野，从不同视角考虑问题，交叉核实自己获取的信息。", "y": "", "d": "2019-04-28"}, {"k": "h", "c": "选择性感知", "x": "我们总是会有选择地去理解一些事情，以此来满足自己的需求。打个比方，如果我们内心深处“希望”或“需要”一件事情是“这样”或者“那样”的，我们就会有意识地选择、删减、排列自己所搜集的信息，使得这件事情变成我们所希望或需要的样子。这就是所谓的选择性感知。换句话说，我们只会看见自己想看见的东西。所以我们只会看见那些跟自己的目标、兴趣、期待或以往的经历有关的东西——“当一个人手里拿着锤子的时候，他看什么都像是根钉子”。", "y": "", "d": "2019-04-29"}, {"k": "h", "c": "第2章 如何进行创意思考", "x": "要想发挥创造力，最关键的是要有新点子、新想法。一般来说，产生新点子的方式主要有“头脑风暴”“点子孵化器”和“点子杀手”。从解决问题的角度来说，要想先判定一个问题究竟是不是问题，最好的办法就是重述这个问题。", "y": "", "d": "2019-04-29"}, {"k": "h", "c": "魔鬼代言人", "x": "所谓“魔鬼代言人”，就是那些硬抬杠，拼命为相反观点辩护的人。你可以当自己的魔鬼代言人，提出各种反对观点或者对自己不利的证据，从而让你的观点更经得起推敲。", "y": "", "d": "2019-04-29"}, {"k": "h", "c": "头脑风暴", "x": "头脑风暴的主要规则是，大家提出点子时，数量比质量更重要；新奇的想法要永远受到鼓励和欢迎；等所有人都提出想法之后再评估；鼓励“搭顺风车”。", "y": "", "d": "2019-04-29"}, {"k": "h", "c": "五个常见的推理漏洞", "x": "人们在推理时最常出现的五个推理漏洞：把橘子跟苹果做比较；以偏概全；对相关的证据视而不见；混淆因果关系；在执行计划时没有提前考虑到可能出现的瓶颈。", "y": "", "d": "2019-04-29"}]}, {"id": "3300082668", "title": "虚无主义【刘擎周濂推荐 | 直面虚无，找到意义：写给当代人的反“空虚”指南！】", "author": "[荷兰]诺伦·格尔茨", "cats": ["哲学宗教-哲学读物"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "中译本序言", "x": "在我看来，一本好书的标准是能否在有限的篇幅里，条分缕析地把一个复杂混乱的问题说清楚；即使问题说不清楚，也能够把为什么说不清楚说清楚。", "y": "", "d": "2025-02-13"}, {"k": "h", "c": "“什么都不做”", "x": "虚无主义被假定是某种黑暗的东西，某种消极的东西，某种破坏性的东西。", "y": "", "d": "2025-02-14"}, {"k": "h", "c": "“什么都不做”", "x": "而只是在暗示你在做不值得一提的事情。然而，如果我们确实像我已经指出的那样，在频繁进行这样的对话，那么这意味着我们在频繁浪费我们的时间做不值得一提的事情。而且如果我们花费了如此多的时间做不值得一提的事情，那么这样的对话很可能就会非常接近于我们所认为的虚无主义，很可能意味着我们的生活不值得一提，意味着我们没有为自己的生活做任何事情，意味着我们就是虚度人生，意味着我们浑浑噩噩", "y": "", "d": "2025-02-14"}, {"k": "h", "c": "“什么都不做”", "x": "在这一意义上，浑浑噩噩并不会要求我们对虚无抱有一种特别的信仰，而是说我们正在抱着“生活不值得”的想法过日子", "y": "", "d": "2025-02-14"}, {"k": "h", "c": "“什么都不做”", "x": "就等同于一切都无所谓", "y": "", "d": "2025-02-14"}]}, {"id": "910669", "title": "幸福之路", "author": "[英]罗素", "cats": ["哲学宗教-哲学著作"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "译者弁言", "x": "人生的暴风雨和自然界的一样多，来时也一样的突兀；有时内心的阴霾和雷电，比外界的更可怕更致命。所以我们多一个向导，便多一重盔甲，多一重保障。", "y": "", "d": "2020-03-13"}, {"k": "h", "c": "一 什么使人不快乐？", "x": "如今，完全相反了，我感到人生的乐趣；竟可说我多活一年便多享受一些。这一部分是因为我发见了自己最迫切的欲望究竟是什么，并且慢慢地实现了不少。一部分是因为我终于顺顺利利地驱除了某些欲望，——例如想获得关于这个那个的确切的智识——当做根本不可求的。但最大部分，还须归功于一天天的少关心自己。像旁的受过清教徒教育的人一样，我惯对自己的罪过，愚妄，和失败，作种种的冥想。我觉得自己是——当然是准确地——个可怜的标本。慢慢地，我学会了对自己和自己的缺陷不再介介于怀；而对外界的事物，却一天天的集中我的注意：臂如世界现状，知识的各部门，以及我抱有好感的个人等。不错，对外界的关切也会有各别的烦恼带给你：世界可能陷入战争，某种知识可能难于几及，朋友可能死亡。但这一类的痛苦，不象因憎恶自己而发生的痛苦那样，会破坏人生的主要品质。再则，每种对外的兴趣，都有多少活动分配给你；而兴趣活泼泼地存在到多久，这活动就能把苦闷阻遏到多久。相反地，对自己的关切绝对不能领你去作任何进取的活动。它可以鼓励你记日记，把自己作心理分析，或者去做修士。但一个修士，必得在修院的功课使他忘掉自己的灵魂的时光，才会幸福。他以为靠了宗教得来的幸福，其实靠着清道夫的行业一样可以得到，只要他真正做一个清道夫。有一般人是因为深陷在“自我沉溺”之中而无可救药的，对于他们，外界的纪律确是一条引向幸福的路。", "y": "", "d": "2020-03-14"}, {"k": "h", "c": "三 竞争", "x": "过于重视竞争的成功，把它当作幸福的主源：这就种下了烦恼之根。", "y": "", "d": "2025-10-28"}, {"k": "h", "c": "五 疲劳", "x": "对付无论何种的恐惧的正当办法，是集中精神，合理地、镇静地把恐惧想一个彻底，直到你和它完全熟习为止。", "y": "", "d": "2020-03-21"}]}, {"id": "3300151432", "title": "人生解忧：佛学入门四十讲", "author": "成庆", "cats": ["哲学宗教-宗教"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "缘起 普遍的心灵危机下，何处寻找安心之道？", "x": "表面上我们似乎重视现实，积极地投入世俗生活，但精神却总游离于当下；而佛学正好相反，看上去对于现实缺乏野心，不乐追逐，游离于现实世界之外，但其教导却旗帜鲜明地拒绝“妄想纷飞”，强调活在当下。", "y": "", "d": "2025-07-24"}, {"k": "h", "c": "缘起 普遍的心灵危机下，何处寻找安心之道？", "x": "往内看：训练安定与觉察", "y": "", "d": "2025-07-24"}, {"k": "h", "c": "缘起 普遍的心灵危机下，何处寻找安心之道？", "x": "安定(focus)，即专注的能力，也就是能随时专注在当下所做的事情上；而觉察(awareness)，则是一种反观自己感受的能力，比如能随时了解自己的身心状态", "y": "", "d": "2025-07-25"}, {"k": "h", "c": "缘起 普遍的心灵危机下，何处寻找安心之道？", "x": "正如佛家所言，“苦”是人类的永恒主题，我们如何改变自己的认知，获得有智慧的“灭苦之道”？", "y": "", "d": "2025-07-25"}]}, {"id": "23789204", "title": "弱传播", "author": "邹振东", "cats": ["社会文化-社科"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "Ⅱ 我们生活在两个世界", "x": "信息只有被传播，才有价值；传播只有被关注，才能实现价值。", "y": "", "d": "2020-03-01"}, {"k": "h", "c": "Ⅱ 我们生活在两个世界", "x": "舆论世界也是如此，它对现实世界的反映永远是片面的、局部的、有选择性的。", "y": "", "d": "2020-03-01"}, {"k": "h", "c": "Ⅲ 舆论是怎样的世界", "x": "舆论的力量是靠聚集产生的，而不是靠法律和命令自上而下的。聚集的扩大，就是往底层扩大。舆论的力量比的是认同者的多寡。于是，舆论的世界里，弱者天然占据优势。这就是舆论世界的第二条丛林法则：争取认同，强肉弱食。", "y": "", "d": "2020-03-01"}, {"k": "h", "c": "Ⅳ 弱传播理论", "x": "舆论世界的四大规律概括起来就是四句话：弱者优势，情感强势，轻者为重，次者为主。", "y": "", "d": "2020-03-01"}]}, {"id": "695126", "title": "最好的告别：衰老的真相，医学的边界", "author": "[美]阿图·葛文德", "cats": ["社会文化-社科"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "自序 一介凡夫 医生也许都想错了", "x": "可见一个理智的人在死亡降临的时候还是无法舍弃求生的欲望。", "y": "", "d": "2020-09-22"}, {"k": "h", "c": "03 依赖 我们为老做好准备了吗", "x": "老年是一系列连续不断的丧失。”", "y": "", "d": "2020-09-28"}, {"k": "h", "c": "绝望疗养院里的疯狂计划", "x": "随着年龄增长，我们都学会从简单的愉悦中寻求慰藉——友情、日常的例行公事、好食物的味道，以及阳光照在脸上的那种温暖。我们对于实现和积累的奖赏兴趣变小了，对于仅仅活着的奖赏兴趣加大了。", "y": "", "d": "2020-09-28"}]}, {"id": "3300014694", "title": "有限与无限的游戏：一个哲学家眼中的竞技世界", "author": "[美]詹姆斯·卡斯", "cats": ["哲学宗教-哲学读物"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 世上至少有两种游戏（一）", "x": "世上至少有两种游戏。一种可称为有限游戏，另一种称为无限游戏。\n有限游戏以取胜为目的，而无限游戏以延续游戏为目的。", "y": "", "d": "2026-10-28"}, {"k": "h", "c": "第一章 世上至少有两种游戏（一）", "x": "有限游戏受外部界定，而无限游戏受内部设定。无限游戏的时间不是世界时间，而是游戏内部所创造的时间。由于每个无限游戏都消除了界限，因此它向参与者展开了一个新的时间视界", "y": "", "d": "2026-10-29"}]}, {"id": "23437971", "title": "生育制度", "author": "费孝通", "cats": ["社会文化-社科"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 族绵续的保障", "x": "当前的世界上，我们到处可以看见男女们互相结合成夫妇，生出孩子来，共同把孩子抚育成人。这一套活动我将称之为生育制度。", "y": "", "d": "2026-07-31"}, {"k": "h", "c": "损己利人的生育", "x": "生育制度是人类种族绵续的人为保障。", "y": "", "d": "2026-08-09"}]}, {"id": "3300151161", "title": "对工作说不", "author": "[英]大卫·弗雷恩", "cats": ["社会文化-社科"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "引言 工作教条", "x": "他们的事业比争取更公平的薪资和更良好的工作环境的传统工会更进一步：承认在工作内部需要更多自由和平等，但也同时为工人有权在工作之外过上更丰富的生活而斗争。这些自治主义者反对资本主义社会中时间的虚度、多样性的缺乏以及对日常生活的过度监管，他们为工人们能感受阳光洒在皮肤上、和自己的孩子玩耍、培养工厂工作之外的爱好和技能，以及在夜间安然入睡的权利而战。", "y": "", "d": "2026-01-26"}, {"k": "h", "c": "引言 工作教条", "x": "阅读这些批判的过程就是接受一次对自身欲望的再教育，提醒他们时间可以用不同的方式度过。", "y": "", "d": "2026-01-26"}]}, {"id": "3300027208", "title": "乡土中国（果麦经典）", "author": "费孝通", "cats": ["社会文化-社科"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "文字下乡", "x": "乡下人没有见过城里的世面，因之而不明白怎样应付汽车，那是知识问题，不是智力问题，正等于城里人到了乡下，连狗都不会赶一般。", "y": "", "d": "2025-10-19"}, {"k": "h", "c": "差序格局", "x": "子曰：“为政以德，譬如北辰，居其所，而众星拱之。”这是很好的一个差序格局的譬喻，自己总是中心，像四季不移的北斗星，所有其他的人，随着他转动。", "y": "", "d": "2025-10-23"}]}, {"id": "CB_1iAByD7d83Al6vA6x37GN5Rd", "title": "自由在高处（增订版）", "author": "熊培云", "cats": [], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "增订版序 我愿此生辽阔高远", "x": "在公域，我们因互相妥协而保全社会；在私域，我们因互不干涉而保全自己。", "y": "", "d": "2025-10-16"}, {"k": "h", "c": "增订版序 我愿此生辽阔高远", "x": "你得对这新来的日子抱着虔敬的心。……对每一天都得抱着虔诚的态度。得爱它，尊敬它，尤其不能侮辱它，妨害它的发荣滋长。便是像今天这样灰暗愁闷的日子，你也得爱。……现在是冬天，一切都睡着了。将来大地会醒过来的。你只要跟大地一样，像它那样有耐性就是了。", "y": "", "d": "2025-10-16"}]}, {"id": "181740", "title": "谁是谁的太阳：尼采随笔", "author": "尼采", "cats": ["哲学宗教-哲学读物", "个人成长-人生哲学"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "译者序", "x": "人们似乎都很渴望成功，但对成功的理解却十分狭隘。", "y": "", "d": "2025-02-05"}, {"k": "h", "c": "译者序", "x": "哲学的目的，就在于发现更光辉、更灿烂的生命，在于更深刻、更完美地表达自我，在于把希望、自由、幸福都带到人生里来，在于给予生命做人的勇气、信念和智慧。", "y": "", "d": "2025-02-05"}]}, {"id": "3300113698", "title": "思辨力35讲：像辩手一样思考", "author": "庞颖", "cats": ["哲学宗教-思维科学", "个人成长-认知思维"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 破：识别谬误", "x": "这些劝导有一个共同的逻辑错误，就是错把相关性当因果性。相关性是指两件事有关系、会同时发生，而因果性代表一件事是另一件事发生的原因。", "y": "", "d": "2024-09-11"}, {"k": "h", "c": "第一章 破：识别谬误", "x": "相关性只代表A和B同时发生，不代表A是B的因。这也就是说，如果A和B只有相关性，我们是不能通过改变A去影响B的。", "y": "", "d": "2024-09-11"}]}, {"id": "25982969", "title": "一切都在孤独里成全：叔本华的人生智慧", "author": "叔本华", "cats": ["哲学宗教-哲学著作"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "Part1 关于幸福的三个真相", "x": "除去这些装束，骨子里大家都是一样的，都只是一些对命运充满了忧虑的可怜演员", "y": "", "d": "2025-01-04"}]}, {"id": "906852", "title": "现代性与大屠杀", "author": "齐格蒙·鲍曼", "cats": ["社会文化-社科"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "献辞页", "x": "沉默是最大的悲哀", "y": "", "d": "2025-01-04"}]}, {"id": "934369", "title": "第二性（合卷本）", "author": "[法]西蒙娜·德·波伏瓦", "cats": ["社会文化-社科"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "导言", "x": "不太为人所知的女性主义者普兰·德·拉巴尔在十七世纪说过：​“但凡男人写女人的东西都是值得怀疑的，因为男人既是法官又是当事人。​”在", "y": "", "d": "2024-09-18"}]}, {"id": "855833", "title": "娱乐至死", "author": "尼尔·波兹曼", "cats": ["社会文化-社科"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 媒介即隐喻", "x": "但是我们这种媒介—隐喻的关系并没有如此明了和生动，而是更为复杂。为了理解这些隐喻的功能，我们应该考虑到信息的象征方式、来源、数量、传播速度以及信息所处的语境。例如，钟表把时间再现为独立而精确的顺序，文字使大脑成为书写经历的石碑，电报把新闻变成商品。要想深刻理解这些隐喻，我们确实要费些周折。但是，如果我们能够意识到，我们创造的每一种工具都蕴含着超越其自身的意义，那么理解这些隐喻就会容易多了。例如，有人指出，12世纪眼镜的发明不仅使矫正视力成为可能，而且还暗示了人类可以不必把天赋或缺陷视为最终的命运。眼镜的出现告诉我们，可以不必迷信天命，身体和大脑都是可以完善的。我觉得，如果说12世纪眼镜的发明和20世", "y": "", "d": "2019-12-18"}]}]}, {"key": "05_心理学与个人成长", "name": "心理学与个人成长", "books": [{"id": "3300033191", "title": "改变你想法的101篇文章", "author": "布里安娜·威斯特", "cats": ["个人成长-励志成长"], "bmCount": 106, "rvCount": 0, "notes": [{"k": "h", "c": "导言", "x": "历史上最悠久的传统智慧：相信就会成为。想法可以掌控。障碍就是出路。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "导言", "x": "我们这个世界所具备的各种要素，曾经只是人类应对恐惧的手段。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "导言", "x": "如果你能够有意识地把生活中的“问题”看作一种机遇，能够因为它们对生活有更深刻的理解，进而营建出一种更好的生活方式，你就会走出痛苦的迷宫，懂得成长的意义。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "任何一种社会主流文化都会向我们灌输，我们需要为什么而活：国家、宗教、自我等等。但当我们试图向前迈进时，那些观念又阻止了我们，让我们搬起石头砸自己的脚。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你认为要创造最好的生活，关键要确定你想要什么，然后努力去实现，但实际上，从心理学角度来说，你根本无法预测什么会让你幸福￼。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你的大脑只能理解它已知的信息，所以当你选择你想要的未来时，你实际上只是基于过去创造了一个理想化的方案。如果事情没有按照你希望的方式发展，你就会认为自己失败了，因为你没有创造出你想要的东西，而实际上，你创造了更好的东西，但它对你的大脑而言是陌生的，所以大脑将其错误地理解为“不好的”。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "活在当下”不只是禅宗和悟道者的崇高理想。这是不让生活被错觉渗透的唯一方式，因为你的大脑真正能理解的就是当下。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你认为成功是你能够“到达”的某个高度，并根据这个标准来评判当下的时刻。你根据自己生活中的一些片段来判断自己是否幸福。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "因为我们天生就相信，当目标完成、事情解决时，成功就会到来。我们会通过“完成度”、事物呈现的面貌和别人的简短评价来衡量这些时刻。我们总是在想：“人生就只能这样了吗？”因为我们忘记了一切都是暂时的，没有任何单一的情况可以概括全部。这个世界上没有我们真正能“到达”的地方。你唯一的终点就是死亡。实现目标不是成功，我们在这个过程中的成长才是。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "在凭你的“直觉”做出判断时，你认为幸福就是“好”，恐惧和痛苦就是“不好”。\n当你考虑要做自己真正喜欢和愿意投入的事情时，你会感到突如其来的恐惧和痛苦，陷入脆弱无助。但这种糟糕的感觉并不一定是阻碍，它恰恰预示着你正在做一些令人畏惧却值得做的事情。如果你不想做什么事，你只会对它感到漠然。\n恐惧=兴趣。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你总是在生活中制造不必要的问题，因为你害怕真正地活着。\n在你的生活中制造不必要的麻烦，这实际上是一种回避技巧，让你分散注意力，不必为你所害怕的事情承担责任。让你烦恼的原因并不是你所以为的原因。你制造问题的真正核心是什么？是害怕做真正的自己，害怕过你想要的生活。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你认为要改变信念，就必须换一种新的思路，而不是去寻求相关体验，来验证这个信念。\n信念是你用自己的体验验证的事实。如果你想改变你的生活，就要先改变你的信念。而如果你要改变信念，就应该去实践，获得一些让你感到真实的体验，而不是采取相反的行为顺序。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你认为“问题”是实现目标的绊脚石，但实际上它们是垫脚石。\n马可·奥勒留￼对这一点总结得很好：“阻碍行动的终会促成行动，阻挡道路的终会成为道路。”简单地说，你遭遇的“问题”会迫使你采取行动去解决它，而这种行为会让你的思维方式发生改变，做出不同的选择。于是“问题”变成了催化剂，让你能够实现你一直想要的生活。你的问题促使你走出舒适区，就是这样。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你认为你的过去定义了你，更糟的是，你认为这是不可改变的现实，而实际上，你的看法会随着你的改变而改变。\n记忆、体验、感受，这些都是多维度的，你可以选择回忆的“重点”，而你所选择的只代表你现在的状态和心境。很多人被过去困住，任由过去定义和困扰自己，这是因为他们还没有进化到能够看清楚过去不会阻止他们获得想要的生活，而是会促进他们采取行动。这并不意味着我们要忽视或掩盖痛苦和创伤。我们只是要接纳过去，这是你走向成长的开始。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第1篇 这些潜意识行为，在阻止你获得你想要的生活", "x": "你总想改变别人，改变环境，改变事物（或者不停地抱怨人和事）。你的每一次愤怒，其实都是自我了解、自我认知的契机。大多数负面的情绪反应是因为你发现了自己隐藏起来的那部分。\n你的“阴影自我”￼是你的一部分，你习惯性地认为这种“阴影自我”是“不好”的，所以你拼命压制它，不去面对它。你不想被人发现自己隐藏起来的这部分特质，所以当你看到别人表现出同样的特质时，你会感到厌恶。“阴影自我”和我们的原始欲望有关，大多数时候它会躲起来，直到遇到那个令我们厌恶的人。你喜欢别人的地方正是你喜欢自己的地方，而你厌恶别人的地方恰恰是你不能接受自己的地方。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第2篇 日常习惯的力量", "x": "历史上最成功的人——比如各个领域的“天才”和大师——除了天赋之外，他们还有一个共同点：坚持刻板（和具体）的日常习惯。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第2篇 日常习惯的力量", "x": "你的情绪由你的习惯而来，而你的情绪就是你看待生活的滤镜。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第2篇 日常习惯的力量", "x": "我们一般认为情绪来自想法和压力，还有让我们陷入混乱的突发事件。但事实并非如此。心理学家罗伯特·塞耶 (Robert Thayer) 认为，情绪是由我们的习惯产生的：我们的睡眠时间、活动频率、思考的内容、思考频率等等。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第2篇 日常习惯的力量", "x": "让理智的决定来主导你的一天，而不是恐惧或冲动。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第2篇 日常习惯的力量", "x": "当你开始规范你的日常行为时，你就不必再受困于“战斗或逃跑”￼的本能，因为你不再面对未知。\n这就是人们很难接受改变的原因，也是那些拥有不变的习惯的人会如此快乐的原因：简单地说，他们在很长一段时间里可以关闭恐惧本能，安心地享受当下。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "但有一些人有能力意识到自己的感受，知道如何表达、处理和调整自己的情绪，摆脱自我中心的局限，能够站在第三方的角度看待问题，有良好的自控力。他们是真正的领导者，拥有最完整、最真实的生命，我们应该从他们身上得到启示。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "他们明白自己的情绪是一种反应，而不是对正在发生的事情的准确衡量。他们承认这些反应可能受到他们自身问题的影响，并不符合客观事实。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "他们产生情绪不是因为“别人做了什么”，因此也不需要别人来解决。他们知道，自己才是一切体验产生的最终原因，这让他们能够避免落入被动愤怒￼的陷阱。被困在这种陷阱中的人总认为错的是外部环境，一切错误都只能由外部环境来纠正。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "无论何时，我们唯一的参照物就是过去发生的事情，我们实际上没有办法确定什么能让我们真正幸福，只是感觉从过去的不愉快经历中“被拯救”出来。因为对这一点的理解，高情商的人可以张开怀抱，接受生活中的所有体验。他们知道任何一件事都是好坏参半。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "冷漠无感才说明你走错了路。恐惧意味着你在试图去做你喜欢的事，只是你原来的信念或未被治愈的创伤阻碍了你（或者更确切地说，这些创伤正在被唤醒，等待着疗愈）。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "幸福是一种选择，但他们认为没有必要时时刻刻追求幸福。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "他们会给自己时间来处理他们所经历的一切，允许自己保持自然的状态。在这种不与自己对抗的状态中，他们找到了满足。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "他们知道真正的信任和亲密感是一点一滴建立起来的，需要清楚地识别出谁能够和自己分享一切。他们不会戒心重重，也不会封闭自己，他们只是会花心思去搞清楚，能够允许谁进入他们的生活和内心。他们对所有人都很和善，但只会对少数几个人真正敞开自己的心扉。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第3篇 高情商的人不会做的10件事", "x": "允许自己有一些“糟糕的”日子，会接纳一个完整的人生。就是这种不与自己对抗的心态让他们找到了平静。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第5篇 社交智商高的人的16种表现", "x": "认可别人的感受就是接纳他们的感受，而不是用讲道理来评判、否认或改变他们的想法。比如对方说：“今天我很伤心。”你说：“嘿，你有什么可伤心的，你已经过得很不错了！”其中可能产生的主要误解是：认可感受并不等于认同观点。有许多观点不需要或不值得被认同，但每个人的感受都值得被看到、被接纳和被尊重。认可一个人的感受就是认可他这个人，即使你们对同样的事情会有不同的反应。换句话说，就是认可他的自我，即使他和你不一样。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第5篇 社交智商高的人的16种表现", "x": "你和其他人的关系只是你和你自己关系的延伸。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第6篇 有这些不适感，证明你走对了路", "x": "我们处在改变的边缘时，就会产生不适感。遗憾的是，我们经常把它误认作一种“不幸”，从而拼命逃避这种感觉。我们都需要经历一些不适，才能突破认知，打破固有思维，激励自己做出真正的改变。不适感是一个信号，一个常常很有用的信号。下面这些感觉（通常是你不太想要的）也许能让你知道，你正走在正确的道路上。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第6篇 有这些不适感，证明你走对了路", "x": "感到迷失实际上表明你活得更现实了——你不再沉浸于对未来的描述和设想中，而是开始更加关注当下。在你习惯这一点之前，你会觉得自己走错了方向（实际上你没有）。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第6篇 有这些不适感，证明你走对了路", "x": "你是唯一对你的生活和幸福负责的人。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第7篇 被你压抑最深的感受，想要告诉你什么", "x": "真正情绪成熟的标志是你能够彻底地让自己去感受所有事情，无论那是怎样的事情。你知道无论多么糟糕的事情最终都有可能发生。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第7篇 被你压抑最深的感受，想要告诉你什么", "x": "就是这样！让自己去感受。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第7篇 被你压抑最深的感受，想要告诉你什么", "x": "所以疗愈实际上就是允许自己去感受。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第7篇 被你压抑最深的感受，想要告诉你什么", "x": "能为我们带来真正平静的东西：允许一切发生，不做任何评判。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第7篇 被你压抑最深的感受，想要告诉你什么", "x": "当你选择更看重别人对你的认可而不是你对自己的认可时，你就是在接受这样一种命运：你必须与自己的本能斗争，为的只是适应别人的需求。与此同时，一个充满倾听、学习、包容、陪伴、理解、感受和体验的世界与人生，正在不断地远离你。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第7篇 被你压抑最深的感受，想要告诉你什么", "x": "悲伤不会杀死你。抑郁也不会。但与它们的战斗会杀死你。对它们的忽视会杀死你。试图逃避它们而不是面对它们会杀死你。否认它们会杀死你。压抑它们会杀死你。将它们埋藏到你的内心深处，让它们牢牢抓住你、控制你，也会杀死你。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第8篇 你的任何一部分都不能代表你", "x": "比起我们是谁，我们更在意别人对我们的看法；我们更看重自己的头衔，而不是日复一日的工作；我们更在意“你能保证永远爱我吗”的承诺，而不是实实在在、细水长流的爱。也就是说，我们更容易被事物的表象打动，而不是事物的本质。我们喜欢把自己看成结构清晰的身体，这样我们就不必去关注精神的匮乏。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第9篇 这20个迹象说明你做的比你以为的要好", "x": "你不再是一年前的那个你了。你在学习，在进步，能够分辨出你的改变是好还是不好。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第9篇 这20个迹象说明你做的比你以为的要好", "x": "你失去了一段关系。恋而失，胜于无。这至少说明你拥有过一段关系，而比这个事实更重要的是，你或你的前任没有选择复合，你因此拥有了其他可能性。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第9篇 这20个迹象说明你做的比你以为的要好", "x": "你可以通过自己的经历安慰自己。生活并没有变得更轻松，但你变得更有智慧了。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第10篇 人们是如何阻碍自己获得幸福的", "x": "没有人愿意相信幸福是一种选择，因为那意味着选择幸福的责任就在他们自己身上。这和人们自怨自艾的原因是一样的：拖延行动，向外界抱怨，仿佛只要越努力哭诉事情有多糟糕，别人就越有可能来改变这些糟糕的事情。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第10篇 人们是如何阻碍自己获得幸福的", "x": "通往更美好的生活的道路不是“为了取得成就而一直承受苦难”，而是由过程中点点滴滴的快乐、感激、意义和目标感持续不断积累起来的。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第11篇 追求卓越的幸福", "x": "埃里克·格里滕斯认为，幸福有三种基本形式：简单享受的幸福、回顾感恩的幸福和追求卓越的幸福。￼他将它们比作三原色，是构成整个色谱的基础。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第11篇 追求卓越的幸福", "x": "简单享受的幸福在很大程度上是感官带来的——你饥肠辘辘时吃下的一顿美味大餐，雨后空气的味道，在温暖舒适的床上醒来。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第11篇 追求卓越的幸福", "x": "懂得感恩的幸福是看着你的一生挚爱睡在你身边，悄悄说一声“谢谢”；是认真看待你拥有的一切；是在你和某个德高望重的人说话时，表现出谦卑和敬畏。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第11篇 追求卓越的幸福", "x": "追求卓越的幸福来自对伟大事物的追求。不是你到达山顶后怀着胜利的喜悦攥起拳头的那一刻，而是爱上徒步旅行的过程；是一项有意义的工作；是心流；是一个目标，它成就了我们的身份，塑造了我们的品质，引导我们投入精力去追求更伟大的事业，而不是每天贪得无厌地追逐我们转瞬即逝的欲望。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第12篇 知行差距：究竟是什么阻止我们行动", "x": "焦虑会在我们无所事事的时候累积。当我们逃避工作时，恐惧和阻力就会滋生。其实大多数事情并不像我们以为的那样困难。你最终甚至会发现它们是有趣的、回报丰厚的，能够让我们实现真正的自我。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第13篇 比那些消耗你的事更值得思考的101件事", "x": "比那些消耗你的事更值得思考的101件事", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第13篇 比那些消耗你的事更值得思考的101件事", "x": "你最欣赏别人身上的什么品质？（这也是你最喜欢自己的地方。）", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第13篇 比那些消耗你的事更值得思考的101件事", "x": "你最不喜欢别人身上的什么品质？（这是你发现自己不具备，或者不喜欢自己的地方。）", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第13篇 比那些消耗你的事更值得思考的101件事", "x": "到目前为止，你人生中学到的最重要的事。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第13篇 比那些消耗你的事更值得思考的101件事", "x": "到目前为止，你是如何学到这些最重要的事的。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第13篇 比那些消耗你的事更值得思考的101件事", "x": "你实现得最充分的自我是什么样的？那个最好的自我是怎样想的？他感激什么？他爱谁？要成为你想成为的人，第一步，也是最重要的一步，就是去设想你最好的自我。一旦你完成了这一步，其他的事情也就顺理成章了。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第16篇 8种认知偏差正在塑造你体验人生的方式", "x": "因为我们对世界的体验只能通过感官，并且会受到心理作用的影响，于是我们不可避免地会将自己的偏好和思想投射到我们所看到的事物上，并对它们做出相应的解读。换句话说，世界不是现在这副样子，我们才是这副样子。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第16篇 8种认知偏差正在塑造你体验人生的方式", "x": "我们根据当前形势做出推断，然后开始相信事情一直都会这样——这就是为什么不幸总是如影随形，而幸福又总是转瞬即逝（因为担心幸福不会永远持续，所以我们放弃了幸福；因为担心悲伤会永远持续，所以我们不断制造悲伤）。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第18篇 我们对情绪的10个误解", "x": "拥有完整的情绪。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第19篇 你没有意识到的那些小事正在影响你的身体感受", "x": "忘记我们的身体本来应该做什么——大笑、玩耍、跳跃、拥抱和爱抚。从进化的角度看，拥有轮廓清晰的髋骨并没有任何优势，也无助于你做那些应该做的事情。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "从你停止的地方继续。把书架上读了一半的书读完。吃掉冰箱里的食物。以你从未尝试过的方式搭配你的服饰。真诚地道歉。给老朋友打电话。重新启动旧项目。试试别的行车路线。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "尝试欣赏别人本来的面貌，而不是执着于你希望他们成为的样子。你要做的不是判断谁值得你付出爱和善意。你的工作不是修正任何人。用适当的方式去爱他们是你唯一要做的。你不是任何人的上帝。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "多花点时间和朋友在一起，而不是去讨好那些不是你朋友的人。\n别再数你生命中有多少人了，就仿佛朋友必须达到一定数量之后你才会感到被爱一样。生命中哪怕只有一个亲密的朋友，也是珍贵和美好的，是特别值得感激的，并非每个人都这样幸运。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "每天写下一件你的身体允许你去做的事情。无论是看你最喜欢的节目，还是在上班的路上听听大街上的声音，或者是看电脑屏幕，拥抱你爱的人……请关注你的身体做了什么，而不是它的外观。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "学着去爱上那些不需要花很多钱的东西。学会喜欢简单的食物，自己下厨，出门闲逛，和朋友聊天，散步，看日出，睡个好觉，好好工作一天。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "开始写日志，用一两句话来总结一年中的每一天。写日记只能持续一周左右的原因是，大家都没有时间（或精力）去思考或详细描述自己的日常生活。但如果我们不写点什么，就错过了一个绝佳的机会——每天都看看我们已经走了多远，我们的生活最终是由什么组成的——所以，不如把日记变成简单的日志，这样会更容易一些。睡觉前写下一两句话，总结一天的生活。一年后，你会感激你做的这件事。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "从你正在做的工作中寻找意义和快乐，而不是从你希望做的工作中寻找。你的目标不是在工作中找到满足感，而是给你所做的事设定目标，以此来找到满足感。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "创造你自己的节日传统。让一年中那些最特别的日子反映出你是谁，你喜欢什么，你想如何庆祝你的生活。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "控制你的支出，在一段时间内，只使用你已经拥有的东西。首先学会一种生活艺术：为了更重要的事情而拒绝即刻满足。告诉自己你已经拥有你需要的一切，或者至少比你认为的要多（即使感觉上不是这样）。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "收纳好你的每一样物品。这是让你在自己的空间中感受到平静的关键。检查你的物品，只保留那些对你来说有意义的美好的东西，然后给每件东西安排一个“家”，或是一个可以让它们每晚返回的空间。这样做可以让你在自己的空间中轻松平静地保持心流状态。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "学着量入为出——不管赚了多少钱，你都应该始终如一地保持储蓄的习惯。如果你习惯于将全部收入都看作“零花钱”（与投资和存款相反），那么无论你挣了多少钱，你都会把它们花光。只有学会在自己的能力范围内舒适地生活，你才能在赚得更多的时候真正实现你的目标。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "成为一个赋予事物意义的人，而不是去寻找事物的意义。与其追求“成功”，不如追求善良。财富并不是美好生活的标志，智慧、善良和心胸开阔才是。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "早上立刻开始做最重要的事情。在你最有精力的时候，把你的精力用在最重要的事情上。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第20篇 设定目标是为了享受你所拥有的，而不是去追逐你没有的", "x": "丢掉不再适合你的东西。通过学习在小事上放手，来教会自己在大事上放手。当你能够抛弃那些会引起消极联想的东西时，就能更容易地摆脱消极的想法和情绪。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "意识到想法只是幻觉，而且是强大的幻觉。列出所有你曾经想过、担心过，结果却并没有发生的事情。想想你浪费了多少时间为那些永远不会出现的结果和那些只存在于你想象中的问题做准备。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "爱上未知。因为它几乎总是会带来比你想象中更好的东西——那些比你想象中更糟糕的东西，其实都是你自己思考和感知的产物，是你赋予了它们对你或你的未来的意义。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "训练的一部分包括，当你突然遇到不合理的事情时，你要知道该怎么应对——客观地评估它，确定它是否对你有用，如果没有用，就一笑置之。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "发现你能把握的和不能把握的事情的细微差别。例如，你可以把握自己在工作中投入多少精力，却不能把握别人对你工作的看法；你可以把握自己每天穿什么，却无法把握别人对你形象的评价。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "努力用有深度的非物质的东西来重新定义自我。不要把自己定义为一个有魅力和成功的人，要学会想象自己拥有另外一些特质，比如有韧性，渴望新的体验，并且能够关爱他人。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "“选择不被伤害，你就不会感觉到伤害。不去感觉伤害，你就不曾受到伤害。”——马可·奥勒留", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "练习全然接纳。选择爱你的家、你的身体和你的工作，即使你不是一直喜欢它们。选择在充满感激和憧憬的地方重建生活，而不是逃避你的恐惧。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "停止评判别人。尊重每个人，他们都有自己的故事，变成今天的样子都是有原因的。你越能接纳别人，就越能接纳自己，反之亦然。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "运用你过度活跃的想象力去做一些有创意的事情。写一部疯狂的小说。写一个恐怖的短篇故事。唱几首自己填词作曲的歌，然后用手机录下来，只给自己听。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第21篇 不让非理性的想法毁掉你的生活的102种方法", "x": "你会意识到你的第四次分手并不像第一次那样让你痛苦。这并不是因为生活变容易了，而是因为你更有智慧了。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第22篇 创造力的内在禅意", "x": "事实证明，最有效的创作过程就是遵循禅宗的艺术——冥想、正念、觉知、不抗拒、不评判。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第25篇 走出舒适区，跨越停滞区：从新手到大师的过程", "x": "认知阶段：对我们要学习的技能做出理性的研究，在这个过程中我们会出错，但最终会找到高效学习的新方法，从而有更好的表现。\n联想阶段：注意力不如第一个阶段集中，但是已经很少出错，逐渐变得更有效率。\n自主阶段：我们进入了“自动驾驶”状态，或者在某些情况下进入“心流”状态。我们对自己要学习的技能已经掌握得比较熟练，可以把自己从有意识的专注中释放出来，接下来的行动就靠“自动驾驶仪”来指挥。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第26篇 如果你厌倦了去争取别人的爱，你要问自己这个问题", "x": "爱不是别人能从你身上拿走的东西（也不是别人能真正给你的）。它不是你“得到”的东西，而是你的体验——这种交流需要双方平等、诚实和自愿地做出奉献。爱不是别人有义务为你做的事，也不是别人欠你的。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第26篇 如果你厌倦了去争取别人的爱，你要问自己这个问题", "x": "如何更好地去爱，如何给予更多，如何做更真实的自己，知道自己喜欢什么、不喜欢什么，还有如何优雅地离开，发自内心地尊重自己，听从自己的直觉。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第28篇 这16个问题会告诉你，“你是谁”以及“你注定要做的事”", "x": "你最讨厌别人哪一点？你最喜欢别人哪一点？你最讨厌自己哪一点？你最喜欢自己哪一点？（继续挖掘，直到你发现其中的关联。）", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第29篇 如何知道你的进步超出了你的想象", "x": "最坏的事情发生了，然后又过去了。你失去了那个你认为离开他就活不下去的人，然后如常生活。你丢了工作，然后又找到另一份工作。你开始意识到“安全感”不在于确定性，而只在于你可以继续好好活下去的信念。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第29篇 如何知道你的进步超出了你的想象", "x": "你已经建立了自己的信仰体系，即使你没有彻底质疑曾经被灌输给你的信仰体系。你不再关注那些不能引起你的共鸣或对你没有意义的东西。", "y": "", "d": "2023-01-01"}, {"k": "h", "c": "第41篇 在追求你想要的生活之前，你需要知道关于自己的一些事", "x": "正如卡尔·荣格曾经说过的：“你的潜意识指引着你的人生，而你称其为命运。当潜意识呈现时，你的命运就被改写了。”", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第42篇 情绪健康的人会如何做", "x": "要客观地观察自己的想法，而不是认同它们。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第42篇 情绪健康的人会如何做", "x": "你不是你的想法，不是你的感受。你是观察、反映、产生和体验这些想法与感受的个体。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第42篇 情绪健康的人会如何做", "x": "你爱别人的方式，就是你爱自己的方式。你讨厌别人的地方，其实你自己身上也有。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第42篇 情绪健康的人会如何做", "x": "当你判定一个结果是正确的时候，你也在判定另一个结果是错误的。有些事情会按照我们的意愿发展，有些则不然。这也是一份礼物。", "y": "", "d": "2023-01-09"}, {"k": "h", "c": "第42篇 情绪健康的人会如何做", "x": "任何事情的意义不在于你做了之后得到了什么，而是经历了这些之后，你会变成什么样的人。", "y": "", "d": "2023-01-05"}, {"k": "h", "c": "第42篇 情绪健康的人会如何做", "x": "坏事会让你成长，好事也会让你成长。（实际上，“坏”往往只是你被教导或以为是“不对的”。）关键在于：你做对了多少事并不重要，重要的是你有了多少进步，每一次经历——好的、坏的、糟糕的、美好的、波折的、顺利的——都是如此。", "y": "", "d": "2023-01-05"}, {"k": "h", "c": "第43篇 何谓美好生活", "x": "动物不会考虑没有捕到猎物意味着什么。它们也不会考虑伴侣离开带来的心理伤害，更不会复盘和反省自己的生活，不会追求“更多”。它们没有渴望超越本能的内在要求。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第43篇 何谓美好生活", "x": "你们喝了多少杯咖啡，聊了多少有趣的、严肃的、悲伤的和美好的话题，你们的默契程度，你一个人散步的次数，你在日记里写下的散乱的想法，你对自己的存在进行的哲学思考有过怎样的演变，你看待他人的方式有何变化。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第43篇 何谓美好生活", "x": "你有勇气结束一段关系吗？最简单的办法就是安于现状，而真正能让人安心的是主动去解决问题，那是对自我的解放，即使你无法想象前面会有什么，你仍然选择去追求探索。那种难以名状的感觉才是美好生活的标志。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第43篇 何谓美好生活", "x": "你发现自己比以前更优秀了。你觉得未来自己变好的地方还会更多。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第44篇 有一种声音是无言的，关键是你如何去倾听", "x": "让你痛苦的事情和让你快乐的事情没有什么区别——它们都是为了教会你一些东西。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第45篇 还没找到合适的词语来描述的体验", "x": "我们无法理解自己不知道的事情——而这个事实，我们总是无法理解。", "y": "", "d": "2023-01-03"}, {"k": "h", "c": "第45篇 还没找到合适的词语来描述的体验", "x": "一件事或许你听人讲了十几遍，但直到它成为你遇到的问题的答案，你才能最终理解它的含义。", "y": "", "d": "2023-01-03"}]}, {"id": "41147996", "title": "福格行为模型：你会越来越有能量", "author": "B.J.福格", "cats": ["心理-心理学研究"], "bmCount": 70, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序1", "x": "你可以尝试做“自己的温柔母亲”，治愈自己，让自己改变。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "推荐序1", "x": "每一颗美丽的珍珠，其实都是蚌包裹好的痛苦与刺激。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "推荐序1", "x": "人生在世，大大小小的烦恼和刺激，没人能躲开，关键就在于你会如何对待它们。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "推荐序1", "x": "对于那些确定会发生的刺激，建立一个习惯来“包裹”它，久而久之，也许你会得到一串生活的珍珠。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "推荐序2", "x": "第一，要自信，不要自责。如果你做出过努力，却没有养成预期的好习惯，那请不必自责。这不是因为你本身有什么缺点，而是因为在行为设计上或者你所使用的方法有问题，只要设计合理和方法得当，养成你所期待的好习惯就有很大的可能性。那具体需要怎么做呢？一是停止自我批评，二是把你的愿望拆解成微行为，三是将每一次错误当成是一种新发现，并利用它们不断改进。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "推荐序2", "x": "第二，从小改变着手，“简单”才能促进改变。微习惯策略对培养新习惯极为有效，你可以选择自己想要做出的行为，把它拆解成微习惯并融入生活，然后把它“养大”。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "推荐序2", "x": "第三，通过行为设计来养成好习惯。人要成为自己的真正主人，就要带着好奇心，保持一定的距离来观察自己的行为，就像科学家观察培养皿内的情况一样，或者把习惯当成食谱一样看待。我们要鼓起勇气将生活当成自己的专属“改变实验室”，我们可以在这里为那个“我们想成为的自己”做出任何尝试，体验到一切皆有可能的神奇。", "y": "", "d": "2022-01-16"}, {"k": "h", "c": "3要素齐备，行为才能发生", "x": "我把这个满载诱惑的篮子放到了电视柜最底层，然后关上了柜门。我知道篮子还在房间里，但这些威胁已经不会再冲我大声喊叫“快吃掉我”了。第二天早上，我就会忘记这些咸味零食。很高兴地告诉大家，我在奥斯汀待了3天，一直没有打开过那个柜子。", "y": "", "d": "2022-01-28"}, {"k": "h", "c": "解决行为问题的3个步骤", "x": "你可以遵循如下步骤，按顺序逐个尝试。如果第一步没效果，那就到下一步，依此类推。1．检查有没有行为提示。2．检查有没有行为能力。3．检查有没有行为动机。", "y": "", "d": "2022-01-28"}, {"k": "h", "c": "明明拥有动机却还是无法改变的5个原因", "x": "大多数人认为动机是行为改变的真正驱动力，但事实并非如此。我们常常会用诸如“回报”和“激励”之类的字眼，因为大多数人都觉得，只要“在马儿眼前挂上胡萝卜”，任何习惯都能培养。这种想法可以理解，但它是错误的。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "明明拥有动机却还是无法改变的5个原因", "x": "拥有梦想和愿望都是好事，宣传健康意识也是好事。但把时间和精力用在激励自己或他人追逐不明确的概念上，则是错误的举动。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "明明拥有动机却还是无法改变的5个原因", "x": "人们普遍认为，能否改变行为从而取得进步，主要取决于个人的能动性和选择。他们还认为，只要找到正确的动机，就能顺利完成自己应该做的事（这通常是一个抽象概念）。这是一种错误的思维模式，它将责任直接归咎于你自身或你的能力，或你无法激励自己这一点。我想改变这一切。我希望人们能够明白，如果只关注动机，就会忽视另外两个行为要素：能力和提示。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "明明拥有动机却还是无法改变的5个原因", "x": "在福格行为模型的3个要素中，动机是最不可预测和最不可靠的。如果你以前只关注动机，那么现在，我希望你能够理解，想获得持久的改变，仅靠动机是不够的，因为你多半无法维持它，也可能无法对它进行可靠的操作或设计。你要明白，这不是一种性格缺陷，而是人的本性。不要掉进动机猴子的陷阱，你必须想方设法绕开它们。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "焦点地图", "x": "行为设计强调了这样一个事实：持久改变的关键，在于为自己匹配真心想做的行为。举例来说，如果你想每天运动，那有很多做法可以选择。比如，在早餐时间边听碧昂斯的歌曲边跳5分钟舞，就是你想做的运动，那你可以养成每天跳舞的习惯。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "焦点地图", "x": "其中的关键是遵循：福格原则1，即帮助人们做他们已经想做的事。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "焦点地图", "x": "通过行为设计匹配的新习惯，是我们在最忙碌、最没动力且状态最不好时，也能做到的行为。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "焦点地图", "x": "如果你觉得自己在最累的时候也能做到这个行为，那它可能和你非常匹配，甚至是一个黄金行为。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "轻松找到你的黄金行为", "x": "首先，明确你的愿望或成果；其次，找到尽可能多的行为选项，并找出与自己相匹配的具体的黄金行为。这就是行为设计的具体过程，也是用微习惯策略找到最适合的习惯的方式。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "03 要素2，能力，让行为简单到随时顺便都能做", "x": "小改变也许没那么吸引人，但它是一种可持续的成功。在人们想做出的大多数人生改变中，有时采取小行为也许会比大胆的行为更有效。对任何事都抱有不做大事就干脆放弃的想法，只会让你苛责自己、充满失望。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "03 要素2，能力，让行为简单到随时顺便都能做", "x": "每一个陷入动机怪圈的人，情绪都复杂多变。萨里卡也不例外，她有时会自我感觉不错，有时又会因为没能养成健康习惯而难受。萨里卡的信心几乎为零，她很担心自己无法做出持久的改变。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "03 要素2，能力，让行为简单到随时顺便都能做", "x": "她开始用微习惯策略，从小事着手，一步一步稳扎稳打。她在客厅中央放置了一个坐垫，只要自己能坐在上面深呼吸3次就好，而不再强求每天冥想20分钟；她认为自己每天早晨到厨房打开燃气灶就好，而不再执着于每天做早餐；她开始尝试在自己最喜欢的蓝色瑜伽垫上做30秒拉伸运动，而不必强迫自己做30分钟的康复运动。萨里卡从这些小事中获得了改变的能力和信心，固定进行小行为，不断由小及大。萨里卡终于过上了梦寐以求的规律生活，健康状况也因此大有改善。现在，她每天自己做饭、打扫厨房、坚持运动、冥想和浇花。萨里卡告诉我，她感受到一种前所未有的活力。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "03 要素2，能力，让行为简单到随时顺便都能做", "x": "现在她知道，只要从小事做起，一切改变皆有可能。萨里卡偶尔会因为身体状态不佳而暂时中断习惯，但她再也不会因此而深深自责。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "03 要素2，能力，让行为简单到随时顺便都能做", "x": "因为他们使用了一种相当可靠的方式：调整能力值，让事情变简单。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "03 要素2，能力，让行为简单到随时顺便都能做", "x": "行为设计的力量，让你拥有了极大的改变潜力。无论你追求的是大改变还是小改变，从小事做起都是一个绝佳选择。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“容易做”分析，在能力范围内找到行为", "x": "设计新习惯，其实是在设计其持续性。其中的关键在于简单，就像我对学生所说的那样：简单改变行为。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“容易做”分析，在能力范围内找到行为", "x": "从福格行为模型的角度来说，能力是维持习惯最可靠的要素，它是让我们处于有利位置的绝佳选择。如果一个行为困难，就要让它变得更容易做到。你会发现，无论动机如何改变，能力都会变得更强。这会让你养成非常牢固的习惯。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“容易做”分析，在能力范围内找到行为", "x": "通过一个又一个微小的行为，这个习惯已经牢牢扎根于我的日常生活中。这就好像是一颗有着许多细小根部的参天大树。当狂风来袭时，如果根部抓得不劳，就很有可能会被吹倒。培养习惯的原理也是如此。从一个很难培养的大习惯开始，是不稳定的，就像一颗根浅枝大的植物，在生活风暴来袭时，很容易就会中断。然而，一个容易养成的小习惯却像韧性十足的幼苗一样，能够经受住狂风暴雨，因为它的根会扎得更深更牢。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "只要足够简单，就能实现改变", "x": "培养习惯的关键就是简单，这个道理不仅仅适用于个人生活。我在数百万人日常使用的电子产品中发现了一个清晰的模式：大物始于小。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "只要足够简单，就能实现改变", "x": "没有提示，行为就不会发生。提示是行动的信号，是点燃火焰的火花。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "04 要素3，提示，善用锚点时刻让行为立刻发生", "x": "行为设计的步骤[插图]　❶　明确愿望[插图]　❷　探索行为选项[插图]　❸　为自己匹配具体行为", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "04 要素3，提示，善用锚点时刻让行为立刻发生", "x": "行为设计的步骤[插图]　❶　明确愿望[插图]　❷　探索行为选项[插图]　❸　为自己匹配具体行为[插图]　❹　从微习惯开始[插图]　❺　找到“对”的提示", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "生活中常见的3类提示", "x": "行动提示就是将你已经在做的行为当作提示，以此来提醒你为培养新习惯采取必要的行动。这是一种很特别的提示。行动提示是一种将微习惯和行为结合起来的方式。例如，你已经拥有的刷牙习惯，就可以作为用牙线洁牙这个新习惯的提示；打开咖啡机就可以作为做伸展运动这个新习惯的提示", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "生活中常见的3类提示", "x": "相比于人物提示和情境提示，行动提示的效果是最好的，我还给它取了另一个名字：锚点。谈到微习惯时，我会用“锚点”这个词来描述生活中那些已经稳固的事情。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "设计“对”的提示的3个步骤", "x": "在我（锚点）之后，我会（新习惯）：·　在我冲完厕所之后，我会做2个俯卧撑。·　在我停好车之后，我会写下当天最重要的任务。·　在我刷完牙之后，我会用牙线清洁一颗牙齿。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "设计“对”的提示的3个步骤", "x": "早晨是培养新习惯的最佳时间。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“珍珠习惯”，管理压力与焦虑", "x": "我将这些习惯称为“珍珠习惯”（Pearl Habit），因为它们的本质是将原本惹人厌烦的事情，转化成美好的提示。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“珍珠习惯”，管理压力与焦虑", "x": "“在我感觉受到冒犯时，我会考虑去做一些能取悦自己的事情”，这就是埃米的成功习惯配方。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“珍珠习惯”，管理压力与焦虑", "x": "幸运的话，埃米不会遇到能让她有如此感受的人。但现实是，我们无法将生命中那些糟糕的人或事一一剔除，因此有时不得不忍受待事不公的、烦人的或举止恶劣的人。不过，我们可以掌控自己这一边", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“珍珠习惯”，管理压力与焦虑", "x": "用他人的行为来提示自己做出正向而非自我挫败的行为，在感到无助时不失为一个好主意。而且，埃米从中得到的积极影响远超她的初衷。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "“珍珠习惯”，管理压力与焦虑", "x": "创建“珍珠习惯”，将不利变有利这个练习是为了在困局中将不利变有利。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "05 创造积极情绪，将行为固化为习惯", "x": "我在研究中发现，成年人有很多种跟自己说“我做得不好”的方式，却很少掌握对自己说“我做得不错”的方式。我们极少认可自己的成功，也很少对自己取得的成就感觉良好。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "05 创造积极情绪，将行为固化为习惯", "x": "感觉良好是微习惯策略的重要组成部分。你可以通过我称之为“庆祝”的技巧来创造这种良好感受。采取微习惯策略来进行庆祝，你就可以根据需要创造出一种内在的积极感受。这种积极感受能够帮助你将新习惯固化到脑海当中。你会发现“庆祝”有奇效，而且它又快又容易做到，还很有趣。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "05 创造积极情绪，将行为固化为习惯", "x": "当我们有效地进行庆祝时，大脑里的奖励通路会被激活。通过在恰当的时刻为自己创造良好的感觉，你能促使大脑识别并铭记刚才所执行的一系列行为。换句话说，你可以依靠庆祝和自我强化来“搞定”大脑，从而养成习惯。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "行为设计，本质就是情绪设计", "x": "积极的体验能够强化人的习惯，不是因为魔法，而是神经化学在发挥作用。良好感受刺激大脑产生名为多巴胺的神经递质，即“大脑中的化学信使”，它控制着大脑的“奖励系统”，帮助我们记住那些可以产生良好感受的行为，这样我们就会继续去执行那些行为。在多巴胺的帮助下，大脑会对因果关系编码，进而产生对未来的期望。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "习惯来自让你感觉美好的情绪", "x": "我研究发现，只要人们能对一种行为产生强烈的积极情绪，通常用不了几天就能形成习惯。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "习惯来自让你感觉美好的情绪", "x": "为了直指核心，我将之简化为一句话：情绪创造习惯。无须一味重复，无须讲究频次，无须盼望奇迹，只需积极的情绪。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "用庆祝滋养你的“习惯花园”", "x": "庆祝是创造积极感受并将其融入新习惯的最佳技巧，不用花钱，效果却立竿见影，并且适用于所有人。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "用庆祝滋养你的“习惯花园”", "x": "庆祝还让我们学会善待自己", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "庆祝的原则，“及时又简单”", "x": "庆祝不一定要用大声喊叫或动作夸张的方式来表达。它唯一的规则就是你必须说出点什么（在心里或真的说出来都行）或做点什么，任何能让你感受良好并产生成功的感觉的语言或动作都可以。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "庆祝的原则，“及时又简单”", "x": "接下来，我想劝告你：降低对成功的期望。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "打一场“庆祝闪电战”", "x": "喜欢上投入时间照顾自己的感觉", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "打一场“庆祝闪电战”", "x": "在生活中的任何时刻都可以庆祝。不需要计划，也不需要写下微习惯配方。留意你做出的良好行为，然后为它庆祝就行了。如果你能够感觉到发光，那你就可以让这种好的行为变成自主自发的习惯。更重要的是，想方设法地去感受积极的情绪，让积极的情绪成为你改善生活的动力。记住，改变的最好方法是感受积极的情绪，而不是感受消极的情绪。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "打一场“庆祝闪电战”", "x": "如果你只能从这本书里学到一样东西的话，我希望是：为你的微小成功而庆祝。即使你觉得自己一时之间还无法摆脱困境，生活中的小小改变也能够产生巨大的影响力。庆祝可以成为你的救生绳。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "一些行为加工的指导方针：", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "·　新习惯能够助力你成为你想成为的人。如果你想成为一个充满爱心和懂得欣赏他人的人，那么，在丈夫做完饭之后说句“谢谢”的习惯就是有意义的，这也极有可能会促使你蜕变。·　新习惯可以帮助你实现某个重要的愿望。如果从养成新习惯到实现愿望的路线很清晰，那么养成这个习惯就是有意义的。每天穿上跑步鞋的习惯看似微不足道，但如果你的愿望是每天跑步5千米，那么这个微习惯意义非凡。·　新习惯虽然微小却能产生极大影响。萨里卡每天打开燃气灶的习惯很小，但却触发了一系列变化。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "如何调整习惯难度的操作指南", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "我想要跟你们分享我过去10年来的最佳减肥方法。我称之为“超级冰箱”计划。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "重新设计饮食环境，尤其是整理你家里的冰箱，是可以改变饮食方式的一种有效方式。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "在打开冰箱后，我们能看到一堆玻璃容器，装着已经做好的开盖即食的食物。西兰花装在容器里，已经洗干净、切好。菜花、芹菜、辣椒和洋葱也已经处理好了。还有一个容器里装着已经煮熟的藜麦。此外，冰箱里也有一些现成的可以当零食吃的新鲜水果和熟鸡蛋，还有原味全脂酸奶、多种泡菜，以及芥末等调味品。相信你脑海里已经有画面了。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "只要人一打开门就能看到一系列健康的饮食选择。冰箱里的食物，我们想什么时候吃就什么时候吃、想吃什么就吃什么、想吃多少就吃多少。我们不会把那些跟饮食计划相悖的食物放入冰箱。每星期我们都会花时间去购物，并且整理好超级冰箱，做好准备工作。每个星期天在完成超级冰箱补给工作之后，我都会花上一分钟时间去欣赏它，因为它看起来就像是Real Simple杂志上的页面。实在太漂亮了！", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "一些有价值的心态调整技巧：·　以开放、灵活和好奇的态度来应对变化。·　能够降低期望。·　通过为成功（不管是多小的成功）庆祝获得良好的感觉。·　对改变过程保持耐心和信心。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "拥抱新身份", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "掌握技巧，变身“习惯忍者”", "x": "用你想要拥抱的一种身份或多种身份，补全“我现在认为自己是那种……的人”这句话。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "07 行为改变系统方案，一次只解一个结", "x": "考虑习惯问题的一个好方法是将它们分为3类：上山型习惯、下山型习惯和自由落体型习惯。我所指的是所有习惯，包括好习惯和坏习惯。·　上山型习惯是需要努力维持但很容易中断的那种习惯，如闹铃一响立刻起床、去健身房健身或每天进行冥想。·　下山型习惯是容易维持但难以停止的那种习惯，如睡懒觉、说脏话、刷YouTube。·　自由落体型习惯是像药物滥用之类的习惯，除非求助专家，否则很难停止。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "07 行为改变系统方案，一次只解一个结", "x": "无法改掉坏习惯会引起人们深深的羞愧感和内疚感，为什么呢？因为许多文化都很重视个人责任感，认为如果你无法做到“对”的事情，那必然是性格方面存在缺陷。在行为改变领域，这是一种过于片面且毫无益处的观念，但它已然在人们心中根深蒂固。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "07 行为改变系统方案，一次只解一个结", "x": "不过，请你首先要记得：如果你曾听从误导性建议来打破习惯，结果却没有成功，那么这不是你的错。你只是被灌输了有缺陷的思维和做法，因而陷入挫败和举足不前的循环。其次要记得：你可以用一种更聪明、更有效的方式来设计出你想要的改变。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "行为改变系统方案的3个阶段", "x": "移除提示。移除提示是其中最简单的，它的最佳方式就是重新设计周围环境。比如，你想终止在工作时刷社交媒体App的习惯，你可以关机、设置飞行模式，或关闭社交媒体App的通知功能，无论哪种方式，都可以移除情境提示。这样做或许可以帮助你解决这个习惯问题。如果为这件事写一个微习惯配方，那大概会是：在我坐下来开始工作之后，我会关闭社交媒体App的通知功能。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "行为改变系统方案的3个阶段", "x": "在能力链的5大因素中，靠体力来终止坏习惯是我最喜欢用的方法。你可以重新设计习惯，增加行动的阻力，让自己在动机很强时也能不动心。这样一来，当你的心境发生变化，比如想吃冰激凌或看电视、喝红酒时，就会意识到这些事情很困难，而且或许根本就不值得费力去做。", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "一次只解一个结，关键是不断继续", "x": "让不想要的习惯变得更加消耗体力", "y": "", "d": "2022-01-29"}, {"k": "h", "c": "结语 改变一切的小改变", "x": "在这个世界上，我们的生活质量取决于我们每天所做的选择——如何度过时间、如何生活，以及更重要的是，如何对待自己和他人。", "y": "", "d": "2022-01-29"}]}, {"id": "921826", "title": "心流：最优体验心理学", "author": "米哈里·契克森米哈赖", "cats": ["心理-心理学应用"], "bmCount": 67, "rvCount": 0, "notes": [{"k": "h", "c": "序一 自造内心秩序之途", "x": "幸福是你全身心地投入一桩事物，达到忘我的程度，并由此获得内心秩序和安宁时的状态。", "y": "", "d": "2022-01-05"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "我们对自己的观感、从生活中得到的快乐，归根结底直接取决于心灵如何过滤与阐释日常体验。我们快乐与否，端视内心是否和谐，而与我们控制宇宙的能力毫无关系。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "只有在不计较好坏、全身心投入生活的每一个细节时，才会觉得幸福", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "首先得学会做自己的主人，必须能不受外界影响，自己找到快乐和目标。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "“我们对生活有种种期许，却从未真正生活过。”", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "当一个男人在生理上受一个女人吸引时，他会想象（假设他会思考这种事）自己的欲念是发乎个人意愿的。但实际上，他的性趣只不过是肉眼看不见的基因的一招布局，完全在操纵之中。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "在复杂的社会中，有很多强势团体执行着社会化的工作，有时它们的目标乍看似乎相互矛盾。一方面，学校、教堂、银行等官方机构致力于把我们塑造成拼命工作与储蓄的负责任公民；另一方面，商人、厂商、广告商却不断哄骗我们将辛苦赚来的钱悉数购买令他们获利的产品。此外，还有赌徒、皮条客、毒贩组成的地下组织，提供禁忌的快乐，它们完全与官方那一套相呼应：只要付钱，就提供放荡的快乐。尽管透露出的信息截然不同，但结果基本上是一样的：剥削我们的精力以逞其私欲，使我们沦为社会制度的附庸。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "最好的方法是不以社会的奖赏为念，试着以自己所能控制的奖赏取而代之。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "我们要在别人用以利诱我们的目标之外，另行建立一套自己的目标。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "从社会制约下解放自我，最重要的步骤就是时时刻刻发掘每一事件中的回馈。如果我们学会在不断向前推进的体验中找到快乐与意义，社会制约的重担就会从肩上自动滑落。当奖赏不再受外在力量管制时，权力就回到了个人手中。再也不必为追赶不到的目标而孜孜以求，或是在每个无聊的一天告终时，盼望明天会更好；再也不必为遥不可及的奖励受尽折磨，而可以真正开始充实人生。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "“人害怕的其实是自己对事物的看法，而非事物本身。”", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "“外界事物令你痛苦并不是因为它们打扰你，而是肇因于你对它们的判断，而你有能力立刻消弭那种判断。”", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "生活的品质取决于控制意识的能力，", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第一章 心流，快乐的源泉", "x": "弗洛伊德曾指出，“本我”与“超我”是争夺心灵控制权的两大暴君，前者是基因的奴隶，后者则与社会沆瀣一气，两者都算是“外界”。与它们相对的是“自我”，代表一个人在现实环境中真正的需要。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "意识的功能是搜集组织内外的一切资讯，加以评估后，由身体做出适当的反应。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "控制意识最明显的指标就是能随心所欲地集中注意力，不因任何事情而分心。若能做到这一点，就能在日常生活中找到乐趣。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "E女士能充分控制注意力，可以随时把意识关闭，打个盹儿，然后恢复精神。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "不把精力浪费在不具建设性的思想或活动上", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "把有限的注意力像探照灯一般集中成一道光束，", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "注意力塑造自我，也被自我塑造。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "内在秩序", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "每当资讯对意识的目标构成威胁，就会发生内在失序的现象，也可称之为“精神熵”（psychic entropy），它会导致自我解体，使效率大打折扣。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "精神熵的反面就是最优体验。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "最优体验出现时，一个人可以投入全部的注意力，以求实现目标；没有失序现象需要整顿，自我也没有受到任何威胁，因此不需要分心防卫。我们把它称为“心流体验”", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "拥有它的人就能培养一个更坚强、更自信的自我，能够用更多的精神能量，专注于自己选择的目标。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "一个人若能充分掌控意识，尽可能创造心流体验，生活品质势必会提高；", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "在心流中，我们是精神能量的主宰，无论做什么事都能使意识更有秩序。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第二章 控制意识，改善体验的品质", "x": "选定一个目标，投入全部的注意力，不论做什么事都会觉得乐趣无穷。一旦尝到这种快乐，我们就会加倍努力，重温它的滋味——自我就这样开始成长了。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第三章 心流的构成要素", "x": "改善生活品质的主要策略有两种：一是使外在条件符合我们的目标；二是改变我们体验外在条件的方式，使它与我们的目标相契合。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第三章 心流的构成要素", "x": "其实别人对我们的看法或我们所拥有的一切，跟生活品质并没有直接关系——真正重要的是我们对自我和所遭遇的事情做何种阐释。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第三章 心流的构成要素", "x": "睡眠、休息、食物与性，都属于恢复“均衡”的体验，在肉体需求引起精神熵以后，重整意识的秩序。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第三章 心流的构成要素", "x": "首先，这种体验出现在我们面临一份可完成的工作时。其次，我们必须能够全神贯注于这件事情。第三和第四，这项任务有明确的目标和即时的反馈。第五，我们能深入而毫不牵强地投入到行动之中，日常生活的忧虑和沮丧都因此一扫而空。第六，充满乐趣的体验使人觉得能自由控制自己的行动。第七，进入“忘我”状态，但心流体验告一段落后，自我感觉又会变得强烈。第八，时间感会改变——几小时犹如几分钟，几分钟也可能变得像几小时那么漫长。", "y": "", "d": "2022-01-06"}, {"k": "h", "c": "第三章 心流的构成要素", "x": "自成目标的体验也就是心流，它能把生命历程提升到不同的层次。疏离变成了介入；乐趣取代了无聊；无力感也变成了控制感；精神能量会投注于加强自我，不再浪费于外在目标上。体验若能自动自发地产生报酬，现在的生命当然有意义，不需要再受制于将来可能出现的报偿。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第四章 如何在日常生活中寻找心流？", "x": "前面我们讨论了一般人描述最优体验时提到的共同要素：觉得自己的技能足够应付当前的挑战，在一个目标明确、规则分明的行动体系中，对于自己表现的好坏，随时可得到清楚的回馈；注意力非常集中，完全没有空闲去思索任何不相干的事，或烦恼其他问题；自我意识消失，时间感扭曲。能产生这些效果的活动都会带来强烈的满足感，使人愿意纯粹为了活动本身而去行事，不但不计较回报，甚至为之冒险犯难也在所不惜。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第五章 感官之乐", "x": "改善生活品质最简单的方法就是学着去控制身体和感觉。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第五章 感官之乐", "x": "但你也不妨在各方面都做个“半吊子”，培养足够的技巧，从身体的各种能力中求得乐趣。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "但在独处、无须集中注意力时，心灵没有秩序的原貌就会显现。它无所事事，如脱缰野马，往往停留在令人痛苦或困扰的思绪上。除非一个人知道如何整顿自己的思想，否则注意力一定会被当时最棘手的事件所吸引：它会集中于某种真实或想象的痛苦，最近的不快或长期的挫折中。精神熵是意识的常态——一种既没有任何作用，也不能带来乐趣的状态。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "为了避免沦入这种状态，一般人当然急于用任何能到手的资讯填满心灵，只要能转移注意力，不要沉溺在消极的情绪之中就好。这也说明了为何人们花大量时间看电视，尽管这么做毫无乐趣可言。比起其他的刺激——阅读、与别人交谈、发展嗜好等，电视最能提供持续且易得的资讯，帮助观众整理注意力，而所需要的精神能量又非常少。一般人看电视时，不用担心游移不定的心灵强迫他们面对私人的问题。不难想象，一个人一旦确定了克服精神熵的策略，再要求他改弦易辙就很困难了。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "避免意识混乱的最好办法，当然是培养能控制心灵运作过程的习惯，而不是依赖电视这样的外来刺激。养成好习惯需要多练习，还需要心流活动不可或缺的目标与规则。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "心灵若能自成一套规则，对正常生活也大有好处。缺少内化的象征体系的人，很容易被媒体宰割。他们容易被宣传家操纵，被演艺人员安抚，被推销员蒙骗。我们会依赖电视、药物或政治、宗教的救赎，主要是因为我们自身没什么可以仗恃的东西，内心无力抗拒那些自称握有解答者的谎言。不能为自己提供资讯的心灵，只能在混乱中随波逐流。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "从纷乱的事务中厘清秩序", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "每个人都是他个人生命的历史学家", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "拥有过去的记录，对提升生活品质极有帮助。它把我们从“现在”这个暴君的魔掌下解救出来，使意识能再度造访过去。它让我们挑选、保存特别愉快而有意义的回忆，从而创造一个能帮助我们面对未来的过去。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第六章 思维之乐", "x": "在理想状况下，强迫教育的结束应该就是自动自发追求更高教育的开始。这时，学习的目标不再是分数、文凭或找份好工作，而是了解周遭的事物，从个人经验中发掘意义，建构价值观，思考者会从这里面找到深邃的乐趣。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "通过工作提升生活品质，需要两项辅助策略。一方面要重新设计工作，使它尽可能接近心流活动——诸如打猎、家庭式纺织、外科手术等。另一方面，还得培养像莎拉菲娜、柯拉玛、庖丁那样自得其乐的性格，加强技巧，选择可行的目标。这两项策略若单独使用，都不可能使工作乐趣增加太多，但两者双管齐下，却能产生意想不到的最优体验。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "经常感受心流的人较易感觉坚强、活跃、有创造力、专注、进取。但出乎意料的是，心流大多出现在工作的时候，绝少在休闲时发生。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "就出现了一个矛盾：工作时，人们面对挑战、发挥技巧，就觉得快乐、强壮、有创意、满足；闲暇时，他们因无事可干，技巧也无用武之地，以至于觉得悲伤、软弱、迟钝、不满足。但大家仍然宁可少工作，而拥有更多闲暇。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "不断兴起的休闲事业，以用富于乐趣的体验填满空间、时间为宗旨。然而大多数人不但没有善用生理与心理资源体会心流，反而花许多时间，坐在电视机前观赏知名运动好手在大体育场的表演。我们并不创作音乐，而只听身价数百万美元的歌手的白金唱片；我们不从事艺术创作，只会对拍卖会场上喊得最高价的名画赞叹不已；我们也不肯冒险贯彻自己的信念，只会每天花几个小时，看演员在虚拟的情境中，假扮出生入死。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "这种替代的参与方式，至少暂时粉饰了浪费时间的空洞感。但是跟投注在真实挑战上的专注相比，它实在太薄弱了。从技巧的运用中产生的心流体验，会带来成长；纯属被动的娱乐背后，什么也没有。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "它们吸收精神能量，却没能提供实质的力量作为报酬，只是徒然使我们变得比原来更疲倦、更沮丧而已。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第七章 工作之乐", "x": "大多数的工作与休闲活动——尤其是消极接受大众传媒的方式，都不是为使人变得更快乐、更强有力而设计的，它们只是某些人赚钱的工具。一方面，如果我们听任它们得逞，它们就会吸干我们的生命精髓，只剩下一副空壳。另一方面，工作与闲暇正如同人生，可以应我们的需求发挥作用。学会从工作中发掘乐趣，不浪费闲暇的人，会觉得人生越发有价值。布莱特比尔写道：“未来不仅属于受过教育的人，更属于那些懂得善用闲暇的人。”", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "心流研究一再证实，生活的品质主要由两大因素决定：我们如何体验工作以及我们与他人的互动关系。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "最大的快乐和最大的痛苦都是旁人所引起的，如此两极化的事实该如何调和呢？", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "人际关系就跟其他事情一样，一切顺利时，我们就觉得非常愉快；挫折丛生时，我们就感到沮丧。其实人是环境中最有弹性，也最善变的因素。同样一个人，早晨可能使我们快乐无比，晚上则可能变成磨人的恶魔。我们太依赖别人的情爱与认可，以至于完全受制于他们对待我们的方式。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "因此，懂得如何与他人相处，就能大幅改善生活品质。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "只有在我们因一个人本身的优点而重视他时，他才能成为最丰富的幸福泉源。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "独处的体验为何如此受到否定？最根本的答案是：内在维持心灵的秩序十分困难。我们往往需要外在的目标、外来的刺激、外来的回馈，帮助我们控制注意力的方向。如果缺乏外来的力量，注意力就开始游荡，思路也变得混乱——也就是第二章谈到的“精神熵”的状态。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第八章 人际之乐", "x": "无所事事的时候，心灵就无法遏制消极念头的来袭。除非学会控制意识，否则成年人也会被类似的情况困扰。有关感情、健康、投资、家人及工作的烦恼，总在注意力周遭徘徊，一有机会就乘虚而入。心灵一准备要放松，虎视眈眈的难题就“咻”的一声扑上前来。", "y": "", "d": "2022-01-08"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "人生的悲剧在所难免，但遭受打击未必与幸福绝缘。人在压力下的反应，决定他们能否转祸为福，或只是徒然受苦受难。", "y": "", "d": "2022-01-12"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "主观体验不只是人生的一个面，它就是人生。", "y": "", "d": "2022-01-12"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "把不幸的灾祸变成幸运的契机，是一种难得的天赋才能。", "y": "", "d": "2022-01-14"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "自我的完整取决于把中立或破坏性事件，转变为对自己有利状态的能力。如果被开除是找一份更符合个人志趣的工作机会，就不是什么坏事。", "y": "", "d": "2022-01-14"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "这种能力部分归功于时间的历练：曾经失望、熬过失望。长大了的青少年知道，其实事态并没有乍看之下那么糟。部分则由于知道别人也会遇到相同的问题，而且终能解决。得知自己的问题也会发生在别人身上，使年轻人的自我产生新的觉悟。", "y": "", "d": "2022-01-14"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "他们共有的心态就是，深信命运掌握在自己手中，我们不妨说他们是自信，但同时他们的自我又似乎并不存在：他们一点儿也不以自我为中心，他们的能量不用于控制环境，而是致力于寻求一种与环境和谐共存的途径。", "y": "", "d": "2022-01-14"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "这些转变都要求当事人随时做好迎接意外的准备。", "y": "", "d": "2022-01-14"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "只要怀着不以自我为出发点的信心，对环境保持开放的态度，充分投入，出路自然就会铺展在你眼前。", "y": "", "d": "2022-01-14"}, {"k": "h", "c": "第九章 挫折中如何自得其乐？", "x": "“自得其乐的自我”倾向于把潜在的威胁解释成充满乐趣的挑战，因此得以维持内在的和谐。一个永不觉得厌倦、很少感到焦虑、投入周遭事物，并经常处于心流状态的人，可以说是具备了“自得其乐的自我”。这一词的意义也就是“拥有自足目标的自我”，大多数人的目标都受生理需要或社会传统的制约，亦即来自外界。自得其乐的人，主要目标都从意识评估过的体验中涌现，并以自我为依据。", "y": "", "d": "2022-01-14"}]}, {"id": "35172615", "title": "不被父母控制的人生：如何建立边界感，重获情感独立", "author": "琳赛·吉布森", "cats": ["心理-心理学应用"], "bmCount": 61, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "只要他们能客观地看待父母的局限性，他们就不会再被不成熟的父母左右。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "前言", "x": "不成熟的父母的过激反应，会让孩子学会抑制自己，养成被动而顺从的性格，而不是培养孩子的个性以及对他人的信任。为了与这样的父母相处，你更容易选择短期内见效的办法——忽略真实的自我与自己真正的需求。但从长远来看，你最终会被责任、内疚和羞耻压得喘不过气，感到自己被困在家庭角色之中。好消息是，一旦你理解了这样的父母和他们对你产生的影响，你将再次成为生活的主人。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "前言", "x": "学习有关情感不成熟的知识，有助于你理解和面对所有不成熟的行为，不论这种行为来自何人。在你的生活中，不成熟的人可能是父母、孩子、兄弟姐妹、雇主、客户或其他任何人。不论是在家庭内部还是外部，人际关系的动力都是一样的。对于不成熟的父母行之有效的方法，对其他不成熟的人也是有效的。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "前言", "x": "父母给了你生命和爱，只不过，他们只知道以那种方式来爱你。你可以因此而尊重他们，但不要让他们再控制你的情绪。你现在的任务是自我成长：成为一个真诚地面对自己与他人的人。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "当你尝试与他们分享一些对你重要的事时，就像在对牛弹琴，他们会改变话题，转而讨论自己，或者忽略你所说的话", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "尽管不成熟的父母在不高兴时需要你的注意，但他们很少在你难过时倾听你的声音或理解你的感受。他们不会坐在你身边，听你诉说自己的烦心事，相反，他们通常会提供肤浅的解决方案，告诉你不要担心，他们甚至可能会因为你不高兴而生你的气。你感到他们心门紧锁，好像你在他们心中没有一席之地，无法获得他们的同情和安慰。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "你可能会因为他们肤浅的交往方式而陷入困境。因为不成熟的父母会用肤浅的、自我中心的方式与人交往，所以与他们的交谈通常很无聊。他们会坚持谈论自己觉得安全的话题，翻来覆去、停滞不前。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "因此，安慰他们是非常困难的。他们想要你知道他们有多难过，但他们不愿接受真正的安慰所带来的亲密感。如果你试图让他们感觉好起来，他们可能会把你推开。这种糟糕的接受能力（McCullough，1997）让他们无法从你这里获得任何安慰和联结。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "不成熟的父母不会与人谈论自己的感受，他们通过非言语的情绪感染（emotional contagion）来表达自己的感受（Hatfield，Rapson，& Le，2009）、践踏你的边界，让你变得和他们一样难受。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "这种缺乏健康边界的现象被称为情绪混淆", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "通过这个过程，不成熟的家庭成员会被卷入彼此的情绪和心理问题之中。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "对不成熟的人来说，家庭角色是既定的，家长权威是不容置疑的，他们不明白你为什么想要个人空间或者独立的身份认同。他们不明白为什么你不能像他们一样思考，和他们持有相同的信念和价值观。你是他们的孩子，因此你必须从属于他们。即使你已经长大成人，他们也希望你能继续对他们百依百顺，即使你坚持要过自己的生活，至少也要听从他们的建议。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "情绪性工作（emotional work）（Fraad，2008）是你为了在情感上适应别人的需求而做出的努力。情绪性工作可能很轻松，比如彬彬有礼、令人愉快；也可能非常复杂，比如对情绪失控的青少年说出正确的话。情绪性工作包括同理心、常识、对动机的觉察以及对他人反应的预期。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "你失去了情绪自主与精神自由", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "不论是对自己的孩子，还是对其他人来说，不成熟的父母可能都是非常扫兴的。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "虐待则不仅仅是扫兴这么简单，而是以对他人施加痛苦、羞辱或强制的约束为乐。虐待行为也是在宣称自己是关系中最有权力、最重要的人。有虐待倾向的不成熟的父母喜欢让孩子受苦，不论是对孩子施加身体的痛苦还是心理的痛苦，他们都能从中获得快乐。身体虐待显而易见，隐性的虐待则往往伪装成“取笑”和“开玩笑”。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "为了让他们心境平和，你过度关注他们与他们的反应，而这种关注并不健康，以至于你无法摆脱他们情绪状态的控制。一旦发生了这种情况，你就受到了他们的情感控制。当他们的情绪状态成为你关注的中心时，情感控制就产生了。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "保护你的边界、情绪自主以及自我价值感", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "你可以把不成熟的关系系统想象成他们施加在你身上的咒语，这道咒语让你相信他们的快乐是你的责任。你同样要为他们的愤怒和坏情绪负责，好像你从一开始就应该消除他们的不适。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "当不成熟的人感到沮丧时，他们的痛苦会渗透进你的心灵，占据你内心的中心地位。你过度担心如何与他们相处，以至于满脑子都是他们说的话和做的事。甚至当你在做别的事或晚上睡觉时，他们的坏情绪也会在你心里挥之不去，让你不断地想：我做错了什么？我该怎么做才好？我给他们的帮助够多吗？", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "当他们的不快乐渗透进你的心里时，你会觉得自己有责任让一切恢复正常。不成熟的关系系统已经将你拖入了他们的感受里，以至于他们的痛苦变成了你的痛苦。这时，你会忘记自己的感受与需求。一旦不成熟的关系系统控制了你的情绪，即便你知道事实并非如此，你也会觉得他们的问题就像是你的问题。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "当然，健康成熟的人有时也会需要帮助，但他们求助的方式与此不同。他们在求助的时候，会考虑对方的情况。他们允许对方说不。他们不会要求你放下一切去照顾他们，而且当你伸出援手时，他们会表达感激。相反，不成熟的父母会对你施加情感压力，如果你拒绝，他们就会表示你不是真心在乎他们。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "陷入不成熟的关系系统是一件非常令人疲惫的事情，因为你要为对方做太多情绪性工作。与不成熟的人交往时，你在他们身上消耗的心理能量远远超过了在其他人身上消耗的", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "成熟的人知道你不可能随时都有空。他们能理解你的情况，尊重你的界限。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "虽然不成熟的父母会向你抱怨，但他们往往并不打算接纳任何解决问题的建议。对他们来说，这不是一种双向互动。如果你提出建议，他们甚至可能会表现出受到侮辱或冒犯的样子。他们没有耐心听你提出的解决方案，并且经常会说“是的，但是……”这样的话，因为很明显，你没有意识到他们的处境有多艰难。事实上，他们会有些气愤，因为你居然认为这个问题可以这么轻易地得到解决。难道你没看到他们的问题有多棘手、多复杂、多特别吗？为什么你就不能站在他们那边呢？", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "不成熟的父母很少礼貌地寻求帮助，例如“你能帮我解决这个问题吗”或“我应该怎样才能解决这个问题呢”。相反，他们会用令人焦虑的紧迫感来影响你，好像替他们解决问题是你的责任。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "当你陷入某个人的不成熟的关系系统里时，最好问问自己：这是谁的感受？如果你的情绪反应过于强烈，既奇怪又陌生，不像是你自己的，那么很有可能不成熟的人已经在你心里激起了某种情绪，让你去替他们处理。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第1章 与不成熟的父母相处有什么感受", "x": "培养自我感知也是自我觉察和自我反省的必要条件，它们让我们能够观察自己，观察我们的行为是如何影响他人的。如果人们在童年时没能发展出自我感知，他们就无法反省自己，也就无法在心理上成长和改变。相反，他们只会责备别人，期望别人先做出改变。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第2章 不成熟的父母是如何控制你的", "x": "情感不成熟是一个比临床诊断更宽泛的概念，其病理色彩较少、适用范围更广。情感不成熟可能是许多精神问题的表现，特别是自恋型、表演型、边缘型、反社会型或偏执型人格障碍，等等。不成熟的人有一些共同点，那就是以自我为中心、低同理心、需要成为最重要的人、不尊重个体差异、难以应对情感上的亲密。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第2章 不成熟的父母是如何控制你的", "x": "不成熟的父母的四种基本类型", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "你现在可以提醒自己，我能够应对他们的所作所为，而不是屈服于他们。拥有这样的主动心态，能使你不被他们的目的裹挟。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "但是现在，你已经长大成人，你懂的更多了。你有权利考虑自己的需求。你生活的目的与不成熟的人的期待完全相反，你活在世上不是为了给予某人虚假的权力感。一个人不能仅仅因为自以为是，就声称自己比别人更重要。你和不成熟的人是平等的，没有谁比谁更重要。你既不是他们的财产，也不是他们的仆人。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "如果你在成长的过程中，身边总是有一个不成熟的人，那么你可能一直生活在压力重重的忧虑里，随时准备应对他此刻的危机。你需要避开他们吗？你要问他们为何闷闷不乐吗？要确保没人招惹他们吗？要听他们抱怨吗？要安抚他们吗？要让他们感受到被重视吗？无论他们需要什么，你都要去做，因为你很害怕他们情绪不稳定所带来的后果。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "看法无法再迷惑你，你就会发现，从客观的角度来看，他们没有权利控制你，他们也不比你更重要。你们需要考虑的人有两个，而不是只有一个。他们的需求不会让他们比别人更重要，也不会让他们比别人更有权利得到关注。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "第一步是要审视不成熟的人的请求，抵制与之相伴的绝望与紧迫感。你不必与他们一同夸大和歪曲事实，也不必接受他们对事实的歪曲。你完全可以后退一步，客观地看待他们的情况，或者询问一下他人的意见。一定要询问不成熟的人，弄清他们具体的困难：可能事情并不像看上去那么紧急。鉴于他们的情绪可能歪曲了事实，你是否应该相信他们的一面之词，相信他们的问题真的很严重？", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "只有你才能判断做出什么反应是合理的，不要让不成熟的人的压力和不受控的情绪影响你。如果他们真的需要你，那么他们实际上需要多少帮助？你必须核对这些问题，因为他们做不到。不论他们有任何紧急情况，正确的反应都不是立即介入，而是先退后一步，评估现实。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "在面对情感控制时，应该询问自己的问题事实到底是什么（除了他们告诉你的）？在这件事情里，有哪些能被证实的事实？这场危机有多严重？是紧急情况吗？是谁的紧急情况？他们的要求是解决问题的最佳方案吗？当他们平静下来时，能自己解决问题吗？这是你的责任吗？通过问自己这些问题，你可以评估这究竟是一场真正的危机，还是一种伪装成危机的情感控制。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "如果正常地为自己说话都会让你觉得自己很自私，那么你的自尊很可能已经被不成熟的人“绑架”了。和不成熟的人在一起，你无法在拒绝他们的同时，还让他们觉得你很关心他们。只有在不成熟的人歪曲的世界里才会这样——如果人们想要仔细考虑或者设置边界，他们就会被视作吝啬或冷漠的人。他们受伤的反应可能对你非常有效，因为没有人想做坏人，也没有一个正派的人喜欢被人视作冷漠无情的。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "但是，你可以说一些不具有威胁的话，来纠正他们对你的曲解：“我没想要刻薄地对你，但是，你是不是觉得，如果别人和你的看法不一样，他们就不够爱你？”或者，你也可以说：“我们对此的看法不一样，这是因为我们每个人都对自己的生活负有责任。”", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "批判有一个好处，那就是你必须认同它，你才会感觉糟糕。他们可以批判你，但只有你自己才能决定是否感到内疚。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第4章 如何主动抵制父母的情感控制", "x": "你可以拒绝接受他们的批评，在他们对你的评价和你对自己的准确认识之间做出区分。记住，仅仅是不成熟的人觉得某件事是怎样的，并不一定意味着事实的确如此。应该由你来定义自己，而不是他们。如果你觉得不公允，就拒绝他们的批判吧。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "不要太在意那些不成熟的行为：坚持自己的想法不成熟的人喜欢告诉你应该做什么，哪怕应该由你来做这个决定，他们也毫不在意。为了避免这种不必要的压力，你可以这样做：如果你愿意，你可以认可他们的反对意见（“啊哈”“我明白”“嗯”），但不要太在意。先听上一分钟，不要做明确的表态，保持轻松的语气和亲切的微笑，然后重申自己想要的结果或自己打算做的事情（Smith，1975）。如果遭到了抗拒，不要大惊小怪，一直重申自己说过的话就好。这不是一种神奇的技术，但就像河水能磨平岩石的棱角一样，这种方法是有效的。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "。争论意味着这是不同意志之间的合理较量，而我希望这不是你的目标。通过简单地重申自己的决定，你提醒了不成熟的人，现在同时存在两种不同的观点，因为（以免他们忘记了）你们是两个不同的人。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "为了有效地应对不成熟的父母，你可以做五件事来让你免受他们的情感控制与歪曲信念的影响。（1）放弃“拯救者”的角色。（2）圆滑一些，避其锋芒。（3）引导互动的走向。（4）为自己创造空间。（5）制止他们。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "许多不成熟的父母的成年子女都觉得自己必须做父母的“拯救者”或“守护者”。这是我在上一本书《不成熟的父母》（Gibson，2015）中描述过的内化类型（internalizing types）。内化者往往很敏感，洞察力强，经常把同理心看得比自己的喜好更重要。他们把所有事都放在心上，可能会在自己不该承担责任的时候包揽责任上身。内化者甚至会在不成熟的人还没有提出要求的时候就匆忙介入，替他们解决问题。这种过度的责任感是一种依赖共生（codependency）（Beattie，1987），也就是说，你通常会在别人没有要求的情况下，就把别人的问题当作自己的问题，试图以这种方式来感到自己是可爱的、有价值的。最终，你对他们生活的关注，会比对自己生活的关注更多。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "当不成熟的人试图控制你时，他们会给你施加压力、唠叨、与你争论，他们这样做是为了试探你的反应，这样他们就能与你对抗了。他们的潜台词是：乖乖听话，认可我的观点，扮演好你的角色，让我赢。但是，你可以不陷入这种挣扎，你可以停下来，给自己一个自我觉察的时刻，为自己赋能，然后简单地说一句“我不确定”或“我现在真的不能回答这个问题”。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "你必须从情绪上与他们分离开来，接纳他们有权利拥有自己的感受，就像你也拥有同样的权利。你不必评判他们的感受，你也不必做他们想要你做的事。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "在与不成熟的人相处的过程中，如果你开始感到仿佛被他们困住了，或者被他们弄得筋疲力尽，就应该立即中断互动，并且说一些这样的话：“哦，不好意思，我得去趟洗手间”“哎呀，我觉得我该去睡个午觉了”“嘿，抱歉，我有点儿困了，我得出去呼吸一下新鲜空气，一会儿就回来”。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "每当不成熟的人向你大倒苦水，倾诉自己的不快和抱怨时，你可以说：“哦，你很难过。听着，等你好些了我再打给你吧。”记住，你的做法不一定要很合情理，只要能让你摆脱控制就好。如果不成熟的人指责你或者与你争辩，你可以不置可否地说“哦，我不确定”，或者说“我理解你，但我们不一样，不过这没关系。我现在要走了”。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "你可以拒绝谈论某些话题", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "莱克茜不喜欢听母亲乔安妮谈论亲戚。有一天，莱克茜告诉乔安妮，她再也不想听母亲说别人的闲话了。乔安妮觉得受了冒犯，于是为自己辩护，她告诉莱克茜：“好吧，如果我不能跟你说，那我还能跟谁说呢？”莱克茜意识到，这不是她需要解决的问题，她告诉乔安妮，她很乐意谈谈别的话题。从那以后，每当乔安妮开始抱怨亲戚的时候，莱克茜就会打断她：“妈妈，我得挂了。”然后就挂掉电话，不多做解释。有时莱克茜会直接挂断电话，或者假装电话信号不好。一段时间以后，在母亲刚开始抱怨的时候，她就会说“哦，对了，你不想聊这个……”，然后开始聊别的话题。这也说明坚持对于不成熟的人是有效的。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "莱克茜允许自己突然终止谈话，挂掉电话。没有漫长的道别，没有温和的铺垫，她就直接挂掉了电话。与莱克茜不同，奥黛丽是一个对人更友善的人。比如，当奥黛丽觉得母亲让她筋疲力尽时，她就会打断母亲，和蔼地说道：
