，只要我们还在追求自己不可能得到的东西，我们就还是一贫如洗。”这是卢梭的话。", "y": "", "d": "2024-04-11"}, {"k": "h", "c": "16 6", "x": "任何为生活带来积极意义的产品，都不用花费过多的宣传营销费用，意义越大，传播费用越低，媒体甚至会免费为你宣传。", "y": "", "d": "2024-04-11"}, {"k": "h", "c": "1 小长假", "x": "小长假的幸福是无可比拟的，因为一切从眼底滑过的景象，存在着根本的神圣和永恒的意义：这位和那位恰巧经过的男男女女，还有一百年后走过这里的男男女女；这些和那些在空中飘荡的风筝，断了线的和不会断线的风筝；哇哇哭闹的婴儿，坐在红色的、黄色的、三轮的、四轮滚动的婴儿车中；单脚走路的斑鸠，迂缓飞翔的斑鸠，还有刚落在微微颤动的树梢上的那只斑鸠……你们的呼吸，你们的影子，都和我在一起。你们的经历，我也曾经历；当你们经过，我也正好路过。", "y": "", "d": "2024-04-11"}, {"k": "h", "c": "5 三个出口", "x": "我发现能量有三个出口。每天早上我从A出口去工作，傍晚从A出口归来。\n在A出口，我将能量放在一些令自己感到充盈的事情上：阅读、记笔记、写公益公众号文章及处理工作文件，从事一切与文字相关的活动和学习新知识。这些事情耗费大量精力，可是在精疲力竭之后，付出的能量焕新了我固有的看法，使我收获良多。从A出口，我获得了更多能量，精神焕发，丰沛充盈。\n第二个是B出口。这个出口不需要投入多少能量，也不会回报更多能量。例如，舒舒服服躺在沙发上刷小视频，看朋友圈、小红书。我很少在B出口往返，这是基于我深深明白人生苦短，时间有限，不能浪费光阴。\n能量的C出口是从事自己没有兴趣的工作。一天过去，能量消耗殆尽，却没有收获正面的能量。不只工作，哪怕是一段作茧自缚的感情，也只是消磨自己的元气与自尊，自寻烦恼。C出口只会消耗，没有能量回报。\n我对能量锱铢必较，绝不会浪费自己的精力在B出口；也逐渐明白，将能量用在C出口，是枉费人生。\n来自人生的束缚严峻而残忍，没有丝毫怜悯之情，我们只能通过自己对能量的约束，方能以能量获取更多能量。\n我喜欢走A出口。", "y": "", "d": "2024-04-11"}]}, {"id": "3300143875", "title": "九诗心：暗夜里的文学启明", "author": "黄晓丹", "cats": ["文学-文学鉴赏"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "屈原：时间的焦虑", "x": "在博尔赫斯最著名的小说《小径分岔的花园》中，他提出了“时间永远分岔，通向无数的将来”￼的观念。", "y": "", "d": "2025-06-20"}, {"k": "h", "c": "环形时间失落，线性时间诞生", "x": "拥有时间这种抽象的概念是不快乐的。它将死亡的阴影投向距离死亡尚远的时候。人类怎样来缓解这种时间的焦虑？靠另一项发现，即自然的时间节律。", "y": "", "d": "2025-06-20"}, {"k": "h", "c": "屈原站在时代的门槛上", "x": "《山鬼》中，在云雾舒卷的山巅，山鬼等待着她的情人，怨恨他不肯回来，疑心他已经变心。在近乎永恒的等待中，雷填填，雨冥冥，山中的时间也变得晦暗不明。", "y": "", "d": "2025-07-06"}, {"k": "h", "c": "屈原站在时代的门槛上", "x": "遗憾和哀伤", "y": "", "d": "2025-07-06"}, {"k": "h", "c": "极端的美，极端的焦虑", "x": "在环形的时间观中，田鼠会变成鹌鹑，腐草会变成萤火虫，柳叶会变成鱼。日升日沉，春去秋来，生命周而复始，十分从容。", "y": "", "d": "2025-07-06"}, {"k": "h", "c": "一个春日和一个夏夜", "x": "如果把生命看作两段长久黑暗之间的短暂光亮，一次社戏、一个春日，就都是奇迹。", "y": "", "d": "2025-07-08"}]}, {"id": "38818247", "title": "加缪笔记：1935—1959（精选集）", "author": "[法]阿尔贝·加缪", "cats": ["文学-散文杂著"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "笔记本Ⅰ 1935年5月—1937年9月", "x": "每个冬天都以春天作结。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "笔记本Ⅰ 1935年5月—1937年9月", "x": "我试图建立起来的虚弱的智慧", "y": "", "d": "2025-02-26"}, {"k": "h", "c": "笔记本Ⅰ 1935年5月—1937年9月", "x": "我的快乐没有尽头。", "y": "", "d": "2025-02-26"}, {"k": "h", "c": "笔记本Ⅰ 1935年5月—1937年9月", "x": "写作，就是对自己漠不关心。", "y": "", "d": "2025-03-10"}, {"k": "h", "c": "笔记本Ⅰ 1935年5月—1937年9月", "x": "除了爱，我没什么能骄傲。", "y": "", "d": "2025-03-10"}, {"k": "h", "c": "笔记本Ⅰ 1935年5月—1937年9月", "x": "充盈着我心的东西。", "y": "", "d": "2025-03-10"}]}, {"id": "3300101193", "title": "一间属于自己的房间", "author": "[英]弗吉尼亚·伍尔夫", "cats": ["文学-散文杂著"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "女性与小说", "x": "女性在一天中的生活，往往留不下任何实质性的成果。她们烹饪的食物已经被吃掉了，她们养大的孩子出门在外了。那么重点在哪里？那些可以让小说家大书特书的焦点又是什么呢？很难回答。", "y": "", "d": "2024-08-21"}, {"k": "h", "c": "女性与小说", "x": "这种诗意的态度，当然在很大程度上建立在物质基础之上。它依赖于闲暇的时间和一定数量的金钱，以及金钱和闲暇给我们带来的以非个人的视角冷静观察世界的机会。", "y": "", "d": "2024-08-21"}, {"k": "h", "c": "女性与小说", "x": "要达到这个目标，我们只能期盼那个也许仅存于传说中的黄金时代，到那个时代，女性将获得她们长久以来被剥夺的东西——闲暇、金钱和一间属于自己的房间。", "y": "", "d": "2024-08-21"}, {"k": "h", "c": "读书不必听人指导", "x": "作为读者，独立性是最重要的品质", "y": "", "d": "2024-08-21"}, {"k": "h", "c": "一", "x": "首先，她们就不可能赚到钱；其次，就算她们能赚到钱，法律也剥夺了她们持有财产的权利。", "y": "", "d": "2024-08-22"}, {"k": "h", "c": "二", "x": "真的，我一面把找零的银币放进钱包，一面回想着那些苦日子。有了稳定的收入，人的性情是真的会产生巨大的变化啊。世界上没有任何力量能夺走我的五百英镑。我将永远有食物、住所和衣物。因此，我将不必再工作和劳苦，也将不必再仇恨和痛苦。我不需要怨恨男性，他们伤害不到我；我不需要取悦男性，他们给不了我什么。于是在不知不觉中，我发现自己对人类的另一半采取了一种新的态度。", "y": "", "d": "2024-08-22"}]}, {"id": "26868652", "title": "人间处方：夏目漱石写给青年的信", "author": "中川越", "cats": ["文学-散文杂著"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "我们生于此世，应勇往直前：", "x": "我们生于此世，应勇往直前：", "y": "", "d": "2020-09-04"}, {"k": "h", "c": "我们生于此世，应勇往直前：", "x": "我们生于此世，则肮脏的事物、不愉快的事物、讨厌的事物，都不可逃避。若不勇往直前冲进那些事物，到头来将一事无成。", "y": "", "d": "2020-09-04"}, {"k": "h", "c": "将眼光向外看，我们并不是孤身一人：", "x": "人在不幸时，容易躲进自己的壳，认为自己的不幸与他人是不同的，刻意将自己孤立于与世隔绝之处。", "y": "", "d": "2020-09-04"}, {"k": "h", "c": "看着白云过日子，闲适的夏日幸福：", "x": "你现在正看着白云过日子吧。看着白云过日子，从之而生的一股闲适。白云，是一种稳定心灵的良药。", "y": "", "d": "2020-09-04"}, {"k": "h", "c": "就算发牢骚，我也不拘泥于牢骚：", "x": "拯救自己脱离不愉快的泥沼。", "y": "", "d": "2020-09-04"}, {"k": "h", "c": "后记", "x": "人生在世，难在如何和解", "y": "", "d": "2020-09-04"}]}, {"id": "614320", "title": "我承认我不曾历经沧桑", "author": "蒋方舟", "cats": ["文学-散文杂著"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "第2章 我承认我不曾历经沧桑", "x": "他本来想把这一代称为“冷漠的一代”，后来觉得过分了一点，就把它改成“调侃的一代”——“最大的特征，就是自以为把什么都看透了，不相信世上还有真诚的东西，所以对什么都调侃，已经没有敬畏之心了。”", "y": "", "d": "2018-04-08"}, {"k": "h", "c": "第2章 我承认我不曾历经沧桑", "x": "比追随logo更崇高的理想是自己成为logo。大多数人满足于模仿偶像，有些人决定成为偶像。", "y": "", "d": "2018-04-08"}, {"k": "h", "c": "第3章 我为什么不敢“留点余地”", "x": "不想再跑了，虽然路不长，不过是从摇篮到坟墓这段短短的路程。除开道路本身，我们没有其他的目的地，我们除了老在途中，也没有什么其他选择。所以，是走还是停，是快还是慢，是我们仅剩的能够决定的事情。", "y": "", "d": "2018-04-08"}, {"k": "h", "c": "第6章 中产阶级的孩子", "x": "低层的年轻人，对造反表现出了很大程度的冷漠，因为他们对体制信任、感激。“知识改变命运”给了他们希望和许诺，还有各种助学金和奖学金的帮助与扶持，因此没有理由不信赖和服从。", "y": "", "d": "2018-04-09"}, {"k": "h", "c": "第7章 天才的出走", "x": "世界并非是不完美的，或是正处在一条缓慢通向完美的路上；不，它在每一个瞬间都是完美的，一切罪孽本身就已经蕴含着宽恕，所有小孩本身已经蕴含着老人，所有婴儿都蕴含着死亡，所有濒死者都蕴含着永恒的生命……学会爱这个世界，不再拿它与某个我所希望的、臆想的世界相比，与一种我凭空臆造的完美相比，而是听其自然，爱它，乐意从属于它。”", "y": "", "d": "2018-04-09"}, {"k": "h", "c": "第22章 家里的鬼影幢幢", "x": "我不想做一个歌颂遥远的月亮有多皎洁的人，而想看到它黯淡坑洼的一面，那是真实。我们抱怨孩子总是吵闹和哭泣，而当我们蹲下，和孩子同一个视线，看到的都是大人密密麻麻的腿，看不到路也看不到人的表情，这时候，我们才知道孩子们的恐惧从何而来。我想回到那个低的视线。", "y": "", "d": "2018-04-10"}]}, {"id": "841398", "title": "一间自己的房间", "author": "[英]弗吉尼亚·伍尔夫", "cats": ["文学-散文杂著"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "总序", "x": "她在本书中阐述了女性在社会中长期处于劣势地位，遭受着种种的不公与偏见，提出了女性要有自己独立的生活与思想空间，要强调女性与男性之间的差异，要发挥出女性的最大优势，来完成属于自己的宏伟事业。", "y": "", "d": "2023-01-18"}, {"k": "h", "c": "选篇三", "x": "不管怎么说，一个备受争议的话题——但凡一个问题牵扯到性别便会如此——很难指望有谁能道出些真理来。", "y": "", "d": "2021-02-06"}, {"k": "h", "c": "选篇三", "x": "像鱼线投入到这涓涓的溪流之中，一分钟又一分钟，在倒影和水草间晃动，随波逐流，随之沉浮", "y": "", "d": "2021-02-06"}, {"k": "h", "c": "选篇三", "x": "身体内仿佛藏着一个神奇的玻璃橱窗，没有声音能传进来，而心灵，也摆脱了事实的纠葛（除非你又闯入了那片草地），可以沉静下来，陷入到与此时此刻正相宜的任何一种沉思里去。", "y": "", "d": "2021-02-06"}, {"k": "h", "c": "选篇三", "x": "而相反，某先生连一个子儿也没给。《星期六评论》口下可不留情。我们去哪里筹笔钱来租下办公室？我们要不要搞个义卖？就不能找个漂亮姑娘来撑撑门面吗？去看看约翰·斯图尔特·穆勒[18]对这事儿是怎么说的吧？有没有人能说服某报的编辑把这一封信刊登出来？我们能不能找来某夫人为这封信落款签名？某夫人出城去了。六十年前，事情就是这样办成的，付出的汗水非比寻常，耗费的时间也如此之长。", "y": "", "d": "2021-02-18"}]}, {"id": "651126", "title": "有味", "author": "汪涵", "cats": ["文学-散文杂著"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "靖港香干", "x": "我现在喜欢散步，我是一个喜欢散步的成年人了", "y": "", "d": "2018-03-07"}, {"k": "h", "c": "糍粑", "x": "小镇的新年比不得城市里的烟花耀眼，但总有不一样的玩乐。", "y": "", "d": "2018-03-07"}, {"k": "h", "c": "扇骨", "x": "小翠曾对他说，没有什么是不会老去的，说到这里，老艾就有点伤感了，比如他的师傅也老去了。", "y": "", "d": "2018-03-16"}, {"k": "h", "c": "烟火神仙归隐记", "x": "这是最好的状态，抱元守一，既不让别人依赖，也不依赖别人，赤条条，来去无牵挂。", "y": "", "d": "2018-03-16"}, {"k": "h", "c": "烟火神仙归隐记", "x": "病得最严重的时候，就想今天怎么过得快乐才好，因为你不知道明天会是怎样，所以我十几岁的时候就早早知道人应该活在当下，不管是即将繁华还是逐渐枯萎，此时此刻才是你结结实实的人生。", "y": "", "d": "2018-03-16"}]}, {"id": "3300159166", "title": "一个阿富汗女人的来信（轻纪实）", "author": "正面连接 Khadija Haidary", "cats": ["文学-纪实文学"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "文前", "x": "通信中，我们曾有一个问题是：你觉得中国读者能为你们做些什么？Khadija回答：​“其实也不知道能做什么，我只希望有人能知道我们的情况。​”这种“知道”意味着，尽管她们仍在受苦，但不再是彻底封闭孤立，无人关心，连痕迹都没有的。", "y": "", "d": "2026-01-30"}, {"k": "h", "c": "3 携带课本也会让一个女孩进监狱", "x": "一些女教师偷偷办起地下学校。我通过熟人访谈了一位。这位F老师在家中授课，第一批学生是所在社区的15个女孩，都上过小学，她们跟着她读中学。", "y": "", "d": "2026-01-30"}, {"k": "h", "c": "3 携带课本也会让一个女孩进监狱", "x": "这天，他让我们造句来表达愿望。所有女孩的句子都是关于离开的：她们希望自己能拿到护照；她们希望自己在美国包机离开时身在机场；她们希望自己能在大学对女性关闭前毕业；她们希望获得欧美国家的奖学金；她们希望不必蒙着脸或在地下室上课。", "y": "", "d": "2026-01-30"}, {"k": "h", "c": "7 直到男性也失去自由", "x": "我们除了忍受别无选择，希望这一切尽快结束，但国际组织和大国正以一种让我们害怕的方式谈判。如果他们承认了塔利班，我们将迎来更多压迫和更严厉的法律。", "y": "", "d": "2026-01-30"}]}, {"id": "3300023882", "title": "开始写吧！——非虚构文学创作（创意写作书系）", "author": "雪莉·艾利斯", "cats": ["文学-文学鉴赏"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "垂死的山羊", "x": "优秀的非虚构作品是对一种印象的确认。靠你的诚实呈现世界。", "y": "", "d": "2024-06-11"}, {"k": "h", "c": "垂死的山羊", "x": "观察时要留意细节，尤其是那些稀奇古怪的细节。", "y": "", "d": "2024-06-11"}, {"k": "h", "c": "垂死的山羊", "x": "你要给你的人物、处境、判断，以及你异想天开的想法创造一个富有深度的、个性化的主观印象。", "y": "", "d": "2024-06-11"}, {"k": "h", "c": "你的第一个厨房", "x": "通过他们非常主观的头脑过滤他们对世界的记忆。", "y": "", "d": "2024-06-11"}]}, {"id": "3300091188", "title": "岁月静好是片刻 一地鸡毛是日常", "author": "史铁生 季羡林 汪曾祺 等", "cats": ["文学-散文杂著"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "一 岁月静好是片刻，一地鸡毛是日常", "x": "这是一句非常明白易懂的话，却道出了几乎人人都有的感觉。所谓“当时”者，指人生过去的某一个阶段。处在这个阶段中时，觉得过日子也不过如此，是很寻常的。过了十几二十年或者更长的时间，回头一看，当时实在有不寻常者在", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "一 岁月静好是片刻，一地鸡毛是日常", "x": "“当时”是很不相同的。国王有国王的“当时”，有钱人有有钱人的“当时”，平头老百姓有平头老百姓的“当时”。在李煜眼中，“当时”是车如流水马如龙，花月正春风游上林苑的“当时”。对此，他没有别的办法，只有哀叹“天上人间”了。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "无事此静坐", "x": "南墙挂着一条横幅，写着五个正楷大字：无事此静坐。我很欣赏这五个字的意思。稍大后，知道这是苏东坡的诗，下面的一句是：一日当两日。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "无事此静坐", "x": "倒是我常常拿了一本闲书，悄悄走进去，坐下来一看半天，看起来，我小小年纪，就已经有一点儿隐逸之气了。", "y": "", "d": "2024-03-29"}]}, {"id": "37544499", "title": "简单的艺术", "author": "多米尼克·洛罗", "cats": ["文学-散文杂著"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "第一部分 物质主义和极简主义", "x": "我把简单奉为我生活的统一原则。我决心只保留最基本的必需品。在这种斯巴达式的苦行生活中，暗藏着某种祝福。我将沉思，直到这样的祝福降临在我身上。", "y": "", "d": "2021-10-07"}, {"k": "h", "c": "第一部分 物质主义和极简主义", "x": "不是我们在占有物品，而是物品在占有我们。", "y": "", "d": "2021-10-07"}, {"k": "h", "c": "第一部分 物质主义和极简主义", "x": "喜空不喜繁，喜静不喜闹，喜古典隽永而不喜滚滚潮流。", "y": "", "d": "2021-10-07"}, {"k": "h", "c": "第一部分 物质主义和极简主义", "x": "扔掉稀奇古怪的小玩意儿，嘱咐身边的人，您唯一想要的，就是什么也不要。", "y": "", "d": "2021-10-07"}]}, {"id": "25870939", "title": "好好说话，好好生活", "author": "梁实秋", "cats": ["文学-散文杂著"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "梁实秋的话", "x": "无论如何，老于世故的人总是劝人多听少说，以耳代口，凡是不大开口的人总是令人莫测高深；口边若无遮拦，则容易令人一眼望到底。", "y": "", "d": "2020-11-30"}, {"k": "h", "c": "梁实秋的话", "x": "人不能不说话，不过废话可以少说一点。", "y": "", "d": "2020-11-30"}, {"k": "h", "c": "梁实秋的话", "x": "是故人生之目标，不在幸福之追求，而在痛苦之避免。人生即是由一串痛苦所构成。能避免一分的苦痛，即是一分的幸福。", "y": "", "d": "2020-11-30"}, {"k": "h", "c": "梁实秋的话", "x": "人类最高理想应该是人人能有闲暇，于必须的工作之余还能有闲暇去做人，有闲暇去做人的工作，去享受人的生活。", "y": "", "d": "2020-11-30"}]}, {"id": "833650", "title": "送你一颗子弹", "author": "刘瑜", "cats": ["文学-散文杂著"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "有关的无关的人", "x": "认识更多的人，忘记更多的人。被更多的人记住，被更多的人遗忘，吹出更多的肥皂泡，然后看到更多肥皂泡的破裂。", "y": "", "d": "2018-05-08"}, {"k": "h", "c": "有关的无关的人", "x": "自己川流不息的生活，不过是别人手机里的两个音节而已。而过几个月，就连音节都不是了，仅仅是被消耗掉的无法追回的那段时间，躺在烟灰缸里的几截烟灰而已。", "y": "", "d": "2018-05-08"}, {"k": "h", "c": "有关的无关的人", "x": "那些与你毫无关系的人，就是毫无关系的，永远是毫无关系的。从认识的第一天开始，其实你就知道。就算是笑得甜甜蜜蜜，就算是有过无关痒痛的来往，就算你努力经营这段关系。", "y": "", "d": "2018-05-08"}, {"k": "h", "c": "有关的无关的人", "x": "而那些与你有关的，就是与你有关的，是逃也逃不掉的，就算你们只见过三次，就算你们三年彼此才搭理一次，就算是你简直想不起他或者她的样子，就算是你们隔着十万八千里。", "y": "", "d": "2018-05-08"}]}, {"id": "3300171413", "title": "赞美闲散（果麦经典）", "author": "[英]伯特兰·罗素", "cats": ["文学-散文杂著"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "封面", "x": "工作即美德的信念正在现代世界中制造大量危害，而通往幸福与繁荣之路在于有组织地减少工作。工作的道德是奴隶的道德，现代世界不需要奴隶。", "y": "", "d": "2026-10-30"}, {"k": "h", "c": "封面", "x": "从工作的重压下解放出来，将努力的方向从“谋生”转向“生活本身”，去追求那些真正定义文明和幸福的事——艺术、爱、知识、休闲和对世界的探索。", "y": "", "d": "2026-10-30"}, {"k": "h", "c": "赞美闲散", "x": "工作是什么？工作有两种：第一种，改变地球表面或地面附近的事物相对于其他事物的位置；第二种，告诉别人去这样做。", "y": "", "d": "2026-10-30"}]}, {"id": "3300077318", "title": "闭经记", "author": "伊藤比吕美", "cats": ["文学-散文杂著"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "经血啊 淅淅沥沥无精打采透着寂寞", "x": "观察一番后，得出结论，我还是我。进入更年期后，我蜕掉了一两层旧我，变得更棒了。", "y": "", "d": "2024-12-14"}, {"k": "h", "c": "深渗入骨啊 女之念迁流于生生世世", "x": "我这辈子一直坚信，不用在穿上花很多钱，无论穿什么我都能活得自在又快乐。", "y": "", "d": "2024-12-14"}, {"k": "h", "c": "天寒地冻 母亲的咒女儿的老去", "x": "直到我过了四十岁，彻底远离了母亲，才明白她不是不愿意理解我，而是没有理解的能力。", "y": "", "d": "2024-12-15"}]}, {"id": "25184495", "title": "当我谈跑步时，我谈些什么", "author": "[日]村上春树", "cats": ["文学-散文杂著"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "作为选择对象的磨难", "x": "无论何等微不足道的举动，只要日日坚持，从中总会产生出某些类似客观认知的东西来。", "y": "", "d": "2021-06-29"}, {"k": "h", "c": "作为选择对象的磨难", "x": "即使不足以称为“哲学”，然而我想，这里面含有一些类似经验法则的东西。一些无甚大不了的玩意儿，却是我通过实实在在地运动自己的躯体，通过作为选择的磨难，极其私人地感悟到的东西。也许并不值得推而广之，但无论如何，这，就是我这个人。", "y": "", "d": "2021-06-29"}, {"k": "h", "c": "第八章 2006年8月26日 神奈川县海岸的某座城市 至死都是十八岁", "x": "“疼痛无法避免，磨难却可以选择”", "y": "", "d": "2021-06-29"}]}, {"id": "827628", "title": "鲁迅全集（全20卷）", "author": "鲁迅", "cats": ["文学-散文杂著", "文学-经典作品"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "鲁迅先生全集序", "x": "他的感想之丰富，观察之深刻，意境之隽永，字句之正确，他人所苦思力索而不易得当的，", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "坟", "x": "天下不舒服的人们多着，而有些人们却一心一意在造专给自己舒服的世界。", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "坟", "x": "所以虽然明知道过去已经过去，神魂是无法追蹑的，但总不能那么决绝，还想将糟粕收敛起来，造成一座小小的新坟，一面是埋藏，一面也是留恋。", "y": "", "d": "2021-04-30"}]}, {"id": "843379", "title": "蒙田随笔", "author": "[法]蒙田", "cats": ["文学-散文杂著"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "论习惯与不轻易改变已被接受的法律", "x": "确实，习惯是个粗暴而阴险的女教师。它悄悄地不声不响在我们身上建立权威。一开头温良谦恭，随着时间的帮助扎根壮大，不久向我们露出狰狞凶暴的面目，使我们连得抬眼看一看这张脸的自由也没有。", "y": "", "d": "2019-10-13"}, {"k": "h", "c": "论儿童教育—— 致戴安娜·德·弗瓦，居松伯爵夫人", "x": "与人交往方面，我经常注意到这个缺陷，我们不去认识别人，而一心标榜自己，不思努力获取新知识而兜售自己的货色。沉默与谦虚是交谈中非常有用的品质。当这个孩子得到知识后，要教导他谦虚谨慎；有人在他面前说话不中听，听到不要怒形于色；因为抨击一切不合自己心意的东西，这是极不礼貌的讨厌行为。让他乐于自我改正，不要自己不愿做的事都怪别人，不要跟大众的习俗背道而驰。“做人聪明也可以不张扬，不傲慢。”（塞涅卡）", "y": "", "d": "2019-10-18"}, {"k": "h", "c": "论节制", "x": "我喜欢性情中允平和", "y": "", "d": "2019-10-21"}]}, {"id": "25077687", "title": "遥远的向日葵地（李娟最喜欢的作品，鲁迅文学奖作品）", "author": "李娟", "cats": ["文学-散文杂著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 灾年", "x": "所谓“希望”，就是付出努力有可能比完全放弃强一点点。", "y": "", "d": "2020-11-07"}, {"k": "h", "c": "第39章 我的无知和无能", "x": "眼下世界里，青草顶天而生，爬虫昼追日，夜逐月。风是透明的河流，雨是冰凉的流星。\n只有我最简陋，最局促。\n我酝酿出一份巨大的悲哀，却流不出几行眼泪。我全面坦露自己的软弱，捶胸顿足，小丑般无理取闹。可万物充耳不闻。\n我无数遍讲诉自己的孤独，又讲诉千万人的千万种孤独。越讲越尴尬，独自站在地球上，无法收场。", "y": "", "d": "2025-04-10"}]}, {"id": "41135845", "title": "微尘", "author": "陈年喜", "cats": ["文学-散文杂著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "北京的秋天", "x": "北京的秋天几乎没有雨，每天都是晴天，没有霾的时候，天空也蓝得通透。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "北京的秋天", "x": "我喜欢北京的落日，在远远的天边，它慢慢向北方的山尖落下去，那余晖异常纯洌，比它在东方升起时要壮烈得多。它们落下去了，把一缕缕余焰留存在云彩的边上。", "y": "", "d": "2024-02-19"}]}, {"id": "23523964", "title": "我的心只悲伤七次（2018版）", "author": "[黎巴嫩]纪伯伦", "cats": ["文学-现代诗歌"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "译者序二 我为什么翻译《先知》和《吉檀迦利》", "x": "《先知》的好处，是作者以纯洁美丽的诗的语言，说出了境界高超、眼光远大的、既深奥又平凡的处世为人的道理，", "y": "", "d": "2021-05-18"}, {"k": "h", "c": "推荐序 介绍纪伯伦的《先知》和《沙与沫》", "x": "纪伯伦的散文诗想象丰富，感情深挚，富于哲理，韵味隽永。", "y": "", "d": "2021-05-18"}]}, {"id": "26187212", "title": "祝你快乐勇敢", "author": "果麦", "cats": ["文学-散文杂著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "祝你快乐，勇敢", "x": "亲爱的，去思考你身处的世界。至于如何表达你的所思所想，那就随你了；无论是你童年的记忆，还是对自己未来的期许，只需要多留心出现在你生命中的事物，把它们放在生活的首位。你内心真正喜欢的事情值得你全身心地投入，你必须为之努力；并且不要浪费太多的时间和精力来解释你对他人的态度。是谁告诉你，你应该对此有所解释呢？", "y": "", "d": "2020-02-02"}, {"k": "h", "c": "祝你快乐，勇敢", "x": "要有耐心，不要沮丧。你想啊，若春天要来，大地会一点一点地让它实现", "y": "", "d": "2020-02-02"}]}, {"id": "912825", "title": "沉默的大多数", "author": "王小波", "cats": ["文学-散文杂著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "理想国与哲人王", "x": "参差多态是幸福的本源，把什么都规定了就无幸福可言。", "y": "", "d": "2018-02-19"}, {"k": "h", "c": "东西方快乐观区别之我见", "x": "真正的幸福就是让人在社会的法理、公德约束下，自觉自愿地去生活；需要什么，就去争取什么；", "y": "", "d": "2018-02-19"}]}, {"id": "913003", "title": "朗读者（全3册）", "author": "董卿主编", "cats": ["文学-散文杂著"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "朗读者 张梓琳", "x": "如果没有你，这一百天，就会像它之前的一百天，以及它之后的一百天一样，陷入混沌的时间之流，绵绵不绝而不知所终。", "y": "", "d": "2018-02-19"}, {"k": "h", "c": "朗读者 张梓琳", "x": "望你来到这个世界不是白来一趟，能有愿望和能力领略它波光潋滟的好，并以自己的好来成全它的更好。", "y": "", "d": "2018-02-19"}]}, {"id": "3300232575", "title": "无暇他顾", "author": "[美]厄休拉·勒古恩", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "无暇他顾", "x": "对于处在生活中的人而言，空闲时间就是自由时间，无比宝贵。", "y": "", "d": "2026-09-24"}]}, {"id": "22355124", "title": "万水千山走遍", "author": "三毛", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "封面", "x": "她是我们心中浪漫、洒脱、真性情的永远的三毛，永恒的传奇。", "y": "", "d": "2026-03-07"}]}, {"id": "23444235", "title": "蒋勋说红楼梦（修订版）（套装共8册）", "author": "蒋勋", "cats": ["文学-文学鉴赏"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "制灯谜贾政悲谶语 听曲文宝玉悟禅机", "x": "当我们能够欣赏各色人等的时候，看到的将是他们如何在各自的宿命里去完成所谓的因果", "y": "", "d": "2025-05-01"}]}, {"id": "25164489", "title": "九篇雪（李娟首部作品全新修订版）", "author": "李娟", "cats": ["文学-散文杂著", "文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "新版序", "x": "年龄增加带来的福利之一，就是总算没那么别扭了，总算认同了自己的一切。", "y": "", "d": "2024-12-24"}]}, {"id": "36144797", "title": "一生里的某一刻", "author": "张春", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "作为一个废物我是怎样跑步的", "x": "归根结底，就是要忠实于自己的真实感受。人生可能并不是用来承担痛苦，期待不定时出现的希望微光的。它可能是用来享受的。领悟到了这一点，你就会发现痛苦和快乐没有本质区别。", "y": "", "d": "2024-10-21"}]}, {"id": "3300054377", "title": "星期六晚我们去散步吧", "author": "隔花人 ", "cats": ["文学-现代诗歌"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "摄影师", "x": "窗户\n给春天拍了照片\n打印出来\n送给我的眼睛", "y": "", "d": "2024-02-09"}]}, {"id": "3300020164", "title": "记一忘三二（不开心就读李娟！）", "author": "李娟", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "李娟记（代自序）", "x": "长年在河中拦网守候的人，总比隔三岔五空着手到水边碰运气的人收获稍多。", "y": "", "d": "2023-01-11"}]}, {"id": "3300004400", "title": "生活在裂隙", "author": "立雯", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "人的动物性与植物性", "x": "正如尼采所述：“人和树一样，他愈求升到高处和光明，他的根就愈往下扎，向黑暗，向深处，——向罪恶。”", "y": "", "d": "2022-03-25"}]}, {"id": "25506340", "title": "一个人生活", "author": "[日]谷川俊太郎", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "生", "x": "“活着真好”这种通俗的感慨，有时候听起来有点儿蹊跷，有点儿害羞。因为我们清楚地知道，活着的感觉并不是像这样的只言片语就可以形容的，并不是这样柔弱而浅薄的。", "y": "", "d": "2020-06-08"}]}, {"id": "MP_WXS_3007624320", "title": "豆瓣读书", "author": "公众号", "cats": [], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "未分章节", "x": "《夏天》\n罗伯特·瓦尔泽\n\n在夏天，我们吃绿豆，\n桃，樱桃和甜瓜。\n在各种意义上都漫长且愉快\n日子发出声响。\n \n列车经过乡下，\n旗帜悦动在屋顶上。\n在船上多么惬意\n周围是渐长的水面。\n \n山顶上覆盖着雪，\n花散发香味。在湖上\n你可以花所有时间\n享受唱歌的乐趣。\n \n我不知道什么使我满足，\n你躺在草地上看书\n听到你的四周是\n无力的蚊蝇嗡嗡着。", "y": "", "d": "2020-06-05"}]}, {"id": "857859", "title": "我执", "author": "梁文道", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "我虽千年能变化", "x": "怀疑是一种顽强的植物。当它被下在两人之间的土地上，即便只是一颗种子，迟早也会抽芽长大，终于扭曲一切，排挤开所有本来健康的花草，使之枯萎。", "y": "", "d": "2020-06-05"}]}, {"id": "22670818", "title": "我的星期天和星期一之间少了一天", "author": "卡特琳·鲍尔范德", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "我行我素与随波逐流", "x": "我把她的评价权且当作赞美。当然，我并不是故意要给别人留下无趣的印象。我只是觉得，总有这么一类人，他们不情愿说一些哗众取宠的话来吸引眼球，只想安静地活在自己的世界里。很幸运，我就是这类人中的一员。", "y": "", "d": "2020-05-18"}]}, {"id": "26713355", "title": "你当像鸟飞往你的山", "author": "[美]塔拉·韦斯特弗", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "悲剧之后的闹剧", "x": "过去是一个幽灵，虚无缥缈，没什么影响力。只有未来才有分量。", "y": "", "d": "2020-03-09"}]}, {"id": "937025", "title": "假如真有时光机", "author": "[日]村上春树", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "棒球、鲸鱼和甜甜圈（波士顿2）", "x": "在那里发生的点点滴滴，在那里的所见所闻，当时流行的音乐，呼吸的空气，邂逅的人，交谈的话语。当然也可能有一些无趣的体验、悲哀的感受。然而开心的事情也好，不太圆满的事情也罢，一切都被时间这张柔软的包装纸包裹起来，和香包一起，收进了你意识的抽屉。", "y": "", "d": "2020-03-04"}]}, {"id": "913196", "title": "生活是很好玩的", "author": "汪曾祺", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "我的家乡", "x": "城外的孩子放风筝，颤悠悠的风筝在我们脚下飘着。", "y": "", "d": "2018-02-02"}]}, {"id": "277781", "title": "看见", "author": "柴静", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第八章 我只是讨厌屈服", "x": "能独立地表达自己的观点，却不傲慢，对政治表示服从，却不卑躬屈膝。能积极地参与国家的政策，看到弱者知道同情，看到邪恶知道愤怒，我认为他才算是一个真正的公民。", "y": "", "d": "2019-07-12"}]}, {"id": "830157", "title": "醒来觉得甚是爱你", "author": "朱生豪", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "魔鬼委屈你做天使", "x": "人也总是，白天尤其是上半天总是有气没力的，一过了夜里十点钟，便精神百倍，夜猫的生活虽然也颇有意味，可奈白天不待睡觉何。\n每天每天看不到你，这是如何的生活。事实上你已成为唯一的亲人了，可以寄托我心情的对象，无论是人或艺术、主义、宗教，是一个都没有，除了你。但就是你也不能给我大的启发与鼓奋，一切是虚无得可怕。\n我永远爱你。\n魔鬼 十二夜", "y": "", "d": "2018-07-12"}]}, {"id": "906972", "title": "我决定活得有趣", "author": "[新加坡]蔡澜", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "活得有趣，才能活得精彩", "x": "但是怎么一个走法？没有人敢去提起。中国人，对死的禁忌，是根深蒂固的。", "y": "", "d": "2018-03-14"}]}, {"id": "932238", "title": "日常", "author": "简儿", "cats": ["文学-散文杂著"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "光阴的故事", "x": "“用距离、用沉默自我保护。我确定只和很少、很熟识的人认真交往，缩小圈子，在乎品质和内涵，不将就，不敷衍，不貌合神离。肃清一切关系，力求纯粹。这世上，风景万千，人如山海，谁都不能一一领略，观其一角，得之一二，比之草木，比之鱼虫也算是荣幸。”", "y": "", "d": "2018-05-23"}]}]}, {"key": "02_小说与经典文学", "name": "小说与经典文学", "books": [{"id": "34615967", "title": "红楼梦（人民文学版）", "author": "曹雪芹著 无名氏续 程伟元 高鹗整理", "cats": ["文学-古典文学"], "bmCount": 62, "rvCount": 6, "notes": [{"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "如蒙发一点慈心，携带弟子得入红尘，在那富贵场中、温柔乡里受享几年，自当永佩洪恩，万劫不忘也。", "y": "", "d": "2025-03-29"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "那红尘中有却有些乐事，但不能永远依恃；况又有‘美中不足，好事多魔’八个字紧相连属，瞬息间则又乐极悲生，人非物换，究竟是到头一梦，万境归空，倒不如不去的好。", "y": "", "d": "2025-03-29"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "携入红尘，历尽离合悲欢炎凉世态", "y": "", "d": "2025-04-18"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "今之人，贫者日为衣食所累，富者又怀不足之心，纵一时稍闲，又有贪淫恋色、好货寻愁之事", "y": "", "d": "2025-04-18"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "他是甘露之惠，我并无此水可还。他既下世为人，我也去下世为人，但把我一生所有的眼泪还他，也偿还得过他了。", "y": "", "d": "2025-04-18"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "接二连三，牵五挂四", "y": "", "d": "2025-04-19"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "乱烘烘你方唱罢我登场，反认他乡是故乡﻿。甚荒唐，到头来都是为他人作嫁衣裳﻿！", "y": "", "d": "2025-04-19"}, {"k": "h", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "人名地名谐音寓意", "y": "", "d": "2025-04-19"}, {"k": "t", "c": "第一回 甄士隐梦幻识通灵 贾雨村风尘怀闺秀", "x": "反认他乡是故乡——这里把现实人生比作暂时寄居的他乡，而把超脱尘世的虚幻世界当作人生本源的故乡；因而说那些为功名利禄、姣妻美妾、儿女后事奔忙而忘掉人生本源的人是错将他乡当作故乡。", "y": "人间不过是你寄身之处，别太执着于尘世的这些东西，它们不过都是过眼云烟。", "d": "2025-04-19"}, {"k": "h", "c": "第二回 贾夫人仙逝扬州城 冷子兴演说荣国府", "x": "此即画家三染法也。未写荣府正人，先写外戚，是由远及近、由小及大也。若使先叙出荣府，然后一一叙及外戚，又一一至朋友，至奴仆，其死反（疑系“板”之抄误）拮据之笔，岂作十二钗人手中之物也", "y": "", "d": "2025-04-20"}, {"k": "h", "c": "第三回 贾雨村夤缘复旧职 林黛玉抛父进京都", "x": "面若中秋之月，色如春晓之花，鬓若刀裁，眉如墨画，面如桃瓣，目若秋波。虽怒时而若笑，即瞋视而有情。", "y": "", "d": "2025-04-20"}, {"k": "t", "c": "第三回 贾雨村夤缘复旧职 林黛玉抛父进京都", "x": "天然一段风骚，全在眉梢；平生﻿万种情思，悉堆眼角。", "y": "写得真好哇！精妙且极具韵味，短短两句，只通过眉梢眼角这些细节，把宝玉的风情和情思都展现出来了。", "d": "2  开夜宴异兆发悲音 赏中秋新词得佳谶", "x": "真是月明灯彩，人气香烟，晶艳氤氲，不可形状。", "y": "", "d": "2025-06-03"}, {"k": "h", "c": "第七十六回 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞", "x": "正说着闲话，猛不防只听那壁厢桂花树下，呜呜咽咽，悠悠扬扬，吹出笛声来。趁着这明月清风，天空地静，真令人烦心顿解，万虑齐除，都肃然危坐，默默相赏。", "y": "", "d": "2025-06-03"}, {"k": "h", "c": "第七十六回 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞", "x": "黛玉笑道：“正是古人常说的好‘事若求全何所乐’", "y": "", "d": "2025-06-03"}, {"k": "h", "c": "第七十六回 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞", "x": "寒塘渡鹤影﻿", "y": "", "d": "2025-06-03"}, {"k": "h", "c": "第七十六回 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞", "x": "冷月葬花魂﻿", "y": "", "d": "2025-06-03"}, {"k": "h", "c": "第七十七回 俏丫鬟抱屈夭风流 美优伶斩情归水月", "x": "忽闻有人唤他，强展星眸，一见是宝玉，又惊又喜，又悲又痛，忙一把死攥住他的手。", "y": "", "d": "2025-06-04"}, {"k": "h", "c": "第七十七回 俏丫鬟抱屈夭风流 美优伶斩情归水月", "x": "二人自是依依不舍，也少不得一别。晴雯知宝玉难行，遂用被蒙头，总不理他，宝玉方出来。", "y": "", "d": "2025-06-04"}, {"k": "h", "c": "第七十七回 俏丫鬟抱屈夭风流 美优伶斩情归水月", "x": "进来笑向宝玉道：“你们好生过罢，我从此就别过了。”", "y": "", "d": "2025-06-04"}, {"k": "h", "c": "第七十九回 薛文龙悔娶河东狮 贾迎春误嫁中山狼", "x": "爱自己尊若菩萨，窥他人秽如粪土；外具花柳之姿，内秉风雷之性。", "y": "", "d": "2025-06-07"}]}, {"id": "3300067776", "title": "明亮的夜晚", "author": "崔恩荣", "cats": ["精品小说-女性小说", "文学-外国文学"], "bmCount": 45, "rvCount": 3, "notes": [{"k": "h", "c": "1", "x": "如果心是一个可以从人体中取出的器官，我想把手伸进胸膛，把它取出来。我要用温水将它洗干净，用毛巾擦干水汽，晾到阳光充足、通风良好的地方。", "y": "", "d": "2026-08-12"}, {"k": "h", "c": "1", "x": "这期间我将作为无心之人生活，直到我的心被晾干了，软软的，重新散发出好闻的香气，再把它重新装回胸膛。这样就可以重新开始了吧。偶尔我会这样想象着。", "y": "", "d": "2026-08-12"}, {"k": "t", "c": "1", "x": "“好久不见。”", "y": "原来是祖母啊，好久不见！👵🥰", "d": "2026-08-12"}, {"k": "h", "c": "2", "x": "我用抹布擦好桌子，祖母把蛋糕切好装到各自的盘子里。然后我们把红酒倒进杯子，慢慢喝起来。", "y": "", "d": "2026-08-13"}, {"k": "t", "c": "2", "x": "她应该从妈妈那里听说过我已经结婚，但她没有问起任何有关前夫的事。祖母只是问我在大学学了什么、在单位做什么、不工作的时间做些什么。", "y": "和家人朋友聊天，关心对方如何生活、对什么感兴趣，关心“她”本身，不问她是否完成了某个社会时钟下的任务。", "d": "2026-08-13"}, {"k": "h", "c": "2", "x": "好好看看这个世界", "y": "", "d": "2026-08-13"}, {"k": "h", "c": "3", "x": "就这样，不要评价发生的事情，也不要反抗，要直接接受。这就是活下去的方法。", "y": "", "d": "2026-08-13"}, {"k": "h", "c": "3", "x": "她有一种本领，在任何情况下都不欺骗自己的本领。不正当的事就是不正当的事，悲伤的事就是悲伤的事，孤独的心就用孤独的心去感受。", "y": "", "d": "2026-08-13"}, {"k": "h", "c": "3", "x": "世上最重的罪，就是作为女人出生，作为女人而活。", "y": "", "d": "2026-08-13"}, {"k": "h", "c": "3", "x": "她不想带着一颗倾斜的心东倒西歪地生活。", "y": "", "d": "2026-08-13"}, {"k": "h", "c": "4", "x": "祖母摇下车窗，让柔和的春风吹到脸上。风吹起她的短发，河边盛开着成片的鲜花，收音机里传出歌手周炫美的歌曲，夜晚的空气中能闻到淡淡的花香。微风轻拂，一个美好的春夜。祖母也一起哼唱着。", "y": "", "d": "2026-08-14"}, {"k": "h", "c": "6", "x": "不同于离婚前从没一个人生活过的我，智友以前便没有结婚的想法，一直都是一个人。离婚之前，我一直无法想象没有家人的孤独生活。但在经历了婚姻制度之后，我决定，无论如何都不会再次迈入婚姻。", "y": "", "d": "2026-08-18"}, {"k": "h", "c": "8", "x": "在痛苦当中时间不是呈直线流逝的。我一直在退缩，最后退回到那个熟悉的坑里。", "y": "", "d": "2026-08-24"}, {"k": "h", "c": "8", "x": "在那个哭了很久的夜晚，我想着这些，直视着自己的软弱，还有渺小。", "y": "", "d": "2026-08-24"}, {"k": "h", "c": "8", "x": "我一度认为自己的优点就是善于忍耐。得益于这份忍耐，我取得了超出自己能力的成绩。", "y": "", "d": "2026-08-24"}, {"k": "h", "c": "8", "x": "祖母用手背拍打着野蒿花。​“我知道现在你也在暗自哭泣，​”我仿佛听到祖母这样说，​“不要只想着结束的东西。​”", "y": "", "d": "2026-08-24"}, {"k": "h", "c": "9", "x": "所有的一切都像午觉时做过的梦一样，渐渐失去了真实感。", "y": "", "d": "2026-08-29"}, {"k": "h", "c": "9", "x": "做一些彩色的梦", "y": "", "d": "2026-08-29"}, {"k": "h", "c": "10", "x": "一种在放松警惕的时候、缺乏紧张的时候、以为不会有什么事的时候、摆脱悲观想法的时候、享受某个瞬间的时候，就会担心不好的事情再次降临的不安。", "y": "", "d": "2026-08-29"}, {"k": "h", "c": "10", "x": "不幸似乎很喜欢那种环境——当你好不容易松了一口气的时候，心想着现在应该可以活下去的时候。", "y": "", "d": "2026-08-29"}, {"k": "h", "c": "10", "x": "人生中最后悔的事情就是那些。不能尽情地一起笑、一起开心、一起分享温暖，而是深陷不安之中。因为世上有些事情是想逃避也无法逃避的。无论多么不安，无论多么回避美好的瞬间，有些事情也是无法逃避的。", "y": "", "d": "2026-08-29"}, {"k": "h", "c": "11", "x": "因为不管自己多辛苦，我都不愿跟别人发牢骚，也不想给别人添麻烦。", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "11", "x": "她都觉得内心的空洞越来越大，到最后自己似乎都要被它吞没了。", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "11", "x": "遥远而巨大的世界", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "11", "x": "是爱让祖母流泪了，是爱触动了连侮辱和伤害都无法撼动的祖母的心。", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "12", "x": "我无法否认我很幸运。我好像一直都是这样的，但总是不开心。没有什么时间是珍贵得让我想要抓住的。我好像觉得一切都结束了。”", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "12", "x": "试图通过结婚逃避困难", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "12", "x": "我们能成为朋友已经足够了", "y": "", "d": "2026-08-31"}, {"k": "h", "c": "13", "x": "我陶醉于自己的残忍，毫无怜悯地看着妈妈。", "y": "", "d": "2026-09-01"}, {"k": "h", "c": "13", "x": "我把在冰箱里放了很久、熟透了的水蜜桃拿出来，仔细洗干净，又用热水给玻璃瓶消了毒。把桃肉和白糖放进锅里，开小火一直搅拌，做成桃子酱。再把从面包店买来的面包和鲜奶油装进纸袋，把在家里冲好的咖啡装进保温瓶，我带上它们去了祖母家。", "y": "", "d": "2026-09-01"}, {"k": "h", "c": "14", "x": "我想通过和他结婚，逃避自己存在的问题和具有的可能性。我想远离我的原生家庭，远离看似难以解决的伤痛，远离受伤的可能性，最重要的是，远离真正的爱。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "14", "x": "还有比欺骗自己更容易的事吗？", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "14", "x": "她们之间没有现实的公分母。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "14", "x": "我已经习惯了经常离开，所以不怎么买东西，东西多了打理起来也很难。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "14", "x": "我没有告诉祖母我被大田的研究所录取了。我没有勇气告诉祖母，到了春天我就要离开熙岭。我和祖母打纸牌、做炒年糕吃、用望远镜观察月球表面、在去集市的路上打雪仗，可我依然无法开口说自己要离开熙岭。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "14", "x": "我常常想，她以后的人生该有多丰富啊。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "15", "x": "刷新了消消乐和跑跑姜饼人的最高游戏纪录，玩了魔兽争霸。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "15", "x": "我在盒子的底部看到一张有点模糊的照片。照片上几个女人坐在檐廊上。年轻的妈妈穿着一件蓝色无袖连衣裙，剪着西瓜头的我在她身边打哈欠。在我旁边，梳着两根辫子的年幼的姐姐正看着我。再旁边是年轻的祖母，她两腿伸直，身体向姐姐那边倾斜着。妈妈的左边，一个穿着白色苎麻衣服的老人坐得离妈妈很近，正在笑着。我很快就认出了这个老人是谁。", "y": "", "d": "2026-09-02"}, {"k": "h", "c": "16", "x": "她希望在自己所感受到的现实重力无法起作用的地方，女儿能够变得更加轻松，更加自由。我久久地思考着她的这份心意。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "16", "x": "我既是现在的自己，也是三岁时的自己，同时还是十七岁时的自己。我轻易便抛弃了自己，但被我抛弃的自己并没有消失，而是一直留在我的心里。她在等着我，希望得到我的而不是其他人的关心；期望得到我的而不是别人的安慰。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "16", "x": "是我，我在听。把你长久以来想说的话都告诉我吧。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "16", "x": "祖母微笑地点了点头，似乎知道我想说什么。", "y": "", "d": "2026-09-03"}, {"k": "t", "c": "16", "x": "祖母微笑地点了点头，似乎知道我想说什么。", "y": "就这么结束了～意犹未尽🥹", "d": "2026-09-03"}, {"k": "h", "c": "作家的话", "x": "我想写的是智妍到熙岭后慢慢恢复的故事，为此却不得不让她直面自己的伤痛。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "因为有光，所以可能——《明亮的夜晚》译后记", "x": "广阔的宇宙、深邃的星系、浩瀚的大海无不寄托着她们无尽的好奇与热爱。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "因为有光，所以可能——《明亮的夜晚》译后记", "x": "她们既是心意相通的朋友，也是互相搀扶的亲人。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "因为有光，所以可能——《明亮的夜晚》译后记", "x": "关于本书的标题，作者曾表示，书中四代女性走过的长达百年的时间就像漫漫的长夜，但是，那不是伸手不见五指的漆黑的夜，而是充满隐隐光辉的明亮的夜。如果人生是长夜，照亮漫漫人生路的又是什么呢？我想，那一定是爱。", "y": "", "d": "2026-09-03"}, {"k": "h", "c": "因为有光，所以可能——《明亮的夜晚》译后记", "x": "女性人物之间的互助与友爱，支撑着彼此，走过了人生里的一程又一程。", "y": "", "d": "2026-09-03"}]}, {"id": "3300018249", "title": "快乐的死（读客三个圈经典文库）", "author": "[法]阿尔贝·加缪", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 41, "rvCount": 0, "notes": [{"k": "h", "c": "第一部分 自然死亡", "x": "正值人间四月天，明媚而凛冽的春日早晨，天空纯净而透着寒意，阳光明晃晃地照着，却没有任何暖意。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第一部分 自然死亡", "x": "在这饱满而欢愉的空气中，在这富庶丰饶的天空下，人唯一的任务似乎就是活着，并且活得快乐。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第一部分 自然死亡", "x": "感觉内心万籁俱寂", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第二章", "x": "他正忙着亲身去经历", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第二章", "x": "晚上，他们会围着煤油灯一起安静地吃饭，这种简单的静默中，自有一种秘而不宣的快乐", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第二章", "x": "如今，孤身一人的贫穷却是一种可怕的苦难。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第二章", "x": "每当梅尔索痛苦地想起已经过世的母亲，其实他是在可怜自己", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "第四章", "x": "梅尔索说，​“每天要上八小时班。啊！我要是能自由就好了！”", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第四章", "x": "人没有钱不可能快乐", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第四章", "x": "快乐本身也是一种漫长的耐心", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第四章", "x": "身为有钱人，或者成为有钱人，就是在配得上快乐时有时间去快乐", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第五章", "x": "在这个丑陋的房间里，独自面对着自己一无是处的人生", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第五章", "x": "面对人生中突如其来的启示", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第二部分 有意识的死", "x": "梅尔索突然觉得自己无所归依", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第二章", "x": "他收取内心最微小的力量与希望，把它们汇聚并重组，在内心重塑自己，同时也塑造了即将迎接的命运。", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第二章", "x": "大海缓缓摩挲着船只两侧。天空载满了星辰。", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第二章", "x": "用交织着眼泪和阳光的脸，去爱、去欣赏这个人生", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第三章", "x": "阳光在他脸上流转。他的毛孔略微湿润，呼吸着这笼罩着他又令他沉睡的火", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第三章", "x": "像这样活在世界面前，这样感受自己的重量，这样每天看到自己的脸庞明亮起来，又黯淡下去。", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第三章", "x": "一整天就这样在围绕群山和大海的日出日落间过去了，浸泡在细腻的阳光里，大家欢笑着，打着趣，做着对未来的计划。每个人都对表象微笑，并假装臣服于其下。", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第三章", "x": "世界永远只说一件事情，它先让人好奇，然后又让人厌倦。但总有那么一刻，它终于因为不停重复而获胜，也终于因为锲而不舍而获得奖赏。", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第三章", "x": "日子好的时候，要对人生有信心，这样才能逼着它好好回应。", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第三章", "x": "脸上既有泪水又有阳光", "y": "", "d": "2025-02-22"}, {"k": "h", "c": "第四章", "x": "天还很黑。最后一颗星星缓缓在天空融化", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "他感觉到自己的笃定是多么脆弱。他的心出奇地干涸。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "他躲进了男人的身份里，因而逃避了自己内心隐隐的恐惧。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "通过模拟某些崭新的开始，通过思考自己过去的人生，他在内心确认了自己想要和不想要成为的人。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "这是他所寻觅的那种独特的快乐，这种快乐的前提是早起、规律地游泳和有意识地保持卫生。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "他感到身体很警醒，准备好迎接任何事情。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "快乐是属于凡人的，永恒也在日常。重点是要懂得谦卑，要懂得让自己的心顺应每天的节奏，而不是非要每天的节奏顺应自己的心意。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "他就这样返回到一种纯粹的生活状态，重回到只有最愚笨或者最智慧的生物才能享有的天堂。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "贝尔纳凭着包容的能力，在任何地方都能适应。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第四章", "x": "谁也不知道快乐的生活会是更长久或是更短暂。只有当下的快乐才是真的快乐。只是一个瞬间，仅此而已。死也不能阻碍什么—它只是一场快乐的意外。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第五章", "x": "他从来不曾如此细腻地感受过春天", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第五章", "x": "害怕死亡就是害怕生命", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第五章", "x": "他们并没有真正地活过，所以总感觉没活够。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "第五章", "x": "死是一种致命又温柔的姿态，对感激和反抗都一样报以微笑。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "三个圈独家文学手册", "x": "海滩和海水—并没有被少数有钱人圈起来独享，而是一视同仁地滋养荣华、抚慰穷困。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "三个圈独家文学手册", "x": "不管你是哪个国家的人，都能脱得赤条条地去领取免费的日光和空气。", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "图文解读 和加缪对话：没有对生活的绝望，就不会热爱生活", "x": "“确认生命中的荒诞感不可能是一个终点，而恰恰是一个开始。”", "y": "", "d": "2025-02-23"}, {"k": "h", "c": "图文解读 和加缪对话：没有对生活的绝望，就不会热爱生活", "x": "置身阳光和苦难之间", "y": "", "d": "2025-02-23"}]}, {"id": "3300090447", "title": "她对此感到厌烦2", "author": "妚鹤", "cats": ["精品小说-女性小说"], "bmCount": 35, "rvCount": 3, "notes": [{"k": "h", "c": "Chapter 27 同伴", "x": "你是如此鲜活，如此生机勃勃，所以我才会爱你。", "y": "", "d": "2025-08-21"}, {"k": "h", "c": "Chapter 28 旅途", "x": "然后发现这是一个在世界许多地方都曾经出现的风俗——产翁制。\n当女人生育时，男人也装成痛苦的模样，模拟女人生育的过程。而女人生育之后，会被赶去干活儿，男人抱着孩子在床上休养，接受众人“你成功诞下了孩子”的祝福，仿佛孩子真是他十月怀胎，痛苦分娩生下的。", "y": "", "d": "2025-08-21"}, {"k": "h", "c": "Chapter 28 旅途", "x": "“在我看来，是你们这些女人在找事！”躲在门口的光头男喊道，“生孩子有什么了不起的？世上每天有那么多女人，两腿一撇就生下了孩子。别人都没有那么多事，你们非要追究孩子是谁生下来的又有什么意义？”", "y": "", "d": "2025-08-21"}, {"k": "h", "c": "Chapter 29 觉悟", "x": "为什么当女人可以工作时，会有男人因为“她不顾家了”来砸店，明明这样可以提高家庭收入。\n为什么当女人学习射箭和剑术时，会受到各种打压和污蔑，明明他们轻视女人的柔弱。\n为什么厌恶女子学校，为什么会排斥女骑士，为什么会有猎巫行动？\n为什么想要控制她们，为什么千方百计打压她们，为什么需要她们又杀死她们？\n其中，除了欲望，难道没有恐惧吗？\n她们一直具有令他们恐惧的力量。", "y": "", "d": "2025-08-21"}, {"k": "h", "c": "Chapter 29 觉悟", "x": "说实话，我们可以想象到那个世界的模样，那是一个女人可以安心生活、不被羞辱的世界", "y": "", "d": "2025-08-21"}, {"k": "h", "c": "Chapter 29 觉悟", "x": "即使是最底层的男性，也具有男性普遍的傲慢，用她们开下流的玩笑。", "y": "", "d": "2025-08-21"}, {"k": "h", "c": "Chapter 33 成长", "x": "邪恶获得胜利的唯一条件就是善良的人们保持沉默。", "y": "", "d": "2025-08-25"}, {"k": "h", "c": "Chapter 33 成长", "x": "婴儿不是从腋下出生的，狄赖，婴儿是从月经流出的地方出生的，它叫作产道，产道就隐藏在你的身体里，它是一条路。这条路连接着女人特有的宫殿，这个宫殿就在你的肚子里，而月经是一个标志，它标志着你的宫殿已经建好了。在宫殿两侧，有两个小宝库，它们一直保存着珍贵的种子。当宫殿建好以后，这些珍贵的种子就会依次成熟，变成可以激活的状态。", "y": "", "d": "2025-08-25"}, {"k": "h", "c": "Chapter 33 成长", "x": "是的，种子。当你想要孩子时，就可以激活种子，使得种子在宫殿里成长，成为胎儿，最后经过产道，诞生的婴儿就拥有了真正的生命……”莉莉丝温柔地说道，“我们每个人都是这样出生的。", "y": "", "d": "2025-08-25"}, {"k": "h", "c": "Chapter 33 成长", "x": "宫殿是你的，种子也是你的，你可以激活它们，也可以让它们像花开花落一样自然消失。创造生命的决定权掌握在你的手中，这是权力，而不是义务。你完全可以自己决定是否使用这个权力，不需要有任何的心理负担。", "y": "", "d": "2025-08-25"}, {"k": "h", "c": "Chapter 34 转变", "x": "堵死她们的路，质疑并隐藏她们的能力，剥夺她们学习的机会，然后和她们说“你们不如别人”。然后，无处施展的她们就会被冠以弱者之名，茫然而抑郁地认命。", "y": "", "d": "2025-08-26"}, {"k": "h", "c": "Chapter 35 断锁", "x": "在这个世界，动物们从来不会因为裸体而羞耻。只有女人，只有女人的衣服被扒掉，只有被他们看到女人裸露身体，只有他们偷窥女人的裸体和私处时，我们才认为这是对女人的羞辱，甚至我们一想到这样的经历就会感到痛苦。", "y": "", "d": "2025-08-26"}, {"k": "h", "c": "Chapter 35 断锁", "x": "“为什么？”狄赖终于将伊迪萨的手指扒开一道缝，“啊，这有什么，不就是他尿尿的东西翘起来了吗？不用捂我的眼睛，这个东西我看过的！”", "y": "", "d": "2025-08-26"}, {"k": "h", "c": "Chapter 35 断锁", "x": "不能简单地置换，也无法简单地置换。\n男人的凝视会让她们联想到自己或者别人被伤害、被侮辱的经历，她们的凝视却让男人想到了女人对自己的崇拜和性。", "y": "", "d": "2025-08-26"}, {"k": "h", "c": "Chapter 35 断锁", "x": "她们一定要直面，并且改变。\n如果她们不改变，不只是她们自己，她们的姐妹、她们的下一代还会经历相同的事，经受相同的痛苦，重复相同的折磨。\n她们需要直视，需要愤怒，需要发出自己的声音。", "y": "", "d": "2025-08-26"}, {"k": "t", "c": "Chapter 35 断锁", "x": "不是用尽生命最后的余光努力钩住冰冷的手，而是在绚烂阳光下用力握住温热的手。", "y": "太棒啦女孩们！这一次，我们选择团结而非竞争，我们选择握住彼此温热的手，朝着我们共同的目标前进！", "d": "2025-08-26"}, {"k": "h", "c": "Chapter 36 女儿们", "x": "——我的女儿们，希望你们前路顺利，平安抵达梦想中的世界。\n那只毛线编织的小鸟被珍惜地摆在书桌上，被摊开的诗集停留在某一页：\n在严酷的未来，\n你要记住我们的往昔；\n我是你第一个诗人，\n你是我最好的诗。", "y": "", "d": "2025-08-27"}, {"k": "h", "c": "Chapter 37 贵族生活", "x": "学习，锻炼，赶路", "y": "", "d": "2025-08-27"}, {"k": "h", "c": "Chapter 39 归队", "x": "用含糊的话术掩盖剥削的真相。\n把囚禁说成恩赐，把驯化说成奖赏。\n被拿走的是自我，被赐予的却是他人的意愿。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 39 归队", "x": "哦，爱情爱情，又是爱情，这世上有那么多感情，可你们那小得可怜的脑瓜里只能想到这两个字，并想用它们来束缚我们。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 39 归队", "x": "她崇拜他，迎合他，这说明她比他要弱得多。\n她是弱小、愚蠢、大脑空无一物的家伙。\n所以他可以教育她、教训她，把她踩在脚下。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 39 归队", "x": "这世上不存在不反抗就被赋予的权力。\n若是会被落后憎恨，若是会被无知憎恨，那就让他们憎恨去吧！\n只有拆掉天花板，她们才能彻底站起来。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 42 反叛者", "x": "“他们当然会那样说，狮子也希望羊不长角，猎人也希望狼没有尖牙和利爪，所有的奴隶主都希望奴隶不吃不喝，顺从地工作。”9433说道，“你们听勇者打败巨兽、王子打败巨龙、骑士打败魔兽的故事时，可不会说绝对的力量差。上次那个小公鸡一样的奴隶被和我差不多高的家伙揍时，可没人对他说不要还手，还有人在他打输之后偷偷给他支招哩……原来你们和那些男奴隶之间的绝对力量差，比物种之间的差异还要大啊。”", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 42 反叛者", "x": "所有人都被鼓励拥有力量，只有你们，只有你们被鼓励懦弱，只有你们希望变成最没用的懦夫！", "y": "", "d": "2025-08-28"}, {"k": "t", "c": "Chapter 42 反叛者", "x": "所有人都被鼓励拥有力量，只有你们，只有你们被鼓励懦弱，只有你们希望变成最没用的懦夫！", "y": "力量（无论是身体上的、经济上的还是精神上的）本身就是权力，鼓励你放弃力量，本质上就是剥夺你的权力，让你无法成为自己命运的主导者，从而必须依附于拥有权力的其他人。\n拒绝这种规训，去追求力量，知识的力量、经济的力量、身体的力量！", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 43 卡喀亚", "x": "9433说：“我喜欢弱小、柔弱、纤细的男人，最好能被我一拳打死。”", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 43 卡喀亚", "x": "然而，与此同时，她一直在期待，期待能看到弱小的光芒汇集起来，反击那些绝对的力量。\n她一次次燃起希望，又一次次失望。\n跪下的人太多了。\n愚蠢的人太多了。\n她哀叹她们的不幸、凄惨，又憎恨她们的无知与软弱。可她终究无法与她们脱离。她终究对她们怀抱期待。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 44 沟通", "x": "沉浸在痛苦中也会让人产生一种自怜的快感，但如果所有的互助都仅限于互舔伤口、互相拉扯，如果我们止于这一步，那最终大家还是会在沼泽里打滚儿，我们还是会陷下去。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 44 沟通", "x": "我们经历过的苦难应该成为我们脱离沼泽的力量，我们应该歌颂的永远不是苦难，而是克服那些苦难、看清现实、走出困境的勇气。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 44 沟通", "x": "无论是陷在沼泽中品味苦难还是用自我厌恶来“赎罪”，都会令人止步不前，只有往前走、向上爬，掀翻困难的源头，才能脱离那片令她们痛苦的沼泽。", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 44 沟通", "x": "“我们大女人就是这样的。”", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 44 沟通", "x": "当敌人想要捂住你的嘴的时候，就说明你说中了他的痛处，能对他造成打击", "y": "", "d": "2025-08-28"}, {"k": "h", "c": "Chapter 47 老巫婆", "x": "而周围所有的女人无论原来多么灵动、聪慧，年纪大了以后，都会变得趋同，她们的脸上总是带着一种麻木的疲倦，总是不自觉地抱怨自己的丈夫和孩子，总是喋喋不休地诉说自己对家庭的付出，总是对年轻的女孩指指点点，忧心她们勾走自己男人的魂。", "y": "", "d": "2025-08-30"}, {"k": "h", "c": "Chapter 47 老巫婆", "x": "人们总对年轻的姑娘说“珍惜现在的年华吧，趁早找个好人家，等你年纪大了就没人要了”，又对年长的女人说“你都这个岁数了，不再年轻，也不再美丽了，不被男人喜欢不是很正常的吗”“照顾好丈夫和孩子吧，这才是你最该去做的事”。", "y": "", "d": "2025-08-30"}, {"k": "h", "c": "Chapter 47 老巫婆", "x": "似乎她们不是一个人，而是一朵花，人们一边歌颂花朵的美丽，一边惋惜花期的短暂。当短暂的花期过去，这朵花就失去了观赏价值，再也吸引不到别人的视线，只有成为肥料才能得到称赞。", "y": "", "d": "2025-08-30"}, {"k": "h", "c": "Chapter 48 母亲", "x": "海拉坐在不远处的树后，听着她们的故事，心中充满怨恨。\n她们总是说同样的问题，总是处于同样的困境。\n一次又一次，一次又一次。", "y": "", "d": "2025-08-30"}, {"k": "h", "c": "Chapter 48 母亲", "x": "令人同情，令人疲惫，令人厌烦，令人……憎恶！\n为什么你们总要求助于女巫，为什么你们不能自己动手？\n为什么你们拥有一模一样的人生，却永远都不知道改正？", "y": "", "d": "2025-08-30"}, {"k": "t", "c": "全书想法", "x": "", "y": "今年读到的最喜欢的故事，绝佳的女性主义入门读物。希望女孩们都能像莉莉丝一样，保持这份“厌烦”的清醒，用实际行动去建造我们心中那个更好的世界。\n🧙‍♀️🌱", "d": "2025-08-30"}]}, {"id": "3300059686", "title": "夜晚的潜水艇", "author": "陈春成", "cats": ["文学-经典作品"], "bmCount": 33, "rvCount": 1, "notes": [{"k": "h", "c": "封面", "x": "瑰奇飘扬的想象、温厚清幽的笔法，在现实与幻境间辟开若干条秘密的通道", "y": "", "d": "2026-09-15"}, {"k": "h", "c": "封面", "x": "感知体内的星云旋动、草木蔓发", "y": "", "d": "2026-09-24"}, {"k": "h", "c": "夜晚的潜水艇", "x": "老房间的旧床实在是太好睡了。随便一个睡姿里，都重叠着以往时光里无数个我的同一姿态。从小到大，一层套一层，像俄罗斯套娃一样。我觉得格外充实，安适，床是柔软的湖面，我静悄悄沉下去，在这秋日的午后。", "y": "", "d": "2026-09-24"}, {"k": "h", "c": "夜晚的潜水艇", "x": "父母喊我吃晚饭的声音，好像从遥远的岁月里传来。穿衣服时，我依然无法相信自己已经三十岁了。", "y": "", "d": "2023-12-10"}, {"k": "h", "c": "夜晚的潜水艇", "x": "我开始苦不堪言地练指法，黑键白键在我眼中一会变成熊猫，一会变成企鹅。最后我觉得自己在给斑马挠痒痒。", "y": "", "d": "2026-09-24"}, {"k": "h", "c": "夜晚的潜水艇", "x": "我能在莲蓬里睡觉，到云端游泳，在黑板上行走，追踪墨水瓶里的蓝鲸，我能一边挨老师的骂一边在太空里漂浮，谁也管不着我，谁也捉不住我。无数个世界任凭我随意出入，而这世界只是其中的一个罢了。", "y": "", "d": "2026-09-24"}, {"k": "h", "c": "夜晚的潜水艇", "x": "幸福感在被窝里油然而生。仿佛鸟栖树，鱼潜渊，一切稳妥又安宁，夜晚这才真正地降临。门都关好了，家闭合起来，像个坚实的果壳。", "y": "", "d": "2026-10-02"}, {"k": "h", "c": "夜晚的潜水艇", "x": "妙蛙种子问：种子种子？（今晚这么晚？）我说，久等了，出发吧！那晚我们在北冰洋的冰层下潜行。", "y": "", "d": "2026-10-02"}, {"k": "h", "c": "夜晚的潜水艇", "x": "高考、就业、结婚、买房，这些概念从来都漂浮在我的宇宙之外，从这时起，才一个接一个地坠落在我跟前，像灼热的陨石。", "y": "", "d": "2026-10-02"}, {"k": "h", "c": "竹峰寺", "x": "一个念头搁久了，往上添加了种种想象，那就非实现不可了，", "y": "", "d": "2026-10-06"}, {"k": "h", "c": "竹峰寺", "x": "银河从天顶流过，像一道淡淡的流云，风吹不散。", "y": "", "d": "2023-12-10"}, {"k": "h", "c": "竹峰寺", "x": "四处一逛，风景皆殊，我真切地感觉到世事如梦。一切皆非我有。没什么恒久之物。其实在城市中生活，我早已习惯如此，每天到处都在增删一些事物，涂涂改改，没个定数。有什么喜欢的景致，只当一期一会，不倾注过多感情，也就易于洒脱，没了就没了。", "y": "", "d": "2023-12-10"}, {"k": "h", "c": "竹峰寺", "x": "我总希望一切事物都按既定的秩序运行下去，不喜欢骤然的变更。我知道这是一种强迫症，毫无办法。", "y": "", "d": "2026-10-06"}, {"k": "h", "c": "竹峰寺", "x": "相似的经历有许多次，似乎是在为老屋的消失而预先演练，让我好接受一些。", "y": "", "d": "2026-10-06"}, {"k": "h", "c": "竹峰寺", "x": "我想世上也许并不存在对人人管用的经文，要调伏各自的心性，每个人有每个人的偏方。", "y": "", "d": "2026-10-06"}, {"k": "h", "c": "竹峰寺", "x": "宗教的庄穆和生命的华美，于刹那间，相互契合，彼此辉映，想来是极其动人。", "y": "", "d": "2026-10-08"}, {"k": "h", "c": "竹峰寺", "x": "对什么都心不在焉，游离于现实之外。", "y": "", "d": "2026-10-08"}, {"k": "h", "c": "竹峰寺", "x": "很难再回到真实的人世间，捡起上进心，努力去做一个世俗的成功者了。因为你已经知道了，在山野中，在天一点一点黑下来的时刻，一切都无关紧要。知道了就没法再不知道。", "y": "", "d": "2026-10-08"}, {"k": "h", "c": "竹峰寺", "x": "我恍恍惚惚，又想起我的钥匙来。我想到日光此时正映照溪面，将一些波光水影投在那碑上，光的涟漪在字迹上回荡，在青苔上回荡，青苔在一点一点滋长，里边藏着我的钥匙，钥匙里藏着老屋和故乡，那里一切安然不动。就这么想着，我一路走下山去，不知何时会回来。", "y": "", "d": "2026-10-08"}, {"k": "t", "c": "竹峰寺", "x": "我恍恍惚惚，又想起我的钥匙来。我想到日光此时正映照溪面，将一些波光水影投在那碑上，光的涟漪在字迹上回荡，在青苔上回荡，青苔在一点一点滋长，里边藏着我的钥匙，钥匙里藏着老屋和故乡，那里一切安然不动。就这么想着，我一路走下山去，不知何时会回来。", "y": "喜欢这个故事，读得我好幸福🎋", "d": "2026-10-08"}, {"k": "h", "c": "传彩笔", "x": "但他的文笔尤其好，能看出对文字的温情和耐心，我一度很喜欢看。", "y": "", "d": "2026-10-11"}, {"k": "h", "c": "传彩笔", "x": "这些年来，我已逐渐接受有许多事物无法用文字来形容这一事实。美景当前，人所能做的只有平静地收下这份美，连同那种无力感，试图付诸笔墨，多半是徒劳。", "y": "", "d": "2026-10-11"}, {"k": "h", "c": "传彩笔", "x": "对宇宙而言，任何形容词都无效，宇宙既不美也不丑", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "我试图立足于有限的时间里，来用文字笼络住无穷的空间。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "散文的美在于舒展与流动，像云气和水波", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "文字纷纷扬扬从天而降，我像在雪中舞剑，总能在万千雪花中击中最恰当的一朵。当我要使用比喻时，我仿佛洞晓了万物之间隐秘的联系，凭一个比喻就能将彼此接通。所有意象都蹲伏在肘边，听我号令。斟酌音韵就像编织花环一样容易。我熔铸月光，裁剪浮云，掣长鲸于碧海，我统治天上的星星……", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "这狂喜无人可以分享，直到拖垮成一种疲倦。写作诚然能带来最澎湃的快乐，但他人的认同能让这份快乐变得确切，从滔天的浪涛变成可以珍藏的珠玉。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "我有一种终于抵达的倦意", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "他们都有可能曾经拥有，正拥有，或将要拥有那支笔，在无人知道的地方书写各自的杰作。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "传彩笔", "x": "黑暗中，它们自顾自地璀璨。我把本子放在枕下，临睡前摩挲一番，枕着我几乎就要拥有的整个宇宙，然后坠入日常的，琐碎的梦中。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "裁云记", "x": "我并非想成为学者，只想找一处深渊供我沉溺。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "裁云记", "x": "我不知道哪个最适合我，又无法逐一尝试。选择其一，就意味着放弃了无穷减一种可能性。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "裁云记", "x": "我可以花上一百年在远古的深海潜行，一百年去追踪建文帝，再花个几世纪去死磕永动机，剩下的时间我将在所有洞穴间从容游荡。", "y": "", "d": "2026-10-12"}, {"k": "h", "c": "裁云记", "x": "如果掉进某个陷阱，那就死心塌地，一往无前。", "y": "", "d": "2026-10-12"}]}, {"id": "855799", "title": "当尼采哭泣", "author": "[美]欧文·亚隆", "cats": ["精品小说-治愈小说", "心理-心理学应用", "精品小说-影视原著"], "bmCount": 34, "rvCount": 0, "notes": [{"k": "h", "c": "第四章", "x": "一个是有血有肉的尼采，一个是字里行间的尼采，两者间的差距与布雷尔一次次地正面冲撞。", "y": "", "d": "2023-02-07"}, {"k": "h", "c": "第五章", "x": "阴霾的天空让他沮丧，乌云或落雨让他无精打采，干燥让他活力充沛，冬天代表一种精神上的“破伤风”形态，阳光则再度让他活跃。多年来，他的生活就是寻求完美的气候。夏天还可以忍受，恩加丁万里无云、平静无风、阳光普照的高地适合他，每年有四个月，他居住在瑞士小村落锡尔斯玛丽亚的小客栈里。不过，冬天是一种诅咒。他从来找不到一个适合冬季居住的地点，在寒冷的月份中，他住在意大利南方，从一个城市移到另一个，以找寻有益健康的气候。维也纳的气流与潮湿忧郁的气氛在毒害他，尼采如是说，为了要求阳光与干燥、宁静的空气，他的神经系统在大声抗议着。", "y": "", "d": "2023-02-07"}, {"k": "h", "c": "第五章", "x": "我是一只乌龟，把家扛在背上。", "y": "", "d": "2023-02-07"}, {"k": "h", "c": "第八章", "x": "是的，我应该赞美我的病痛，赞美它。作为一位心理学家，个人的痛苦是一种福气——面对存在苦难的一个训练场。", "y": "", "d": "2023-02-14"}, {"k": "h", "c": "第十二章", "x": "绝望是人为自觉所支付的代价。看进生命的深处，你总是会找到绝望。", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十三章", "x": "巅峰，生命攀升的顶峰！但是巅峰的问题就在于，它们代表每况愈下。从峰顶，我可以一眼看遍我的余生匍匐脚下，而且，这个景色并不让我感到愉快。我所看到的只有衰老、名声不再、成为父亲、成为祖父。”", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十三章", "x": "一个人在40岁时对事情的感受，是一个人在25岁时所无法了解的。", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十四章", "x": "一、普遍的不快乐；二、被外来的念头所纠缠；三、自我憎恨；四、恐惧衰老；五、恐惧死亡；六、自杀的冲动。", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十四章", "x": "人永远无法真正从他人得到帮助，人必须要找出帮助自己的力量。", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十四章", "x": "这些没有价值的念头如何侵袭并盘踞了你的心神", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十五章", "x": "我认识许多不喜欢他们自己的人，而试图矫正这点的方法，是先去说服别人对他有好感。一旦做到了那点，他们接下来就开始对他们自己有好感。但这是一种虚假的解决，这是依从他人的权威。你的目标是认同你自己，不是去找出方法来获得我的认同。", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十五章", "x": "精神竞技场", "y": "", "d": "2023-02-15"}, {"k": "h", "c": "第十六章", "x": "我遽然了解到生命最平淡无奇的事实，时间是不可逆的，我的生命正在逐渐枯竭。当然，我以前就知道这点，但是，在40岁时领悟它是一种不同的领悟。", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第十六章", "x": "看看你所学到的东西，约瑟夫，时间无法被中断，意志无法逆行。只有幸运的人才会捕捉到这种洞见！", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第十六章", "x": "我得知了死亡正在迫近，知晓到我的无能与不足，了解生命没有真正的目的或价值，而你却称此为幸运！", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第十七章", "x": "最好的真理，他始终这么说，是从一个人自身生命体验中破茧而出的血淋淋的真理。", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第十七章", "x": "人要原谅自己的朋友，比原谅自己的敌人还困难。", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第十八章", "x": "在理智上知道某事与情感上接受某事之间，有一个鸿沟——一个巨大的鸿沟。当我晚上清醒地躺在床上害怕死亡时，我常常对自己背诵卢克莱修的格言：‘死亡所至，我不在彼。我之所在，死亡不至。’它真是无比的理性与无可辩驳的真实。但是当我真的在害怕时，它从来就没有用，它从未平复我的恐惧。这就是哲学无法达到的所在。教导哲学，在生活中使用哲学，这是非常不同的两码事。", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第十九章", "x": "我喜爱一种活生生的哲学！我喜爱一种从原始的经验所雕塑出来的哲学。", "y": "", "d": "2023-02-16"}, {"k": "h", "c": "第二十章", "x": "活着的时候就去追求人生！如果人在实现了他的生命之后死去，死亡就丧失了它的可怕！如果一个人生不逢时，那他就永远不会死得其所。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十章", "x": "“你用问题来回答问题，弗里德里希！”\n“你问你知道答案的问题。”尼采还击说。\n“如果我知道了答案，我为何还要问呢？”\n“为了避免知道你自己的答案！”", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十章", "x": "我们可以永远谈下去，但是我无法改变我的生活，它被人生的千丝万缕缠得太紧了。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十章", "x": "“约瑟夫，试着去清理你的思绪。想象这个思想实验！如果有个恶魔对你说，这个人生，你现在与过去所过的生活，你将必须再经历一次，而且是无限次数地再三反复，而且，里面不会有任何新的东西，一切痛苦与欢乐，你生命中一切难以言喻的大小事情，都会重新回到你身上，全部以相同的顺序与因果关系——这阵风与那些树，那块让你失足的泥岩，那墓地与恐惧，这温馨的一刻，你跟我把臂细语着这些话。如果这一切将再三反复，你会怎么样？”", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十章", "x": "每一个我做的行动，每一种我经历的痛苦，将会在整个无限之中被经验到？", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十章", "x": "如果你没有完成你自己，那‘责任’不过是为了你的自我放大而利用他人的婉转说法罢了。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十章", "x": "“婚姻生活是神圣的。然而”尼采的声音非常严厉，“毁掉婚姻总好过被它所毁！”", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "“我不像你。在我的选择奴役了他人时，我无法去选择自由。你有没有想过，你的自由对我意味的是什么？一个寡妇或者一个弃妇，又有哪些种类的选择呢？”\n“你是自由的，就像我一样。你年轻、富有、迷人又健康。”", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "“我无法告诉你如何去变得自由，玛蒂尔德。我不能为你设计你的道路，因为，那样子就不再是你的道路了。不过，如果你有这种勇气，我确信你可以找出那条路来。”", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "终于有个了断了，他觉得。终于有事情降临到我身上了，某种真实的事情，不只是念头而已，而是某种现实世界中的事情。一次又一次的，我想象着这个场景。现在，我感受到它了！现在，我知道掌握我的命运是像什么样子。它很可怕，又很美妙。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "现在，趁着我还能看能走的时候，我应该为了我自己，而把握我生命中的一小部分，这样的要求过分吗？我对服务是如此厌倦，对照顾他人是如此厌烦。没错，弗里德里希是对的。我应该永远忍耐着责任重担的奴役吗？我应该在永恒之中，从头到尾都过一种我会后悔的生活吗？", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "出于需要而生产孩子是错的，错的是利用孩子来缓和寂寞，错的是借口复制另一个自我来提供生命的目的。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "它们没有一个为了它们的存在而需要我。我是偶然的，可以随时替换。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十一章", "x": "许多威尼斯当地人转头看着他。当他在一间商店橱窗的反射光里捕捉到他自己的形象时，他终于了解到原因所在：长须、帽子、大衣、西装、领带——全部是不讨人喜欢的黑色。他看起来像外国人，完全就像一个老去的富有维也纳犹太医生！昨晚在火车站，他注意到成群结队的意大利妓女在拉客。没有一个接近他，毋庸置疑！胡子与葬礼般的衣服必须舍弃。\n他的计划缓慢成型：首先，先造访一个理发师与劳工阶级的服装店。然后他会开始上密集的意大利语课程。或许在两三个星期之后，他可以着手钻研餐饮业：威尼斯可能需要一家优秀的奥地利餐厅，或甚至是奥地利犹太式的餐厅——他在散步时，看到了几个犹太教会。", "y": "", "d": "2023-02-17"}, {"k": "h", "c": "第二十二章", "x": "让我知道了生活愉快的关键，在于先去选择必要的东西，然后去热爱所选择的东西。", "y": "", "d": "2023-02-17"}]}, {"id": "3300181368", "title": "1984", "author": "[英]乔治·奥威尔", "cats": ["文学-外国文学", "文学-经典作品"], "bmCount": 32, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 打倒老大哥", "x": "战争即和平\n自由即奴役\n无知即力量", "y": "", "d": "2026-03-15"}, {"k": "h", "c": "第一章 打倒老大哥", "x": "他突然想到，这日记为谁而写？为将来，为后代。", "y": "", "d": "2026-03-15"}, {"k": "h", "c": "第二章 思想有罪", "x": "有个坐在他身边的人在他经过时说：“我们将在没有黑暗的地方见面。”", "y": "", "d": "2026-03-15"}, {"k": "h", "c": "第四章 扔进记忆洞", "x": "持续不断的篡改", "y": "", "d": "2026-03-15"}, {"k": "h", "c": "第四章 扔进记忆洞", "x": "每一天，甚至每一分钟，过去都被改得与现在一致无二。如此，党的每一则预言都有文献证明是正确的，凡是与当前需要相抵触的，无论是新闻或发表的意见，都不允许留有记录。所有的历史都是重写本，只要有需要，随时可以擦干净彻底重写。此行为一旦完成，就再无可能证明发生过任何篡改之事。", "y": "", "d": "2026-03-15"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "但是，就在刚才那一瞬间，仅仅数百人的吼声听上去已十分骇人！可她们为什么不在重要的事情上也这般怒吼呢？", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "除非他们觉醒，否则永不反抗；除非他们反抗，否则永不觉醒。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "只要他们不停地劳作、繁衍，其他行为都无关紧要。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "他们在贫民窟出生、长大，十二岁出去做工，而后度过一段情窦初开、美好却短暂的青春期，二十岁结婚，三十岁已到中年，大多数人活到六十岁就死去了。繁重的体力劳动、养家糊口、为一点鸡毛蒜皮的小事与邻居争吵、电影、足球、啤酒，尤其是赌博，这就是他们全部的世界。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "无产者并不需要强烈的政治意识，要求他们拥有的只是最原始的爱国初心，在需要他们延长工作时间、减少定量供应时可以随时被唤起。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "甚至在他们觉得不满时，有时候他们的确如此，这些不满也不会造成什么后果。由于缺乏全局观念，他们只关注细枝末节上的不满，那些罪大恶极之事，他们却总是视而不见。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "他们不配被怀疑，正如党的标语所示：“无产者和动物是自由的。”", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "你如何判断这其中有多少是谎言呢？如今普通人的生活水平比革命前提高了，这也许属实。唯一相反的证据，是来自你骨子里的无声抗议。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "过去不仅被篡改，而且被持续篡改着。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第七章 希望就在无产者身上", "x": "所谓自由，就是可以说二加二等于四的自由。若此成立，其余同理。", "y": "", "d": "2026-03-17"}, {"k": "h", "c": "第八章 杂货铺子", "x": "这是他们人生的乐趣，愚蠢的证据，止痛的灵丹和大脑的兴奋剂。", "y": "", "d": "2026-03-18"}, {"k": "h", "c": "第八章 杂货铺子", "x": "他们微如蝼蚁，只顾眼前琐屑，对重大事件无法放眼长量。在记忆失效而文字记录又被伪造的时代——当这一切发生的时候，党声称人们的生活水平已得到提高，你就只能接受，因为没有可以用来检验的标准，它们现在不存在，将来也永远不可能存在。", "y": "", "d": "2026-03-18"}, {"k": "h", "c": "第八章 杂货铺子", "x": "独自一人，安然无恙。没有人来监视你，也没有声音来纠缠你，除了水壶烧水的吱吱声和时钟悦耳的滴答声。", "y": "", "d": "2026-03-18"}, {"k": "h", "c": "第一章 神秘纸条", "x": "此后的一周，生活就像一场令人坐立不安的梦境。", "y": "", "d": "2026-03-19"}, {"k": "h", "c": "第三章 林中幽会", "x": "你想过快活日子，而“他们”，也就是党，偏不让你快活，你只能尽你所能去打破这些规矩。", "y": "", "d": "2026-03-20"}, {"k": "h", "c": "第三章 林中幽会", "x": "如果你内心愉悦，凭什么要为老大哥、三年计划、两分钟仇恨会以及他们所有其他该死的鬼玩意儿激动？", "y": "", "d": "2026-03-20"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "温斯顿累得快成一块凝胶了。凝胶是个贴切的词，它自动浮现在他的脑海中。他的身体不仅像凝胶般瘫软，而且也呈半透明状。他觉得如果把手举起来，他能看到光线透过来。高强度的工作把他的浑身血肉都已榨干，只剩下一副由神经、骨骼和皮肤所支撑的脆弱身架。", "y": "", "d": "2026-03-31"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "毫无疑问，可以设想有这样一个社会，在个人财产和奢侈品方面，财富平均分配，而权力仍集中在享受特权的少数人手里。但事实上，这样的社会不可能保持长期稳定。因为如果人人都能享受悠闲舒适、高枕无忧的生活，那么以前因贫困而麻木无知的民众就会读书识字，学会独立思考。学会这些后，他们早晚会意识到，特权阶层的那些人毫无作为，就会将之清除。从长远来看，等级社会只有建立在贫穷和无知的基础上，才有可能存在。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "上等阶层的目标是保住他们现有的地位，中等阶层的目标是和上等阶层调换地位，下等阶层，如果他们还有目标——因为他们饱受谋生之苦，偶尔才会顾及日常生活之外的事情，这已成为他们永久的特征——就是要消灭一切差异，创建一个人人平等的社会。因此，纵观整部历史，类似的斗争总是一次次重复上演。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "但无论是财富的增长、举止的温和、改革或革命，都未曾使人类接近平等一小步。从下等阶层的视角看，历史的变更至多意味着主宰者更名而已。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "不平等乃人类生活永恒不变的法则。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "以前，中等阶层的人总是打着平等的旗号闹革命，然后当旧的专制一旦被推翻，马上建立起新的专制。而新的中等阶层在革命前就已宣布要实行专制。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "早在二十世纪初期，人人平等在技术上已成为可能", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "不平等是文明的代价", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "第二种危险也仅仅是理论上的危险。民众从来都不会自发造反，更不会因为自身受到压迫而造反。确实，只要不让他们掌握比较的标准，他们永远都不会意识到自己正在遭受压迫。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "党所关心的不是血脉的传承，而是自身的永恒。谁来掌权并不重要，重要的是等级结构永远保持不变。", "y": "", "d": "2026-04-01"}, {"k": "h", "c": "第九章 闭门读禁书", "x": "只需放任自流，他们便会一代接一代，一个世纪又一个世纪地工作、繁衍与死亡。他们不仅没有丝毫造反的冲动，而且也无法理解世界可以变成另外一个天地。", "y": "", "d": "2026-04-01"}]}, {"id": "814146", "title": "一个叫欧维的男人决定去死（同名电影原著）", "author": "弗雷德里克·巴克曼", "cats": ["精品小说-治愈小说", "精品小说-影视原著", "文学-经典作品"], "bmCount": 32, "rvCount": 0, "notes": [{"k": "h", "c": "4 一个叫欧维的男人不交三克朗增值税", "x": "“你不在家，一个人整天在这房子里转悠一点都不自然。我就想说这些。这日子没法过了。”", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "5 一个叫欧维的男人", "x": "她是色彩，他的全部色彩。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "5 一个叫欧维的男人", "x": "他对童年几乎没有任何记忆。没人欺负他，他也不欺负人，体育不算好也不算差，他从来不参与却也从来不逃离，只是简单地存在着。关于成长，他也没有太多记忆。他不是那种把所有无关紧要的事都记在脑子里的人。他记得他曾经挺快乐", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "5 一个叫欧维的男人", "x": "他从来不知道为什么，但也从来不需要面面俱到地理解每一件事。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "5 一个叫欧维的男人", "x": "拥有的不多，但也从来不少。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "5 一个叫欧维的男人", "x": "人们总说欧维眼里的世界非黑即白，而她是色彩，他的全部色彩。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "7 一个叫欧维的男人挂上个钩子", "x": "失去某人以后总是会有一些奇怪的细节惹人怀念。都是极小的事情。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "7 一个叫欧维的男人挂上个钩子", "x": "他无力地坐在凳子上呼吸沉重。手颤抖得就像置身冰窟。胸口怦然。最近总是这样。他感觉透不过气来，就像一条鱼被人倒扣在碗里。公司医务室的医生说这是慢性病，让他不要激动。说起来容易。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "8 一个叫欧维的男人和一对父亲的老脚印", "x": "十六岁时父母双亡是件奇怪的事。在失去这个家庭之后，还要等很久，才能自己组建一个家庭来取代它。这是一种非常特别的孤独。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "8 一个叫欧维的男人和一对父亲的老脚印", "x": "出乎意料，他发现自己喜欢工作。工作带来某种自由。脚踏实地自食其力。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "8 一个叫欧维的男人和一对父亲的老脚印", "x": "“一个人的品质是由他的行为决定的，而不是他说的话。”", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "10 一个叫欧维的男人造了一幢房子", "x": "日复一日，欧维出门上班，然后下班回家吃香肠土豆。他从不寂寞，但也从来没人陪伴。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "11 一个叫欧维的男人和那个不从梯子上掉下来就开不了窗的盲流", "x": "今年第一场像样的雪像一张冰冷的毯子裹住昏昏沉沉的排屋小区。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "11 一个叫欧维的男人和那个不从梯子上掉下来就开不了窗的盲流", "x": "生活不应该是现在这个样子，这就是他现在所有的感受。努力工作，自食其力，节衣缩食，买了第一辆萨博；接受教育，通过考试，应聘面试，拿到体面的工作，感恩，从不生病，按时缴税；洁身自好；邂逅一个女人，结婚；努力工作，升职；买一辆新型号的萨博；去银行，贷一笔还款年限为五年的款，买座太太觉得适合养育下一代的排屋；分期还款；节衣缩食；买新萨博；去饭店里播放外国音乐的地方度假，喝太太认为别具异国风味的红酒；然后回家继续工作，承担责任，自食其力，洁身自好。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "11 一个叫欧维的男人和那个不从梯子上掉下来就开不了窗的盲流", "x": "好似这就是现在生活的意义：勇往直前。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "11 一个叫欧维的男人和那个不从梯子上掉下来就开不了窗的盲流", "x": "“祝你今天愉快！”", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "12 一个叫欧维的男人有所获", "x": "她只爱抽象的东西，音乐、书籍、奇言怪语，诸如此类。欧维却是个满脑子充满具象事物的人。他喜欢螺丝刀和滤油器。他手插口袋疾步人生。她总是在舞蹈。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "12 一个叫欧维的男人有所获", "x": "“只需要一缕阳光就能驱赶所有的阴霾。”一次，他问她为什么总是那么兴高采烈的时候，她说。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "14 一个叫欧维的男人和一个火车上的女人", "x": "从来没人问过欧维遇见她之前他是怎么生活的。但要是有人问起，他一定会回答说自己没有生活。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "14 一个叫欧维的男人和一个火车上的女人", "x": "要是有人问起，他会说，在她之前，他没有生活。之后也没有。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "18 一个叫欧维的男人和一只叫恩斯特的猫", "x": "“现在你得加倍爱我。”她要求道。\n于是欧维对她撒了谎，说他会的。尽管他心里很清楚，他已经不可能比现在更爱她了。", "y": "", "d": "2020-06-30"}, {"k": "h", "c": "21 一个叫欧维的男人和那些饭馆里播放异国音乐的国家", "x": "但每次那个开饭馆的西班牙小男人一见到欧维，就殷勤地张开双臂大声吆喝“犀牛萨博！”的时候，索雅都笑得冒泡泡。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "21 一个叫欧维的男人和那些饭馆里播放异国音乐的国家", "x": "从西班牙回家的大巴上，她把欧维的手放在自己肚子上，他第一次感觉到孩子在蹬腿。很轻很轻，就像有人隔着很厚的烤箱手套捅他的掌心。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "23 一个叫欧维的男人和一辆一去不返的公车", "x": "之后，突然一阵寂静。就像时间自己深吸了一口气。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "30 一个叫欧维的男人和一个没有他的社会", "x": "他只是喜欢循规蹈矩，仅此而已。凡事都该有个规律，让人有据可循。他不理解这怎么就成了缺点。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "31 一个叫欧维的男人挂着拖斗倒车。又来了。", "x": "他们都拥有同样空洞的眼神，就好像他们只是一些到处破坏别人生活的行尸走肉。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "33 一个叫欧维的男人和一次非比寻常的巡逻", "x": "对于时间，所有人都太乐观。我们相信总能腾出时间来与他人一起做想做的事，说想说的话。然后突然有一天，发生了什么意外，我们就只好站在那儿，脑海总盘旋着一个词：如果。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "36 一个叫欧维的男人和一杯威士忌", "x": "“爱上一个人就像搬进一座房子，”索雅曾说，“一开始你会爱上新的一切，陶醉于拥有它的每一个清晨，就好像害怕会有人突然冲进房门指出这是个错误，你根本不该住得那么好。但经年累月房子的外墙开始陈旧，木板七翘八裂，你会因为它本该完美的不完美而渐渐不再那么爱它。然后你渐渐谙熟所有的破绽和瑕疵。天冷的时候，如何避免钥匙卡在锁孔里；哪块地板踩上去的时候容易弯曲；怎么打开一扇橱门又恰好可以不让它嘎吱作响。这些都是会赋予你归属感的小秘密。”", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "39 一个叫欧维的男人和死神", "x": "死亡是一桩奇怪的事情。人们终其一生都在假装它并不存在，尽管这是生命的最大动机之一。我们其中一些人有足够时间认识死亡，他们得以活得更努力、更执着、更壮烈。有些人却要等到它真正逼近时才意识到它的反义词有多美好。另一些人深受其困扰，在它宣布到来之前就早早地坐进等候室。我们害怕它，但我们更害怕它发生在身边的人身上。对死亡最大的恐惧，在于它与我们擦肩而过，留下我们独自一人。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "39 一个叫欧维的男人和死神", "x": "人们总是说欧维刻薄。欧维一点都不刻薄，他只是不会嬉皮笑脸罢了。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "39 一个叫欧维的男人和死神", "x": "时间是一桩奇怪的事情。大多数人只为了未来生活。", "y": "", "d": "2020-07-01"}, {"k": "h", "c": "39 一个叫欧维的男人和死神", "x": "每个人一生中最恼人的那一刻可能就是突然意识到自己已经到了回忆比展望更多的年龄。当来日无多的时候，必须有别的动力让人活下去。或许是回忆。午后的阳光中牵着某人的手，鲜花绽放的花坛，周日的咖啡馆。或许是孙子孙女。人们为了别人的未来继续生活。", "y": "", "d": "2020-07-01"}]}, {"id": "3300203076", "title": "她对此感到厌烦3", "author": "妚鹤", "cats": ["精品小说-女性小说"], "bmCount": 25, "rvCount": 1, "notes": [{"k": "h", "c": "Chapter52 计谋", "x": "辛西娅公主，您如此勇猛，简直不像个女人’。", "y": "", "d": "2026-05-02"}, {"k": "h", "c": "Chapter52 计谋", "x": "“当然，”莉莉丝答道，“这是个很适合我们的游戏。”", "y": "", "d": "2026-05-02"}, {"k": "h", "c": "Chapter54 通恩之战", "x": "我希望，我、我的同伴、我们的女儿和女儿的女儿，都能生活在更好的世界，成长成能够为自己感到自豪的人。", "y": "", "d": "2026-05-05"}, {"k": "h", "c": "Chapter54 通恩之战", "x": "我只是有那么一点，那么一点点……\n想看看那个崭新的世界……", "y": "", "d": "2026-05-05"}, {"k": "h", "c": "Chapter55 驱逐", "x": "眼泪再次涌了出来，思薇法又轻轻地握了握自己的手。\n那只手曾经被潘妮握住，也曾经握住过罗莎，可现在，没有任何姐妹握住她的手。", "y": "", "d": "2026- "x": "“你可以靠自己的智慧和劳动生活下去！”", "y": "", "d": "2025-08-12"}, {"k": "h", "c": "Chapter 5 勇气", "x": "“她能幸福吧？”\n“她有那个能力，”莉莉丝笑道，“如果她想，一定可以的。”", "y": "", "d": "2025-08-12"}, {"k": "h", "c": "Chapter 6 舞会", "x": "当在意一个东西的时候，它才会有价值。\n否则，它毫无价值。", "y": "", "d": "2025-08-12"}, {"k": "h", "c": "Chapter 7 净化", "x": "“太过强势、太过聪明的女人只会让男人望而却步，莉莉丝，”阿博特公爵笑道，“善良、柔弱和愚蠢才是女人的财富。”", "y": "", "d": "2025-08-12"}, {"k": "h", "c": "Chapter 9 真相", "x": "“在男人的故事里，他们费尽千辛万苦，打败恶龙，赢得恶龙的财富和美丽的公主，成为国王的夫婿，最终成为国王。男人渴望赢得名声、财富、美人、权力，女人却只希望赢得一颗不知道何时会变的心。”", "y": "", "d": "2025-08-13"}, {"k": "h", "c": "Chapter 9 真相", "x": "“活成一个知足的行尸走肉，和其他人没有区别，头脑空空，然后继续告诉新的信徒‘大家都是这样的，你要相信神，会有奇迹的’，但她们明明盼望着神拯救自己，结果最后自己却活成了菩萨。", "y": "", "d": "2025-08-13"}, {"k": "h", "c": "Chapter 15 交易", "x": "当一个国家的所有人都认为裹脚是美，一个女孩子从小到大接收到的信息也都是如此，那么，当她说出‘裹脚很美’的时候，要怎么证明这是她对美的天然追求，而不是被扭曲的审美洗脑了呢？当被打压或失权的女人们可以通过社会认定的‘美’获得称赞、利益和优越感的时候，她们当然会这么做，哪怕这件事伤害了她的身体，浪费了她的时间和金钱，即使这件事无法真正地提升她的思想与灵魂，她们也会甘之如饴。毕竟，当周围所有人都穿着同样的衣服，拥有同样的审美和观念，并且默认做同样的事情时，她很难独善其身。", "y": "", "d": "2025-08-16"}, {"k": "h", "c": "Chapter 16 测试", "x": "没有王子来救她。\n没有神明显灵。\n只有她自己——虚弱的自己、无助的自己，不知道该何去何从、茫然又懦弱的自己……\n所以，不能奢望别人的拯救！", "y": "", "d": "2025-08-16"}, {"k": "h", "c": "Chapter 19 新年舞会", "x": "智慧果一旦被吃下，就再也无法被吐出来，它会在你的脑子里生根发芽。", "y": "", "d": "2025-08-17"}, {"k": "h", "c": "Chapter 19 新年舞会", "x": "她们分明可以成为自己世界的主人公，但她们像是在躲避什么、逃避什么一样，跳脱出来，选择当一个安全、轻松的旁观者，观察莉莉丝的生活，感受她的情绪，幻想她的喜怒哀乐并因此牵动情绪。有种无形的枷锁禁锢着她们，而那些被禁锢、被抑制的情感又化成期待，转移到别人身上。", "y": "", "d": "2025-08-17"}, {"k": "h", "c": "Chapter 23 猎物", "x": "我们现在的处境确实很被动，但并不算是陷入了绝境，放弃才会陷入真正的绝境。", "y": "", "d": "2025-08-19"}, {"k": "h", "c": "Chapter 23 猎物", "x": "无论何时，人都不应该放弃思考和怀疑。", "y": "", "d": "2025-08-19"}, {"k": "h", "c": "Chapter 24 入狱", "x": "真好笑啊，你们平时说着女人柔弱，无法战斗的话，所以收起她们的武器，拔掉她们的獠牙，磨掉她们的斗志，断绝她们学习的途径，然后嘲笑她们柔弱与愚蠢。而当女人可以战斗，可以学习的时候，你们又打着为她们好的名义，想把她们赶回家。", "y": "", "d": "2025-08-20"}, {"k": "h", "c": "Chapter 25 她们是我", "x": "“所以，逃离伊甸园吧，莉莉丝！”", "y": "", "d": "2025-08-20"}, {"k": "h", "c": "Chapter 25 她们是我", "x": "我们就打碎它，冲出去！创造一个属于我们的世界！", "y": "", "d": "2025-08-20"}, {"k": "h", "c": "Chapter 25 她们是我", "x": "而且我们还能做得更多，我们还要做得更多", "y": "", "d": "2025-08-20"}]}, {"id": "3300046359", "title": "暮色将尽", "author": "[英]戴安娜·阿西尔", "cats": ["文学-外国文学", "文学-散文杂著", "文学-经典作品"], "bmCount": 24, "rvCount": 1, "notes": [{"k": "h", "c": "导言", "x": "虽然我有时会为自己在工作中的能力有限而感到羞愧，但我认为，个人生活比工作更重要，我并不为这个理念而感到羞愧——这是每个人都应该做的", "y": "", "d": "2025-01-10"}, {"k": "h", "c": "导言", "x": "工作中的阿西尔是理性克制的", "y": "", "d": "2025-01-10"}, {"k": "h", "c": "导言", "x": "生活中的她则洒脱而随性", "y": "", "d": "2025-01-10"}, {"k": "h", "c": "导言", "x": "是那个时代极少数清醒而坚定地以践行自我为人生首位的女性。", "y": "", "d": "2025-01-10"}, {"k": "h", "c": "导言", "x": "阿西尔在年轻时经历过两次浪漫爱情之后，便基本确立了自己独身主义的生活方式——“我对男人没有期待。唯有独处时，我才真正感到完整。”", "y": "", "d": "2024-02-17"}, {"k": "h", "c": "导言", "x": "她依然相信自己能成为一个好母亲，但对于失去这个机会，她却不得不承认，自己并不介意。她坦承自己的自私与懒惰，并说这两项或许是她人生的憾事，但她并不为此感到自责，​“止于此就行了吧，因为天天看着不好的一面是相当无聊的事", "y": "", "d": "2025-01-10"}, {"k": "h", "c": "导言", "x": "阿西尔的人生为我们展现了一个独特的女性样本，她既有艺术家一般开放自由、洒脱丰沛的心胸，又有冷静克制甚至出于务实而进行一定妥协的理智", "y": "", "d": "2025-01-10"}, {"k": "h", "c": "导言", "x": "我们能看到，在20世纪动荡的欧洲，一个普通的知识分子女性，是怎样在与世界的周旋中安全生存下来，并维护好自己的精神世界的。", "y": "", "d": "2024-02-17"}, {"k": "h", "c": "第二章", "x": "如此看来，我在成年阶段并不是没有意识到从身体角度，男人其实很容易对女人不忠。当然从保罗抛弃我的事件开始，我也才认识到女人其实也能不谈爱，仅仅因性就可以燃烧。我后来从保罗事件中“恢复”过来，又谈了两次恋爱，都很深切，都很“致命”，好像这样的命运无法避免，而且无论经历如何，我依然渴望，但这却是注定要带来痛苦的东西。", "y": "", "d": "2024-02-17"}, {"k": "h", "c": "第二章", "x": "人应该说话算数，这我同意，但如果在性事上也天天盘旋纠结忠诚问题，就有些无聊了。妻子对丈夫必须绝对忠实，这一信念有着深刻的、盘根错节的古老起源。不仅因为男人需要确认自己真是孩子他爹，在更深入、更黑暗的内核中，还有一种男人占有女人，上帝是为了让“他”方便才创造了“她”的含义在其中。", "y": "", "d": "2024-02-17"}, {"k": "h", "c": "第二章", "x": "而女人吵吵嚷嚷、万分焦虑地想要丈夫对她忠诚，也是缘于同样原始而古老的根源，就是她必须以此证明自己的生存价值。", "y": "", "d": "2024-02-17"}, {"k": "h", "c": "第二章", "x": "有些东西，比如性的不忠，如果不被发现，确实不会造成什么伤害；还有些人，就算知道了也能接受。到底人们会采取什么态度回应，完全取决于不同个体及其所处的具体环境。", "y": "", "d": "2024-02-17"}, {"k": "h", "c": "第四章", "x": "不管我们对此了解多少，它就是这个样子，以人们眼里最美丽的样子，永恒地反射着太阳的光辉。而我们的生命，这一纯粹的事实，其自身难道不也是无比神秘和令人激动的吗？", "y": "", "d": "2023-04-20"}, {"k": "h", "c": "第五章", "x": "无处回避、近在咫尺的终点", "y": "", "d": "2023-04-30"}, {"k": "h", "c": "第五章", "x": "我这辈子从来挣钱也不多，没什么积蓄", "y": "", "d": "2025-01-12"}, {"k": "h", "c": "第六章", "x": "但不得不向还没有享受够的生活说再见，却让他深感悲哀。", "y": "", "d": "2023-06-05"}, {"k": "h", "c": "第六章", "x": "这种悲哀，对我来说，是经历了很好或至少惬意生活的证明，值得让人心存感激，当然，前提是它没被过早地斩断。", "y": "", "d": "2023-06-05"}, {"k": "h", "c": "第六章", "x": "如果我的那一刻来临，或许也会有一点点这样悲哀的感受，希望我能记得这不过是一个人为自己享受过的东西付出的代价而已。", "y": "", "d": "2023-06-05"}, {"k": "h", "c": "第六章", "x": "幸运的是，如果一个景象太过于灰暗，人的脑子往往会本能地拒绝想象。也不是刻意不想，而是无法想。不管会发生什么，都必须经历，所以有什么大惊小怪的？现在，我已周密评估了自己对死亡的态度，看起来也就是这样了吧。最后的悲惨岁月，大概几周或几个月（希望不是几年！）无法照顾自己，这种日子如此不快，怎么度过又有什么关系。", "y": "", "d": "2023-06-05"}, {"k": "h", "c": "第七章", "x": "仅仅因为自己正在逐渐变糟，我们就倾向于确信一切都变得不好，越来越不能做喜欢的事情，听的越来越少，看的越来越少，吃的越来越少，受伤越来越多，朋友逐一死去，明白自己也将不久于人世……所以也许这不足为奇，我们确实很容易滑入生活的悲观主义，但这种状态实在很无聊，而且让沉闷的最后时日更加沉闷。但反过来想，如果我们能突破自己感知的局限，知道有些人的生活才刚刚开始，对他们来说前面的路很长，充满了谁知道会怎样的未来，这就是一个提醒。实际上这真的能让我们再次感受，并意识到自己并不是朝着虚无延伸的黑色细线末端的小点，而是生命这条宽阔多彩河流的一部分。这条河流，充满了开端、成熟、腐朽和新生，我们是其中的一部分，我们的死亡也是其中的一部分，如同孩子们的青春一样，所以在还能够体会这一切之时，别浪费时间生闷气了！", "y": "", "d": "2023-06-05"}, {"k": "h", "c": "第十三章", "x": "我在一生中，从未像现在这样舒服地、长久地享受过自己", "y": "", "d": "2025-01-14"}, {"k": "h", "c": "第十五章", "x": "生命是美丽的，如此美丽。而一个人越老，就越能察觉到这一点。当你老了，你思考，你记忆，你关切，你明了。你因为一切而深怀感激，为一切。", "y": "", "d": "2023-06-06"}, {"k": "h", "c": "第十六章", "x": "就这样吧，我最后想说的话是，“没关系，不必担心未知”", "y": "", "d": "2023-06-06"}, {"k": "h", "c": "译后记", "x": "为什么大部分人都如此害怕死亡，却又鲜少珍惜生命呢？", "y": "", "d": "2023-06-06"}, {"k": "t", "c": "全书想法", "x": "", "y": "认真去过每个阶段，观察它，接受它，舒服地、长久地享受自己。", "d": "2023-06-06"}]}, {"id": "41287028", "title": "美丽新世界", "author": "阿道司·赫胥黎", "cats": ["文学-外国文学", "精品小说-社会小说"], "bmCount": 23, "rvCount": 1, "notes": [{"k": "h", "c": "第二章", "x": "于是元首决定取消人们对大自然的热爱，至少取消低种姓人对大自然的热爱。取消对大自然的热爱，但不取消人们对交通工具的利用。因为，尽管人们讨厌去乡村，可他们还是得继续乘交通工具，这一点非常重要。", "y": "", "d": "2026-04-15"}, {"k": "h", "c": "第三章", "x": "爆发了基于良心的大规模反对行为。反对任何消费。回归自然。", "y": "", "d": "2026-04-16"}, {"k": "h", "c": "第三章", "x": "兔子洞：这个短语出自《爱丽丝漫游奇境记》，爱丽丝掉进兔子洞然后进入了仙境，后用于比喻进入未知的世界。", "y": "", "d": "2026-04-16"}, {"k": "h", "c": "第四章", "x": "硕大的云朵，就像神奇运动员的粗犷身体一样，在他们头顶上方的蓝天中懒洋洋地卷舒着。", "y": "", "d": "2026-04-17"}, {"k": "h", "c": "第六章", "x": "香水龙头的小小黑色指针在他脑海中转动着，就像一只虫子，一点点蚕食着时间", "y": "", "d": "2026-04-23"}, {"k": "h", "c": "第六章", "x": "五分钟后，他感觉历史与未来就如根茎与果实，现在它们均消失了，只有当下如玫瑰，盛开着美丽的花朵。", "y": "", "d": "2026-04-24"}, {"k": "h", "c": "第八章", "x": "他的心好像消失了，只剩下了一个空洞。他感觉空空的。心空空荡荡，又冷冷冰冰", "y": "", "d": "2026-04-26"}, {"k": "h", "c": "第八章", "x": "他手腕上的伤口还在流血。每隔几秒钟就有一滴血滴落下来，黑黑的一片，在死一般的月光下，看起来几乎像是无色的。一滴，一滴，一滴。明天，明天，明天……\n他发现了时间、死亡和上帝。", "y": "", "d": "2026-04-26"}, {"k": "h", "c": "第八章", "x": "“哦，美丽的新世界。”", "y": "", "d": "2026-04-26"}, {"k": "h", "c": "第十二章", "x": "我宁愿不开心，也不愿意拥有你们现在这种虚伪的、靠说谎得来的幸福。", "y": "", "d": "2026-04-29"}, {"k": "h", "c": "第十四章", "x": "她的声音突然衰弱至极，变成了一种几乎听不清的窒息似的沙哑声音。她张着嘴，拼命想让空气进入肺部。可是她好像已经忘掉了怎样呼吸。她想叫出来，可是没法发出声音。", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "第十四章", "x": "她再也不能呼吸空气了，对她来说，空气已经不复存在。", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "第十六章", "x": "因为我们的世界与《奥赛罗》的世界不一样。没有钢铁，你怎能造出汽车。假如社会不是动荡不安，你又怎能写出悲剧。可是现在是太平盛世，人民过着幸福的生活，人们想要什么就有什么，得不到的东西他们不想要。他们很富裕。他们安居乐业。他们从不生病。他们不怕死亡。他们幸福到不知激情与衰老为何物；他们没有父母，所以不会受到父母的干扰。他们没有妻子，没有孩子，没有爱人，所以他们不会动感情。经过条件反射设定后，他们的处境好得很，他们只要规规矩矩按设定行事就好了。要是出了什么问题，还可以用嗦麻解决哩", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "第十六章", "x": "穆斯塔法·蒙德说：​“最适宜的人种比例，是采用冰山模式—九分之八的低等种姓在水平面以下，九分之一的高等种姓在水平面以上。​”", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "第十六章", "x": "艰辛？他们可不觉得艰辛。相反，他们喜欢这种工作。这种工作很轻松，简单至极。身体和灵魂都不会紧张。每天毫不费劲地工作七个半小时，然后有定量的嗦麻配给，有游戏可玩，还有无限制的性爱和感官电影。他们夫复何求？​”他补充道，​“诚然，他们或许会要求缩短工作时间。当然，我们可以缩短他们的工作时间。从技术上讲，把所有低等种姓的工作时间缩减到每天三四个小时，这是非常简单的事。可他们会因此而变得更幸福吗？不会，他们不会的。", "y": "", "d": "2026-04-30"}, {"k": "t", "c": "第十六章", "x": "艰辛？他们可不觉得艰辛。相反，他们喜欢这种工作。这种工作很轻松，简单至极。身体和灵魂都不会紧张。每天毫不费劲地工作七个半小时，然后有定量的嗦麻配给，有游戏可玩，还有无限制的性爱和感官电影。他们夫复何求？​”他补充道，​“诚然，他们或许会要求缩短工作时间。当然，我们可以缩短他们的工作时间。从技术上讲，把所有低等种姓的工作时间缩减到每天三四个小时，这是非常简单的事。可他们会因此而变得更幸福吗？不会，他们不会的。", "y": "大多数人自愿拥抱的温柔乡", "d": "2026-04-30"}, {"k": "h", "c": "第十七章", "x": "一个天地万物都无法囊括其梦想的人", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "第十七章", "x": "假若你遭遇了不测，发生了什么不幸的话，没有问题，你还可以吞服嗦麻嘛，嗦麻总会让你忘掉所有的不快，平息自己的愤怒，让自己与敌人和解，让自己平静地忍受痛苦。换成过去，你只能通过努力和多年的道德规训才能做到这些。可是现在，一个人只需要吞服两到三片半克的嗦麻药片，一切就都万事大吉了。现在，任何人都可以做到品行端正。现在，至少有一半人是泡在嗦麻瓶子里死去的。这就是嗦麻，一种不需要流眼泪的基督教。​”", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "译后记", "x": "高种姓的精英管理阶层通过试管孵化、条件反射设定、催眠洗脑教育等种种科学方法，严格控制各种姓的喜好，让每一个种群每天都幸福快乐地去工作、生活、消费。是的，每一个人都很幸福，以至于他们幸福到不知道“不幸福”为何物：他们所有的物质要求都能够得到保障，他们所有的欲望都能够被嗦麻等药物满足，他们的身体绝对健康，青春永驻。这是一个没有战争、没有核武器、没有疾病的世界，无人受伤害，邪恶并不凸显。事实上，这是一个人人得到满足的幸福的社会。在这个没有沮丧、疯狂和压抑的社会，却没有艺术、诗歌，没有莎士比亚，更没有“爱情”这种危险的东西，人们可以多情滥交，尽情放纵……", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "译后记", "x": "多么幸福啊！可是，别忘了，人们的幸福是出生后的“被幸福”，他们的一生全都是被设定的，人们实际上已沦为拥有奴隶幸福的幸福奴隶。真正的精英元首则高高在上，一边嘲笑，一边安稳地控制着制度内的人，一遇到对现状产生怀疑或叛逆心态的子民，就会将其视为不安定因素并流放到边远的岛屿。", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "译后记", "x": "奥威尔警告人们将会受到外来压迫的奴役，而赫胥黎则认为，人们会渐渐爱上压迫，崇拜那些使他们丧失思考能力的工业技术。", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "译后记", "x": "奥威尔害怕的是那些强行禁书的人，赫胥黎担心的是失去任何禁书的理由，因为再也没有人愿意读书；奥威尔害怕的是那些剥夺我们信息的人，赫胥黎担心的是人们在汪洋如海的信息中日益变得被动和自私；奥威尔害怕的是真理被隐瞒，赫胥黎担心的是真理被淹没在无聊烦琐的世事中；奥威尔害怕的是我们的文化成为受制文化，赫胥黎担心的是我们的文化成为充满感官刺激、欲望和无规则游戏的庸俗文化。", "y": "", "d": "2026-04-30"}, {"k": "h", "c": "译后记", "x": "奥威尔担心我们憎恨的东西会毁掉我们，而赫胥黎担心的是，我们将毁于我们热爱的东西。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "译后记", "x": "对“美丽新世界”我们似乎只能接受，因为一个人能够抵御痛苦，但却不能抵御幸福。", "y": "", "d": "2026-05-01"}]}, {"id": "3300047438", "title": "局外人（译文经典）", "author": "[法]阿尔贝·加缪", "cats": ["精品小说-社会小说", "文学-经典作品", "文学-世界名著"], "bmCount": 23, "rvCount": 1, "notes": [{"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "一个淡然超脱、与世无争、本分守己的小职员", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "淡然、不在乎的生活态度", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "夸张与过分是喜剧所需要的成分，而蕴藏，敛聚、深刻才是悲剧的风格", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "初到巴黎后的那种“陌生感”、“异己感”，“我不是这里的人，也不是别处的。世界只是一片陌生的景物，我的精神在此无依无靠。一切与己无关”", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "把纷纭复杂、五光十色、气象万千的人的生存状况概括、凝现为西西弗斯推石上山、永不停歇但却劳而无功的这样一个图景", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "人生而必死、劳而无功，这是“上帝已经死了”、宗教已经破灭、人没有彼岸天堂可以期待之后的一种悲观绝望的人生观，在这种人生观的理解范围里，现实世界对人来说只是人匆匆而过的异乡。这种人生观无疑带有浓重的悲观主义与虚无主义的色彩，然而，面对着生而必死、劳而无功的生存荒诞，却又推石上山、虽巨石反复坠落山下、却仍周而复始、推石上山、永不停歇，这无疑又是一曲壮烈、悲怆的赞歌", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "大悲大悯的情怀", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "深刻隽永的描述", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "他求生的愿望、刑前的绝望、对司法不公正的愤愤不平、对死亡的达观与无奈、对宗教谎言的轻蔑、对眼前这位神父的厌烦以及长久监禁生活所郁积起来的焦躁都混合在一起，像火山一样爆发，迸射出像熔岩一样灼热的语言之流，使人得以看到他平时那冷漠的“地壳”下的“地核”状态。", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "他根据自己的经验与所见所闻，深知“世人活着不胜其烦”“几千年来活法都是这个样子”，对人类生存状况的尴尬与无奈有清醒的意识，他甚至质问道：“他这个也判了死刑的神父，他懂吗。”", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "剥去了生生死死问题上一切浪漫的、感伤的、悲喜的、夸张的感情饰物，而保持了最冷静不过、看起来是冷漠而无动于衷的情态", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "《局外人》的社会现实内涵与人性内涵", "x": "“荒诞——反抗”的哲理体系", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "第一部", "x": "今天，妈妈死了。也许是在昨天，我搞不清。", "y": "", "d": "2025-04-02"}, {"k": "t", "c": "第一部", "x": "今天，妈妈死了。也许是在昨天，我搞不清。", "y": "很抓人的开头，荒诞之感尽显。", "d": "2025-04-02"}, {"k": "h", "c": "第一部", "x": "我因特别喜欢喝牛奶咖啡，也就接受了他的建议。", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "第一部", "x": "在他们的脸上，使我大为惊奇的一个特点是：不见眼睛，但见一大堆皱纹之中有那么一点昏浊的亮光。", "y": "", "d": "2025-04-02"}, {"k": "h", "c": "四", "x": "我把窗户大大敞开，感受着夏夜在我们的棕色皮肤上流走，真是妙不可言。", "y": "", "d": "2025-04-03"}, {"k": "h", "c": "五", "x": "他就问我是否不大愿意改变改变生活，我回答说，人们永远也无法改变生活，什么样的生活都差不多，而我在这里的生活并不使我厌烦。", "y": "", "d": "2025-04-03"}, {"k": "h", "c": "二", "x": "我常想，如果要我住在一棵枯树的树干里，什么事都不能做，只能抬头望望天空的流云，日复一日，我逐渐也会习惯的，我会等待着鸟儿阵阵飞起，云彩聚散飘忽", "y": "", "d": "2025-04-03"}, {"k": "h", "c": "二", "x": "这是妈妈的思维方式，她常这么自宽自解，说到头来人什么都能习惯。", "y": "", "d": "2025-04-03"}, {"k": "h", "c": "二", "x": "日子，过起来当然就长，但是拖拖拉拉，日复一日，年复一年，最后就混淆成了一片。", "y": "", "d": "2025-04-03"}, {"k": "h", "c": "三", "x": "塞莱斯特朝我转过身来，我觉得他眼里闪出泪光，嘴唇颤抖哆嗦，那样子好像在问我他还能尽些什么力。我呢，我什么也没有说，也没有做任何表示，但我生平第一次产生了想要去拥抱一个男人的想法。", "y": "", "d": "2025-04-03"}, {"k": "h", "c": "五", "x": "世人都知道，活着不胜其烦，颇不值得。我不是不知道三十岁死或七十岁死，区别不大，因为不论是哪种情况，其他的男人与其他的女人就这么活着，活法几千年来都是这个样子。", "y": "", "d": "2025-04-04"}, {"k": "h", "c": "五", "x": "现在我面对着这个充满了星光与默示的夜，第一次向这个冷漠的世界敞开了我的心扉。", "y": "", "d": "2025-04-04"}]}, {"id": "23507714", "title": "我的遥远的清平湾（插图版）", "author": "史铁生", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 23, "rvCount": 0, "notes": [{"k": "h", "c": "我的遥远的清平湾", "x": "我们那地方突出的特点是穷，穷山穷水，“好光景”永远是“受苦人”的一种盼望。", "y": "", "d": "2024-10-23"}, {"k": "h", "c": "我的遥远的清平湾", "x": "她仰着小脸儿，望着天上的星星；北京的神秘，对她来说，不亚于那道银河。", "y": "", "d": "2024-10-23"}, {"k": "h", "c": "二", "x": "无边的黄土连着天。起伏绵延的山群，像一只只巨大的恐龙伏卧着，用光秃秃的脊背没日没夜地驮着落日、驮着星光。河水吃够了泥土，流得沉重、艰辛。只在半崖上默默地生着几丛葛针、狼牙刺，也都蒙满黄尘。天地沉寂，原始一样的荒凉", "y": "", "d": "2024-10-29"}, {"k": "h", "c": "四", "x": "感情常常影响了记忆。冷静下来便想起本不是那么回事。", "y": "", "d": "2024-10-29"}, {"k": "h", "c": "四", "x": "我总觉得好运气在等着我，总觉得有什么新鲜、美妙的事向我走近了。", "y": "", "d": "2024-10-29"}, {"k": "h", "c": "五", "x": "离别的味道，感到了一点儿人生的严肃", "y": "", "d": "2024-10-29"}, {"k": "h", "c": "六", "x": "人不知道被命运安排在哪儿，又不知道为什么被安排在那儿。", "y": "", "d": "2024-10-31"}, {"k": "h", "c": "七", "x": "阳光渐渐铺开，雾气也变得辉煌。", "y": "", "d": "2024-10-31"}, {"k": "h", "c": "七", "x": "母子俩都不再说话，望着窗外，窗外仿佛全是虚空。", "y": "", "d": "2024-10-31"}, {"k": "h", "c": "八", "x": "明娃却如一首梦幻曲，无声地在灶火前坐下，无声地往灶膛里添柴，瘦削的脸上光剩了眼睛，火光在那儿闪亮，又在那儿熄灭。", "y": "", "d": "2024-11-01"}, {"k": "h", "c": "十二", "x": "千山万壑都浸在月光里，像一张宽大无比的牛皮纸揉皱了，又铺展开。寂静的星辰挨着寂静的峰峦", "y": "", "d": "2024-11-05"}, {"k": "h", "c": "十二", "x": "清平河水夜里也不停歇，在月光下赶着路程。", "y": "", "d": "2024-11-05"}, {"k": "h", "c": "十三", "x": "都是在冬天，庄稼早都收光，漫山遍野是裸露的黄土，更显荒莽，幸而天是格外的蓝，格外深远。", "y": "", "d": "2024-11-05"}, {"k": "h", "c": "十四", "x": "夜晚，家家窑前吊一盏油灯，在漆黑的山间如一片朦胧的星光。", "y": "", "d": "2024-11-06"}, {"k": "h", "c": "十四", "x": "蓝天，黄土，地远天高。云彩的影子在山地上起伏赛跑，几座山峁忽地暗了，几座山峁骤然又辉煌灿烂。那时候你觉得，或许在这儿待一辈子也凑合吧？", "y": "", "d": "2024-11-06"}, {"k": "h", "c": "二十二", "x": "看着太阳升起来，变红，变白，变热，身后掏下的地已经不少；看着太阳落下去，变红，变大，变冷，眼前没有掏开的地似乎还那么多。", "y": "", "d": "2024-11-11"}, {"k": "h", "c": "二十二", "x": "忽然响起山歌，由弱渐强，优美二字不便形容。“咿哟喂——”“哟嗬嘞——”不过像全力挣扎中的呼喊，不过像疲劳寂寞时的长叹。也不太拘泥拍节，尤其起句和结束，可以任意拖长，大约依据山野的宽阔度而定，也可能依据心中愿望的焦灼度。歌声在天地间飘荡，沉重得像要把人间捧入天堂。其中有顽强也有祈望，顽强唱给自己，祈望是对着苍天。", "y": "", "d": "2024-11-11"}, {"k": "h", "c": "二十三", "x": "受惯了生活意外的掠夺", "y": "", "d": "2024-11-11"}, {"k": "h", "c": "二十五", "x": "白天，剩我一个人在家，站在阳台上，看见上班的人潮，看见下班的车流，看见退休的老人带着孙子在冬阳下散步，心想天底下确乎不只有一个世界……", "y": "", "d": "2024-11-11"}, {"k": "h", "c": "二十六", "x": "春夏一片绿色环绕，秋天色彩斑斓", "y": "", "d": "2024-11-11"}, {"k": "h", "c": "二十六", "x": "小彬干了一杯酒，说：“再找一个，好人有的是，没什么难办的。”\n“找谁？你们都成家了，只有他。”她说，“可他心里的那个目标，坚定不移。”徐悦悦显出美国式的开放和幽默，为了把心底的忧郁冲淡。\n大家说应该为徐悦悦干一杯，为她将来的好运，也为她不再像插队时那样是个‘极左分子’了。\n“谁是‘极左分子’? ！”她又跳起来。", "y": "", "d": "2024-11-13"}, {"k": "h", "c": "二十九", "x": "清平湾还是清平湾，在那偏僻的大山里，看着日出日落，做着一年四季的营生，过着自己的日子。", "y": "", "d": "2024-11-14"}, {"k": "h", "c": "三十七", "x": "清平河还是那么轻缓地流着，在村前“哗哗啦啦”地诉说着日月光阴。", "y": "", "d": "2024-11-17"}]}, {"id": "3300063478", "title": "埃莱娜·费兰特作品系列：被遗弃的日子", "author": "埃莱娜·费兰特", "cats": ["精品小说-女性小说", "个人成长-女性成长", "文学-外国文学"], "bmCount": 21, "rvCount": 0, "notes": [{"k": "h", "c": "2", "x": "我处心积虑，向他展示了一个深情女人的宽容和美德，来应对他任何幽暗的时刻、他的精神危机", "y": "", "d": "2026-07-10"}, {"k": "h", "c": "6", "x": "我来到窗前，感受着风吹着公园里的树木，吹动着幽暗的夜色，隐没在树冠中的路灯散发着斑驳的光。在那漫长的时刻，我像卫兵一样守护着痛苦，只有一些死去的语言陪伴着我。", "y": "", "d": "2026-07-10"}, {"k": "h", "c": "10", "x": "我意识到那瓶有毒的液体就像是我身体延伸出来的部分，是我内心仇恨的液化器。", "y": "", "d": "2026-07-12"}, {"k": "h", "c": "11", "x": "我感觉神经末梢快要从我的皮肤里冒出来了", "y": "", "d": "2026-07-12"}, {"k": "h", "c": "16", "x": "脑子要清醒，要有决心，死死抓住生活，要活着。", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "16", "x": "会赋予这个人各种意义", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "16", "x": "你赋予他各种绝对的美德，但实际上，他只是银样镴枪头", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "16", "x": "你不知道他是谁，他自己也不知道。我们都是偶然的产物。我们消耗时间，失去生命", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "16", "x": "只是有几块碎片从我的身体迸了出去，除此之外，我安然无恙。", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "17", "x": "我内心在经历动荡，非常强烈的痛苦。我的眼泪就像水晶的碎片，那是我长时间珍藏在秘密之所的水晶物品，现在因为那场动荡，它碎成了成千上万块，让人心痛。我感觉到眼睛、鼻子很疼，但我无法停下来。", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "18", "x": "时间是呼吸，今天轮到我", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "19", "x": "我觉得，美就是不停地抹去身体的物质性。我希望他能爱我的身体，忘记它是身体，具有身体的味道。美——我带着不安想——就是这种遗忘。", "y": "", "d": "2026-07-13"}, {"k": "h", "c": "24", "x": "我把自己的每部分紧紧抓住，恭喜你，奥尔加。虽然发生了那么多事，你还在这里，没有和我分开。", "y": "", "d": "2026-07-14"}, {"k": "h", "c": "30", "x": "紧紧抓住生活里剩下的碎片，就好像它们是拼起一幅画不可缺少的部分。", "y": "", "d": "2026-07-17"}, {"k": "h", "c": "32", "x": "它好像一下子变得灰暗，像个只剩下最后一口气的黯淡岛屿。", "y": "", "d": "2026-07-17"}, {"k": "h", "c": "32", "x": "炎热的天气像透明胶水，笼罩着周遭的一切。", "y": "", "d": "2026-07-18"}, {"k": "h", "c": "32", "x": "我怎么能听之任之，让我的感觉、活着的意义解体？", "y": "", "d": "2026-07-18"}, {"k": "h", "c": "40", "x": "空荡荡的一天很糟糕，夜幕降临时，这一天会像活结一样勒紧你的脖子。", "y": "", "d": "2026-07-20"}, {"k": "h", "c": "41", "x": "那就像一条绷直的绳子，把日子穿在一起，我在上面快速地滑过，没有心事，越来越熟练，表现出一种假装的平衡。", "y": "", "d": "2026-07-20"}, {"k": "h", "c": "42", "x": "痛苦已经提炼过了，让我有些无力，但没让我破碎。", "y": "", "d": "2026-07-20"}, {"k": "h", "c": "47", "x": "我想生活就是这样：一种按捺不住的喜悦，一阵剧烈的疼痛，一阵强烈的快感，血管在皮肤下猛烈地跳动，没有其他更真实的东西可以讲述。", "y": "", "d": "2026-07-21"}]}, {"id": "932127", "title": "忏悔录（译文名著精选）", "author": "[法]卢梭", "cats": ["文学-外国文学", "人物传记-传记综合"], "bmCount": 20, "rvCount": 0, "notes": [{"k": "h", "c": "译序", "x": "惊人的诚实、坦率的态度", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "译序", "x": "他历数了孩提时寄人篱下所受到的粗暴待遇，描写了他进入社会后所受到的虐待，以及他耳闻目睹的种种黑暗和不平，愤怒地揭露社会的“弱肉强食”、“强权即公理”以及统治阶级的丑恶腐朽。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "译序", "x": "卢梭在《忏悔录》中把自己赤裸裸地暴露在众人面前，说出他的隐私，道出他的隐情，以致到了最后，他简直被剥成一个精赤条条的人。所以，该书能成为法国天才作家所写的一部传世之作，也就是理所当然的了。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "译序", "x": "“我可以把自己的一生交给他们去从头至尾地进行批判：我坚信，人们总归会看到一个正直、善良、无怨无恨、与世无争的人，一个勇于承认自己的错误，而且更容易忘记别人过错的人，一个在爱恋温馨的激情之中寻找自己全部幸福的人，一个凡事都实心实意到了不谨慎，到了难以置信的忘我程度的人。”", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "译序", "x": "忏悔录》是列夫·托尔斯泰爱读的作品之一。他赞赏卢梭的诚挚与真实。他感到十分亲切的是卢梭的坦率，是卢梭对社会不公平的憎恨和对人的热爱。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "我在从事一项前无古人、后无来者的事业。我要把一个人的真实面目全部地展示在世人面前；此人便是我。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "我便是父亲归来后结下的不幸之果。十个月后，我出世了，先天不足，病病歪歪的；母亲因生我而死，所以我的出生是我所有不幸中的第一个不幸。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "这就是我的生身父母。在上苍赋予他们的所有品德中，唯一留给我的就是一颗温柔的心，这颗温柔的心铸就了他俩的幸福，却造成了我一生中的所有不幸。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "在我出世时，让我睁开眼的手，将在我死去时为我合上眼睛。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "这些有趣的书以及我们父子俩就这些书的谈论铸就了我那种自由的共和思想，那种不屈服的高傲性格，不愿意受到桎梏和奴役，使得我一生之中，在这种性格受到压抑之时，便痛苦万状。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "大家把这些脾性归之于天生的，但它们却完全是教育的结果。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "这就是我涉足人世时最初的情感：那颗既那么高傲又那么温柔的心，那种女性的但却难以驯服的性格，就这样开始在我身上形成或显现出来了；这种性格始终游移在懦弱和勇敢之间，游移在柔弱和刚毅之间，最后，使我自身矛盾重重，使得我节制和享受、快乐和审慎全都没能获得。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "整整两年里，我既没看见也没受到过粗暴的对待。一切都在我心中培育了受之自然的禀性。看见大家对我和一切事情都很满意，我真是快活极了。", "y": "", "d": "2024-04-22"}, {"k": "h", "c": "第一章", "x": "但我并没死心，我几乎深信，一旦回到这些亲切的地方，发现我那棵胡桃树还活着的话，我将用泪水来浇灌它。", "y": "", "d": "2024-04-30"}, {"k": "h", "c": "第一章", "x": "别在我身上寻觅吝啬人的怪癖，为了炫耀而花钱的怪癖；恰恰相反，我悄悄地花钱，而且是为了寻乐：我花钱不是为了摆谱儿，而是深藏不露。", "y": "", "d": "2024-05-14"}, {"k": "h", "c": "第一章", "x": "我崇尚自由。我憎恶窘迫、苦痛、寄人篱下。", "y": "", "d": "2024-05-14"}, {"k": "h", "c": "第一章", "x": "人们拥有的金钱是自由的工具；追逐的金钱则是奴役的工具。正因为如此，我才攥住金钱而又不贪婪金钱。", "y": "", "d": "2024-05-14"}, {"k": "h", "c": "第一章", "x": "当有机会痛痛快快地花钱的时候，人们也就不太管它用得是否值得了。", "y": "", "d": "2024-05-14"}, {"k": "h", "c": "第一章", "x": "从此以后，我便始终形单影只了。", "y": "", "d": "2024-05-14"}, {"k": "h", "c": "第一章", "x": "这种表面上极其愤世嫉俗、极其阴郁的禀性，实际上是源自一颗过分热烈、过分多情、过分温柔的心，因为找不到与自己相似的心，而不得不沉湎于空想。", "y": "", "d": "2024-05-14"}]}, {"id": "3300110579", "title": "如果世上不再有猫（川村元气作品系列）", "author": "[日]川村元气", "cats": ["精品小说-治愈小说", "文学-外国文学"], "bmCount": 18, "rvCount": 1, "notes": [{"k": "h", "c": "星期一 魔鬼找上门", "x": "这个世界上充斥着垃圾和不必要的东西", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期一 魔鬼找上门", "x": "人类在数万年的时间内，创造了无数废物，即使让某些东西消失，也不会造成任何人的困扰，世界反而可以变得更简单", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期一 魔鬼找上门", "x": "仔细想一下就会发现，这个世界上所有的东西都处于“可有可无”的边缘，搞不好人类本身也是如此。我们就是生活在这样乱七八糟的世界。", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期一 魔鬼找上门", "x": "如果电话从这个世界消失，我会得到什么？又将失去什么？", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期一 魔鬼找上门", "x": "朋友的名字一个接着一个出现，随即又消失了，这些人的名字仿佛变成了符号，我的通讯录被无数看似和我有关，但其实毫无关系的人淹没了", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "“想要有所得，就必有所失。​”", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "我厌恶沦为手机奴隶的自己。", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "我在朝阳下缓缓站了起来，听着收音机准备早餐。我泡了咖啡，煎了一个荷包蛋，烤了一片吐司，把番茄切片后放在装了土司的盘子里。吃完早餐后，喝着第二杯咖啡，悠然地看书。没有电话的生活太美好了，好像时间突然拉长，空间突然变宽了。", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "为什么人会期待他人做自己都无法做到的事？", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "“这个世界上有很多残酷的事，但也同样有很多美丽的事物。​”", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "我们借由电话，得到了可以立刻联络对方的方便性，却失去了思念、想象对方的时间，电话剥夺、蒸发了我们累积思念的时间。", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期二 如果电话从世界消失", "x": "这种游戏规则毫无意义", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期三 如果电影从世界消失", "x": "现在思考意义也没用了，意义并不重要。生存是一件美好而美妙的事", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期三 如果电影从世界消失", "x": "世界上有些东西是可有可无的", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期三 如果电影从世界消失", "x": "话说回来，因为我存在，电影才相对存在，所以，如果我没命了，一切都是枉然。因为如果我死了，根本无法享受电影的乐趣。", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期四 如果时钟从世界消失", "x": "以前不经意度过的时光变得弥足珍贵。我还可以和高丽菜散几次步？可以吃几次饭？可以和它一起迎接几个早晨的到来？在剩下的时间中，还可以听几次我最爱的那首曲子？还可以喝几次咖啡？还可以说几次“早安”​？还可以打几次喷嚏？还可以笑几次？", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期四 如果时钟从世界消失", "x": "珍惜每一次相处", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "星期六 如果我从世界消失", "x": "上帝想要知道的，并不是从世界上消失的那些东西的价值，而是我身为人类的价值。", "y": "", "d": "2024-12-20"}, {"k": "t", "c": "全书想法", "x": "", "y": "如果生命走到尽头，每让这个世界上消失一样东西，可以换取多活一天的机会，你愿意以什么交换？\n起初我以为这是一本让人反思自己与物品之间的关系的书，毕竟消费主义盛行的当下，没必要的东西实在是太多了，人类创造出无数废物，即使让很多东西消失，也不会造成我们的困扰，世界反而可以变得更好。\n如果巧克力消失，我想大多数人应该不会有异议；如果手机消失，我们不用再被手机奴役，时间似乎都会被拉长；如果电影消失，我们依然可以活下去，只是生活里有了很多寂寞；如果时钟消失，我们依然可以按照大自然的指示活着，毕竟时间只是人类创造出来的概念；如果猫从世界上消失呢？总是陪在你身边、柔软而又温暖、拥有你和家人宝贵回忆的猫从这个世界消失呢？看到这里我才意识到，有的东西意义重大，大到哪怕是用来交换延长生命的机会都让人无法抉择。\n原来这些抉择之中，体现的并不是东西的价值，而是我们身为人类的价值。\n其中最最感动的是妈妈留给主人公的那封信，在来日无多的时候，妈妈用写下主人公的十个优点，代替写“死前最想做的十件事”，并告诉他：“我希望你了解自己的这些优点，在你未来的人生中感到痛苦和悲伤时，仍然可以积极勇敢地走向明天。” 这里给我提供了一个很棒的送礼思路，可以写下 ta 的十个优点，送给你在意的人，告诉 ta：你拥有这些美好的品质，一定可以收获自己的幸福。这比送什么物品类的礼物都有意义吧。\n而在平常的日子里，珍惜每一次相处，和我们喜欢的东西，和我们在意的人。\n（冬至快乐 🥟", "d": "2024-12-21"}]}, {"id": "841402", "title": "悉达多", "author": "[德]赫尔曼·黑塞", "cats": ["精品小说-社会小说", "文学-经典作品"], "bmCount": 19, "rvCount": 0, "notes": [{"k": "h", "c": "婆罗门的儿子", "x": "他的眼睛映出光的影子。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "婆罗门的儿子", "x": "梦和不息的思潮，从河里，从夜间闪烁的星星，从太阳炽热的光线中源源不绝地向他袭来。他常常做梦，心灵常常不宁；这些梦和这种不宁从献祭的烟中升起，从《梨俱吠陀》￼的诗句中散发出来，从老婆罗门的讲道词中滴滴落下。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "婆罗门的儿子", "x": "他的杯子没有满，他的智怀没有饱，他的灵魂不安宁，他的心情不平静。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "婆罗门的儿子", "x": "他们研究过一切事情——世界之造成、语言之起源、食物、吸气吐气、器官之排列和诸神的行为。他们知道太多太多的事情。然而，如果他们偏偏不知道这件重要的事，这件唯一重要的事，那么，他们所知道的一切事情还值得知道吗？", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "沙门的生活", "x": "所有这一切都不值一瞥，样样都是假的，都散发着谎言的恶臭。虽然一切貌似充实、快乐和完美，然而一切到头来都注定要腐朽。世界弥漫着辛酸，人生充满了痛苦。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "沙门的生活", "x": "悉达多只有一个目标——变得空无：没有渴望、意愿、梦想、快乐和悲哀——让“我”死掉。不再有“我”，体味空无心灵的平静，体味纯洁的思想，那就是他的目标。\n当整个“我”被征服、死去，所有的激情和愿望都寂止了的时候，那最后的东西，那不再有“我”的人生奥妙——那大秘密，一定会苏醒。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "沙门的生活", "x": "我们寻找安慰，学习欺骗我们自己的法子，而那最根本的东西——那条路——我们却找不到。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "沙门的生活", "x": "世界令人悲观，人生之路艰难，可是在佛那里，似乎是有个新的希望，似乎有个充满了美好许诺的信息，温煦而又慰人。", "y": "", "d": "2023-02-20"}, {"k": "h", "c": "甘玛拉", "x": "不在这世界上寻求任何东西——怀着如此单纯、如此纯朴的心境去看的时候，这世界是美丽的，月亮和星星是美丽的，小溪、河岸、树林、岩石、山羊、金甲虫、花儿和蝴蝶都是美丽的。", "y": "", "d": "2023-02-21"}, {"k": "h", "c": "甘玛拉", "x": "心境如此纯朴，如此清醒，如此关怀眼前遇到的一切，不带任何怀疑，就这样活在这世界上是美好而愉快的事。有的地方，炎阳炙热；有的地方，林荫凉爽；有的地方，南瓜香蕉飘香。白天和黑夜都如此短暂，每一时
