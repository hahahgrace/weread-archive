愿什么事都不做，也不愿意温和地做事”​。[插图]波伏瓦有种特别的方式，能够把自己的记忆编织进信件里，将过去的时刻延续到当下。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "《第二性》出版那年，波伏瓦41岁", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "波伏瓦在《皮洛士与息涅阿斯》中写道，每个人都必须在世界上占有一席之地，但只有一部分人可以自由选择自己的位置。人类的处境是模棱两可的：我们既是主体又是客体。作为客体，你的世界被他人施加的约束所限制。作为主体，你的行为不仅实现了个人自由，还在世界上为他人创造了新的条件。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "在《第二性》的第一行，波伏瓦毫不掩饰她对“女人”这个话题的犹豫和恼怒。波伏瓦写道：​“在写一本关于女性的书之前，我犹豫了很久。但在过去的一个世纪里，有许多传统的长篇大论出版，它们哀悼女性气质的丧失，告诉女性必须“当一个女人，保持女人的状态，成为一个女人”——因此她再也不愿意被动接受、袖手旁观了。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "当波伏瓦审视历史时，她发现人类有一种习惯，那就是观察他人的身体，并根据他们的身体特征来建立等级制度，比如说奴隶制度。在种族问题上，大家也都认同这一点。但是，波伏瓦提出疑问：那么在性别问题上是怎样的呢？波伏瓦认为，男性将女性定义为“他者”​，并将她们归入另一个等级：第二性。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "人类有一种根深蒂固的倾向，即把自己与他人对立起来，因此男人把自己视为自由的“主体”​，而把女人定义为客体。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "波伏瓦希望女性获得自由。女性没有获得自由似乎只有两个可能的原因：要么是因为她们受到压迫，或者是因为女性选择不自由。不管是哪一种情况，都存在着一个道德问题——但究竟是谁的道德问题呢？", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "[插图]波伏瓦宣称“生物学不是命运”​，婚姻和生育也不是。波伏瓦指出，像居里夫人这样的女性证明了，并非“女性的天生劣等决定了她们在历史中的卑微地位，而是她们在历史中的卑微地位致使其没有成就”​。但是，不管地位高低，各种文化都在加强和巩固压迫女性的“神话”​。波伏瓦写道：​“女人不是一个固定的现实，而是一种成为的过程。她必须在与男人的比较中，找到她能成为的可能性。也就是说，当一个人考虑超越时，这就是一种有意识的、变化的、自由的存在，就没法结束。​”[插图]", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "共产主义记者珍妮特·普南特批判波伏瓦阻止了女性成为妻子和母亲。另一位女性评论家玛丽-路易丝·巴龙称《第二性》第一卷是“冗繁而难解的天书”​，并预言第二卷只会给读者提供“鸡毛蒜皮的东西”​。[插图]阿尔芒·胡格写道，波伏瓦真正想要解放的是她自己——作为一个女人，她感到屈辱，但“她生来就是个女人，我真的看不出她能改变什么……命运几乎不允许被否定”​。[插图]", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "波伏瓦认为社会沉浸在一种表里不一的集体自欺当中：整个社会蔑视女性，却同时尊重母亲。​“整个社会不让女性参与所有的公共活动，不让她们从事男性的职业，声称女性在所有领域都没有能力，但是社会却把最复杂最重要的任务——养育人类——托付给女性，这简直是一种充满罪恶的悖论。​”[插图]", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "波伏瓦认为，男人在爱情中仍然是“至高无上的主体”——他们追求心爱的女人，同时也追求其他的事物，爱情是他们一生中不可分割的一部分，但仅仅是一部分。相比之下，对女性而言，爱情被视为生命本身，爱情理想则鼓励女性为了所爱的人去自我牺牲甚至是完全忘却自我。男人在成长过程中被教导要积极主动地去爱，但同时也要有雄心壮志，并在其他领域有所作为。女人则被教导她们的价值是有条件的——她们必须被男人爱才有价值。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "通往真爱的障碍之一是，女性被物化得如此严重，以至于她们物化自己，试图认同自己心爱的男人，不断地追求他眼中的魅力。恋爱中的女人试着透过她所爱的人的眼睛去看，围绕着他去塑造她的世界和她自己：她读他喜欢的书，对他的艺术趣味、音乐、思想、朋友、政治观念等感兴趣。波伏瓦也反对性方面的不平等，她指出许多女人被当作男性享乐的“工具”​，女性的欲望和快感从来不在考虑的范围之内。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "一个不受欢迎但却更重要的观点：女性长期受压迫的很大原因是社会对女性身体的物化", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "她一次又一次地发现，理想化的女性必须是男性欲望的客体。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "那是失语的女性集体的吟唱：​“我究竟变成了什么？​”", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十二章 备受诽谤的《第二性》", "x": "波伏瓦指出男性哲学家们未能考虑到女性的身体，特别是女人在发现自己的身体被贬低成某种男性凝视的客体时所感受到的异化，这种男性凝视把女性的身体当作猎杀和拥有的“猎物”​，而不把女性看作一个处在成为过程中的人。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "在20世纪50年代，这本书是少数几本女性在想要思考自己在世界上的位置时可以求助的书籍之一。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "波伏瓦则兴致勃勃地计划着进行8个小时的徒步旅行。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "波伏瓦在阿姆斯特丹继续写小说", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "波伏瓦的作品“要求读者反思自己和自己的处境", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "波伏瓦几乎没来得及打开行李，就在9月初与萨特一起前往中国。他们在北京住了一个月，然后周游全国，波伏瓦和萨特都对中国人的生活充满了好奇。在这次旅行中，他们敏锐地察觉到自己的外国身份和特权：这里没有奢侈品，也没有人听说过他们。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "去意大利度过秋天", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "巴金的《家》里记述了一个家庭里的两个兄弟对待包办婚姻的态度，一个接受，另一个反抗；它被数以万计的人阅读，波伏瓦认为它“表达了整整一代人的怨恨和希望”。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "她开始着手于一些不一样的东西：“关于童年和青春的回忆录，不仅要讲述故事，还要试图解释清楚我是谁，我是如何成为我自己的，我与我生活的整个世界之间的关系。”", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "波伏瓦与个别读者的通信长达十年或更长时间，鼓励她们用自己的眼睛看世界，为自己的生活寻找有意义的事情", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十三章 再次面对爱情", "x": "靠自己释放出自由的光芒", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "即使是先驱者也要走很多弯路才能发现原来尽头是死胡同。", "y": "", "d": "2024-09-14"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "哲学都必须用生活去实践", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "她想要的是能够在真实的女性生活中带来具体改变的立法。", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "用文字来思考生活", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "波伏瓦发现她帮助了很多女性“意识到自我的存在和自己的处境”​。[插图]", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "波伏瓦说，至少现在女性可以“把自己作为观看的眼睛，一种主体，一种意识，一种自由”​。[插图]", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "懂得思考、懂得反省", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "波伏瓦认为自己的一生就是个例子，说明了存在主义选择意味着什么：没有上天来给出她应该是谁的“命令”​，没有既定的道路或伊壁鸠鲁式的教条让她偏离什么。相反，这是一个毫无蓝图的变化过程(becoming)——一个波伏瓦一生都在追求的项目", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十四章 感觉被欺骗了", "x": "在《第二性》中她发现了一个所有女性面对的共同挑战：成为“被分裂的主体”的可能性，女性作为爱人和母亲的自我和她们在更广阔的世界里想成为的自我之间的撕裂和挣扎", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "波伏瓦写道，她意识到母亲的身份是可以刻意选择的，她“意识到当人们需要孩子时孩子能带来的快乐”​。她说，她不想把自己的生活方式强加给所有女性，因为她是在“积极为她们争取自由：选择孕产、避孕或堕胎的自由”​。[插图]", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "但“没有父亲的孩子往往比父母不和的孩子更快乐", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "波伏瓦大胆地宣称，她支持把母职与婚姻分离开来：​“我支持废除家庭。​”这句话在断章取义的情况下，很好地迎合了反对波伏瓦的保守派和热衷人身攻击的读者，他们认为波伏瓦反母性，不女性化，甚至不女性主义了。但在同一段中，波伏瓦对“家庭”一词的定义是这样的：​“家庭是这个男权世界剥削女性的中介，每年从她们那里勒索数十亿个小时的‘隐形工作’。​”1955年，法国人花在有偿工作上的时间为430亿个小时，相比之下，在家里花在无偿工作上的时间为450亿个小时。[插图]", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "波伏瓦认为，女性是在外界影响下接受这项工作的，并认为这是自己的天命，因为谁都不会自然地接受自己的职业生活就是洗碗和洗衣服。波伏瓦说，女性必须找到更好的价值所在：人们之所以歌颂母亲，是因为母性能够让女人毫无怨言地待在家里做家务。他们没有告诉一个两岁、三岁或四岁的小女孩“你注定要去洗碗”​，而是告诉她“你注定要成为一个妈妈”​。人们给她布娃娃，歌颂母亲，所以当她长大后，她就会想到一件事：结婚生子。她坚信，如果没有孩子，她就不是一个完整的女人。但是对于男人却不是这样说的：没有人会对一个没有孩子的男人说“他不是一个真正的人”​。[插图]", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "波伏瓦认为男性对这种可能性的抵制源于恐惧——“害怕女性会发现并通过掌握自己的命运来重新获得她们在所有领域的自主权", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "汇集了波伏瓦对她所重视的事物的想法：写作、阅读、电影、政治、音乐、艺术、参与到世界中", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "波伏瓦继续以读书为乐，读书使她能够通过别人的眼睛看世界。", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十五章 老年", "x": "波伏瓦明确表示，她并没有否定男人——她拒绝将女权主义和厌男症混为一谈，", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十六章 风烛残年", "x": "波伏瓦为女权主义出版商提供资金支持，并向女性庇护所捐款", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "第十六章 风烛残年", "x": "每个人都必须在不知道未来的情况下生活——追寻一种无法提前知道答案的意义", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "后记：西蒙娜·德·波伏瓦将会成为什么？", "x": "波伏瓦可能是自己过去的人质，但她也是社会偏见的受害者；波伏瓦的生活证明了束缚女性发展的“女性状况”的双重标准的存在，特别是对敢于说真话的女性的惩罚——当女性成为“看的眼睛”时，当她们批判男性的行为并实话实说时，她们就会受到惩罚。", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "后记：西蒙娜·德·波伏瓦将会成为什么？", "x": "一个人可以既接近一个男人，同时也是一个女权主义者”[插图]。事实上，一个人可以接近很多人——男人们和女人们，同时还能做一个女权主义者。", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "后记：西蒙娜·德·波伏瓦将会成为什么？", "x": "[插图]的女性成功的象征。波伏瓦是20世纪女权主义的代表声音[插图]，她的思想很明显地改变了立法进程和许多人的生活。", "y": "", "d": "2024-09-16"}, {"k": "h", "c": "后记：西蒙娜·德·波伏瓦将会成为什么？", "x": "如果说我们能从西蒙娜·德·波伏瓦的生活中学到什么的话，那就是：没有人孤独地成为她自己。", "y": "", "d": "2024-09-16"}]}, {"id": "3300132901", "title": "清算已毕：波伏瓦自传", "author": "[法]西蒙娜·德·波伏瓦", "cats": ["人物传记-女性人物", "个人成长-女性成长"], "bmCount": 35, "rvCount": 2, "notes": [{"k": "h", "c": "第一章 我何以成为我", "x": "叙述就是用外延固化的句子取代流动的、模糊的经验。", "y": "", "d": "2025-06-20"}, {"k": "h", "c": "第一章 我何以成为我", "x": "有一个概念能充当我的叙事主线：幸运。", "y": "", "d": "2025-06-20"}, {"k": "h", "c": "第一章 我何以成为我", "x": "能确定的是，我对自己的命运非常满意，从不希望它是任何其他样子。推动我完成命运的因素，在我看来皆是幸运。", "y": "", "d": "2025-06-20"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我从不消极等待，而是主动去生活。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我相信幸运之星会保佑我，未来发生在我身上的必然是好事。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我能确定的是，我一定会走出困境。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我有扎扎、书籍、大自然和我自己的计划，这些对我来说足够了。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "读书、交友、旅行、继续发现新事物。我保持着对世界的关注。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我也宁愿失明：我想让自己相信，任何事情都不能动摇我的幸福，永远不能。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我也努力试着渡过难关", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "于是我打定主意，赌自己会有幸福的未来。", "y": "", "d": "2025-06-22"}, {"k": "t", "c": "第一章 我何以成为我", "x": "于是我打定主意，赌自己会有幸福的未来。", "y": "最近的切身经历让我觉得，宇宙或许真的有什么显化法则，相信就能实现。\n于是我也打定主意，赌自己会有幸福的人生！🤗", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "对存在的一切探索都注定失败，但我们大可坦然接受这一失败。放弃成为上帝的徒劳幻想，生存本身足以慰藉人心。知识并不意味着拥有，但我仍然孜孜不倦地学习。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "在人生之初就得到的种种机会，不仅使我拥有幸福的人生，也使我学会欣然接受生活。我了解自己的缺陷和不足，也懂得如何调整和适应。如果世界上发生的事撕扯折磨我，我会希望改变世界，而不是改变我在世界上的位置。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我永远生活在当下，而当下即永恒。我从来不相信未来。所以无论是二十岁还是五十岁，对我来说几乎是一回事。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我是很难被伤害的。假如别人的批评和指责说得不对，我会置若罔闻；假如说得对，我甘之如饴。", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "第一章 我何以成为我", "x": "我对自己负责", "y": "", "d": "2025-06-22"}, {"k": "h", "c": "2", "x": "我是一条轻快的溪流，障碍和石块并不能让它改道，只会让它变成欢乐的瀑布", "y": "", "d": "2025-06-24"}, {"k": "h", "c": "第二章 创造自己", "x": "未来远没有我预想的那么灰暗。", "y": "", "d": "2025-06-30"}, {"k": "h", "c": "2", "x": "在人生末年，就算进步也令人失望。也许是在前进，但步履蹒跚，也没有大幅超越过去的希望。不过，我保持描述世界和自己人生的欲望，不想放弃文学时而还会给我的那种令人兴奋的感觉：写作的过程就是在想象中创造自己。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "只有阅读以极其经济的方式——只需一卷书在手——在我与事物之间建立起新鲜而持久的关系。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "读某些书的时候，我仍把自己放在自我宇宙的中心位置，读这本书只是为了填补自我世界的空白。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "在什么情形下，又在多大程度上，我能被某位作者的文字攫住，暂时化身为另外一个人？首先是当作者直抒胸臆时：回忆录、书信、私密日记；其次，当他在文字中重塑自己的世界时：那就是小说。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "但如果能享受当下的圆满——无论是在喜悦、行动还是反叛中——死亡就会后退一步。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "每个人都能享受生活之美：喜欢的工作、朋友、宠物、开花的杏树", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "“人的幸福不取决于生活水平，而取决于心与心之间的联系以及我们对生命的看法。”", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "不过，我很容易被侦探小说、间谍小说或冒险小说吸引住。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "把自己置身小说中的世界，同意玩这个游戏。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "第三章 依然好奇", "x": "有两个作家我几乎百读不厌：普鲁斯特和写《忏悔录》的卢梭。", "y": "", "d": "2025-07-01"}, {"k": "h", "c": "2", "x": "第一次读一本书的时候，人们有时只记住了与自己的执念、幻想相呼应的字眼，而没有领会作者的意图，跟随他写作的脉络，我二十岁的时候就是这么读书的。", "y": "", "d": "2025-07-02"}, {"k": "h", "c": "2", "x": "努力让自己客观一些", "y": "", "d": "2025-07-02"}, {"k": "h", "c": "2", "x": "整体来看，与四十岁时相比，我对自己在世界上的位置有了更清醒的认识，对社会结构和历史进程的理解进了一步，对人们的意图与反应也看得更清楚了一些。", "y": "", "d": "2025-07-02"}, {"k": "h", "c": "2", "x": "被迫吞下精神饲料", "y": "", "d": "2025-07-02"}, {"k": "h", "c": "2", "x": "至于我自己，我说过，我的好奇心依然开放。", "y": "", "d": "2025-07-02"}, {"k": "t", "c": "第四章 探索世界", "x": "几趟每次一两天的短期出游，我就重新游览了法兰西岛及周边的省份。", "y": "好，我今年也要尝试一下独自旅行！", "d": "2025-07-02"}, {"k": "h", "c": "2", "x": "身体相当疲乏，却怀着节日般的雀跃心情。", "y": "", "d": "2025-07-03"}, {"k": "h", "c": "2", "x": "女性追求的不是成为女人，而是成为完整的人。", "y": "", "d": "2025-07-03"}]}, {"id": "31934007", "title": "人生由我", "author": "梅耶·马斯克", "cats": ["人物传记-女性人物", "个人成长-女性成长"], "bmCount": 32, "rvCount": 1, "notes": [{"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "我当然盼望我的女儿们此生一帆风顺。但是假如她们不得不面对磨难和挑战，我希望她们届时至少能拥有梅耶·马斯克十分之一的勇气和能量。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "对孩子最有用的教育，就是让他们看见你在努力成为更好的自己。除此之外，都不重要。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "曾经有人问第欧根尼，他从哲学中学到了什么，他回答：“准备迎接每一种命运。”", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "“生活的艺术更像是摔跤，而不像是跳舞。”", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "珍惜友谊。孩子会离家，爱人会分手，工作会退休，但志同道合的密友长留。真正的朋友未必能与你抱团取暖，但必然能让你肃然起敬。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "善于寻求别人的帮助和支持。求助是一种非常基础的生存能力，求助就是在结网，在与更多人建立信任和连接。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "推荐序 打碎“人造完美”，原力觉醒", "x": "无论一切看起来多么暗淡，前方总有光明。如果实在太黑了，那就让自己变成一盏灯吧。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "前言 拟订计划，放手一搏", "x": "我们的家训是：冒险而审慎地生活。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "6 决不随波逐流 走自己的路，不必总是遵循别人对你的期望", "x": "走自己的路，不必总是遵循别人对你的期望", "y": "", "d": "2021-01-25"}, {"k": "h", "c": "6 决不随波逐流 走自己的路，不必总是遵循别人对你的期望", "x": "如果每天重复同样的生活、做同样的工作、在同样的地方居住也能让你很快乐，你当然可以保持现状。", "y": "", "d": "2021-01-25"}, {"k": "h", "c": "9 专注于你的下一步 每个人都有能力逃离困境", "x": "如果你生活在对另一个人的恐慌或畏惧中，你必须制订一个计划来摆脱这个人。如果你发现这段关系只会给你带来痛苦，你必须尽你所能赶快逃离。我花了太长时间做无谓的等待，等待那个人改变，或者那段糟糕的关系改变。但最后我发现，能改变的只有我自己。", "y": "", "d": "2021-01-25"}, {"k": "h", "c": "13 重新出发 如果在聚会中看到有人孤身一人，试着跟他交谈", "x": "如果你打算在新的地方从头来过，那你必须走出家门。千万不要坐以待毙，更不要让自己一味地沉浸在孤独中。幻想友谊和事业从天而降毫无用处，你能做的只有走出家门，开始跟人们交往。", "y": "", "d": "2021-01-29"}, {"k": "h", "c": "14 如果有必要，换个地方生活 如果向前的时机来临，那么应该冒险一试", "x": "我们知道万事开头难，但是一旦我们能够克服困难，从长远的角度来看待这个决定，其实我们受益无穷。", "y": "", "d": "2021-01-31"}, {"k": "h", "c": "15 收获善意的力量 善待陌生人，并学会寻求支持", "x": "人们有时会对子虚乌有的想象感到恐慌，但可怕的事情其实可以在任何无法预见的时刻发生。不要在这上面纠结。你可以充分做计划，也可以认真准备，但你也得明白没人可以未卜先知。", "y": "", "d": "2021-01-31"}, {"k": "h", "c": "15 收获善意的力量 善待陌生人，并学会寻求支持", "x": "幸运的是，我们收获了许多善意，有些来自朋友，有些来自萍水相逢的陌生人。", "y": "", "d": "2021-01-31"}, {"k": "h", "c": "16 越努力，越幸运 如果你并非生而显贵，你需要找到你的天赋，并努力工作", "x": "但请不要忘记，你的运气只能通过自己的努力来创造！", "y": "", "d": "2021-01-31"}, {"k": "h", "c": "16 越努力，越幸运 如果你并非生而显贵，你需要找到你的天赋，并努力工作", "x": "但托斯卡认为这是一次冒险奇遇。她对自己说：“这就是任务罢了。”她做到了，而且从不抱怨。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "18 尽可能保持积极乐观 你会经历许多次打击，你也会恢复得越来越快", "x": "我感到惊讶和泄气。我一直是一个不错的客户，他们也看到过我在他们的购物中心走秀，而我居然还是被拒绝了。然而我没有时间沉溺于失望，赶紧回去工作才是王道。这次的失败只是意味着我的计划被推迟了而已，我应该做的是存更多的钱来证明自己。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "18 尽可能保持积极乐观 你会经历许多次打击，你也会恢复得越来越快", "x": "总结一下我学到的一课：不要一直沉溺于打击之中。如果你感到失望，那就换个方向。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "18 尽可能保持积极乐观 你会经历许多次打击，你也会恢复得越来越快", "x": "沉湎于过去只会让你变得毫无魅力，也会让大家烦不胜烦，开始纷纷远离你。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "18 尽可能保持积极乐观 你会经历许多次打击，你也会恢复得越来越快", "x": "衰老的伟大之处在于：你会经历许多次打击，你也会穿过看似无尽的黑暗。最后，你会恢复得越来越快。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "18 尽可能保持积极乐观 你会经历许多次打击，你也会恢复得越来越快", "x": "我给你的建议是：尽可能保持积极乐观。时间是治愈一切的良药，你应该努力比我更快地从打击中恢复过来。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "22 致所有的单身女性 恋爱与否，你都可以活得开心", "x": "我认为每个人都可以在爱情中收获快乐，但是一个人也可以过得很快乐。如果你还没有找到合适的人，那就去好好爱你的家人、朋友和工作吧。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "22 致所有的单身女性 恋爱与否，你都可以活得开心", "x": "和真正的好友待在一起是一种安慰，你会感觉像在家里一样，可以完完全全放松，做真正的自己。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "22 致所有的单身女性 恋爱与否，你都可以活得开心", "x": "“如果你和他在一起时比你一个人时更不开心，那你应该离开。但如果你和他在一起时比你一个人时更快乐，那么你应该继续保持这段关系。”", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "23 健康饮食会让你更快乐 认真计划你的每一餐", "x": "选择健康食物，少食多餐，等有饥饿感的时候再吃——这些小窍门都是良好饮食计划的基础。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "28 拥抱七十一岁 让生命中的每一个十年都比上一个十年更好", "x": "我不怕衰老的原因之一是，我生命中的每一个十年都比上一个十年更好。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "28 拥抱七十一岁 让生命中的每一个十年都比上一个十年更好", "x": "如果你活得足够久，你就会发现在人的一生里，让人烦恼的问题会一次次地重复出现。当你遇到了某件可怕的事情，或者某人对你暴露恶意时，你可以说，排个号吧，之前类似的状况又不是没有发生过。无论当时多么痛苦，再次经历的时候都不会那么难过了。而现在的你已经可以坦然地面对这些，让一切不顺都滚吧。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "28 拥抱七十一岁 让生命中的每一个十年都比上一个十年更好", "x": "变老是一件好事。随着年龄的增长，我们将变得更加有智慧、更加自信——这真是一种让人惊喜的经历。我们在此过程中也学到，如何更快地摆脱那些在生活中遇到的浑蛋。我猜你已经意识到了，我对未来满怀热情，并翘首以盼。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "终章 现在开始，制订你的计划 要有足够的常识和制订计划的能力", "x": "也许这就是我每天醒来都感到快乐的原因。我经历过富足的生活，也体会过穷困潦倒的状况。没有人知道接下来会发生什么。对我而言，身体健康，享受工作，热爱家庭，拥有一群超级好的朋友，这就够了。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "终章 现在开始，制订你的计划 要有足够的常识和制订计划的能力", "x": "无论是健康、事业，还是生活，世上没有一步到位的解决办法。你所能做的就是努力工作，保持乐观，真诚待人。对了，你还要有足够的常识和制订计划的能力。", "y": "", "d": "2021-02-03"}, {"k": "h", "c": "终章 现在开始，制订你的计划 要有足够的常识和制订计划的能力", "x": "生活就是起起落落的，就像坐过山车一样，向上永远会让人兴奋，下落则会让人如同身处地狱。如果你处于人生低谷，那你一定要学会制订计划，让自己逃出。", "y": "", "d": "2021-02-03"}, {"k": "t", "c": "全书想法", "x": "", "y": "我当然盼望以后能一帆风顺，但假如我不得不面对磨难和挑战，我希望能拥有作者十分之一的勇气和能量。\n“无论是健康、事业，还是生活，世上没有一步到位的解决办法。你所能做的就是努力工作，保持乐观，真诚待人。”\n“努力让生命中的每一年都比上一年更好。”", "d": "2021-02-08"}]}, {"id": "40133507", "title": "基层女性（探讨关于爱、金钱与精神世界的建立）", "author": "王慧玲", "cats": ["个人成长-女性成长"], "bmCount": 30, "rvCount": 0, "notes": [{"k": "h", "c": "前言 一个基层女性的翻身参考", "x": "面对生活，有百折不挠的勇气。", "y": "", "d": "2023-08-23"}, {"k": "h", "c": "20岁到30岁，这10年应该做什么", "x": "去运动、学习，和人坦诚地交流，交一些志同道合的朋友，生命有了体验之后，经验就会逐渐积累。自信随之而来，你才会对生活建立自己的理解，对生命产生自我的认知。", "y": "", "d": "2023-08-23"}, {"k": "h", "c": "你是自己的唯一靠山", "x": "要记住一条真理，这条真理你越早意识到，这辈子所受的苦难就越少，那就是：这个世界上没有人可以拯救你，你这一生唯一能依靠的，只有你自己。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "你是自己的唯一靠山", "x": "你还没有挖掘出个人价值，也创造不了很大的社会价值时，女性自带的生育价值就显得尤其重要。这也是大部分女性产生年龄焦虑的根源，她们担心创造不了其他价值，又没有以自己的生育价值换取好的生活。所以在这个阶段，很多女性仓促进入婚姻。问题是，如果你只有生育价值，通常也换不来好的生活，因为看重生育价值的男性，不会优秀到哪里去，很可能跟你一样迷茫、随波逐流，物质、精神双贫困，很难去输出爱，也没有家庭责任感。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "你是自己的唯一靠山", "x": "父母着急把你推进婚姻，只是因为他们在精神贫困之下，想要迫切地转移自己承受的压力。他们不会考虑你的幸福，他们自己得到的幸福都很少，作为不知道幸福是什么样子、不知道婚姻质量为何物的人，他们只会告诉你：大家都是这么过来的，忍一忍就过去了，忍一忍一辈子就结束了。如果你不想过这样的生活，就要从源头上去抗争，对自己的生命负责，让自己变得强大。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "你是自己的唯一靠山", "x": "请记住，婚姻不再是女人的出路了。那些已婚已育的姐妹在温水里煮久了，大多数已经失去跳出来改变命运的勇气了，希望年轻的你还有机会去创造和选择自己想要的人生。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "去过不被绑架的人生", "x": "为什么大家搞不清楚一个简单的道理呢？赚钱、结婚、买车、买房的终极目的是获得幸福的人生。结婚是认为婚姻和孩子能带来幸福；买车是想方便出行或者获得认可和尊重；买房是想获得安全感，过上幸福安稳的生活。归根结底，幸福才是我们的追求，而不是婚姻和车、房本身。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "去过不被绑架的人生", "x": "我们之所以会产生“只要我拥有金钱、车子、房子、婚姻、孩子，我就拥有了幸福，我就是成功人士”的观念，是社会营销的结果。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "去过不被绑架的人生", "x": "用加班50个小时分得的一杯羹给孩子报钢琴课，所达到的效果，有可能还不如你放下手机5小时，陪孩子在大自然中徒步，跟他讲沿途的花是怎么开的，天上的云怎么来的，让孩子在成年后回味那个阳光灿烂的下午，和爸爸妈妈一起走过的路，更能让孩子感到幸福。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "去过不被绑架的人生", "x": "我在某一天坚定了我想要的生活，理解了幸福就是身体的无病痛和内心的无困扰之后，那些我曾经认为重要的东西，那些试图绑架我的人和观念，突然就对我没有任何力量了。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "去过不被绑架的人生", "x": "你永远都是有选择的。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "真正的自私是以爱之名的情感勒索", "x": "哪些人是真正自私的人？是那些想从你身上获取利益，用血缘和所谓的爱来进行情感勒索，要求你无偿牺牲、无私奉献，要求你损害自己的利益、以他们的利益为优先的人，这样的人才是真正自私的人。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "真正的自私是以爱之名的情感勒索", "x": "你只要确定在争取自己利益的同时没有侵害其他人的利益就可以了，侵犯别人的利益才是自私。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "克服思想上的贫穷", "x": "一杯30元的奶茶，就可以换来一个哲学家的伟大思想，世上还有比这更好的事吗？", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "安全感是你手头的种植术", "x": "在你成年后，在建立自己的认知开始，就要学会做自己的老师和父母，进行自我教育。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "安全感是你手头的种植术", "x": "一个人在恐慌心态下做出的选择，大多数都是错误的。哪怕不选择，原地踏步，也比做出错误的选择导致倒退要好。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "安全感是你手头的种植术", "x": "希望所有年轻人，把研究自己是什么土壤、寻找自己喜欢种什么当作一生的课题，在这个过程中，去获取大量的知识和生存的技能，建立自己对未来生活的信心，从而获得真正的安全感。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "不被社会营销的游戏乱了心智", "x": "人都是环境的产物，这些人为输出的观念日复一日地在耳边萦绕，你慢慢被熏陶，在不知不觉中接受、认同，并且下载、注册这款游戏。从这个时候起，游戏公司就开始赚你的钱了。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "不被社会营销的游戏乱了心智", "x": "为了自身发展，或者说是出于既得利益者的需要，必须让社会大众参与到它制定的游戏规则中来，这样才能获利。一个家庭单位创造的价值远远大于单身，因为结婚就要买房子，生孩子就要支付教育成本，很多人还要买学区房。基本上一旦结婚生子，你在这个游戏中就自动升级成VIP，各种规则环环相扣，你身处其中轻易脱不了身，你是最理想稳定的为社会创造价值的螺丝钉。这就是社会给单身男女压力的动力之源。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "不被社会营销的游戏乱了心智", "x": "钻石也是一样，这种完全可以人工合成的碳晶体，通过跟爱、永恒挂钩，成为20世纪营销最成功的商品之一。很多被制造出来的节日，如“520”，也是同一个模式。这些都是外界植入你大脑中的，其中有一些观念强大到你根本不认为是受外界的影响，以为就是你自身的需求，你的人生目标。你可以问问自己：小时候的梦想里有“我长大了以后，想结婚生子，买车买房还房贷”吗？", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "像水一样去生活", "x": "我从不会消费任何我能力以外的东西，无论多少人拥有它、说它好，我只遵循内心的需求。", "y": "", "d": "2024-04-15"}, {"k": "h", "c": "自信来自大量的经验", "x": "请多去探索这个世界", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "年轻人要多谈恋爱", "x": "婚姻制度的产生是为了保护财产、保护私有制，婚姻是一种经济行为。只有夫妻双方可以共同承担生活风险，创造价值，保障各自利益最大化，婚姻对你才有价值", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "彩礼对女性的意义", "x": "一个基层的贫困女性，如果把自己放在人生的终点去回望这一生，就会发现，如果这辈子有勇气不结婚，也许会过得远比在传统婚姻里生儿育女要轻松，生活品质要高很多，寿命也会长很多。然而，很多基层女性的可悲之处就在于，因为生存能力低下，她们是婚姻市场里最渴望结婚的一群人，渴望婚姻带来的所谓归属感、安全感，渴望通过婚姻改变自己的命运。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "生育的价值", "x": "就像一个人整天拿着一根棒棒糖，语重心长地跟别人说：“哎呀，你没有棒棒糖，人生真是失败啊。”却想不到人家家里的零食堆了一仓库，而且全是进口的，关键是人家根本不想吃零食，早就改吃有机食品了。那为什么有些人对棒棒糖这么执着，整天有意无意地拿出来在别人面前炫耀呢？只能认为这根棒棒糖是她唯一拥有的零食，是她这一生唯一可以创造的价值，只有不断说服自己、说服别人，承认这根棒棒糖至高无上的独特性，她才能产生一种别人没有而自己拥有的满足感。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "生育的价值", "x": "生育是非常消耗母体生命的，无论是生理上还是心理上，都是巨大的损耗，而且它带来的很多生理创伤是不可逆的。这就是为什么父权社会对母亲这个角色进行铺天盖地的讴歌赞美，因为不给“母亲”设定一个崇高的价值和意义，女性是不会去做这件事的。人类天性中有利己、自私的基因，要求一个人牺牲自己的生命去成全另外一个生命，必须是要依靠外界的力量的。这些力量，一是从思想上麻痹，不停地向女性灌输“你是女人，女人就要生孩子，不生孩子的女人是失败的，就是不下蛋的鸡”等观念；二是利用男性作为规则制定方，制定一些不公平的规则来对女性进行实际控制，其中最显著的方式就是不让女性接受教育。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "为社会打工换取利益保障", "x": "越早放弃通过男性和婚姻来获利，就能越早获得自由。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "为社会打工换取利益保障", "x": "如果你懒惰，依赖别人，把自己当弱者，只想向别人索取，那么生活会在将来的某一天让你看清它的真相，而那时的痛苦才是真正的痛苦。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "恋爱、婚姻、生育是三件不同的事", "x": "正如我一直呼吁的，女性要努力实现经济和精神双独立，只有成为一个独立的人，你的婚姻才不会被要求以生育作为附加条件，你才能自由地选择想要的生活方式，将命运掌握在自己手中。", "y": "", "d": "2024-12-16"}, {"k": "h", "c": "为家庭打工没有出路", "x": "而越是偏僻穷困的地方，越是受教育程度低的女性就越早结婚生子，因为她们必须依附于男性才能生活", "y": "", "d": "2024-12-16"}]}, {"id": "3300037375", "title": "女生怎样活? ———上野老师，教教我！(这是一本满载宝贵建议的“女孩生存指南”。）", "author": "[日]上野千鹤子", "cats": ["个人成长-女性成长"], "bmCount": 21, "rvCount": 0, "notes": [{"k": "h", "c": "4.决不愿变成我妈那样！", "x": "在令人眼花缭乱的人生选项前，十几岁的少年人理该兴奋得摩拳擦掌，憧憬着今后每条路上的风景。正值青春好年华，没有必要自我设限，去缩减自己的选择余地。你大可向妈妈坦言：​“你那个时代无法拥有的人生选项，我这一代人可从来不缺啊！”我猜，妈妈如果真的爱你，即使你未能选择她属意的那条路，她也一定会发自内心地充当你的后援。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "7.女生也可以立志考东大！", "x": "对待这样的男生，应当以“老爹”称呼。没错，别看东大男生年纪轻轻，却早早染上一身“爹气”​（此处的“老爹”并非指中老年男性，而是过度自我中心，以致“含爹量”过高，歧视女人、小孩等弱势立场的人，缺乏想象力又极度钝感的家伙。​“爹气”与性别年龄无关。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "7.女生也可以立志考东大！", "x": "，世间并不尽被“爹派”占据。哪怕不去特意操心", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "7.女生也可以立志考东大！", "x": "，东大女生的结婚率依旧挺高的。倒不如说，由于这类女生偏少，反而还挺抢手。更何况，就算被“爹值满满”的男生选中，又有什么值得开心的？和这种“爹系男子”结了婚，一辈子都要负责守护他那脆弱的自尊心哦。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "7.女生也可以立志考东大！", "x": "对立志挑战东大的姐姐，你务必要多多支持，等回头轮到自己时，也要加油跟上她的步伐哦！", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "8.女生仅占就读人数的20%？", "x": "可惜啊，靠摆布“单细胞生物”和不停装傻建立起来的关系，果真有趣吗？何况，装得了一时，装得了一世吗？如果你希望交往的男性，必须能让你对其才华、努力发自内心感到敬重，那么，你也不妨要求对方同样尊敬你的才华与努力。彼此尊重、旗鼓相当的爱人与关系，才是愉悦而长久的。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "10.只有JK才能打这份工？", "x": "尽量培养一些与自己的经济能力相匹配的兴趣爱好吧。感到“不满足”的部分，不妨靠自己花心思和工夫来补足。", "y": "", "d": "2024-11-02"}, {"k": "h", "c": "7.女权主义者，都是些什么人？", "x": "我只能告诉你自己心目中的答案。女权主义最基本的主张，便是不受所谓“女性气质”或“男子气概”​（俗话中的女人味与男人味）等性别规训的束缚，自由自在活出自己的面貌。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "7.女权主义者，都是些什么人？", "x": "我只希望自己做个对朋友“温暖”​，对敌人“可怕”的人", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "8.自己的人生，自己做主", "x": "无论男女，皆是出于自己的人生考量，为了自身的利益，才决定是否要孩子。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "8.自己的人生，自己做主", "x": "儿童人口减少，发愁的到底是谁？谁更巴望大家多生孩子？为此一筹莫展的是政府和经济界人士。他们把国民的个体，按照“人头”——人口数来统计。人口减少，国家经济规模便会缩小。经济规模缩小，GDP（国内生产总值）就会下滑。GDP下滑，日本就会失去大国优势（如今日本是全球第三GDP大国）​，沦为寡民小国。权力高层的老头子们肯定特不甘心吧。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "8.自己的人生，自己做主", "x": "在这帮官老爷眼里，女人不过是一种“人口再生产”的资源。你并没有任何义务为了让官老爷们开心，而去当什么“生育机器”​。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "8.自己的人生，自己做主", "x": "愿意结婚就去结婚，不结就独善其身；爱异性很好，爱同性也不错；喜欢做爱就去做吧，不感兴趣也不必勉强；生孩子固然幸福，不生也未必是什么损失；想当父母值得祝福，不想当也天经地义；有离婚的想法也没关系，离就行了；想发展事业，坚持努力就好了……但愿我们的社会风气与环境变得更加自由，每个人的选择都不被他人说三道四、横加指责（当然更容不得国家从中干涉）​。为了实现这一点，你也可以大有作为哦。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "9.提高各领域内女性的占比，将会发生什么？何谓“男女共同参画”？", "x": "不管去到哪个领域，请你尽量自由地舒展拳脚，坚持做自己吧。感到“这不合理”的地方，就直言不讳地指出“太奇怪了”​；碰到心里想尝试的工作，就把手高高举起，毛遂自荐“让我来吧”​；发现以往的办法“行不通啊”​，就去思考一套属于自己的解决方案，务必使自身成为一个在系统里“制造噪音”的人。同时，也请去寻找一群接纳噪音、享受噪音，能够与你共同成长的伙伴。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "9.提高各领域内女性的占比，将会发生什么？何谓“男女共同参画”？", "x": "一个见所未见、闻所未闻的未来正在前方等待着你。它会是怎样一幅景象，我无法擅自描绘。但勇于迎向不可知的未来，是件有趣、有意义，也有回报与成就的事。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "9.提高各领域内女性的占比，将会发生什么？何谓“男女共同参画”？", "x": "希望将来某天，当你来到人生的暮年，会发出感叹：​“啊，我的一生真美好，真精彩！”", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "9.提高各领域内女性的占比，将会发生什么？何谓“男女共同参画”？", "x": "弱者最渴望得到的，是安心、安全的社会环境。哪怕身为弱者，也可安然无忧地生活其中；无法靠自身力量独立生存的孩子，也不会被忽视或虐待；上了年纪的老人，也不会被当成“累赘”而遭到嫌弃；身体有残疾，也不会惨遭杀害……如此美好健全的社会，你不渴望拥有吗？我们每个人降生于世时，都是稚嫩无力的婴儿，最终，也会作为虚弱衰微的老人撒手告别，无人可以逃脱这样的宿命。最能深刻理解这一点的，是始终在照顾孩童与老人的女性。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "二〇一九年度（平成三十一年）东京大学入学典礼祝词", "x": "请不要把你们的努力，仅用于打败对手，为自己争得高位。莫把优裕的环境与天赋的才能，用来轻视、贬低那些不被上天眷顾的人，而是向他们提供帮助。同时，别逞强，接纳自身脆弱的一面，与他人彼此扶持、相互依靠地活下去吧。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "二〇一九年度（平成三十一年）东京大学入学典礼祝词", "x": "哪怕身为弱者，依然能受到尊重。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "上野图书馆：“助你展翅”的读书清单与观影列表", "x": "一位女权主义者写道：​“权利不会从天而降。​”这个道理，无论过去还是未来，都不会变。我们绝不可忘记：权利，是抗争的果实。", "y": "", "d": "2024-11-04"}, {"k": "h", "c": "上野图书馆：“助你展翅”的读书清单与观影列表", "x": "如果不想像金智英那样度过一生，应该怎么做", "y": "", "d": "2024-11-04"}]}, {"id": "35361168", "title": "曾国藩的正面与侧面", "author": "张宏杰", "cats": ["历史-历史读物"], "bmCount": 18, "rvCount": 0, "notes": [{"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "他曾有一段时间深信老子说，“至柔可以克万物”。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "他一辈子强调勤与恒。说天下事，无论什么，要做成样子，必须有两样，一是规模，一是精熟，两样都从勤与恒中来。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "所以要想勤与恒，就从两点做起，“不讥笑人，不晚起”，这两点真是平实近于迂。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "他说，一辈子从这两句中受益良多，可去一切骄慢虚妄。这话谁都懂，觉得也不怎么高明，后来才觉得，他的厉害之处在于践行终身。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "学英文时，老师说过一句话，什么是天才，天才就是持久不断地忍耐。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "惭愧中理解老曾说的，决定成败的，不在高处，在平处，不在隆处，在污处。全看人能不能在棘手之处，耐得住烦。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "体制内的改良者，大都经历过这样的处境，像蔡元培说的锅里的小鱼，“两边煎”。政府觉得你不忠诚，老百姓觉得你是走狗，保守者觉得你动摇根基，激进者觉得你迟滞迂缓。总是两边都骂你，什么好也落不着。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "序 岁月让人从批判走向了建设", "x": "百年来，对他的毁誉都很极端。他被认为是完人，也被认为是卖国贼，被认为是圣徒，也被认为是刽子手。\n真与伪是大敌，真却永远两拳空空，无所依恃。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "自序 从细节中发现的曾国藩", "x": "他老人家在打仗的时候，一遇到左右为难之时，就翻开《易经》，自己算卦。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "第一章 曾国藩一生的五次耻辱", "x": "打脱牙之时多矣，无一次不和血吞之。", "y": "", "d": "2024-02-03"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "刚过而立之年的曾国藩和每个普通人一样，有着大大小小许多缺点。\n一是心性浮躁，坐不住。曾国藩天生乐于交往、喜欢热闹，诙谐幽默。在北京头两年，他用于社交的时间太多，每天都要“四出征逐”，走东家串西家，酒食宴饮，穷侃雄谈，下棋听戏。虽然他给自己订了自修课程表，但执行得并不好，认真读书时间太少，有时间读书心也静不下来。", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "二是为人傲慢，修养不佳。虽然资质并不特别优异，但曾国藩在湖南乡下朋友圈里总算出类拔萃，并且少年科第，所以一度顾盼自雄。在离家到京任官之际，他那位识字不多却深有识人之明的老祖父送给他这样的临别赠言：“尔的官是做不尽的，尔的才是好的……尔若不傲，更好全了。”[2]", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "除了以上三点，曾国藩认为自己还有一大缺点，必须改过，那就是“好色”。", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "曾国藩之于后人的最大意义是，他以自己的实践证明，一个中人，通过“陶冶变化”，可以成为超人。换句话说，如果一个人真诚地投入自我完善，他的本领可以增长十倍，见识可以高明十倍，心胸可以扩展十倍，气质可以纯净十倍。愚钝之人，通过自我磨砺，也可以看得透，立得定，说得出，办得来。浮嚣之人，也可以变得清风朗月般从容澄净。偏执之人，亦可以做到心胸开阔，不矜不伐。", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "人的巨大潜力往往是人类所不自知的。所谓庸人，就是昏睡了一生的人，因为欲望缠绕，意志软弱，智慧不明，普通人一生只能动用上天赋予的很少一部分潜能。而英雄伟人则是醒过来的人，他们天性刚强，头脑有力，可以把自身潜能发挥得比较充分。而“圣人”，或者说达到“自我实现”状态的人，则是通过刻苦努力，穿透重重欲望缠绕，战胜种种困难，将自身潜能调动发挥到近乎极致。", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "从曾国藩身上，我们可以悟出自我完善的必经途径。\n首先是立坚韧不拔之志。", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "他每天从起床到睡觉，吃喝拉撒睡，都进行自我监督。以圣人标准要求自己，时时刻刻监督检查自己的一举一动。他每天都要用工楷认真书写日记，细细回忆检索自己这一天的一切言行，发现其中哪一点不符合圣人要求，就要甄别出来，记载下来，深刻反省。", "y": "", "d": "2024-02-06"}, {"k": "h", "c": "第四章 曾国藩是如何“脱胎换骨”的", "x": "上一节我们提到，青年曾国藩身上有三大缺点：性情浮躁，坐不住；傲慢自大，修养不佳；与人交往虚伪不实，容易言不由衷。他的自我改造，当然首先就从这三端入手。", "y": "", "d": "2024-02-06"}]}, {"id": "621671", "title": "向前一步", "author": "谢丽尔·桑德伯格", "cats": ["人物传记-女性人物", "个人成长-女性成长"], "bmCount": 11, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序1", "x": "Done is better than perfect", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "推荐序1", "x": "无论男女，都值得拥有独立而完整的人格和自我实现，这是生理的、心理的、事业的、情感的、物质的、精神的积累过程，需要慢慢地成长起来。", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "推荐序1", "x": "我认为真正的平等是，无论男人和女人，都拥有平等的机会获得个体自由从而得到全面的发展。终有一天，无论是女人还是男人，都可以做真正的自己，拥有自由的选择权，实现自己的潜能，创造出最大的自我价值。而这一天，就是男女共同的节日！", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "导言", "x": "我们站在从前女性的肩膀上，理所当然地享受着她们曾为之奋斗的一切。", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "导言", "x": "如果每位女性都能够更加积极进取，我们就离“真正的平等”这个宏大的目标又近了一步。", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "第1章 职业女性的内在障碍：如果克服了恐惧，你会做什么？", "x": "“我们这代人曾奋力抗争，以求给你们有选择一切的自由。", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "第1章 职业女性的内在障碍：如果克服了恐惧，你会做什么？", "x": "Free to Be You and Me", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "第2章 往桌前坐", "x": "已", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "第4章 职业生涯中的长远梦想及短期目标", "x": "当选择一份工作时只有一个标准是重要的，就是它是否能让你快速成长。", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "第4章 职业生涯中的长远梦想及短期目标", "x": "其次，我会试着在接下来的18个月里，为自己设定更多有关新技能的学习目标。这个过程通常是很痛苦的。我不断问自己和周围的人：怎样才能改善自我？我发现，如果我害怕做某件事，通常是因为我还不太擅长或者都不敢尝试。", "y": "", "d": "2021-02-28"}, {"k": "h", "c": "第4章 职业生涯中的长远梦想及短期目标", "x": "不要等着别人给你力量，", "y": "", "d": "2021-02-28"}]}, {"id": "534288", "title": "曾国藩：唐浩明修订版（全集）", "author": "唐浩明", "cats": ["历史-中国古代", "人物传记-历史人物"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "自序", "x": "它的难得之处还在于，这批文稿鲜活地向世人召示一个中国士人，于纲纪倾圮、江河倒流的战乱时代，在操守与利益、高尚与卑污、担当与躲避、进取与退舍、个人与群体、一时与千秋等等立身大节上的那种近于典范式的选择与处置。", "y": "", "d": "2024-02-01"}, {"k": "h", "c": "自序", "x": "它的难得之处更在于，这批文稿记载了一个情感丰富、思虑缜密、喜欢并善于剖析自己、分析人事的涉世极深者，将自我心灵深处的苦痛、喜乐、困惑、领悟、弱点甚至丑恶，向外人向后世作了勇敢而真诚的坦露。", "y": "", "d": "2024-02-01"}, {"k": "h", "c": "自序", "x": "我读他在事功辉煌时的家信：“处兹乱世，凡高位大名重权，三者皆在忧危之中。余……寸心惕惕，恒惧罹于大戾。”读他在晋升大学士位极人臣时的家信：“人以极品为荣，吾今实为苦恼之境，然时势所处，万不能置身事外，亦惟有做一日和尚撞一日钟而已。”读他在家业鼎盛时的家信：“吾则不忘蒋市街卖菜篮情景，弟则不忘竹山坳拖碑车情景。昔日苦况，安知异日不再尝之。”读他即将告别人世时所写的日记：“败叶满山，全无归宿。通籍三十余年，官至极品，而学业一无所成，德业一无所许。”", "y": "", "d": "2024-02-01"}, {"k": "h", "c": "自序", "x": "它究竟是此人的独特个性，还是一切成就大事业者共有的心绪？它是中国文化所培养的士人难以消除的万古之愁，还是全人类英才都无法摆脱的生命之苦？不管怎样，我得感谢这批文稿的作者。他以老到娴熟的文字功力，为我们留下这千余万言的翰墨，提供了一个如此丰厚、如此细腻、如此真切的生命个案，给一切有志于探索人生奥妙的后人以一份完备的原始材料。", "y": "", "d": "2024-02-01"}, {"k": "h", "c": "自序", "x": "他所处的时代是那样的风云激荡，他的历史形象是那样的富有争议，他的内心世界是那样的丰富复杂，要写好这个人物，非借助文学元素不可；否则，决不可能生动鲜活、血肉丰满，更不可能走进他的精神与心灵之中。于是穷八年之思，有了这部长篇历史小说《曾国藩》。", "y": "", "d": "2024-02-01"}, {"k": "h", "c": "十二 遗嘱念完后，黑雨倾盆而下", "x": "一曰慎独则心安。自修之道，莫难于养心；养心之难，又在慎独。能慎独，则内省不疚，可以对天地、质鬼神。人无一内愧之事，则天君泰然，此心常快足宽平，是人生第一自强之道，第一寻乐之方，守身之先务也。\n二曰主敬则身强。内而专静纯一，外而整齐严肃，敬之功夫也；出门如见大宾，使民如承大祭，敬之气象也；修己以安百姓，笃恭而天下平，敬之效验也。聪明睿智，皆由此出。庄敬日强，安肆日偷。若人无众寡，事无大小，一一恭敬，不敢懈慢，则身体之强健，又何疑乎？\n三曰求仁则人悦。凡人之生，皆得天地之理以成性，得天地之气以成形，我与民物，其大本乃同出一源。若但知私己而不知仁民爱物，是于大本一源之道已悖而失之矣。至于尊官厚禄，高居人上，则有拯民溺救民饥之责。读书学古，粗知大义，即有觉后知觉后觉之责。孔门教人，莫大于求仁，而其最切者，莫要于欲立立人、欲达达人数语。立人达人之人，人有不悦而归之者乎？\n四曰习劳则神钦。人一日所着之衣所进之食，与日所行之事所用之力相称，则旁人韪之，鬼神许之，以为彼自食其力也。若农夫织妇终岁勤动，以成数石之粟数尺之布，而富贵之家终岁逸乐，不营一业，而食必珍馐，衣必锦绣，酣豢高眠，一呼百诺，此天下最不平之事，鬼神所不许也，其能久乎？古之圣君贤相，盖无时不以勤劳自励。为一身计，则必操习技艺，磨练筋骨，困知勉行，操心危虑，而后可以增智慧而长才识。为天下计，则必己饥己溺，一夫不获，引为余辜。大禹、墨子皆极俭以奉身而极勤以救民。勤则寿，逸则夭，勤则有材而见用，逸则无劳而见弃，勤则博济斯民而神祇钦仰，逸则无补于人而神鬼不歆。\n此四条为余数十年人世之得，汝兄弟记之行之，并传之于子子孙孙，则余曾家可长盛不衰，代有人才。", "y": "", "d": "2024-02-01"}]}, {"id": "40216293", "title": "女孩，你已足够好：如何帮助被“好”标准困住的女孩", "author": "蕾切尔·西蒙斯", "cats": ["个人成长-女性成长"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "社交媒体如何引诱女孩：控制力错觉", "x": "正在用她的手指构建一个人格面具。", "y": "", "d": "2021-09-03"}, {"k": "h", "c": "如果我不聪明该怎么办？打破固定心态", "x": "拥有“成长心态”的人则认为他们的能力可以通过努力、策略和指导来提高。他们被挑战所吸引，即使遇到挫折也会坚持下去，甚至愈挫愈勇。", "y": "", "d": "2021-09-03"}, {"k": "h", "c": "如果我不聪明该怎么办？打破固定心态", "x": "你发现对你而言真正重", "y": "", "d": "2021-09-03"}, {"k": "h", "c": "如果我不聪明该怎么办？打破固定心态", "x": "你会继续前进，只是为了你自己，而不是别人。", "y": "", "d": "2021-09-03"}]}, {"id": "855812", "title": "人类简史：从动物到上帝", "author": "尤瓦尔·赫拉利", "cats": ["历史-世界史"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序", "x": "在我看来，写历史写到这个份儿上，一般都只有一个结果，那就是离开了“历史”而走向了“哲学”——而且这个“哲学”还不只是“历史哲学”，它同时也包含了很多人生的哲理。", "y": "", "d": "2022-03-02"}, {"k": "h", "c": "推荐序", "x": "他发现，“快乐”这种情绪的历史，是历史学家从来不感兴趣的问题，而那绝对是一个极大的失误：因为一旦人们发现历史能证明乐无常态而知足常乐，发现我们过去对快乐的历史认知可能都是错的，发现对快感的执着追求可能只会适得其反地导致痛苦，那么我们就有可能走向对自己的真正理解，也就可能知道自己想要的究竟是什么了。", "y": "", "d": "2022-03-03"}, {"k": "h", "c": "第十九章 从此过着幸福快乐的日子", "x": "人想要离苦得乐，就必须了解自己所有的主观感受都只是一瞬间的波动，而且别再追求某种感受。如此一来，虽然感受疼痛，但不再感到悲惨；虽然愉悦，但不再干扰心灵的平静。于是，心灵变得一片澄明、自在。这样产生的心灵平静力量强大，那些穷极一生疯狂追求愉悦心情的人完全难以想象。这就像是有人已经在海滩上站了数十年，总是想抓住“好的海浪”，让这些海浪永远留下来，同时又想躲开某些“坏的海浪”，希望这些海浪永远别靠近。就这样一天又一天，这个人站在海滩上徒劳无功，被自己累得几近发疯。最后终于气力用尽，瘫坐在海滩上，让海浪就这样自由来去。忽然发现，这样多么平静啊！", "y": "", "d": "2019-07-27"}]}, {"id": "3300010568", "title": "见字如面", "author": "刘娜", "cats": ["个人成长-女性成长"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "序言", "x": "在那农田和村庄，粮食和庄稼，闭塞和偏见之外，还有一个遥远而崭新的世界。", "y": "", "d": "2024-03-07"}, {"k": "h", "c": "序言", "x": "大概怀着对新世界的向往，我踏上了刻苦而自律的求学路，成了我们那个三乡交界的贫困小村里，第一个考上本科的大学生。", "y": "", "d": "2024-03-07"}]}, {"id": "30153131", "title": "给一个未出生孩子的信", "author": "奥丽娅娜·法拉奇 ", "cats": ["个人成长-女性成长"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "04 生为男人", "x": "人生是一层柔软的地毯，你能在上面赤脚远行，毫不费力，仿佛没有哪条道路上曾经乱石遍地。而实际上，你又往往会被这石头绊倒，跌倒，被石头伤害致残。面对石头，我们必须用铁靴来保护我们自己，但即使这样也仍旧不够，因为虽然你护住了自己的双脚，却有人总爱捡起石头来砸你的头。我不知道他们听到我的话后会说些什么。他们会谴责我疯狂或者残忍吗？", "y": "", "d": "2022-03-06"}, {"k": "h", "c": "访谈：身为女性，是一场值得称颂的冒险", "x": "对，是一种苦难。自远古时期就已经如此。那时候，我们这个社会正在形成，几乎所有的权力都属于男人，而几乎所有的义务都归于女性。女性主义者是有理由的。当男人谈到自由和正义时，甚至当他们以自由和正义之名而死时，都没有意识到，他们指的是一种不完全与女性相关的自由和正义。不过，我承认身为女性是一种苦难，并非想要简单地称之为苦难，也不是想说这苦难无法逃脱。如果你知道苦难的存在，并且准备好坚持不懈将它终结，出路就总会存在。我们这些女性已经在黑暗中隐约看到了这条出路。正因如此，在当今，身为女性是一场值得称颂的冒险。正因如此，这本书的主角对孕育中的孩子说：我希望你是一个女人……坚持不懈比赢得胜利美好得多。", "y": "", "d": "2022-03-06"}]}, {"id": "184031", "title": "曾国藩家书", "author": "[清]曾国藩", "cats": ["历史-历史典籍"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第一辑 修身篇——自修求强，自己做主", "x": "“诚、敬、静、谨、恒”是曾国藩的修身五字。修身，须以“诚”为本，要忠信、不欺，戒除浮躁之心，加强修养，做谦谦君子；要淡泊、豁达、宽容、勤俭、廉洁、忍让、恭敬，方能游刃有余，铸造精神，升华价值。进而齐家治国平天下，实现立德立功立言的不朽之业。", "y": "", "d": "2024-02-01"}]}, {"id": "26687703", "title": "过得刚好（2019新版）", "author": "郭德纲", "cats": ["人物传记-娱乐明星"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "自序", "x": "活一百岁的没几个人，开心就笑，不开心待会儿再笑。高高兴兴比什么都强，跟谁较劲都是跟自己较劲。一辈子，忍一忍也就过去了。", "y": "", "d": "2020-07-01"}]}, {"id": "923010", "title": "魅力董卿", "author": "李少聪", "cats": ["人物传记-女性人物", "个人成长-女性成长"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "坚定知性，清醒而不自傲", "y": "", "d": "2019-12-18"}]}, {"id": "848660", "title": "我的职业是小说家", "author": "[日]村上春树", "cats": ["人物传记-传记综合"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第六章 与时间成为朋友—写长篇小说", "x": "因为做一项长期工作时，规律性有极大的意义。写得顺手时趁势拼命多写，写得不顺手时就搁笔不写，这样是产生不了规律性的。", "y": "", "d": "2019-04-08"}]}]}, {"key": "04_哲学社会与政治思考", "name": "哲学、社会与政治思考", "books": [{"id": "3300090246", "title": "服美役：美是如何奴役和消费女性的", "author": "[意]毛拉·甘奇塔诺", "cats": ["社会文化-社科"], "bmCount": 161, "rvCount": 0, "notes": [{"k": "h", "c": "引言", "x": "在我出生的国家，只要走在路上，就会被上下打量、被比较、被评判，可我在整个成长过程中都不在乎这种凝视。我走路大大咧咧，只穿运动服，不打理头发，要么不化妆，要么化得乱七八糟，啃指甲，迷恋书本，也从来没有试图讨哪个男孩的欢心。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "第一章 名为美的牢笼", "x": "美是什么？这个问题之所以产生，恰恰是因为人们需要知道是否存在一种客观的美，是否有可能将其转化为语言、转化为精确的标准。随着时间的推移，人们对美的思考变成了一场关于女性身体的讨论，这种讨论也涉及一些必要的手段，它们为的是让女性达到理想状态、远离那些可能使女性变丑甚至变畸形的特质。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "第一章 名为美的牢笼", "x": "在几乎完全由男性撰写和编纂的思想史、艺术史、文学史中，女性的身体逐渐成为一种客体而非主体。女人成了一种可以被议论的东西，而不是可以与之产生关系的人，一种能够表达、能够讲述的人。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "消费社会", "x": "中产阶级开始通过审美品位、道德习惯、建筑规范、服饰、礼仪和室内装修来传达自己的价值观。他们发明了一套严苛的准则，以此来评判美丑，并将美与实用性和效用挂钩，推广一套尽可能单一的范式。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "消费社会", "x": "尤其是到了19世纪中期，“美丽”女人和“得体”身材的图像开始出现在杂志上、广告里。这类形象代表了一个“文明”人该有的样子，而且往往会引导人们去购买美容产品。一种闻所未闻的社会压力就此诞生，美正在变成一种义务，特别是对资产阶级女性而言，她们必须不遗余力地证明自己的美。人之所以为人的价值就在于此。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "消费社会", "x": "我们这个时代对美的认知由此而来，它变成了一项真正的社会责任：我们不能变老，不能变胖，必须藏起不合标准的部分。因此，对美的普遍认知源自一个影响了我们生活和身体的“神话”，它让我们承担起一项重负：评判自己的外表，为它而耻，不断为之焦虑。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美的神话", "x": "她在书中指出，女性并没有按照她们的意愿行事，而是比过去任何时期都更像奴隶。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "一则现代神话", "x": "有了这些手段，女性的身体开始成为一种表现对象：一幅图像可以被复制很多份，通过明信片、杂志、目录、小册子传播。这使身体成为认识的客体，人们得以去研究一直以来被忽视的细节。被描绘的女性并不是一般的女性，而是一种女性需要去达成的标准。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "一则现代神话", "x": "手握表述权的男性（资本家、出版商、商人）筛选出一套标准，并让它变得越来越规范。女性则学会了仔细揣摩它。虽然被描绘的身体多种多样，但实际上有一种“标准版”的女性之美开始被构建出来。身体，尤其是面孔，必须美丽且“正常”，必须令人愉快，不能引人不安", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "一则现代神话", "x": "消费社会导致人们越来越多地把一些东西当成必需品，而它们本来是些次要物品、奢侈品，或者和生存不直接相关的东西。广告使人们对这些东西的渴望更加强烈，还把这种渴望与必然的幸福联系起来。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美是宗教", "x": "我不记得从什么时候开始有了这种念头：假如我更瘦、穿得更好、学会了化妆，就会感到幸福。这念头一定很早就有了，因为我早就觉得自己的身体很古怪、没法儿定义，到处都不对劲。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美是宗教", "x": "我只要一吃甜食或者不运动就会有负罪感，伴随着这种负罪感，我还会冒出想要忏悔、请求宽恕的念头。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美是宗教", "x": "“可获得的美”作为一种理念，和宗教有诸多相似之处：它们都承诺救赎，都会催生我们的不满和无助，引发一种不够格的感觉和冒名顶替综合征。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美是宗教", "x": "如果我的身体不符合要求，如果我脸上毛孔粗大，如果我的牙不够白，那都是因为我一直懒惰、涣散，因此是个罪人。我本可以更努力，本该更努力，但我浪费了自己的潜力，毁掉了天赐的身体，我没有照顾好自己。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美是宗教", "x": "市场就等在这里，预备拯救我们。实际上，市场上充斥着净化和救赎的仪式：它原谅我们的缺点，提供帮助我们实现救赎的东西。它能让我们重新开始、忘掉过去，重新找回自己。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美是宗教", "x": "这种事在一个女人的一生中会发生很多次：身体的某个特征，过去从来没有注意过，现在突然变成了思考、认知、反思、研究的对象。走到这一步以后，人们往往会花几个小时在网上搜索解决方案——要么是美容，要么是医美治疗，然后花钱尝试。但这种尝试总是徒劳的，它也许能让你迅速攀上满意的高峰，最后却总会以不满收尾。要不然，人们就会为没法儿在这类事情上花钱而感到苦恼。毕竟，这套系统就是建立在你的不满之上，因为一旦黑眼圈占据你的思想，就会成为每天反复来袭的烦恼之源。这样你就会不断寻求补救措施。美的宗教不仅认可你的不满足感，也提供一种能解决问题的幻象，但它实际上让你因反复失败而滋长了挫败感，从而滋长了寻找其他方法、其他产品、其他疗法的渴望。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美的宗教仪式", "x": "“美的宗教仪式”向女性许诺了救赎、光明和恩典。为了实现这一切，不仅需要女性为自己的身体、为自己不够美而感到羞耻，还需要她们耻于对自己满意。认为自己很美、不需要改进，就意味着虚荣和自负：在一个承诺会解决问题的世界里，你就不能说你没有问题。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "美的宗教仪式", "x": "信徒在美容院、美发店、香氛店和越来越普及的网店里心醉神迷，但最初的狂喜过后，她们就会意识到，看似是救赎的购买行为正在逐渐失去光环。仅仅满足欠缺感是不够的，她们还需要其他的东西。[插图]她们不仅不能使用劣质乳霜，还要不断尝试新的护肤技巧。毕竟，市场营销真正想要的，从来都不是让一名女性对已有的东西满意。如果她一辈子都用一样的乳霜，经济就没法儿运转起来了。", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "我们为什么喜爱乳霜", "x": "根据沃尔夫的说法，美容产品实际上是在幻觉层面起作用的，它能提供一种别处提供不了的安全感。[插图]", "y": "", "d": "2024-03-21"}, {"k": "h", "c": "追随欲望", "x": "它建立在一种希望之上，即未来会拥有幸福，此刻则是一座泪之谷，因为我们现在所处的时代并不真正值得乐观。", "y": "", "d": "2024-03-23"}, {"k": "h", "c": "美是职责", "x": "美这个问题几乎与美学无涉，而与权力关系密切相关。", "y": "", "d": "2024-03-23"}, {"k": "h", "c": "美是职责", "x": "电视剧《了不起的麦瑟尔夫人》颇具启发性", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "在这部电视剧的第一集，米琪躺在她丈夫身边假装睡着了，但实际上她还没卸妆，头发也梳得好好的，她只是在等丈夫的鼾声响起。当她确信丈夫已经入睡时，才下床去浴室。在浴室里，她终于可以卸妆，涂上晚霜，用卷发器卷好头发。然后她回到丈夫身边躺下，在黎明时分起床，进浴室摘掉卷发器，重新化好妆，钻进被子里，还不耽误和她的乔尔说早安。于是乔尔相信这是他妻子的“自然美”。她在丈夫毫不知情的情况下做了这一切，原样复制了母亲教给她的东西。美是妻子的职责之一，必须在不引起男人注意的情况下完成。那有没有可能，这是一种女性的传承、一种代际间的迷信和取悦丈夫的心愿，而非实实在在的社会要求呢？", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "如果说工业发展使女性有机会独立，可以参与社会生产，那么这一切都在以更严苛的规则运转：让女性一直担心自己犯了错、不得体、不够漂亮，永远面临被驱逐的危险，于是不得不履行自己的职责：保持完美无缺，遵守所有规则，做一个好女孩。她应该无害、可爱、不张扬、永远没有野心。她不该过于显眼。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "这是一种胁迫，比其他任何时代的女性所遭受的胁迫都更难应付，因为这种胁迫让女性相信自己可以做出改变、一切都取决于自己；这种胁迫让女性相信，如果认为美的神话很荒谬，就等于在质疑整套社会秩序。女巫不再被烧死，最多就是让她们清除毛发，穿上体面的衣服。这样一来，她们不仅会受到接纳和欢迎，甚至会受到尊重和爱戴。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "身体是一种动物性的、原始的存在，有待驯服，女巫的衣服也只不过是商场里出售的服装。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "实际上，救赎的第一种手段就是购买。强迫性购物是女性的一种“病态”：永远不知道该穿什么，永远想要新东西。在发达国家，售出的商品中有80%以上是被女性买走的，无论是在什么领域。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "她们几乎将赚来的钱都扔回了市场。她们更少投资，财务独立程度更低，在如何管理财富方面受到的教育也更少。然而，几乎所有的广告都是针对女性的，无论是尿布、家具还是食品。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "女性一方面仍被认为是弱者，是低等的，受到轻视；另一方面又是雇佣劳动、无偿家务劳动、再生产和消费领域的巨大资源。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美是职责", "x": "那些把女性当作目标群体的人不想丢掉女性的认可，也不想损失营业额，他们会寻找新的方法来引导女性产生不满和不快，但总归要促使她们不断购买。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "性别角色", "x": "如果女性主要扮演生育者的角色，如果人口增长对新兴工业领域的经济发展至关重要，那么女性的性行为就必须受到控制。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "女性疾病和医疗", "x": "实际上，生病的女人和死去的女人这类形象频繁出现在文学作品中，很大程度上源自男性凝视", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美的神话为什么会存在", "x": "美的神话不仅涉及女性的脸和身体尺寸，还涉及社会、家庭、工作和性别之间的权力关系。根据我们此前的论述，可以清楚地看到，当女性获得更多自由，威胁到社会经济秩序和男性主导的文化稳定时，美的神话就会传播。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美的神话为什么会存在", "x": "在当今社会，女性的工作举足轻重，这也有可能让女性获得选择权，得以选择如何管理自己的财产、是否生孩子、是否参与政治。因此，引导她们的消费和对生活方式的选择变得至关重要。这样，尽管女性获得了更多的权利，但她们对表现的焦虑也随之增加，她们努力在所有领域达到完美，却始终感到有欠缺、不足和犯了错。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "美的神话为什么会存在", "x": "这一切都事关“凝视”。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "第三章 美、凝视与广告", "x": "他们认为这个女演员虚荣、不贞洁、做作，但矛盾的是，男人首先通过凝视描绘出了女人，然后又在道德层面对她们被描绘的方式进行评判。女性的裸体不再属于展览者自己，而属于观看展览的人。它们是权力的对象和战利品：“成为展品，就是把自己的皮肤和毛发变为展览中必然的掩饰……裸露也是衣着的一种形式。”", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "第三章 美、凝视与广告", "x": "裸像是有活力的，它与权力和生命力相关，与情欲相关。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "第三章 美、凝视与广告", "x": "“画家、观赏者和收藏者通常是男性，而画作的对象往往是女性”。[插图][插图]这一事实必然对想象和文化产生影响：这种权力关系在如何对待自己的形象和身体方面，构建了许多女性的意识。对自我的控制、对身体的监视，还有污名和羞耻也由此而来。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "广告建议我们每个人以多购多买的方式来改变自我或生活。广告说我们只要多消费，就会更富有——虽然我们在花钱后，只会变得更穷。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "这里的问题不是关于选择的自由性，而是关于选择本身——不是自主选择什么，而是在给定的东西之间做选择：不存在选择的自由，不存在鉴别的空间，你只能在近乎无限的选项之间挑选。你没法儿避免购买，只能决定要买这个还是那个。无论如何，你都是一个消费者。[插图]这种奶油和那种奶油之间的选择并不是真正的自由，因为它们出于同一个目的：创造自由选择的假象，实际上却是要混淆行动和选择。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "广告是制造魅力的过程", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "它制造出迷恋、恶意、风格和等级，使观看者被吸引、产生羡慕之心。20世纪70年代起，令人羡慕的状态是广告做出的主要许诺，到今天这种许诺变得更加隐蔽和刁钻：如今，我们中间没有人想挑起忌妒，只想照顾好自己。广告适应、融入这种文化变革，设法通过改变视觉和口头语言，传达相同的信息：只要你选择我们的产品，你也会变得很有魅力。因此，伯格写道，正如视觉艺术一样，“广告关注的是人际关系，而不是物品。它许诺的并非享乐，而是快乐——由外界判断的快乐。这种被人羡慕的快乐就是魅力", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "我想象自己被产品改造，我羡慕自己将要变成的样子，我将变成一个更好的、更完美的版本，我将成为别人羡慕的对象。然后我就能爱自己了。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "广告影像偷去了她对真我的钟爱，再以商品为代价把这爱回馈给她。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "有了摄影和广告，消费社会能够以病毒般的速度进行自我复制，通过影像传播社会对自身的看法和它认为可取的东西。[插图]如果某样东西是值得拥有的，它就会被展示和出售；如果某样东西不存在，就意味着它并不真正重要，不能使你快乐。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "广告将每一种社会共有的希望简化、同质化为内容和产品，再赋予它们可理解的形式、主张和口号，最后把它们转化为承诺。这就是资本主义文化，它仅仅会构建一种希望——通过可购买的产品和服务、各个领域的表现来实现的希望。如果没有广告，资本主义的期许将完全显示出它的浅薄，而产品可以让人快乐的念头显然只是一种幻觉，是一种可笑的、不能相信的东西，一种幻梦。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "要如何运用这种想象去感染那些在大众社会中参与城市生活的人呢？答案是通过批评社会本身，批评它所强加的生活方式——比如，有脂肪团是件令人震惊的事，这主要是现代生活方式下的久坐导致的——但首先是借助广告使观众对自己的日常生活产生不满。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "广告不批评社会生活方式，只批评观众的个人生活方式。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "，广告已经越过了这条界限：我们为你提供不含防腐剂、石油提取物、糖的产品，抗污染的护发产品以及应对气候变化的可再生包装。虽然使用劣质调味剂、香料和原材料的也是我们，但我们建议你做出改进。我们向你许诺，将为这些年推销给你的那些东西补偿你，让你从皮肤和身体的毒素中得到救赎。这些往往都是细微的变化，但是广告放大了它们。广告不谈整个产品的生产过程，只谈哪些方面发生了变化、哪些是可持续的，而这些可能只占一个很小的、微不足道的比例。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "无论如何，广告反复告诉你，你可以做出改进，昨天的错误并不是失败；你能够改变，你的生活方式仍然可以成为幸福的来源。只要你买了他们提供的东西，生活肯定会变得更好，而且毫不费力。因为说到底，他们卖给你的并不是产品，而是观看广告时的那个“你”的有利替代品。广告在你是什么和你希望成为什么之间架起了一座桥，一座你自己无法建立的桥。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "然而，广告不会把你视作一个具体的人，因为它不了解你。哪怕今天它通过收集你的数据创建了一个越来越清晰的档案，它看见的也并不是真正的你，而是你是否符合其测量标准。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "市场化的社会不仅要求我为生计而工作，更重要的是，它要求我花掉所有的收入，不断增加物质需求、提升购买力，积累我认为有用的一切，其中大部分源于异性引起的欲望。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "广告在许诺之下还引起了焦虑。[插图]没有这种产品，你就什么都不是；没有这种产品，你就缺乏力量。你的皮肤不能自行再生，它需要去角质、滋养、呵护、治疗。它需要不断被监测。广告填补了大众社会的意义缺失，也回应了人们对失去一切、一事无成的恐惧。它回应了现状不够好、不够完整的感觉。它回应了表演性社会导致的不满和不幸福感。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "广告", "x": "持续不断地消费实际上是一种源于社会结构的行为，以前并不存在。为什么会产生？因为一方面，我们在这个社会中体验到一种冲突、一种钝痛；另一方面，我们在广告里看到的人已经解决了这种冲突，他们已经站在桥的对面。我们能看到不完美的女性——因为如今广告会向我们展示一些长了妊娠纹的身体，而且不一定是白人——但她们很快乐。她们是绽放的、满足的、迷人的女性，而你却感到疲惫和无力，希望自己也能像她们一样。你生活在现状和期许的矛盾中，但仍有一个补救方法——购买。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "女性气质的奥秘", "x": "这并不是一种强制力，而是要说服女性去达成她们在生物学意义上最真实的愿望：家、亲人、家中的安宁、照料孩子、打理自己的外表。这就是“女性气质的奥秘”。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "女性气质的奥秘", "x": "这一切的目的，是从女孩们的头脑中驱除可以工作、不做母亲、不结婚的念头。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "女性气质的奥秘", "x": "职业女性可能有风险，因为她们太挑剔，太了解自己的购买力。因此，要转为与这些女性交谈，软化她们、安抚她们，利用她们的恐惧让她们感到内疚——她们在家庭之外花了太多时间，忽视了清洁和照顾职责。这样一来，购买就可以用来释放能量、重获平静、获得切实可行的解决方案，并证明女性的事业并没有危及家庭的卫生和幸福，一切都在她们的掌控之中。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "我想知道它是否有效", "x": "正如勒妮·恩格尔恩(Renee Engeln)所述：“我经常看到女性对化妆品广告中的宣传语嗤之以鼻，说这可太愚蠢了。但是，一旦她们的目光在图像里的模特身上停留足够久，很可能就会补充一句：‘我想知道它是否有效。’”[插图]", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "我想知道它是否有效", "x": "我们看着那些完美的身体，忘记了人类身体的多样性", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "我想知道它是否有效", "x": "随着时间的推移，对年轻、消瘦和美丽的向往带来的压力一点儿都没有减少。实际上，压力从来没有像现在这么强大过。[插图]", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "男性凝视", "x": "广告建立在男性凝视的基础之上，因为它是由男性发明的，代表着这个性别对现实的描述。然而，我们不应该觉得男性凝视是指派性别为男的人专属的凝视：男性凝视是“正常”的凝视，也是霸权主义的凝视，是消费社会中每个人都会运用的解读现实的过滤器。它的存在基础首先与权力关系相关，因此它不仅是男性看待女性的方式，也是女性看待自己和其他女性的方式。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "男性凝视", "x": "2020年11月，在“制止暴力侵害妇女行为国际日”前夕，意大利广播电视公司(Rai)第2频道的栏目“说做就做”播出了一段教程，解释如何在购物时保持性感。钢管舞者埃米莉·安杰利洛(Emily Angelillo)展示了怎样穿着高跟鞋在超市过道里翘臀、眨眼、展露诱惑力。她先演示了如何把手放到购物车上，如何移动双腿并保持脖子挺直，然后开始往前走，一边走一边讲解怎样从货架的顶部和底部拿商品，同时诱惑别人、炫耀自己。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "男性凝视", "x": "当聚焦在你身上的凝视如此普遍，当你了解到自己在公共场合的所作所为可以被解释为一种表演时，无论是否愿意，你的行为都会改变。你学会了微笑，避免被人说像是在生气；你会留意自己的头发、妆容和走出家门时穿的衣服；你会改变走路的方式。你努力达到一个足够美的水平，以便被大家接受，又不至于太过分，否则可能适得其反，招致批评或者引起危险。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "男性凝视", "x": "对于女性身体在公共空间中存在的理解，主要在美学和装饰性层面进行。也就是说，它被剥离了政治价值。女性成为在公共空间中活动的公民之前，首先成为一个被观看的对象。", "y": "", "d": "2024-03-29"}, {"k": "h", "c": "文明的身体", "x": "要想让控制工具发挥作用，就必须将其内化：如果你的身体是依据一套你认为不可信的标准被评判的，那么这种污名就不会对你产生影响。然而，当每一幅图像、每一则广告和每一个遇到的人都说你的身体不正常，你最终就会相信这一点，还会真的感觉它出了问题。你会为此羞愧，也会感到自己正在接受评判，然后你会认为这一切都是合理的。￼", "y": "", "d": "2024-03-31"}, {"k": "h", "c": "美的道德价值", "x": "女性逐步取得的社会权力、财富、力量、勇气，都必须优先用于改善外表。女性终于可以做自己了，但“做自己”并不是一个自由空间，可以根据每个人的偏好去设计；它其实是个标准空间，由一系列必须遵守的规则和程序构成。因此，自然美只不过是越来越多人工操纵的结果。", "y": "", "d": "2024-03-31"}, {"k": "h", "c": "饮食失调", "x": "节食文化是一整套教义，它主张瘦也有道德价值，并将瘦与健康联系起来。然而，身体的外观和脂肪的数量未必总是与人的身心愉悦程度和健康挂钩。", "y": "", "d": "2024-03-31"}, {"k": "h", "c": "尺码的诞生", "x": "最开始，成衣的尺码可以根据合身程度进行修改和定制，改动的费用已经包含在其价格中，这样，服装就有了一个比较简单的制作基础。经过反复尝试和试错，每家制造商都建立了自己的尺码系统，然而到1888年底，大型百货公司奥尔特曼的产品目录里，已经只剩下适合“正常体型”女性的衣服了。在很长一段时间里，他们一直使用一套按年龄（12至20岁）和胸围划分的尺码系统。", "y": "", "d": "2024-04-01"}, {"k": "h", "c": "尺码的诞生", "x": "为什么会出现这种变化？原因是在20世纪20年代和30年代，人们意识到，修改尺码意味着巨大的生产成本，也意味着将面临存留大量未售出货物的风险。因此，在有限的尺寸范围内生产相同数量的服装会更加方便。所以有必要开发一些尺码，使之适合尽可能多的客户。", "y": "", "d": "2024-04-01"}, {"k": "h", "c": "尺码的诞生", "x": "到了20世纪50年代和60年代，仍然有可能在商店里修改服装，但费用往往不包括在购买服装的价格里。换句话说，那些拥有非标准身材的人，实际上已经开始付出代价了。", "y": "", "d": "2024-04-01"}, {"k": "h", "c": "尺码的诞生", "x": "结果很清楚：如果说在19世纪改制一件成衣是种常规操作，那么在今天，当我们进入试衣间试穿一件衣服时，一旦意识到它不合身，就会立即认为是自己错了，认为自己拥有一具不正常的身体。", "y": "", "d": "2024-04-01"}, {"k": "h", "c": "虚荣尺码", "x": "在20世纪90年代，虚荣尺码开始流行，这指的是改变服装尺码以满足顾客的虚荣心。换句话说，几十年来，衣服对应的尺码在逐渐变小：20世纪80年代，70厘米的腰围对应的是44码，而在今天，则对应42码。", "y": "", "d": "2024-04-01"}, {"k": "h", "c": "虚荣尺码", "x": "不是让所有的身体正常化，而是操纵人们的虚荣心：不是增加尺码、创造出更大的46码、48码，而是允许46码的身体穿进44码的衣服，只要改变标签就可以了。这样，你就会感到自己“正常”了，然后一直从这里购买服装，买得还更多。这样做的目的是让你穿上比平时的码数更小的衣服，从而激发出一种情绪反应：一种满足感。", "y": "", "d": "2024-04-02"}, {"k": "h", "c": "42码的专制", "x": "男性统治将女人变成象征客体，其存在(esse)是一种被感知的存在(percipi)，所以男性统治的作用是将女人置于一种永久的身体不安全状态，或更确切地说，一种永久的象征性依赖状态：她们首先通过他人并为了他人而存在，也就是说作为殷勤的、诱人的、可用的客体而存在。人们期待她们是富有“女人味儿的”，也就是说微笑的、亲切的、殷勤的、服从的、谨慎的、克制的，甚至是平凡的。而所谓的“女性特征”通常不过是一种迎合男人真实或假想期待的形式，特别是在增强自我方面。所以，对别人（不仅仅是对男人）的依赖关系渐渐变成她们存在的组成部分。", "y": "", "d": "2024-04-02"}, {"k": "h", "c": "衰老与年龄歧视", "x": "“不幸的是，如今我们到处看见50岁的人试图让自己显得像是20岁。她们的脸是陶土色的，戴着成吨的黄金，拿着刺绣的包，穿着雪纺衣服。这是真正的灾难。你必须懂得如何变老，必须去反抗把你变丑的时尚。”", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "隐形的女性与更年期", "x": "月经的结束被视为生育能力的丧失，令人恐惧，因为它意味着女性不能再履行她们的主要社会职能了。“在其他国家，这会让她们获得智者的地位和更大程度的自由，但在富裕国家，绝经这件事仍然是不可见的。”", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "对身体的不满", "x": "女性在身体管理和美容措施方面投入的精神资源远多于男性。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "对身体的不满", "x": "女性的饮食失调情况越来越普遍，是因为她们对身体的不满越来越强烈。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "自我客体化理论", "x": "女性身体经受评判和观察的程度更深，而且女性身体被视为客体。换句话说，女人没有被视为有思想、有感情、有欲望的人，而首先是被视为性对象。她们的身体被分割成碎片，由男性凝视定义。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "自我客体化理论", "x": "伏瓦在《第二性》(Il secondo sesso)中提出的洞见。她这样写道：“女人是由男人决定的，除此之外，她什么也不是；因此，人们把女人称为‘性别’。意思是说，在男性看来，女性本质上是有性别的、生殖的人：对男性而言，女人是‘性别’，因此，女人绝对如此。女人相较男人而言，而不是男人相较女人而言确定下来并且区别开来；女人面对本质是非本质。男人是主体，是绝对，而女人是他者。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "自我客体化理论", "x": "社会感兴趣的首先是女性的身体是否可以被接受、是否符合要求，然后才会关心占据这个身体的女性是谁、在想什么、想要什么、知道什么、想达成什么目标、发展什么技能。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "自我客体化理论", "x": "生活在一种将女性身体当作性对象的文化中，会导致女性也以同样的方式感知自己，将外部观察者的视角内化为对身体自我的主要看法。也就是说，从客体化发展到自我客体化。这个过程会导致女性习惯性地监控（或监管）身体，引发其对自我的羞耻感和厌恶感，导致其陷入焦虑状态和与外表相关的负面情绪，进而导致她们放弃工作和重要的个人机会，放弃有意义的经历。这种态度会对女性的心理健康产生影响，可能导致单相抑郁症、性功能障碍和饮食失调。实际上，它对 ": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偏见", "x": "然而，拉塔伊科夫斯基让我透过她的视角，看到了另一个故事：一个人天生就拥有符合当前审美标准的身体，但也没有过上幸福的生活。那么，拥有一具这么多人渴望拥有、想要主宰的身体，究竟意味着什么？", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偏见", "x": "拉塔伊科夫斯基在书中明确表示，她凭借自己的身体，在一个由男性构建的资本主义世界里获得了好处：“在这个世界里，美和性的吸引力之所以具有价值，仅仅是因为它们迎合了男性凝视。”", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偏见", "x": "不管在什么情况下，一个人都能适应一场由别人决定、规则由外界强加的游戏。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偶像会幸福吗", "x": "一个表面上健康、快乐、成功的女人实际上已经被美的神话摧毁了，她不知道该怎么吃东西，仅仅是想到要在世人面前裸露自己就感到痛苦，一种致人瘫痪的不适感让她动弹不得。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偶像会幸福吗", "x": "年龄污名", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偶像会幸福吗", "x": "黛米·摩尔说，直到最近几年，她才终于从惩罚性的训练计划和必须挨饿的想法中解脱出来，不再以瘦到什么程度来衡量自己的成就：“从有记忆开始，我就一直试图主宰和控制自己的身体。很长时间以来，这是我唯一能控制的东西。因为我意识到，保持这种体重是保护自己的一种方式。我在每天的祷告里增加了一句话：‘愿我有勇气在不健身的情况下被人看见。’我不能再继续战斗下去了，我必须与自己的身体和体重和平相处。”", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的偶像会幸福吗", "x": "美和快乐之间的相关性非常微弱：快乐的人社交能力也很强，同时拥有更牢固的爱情和友谊。但这些人并不比其他人做更多的运动，也不比别人更美；既没有更投入宗教生活，也没有遇到更好的重大事件。如果一定要说快乐的人有什么不同，实际上他们有一套正常的情绪系统，能够对生活中的事做出适当的反应。因此，美商并不能真正改善我们的生活，美的神话会给所有人带来痛苦和不快乐，甚至包括在我们眼中已经被幸运女神亲吻过的那些人。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "女性的收入普遍低于男性，但她们在美容产品、美容护理和治疗方案上花掉的钱更多。部分原因是，她们在公共场所展示自己的方式会影响到别人如何对待她们。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "平均而言，女性报告的花费是男性的3倍之多。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "除了花费金钱，我们还花费了时间、情绪和精力，幻想以此得到更多的个人权力。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "归根结底，美容产品领域的消费差异代表了一种延续下来的习惯：对许多中世纪女性来说，化妆品和自然疗法是伟大的解放工具，也是表达智慧和权威的方式。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "鲁宾斯坦最著名的一句话“没有丑女人，只有懒女人”让美再次成为一种道德价值，成为权力和行动能力的标志，却没有对社会机制提出质疑。如果说，女性把美容当成一种提升社会阶层的工具（这毕竟是可以让她们从事相关职业甚至创业的少数领域之一），那么为了达成目标，她们就必须再次巩固公认属于女性的那些行为模式，甚至在制定营销策略时也不例外。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "当然，我们并不是要把一切都妖魔化，而是要看清其中的复杂性。这里的重点是，一方面女性的收入普遍低于男性（性别薪酬差距），另一方面女性在非基本需求品上的开销更大。我们用这类东西来使自己“拿得出手”，使我们在实际很累的情况下也不会显得很累，使针对性别的评判和负担得到缓解。我们中的大多数人不化妆就没法儿出门，美国女性平均每天要花55分钟来做准备，一年下来就是近两个星期。从这个视角来看，化妆和美发并不是自我护理的工具，而是一种文化层面的义务。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "我们很难把“出于喜欢和主观意愿使用的东西”与“觉得有义务购买的东西”区分开。化妆品行业很清楚这一点，所以它不断提价，并且把每种乳霜的使用范围定得越来越具体，尽管这些商品往往只是在产品名称和包装上有所变化。由此带来的矛盾是，那些真正的基本需求品，比如卫生巾，在意大利却被当作奢侈品征税。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "我们花了多少钱", "x": "另一方面，客体化和自我客体化导致身体被分割成越来越小、越来越孤立的部分，这又使各种治疗手段和要关注的东西成倍增加。美容行业一直在为我们过去不知道的问题提出新的解决方案。只要想想现在有多少人文眉就知道了，这个市场的出现就是为了给美容行业自己创造的问题提供一个解决方案：过去，当超细眉流行的时候，成千上万的人用镊子把眉毛拔掉，直到它们不再生长。而在这种时尚消失之后，她们每天早上又要用新的技巧画眉毛。于是，为了不必一直画，文眉就成了一种可行的解决方案。另外，越来越多的人使用含有前列素的睫毛增长液，为的是让睫毛变长；前列腺素对治疗炎症和眼压过高都有帮助，但作为化妆品使用很危险", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美容医学和整形手术", "x": "我们很难辨别身体控制、种族主义凝视、个人选择和市场社会，而如果先验地判定服从什么是正确的或是错误的，又会把问题简单化。我们仍然能看到人们怎么评判过度整容、破坏自然美的那些女性。但这也是一个虚构出来的、不断变化的想法，因为随着时间的推移，“在那些被定义为‘自然’的东西和非自然的东西之间，界限已经逐渐发生了变化”。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的神话之于男人", "x": "在男人生活的世界里，人们更欣赏他们能做什么，而不是他们如何展示自己。外界的评价不仅影响到一个人如何被世界看待，也影响到一个人如何看待自己。这就能解释，为什么这么多女性花费了大量的时间来决定她们在上学的第一天或工作的第一天，以及在公共活动中、自己的婚礼上或者其他人的婚礼上该穿什么。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的神话之于男人", "x": "在男性身上，同样出现了自我客体化操纵方式的改变。根据美国的一些研究，在不到三十年的时间里，由于广告传递的信息强调体力和性支配力，对自己身体不满的男性比例比之前增加了两倍。[插图]男人不该显得瘦弱，而应该强壮、肌肉发达、敏捷、有活力。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的神话之于男人", "x": "如果说在此之前，男性的体毛与阳刚气概相关，那么从现在开始，阳刚的、文明的男人必须拥有光滑的皮肤和浓密的头发。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "第八章 美之谜", "x": "此时此刻我们不禁要问，我们称为美的东西是否真的存在？有什么东西或者什么人，能在客观上被判定为美的吗？是不是既存在真正的美，也存在虚假的美？我们作为人类偶然体验到的美感是真实的吗？抑或这种“美”仅仅是我们为一种转瞬即逝的感觉起的名字？", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "第八章 美之谜", "x": "说到底，对美的哲学思考始终是在尝试捕捉并阐释某种感觉，通过语言来描述一种情景、一件物体或者一个人所传达出的能量和情感。这种能量几乎从来都不是一个绝对值，但它一直提供了一个发现自我和自己身份的良机。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "第八章 美之谜", "x": "美学是一门关于感觉的科学", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "第八章 美之谜", "x": "它与我们借助感官所感受到的东西有关。因此，它不是关于判断的，而是关于感觉的。换句话说，追问自己什么是美，就意味着努力去理解我们是谁、什么会触动我们、什么会让我们感动。美给我们带来冲击，提醒我们此刻置身于世界之中，而这世界既可以让人惊奇万分、赞叹不已，也可以让人无话可说。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "第八章 美之谜", "x": "现在就让我们夺回对美的解释权，说出我们热衷的、催生我们渴望的和吸引我们的东西，不要去理会世人怎么说。我们要放弃这个念头：只存在一种美的范式和途径。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "关于美，是否存在共识", "x": "安伯托·埃科(Umberto Eco)认为，美——人之美、自然之美，还有神、圣人和思想之美——从来都不是绝对不变的东西，而是在不同的历史时期和不同的国家，呈现出不同的面貌。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "社交媒体和美的标准", "x": "我们总是被迫知晓自己在镜头中的样子。我们的脸出现在个人简介的照片里，出现在被别人拍摄并标记的照片里（而在这些照片里，我们的样子总是糟糕透顶），也出现在谷歌搜索的结果里。无论在哪里看见自己的脸，我们都会注意到自己和几年前相比已经老了多少、眉毛多么不对劲、唇部的线条多么不流畅。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "社交媒体和美的标准", "x": "我们已经看到，承担后果的不只是那些不符合美的标准的人，而是几乎所有人。这种海量的暴露，不光影响到发布照片的人，也影响到那些仅仅浏览别人照片的人。当我们在Instagram上看见一张照片的时候，很难不做出价值评判——针对这个人，针对他们选择以什么方式表现自己，也针对他们是否比我们更美。但重要的是，我们无须否认这种评判，也无须责怪自己：是我们看待事物的方式促使我们做出了评判。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "社交媒体使人情绪低落", "x": "根据另一项研究，无论是女性还是男性，长期使用社交媒体都会催生客体化的身体意识，这反过来又形成新的刺激，增加身体羞耻感，减少性自信。客体化的身体意识和身体羞耻之间存在联系，这在女性身上表现得更为明显，但是身体羞耻和性自信之间的关联似乎没有体现出性别差异。因此，根据这项研究，社交媒体让人们以外部观察者的视角最大程度地体验自我，从而对人的身体形象和性自信产生影响，无论是女性还是男性。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "社交媒体使人情绪低落", "x": "为了对抗社交媒体上的失真、伪造和毒性正能量，女演员、女模特和意见领袖开始越来越多地展示自己的真实状态，同时谴责限制性过强的标准：发布不带滤镜的自拍、长有痤疮的照片以及在绝望和不快乐的状态下拍摄的照片，来表明这些才是正常情况，并不需要隐藏。但是，这就够了吗？", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "社交媒体使人情绪低落", "x": "这种反叛实际上是被驯化过的，它们丝毫没有对整个结构形成挑战，反倒饲养了社交媒体，因为它们创造了一种社会化“参与”：“对一个系统的抵抗发生在系统设定的条件之内。”[插图]这位加拿大作者认为，技术实际上降低了我们的对抗性，最大化地提升了我们作为市场上的商品的能力，并且不会触及关键的社会不平等问题：性别医学、最低工资、托儿服务的匮乏和政治代表权——这些才是事关女性处境的紧迫问题，但很难在Instagram上得到体现。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "社交媒体使人情绪低落", "x": "每天都有女性一边在社交媒体上展示自己，一边为乱糟糟的头发、黑眼圈、疲惫的脸、脱落的指甲油或者身体浮肿道歉，要不然就是为没有化妆或者穿着睡衣道歉。她们为自己不太体面的形象道歉，因为她们对脂肪、身体、粗大的毛孔、打结的头发怀有焦虑。这种焦虑相当牢固，既不会消失，也不会被抹去。所以要么预先做出声明，要么使用滤镜——它或多或少地起到了化妆的作用，能帮我们掩饰疲劳、黑眼圈和皱纹，但这样做的代价很高：我们总会感到不真实。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "身体技术", "x": "身体技术也与性别有关：根据所属的性别，我们会有一套特定的自我展示方式，性别也左右了我们“希望”以何种方式展示自己。有多少次，你看到一个女人对照片不满意，要求再多拍几张？", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "面对它，我们如何才能在谈论美的同时不陷入美的神话？", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "我们生活在一个积极的社会里，一切都在被驯化，所有反抗都变得无害，平滑的伦理观占据主导地位。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "我们应该试着重新夺回对美的解释权，它应该更像一种质询，而不是一个肯定的答案。美是一个秘密、一种直觉，是在越发可测的世界中打开的一道裂缝。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "美能够打破表演性社会的体系，而不为这套体系服务。如果说社会给一切都标了价，那么，美并不具备消费、透明和空虚等特征", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "在这一波刺激下，真正的美消失了，取而代之的是一种虚假的美，其本质是消费。对美的消费就是对身体的消费，是身体商业化的结果：毕竟，这些都是资本主义的产物，是它向我们展示了什么美、什么不美。它为我们提供了一套美的模式，要求我们不再向别处找寻美。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "美的神话是表演性的，因此它不具备隐秘性，它的手段就是它的目的。表演性社会利用沟通和效率来创造更多的沟通和更高的效率，它不影射任何超越它的东西，只复制别的表演。它不是达成更高目标的工具，而是目标本身。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "正因为如此，我们需要认真考虑一种摒弃了消费的美。正如叔本华所写：“美带来的审美乐趣很大程度上在于，我们进入到纯粹的沉思状态，暂时摆脱了所有的意志活动。也就是说，摆脱了所有的欲望和焦虑，就好像从我们自己之中解脱出来一样。”", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "它是一种有活力的、有生命力的形式", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "美是自由的、真正独立的；它不是商品，不能被消费、被宣传、被拥有；它不会引起无聊和不满", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "今天被我们定义为美的东西，是那些能创造参与感和流量、能触发点赞和分享的东西，也就是能引起关注的东西。哪怕不再接受瘦这种模式，我们也仍然会落入某个目标消费群体：只要继续将美与消费需求联系在一起，就会有其他更受欢迎的模式提供给我们，也会有其他类型的模特出现——她们会拥有和我们更相似的身体和更接近的特征。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美的救赎", "x": "在今天，美总是以产品的形态出现，且必须被迅速消费掉，并立即让人感到愉悦。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "第九章 如何冲破牢笼", "x": "只需要记住有多少图像经过了修改，有多少标准是错误的；记住每个人都有权以本来面目受到尊重，无论他们具备什么特征。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "媒介素养", "x": "面对修饰过的照片，唯一可能的解决方案是合上杂志、停止关注社交账号、取消订阅让我们不快的那些新闻推送。换句话说，就是远离。如果媒体图像被设计得极其强大，那么限制它们的唯一办法就是不要接触它们，即改变你的媒体信息摄入习惯。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "你现在的样子很美", "x": "近些年出现了大量的广告营销活动，力图让女性确信自己的美。然而，这些举措背后至少隐藏了两个关键事实：第一，美仍然处于这些广告话语的中心；第二，其最终目的始终是销售产品。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "你现在的样子很美", "x": "去观察自己，而不要自我评判", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "功能状态", "x": "有人问男性和女性对身体的看法有什么不同，答案是男性有一种功能主义的倾向。也就是说，他们把身体看作执行某些功能的工具，而不是装饰的对象。男性将身体视为一个整体，而不是需要修改和调整的一系列独立元素。他们更关注身体的能力而不是外观：我的身体能做什么？我可以让它变得更强大吗？事实上，在英语里，表示男性美的形容词是“handsome”，它来自“handy”，表示“具有功能的、实际的、有用的”。而女性已经习惯了被看作、被表现为、被讲述为零散的碎片。最终，她们也感知到自己是零散的碎片。这不仅仅是对身体的感知，也是对身份的感知。我们感到自己支离破碎、充满冲突和矛盾。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "欣赏自己身体的特殊性和独特性", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "运动无须以改变外表为目的，只需要关注它带来的感觉以及它对健康和总体幸福感的影响。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "仔细选择服装，应该选那些不会分散注意力，让你感觉良好、行动自如且不会招致身体监控的衣物", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "避免谈论和抱怨一些话题，包括你有多胖或者有可能变胖（肥胖谈论）、你有多老或者有可能变老（老龄谈论），以及你有多丑（消极身体谈论）。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "我认为答案在于自我照护", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "我们需要将注意力投入到情感、欲望、才华、计划中，尝试恢复被美的神话削弱的感知力。自我照护关系到我们设定的人生意图，即更好地采取行动；它同样关系到一种觉悟：照顾好自己意味着照顾好身边的一切，从而也照顾好我们的行动对他人产生的影响。换句话说，自我照护意味着为自己的存在赋予意义，并追寻自己的激情。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "当一个愿望、一种志向、一个模糊的念头变成了一个项目、一条可以遵循的路径、一个方向时，你就会感到幸福。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "培养积极的自我形象", "x": "人人都有不同的愿望、优先事项和价值观，这些都有可能在生命历程中起变化。我们需要真诚地告诉自己这些东西是什么，并且要将尽可能多的时间花在这些事物上。绽放的过程需要沃土，也就是充分的注意力，它能让人辨认出那些蓄势待发的东西，以及有时候难以预测的东西。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人对抗另一些女人", "x": "如果两个男人为得到同一份工作而发生冲突，他们或许会被认为过于自信、过于凶悍，但不会被斥为疯狂或者同性相争。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人对抗另一些女人", "x": "姐妹情谊就很难被尊重。事实上，女性经常被视为彼此的敌人。因此在社交媒体上，很多对女性形象的评判都是其他女性写下的。然而，这种行为背后的原因要从社会系统中寻找，正是这套系统让我们相信权力、知名度和快乐都是稀缺的。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人对抗另一些女人", "x": "身为女人，我们一直被教导要把“另一个女人”看成潜在的敌人，永远不能完全信任她。数千年来，男人们都在描绘恶毒的、充满诱惑力和欺骗性的女性形象，这也促使女性从其他女性身上寻找不完美、失衡和夸张之处。一个幸福的女人会引起你的忌妒，迫使你非要找出她的问题、隐藏的东西和弱点。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人对抗另一些女人", "x": "它向我们预示一种使现有生活岌岌可危的威胁，会让我们立刻产生警觉：一个更漂亮、更年轻、更有魅力的女人可能夺走我们的伴侣、追随者的注意力、我们的工作、孩子的爱、朋友的陪伴。于是我们将其他女性客体化，并且开始评判她们，这成了一种自我保护的方式。这样一来，我们在看起来更光芒四射的那些人面前就不会感到低人一等。说到底，就是另一个女人激起了我们的紧张感，我们又把这种紧张转化为忌妒、蔑视和恼怒。会有这种紧张感，往往是因为我们从她身上看到了强大的力量，而我们自己似乎缺乏这种力量。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人对抗另一些女人", "x": "我们必须重新获得表现自己的力量，不要竞争，不要操纵，不要在别的女性周围制造焦土，以占据她们的位置。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人和另一些女人站在一起？", "x": "我们应该告诉其他女性，她们富有创造力和个人兴趣，我们欣赏她们的投入和努力，她们对我们是一种激励，这非常重要。我们不应该把美置于判断的中心", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人和另一些女人站在一起？", "x": "我仍然会告诉女儿她很美，因为我在她身上看到的东西与标准无关，我看到的是她所传达的能量，是她本身，是她的光和她的个人力量", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "一些女人和另一些女人站在一起？", "x": "同样地，我们没必要因为喜欢美和感到美而感到羞耻，只因为害怕受到指责，或者被看作虚荣、傲慢、不切实际的人。也没必要说自己身体的坏话", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "美是关联", "x": "鼓励我们培养生活体验，让我们感到自己在绽放，为我们提供追随天分的信心。当我们能感受到心流时，美就产生了。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "结语", "x": "如果你不愿意漂亮，就不必漂亮／这不是你的职责。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "结语", "x": "女性有一个坏习惯，就是时不时地掉进井里，让自己陷入巨大的忧郁中，一边被它淹没，一边又急于浮上水面：这就是女性真正的麻烦所在。女性往往会为这种麻烦而感到羞耻，还会假装自己没有麻烦，假装精力充沛、自由自在，稳步走在大街上，戴着大帽子，穿着漂亮衣服，涂着口红，显出一种果决、蔑视的神色；但我从来没见过哪个女人身上完全没有痛苦和引人怜悯的东西，而这些都是男人没有的；她们始终面临一种掉进巨大暗井的危险，这种东西恰恰来自女性气质，也许来自屈从于奴役的古老传统，想要克服它并不会那么容易。", "y": "", "d": "2024-04-03"}, {"k": "h", "c": "结语", "x": "当你掉进井里的时候，肯定也知道，快乐并不十分重要：重要的是当你从井里爬上来的时候，已经知晓了你所知的一切。", "y": "", "d": "2024-04-03"}]}, {"id": "3300016646", "title": "可能性的艺术：比较政治学30讲", "author": "刘瑜", "cats": ["政治军事-政治"], "bmCount": 127, "rvCount": 4, "notes": [{"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "我们又不得不试图理解政治，这不仅仅是因为——如亚里士多德所言，“人是天生的城邦动物”，而且因为政治中有我们命运的源头。水手在大海上航行，努力练习航海技术，掌握气象地理知识，储备粮食物资，殊不知，最能影响这场航行成败安危的，不是水手的智识，而是大海本身的“脾气”。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "人类从呱呱坠地那一刻起就被政治“绑架”，它是我们所有人脚下看不见的大海，是我们必须穿越的看不见的暴风骤雨。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "“比较”是为了抽离，而抽离是为了在另一个高度反观。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "由于政治的易燃、易爆性，这本书注定是一场智识的冒险，但我仍然奢望，对于读者，它同时也是一场发现之旅，能够呈现一些不同的风景，埋下一点挥之不去的好奇。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "“可能性的艺术”这个说法，来自俾斯麦的一句话：“政治是可能性的艺术。”我很喜欢这句话，因为它通过“艺术”这个词表达了政治的力量，又通过“可能性”这个词表达了政治的限度，所以我把它用在了课程的标题里。", "y": "", "d": "2026-05-01"}, {"k": "t", "c": "序言 可能性的艺术：通过比较理解政治", "x": "“可能性的艺术”这个说法，来自俾斯麦的一句话：“政治是可能性的艺术。”我很喜欢这句话，因为它通过“艺术”这个词表达了政治的力量，又通过“可能性”这个词表达了政治的限度，所以我把它用在了课程的标题里。", "y": "可能性是政治的边界（不能超越现实为所欲为），艺术是政治的智慧（可以主动创造）。", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "我的理解是，比较政治学当中的“比较”，与其说是一种具体的研究方法，不如说是一种研究的视野。当你把你所面对的政治现实当作一万种可能性之一来对待时，你就获得了一种“比较的视野”。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "“只懂一个国家的人不懂任何国家。”", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "不仅仅是学者，即使是普通人日常生活中的思考，也往往需要通过比较发现问题、打开思路，因为比较产生冲击，冲击带来思考。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "了解这些观点的存在，对于开阔我们的视野非常重要。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "什么是社会科学的洞察力？它首先是把熟悉的事物陌生化的能力，把句号变成问号的能力，把“此时此刻”和无数“他时他刻”联系起来的能力。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "政治在社会中。什么叫“政治在社会中”？就是社会条件构成政治选择的半径，也影响政治选择的结果。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "相似的政治理念，放到不同的社会文化土壤当中，发生了完全不同的“化学反应”。这就是“政治在社会中”。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "比较政治学思考的核心任务：在差异中寻找规律。", "y": "", "d": "2026-05-01"}, {"k": "h", "c": "序言 可能性的艺术：通过比较理解政治", "x": "世界是复杂的，但又不是随机的，知识也应当如此。求知的道路，意味着永恒的疲倦以及偶尔的惊喜。", "y": "", "d": "2026-05-01"}, {"k": "t", "c": "序言 可能性的艺术：通过比较理解政治", "x": "世界是复杂的，但又不是随机的，知识也应当如此。求知的道路，意味着永恒的疲倦以及偶尔的惊喜。", "y": "喜欢这篇序言", "d": "2026-05-01"}, {"k": "h", "c": "1. 政治比较的维度", "x": "如果仔细观察，我们会发现，那些在幸福指数上排名靠前的国家，大多数在政治体系方面靠近丹麦，而那些人民幸福感不强的国家，大多数在政治体系上更靠近布隆迪。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "1. 政治比较的维度", "x": "民众要求增加产假时间，政府就延长了产假时间；", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "1. 政治比较的维度", "x": "也就是说，别说征45%的税了，就是征你的命你也没办法。所以秦朝2000万人口，可以强征50万人去修长城、70万人去修阿房宫，这样的国家，国家能力的确很强大，但是我们愿意生活在这样的国家里吗？恐怕除了秦始皇本人，没有人愿意。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "1. 政治比较的维度", "x": "你所见到的只是现象，而现象未必是真相。可能我思考得越多，就越相信，智慧的本质就是对事物比例的公正判断。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "2. 和平的“爆发”：一个黄金时代？", "x": "在历史上的大多数时期，战争是常态，和平是例外，但在冷战结束后的今天，和平是常态，战争才是例外。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "2. 和平的“爆发”：一个黄金时代？", "x": "叫《人性中的善良天使》——这可能也是21世纪最重要的书之一。大家可能听说过一个词，叫作“政治性抑郁”，这本书可以说专治各种“政治性抑郁”。反正每次翻这本书，我整个人就都变好了，连血糖、血脂都刷刷下降了。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "2. 和平的“爆发”：一个黄金时代？", "x": "大家可能都看过《权力的游戏》，都知道这个电视剧有多么血腥。很多人不知道的是，《权力的游戏》中的大量情节其实是基于真实历史的改编，作者马丁自己也表示，他的故事原型很多地方是受到英国金雀花王朝历史的启发。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "2. 和平的“爆发”：一个黄金时代？", "x": "如果问题是主流，那么我们应该关注的重点就是“人类做错了什么”，但是如果进步是主流，那我们更应该关心的是“人类做对了什么”，从中找到进一步解决问题的钥匙。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "2. 和平的“爆发”：一个黄金时代？", "x": "衡量现实不能仅仅以理想为尺度，而且要以历史为尺度，因为摧毁进步的不仅仅可能是所谓的保守势力，而且也可能是对完美乌托邦的迷恋。用英语中的一个常用句来说就是：不要让最好成为更好的敌人。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "3. 天下与我：国际格局的多米诺骨牌效应", "x": "直到第七次反法同盟彻底打趴了拿破仑。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "3. 天下与我：国际格局的多米诺骨牌效应", "x": "在他眼里，美国当了几十年的世界警察，自备干粮，四处巡逻，有人打911就得风雨无阻地赶到，没人打911，也一厢情愿地赶到。", "y": "", "d": "2026-05-13"}, {"k": "h", "c": "4. 全世界有产者联合起来？全球化的经济后果", "x": "中国民工拼命干活、一天上班十几个小时、住十几个人一间的宿舍、一年到头回家一次、把孩子扔在农村做留守儿童……难道真的仅仅是因为他们特别热爱劳动吗？还是因为在资方面前，他们太弱势，没有谈判能力？而这种权力不对称是否公正、是否值得效仿？", "y": "", "d": "2026-05-21"}, {"k": "h", "c": "4. 全世界有产者联合起来？全球化的经济后果", "x": "市场竞争是残酷的，但是，当它带来生产率的提高，帮助无数人脱离贫困，激发人的创造性和奋斗精神，它或许又代表了另一种人道主义，一种更深的人道主义。在一个国家是这样，在全球范围内又何尝不是如此？", "y": "", "d": "2026-05-21"}, {"k": "h", "c": "5. 为什么瑞典也如此排外？全球化与文化反弹", "x": "有研究指出，“高税收、高福利”的经济模式之所以出现于北欧，一定程度上得益于它同质性的人口结构——正是因为彼此文化、语言、宗教接近，才产生了深厚的社会信任，使得人们愿意交出很大一部分收入来扶助那些穷困潦倒者", "y": "", "d": "2026-05-21"}, {"k": "h", "c": "5. 为什么瑞典也如此排外？全球化与文化反弹", "x": "如果人类已经文明到开始推动“动物保护主义”，又怎么能对同为人类同胞的难民见死不救？", "y": "", "d": "2026-05-21"}, {"k": "h", "c": "6. “历史终结论”的终结？(1)", "x": "这是1974年葡萄牙政变的发动时间。据说，当时发动政变的军官们约好，以广播台开始播放某一首歌曲为政变信号，于是，这首歌的播放时间，被亨廷顿定义为第三波民主化浪潮的起点。", "y": "", "d": "2026-05-23"}, {"k": "h", "c": "6. “历史终结论”的终结？(1)", "x": "民主化本质上是从权力垄断走向权力竞争。", "y": "", "d": "2026-05-23"}, {"k": "h", "c": "7. “历史终结论”的终结？(2)", "x": "毫无疑问，在许多国家，人们的耐心尚未匹配其愿望，民主的“技艺”抵达不了其决心，理想主义激情常常淹没现实主义策略，因此出现了广泛的民主衰退现象。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "人类常常有一种倾向，就是把自己这一代人所遭遇的困境，当作历史上前所未有的挑战，因而每每夸大它的重量与高度。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "提到法国革命的时候，我们经常能听到一些很美的月份名称：雾月、果月、芽月、牧月等，据说这是专门找了一个诗人来取的名字，表达法国摆脱宗教束缚、向“大自然”回归的革命精神。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "人们放弃自由的时候从来不是因为热爱专制这种“恶”，而是因为人们在热爱自由的同时相信有更高的善值得追求，比如平等，比如正义，比如认同，比如面包，比如救亡，以至自由作为次要的善可以“暂时”被舍弃，从而换取那个更高的善。甚至这种“交换”可以被表述为：牺牲暂时的自由来获得长远的自由，牺牲形式的自由来获得实质的自由。这或许可以被称为政治当中的“善恶捆绑销售”原则。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "在任何国家，面对民众，恶都是很难被推销的。打压异己、剥夺自由是一种恶，直接推销它很难奏效，但是，当恶与善捆绑出现，人们却有可能为它慷慨解囊。", "y": "", "d": "2026-05-24"}, {"k": "t", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "在任何国家，面对民众，恶都是很难被推销的。打压异己、剥夺自由是一种恶，直接推销它很难奏效，但是，当恶与善捆绑出现，人们却有可能为它慷慨解囊。", "y": "剥夺自由是一种恶，但因为它被包装成某种“更高的善”的必要代价，推销的阻力就降低了。实际上我们可能两者都失去了。", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "民主的智慧来自演进的可能，而演进需要试错的空间。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "民主是关于如何产生执政者的规则的，而自由则是关于如何限制执政者的规则的。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "遗憾的是，学习民主可能比学习自由要容易得多，因为前者是一种制度，而后者是一种习俗。制度改写易，移风易俗难，这种不对称或许正是为什么新兴民主常常掉入“不自由民主”的陷阱。", "y": "", "d": "2026-05-24"}, {"k": "h", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "遗憾的是，人类政治文明的变迁没有捷径，它必须穿过千千万万人的心灵。", "y": "", "d": "2026-05-24"}, {"k": "t", "c": "8. 法国往事：转型浪潮中的第一艘泰坦尼克号", "x": "遗憾的是，人类政治文明的变迁没有捷径，它必须穿过千千万万人的心灵。", "y": "每一次真正的进步，都依赖于千千万万个体在内心深处完成一场观念革命，这是一个漫长、艰难却又无可替代的过程。\n这句写得真好，既有理性的冷酷，又有人文的温度。", "d": "2026-05-24"}, {"k": "h", "c": "9. 埃及：从“阿拉伯之春”到“阿拉伯之冬”", "x": "并不存在作为整体的人民，只有形形色色的群体。", "y": "", "d": "2026-05-25"}, {"k": "h", "c": "9. 埃及：从“阿拉伯之春”到“阿拉伯之冬”", "x": "只要一个社会存在着阶层之分、存在着观念之分，就不可能存在着万众一心的“人民”。", "y": "", "d": "2026-05-25"}, {"k": "h", "c": "9. 埃及：从“阿拉伯之春”到“阿拉伯之冬”", "x": "对于民主转型，推翻威权政府只是民主革命的上半场，克服社会撕裂则是民主转型的下半场。对于很多国家，下半场比上半场还要艰难。这或许是因为，推翻威权政府只需要推翻一个统治集团，而克服社会撕裂则需要所有阵营同时保持克制。某种意义上，这是一场只有起点但没有终点的马拉松，每一代人接过接力棒时，都需要以其勇气但尤其是以其宽容，重新证明自己能够承受自由的重负。", "y": "", "d": "2026-05-25"}, {"k": "h", "c": "10. 南非：转型何以软着陆？", "x": "民主运转起来并不需要全社会就所有重大问题达成共识，不需要“万众一心”，但是它需要人们就“如何对待分歧”达成共识。这就像足球赛，比赛双方可以对抗，甚至激烈对抗，但是他们需要遵守共同的游戏规则", "y": "", "d": "2026-05-28"}, {"k": "h", "c": "10. 南非：转型何以软着陆？", "x": "对于民主运行来说，这个“共同的底线”是什么？可以用两句话来概括：胜利者保持宽容，失败者保持耐心。", "y": "", "d": "2026-05-28"}, {"k": "h", "c": "10. 南非：转型何以软着陆？", "x": "不要小看这些象征性的行为，看似平淡无奇，放在一个国家领导人身上，就可能因为他所拥有的巨大影响力而具有乘数效应。也不要觉得一个领导人作作秀还不简单，事实是，作秀会为他赢得很多人心，也会让他失去很多人心。", "y": "", "d": "2026-05-28"}, {"k": "h", "c": "10. 南非：转型何以软着陆？", "x": "从这个角度来说，曼德拉、德克勒克这样的人，是真正的政治家，而不仅仅是政客或者官僚。他们头顶一堆盘子，脚踩滑轮，小心翼翼地去穿越一条细细的钢丝。", "y": "", "d": "2026-05-28"}, {"k": "h", "c": "11. 印度：民主为什么“不管用”？(1)", "x": "民主当然很重要，它通过将协商精神嵌入决策程序而体现出对普通人的尊重，它给权力套上缰绳，要求执政者平视而不是俯视民众。", "y": "", "d": "2026-05-30"}, {"k": "h", "c": "11. 印度：民主为什么“不管用”？(1)", "x": "因为如果有一个制度按钮按下去可以一劳永逸，那真是对人性之复杂以及复杂之美的蔑视。", "y": "", "d": "2026-05-30"}, {"k": "h", "c": "12. 印度：民主为什么“不管用”？(2)", "x": "当制度的发展超前于文化，文化必然会以暗度陈仓的方式去把规则悄悄地扭曲为潜规则。", "y": "", "d": "2026-05-31"}, {"k": "h", "c": "12. 印度：民主为什么“不管用”？(2)", "x": "很多时候，社会和政府同样不可信任，“表亲的专制”和政府的专制同样残酷，但是，区别在于，作为社会的一员，我们有机会去改变社会，而当权力被垄断，我们却很难改变政府。", "y": "", "d": "2026-05-31"}, {"k": "h", "c": "13. 伊拉克：铁腕强人是救星？", "x": "真正的救世方案，不是某个政治强人的铁血政策，而是不同的社会群体，不论民族、教派、阶层、党派，真正理解“和而不同”之道，艰难地学习如何与不同的人，哪怕是所仇恨的人，共同生活在一起。", "y": "", "d": "2026-05-31"}, {"k": "h", "c": "14. 什么是国家？从墨西哥的毒贩集团说起", "x": "马克思的说法：“国家是阶级统治的暴力工具。”", "y": "", "d": "2026-06-03"}, {"k": "h", "c": "14. 什么是国家？从墨西哥的毒贩集团说起", "x": "国家是什么？国家是特定疆域内合法地垄断暴力的机构。", "y": "", "d": "2026-06-03"}, {"k": "h", "c": "14. 什么是国家？从墨西哥的毒贩集团说起", "x": "直观而言，暴力要从分散走向垄断，面临着两大难题：第一是权力的集中化难题，也就是“谁当猴王”的问题；第二是领土范围的清晰化难题，也就是“猴群的势力范围”问题。前者是一个暴力垄断如何获得内部承认的问题，后者则是一个暴力垄断如何获得外部承认的问题。", "y": "", "d": "2026-06-03"}, {"k": "h", "c": "15. 为什么要“重新带回国家”？比较政治学的轮回", "x": "同时获得外部和内部承认的、稳定的暴力垄断是一种人为的建构", "y": "", "d": "2026-06-07"}, {"k": "h", "c": "15. 为什么要“重新带回国家”？比较政治学的轮回", "x": "也恰恰因为它是一种人为的建构，不是一种自然状态，这个过程艰难、脆弱，甚至可以说是一场永恒的逆水行舟。", "y": "", "d": "2026-06-07"}, {"k": "h", "c": "16. 国家能力从何而来？战争", "x": "密集战争，催生了欧洲各国的常备军建设、财政国家建设、官僚体系建设。这就是“战争缔造国家”的机制。", "y": "", "d": "2026-06-07"}, {"k": "h", "c": "16. 国家能力从何而来？战争", "x": "当然，历史是历史，生活在资源越来越丰富、文明越来越进步的当代，我们仍然希望，对于抵达政治秩序，人类能找到比相互杀戮更聪明的方式。", "y": "", "d": "2026-06-07"}, {"k": "h", "c": "17. 国家能力从何而来？文官制与国家", "x": "我看学者王毅写的《中国皇权制度研究》里面提到，为什么中国人的虚无主义精神传统比较发达？“三十年河东，三十年河西”“旧时王谢堂前燕，飞入寻常百姓家”“古今将相在何方，荒冢一堆草没了”，等等，正是与皇权下缺乏产权保护的制度结构相关。", "y": "", "d": "2026-06-08"}, {"k": "h", "c": "17. 国家能力从何而来？文官制与国家", "x": "从国家建构的角度来说，它另一个重要的功能，是对社会精英的驯服。", "y": "", "d": "2026-06-08"}, {"k": "h", "c": "17. 国家能力从何而来？文官制与国家", "x": "科举制的一大功能，就是把四处冲撞的精英冲动，纳入到一个轨道上来，那就是读书做官，为皇帝效力。", "y": "", "d": "2026-06-08"}, {"k": "h", "c": "17. 国家能力从何而来？文官制与国家", "x": "科举制的厉害之处，不仅仅在于选拔了一批人才，而且是通过利益和价值导向制造了一个庞大的士人阶层。", "y": "", "d": "2026-06-08"}, {"k": "h", "c": "17. 国家能力从何而来？文官制与国家", "x": "10,000个人去参加考试，最后可能只取100个人做官，但是科举的功能不仅仅是找到这100个人，而是让那9900个人也加入这个游戏，这就是科举制政治吸纳的功能。", "y": "", "d": "2026-06-08"}, {"k": "h", "c": "18. 美国：国家建构的另类道路(1)", "x": "美国立国后，立刻确立了“民众持枪权”原则，也就是说，政府主动放弃暴力的完全垄断权，宪法第二修正案规定：“纪律良好的民众武装是自由国家安全所必需，因此，人民持有并携带武器的权利不受侵犯。", "y": "", "d": "2026-06-10"}, {"k": "h", "c": "18. 美国：国家建构的另类道路(1)", "x": "美国这个国家的优势从来不是国家能力，而是个体创造性和社会活力，是乔布斯和马斯克，是爱迪生和迈克尔·杰克逊。", "y": "", "d": "2026-06-10"}, {"k": "h", "c": "18. 美国：国家建构的另类道路(1)", "x": "联邦党人的确成功建立了常备军，也就是说，美国终于有个国家军队了。但是，为了防止国家军队像当年的英国军队一样为所欲为，反联邦党人通过宪法第二修正案设立了一个对冲机制——民众持枪权。联邦政府必须有军队，好，那我们民众也可以成立民兵，也可以持有武器，将来你们要镇压我们的时候，我们不至于手无寸铁。", "y": "", "d": "2026-06-10"}, {"k": "h", "c": "18. 美国：国家建构的另类道路(1)", "x": "从一开始，美国人建立的就是一个“反国家的国家”，它把中央集权视为洪水猛兽，处处对之进行提防。体现在国家结构上，就是所谓的“平行权力”结构，也就是联邦政府和州政府各有自己的权力领地，彼此是平行关系，而不是上下级关系。", "y": "", "d": "2026-06-10"}, {"k": "h", "c": "18. 美国：国家建构的另类道路(1)", "x": "正是因为这种狼狈，才刺激了之后美联储的诞生。而即使是美联储，和其他国家的中央银行比，也是非常独特的，它不是一个银行，而是由12个地区性银行构成，并且这些银行本质上都是私有的，不是国有的。", "y": "", "d": "2026-06-10"}, {"k": "h", "c": "19. 美国：国家建构的另类道路(2)", "x": "美国从建国那一刻起，其政治传统就包含了警惕国家、怀疑权力的基因。", "y": "", "d": "2026-06-11"}, {"k": "h", "c": "19. 美国：国家建构的另类道路(2)", "x": "学者艾克曼(Bruce Ackerman)说，美国的宪法是一个“活的宪法”，它的作者不仅仅是开国之父们，而且是一代又一代修正社会契约的美国人。", "y": "", "d": "2026-06-11"}, {"k": "h", "c": "19. 美国：国家建构的另类道路(2)", "x": "缺乏民意约束的巨型官僚体系未必是好事", "y": "", "d": "2026-06-11"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "因为多山，至少在一个传统时代，往往意味着政府的触角有限，也意味着叛军容易找到藏身之所。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "塔利班这个词的意思是什么？就是“学生”。为什么叫“学生”？因为他们真的就是宗教学校的学生。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "因为宗教原教旨主义带来的意识形态刚性。在他们的观念体系中，原教旨主义的“伊斯兰法”必须成为国土上唯一和最高的法，而人类所能制定的法——不管是国王制定的还是所谓民主议会制定的，只能臣服于“伊斯兰法”。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "回顾阿富汗的国家建构进程为何如此困难重重，我们发现至少四重因素：第一，多山的地形使得中央集权式政府难以形成，造就了部落主义的政治传统；第二，大国对冲的地缘位置使得内战往往成为大国代理战争，战争难以打出胜负，暴力垄断格局难以形成；第三，苏联入侵激起的宗教狂热主义，毒化了阿富汗的文化土壤，使世俗政治力量难以建立；第四，多民族国家的结构，又使得各方政治力量难以就权力分配的方案达成共识。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "检视阿富汗沦为“失败国家”的过程，我们发现，最大的教训其实是以极权追求乌托邦的危险——因为乌托邦过于乌托邦，所以要实现它，只能诉诸极端手段，而极端助长极端，最终，它们在相互厮杀中完成了对彼此的哺育。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "阿富汗缺的不是温和的力量，缺的只是愿意为温和而战的力量。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "20. 国家建构的瓶颈：阿富汗的悲剧", "x": "历史或许有投影，但并没有宿命，既然它曾经转向，就有可能再次转向。对于一个国家而言，命运指向何方，常常取决于“沉默的大多数”是否继续沉默下去。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "观念一旦形成，往往具有相当的韧性", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "韩国涌现出了一批反映本国民主转型的电影。我看过的就有四部：《华丽的假期》《辩护人》《出租车司机》以及《1987》。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "已经成为他们的精神纪念碑，需要不断重返、朝拜，以此来理解自身并寻找未来的方向。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "这就是观念的力量——它是我们吸收信息的“意义加工软件”。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "所以，韩国人的民主真的是他们用几代人的血与泪争取来的。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "“若为自由故，两者皆可抛”，并不是一个自然的观念状态，更自然的观念状态可能是“过好小日子就行了，谈什么政治”，或者“政治能当饭吃吗”。明哲保身，以求现世安稳，是大多数普通人的价值观。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "观念的变化本质上是经济发展的结果。如果用一句朴素的中国谚语来概括，就是“仓廪实而知礼节”，吃饱穿暖了，人们就开始关心权利和自由等价值了。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "“政治机会”理论却说：不对，哪里有反抗的机会，哪里才会有反抗。反抗并不与压迫成正比，而是与反抗的政治机会成正比。为什么？压迫太深了你无力反抗啊。有缝隙的地方青草才能生长，铁板之中无法成长出生命。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "启蒙运动大家都知道，它所缔造的一个核心观念，就是“主权在民”。在此之前，人们认为公共权力的来源是上帝、是天命，所以统治者凌驾于被统治者之上是自然秩序。在此之后，人们认为公共权力的来源是民众，所以被统治者驾驭统治者，才是自然秩序。某种意义上可以说，近代以来，世界政治史上只发生了一场革命，就是这场“主权在民”的观念革命，其他的革命都只是这场革命的支流而已。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "启蒙思想的致命吸引力，不是因为它来自西方，而恰恰是因为它来自我们自己的内心。所谓启蒙，未必是把一个外来的什么思想塞到我们的脑子里，而是用一盏灯把本来就是我们心灵深处里的东西给照亮而已。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "21. 韩国电影中的革命：观念的水位与制度的变迁", "x": "这种源于道德直觉的正义感有种令人敬畏的天真。你会发现，当所有政治的泥沙沉淀、所有理论的波涛平息、所有流行的趋势过去，最终，这种无与伦比的天真还是会从水底浮现。它熠熠的光芒，还是会诱惑你向它伸出手去。", "y": "", "d": "2026-06-14"}, {"k": "h", "c": "22. 何为民主文化？泰国困局", "x": "不管是“社会资本”理论，还是“自我表达”理论，其实都强调一点——参与精神。毕竟，民主和威权的最根本区别，就是一个人说了算，还是很多人说了算。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "22. 何为民主文化？泰国困局", "x": "无论是政治家的监督、政治议题的设定，还是政策的出台和实施，往往都需要民众广泛的参与，而虎视眈眈就是参与的一种形式。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "22. 何为民主文化？泰国困局", "x": "什么是民主文化？它既是一种“天下兴亡，匹夫有责”的参与精神，也是一种对规则的服从精神，还是一种“允许专业之人办专业之事”的政治节制感。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "22. 何为民主文化？泰国困局", "x": "物极必反是个朴素的道理，却包含无穷的智慧。资本主义需要从“丛林资本主义”中拯救自身，宗教信仰需要从“原教旨主义”中拯救自身，爱国主义需要从“沙文主义”中拯救自身，民主，也同样需要从过度的政治激情中拯救自身。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "22. 何为民主文化？泰国困局", "x": "很多时候，耐心比勇气更难达至，节制比热情更需要技艺。在这个意义上，民主是对公民美德的嘉奖，除此之外，没有其他挽留它的途径。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "这样的邪恶不是一两个独裁者所能做到的，往往需要密密麻麻的普通人去参与。令人惊悚的是，在另一个时空里，这些普普通通的人可能是我们的邻居、我们的亲友，甚至，可能是我们自己。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "在阿伦特看来，这就是“平庸之恶”。这种恶不需要创造性、戏剧性、思想性或任何所谓“恶之花”的美感，只需要一点盲目而已。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "权力如何制造“暴民”？不妨将其机制拆解为三个层面：首先是暴力和高压，其次是利益诱惑，再次是意识形态。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "什么叫“理性的无知”？意思就是，无知其实并非一种偶然的状态，而是一种理性的选择。特定情境下，人们可能会选择对自己无法承受、无法改变、无法超越的东西保持无知，因为“知道”会唤醒良知，而恐惧让你只能无所作为，与其让你的无所作为拷问你的良知，不如什么都不知道。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "阅读纳粹德国史就会知道，他们消灭的不仅仅是犹太人，还有一系列配套的“生物进步主义”措施，比如，对老弱病残实行安乐死工程，绝育工程，消灭精神病人，消灭吉卜赛人，各种优生学措施，等等。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "复杂的现实穿越意识形态抵达每个人的头脑，就像阳光穿越大气层抵达人们的眼睛时，只剩下美好的蓝色。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "普通人为什么会作恶？因为恐惧，因为利益诱惑，因为观念的魔法。个体的恶或许乏味，但是集体的恶从来并不平庸，它前面往往是权力的指挥棒在呼风唤雨，而燃料则是被不容置疑的政治话语所点燃的激情。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "所谓盲目，与其说是个体的“不思考”，不如说是系统的“反思考”。它不是任何人天生的无能，而是制度所施加的近视。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "23. 恶真的平庸吗？暴民考古学", "x": "面对恶的蔓延，面对高压，面对诱惑，尤其是面对那种不容置疑的政治话语，一旦你了解人之为人的脆弱，一旦你认出自己在极权主义当中的倒影，作为个体去思考，去看看不到的，去听听不到的，去寻找更大的图景，就不仅仅是一种兴趣，而且是一种义务。", "y": "", "d": "2026-06-15"}, {"k": "h", "c": "24. 文明的冲突：一个过时的预言？(1)", "x": "《文明的冲突与世界秩序的重建》。这本书的基本观点，其实已经包含在标题里了，大意就是：冷战结束了，以意识形态为分野的冲突走到了尽头，从现在开始，文明将成为政治冲突的分界线。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "24. 文明的冲突：一个过时的预言？(1)", "x": "我们能够观察到文化差异，“其实”仅仅是政治差异，无非是一些统治者以高压方式蒙蔽人心，一旦高压消失，“虚假观念”也会随之消失，普世价值自然就浮现出来了。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "24. 文明的冲突：一个过时的预言？(1)", "x": "为了避免认知失调，人们往往会说服自己，自己被动相信的东西其实是自己主动相信的。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "24. 文明的冲突：一个过时的预言？(1)", "x": "我们都向往一个不同文化和谐共处、各美其美的社会。但是，这种和谐的前提是“相互尊重”，而这是一个巨大的、经常被现实打耳光的“如果”。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "24. 文明的冲突：一个过时的预言？(1)", "x": "成功的“多元文化主义”需要所有文化群体同时恪守自由、宽容、民主的底线，而这是一个极高的底线。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "25. 文明的冲突：一个过时的预言？(2)", "x": "遗憾的是，人类往往要经历无数撕裂才学会宽容，要被激情的烈焰烫伤后才意识到激情的危险。在一个价值迅速变迁的时代，世界最终可能会变得更好，但是在此之前，它常常会变得更糟。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "26. 智利：皮诺切特之后", "x": "政策取向来自哪儿？归根结底，来自观念。简单而言，一个社会是更期待政府通过各种各样的管制和再分配成为“拯救者”，还是更相信千千万万个体的创造力和生产力？这是一个答案永远在流动的选择题。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "26. 智利：皮诺切特之后", "x": "在现实世界中，选择往往不是在“更好”和“最好”之间，而是在“更糟”和“不那么糟糕”之间。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "26. 智利：皮诺切特之后", "x": "只不过，由于人类惊人的健忘，陈旧的过去看上去常常像是崭新的未来而已。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "27. 委内瑞拉：如何毁掉一个国家？", "x": "委内瑞拉走到今天，不是源自“坏人”的贪婪腐败，而恰恰是源自“好人”的道德激情。当正义感变得不容置疑，当平等成为唯一的宗教，恶的大门也可以被善的手指敲开。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "28. 新镀金时代？不平等的幽灵(1)", "x": "如果说在古代，宿命主义的世界观还让民众对不平等具有更高的容忍度，不到快要饿死了就不起义，启蒙运动以来的平等主义世界观，则使得民众对不平等的容忍度大大下降。在这个意义上，现代政治虽然比古代更平等，但是却更脆弱了，因为人们不是根据自己的绝对处境，而是根据“相对剥夺感”而采取政治行动的。", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "28. 新镀金时代？不平等的幽灵(1)", "x": "事实是，只要是社会问题，答案几乎从来不可能“简单”。尤其是一个断断续续存在了几千年的社会问题，如果至今悬而未决，一定不是你一拍脑袋就能想到解决方案的，不然为何前面几千年从来没有人想到？", "y": "", "d": "2026-06-18"}, {"k": "h", "c": "29. 新镀金时代？不平等的幽灵(2)", "x": "怀着谦卑和审慎", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "政治“可能”让一个国家成为地狱，但是它却“不可能”让它变成天堂。换句话说，政治所能抵达的上限不会那么高，但是它所能抵达的下限却可以非常低。", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "当政治非常好的时候，它也只是制定一个相对公平的游戏规则", "y": "", "d": "2026-06-20"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "好的政治注定只是美好生活的前一半，而后一半则取决于社会、市场、文化以及每个人的努力。", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "美国缺乏天敌的地缘位置，使其能够相对从容地“先发展民主，后建设国家能力”", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "在人们学会宽容、学会耐心、学会同情性理解、学会从各种集体主义的轮椅中站起来迈出个体的步伐之前，没有什么政治可以成为改造生活的魔法棒。好的政治给每个人一张船票，但是它无法也不应该把每个人带到他的目的地。", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "政治是有限的，但并不是无用的。", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "在卓越的和糟糕的艺术之间，是政治行动。行动需要勇气，需要道德觉醒", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "同一个物种，居然会同时如此智慧和愚蠢、伟大和狭隘、勇敢和懦弱。", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "如果知识是确切的，专制就是必要的。恰恰是知识的不确定性，让我们需要在每一个时代、每一个情境中不断重返基本的道德问题和历史经验，用我们自己的头脑思考，并以这种思考成就人之为人的尊严。", "y": "", "d": "2026-06-19"}, {"k": "h", "c": "30. 政治的可能与不可能", "x": "或许有人认为西西弗斯的努力是一种徒劳，殊不知原地踏步或许正是对自由落体的抵抗。政治复杂到令人绝望，但也正是这种复杂，让思考充满乐趣，让自由成为必要，让未来涌现无穷无尽的惊奇。", "y": "", "d": "2026-06-19"}]}, {"id": "41598972", "title": "工作、消费主义和新穷人", "author": "齐格蒙特·鲍曼", "cats": ["社会文化-社科"], "bmCount": 120, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "现在，他们只能被动地完成由他人设置和控制的任务，工作对他们而言失去了意义。在这种转变之下，如何驱动工人运用自己的技能完成这些没有意义的任务，是现代化的开拓者面临的真正问题。解决方案是机械地训练工人，让他们习惯于不假思索的盲从", "y": "", "d": "2024-02-21"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "新的工厂系统需要的只是人的一部分：身处复杂机器之中，如同没有灵魂的小齿轮一样工作的那部分。这场战斗是为了对抗人身上那些无用的“部分”——兴趣和雄心，它们不仅与生产力无关，还会干扰生产需要的那些有用的“部分”。工作伦理本质上是对自由的摒弃。", "y": "", "d": "2024-02-21"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作伦理改革运动的另一个目的，是把人们所做的事和他们认为值得做、有意义的事分离开来，把工作本身和任何切实的、可理解的目的分离开来。", "y": "", "d": "2024-02-21"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "他们注定只能被动地接受社会的变迁", "y": "", "d": "2024-02-21"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "对现代性美丽新世界的开拓者来说，“传统”是个肮脏的词。它代表了工作伦理所反对的、道德上可耻的、应该被谴责的那种倾向：满足于当下和已经拥有的东西，不愿意付出任何额外的努力去获取更好的生活（事实上，是屈服于一个粗暴、残酷、令人厌恶、不可思议的外部制度）。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作伦理表面上的对手是“无欲无求”，但真正的火力（最猛烈、最残酷的），对准的是那些准工人的反抗心态。后者认为新的工作制度令他们感到屈辱、不适，他们并不期望也不愿理解这种制度，遑论自愿选择。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "工作伦理希望一石二鸟：解决迅速发展的工业化所需的劳动力问题，并处理后传统社会不得不面对的最令人头疼的问题——必须为那些由于种种原因无法适应环境变化、无法在新体系下维持生计的人提供生活必需品。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "但是，并没有可以“简单地摆脱穷人”的方法，所以需要找到另一种不那么完美的方案。长期的探索之后，这个方案终于被找到：工作（任何环境下的任何工作）是唯一体面的、道德的、可行的生存方式。", "y": "", "d": "2024-02-22"}, {"k": "h", "c": "第一章 工作的意义：创造工作伦理", "x": "如果穷人生活得很痛苦，他们的数量就会大大减少。这是所有捕鼠者都知道的秘密：堵上粮仓的缝隙，用持续的猫叫声、警报声和陷阱的开关声折磨它们，这些负担就会消失，不再出现。如果被许可，更简单的方法是用砒霜，或其他一些略温和的方法。", "y": "", "d": "2
