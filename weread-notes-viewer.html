“妈妈，我真的很抱歉，但我现在得挂了。我晚点再打给你。”", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "突然挂掉电话可能会显得粗鲁或刻薄，但事实并非如此。不成熟的人缺乏同理心，所以不论你发出多少委婉的信号，暗示你已经受够了，他们都会视而不见。你有权利结束谈话，就像他们有权利继续谈话一样。此外，如果你知道自己能随时结束对话，那么你在之后可能会更愿意倾听。设置边界对你们的关系来说是一件好事。这意味着你是在做一个主动的参与者，而不是做一个被动的听众。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "除非我们是囚犯，否则我们总是可以离开的，而且我们不必顾及体面的问题。事实上，让自己有些不可预测，也不是一件坏事。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第5章 如何在与父母的互动中设置边界", "x": "有时，不成熟的人会因为情绪失控而危及他人，如砸坏东西或在生气时开车。这种感觉就像被劫持为人质，因为你做的任何事都可能让事情变糟。有时，在这种情况下，你能做的就是深呼吸，保持清醒，试着安抚不成熟的人，找机会让事态平缓下来，或者让自己脱离险境。这并不意味着你很软弱，这意味着你在用你唯一能用的方式来处理危险的情况。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第6章 如何捍卫拥有内在体验的权利", "x": "让我们来看看为什么内在世界如此重要。内在世界赠予了你五份无比珍贵的礼物。（1）你内在的稳定性与抗逆力。（2）你的整合感以及自信。（3）你与他人建立亲密关系的能力。（4）你自我保护的能力。（5）你对人生目标的觉知。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第6章 如何捍卫拥有内在体验的权利", "x": "因为幻想、想象和审美都源于内在世界，所以许多不成熟的父母都把这些看作浪费时间。不成熟的人往往对幻想不屑一顾，认为那是毫无意义的胡思乱想。他们看不到幻想对发明创造和问题解决的启示作用。不成熟的人无视想象的好处，这颇具讽刺意味，因为人造世界中的一切都源自人们的幻想生活。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第6章 如何捍卫拥有内在体验的权利", "x": "我们来仔细审视一下，为什么当你表达自己独有的想法和感受时，不成熟的人会变得充满敌意和攻击性。你的内在世界威胁了他们的权威和安全感", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第6章 如何捍卫拥有内在体验的权利", "x": "你不必这样对待自己。你可以不再这样责备自己：“我不应该有这种感受。”相反，你可以想：“我有这种感受。为什么呢？”每当你接纳自己的感受，并且感到好奇，而不是满心自责和羞愧时，你就是在捍卫这样一种观点：你的内在世界是有意义的，应当得到倾听。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第6章 如何捍卫拥有内在体验的权利", "x": "她学着对自己的情绪保持开放的态度，让自己的感受得到充分的表达。", "y": "", "d": "2024-01-28"}, {"k": "h", "c": "第6章 如何捍卫拥有内在体验的权利", "x": "有时最好的回应方式就是不回应。通过忽略他们，或者转移注意力，你可以制止他们对你的观点表达不屑。忽略是一种很好的权宜之计。忽视不良行为是降低不良行为出现频率的有效方法。", "y": "", "d": "2024-01-28"}]}, {"id": "237732", "title": "当下的力量（珍藏版）", "author": "埃克哈特·托利", "cats": ["个人成长-励志成长", "个人成长-人生哲学"], "bmCount": 45, "rvCount": 2, "notes": [{"k": "h", "c": "导读 活在当下", "x": "人类受苦的根源来自于我们大脑的思维", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "导读 活在当下", "x": "我们都知道ABC理论，A是引发你情绪的事件，B是你的信念或你对事情的诠释，C就是结果，即你的负面情绪。通常，当人们不喜欢C的时候，都会去找A的碴儿，尤其是与创造A有关的人。所以我们每天疲于奔命，一直在处理、阻止、缓和、沟通、协调A以及与A相关的人、事、物。可是我们不知道，B是你唯一可以完全掌控和改变的因素，而且引发C的不是A，而是B。", "y": "", "d": "2022-04-12"}, {"k": "h", "c": "导读 活在当下", "x": "同样一件事，几家欢乐几家愁。为什么？就是对事情的诠释角度不同罢了。与其去改变外在的人、事、物，不如改变我们自己的内心来得省事省力。而你会发现，当你转变了内心的状态之后，环境也会随之转变，这就是所谓的“境由心转”！", "y": "", "d": "2022-04-12"}, {"k": "h", "c": "导读 活在当下", "x": "难怪我们的人生苦多于乐，而且常常身不由己。怎么办呢？作者在书中提出了好几个非常实用的方法，这些方法其实都是源自一个最基本的理论：活在当下。", "y": "", "d": "2022-04-12"}, {"k": "h", "c": "导读 活在当下", "x": "最怕的就是明明人在这里，可是脑子跑到过去，带来了愤怒、伤心、悔恨、愧疚等情绪。或是人在此刻，脑子跑到未来，于是就产生了压力、焦虑、恐慌。", "y": "", "d": "2022-04-12"}, {"k": "h", "c": "序言", "x": "我们必须理解我们是如何成为一个痛苦创造者的；是我们的大脑，而不是其他人或者我们生活于其中的这个世界引发了我们的问题。是我们的大脑在思考我们的过去，担忧我们的未来。我们犯了最大的错误：认同我们的大脑，并认为大脑就是我们—实际上我们远远比我们的大脑更伟大。", "y": "", "d": "2022-04-12"}, {"k": "h", "c": "前言", "x": "然后，我感觉我被吸进了一个能量的旋涡", "y": "", "d": "2020-06-04"}, {"k": "h", "c": "开悟的最大障碍", "x": "你同样还会认识到所有真正重要的事情，如美貌、爱情、创造力、欢乐、内在的宁静等，都是来自于大脑之外的。你开始觉醒了。", "y": "", "d": "2022-04-19"}, {"k": "h", "c": "超越你的思维", "x": "即使当小我看似在关切当下时，它所关切的也不是眼前的当下，因为小我看待当下的方式完全错误—它是以过去的眼光来看的。或者它把当下作为达成未来目的的手段，而这个目的，始终存在于思维所投射出的未来。", "y": "", "d": "2022-04-19"}, {"k": "h", "c": "情绪：身体对思维的反应", "x": "只有停止思维认同，你的思维才会丧失它的力量，本体才会以你原来的本性显露出来。", "y": "", "d": "2022-04-20"}, {"k": "h", "c": "情绪：身体对思维的反应", "x": "欢乐总是衍生于你之外的事物，而喜悦是由内而生的。今天让你欢乐的事情，明天可能会让你痛苦，或者它将会离你而去，所以一旦失去它，你将会感到痛苦。", "y": "", "d": "2022-04-20"}, {"k": "h", "c": "情绪：身体对思维的反应", "x": "这就像你曾经拥有某种很珍贵的东西却突然失去了它，或者你的大脑告诉你这只是一种幻象。实际上，这不是幻象，而且你不会失去它。它是你本性的一部分，它会受思维的影响但永远不会被思维破坏。即使天空乌云密布，太阳也不会消失，它仍然在云层的另一边。", "y": "", "d": "2022-04-20"}, {"k": "h", "c": "情绪：身体对思维的反应", "x": "请关注当下，并成为你思维的观察者。不是引用佛的话，而是变成佛，成为觉醒的人，", "y": "", "d": "2022-04-20"}, {"k": "h", "c": "别在当下制造更多的痛苦", "x": "人类的很大一部分痛苦是没有必要的。只要让未被觉察的思维控制着你的生活，痛苦就会自然而然地产生。", "y": "", "d": "2022-04-20"}, {"k": "h", "c": "别在当下制造更多的痛苦", "x": "想象一下：地球上没有人类，只有动物和植物。这时，仍会有过去和未来的存在吗？这时我们仍然能以任何一种有意义的方式来谈论时间吗？“现在几点？”“今天是几号？”问这种问题将会是毫无意义的，橡树或鹰可能会被问傻了！它们可能会说：“现在几点？现在就是现在啊！除此之外还会有什么呢？”", "y": "", "d": "2022-04-24"}, {"k": "h", "c": "别在当下制造更多的痛苦", "x": "如果你不想再为自己和他人创造痛苦，不想再增加你心中过去的痛苦，那么请你不要再创造时间，或者至少不要创造除了做必要事情之外的时间。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "别在当下制造更多的痛苦", "x": "请你务必认识到，当下时刻是你所拥有的一切，把你的生活重心完全放到当下这一刻，把你先前在时间内流连并短暂地访问当下时刻的做法改为关注当下时刻，只在必要时简单地回顾过去和展望未来。永远对当下说“是”。有什么比对已然存在的东西进行内在的抗拒更徒劳、更疯狂的吗？有什么比反对生命本身，也就是当下，而且永远是当下，更疯狂的吗？向“是”臣服，对生活说“是的”，看看生活是如何为你服务而不是与你为敌的。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "别在当下制造更多的痛苦", "x": "接纳，然后采取行动。不管当下时刻的情况怎样，心甘情愿地接受它，就像它是你选择的一样。总是与它共事，而不是抗拒它，使它成为你的朋友和盟友而不是敌人。这将会不可思议地改变你的整个生活。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "瓦解你的痛苦之身", "x": "痛苦之身害怕被你发现。它的生存取决于你对它无意识的认同，以及你面对内在痛苦时，那种无意识的害怕。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "瓦解你的痛苦之身", "x": "痛苦之身害怕被你发现。它的生存取决于你对它无意识的认同，以及你面对内在痛苦时，那种无意识的害怕。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "瓦解你的痛苦之身", "x": "很多心灵导师说，所有的痛苦实际上都是一种幻觉", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "瓦解你的痛苦之身", "x": "当你心情不好时，你开始有了很多消极的思想，并不断地想你的生活是多么糟糕，这时你的想法就和痛苦之身结合，你就会无意识地被痛苦所控制，也很容易遭受痛苦之身的攻击。此处我所说的“无意识”，是指对某个思想或情绪模式的认同，它隐含的意思是：观察者的完全缺席。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "瓦解你的痛苦之身", "x": "将注意力集中在你内心的感受上，了解到这就是痛苦之身并接受它的存在；别去想它，别让你的感受变成大脑和思维，不要去判断或分析它，别在其中寻找你自己的身份认同；保持临在，继续观察你的内在；不仅要觉知到你情绪上的痛苦，更要觉察那个沉默的观察者。这就是当下的力量，这就是你自己有意识的那种临在的力量。", "y": "", "d": "2022-04-26"}, {"k": "t", "c": "瓦解你的痛苦之身", "x": "将注意力集中在你内心的感受上，了解到这就是痛苦之身并接受它的存在；别去想它，别让你的感受变成大脑和思维，不要去判断或分析它，别在其中寻找你自己的身份认同；保持临在，继续观察你的内在；不仅要觉知到你情绪上的痛苦，更要觉察那个沉默的观察者。这就是当下的力量，这就是你自己有意识的那种临在的力量。", "y": "我悟了！当下的力量～以正念状态过好当下时刻，以观察者的身份观察自己的情绪。", "d": "2022-04-26"}, {"k": "h", "c": "小我对痛苦之身的认同", "x": "也就是说你从你的痛苦中创造了一个不幸的自我，并且认为这个由大脑创造的幻觉就是你。在这种情况下，害怕失去自我认同的无意识恐惧，会强烈地抗拒任何摆脱这个思维认同的努力。换句话说，你可能宁愿在痛苦中，与痛苦之身认同，也不愿冒风险去丢失你熟悉的不幸自我而跃入一个未知之中。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "恐惧的起源", "x": "你身处此时此刻，而你的思维却跑到了未来。这就创造了一种焦虑的鸿沟。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "恐惧的起源", "x": "当下的事情是你可以去应付的，但是你无法应付未来存在于思维中的事情。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "别在思维中寻找你自己", "x": "一旦你认识到无意识的根本原因是思维认同（当然还包括情感认同），你就可以逐步走出这个阴影了。你可以进入当下，这时，你就会允许思维的存在而不陷入思维之中。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "终结时间的幻象", "x": "当你与思维认同时，你就陷入了时间的陷阱：你会不由自主地完全生活在对过去的回忆和对未来的期待之中。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "终结时间的幻象", "x": "过去可以赋予你一个身份，而未来代表了解脱的希望或任何一种形式的满足，因此你会强迫性地认同它们，但实际上这两者都是幻象。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "终结时间的幻象", "x": "实际上，当下才真正的珍贵。你越关注时间—过去和未来，你就会越多地错过当下。当下才是最为珍贵的东西。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "终结时间的幻象", "x": "首先，因为它是唯一真正存在的东西，你的整个生命就是在这个永恒当下的空间中展开的，而这个永恒当下是唯一不变的常数。生命就是此刻，你的生命从来不会不在此刻，未来也不会。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "任何事物都不能存在于当下时刻之外", "x": "没有任何事情可以发生在过去，所有的事情都发生在当下。\n也没有任何事情会发生在未来，所有的事情都只发生在当下。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "汲取当下的力量", "x": "你总是把未来想得比现在更好或更坏。如果想象的未来比现在更好，它会给你希望或让你愉悦地期待；如果它比现在更糟，会让你焦虑—其实这两者都是幻象。通过自我观察，更多的临在意识会自动地进入你的生活之中。在意识到你没有进入当下的那一刻，你就在当下了。任何时候，当你有能力观察你的思维时，你就不会再落入它的陷阱。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "消极心态和痛苦根植于时间之中", "x": "焦虑、紧张、不安、压力、烦恼—所有形式的恐惧，都是因为对未来过于关注而对当下关注不够所引起的。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "所有的问题都是思维的幻象", "x": "大脑中背负着100件你在未来将会或必须做的事情的重担，却没有将注意力集中在一件你现在就能做的事情上。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "本体的喜悦", "x": "尊重每一件事，却又不在乎这一切。", "y": "", "d": "2022-04-26"}, {"k": "h", "c": "丧失当下时刻：幻象的核心", "x": "随着你这种当下意识的逐渐增强，你就会逐渐地将你的注意力集中在当下，而不是集中在过去和未来，并且，任何时候当你意识到你没有将注意力集中在当下时，你就已经进入了当下。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "丧失当下时刻：幻象的核心", "x": "从时间中解脱就是：从你在过去中寻找认同感的心理需要以及在未来寻找满足的心理需要中解放出来。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "瓦解一般的无意识状态", "x": "那么我们应该如何从这种痛苦中解脱出来呢？\n变得有意识。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "无论身处何地，全然地安于当下", "x": "当你工作、跑步时，全力地去做吧。充分享受能量的流动以及那个时刻的高能量。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "无论身处何地，全然地安于当下", "x": "就让过去消失吧，你并不需要它。只有在过去与现在有绝对关联时才去引用它。充分地感受当下的力量以及本体的完整性。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "无论身处何地，全然地安于当下", "x": "没关系，我没有在等待。我仅仅是站在这里自得其乐—享受我自己内心的喜悦而已。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "无论身处何地，全然地安于当下", "x": "设定目标并努力去实现目标本身并没有错，错误的是你将它看成是你对生命和对本体的感受的替代品。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "超越好和坏的至善", "x": "从一个更高的角度来看，所有的情境都是正的。更为准确地说：它们不正也不负。它们就是它们的样子。而当你完全接受本然—这是唯一明智的生活方法—在你的生活中就不会再有“好”和“坏”了", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "生命的无常和循环", "x": "接受生活的现实就是活在一种恩典、安逸和轻松的状态里。这种状态不再取决于事情的好坏。这看似自相矛盾，但是当你不再依赖事物的外在形式之后，你的生活状况、外在形式就会有很大的改善。你认为能让你快乐的人、事或情境，现在，在无挣扎、无努力的情况下来临了，你尽管去享受、欣赏它们。当然，所有的这些事情仍然会消失，循环不止，但是当你不再依赖这些事情时，你就不会恐惧失去。你的生活就会充满安逸。", "y": "", "d": "2022-04-28"}, {"k": "t", "c": "全书想法", "x": "", "y": "如果你觉得痛苦，说明你活在过去；如果你觉得焦虑，说明你活在未来；而如果你觉得平静，说明你活在当下。\n那怎么才能“活在当下”呢？停止思维认同，以观察者的身份观察自己的思维和情绪，将注意力集中在你内心的感受上，以正念的状态投入到你当下所经历的事情中。\n生命就是此刻，只能是此刻。想象一下，如果我们去问一棵树：现在几点？今天是几号？树可能会被问傻了……它会回答：现在就是现在啊！除此之外还能是什么呢？", "d": "2022-04-28"}]}, {"id": "31265523", "title": "向上生长", "author": "九边", "cats": ["个人成长-人生哲学"], "bmCount": 45, "rvCount": 0, "notes": [{"k": "h", "c": "为什么要学习及如何学习", "x": "所有系统都有一种自毁趋势，往“熄灭”或者“圆寂”方向发展。这个趋势，就叫“熵增”。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "为什么要学习及如何学习", "x": "可是对于99%的人来说，他们进入一个新环境半年之后就稳定了，基本没什么新的知识摄入了。也就是说，当一个人经历过一段时间痛苦的爬坡之后，就迅速进入稳定状态了，没有新信息摄入了。你没有新的负熵流摄入，你的这个系统就在加速衰退。这时候你就得想办法提升自己了。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "为什么要学习及如何学习", "x": "一个人在读每本书的过程中，都会有个消化阶段，也就是说怎么让这些知识在脑子里溜达一圈，吸收一下。之前我们讲编程的时候，会说把代码自己敲一遍用以吸收和巩固这些知识。不过读书过程中肯定没法把书抄一次。我的方法就是把收获的新知识发一条微博，再加进去一点之前学习到的东西。这个过程坚持下来，就会对之前读过的书有个记录，也吸收了一遍刚学的知识，同时练习了文笔。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "当你毕业后，如何继续学习", "x": "“脑子里空空如也，怎么能够想出东西来。”", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "当你毕业后，如何继续学习", "x": "一个人如果想输出，必须依赖积累，这本来就是常识。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "当你毕业后，如何继续学习", "x": "很多人想掌握写作的技巧，可是不知道如何下手。其实最好的学习方式就是看完什么东西之后就随手写点心得，用自己的语言总结即可。你会发现越写越利索，而且对思维的训练也非常厉害，能够让知识条理化，让大脑清晰化。而且随着时间的叠加，效果会越来越明显。你做一件事，做一周没什么用，做两个月也没什么用，但是如果你能持续五年，绝对能折腾出点名堂。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "厉害的人的工作和学习心得", "x": "飞行员开飞机不够一千个小时就不能算老手，马拉松运动员每天都跑几十公里，优秀的程序员也是从对着书一行一行代码敲过来的。在学习的前期，一个人是没有方向、没有思路、没有全局感的，最重要的就是不断地投入时间，过一段时间就会突然清晰了。很多人学习新技能一无所成，就是死在了这个时间点前。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "关于积累、精进、进阶", "x": "1. 所有的我们以为的质量问题，大多本质是数量问题，因为数量不够，差几个数量级而已。2. 数量就是最重要的质量。大部分质量问题，在微观上看，就是某个地方数量不够。3. 最大的误区是，明明是数量不够的问题，因为错误地以为瓶颈在于质量，幻想在不增加数量的前提下，用某种奇技淫巧，偷工减料达到目的。这时候玄学、迷信和各种无病呻吟就出现了。数量不够，底子不够厚时，很多事情是做不到的。即使有时看似有捷径，欠的账迟早是要还的。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "关于积累、精进、进阶", "x": "万事一理，你想写文章，那么你写够一百万字了吗？你要撸铁￼，那么你重复一万次了吗？你要跑步口号震天，是不是三年都没跑够一百公里？你想学Python，是不是论坛逛了无数到现在都没到一万行代码？", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "关于积累、精进、进阶", "x": "如果你没有别的好办法，不如把在某件事情上积累一定的量作为目标。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "关于积累、精进、进阶", "x": "我们看现在所有的一切，意义都不大，但是再过五年回过头来，才能发现五年后的自己正是现在你的每一个行为塑造的。", "y": "", "d": "2021-01-11"}, {"k": "h", "c": "如何向上跨越阶层", "x": "社会实在是太大了，你觉得有很多竞争者，事实上又没有竞争者，你唯一的竞争者就是你心里那个好逸恶劳的小孩。《权力的游戏》里的守夜人学士跟雪诺说，去做艰难的决定，杀掉你心里的那个孩子，变成大人（kill the boy, let the man born）。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "如何向上跨越阶层", "x": "一、大部分人又懒又笨，超越他们并不难。二、你并不需要做第一，也不需要做第二，你甚至不需要跟他们竞争。只要超过绝大部分又懒又笨的人，你就可以过上相对较好的生活，然后在这个基础上迭代改进。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何向上跨越阶层", "x": "而且一个人不承认自己平庸，会直接导致浪费掉他身上一个最重要的资质：肯下笨功夫。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何向上跨越阶层", "x": "学习代码也一样，记得谭浩强的那本有关C语言的书里说，就跟评价飞行员是否经验丰富，要看他飞行了多少个小时一样，初级码农最应该做的事就是尽快写够一万行可运行代码。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何向上跨越阶层", "x": "要理解事物发展内在逻辑，要学会“不计后果”地去做某件事，不能成天等着回报，看不到回报就迅速懈怠了。人不断向上突破，就是克服基因里固有缺陷的过程。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "如何向上跨越阶层", "x": "相信大家跟我一样，不管做什么事，如果做一段时间，没什么感觉，也不太顺利，就开始怀疑自己没天赋。\n这种想法是错误的，你一个普通人，你有啥天赋？你最应该考虑的问题是：\n一、现在是慢启动阶段，要什么自行车？\n二、数量都不够，要什么效果？", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "如何向上跨越阶层", "x": "尽快认识到自己只有下笨功夫才是唯一途径，对你的人生发展非常有帮助。我就是治好了“以为自己有天赋”这个精神病之后，生活才慢慢好起来的。当你肯下笨功夫之后，很多事反而不难了。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何向上跨越阶层", "x": "月收入三万以下的程序员只需要初中数学，大部分东西都跟智商和家庭没关系，做不好的主要原因就是不上心，重复次数不够，量不够。上升空间广阔，加油就是了。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "如何向上跨越阶层", "x": "如果你对人生比较迷茫，没有找到方法论，可以像我一样，用笨办法，相信两件事：\n第一，重复就是力量。\n第二，欧成效说的，非常有启发：数量堆死质量。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "理解“资源边界”，忘记“边界”", "x": "我特别喜欢他这种劲头，一直不服老，忘了年龄，去做新鲜的事，永远都在拓展，永远没有边界，而且他有个逻辑，他说现在人们的寿命变长了，以前只能活到七十岁，他要活到九十多。按照这个标准，六十多岁相当于以前的四十岁，正值壮年。而博主这样三十岁的，相当于以前的二十岁，年轻得很，有无数机会无数探索的可能，前提是不要搞自我封闭。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "理解“资源边界”，忘记“边界”", "x": "大家往往高估自己一天能学会的东西，低估三年能学会的东西。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "穷人翻身有多难", "x": "穷人和富人都会买奢侈品，穷人往往用他们每个月的血汗钱购买，那是本应该用来投资或者留给他们的子女的财富。富人则是用他们所产生的资本购买。穷人购买了奢侈品后确实让他们看上去富有了，但他们随即进入了债务危机。每月的工资用来偿还债务，并继续贷款，他们进入了恶性循环。普通人把自己的工资花了，而一些有富人视野的人会把钱攒下来，买那种可以带来流水的东西。能带来流水的东西叫资产，然后花资产带来的钱，因为那个收入算被动收入。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "“贫穷陷阱”到底是什么", "x": "心理学家早就发现人们对奢侈品的爱好并不是天生的，而是后天才形成的，是受社会影响的结果。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "“贫穷陷阱”到底是什么", "x": "《贫穷的本质》书中反复强调要降低奢侈品的消费，我在前面也说了，真正有钱人眼里的奢侈品就是你眼里两千块的电动摩托。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "“贫穷陷阱”到底是什么", "x": "什么是贫穷陷阱——不切实际的奢侈消费就是贫穷陷阱。这会导致你积累不到钱，以至于生活困苦。当你生活困苦，又没有任何存款，会导致你的皮质醇升高，让你难以集中注意力，更加难以延迟享受，让你更难赚到钱，也就更难积累到钱。这个说法对所有阶层的人都适用。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "链接即财富", "x": "一、一定要保持乐观，人有一种奇怪的自我实现的能力，你觉得这个世界是什么样的，它似乎真可以修正，跟你心里的样子越来越像。世界上没有什么事比悲观蒙蔽双眼更郁闷的事了，乐观会带来财富，悲观会带来灰暗。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "掉进坑里如何爬出来", "x": "多试错会带来运气", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "掉进坑里如何爬出来", "x": "对一个人而言，勤奋和智力学识都是基础，能不能实现跃迁，主要靠运气。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "掉进坑里如何爬出来", "x": "我们正常人在进化上有一些缺陷，比如本能地恐惧变化和不确定性，因为在漫长的原始社会，随意溜达很容易被老虎吃掉，我们都是不爱乱溜达的人的后代。我们也总是很容易悲观、泄气，没法长时间保持乐观，这也好理解，因为在原始社会的时候，如果一个人好奇心太强，看见毛茸茸的豹纹绳状物就想摸一下，那么这种人基本上就被淘汰了，剩下的人都本能地对不认识的东西充满疑惧。而且本能地对短期没效果的东西充满反感，没法在一个领域熬死竞争对手，也就没法在多条战线上同时进攻。所以，基于以上的缘故，绝大部分人容易掉入内卷化的陷阱而难以爬出来。只有清醒地认识到内卷化的陷阱之后，你才能先于别人爬出来。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "是什么让我们变得更强", "x": "有机体，或者说生命体，都有类似的能力，经历小的刺激和压力，使我们恢复过来后更加强大。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "承认平庸可能才是进步的第一步", "x": "我以前也讲过，我这辈子最豁然开朗的时刻，就是意识到自己是个普通人。因为我记性不太好，所以要多做笔记；因为我智商一般，所以要笨鸟先飞，不仅先飞，而且要多飞，多重复几次，反而记得更熟；因为我读书不太快，所以要慢慢看，尽管看得慢，但是投入时间量巨大，也能形成规模优势。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "承认平庸可能才是进步的第一步", "x": "当我们认识到人生唯一能依赖的只有多重复、多练习，心里反而踏实了太多——我曾一度很痛苦自己不是天才，不能过目不忘，不过好在我后来发现我不需要那个神技。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "承认平庸可能才是进步的第一步", "x": "如果你想学习什么东西，当你选择学习你已经比较了解的，那么你就是待在舒适区，但是你如果真的想进步、提升自己，你最好的选择就是在稍微比现在懂的东西复杂一点点的地方训练，也就是“训练区”，而不是直接跑到挑战区去，因为挑战区难度实在太大。挑战难度大，你就难免受挫，受挫次数多了，你就难以坚持下去。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "承认平庸可能才是进步的第一步", "x": "特别厉害的人，一般分为两种类型：一种是天赋异禀，这种是自身硬属性强。另一种是通过大量练习达到很高的水平。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "你需要在生活中加入不确定性", "x": "首先要好好锻炼身体。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "你需要在生活中加入不确定性", "x": "这些年每次碰上麻烦事我就记录下来，每次年底复盘的时候，就能发现99%的问题其实自然而然解决了，尽管面对的当时焦躁异常。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何坚持下去并且成事", "x": "学习编程的人一定有这种感受：一开始模仿别人写，写着写着感觉就来了，完全可以自己写了。当他进入一个高阶状态后，就是下笔如有神了。他自己都不知道自己怎么能这么顺利就写出这么高质量的代码来，实现那种之前自己想都不敢想象的功能。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "如何坚持下去并且成事", "x": "我很纳闷他们记性怎么那么好。后来等到我做编程工作的时候才彻底明白了——那种几千行的代码，我看一眼也能写出来，并不是我记性好了，而是积累到了一定程度，就不需要再去尝试记一招一式了，里边大部分的东西都是我知道的，只需要直奔我不懂的那部分就行，或者直接找关键点就可以了。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何坚持下去并且成事", "x": "复利法则：规模积累到一定程度，就会涌现出完全超乎想象的东西。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "如何坚持下去并且成事", "x": "一、积累总是第一位的，很多新的模式都是积累到一定程度才能解锁，这个是复利的范畴。\n二、积累的关键是每天都要做，而不是单次做多少。\n三、如果想每天都能去做，最好的办法是目标定低点，这样每次开始的时候心理负担能低点。\n四、坚持每天做一件“低目标”的事会让你达到很高的高度。\n五、我们知道努力会让生活变美好，如果能找到一个领域，自己在这个领域很舒适，在舒适区努力会让你达到想都不敢想的高度。", "y": "", "d": "2021-01-12"}, {"k": "h", "c": "娱乐到底是怎么致死的", "x": "毒品的作用原理是通过药物让大脑兴奋，产生愉悦感。现代游戏和娱乐节目是通过视觉听觉来做到这一点。如果一个人长期沉浸其中不能自拔，可能是新时代最酷最隐形的一种死法，让你快快乐乐、不知不觉地变成废人，慢慢地，没法长时间集中注意力，一干枯燥的事就疲劳、暴躁。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "娱乐到底是怎么致死的", "x": "总之，有些事情明显是对的，不需要太多说教也要坚持去做，比如勤奋，比如积极主动，比如多笑少抱怨。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "为什么“丧尸文化”越来越严重", "x": "总之不要怕，想去做什么就去干，动起来，是跟僵尸、病毒斗争的最好办法，焦虑点也没什么。再过一些年，大家就会发现现在真是动手的好时候，种下一棵树，最好是三十年前，其次是现在。", "y": "", "d": "2022-05-15"}, {"k": "h", "c": "不要把你的想当然作为选择的依据", "x": "在计算机行业，只要细心、认真，天分不高的人也能达到很高的水平，收益也很好。", "y": "", "d": "2022-05-15"}]}, {"id": "41355404", "title": "要钱还是要生活", "author": "维姬·罗宾 乔·多明格斯", "cats": ["个人成长-人生哲学"], "bmCount": 34, "rvCount": 0, "notes": [{"k": "h", "c": "新版前言", "x": "首先就是清除你大脑中关于“买东西会让我快乐”或“拥有更多一定会更好”的错误观念。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "新版前言", "x": "“拥有更多”是一个欲望的无底洞。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第一章 赚钱让你快乐吗？ 花钱令你满足吗？", "x": "你见过几个人在工作日结束时比开始时更生龙活虎？我们“谋生”归来是带着更多活力回家吗？我们是精神抖擞地冲进家门准备与家人和朋友共度良宵吗？我们本该在工作中谋取的生活在哪儿？对我们当中的许多人来说，这难道不是更接近“求死”吗？我们难道不是在为了工作而扼杀自己，扼杀我们的健康、我们的人际关系、我们的愉悦与好奇心吗？我们在为了钱而牺牲自己的生命，但这个过程很慢很慢，我们几乎毫无察觉。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第一章 赚钱让你快乐吗？ 花钱令你满足吗？", "x": "任由广告诱惑你遐想无限美好的生活，前提是要买辆保时捷、到国外度个假、有台新电脑或者……", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第一章 赚钱让你快乐吗？ 花钱令你满足吗？", "x": "归根结底，我们认为自己工作是为了支付账单，但我们花的比挣的多、买的比实际需要的多，然后就需要我们再去工作挣钱！", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第一章 赚钱让你快乐吗？ 花钱令你满足吗？", "x": "我们身处世界上最富足的社会，日复一日勤勤恳恳，在家庭和工作之间来回奔波，内心向往着远方隐约可见，但也许完全遥不可及的东西。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "你拥有的唯一真正财富就是你的时间，你一生里的分分秒秒。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "弄明白金钱就是生命能量，会让你成为金钱的掌控者。你会清楚地知道自己愿意出卖多少生命能量来换取金钱？环顾你积攒起来的东西，你可以自问：‘我投入了生命里的多少时间才拥有这个……椅子……汽车……成套炊具……墙上的文凭？’", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "它是我们选择用生命能量去换取的东西。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "我们不再认为买一辆新车能让自己快乐，而会思索真正能让我们感到快乐的是什么，我们会认识到快乐之源是在海滩度过一天，而不是连续三年每月偿还车贷。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "一旦认识到金钱是一场共同游戏，我们就能够有意识地选择什么时候用金钱玩游戏、什么时候用其他货币——比如爱情、技能、知识或需要双手的劳动。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "“赢”并不是指拥有最多身外之物。它是指拥有你所需要的，毫无多余，并且能够随心所欲地停止玩这场游戏。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "你最宝贵的资源：你的时间，你的生命。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "你如何花费它，就是如何消耗你的生命能量。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "实现内心的宁静", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "它是指你体验到自己所拥有的已经足够且有富余。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第二章 为钱卖命， 谋生还是求死？", "x": "你决不买不想要或不需要的东西，丝毫不为商场、超市和媒体的诱惑所动。你的情感财富不再与经济财富挂钩，", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第三章 钱都花到哪儿去了？", "x": "1. 饿了才吃。\n2. 吃身体想要的东西。\n3. 每吃一口都要用心体会。\n4. 身体感到饱足了就停下。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "第六章 享受节俭生活", "x": "所谓节俭，就是享受我们所拥有的。如果你有10条裙子却还是觉得没裙子穿，那你恐怕就是一个强迫性购物狂——获取之快感比拥有和使用之愉悦更强烈。但如果你有10条裙子，而且多年来这10条裙子你一直都喜欢穿，那你就是节俭的。浪费不是指拥有的东西多，而是指未能享受它们。要衡量你在节俭方面是否成功，不必看你的吝啬程度，要看你对物质世界的享受程度。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "第六章 享受节俭生活", "x": "从每样东西中得到充分的愉悦——无论是一株蒲公英还是一束玫瑰花，一粒草莓还是一顿大餐。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "第六章 享受节俭生活", "x": "从生活中充分获取价值，享受每一个时刻、每一件事物所能提供的一切美好。你可以aprovechar一顿简单的饭菜、一盒熟透的草莓或者一趟巴哈马海上旅行。aprovechar毫无小气意味，它是一个生机勃勃的词，充满了阳光与清香。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "第六章 享受节俭生活", "x": "享受一样东西并不需要拥有它，只需要使用它就行了", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "第六章 享受节俭生活", "x": "保护你所拥有的东西。", "y": "", "d": "2024-07-09"}, {"k": "h", "c": "第六章 享受节俭生活", "x": "谈谈你拥有的一件心爱之物。你喜欢它什么？", "y": "", "d": "2024-07-09"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "你需要多少钱来达到满足感的顶点？你的职业能提供这笔钱吗？你工作挣来的钱低于你应有的价值、带回家的钱低于你需要的数额吗？还是你的收入远远超过你实现满足感所需要的金额？那笔多余的钱有什么用处？如果它不服务于任何目的，你想不想减少一些工作而多花点时间去做对你来说重要的事情？如果它确实服务于某个目的，那么这个目的是否清晰明白且与你的价值观紧密相连，因而能给你有偿就业的分分秒秒带来快乐体验？若并非如此，你应做出哪些改变？", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "如果你不必为了钱而工作，你会做什么？", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "如果健康的行医之道意味着少挣钱，那就少挣吧！", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "尊重生命能量", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "对古希腊人来说，闲暇是至上的善、是自由的精髓", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "有偿就业的唯一内在目的是获得报酬（不管你对自己的职业是爱还是恨），那就要看看你用宝贵的生命能量换来的东西是否值得。", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第七章 重新定义工作： 既可谋生，又是爱好", "x": "金钱不过是你用生命能量换取的东西", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第八章 跨过交叉点： 财务自由终于来临", "x": "资本是能赚钱的钱，不是存在银行里的钱。", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第八章 跨过交叉点： 财务自由终于来临", "x": "购买阶梯式定期存单，即存期相互错开的定期存单", "y": "", "d": "2024-07-10"}, {"k": "h", "c": "第八章 跨过交叉点： 财务自由终于来临", "x": "生活中那些免费的最美好的东西", "y": "", "d": "2024-07-10"}]}, {"id": "3300015080", "title": "感恩日记", "author": "贾尼斯·卡普兰", "cats": ["个人成长-情绪心灵"], "bmCount": 34, "rvCount": 0, "notes": [{"k": "h", "c": "权威推荐", "x": "温柔的力量是很强大的，这种力量包含着包容感恩和愉悦。当我们感觉到被温柔对待，是因为我们温柔又带着敬畏对待着外面的世界。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "权威推荐", "x": "温柔背后有强大的灵魂和开阔的眼界，这种强大和开阔让我们懂得感恩，收获从容，更加游刃有余。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "推荐序 最好的感恩是行动", "x": "生活的真相是，我们无法让玫瑰丛无刺。我们能做的是，与其抱怨玫瑰丛长满了刺，还不如感激刺丛里竟生出了玫瑰。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "前言 请写下“我对今天心存感激的1件事”", "x": "我不能改变已经发生的事情，而改变自己的想法让我感觉很棒。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "第1章 时光深处，“感恩之舟”起航", "x": "重要的不是环境，而是我怎样看待这一切。我可以被动地等待美妙的事情发生，然后吹毛求疵、鸡蛋里挑骨头；我也可以接受生活中发生的一切，然后试着往生活中多加一点感激。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "第1章 时光深处，“感恩之舟”起航", "x": "生活不会仅仅因为日历翻过一页就变得更好。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "关注岁月的馈赠，避开生活的“皱纹”", "x": "成为自己的社会科学家", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "买个漂亮的日记本，让书写感恩成为一种习惯", "x": "“世事本无好坏，端看你们怎么去想。”", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "第2章 感恩是打开亲密关系之门的金钥匙", "x": "有时候你需要停下脚步，用全新的眼光看待眼前的一切，而不是像机器一样不断重复。这样，新鲜的空气才能进入你的心灵居所。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "第2章 感恩是打开亲密关系之门的金钥匙", "x": "真正的探索之旅，并不在于发现新的景色，而在于拥有新的眼光。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "幸福婚姻的秘密：接纳对方原来的样子", "x": "换个角度看问题，此时此刻的我，就可以创造出属于自己的平行宇宙。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "幸福婚姻的秘密：接纳对方原来的样子", "x": "looking-for-the-good", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "第4章 感恩是重塑社交关系的金种子", "x": "这个世界没有所谓的坏天气，只有各种不同的好天气。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "我们要认清哪些是可以控制的，而哪些不行，然后对可以控制的事物采取行动，忽略那些不能控制的部分。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "不论你是冻得发抖还是热得冒汗，累得犯困了还是清醒着……不要让环境妨碍你做该做的事情。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "如果浪费时间对自己无法改变的环境沮丧，那你永远也不会快乐起来。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "呼吸、思考、享受和爱。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "认知的力量", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "我们不仅仅会认为自己更喜欢某样东西，也会用一种更积极的方式体验这种偏爱。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "对我来说，停止抱怨天气就像给一瓶廉价红酒贴上高价标签：天气不会改变，但我的感受确实改变了。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "与其抱怨玫瑰上的刺，不如感激刺丛里长出了玫瑰", "x": "哲学和神学的宗旨可能就是安慰我们要快乐地生活，但感恩已拥有的东西并不意味着我们不能争取更多。感恩可能是快乐的独家秘方，但只有当它依然允许我们拥有野心和决心时，这个秘方才会奏效。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "第5章 断舍离，获自在人生", "x": "很感恩，我明白了过得快乐不需要额外拥有什么东西。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "人们从体验中获得的快乐更加持久", "x": "心理学家把这种现象叫作“快乐水车”：你因为买了想要的东西而感觉满足，而当满足感逐渐消退时，你再去买一件新的。你买的东西可能越来越精致，或越来越昂贵，但这个循环永不休止。你可以不断提高自己的购物目标，但每当冲到了终点线，你就会开始渴望新的东西。正如吉洛维奇说的那样：“你完成一个目标后会想去追求另一个。”", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "人们无法在购物中心买到对宇宙的感恩", "x": "体验式消费", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "人们无法在购物中心买到对宇宙的感恩", "x": "应该把钱花在体验，而非物品上", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "你说“谢谢”的样子帅极了", "x": "从遗憾转变为感恩，可能只需要改变你斤斤计较的心。", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "你说“谢谢”的样子帅极了", "x": "用感谢替换期待", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "对消极反应来说，感恩可能是一种解毒剂", "x": "思考过去或未来，是人们对这个世界感到心烦意乱的、仅有的两种方式。", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "感恩“吓跑”了我的偏头痛", "x": "利波尼斯医生曾经把爱（Love）叫作维生素L，所以，我告诉他，现在我会把感恩（Gratitude）叫作维生素G。", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "感恩“吓跑”了我的偏头痛", "x": "当因为一件小事而难过时，我会停下来告诉自己，所有事物都是相对的。我一直在提醒自己，我是这个星球上最幸运的家伙。", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "花点时间充分体验具体化的感恩", "x": "你知道自己永远也不会像他们那么优秀，但可以从他们身上学到一些新知，以便更好地玩属于自己的游戏。", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "大自然具有疗愈的力量", "x": "我们的精神是大自然赋予的", "y": "", "d": "2022-11-21"}, {"k": "h", "c": "我很美，但还需要再瘦10磅！", "x": "感恩自己的身体很健康，感恩可以买到健康的食物，感恩今天天气很好可以出门散步。", "y": "", "d": "2022-11-23"}, {"k": "h", "c": "我找到了法国女人不长胖的原因", "x": "处于负面情绪中时，你就会想吃一些能马上让你感觉更好的东西。只有正处于正面情绪中时，你才会更多地思考自己的长期感受。", "y": "", "d": "2022-11-23"}]}, {"id": "43696907", "title": "人生设计课：如何设计充实且快乐的人生", "author": "比尔·博内特 戴夫·伊万斯", "cats": ["个人成长-人生哲学"], "bmCount": 33, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "正如福特说的，如果在汽车还没被发明出来时问大众，你们想要什么？他们会说“一匹飞快的马”（名词），但是如果你问他们，你们想要做什么？他们的答案是“更快地抵达”（动词）", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "在人生设计课里，“小时候，你有什么目标？”这个问题被重新定义为“你在什么时候最快乐、最有能量？”当初心从“名词”转换为“动词”时，我们就能找到自己真正关切的东西。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "职业生涯里有一个很大的难题——什么是最适合自己的方向？如何找到这个方向？如何确定它是“最适合”的？\n每个选项都有缺陷：赚钱多的时间少，时间充裕的发展慢，发展快的自己又不太喜欢……", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "人生设计的思路是，每个人都有许许多多可能适合自己的生活方式。人生设计课会逼你（对，就是逼你）进行头脑风暴，想出至少10个选择项，不管靠不靠谱——因为一个好点子来自很多点子，输入决定输出。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "真正好的人生状态是：我发现了很多适合自己的选择，而且决定从某个选择开始先试试看。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "不要“做出决定，坚定推进”，而是“边走边看，低成本试错”", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "当你在犹豫是否要去大城市生活，犹豫是否要离开北上广，犹豫是否应该换个行业时，你最常听到的建议是认真做调查，访谈很多人，做很多测试并得出结论，列出决策平衡单，最后做出一个最好的决定，然后坚持下去。\n人生设计课则提供了一个全然不同的思路：当你没有真的推进的时候，你根本不知道自己会遇到什么困难。互联网公司的做法是进行AB测试，而最聪明的人生设计方法，是做一个“AB人生原型”，然后开始小范围试错。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "相比在焦虑、犹豫中来回摇摆的心力交瘁，探索本身就是一件快乐、有趣，而且效率更高的事情。而且，你在尝试中学到的东西，也会迭代到未来的新选项中。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "你看，我用了这么多诸如“兴奋、喜欢、感觉、看看、体验、观察”的词，因为人生设计本身就是一个持续观察和体验的过程。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "推荐序 你的人生是工业品，还是艺术品？", "x": "人生设计的思路——“重新定义问题，找到尽可能多的选项，选择一个进行快速尝试，直到成功。”", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "引言 如何设计你的人生", "x": "“你学什么专业，你将来就做什么工作”，以及“大学代表了你人生最美好的时光（随后你的人生就会充斥无尽的工作和烦恼）”，这显然是两个错误的观念，我们把它们称为“思维误区”——这些谬论误导了很多人，使他们无法设计自己想要的人生。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "引言 如何设计你的人生", "x": "思维误区：你的学位决定你的职业生涯。\n重新定义：3/4的大学毕业生最后从事的工作都与他们所学的专业无关。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "引言 如何设计你的人生", "x": "思维误区：获得成功就会感到幸福。\n重新定义：真正的幸福源于设计有意义的人生。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "引言 如何设计你的人生", "x": "思维误区：太晚了。\n重新定义：设计一种自己热爱的生活，何时都不晚。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "引言 如何设计你的人生", "x": "保持好奇。好奇心能够帮助人们挖掘事物的新鲜感，激发人们探索的欲望，让一切变得更有趣。最重要的是，好奇心会让你“好运连连”", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "辨识无法解决的“重力问题”", "x": "不要去解决这样的问题，不要用工作逃避婚姻问题，不要用一顿大餐来消除工作烦恼，否则你就会像戴夫一样，浪费大量的时间在错误的问题上。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "重力问题", "x": "重力问题有两种情况——一种是完全无法解决的问题（如地球重力的问题），一种是不具有可操作性的问题（如提高诗人平均收入的问题）。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "重力问题", "x": "设计思维中的“接受”阶段。接受，也是设计人生的起点。人生设计的起点不是你希望到达的地方，更不是你认为自己应该在的地方，而是你当下所处的真实位置。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "首先要知道自己在哪里，并且对你的情况进行评估，对你的生活进行盘点，清楚地描绘你的现实情况，并回答一个老生常谈的问题：“你最近怎么样？”下面，我们首先来看看需要评估哪些方面的内容。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "健康（Health）。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "即情绪健康、身体健康和心理健康", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "工作（Work）", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "娱乐（Play）", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "“娱乐”活动既包括有组织的活动、各种竞赛，也包括生产性的活动。在做这些事情的时候，如果你只是为了寻找快乐，那么这就是“娱乐”。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "爱（Love）", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "人生设计评估", "x": "在你的人生中，谁爱你？你又爱谁？你是如何爱他们的？他们又是如何将爱给予你的？", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "“健康/工作/娱乐/爱”仪表盘", "x": "评估当前情况（“你在这里”）的一个方法就是关注我们提供的“健康/工作/娱乐/爱（HWPL）”仪表盘。把它想象成你汽车仪表盘上的测量仪。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "“健康/工作/娱乐/爱”仪表盘", "x": "思维误区：我应该已经知道自己的目的地了。\n重新定义：只有你了解了自己现在的位置，你才能知道如何到达目的地。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "“健康/工作/娱乐/爱”仪表盘", "x": "下面我们来看一下你的仪表盘。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第2章 创建人生的指南针", "x": "第二步就是来创建你的指南针。\n创建指南针，你需要两样东西——一个是工作观，一个是人生观。我们需要知道工作对你来说意味着什么。工作的目的是什么？你工作的原因是什么？是什么让工作变得有趣？如果你能清楚地阐述你的工作观（工作的目的和原因），你就不会让其他人为你设计人生。建立自己的工作观是创建指南针的重要组成部分；另一个重要组成部分是人生观。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第2章 创建人生的指南针", "x": "人生观是你对世界以及世界如何运行的看法。是什么赋予了人生的意义？是什么让你的生活有价值？你是如何和你的家人、你所在的社区以及整个世界联结的？为什么金钱、名誉和个人成就会提高你的生活满意度？在你的人生中，阅历、成长和成就感重要吗？这些方面有多重要？", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第2章 创建人生的指南针", "x": "在这个世界上以及我们的大脑里，总有各种强有力的声音告诉你应该做什么、应该成为什么样的人，因为有很多人给你树立了“应该如何生活”的榜样，你也可能像帕克一样，一不小心就跟随他人的指南针，复制着他人的生活。若要避免这种情况，最好的方法就是清楚地阐述你自己的工作观和人生观，为自己创建一个独一无二的指南针。", "y": "", "d": "2024-02-21"}, {"k": "h", "c": "第2章 创建人生的指南针", "x": "拥有一份你享受其中且热爱的工作，在充满爱的氛围中生活，人生旅途中充满各种乐趣，健康并且长寿", "y": "", "d": "2024-02-21"}]}, {"id": "3300018079", "title": "我不是教你诈", "author": "[美]刘墉", "cats": ["个人成长-沟通表达"], "bmCount": 32, "rvCount": 0, "notes": [{"k": "h", "c": "好个知心朋友", "x": "“交浅而言深，既为君子所忌，亦为小人所薄”。", "y": "", "d": "2024-07-06"}, {"k": "h", "c": "好个知心朋友", "x": "无论对别人说自己的秘密，或去听别人的秘密，都没什么好处。你可能有“短利”，也可能有“长害”", "y": "", "d": "2023-07-03"}, {"k": "h", "c": "众“妄”所归", "x": "这世上不合理的好处，是不能拿的。不合理地去信任别人，是危险的。", "y": "", "d": "2024-07-06"}, {"k": "h", "c": "牛马逃亡记", "x": "在看别人立场的时候，不可忽略那个“人”。绝对不要用立场否定“人”或否定“人性”。", "y": "", "d": "2023-07-03"}, {"k": "h", "c": "何必逼人太甚", "x": "避免正面的冲突，是处世的重要技巧。", "y": "", "d": "2023-07-03"}, {"k": "h", "c": "吴太太的房子", "x": "人们常常莫名其妙地失望，失望在他们不实在的“希望”之中。而那不实在的希望，又常是某些人不小心造成的。", "y": "", "d": "2024-07-06"}, {"k": "h", "c": "王老虎上任", "x": "能不传话，最好不要传话；能不套话，最好不要套话；能不涉入“背后的批评”，最好不要涉入。", "y": "", "d": "2023-07-03"}, {"k": "h", "c": "王老虎上任", "x": "让自己像沙滩，多大的浪来了，也是轻抚着沙滩，让它们一一地退去。而不要像岩石，使小小的浪，也激起高高的水花。", "y": "", "d": "2023-07-03"}, {"k": "h", "c": "丢脸有理", "x": "“聪明”包括的不仅是知识、反应，更应该包含处世的智慧。", "y": "", "d": "2024-07-07"}, {"k": "h", "c": "姜是老的辣", "x": "这世界上处处有古先生，看起来把最好的东西交给你，令你感激涕零。但是，你也要想想，凭什么他要给你？你是真年轻干练，足当重任吗？抑或你只是个替死鬼？不要忘了！尤其在你最得意的时候，切记：天下没有白吃的午餐！", "y": "", "d": "2024-08-14"}, {"k": "h", "c": "老板靠边站", "x": "你必须知道，无论你帮老板管了多少事情，也无论老板多糊涂，甚至依赖你，到了没你在，他连电话都不会拨的程度，他毕竟还是你的老板，也毕竟还是他做主。出了错，他最先承担。有面子，也该由他来卖。", "y": "", "d": "2024-08-14"}, {"k": "h", "c": "卖瓜瓜不甜", "x": "善带人的人，可以关起门来，严惩自己的人，但是当外人批评时，必然身先士卒地为“自己人”辩护。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "后来居上的小董", "x": "人们失败，常因为不能替对方想。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "包在我身上", "x": "问题是，谁不喜欢听好听的话呢？每个人都认为自己很理性，能够明辨是非，但是每个人在不自觉中，也都爱听谗言。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "包在我身上", "x": "从政的人常说，先不要考虑开出去的政见支票能不能兑现，而要知道，如果得不到政权，就连半个政见也无法兑现。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "第五纵队成军记", "x": "即使你百分之百确定，也不能在言谈或任何行动上表现出来，即使那“掩不住的喜色”，都不可有。否则，你就可能空欢喜一场。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "临门被他踢一脚", "x": "人都有这个毛病——心里藏不住话，尤其当自己对别人有恩的时候，更巴不得对方早早知道。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "走下山头的时候", "x": "认为每个人，无论你是长官或部属，政客或小民，都应该了解“不成熟的事不可说”的道理。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "樱花街传奇", "x": "碰到好位子，赶不及过去，请人帮你先占着，再让给你，是“前卡位”。\n遇到挡路的人，把他调开，再用你的人补上去，是“后卡位”。\n“后卡位”的学问可比“前卡位”大多了。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "D-Day攻击计划", "x": "我们看到弊端，不能不反映，否则社会怎么进步？公理如何伸张？\n但是如果能用“渐进的改革”，取代“突然的变法”，能用“和平转移”取代“流血革命”，能用“大家赢”取代“一人赢”，不是更好吗？", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "D-Day攻击计划", "x": "我不是教你诈，是教你认清别人的诈。\n我不是教你诈，是盼望你在不得不耍诈时，也能有关怀、有包容。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "诸葛亮出马", "x": "于是你会发现那些最没声音、最不争的人，总被人冠以“没有企图心”，也就很难在人群中出头。反而那些能拍马、会扯淡、争功诿过的庸才，一个个你踩我，我踩你，步步高升。\n所以，好比EQ比IQ重要、人际关系比智商重要，企图心也是一种才能，它甚至比办事的才能更重要。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "诸葛亮出马", "x": "会哭的孩子有糖吃，会争的职员有好处，那些“无争”的人，则可能到最后才被想起。\n所以，无论你如何淡泊，无论你如何“不喜欢跟人争”，当你遇到不平的时候，一定要表态，否则你非但不会被尊重，而且可能被歧视。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "情色攻坚事件", "x": "当所有人都后退的时候，站着不动的人，就自然成了“前进者”。", "y": "", "d": "2024-08-15"}, {"k": "h", "c": "毛病大家说", "x": "记住！不要意气用事，不要冲动地去争吵，要冷眼看人生，在那许多人际利害的矛盾中，累积自己的知识。", "y": "", "d": "2024-08-16"}, {"k": "h", "c": "沙发上的战场", "x": "人们上当，常因为懒，那懒又常由于对自己没信心。", "y": "", "d": "2024-08-16"}, {"k": "h", "c": "小心留下脚印", "x": "你要是不说话，别人不会当你是哑巴。你要是多说话，别人一定知道你是个好骗的傻子。", "y": "", "d": "2024-08-16"}, {"k": "h", "c": "当新人进入洞房", "x": "你必须知道，许多时候你当“调解人”​，人家和好了，你自以为居功甚伟，后来才发现自己不但没得好报，反而被诬陷。中国有句俗话——新人送进房，媒人踢过墙。不要以为这是玩笑话，其实里面有大道理。", "y": "", "d": "2024-08-19"}, {"k": "h", "c": "“哀”兵必胜的老廖", "x": "事情做坏了，你可以加班设法补救；文件遗失了，你可以翻箱倒箧，整夜留在办公室找。你可能怎么加班，都无法把事情补救过来；你也很可能找个两天两夜，都找不到。但是，就跟老廖一样，你可怜的低姿态，会渐渐得到同情。最后，老板过来，当着一屋子同事的面，拍拍你：“回去好好休息休息吧！”", "y": "", "d": "2024-08-19"}, {"k": "h", "c": "“哀”兵必胜的老廖", "x": "用“积极行动”取代“消极哀叹”​；以“勇于改过”取代“善于强辩”​；用“低姿态”争取“广大的同情”​；用“拖延战术”取代“当面对决”​。大到治理国家，面对一国的人民；小到铺一块地毯，面对一家的客户。", "y": "", "d": "2024-08-19"}, {"k": "h", "c": "老莫的第二春", "x": "我处处发现懂得先说抱歉的人，到后来占到便宜。这叫“输了面子，赚了里子”​。", "y": "", "d": "2024-08-19"}, {"k": "h", "c": "老莫的第二春", "x": "两个人打架，被拉开之后，都会偷偷看着对方的手——他举起来打，我也举起来打；他伸出来握，我也伸出来握。当所有人都认为你有资格“举起来”​，你却先“伸出去”的时候。你不是软弱、不是屈服、不是耍诈，而是有了“人生的大智慧”​。这世上有什么能比“把一个死敌变成朋友”更称得上“赢”的事呢", "y": "", "d": "2024-08-19"}]}, {"id": "915288", "title": "亲密关系", "author": "克里斯多福·孟", "cats": ["个人成长-沟通表达"], "bmCount": 31, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 亲密关系的圣杯", "x": "如果关系出了问题，你并不需要寻求外力的帮助——你自己就有足够的能力来处理问题，并成长、体验到高层级的、真正的灵魂关系。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "吸引磁场", "x": "其实，这种美好感觉的真正原因，是因为我意识到需求即将得到满足。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "“通往地狱之路，是用期望铺成的。”\n——克里斯多福·孟", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "如果我不能接受别人现在的样子，或不让他们自由地走自己的路，那么我就不是真的爱他们。我只是想从他们身上得到满足，与他们建立亲密关系的目的并不是为了爱，而是为了满足我小小的自私需求。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "她没有满足我，让我很失望。其实满足我并不是她的责任，但那时我们都不知道！直到我审视自己的内心后才明白，如果我感到失望、愤恨，一定是因为我对妻子有所期望，而在她做到之前，我无法快乐起来。在这样的亲密关系互动中，最悲哀的是，在“小小的我”得到满足之前，我们不愿意去爱我们的伴侣。紧抱着需求不肯放手，又不让自己去爱，就这样，我们把自己推向亲密关系的地狱。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "不论是用暗示还是明说的方式提出要求，我们都必须明白一件事：我们真正需要的，没有人能给，也没有人能让我们快乐。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "期望的目的是让需求得到满足，但在这同时，必然会发生两件事：第一，我们感到内心缺乏爱（如果我们需要某样东西，一定是因为我们自己没有）；第二，如果没有某个人（例如父母）来满足我们的需求，我们就会觉得这个世界没有足够的爱。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "我们要求别人来爱我们，那就是否认我们自己心中有足够的爱。觉得不被爱，必定会让我们产生一些缺乏爱的信念，如我们不值得被爱，或我们并不可爱……于是，即使伴侣向我们保证我们是可爱的，我们内心却有一个更强大的声音说我们并不可爱。如此一来，不管伴侣提出多少证据来证明我们值得被爱，都是不够的。就好像耳塞能阻断声音一样，期望也会阻断内心的爱。不管我们多努力地运用暗示或明说的期望，试着让伴侣“变得更好”，都是徒劳无功的，因为我们行为背后的需求，绝不会让我们感觉到自己内心的爱。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "通往地狱之路", "x": "骑士找不到圣杯，因为它的所在，正是骑士们认为最不可能的地方，那就是他们的心中。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "压力、失望和愤恨", "x": "愿不愿意寻求自己内在的力量来满足我的所有需求呢？我愿不愿意让这种内在的力量成为我快乐的源泉，而不再把伴侣当成予取予求的对象？如果你的答案是肯定的，那么你的直觉会告诉你该如何放手。你该做的已经做了，剩下的就交给你的灵魂去处理。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "压力、失望和愤恨", "x": "一切都取决于你的意向。如果你愿意放手，就有机会发现，你所需要的一切，其实都存在于你的心里，不假外求。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "压力、失望和愤恨", "x": "因为不被满足的期望，迟早会变成愤恨，让你和伴侣渐行渐远。在你能察觉之前，早已置身于通往地狱的路上了。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "因果关系", "x": "当你与伴侣初遇时，你们所分享的大多是“好的”。到了幻灭的阶段，你们便会开始发现所谓的对方“不好的”一面。在这个阶段快要结束，而内省的阶段即将开始时，事情多半会变得“丑陋”。如果你能用健康的态度来面对“不好的”和“丑陋的”，那么内省的阶段将会让你领悟到亲密关系事实上是多么“神圣”。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "愤怒", "x": "情绪抽离的各种形式、效果都是一致的：一言不发地让自己远离造成痛苦的人。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "愤怒", "x": "愤怒背后的主要意图也就是如此：让别人有罪恶感，让他们为你内心的痛苦负责。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "愤怒", "x": "于是，让你快乐就成了他们的责任。从长远的眼光来看，你用何种方式表达愤怒，或别人用何种方式对你表达愤怒，根本就不重要。如果你感到愤怒，怒气其实是在保护你不去感受痛苦。如果我们能对自己诚实，并选择面对痛苦，我们就会了解这是治好旧痛的机会。而如果我们选择攻击伴侣或抽离自己的情绪，那么我们也许不必去感受痛苦，但同时我们也失去了疗伤的机会，自然也就无法改正这些痛苦所造成的自我局限的信念。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "站在对的一方", "x": "“你情愿自己是‘对的’，还是‘快乐的’？”", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "站在对的一方", "x": "如果你希望拥有健康、美好的亲密关系，你也许会考虑对自己的愤怒负责，充分地感受它，但不把怒气加在别人身上，这样你才能发现生气是为了逃避什么。如果你愿意面对自己所逃避的感觉——不论这令你多么不自在——你就能发掘埋藏在更深处的、平静而充满爱的感觉。我的亲身经历告诉我，不管多大的痛苦，只要集中全部精神来面对它，我就能有效地减轻痛苦，并让它转变成正面的感觉。要做到这样，必须有决心，我把这样的决心叫作“爱意”。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "爱意", "x": "“爱会找到出路。”", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "你们之间最短的距离", "x": "想象你和伴侣坐在一张长桌的两头，在桌子的正中间，摆着一顶帽子。从你的角度看去，帽子是红色的。从你的伴侣的角度看去，帽子则是蓝色的。你看不到蓝色的部分，对方也看不到红色的部分。如果要你们描述自己看到的东西，那么你的说法就会和你的伴侣不一样。如果权力斗争中的双方都固执己见，而相信对方是错的的话，问题就出现了。（“你是色盲吗？就连白痴都看得出来这顶帽子是红色的。”“没错，只有白痴才会觉得这顶帽子是红色的！正常人就知道它是蓝色的！”）\n事实上，你们双方都是从自己的角度去看事情，并坚持自己是对的。但如果你能够放下自己的立场，从对方的角度来看一看，那么你就可以把两人的意见综合起来而得到真相——这是一顶红蓝各半的帽子！", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "能谈谈吗？", "x": "我们来看看有效沟通的八个纲要问题：\n1．我想要什么？\n2．有没有什么误会要先澄清的？\n3．我所表达的情绪，有哪些是绝对真实的？\n4．我或我伴侣的情绪，是不是似曾相识？\n5．这种情绪是怎么来的？\n6．我该怎么回应这种情绪？\n7．情绪背后有哪些感觉？\n8．我能不能用爱来回应这种感觉？", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "能谈谈吗？", "x": "我不想从伴侣身上“获得”什么东西——这样我会觉得自己像个贼一样，我情愿“接受”伴侣自愿给我的东西。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "赢在心态上", "x": "痛苦虽不能避免，要不要受苦却可以选择。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "第四章 内省", "x": "没有人会满足我们的需求，没有人会让我们快乐，也没有人该为我们所受的伤负责。在外四处寻找之后，我们终于了解到，我们所有生活经验的因和果只可能存在于一个地方——我们的心中。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "受害者监牢", "x": "1．要解决问题，必须先跳脱问题的框架。\n2．所有的问题，其实都是经过伪装的礼物和宝贵经验。\n3．你所看到的每件事，都是你内心世界的投射。\n4．每个人都有能力为自己生活中遇到的事百分之百负责。\n5．自由并非来自答案，而是来自问题。\n6．没有什么问题是大到爱无法解决的。", "y": "", "d": "2022-05-17"}, {"k": "h", "c": "魔镜，魔镜", "x": "基本上，我们对别人的意见，是在观察他的行为，并用自己的想法诠释之后所形成的。", "y": "", "d": "2022-05-18"}, {"k": "h", "c": "以怀疑为手段的阴谋", "x": "6．所有的怀疑都是对自己的怀疑。换句话说，如果你这样说：“我无法相信伴侣的爱，我想他/她早晚会伤害到我。”那么其实你真正表达的意思是你不能相信自己。你所谓对伴侣的“信任”，其实是一种期望——你希望对方的行为不会对你造成威胁，或使你的旧伤复发。事实上，你是不相信自己有能力去处理伤痛或爱你自己的。", "y": "", "d": "2022-05-18"}, {"k": "h", "c": "亲密关系通关指南", "x": "当从幻灭的阶段移至内省的阶段时，你就得到了一个机会去检视自己的内心并发觉所有亲密关系问题的源头。幻灭会让你发现是哪些错误的观念掌控了你大半辈子，并让你了解到，你可以为自己百分之百负责。内省则会让你有更深的洞察力，去揭开错觉的面纱，从而大大地改变你对自己的看法。", "y": "", "d": "2022-05-18"}, {"k": "h", "c": "第五章 启示", "x": "启示推动着你的力量，让你从一个阶段迈向下一个阶段，并在痛苦和问题之中成长。幻灭的痛苦，会让你了解到月晕的光彩是不实的。内省则会让你从自己的内心找出所有错觉和错误观念的根源。超脱了空虚、怀疑等感觉，到了启示的阶段时，你就会发现真正的自己。灵魂关系让你的伴侣可以看到真正的你。所以，每当我们学习到真正重要的事物时，我们就是得到了启示。", "y": "", "d": "2022-05-18"}, {"k": "h", "c": "灵魂关系", "x": "爱说：“事无好坏，诠释在人。”", "y": "", "d": "2022-05-18"}, {"k": "h", "c": "灵魂关系", "x": "让爱在你的生命里生根，美好的事就会发生。", "y": "", "d": "2022-05-18"}]}, {"id": "38604185", "title": "100种幸福：生活的答案", "author": "亚瑟·叔本华", "cats": ["个人成长-人生哲学"], "bmCount": 26, "rvCount": 0, "notes": [{"k": "h", "c": "关于幸福的三个真相", "x": "当人们讲述一些令人愉快的事情时，这种能力便会赋予这些事情独特的意义，这些事情对于天才来说，充满了快乐的冒险情趣，而在感觉迟钝的凡夫俗子眼中，则变得乏善可陈、司空见惯。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "关于幸福的三个真相", "x": "每个人无疑都被幽禁在自己的意识内，人无法超越自己，更无法直接走出上述界限。因此，外在的帮助对他并无太大意义。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "关于幸福的三个真相", "x": "人生客观的部分掌握在命运之神手中，就其本质而言它是永远不会改变的；而主观的部分则掌握在我们自己手中，它会因情况变化而发生改变。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "关于幸福的三个真相", "x": "人们追求幸福的努力永远都不会超出其本性所许可的范围，只能局限于能感觉到的范围；人所能得到的幸福的多少，从一开始就由他的人格决定了。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "关于幸福的三个真相", "x": "温文尔雅、活泼快乐的气质，完美强健的体魄，健全的理智，敏锐的洞察力，坚强的意志以及良知，这些优势都是地位和财产不能替代的。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "关于幸福的三个真相", "x": "一个理智的人，即便处在完全孤独的状态中，也能以他的思想、他的幻想获得很大的快乐；即便没有丝毫变化，没有舒服的社交，没有看戏、出游和消遣，他也不会有愚人的烦恼。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "为了保持健康，人们应当做些什么，这几乎不消我多说——避免一切过度、放纵、令人不快的情感以及所有精神上的过度劳累，每天坚持在新鲜空气里锻炼，勤洗冷水澡，以及其他像这样能促进健康的活动。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "最愚蠢的行为就是为了其他幸福，如利益、晋升、知识或荣誉，而牺牲自己的健康，不管是什么样的幸福，这样做都是愚蠢的，为了转瞬即逝的肉体欢娱而糟蹋自己的健康这种行为就更不用说了。健康比其他任何东西都能带给我们更多的幸福。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "人们不应当从他人那里期待过多，或对一般而言的外部世界要求过多，一个人能给予别人的东西极为有限，每个人最终都得孑然一身，此时，最重要的是这单独的人是谁。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "“无论经历什么事情，人们最终都不得不求助于自己。”", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "无论身在何地，我们只能把自己托付给自己。 \n  自己的运气要靠自己创造或寻找。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "因为幸福的其他源泉，就其本性而言，都是不可靠、不确定、极为短暂和偶然巧合的。因此，即使在最为有利的条件下，它们也很容易消耗殆尽，并且这是无法避免的，因为我们不能轻易控制它们。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "幸福不在别处，就在你的身上", "x": "虽然我的哲学从未给我赢得一个小钱，但它却让我避免了许多损失。", "y": "", "d": "2022-12-11"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "过分地重视他人的看法，是人类共有的顽疾。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "人性有这样一个非常特别的弱点，即人们通常过分重视别人对自己的看法，虽然这种看法对自身造成的影响非常有限，不管别人的意见如何，它自身与幸福并没有本质的联系。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "在别人眼中的我们的范围里所发生的一切，都存在于他们的意识中，而不是我们的意识中；这包括我们在他们眼中的形象，和由此激发的种种看法", "y": "", "d": "2022-12-23"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "过高地估价他人所说的话，未免太尊敬他们了。", "y": "", "d": "2022-12-23"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "健康是幸福最为本质的要素，其次是维持我们独立自主、无忧无虑的生活的能力。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "过分地重视他人的看法，是人类共有的顽疾，它或许源于人类的本性，或许是文明以及一般意义上的社会安排所带来的后果。但不管它的来源是什么，它无疑对我们的所作所为产生了不好的影响，而且十分有害于我们的幸福。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "我们所有的忧虑、困扰、担心、烦躁、苦恼，乃至愁肠百结、尽心竭力，在大多数时候，都是过多考虑别人会怎么说而引起的。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "名誉与傲慢的假象", "x": "我们可以避免很多的不幸，这些不幸源于我们追求那些阴影，或确切地说，源于我们沉溺在一些有害的愚蠢行为之中。因此，现在我们应当将更多的注意力放在那些坚实可靠的实在的事物上，不断地享受它们。", "y": "", "d": "2022-12-23"}, {"k": "h", "c": "内心的宁静是幸福的根基", "x": "我们既不应该沉湎于对往事的追悔惋惜，也不应该因牵挂未来而思绪不宁、焦虑企盼，而应该牢牢记住：只有当下才是实在的、确定的。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "内心的宁静是幸福的根基", "x": "过去常与我们曾经预料的相去甚远；未来也总是无一例外地使我们的希望落空。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "内心的宁静是幸福的根基", "x": "“尽我们最大的努力去愉快地迎接它，因为这是我们仅有的真实的时刻。”愉快地度过每一天，似乎我们的全部生命就在这每一天中。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "内心的宁静是幸福的根基", "x": "如果一个人总是保持戒备，那么，他便永远无法得到安宁。", "y": "", "d": "2022-12-13"}, {"k": "h", "c": "内心的宁静是幸福的根基", "x": "要么把它们当作根本就不可能发生的灾难，要么把它们当作短时间内不会发生的灾难。", "y": "", "d": "2022-12-13"}]}, {"id": "3300055219", "title": "最优解人生", "author": "比尔·帕金斯", "cats": ["个人成长-人生哲学"], "bmCount": 18, "rvCount": 0, "notes": [{"k": "h", "c": "1 极致人生", "x": "换句话说，要想将你的时间和金钱用到极致，时机很重要。所以，为了总体上增加你人生的充实感，在合适的年龄获得各种体验很重要。无论你喜欢什么，或者你有多少钱，都是如此。", "y": "", "d": "2024-02-26"}, {"k": "h", "c": "1 极致人生", "x": "从你的体验中获得最大充实感，利用你的资源合理安排时间与金钱，让价值最大化，这就是你人生的最优解。", "y": "", "d": "2024-02-26"}, {"k": "h", "c": "1 极致人生", "x": "体验不一定要花很多钱，甚至免费可得", "y": "", "d": "2024-02-26"}, {"k": "h", "c": "1 极致人生", "x": "相比于花钱买物品，将钱花在体验上能让我们更加快乐。物质财富刚开始可能令人非常开心，但是它们往往会迅速贬值。与此不同，体验会随着时间增值，我称之为“回忆红利”，", "y": "", "d": "2024-02-26"}, {"k": "h", "c": "2 投资体验", "x": "人生就是不断收集回忆的过程，最终能陪伴我们的也只有回忆了。”", "y": "", "d": "2024-02-26"}, {"k": "h", "c": "2 投资体验", "x": "的目标则是尽可能实现“富有”的人生；我所说的“富有”是指体验、冒险及回忆上的富有", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "3 为什么要死前归零？", "x": "提供退休建议的网站就经常提到慢活之年和失活之年，但是“活力”下降这一概念似乎并未在民众中普及。", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "3 为什么要死前归零？", "x": "我并不是怂恿你累积大量医疗费用后，有计划地赖着不交钱。我要说的是，你负担不起高昂的临终医疗费。既然无保险的医疗如此昂贵，对我们绝大多数人来说，无论有没有存款都没有太大差别：要么政府帮你付，要么你与世长辞。", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "3 为什么要死前归零？", "x": "真正的“生活”与仅仅“活着”之间相差十万八千里。我宁愿为了生活花钱，也不愿将工作多年存下来的钱，浪费在戴着呼吸机苟活数月上，这样的生活毫无品质可言。", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "3 为什么要死前归零？", "x": "我宁愿顺其自然。我们每个人早晚都会死，我宁愿“死得其时”，也不愿牺牲我的美好岁月，只为在生命尽头赖活几天。", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "3 为什么要死前归零？", "x": "更加明智的做法是将你的医疗支出花在“前端”（保持健康，预防疾病），花在“后端”将很不划算。", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "5 那孩子们怎么办？", "x": "归根结底，如果你一直等到死后才让子女继承遗产，你就相当于“听天由命”了，我称之为“三个随机”：在随机的时间，将随机的财产数量，给予随机的人（因为谁能知道你的继承人中，哪些在你死的时候还活着？）。随机，怎么可能是为他人着想呢？", "y": "", "d": "2024-02-27"}, {"k": "h", "c": "6 平衡人生", "x": "如果你在某些年龄享受人生体验的能力更强，那么你在这些年龄花更多钱就理所当然。因为相比于80多岁，10万美元在你50多岁时价值更大，而你的目标是让财富及人生都能“物尽其用”。因此，至少让80多岁的你匀一点钱给50多岁的你使用，这才符合你的最佳利益；同理，也应该挪一点给20多岁、30多岁及40多岁时的你使用。", "y": "", "d": "2024-02-28"}, {"k": "h", "c": "6 平衡人生", "x": "对于因工作消耗了大部分时间和生命能量、需要整天坐在电脑前的人来说，尤其如此。最后结局如何？当这份劳心费力的工作终于给你带来经济上的成功时，你还拥有享受这一成功的关键要素（健康）吗？", "y": "", "d": "2024-02-29"}, {"k": "h", "c": "6 平衡人生", "x": "无论在哪个年龄，好的身体都将全面提升你的生活品质，让你更能享受每一次的体验。", "y": "", "d": "2024-02-29"}, {"k": "h", "c": "6 平衡人生", "x": "早一点投资健康实际上能让人生更加充实。合理饮食及锻炼肌肉等预防性做法有助于尽可能持久地维持良好的身体状态，还可以让每项体验更加愉悦。", "y": "", "d": "2024-02-29"}, {"k": "h", "c": "7 分段人生", "x": "便是“我们每个人一生中都会‘死亡’无数次”的玄机所在：十几岁的你“死”了，身为大学生的你“死”了，单身未婚的你“死”了，身为父母、子女尚小的你“死”了，诸如此类。这种“迷你死亡”无法逆转，也许“死亡”这个词有点严重了，但这个意思你应该能懂：我们一直在“前行”，从一个人生阶段进入下一个人生阶段。我知道，我死啊死的说了太多，但积极的一面是，我们拥有这么多条“命”，可以让我们去生活，去享受，去活得淋漓尽致！", "y": "", "d": "2024-02-29"}, {"k": "h", "c": "8 了解你的峰点", "x": "投资那些值得回忆很久的体验；时刻记住所有人的身体状况都会随年龄增长而变差；在生前就将钱给子女，而不是存着作为遗产；学会平衡当下享受与延迟满足。", "y": "", "d": "2024-03-01"}]}, {"id": "33890230", "title": "好心情手册", "author": "邵夷贝", "cats": ["心理-积极心理学", "个人成长-情绪心灵"], "bmCount": 17, "rvCount": 0, "notes": [{"k": "h", "c": "自序", "x": "我陷入了一种看似不明显，却不能忽视的困境——无法享受生活，无法获得稳定的好心情，无法维持足够时长的专注，无法保持平稳而饱满的精神和创作状态，每天都被不知道是什么的事情消耗着能量，疲惫不堪。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "自序", "x": "日常生活中，我们每天也疲于应对各种细微的变化和不确定。这些“不确定”带来了很多危机感和情绪焦虑。适度的焦虑令人奋进，而持续的焦虑则会把人拖垮。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "自序", "x": "活下去，尽情地投入到这个不完美的世界中间去。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "自序", "x": "对于现代社会的我们来说，单单是把自己的注意力从芜杂而混沌的信息流里捞出来就已经很难了，“冷静、清醒、有条理”则是对当代人而言极其重要的优良品质。我们总结的很多规则、秩序上的经验、自律的努力，都是在与这种混乱进行对抗。若是能在这混乱中建立生活的条理，让一部分日常不内耗地规律运行，生活会轻松得多。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "自序", "x": "我们的生活始终在接受这两种相反力量的拉扯，一种力量制造秩序与效率，一种力量引发混乱与消耗，比如：努力和休闲。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "自序", "x": "1946年，世界卫生组织在其宪章的序言里写道：“健康是一种身体上、精神上以及社会关系上的全面良好状态，而不仅仅是没有疾病或不虚弱。”", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "（三）如何应对“不开心”", "x": "第一步，觉察到情绪，正视它的存在。", "y": "", "d": "2021-01-14"}, {"k": "h", "c": "（三）如何应对“不开心”", "x": "所以，如果不是面临非常紧急的事情，我们首先需要停下来，先和坏情绪保持一段距离，让杏仁核冷静下来。最有效的方法就是转移注意力。你可以玩会儿游戏、点个外卖、看个短片、打扫房间、打个电话或者干脆出门健身。", "y": "", "d": "2021-01-14"}, {"k": "h", "c": "（四）情绪是可以训练的", "x": "正念冥想是为了改善我们注意力过度分散的状态。所以，如果要开始正念，我们马上可以做的就是：把注意力聚焦到呼吸上。开始正念冥想最简单的方式就是“数自己的呼吸”。不需要借助任何技巧和引导，只需要像睡前数绵羊一样默默数着自己的呼吸。呼气——1，吸气——2，呼气——3，吸气——4……以此类推。不需要控制呼吸，次数也不用很多，如果能数到100，你就已经完成了一次简单且有效的正念训练。", "y": "", "d": "2021-01-14"}, {"k": "h", "c": "（四）情绪是可以训练的", "x": "针对焦虑要挑战那些杞人忧天的想法，实地进入令你害怕的情境以锻炼勇气，并运用之前提到的应对技巧减轻焦虑。", "y": "", "d": "2021-01-14"}, {"k": "h", "c": "（一）一小时自我了解", "x": "生活得像一只在圆盘上疯狂奔跑的小仓鼠", "y": "", "d": "2021-01-18"}, {"k": "h", "c": "（二）目标二：成为一个“自得其乐”的人", "x": "获得好心情很重要的一点是，不要把自己的标准建立在别人的评价之上。", "y": "", "d": "2021-01-18"}, {"k": "h", "c": "（二）目标二：成为一个“自得其乐”的人", "x": "“自得其乐的性格”，它的特点是：☆ 有目标和方向感。☆ 能找到足够的乐趣和精神能量。☆ 在出现问题时可对周遭的环境做客观的分析与观察，并从中找到新的行动方案。☆ 比较有弹性，不易碎。☆ 比较容易集中精神。", "y": "", "d": "2021-01-18"}, {"k": "h", "c": "正文", "x": "单纯的享乐主义者让自己沉浸在各式各样的娱乐刺激中，但他们获得持久的快乐了吗？并没有。他们只会觉得游戏越来越不好玩，段子越来越不好笑，身体越来越差，低落的情绪甚至更猛烈地袭来了……", "y": "", "d": "2021-01-18"}, {"k": "h", "c": "（三）自我“放纵”一下", "x": "从容应对大起大落，在不确定中保持稳定。", "y": "", "d": "2021-01-18"}, {"k": "h", "c": "（四）“会休息”比“会努力”更重要", "x": "放松不是虚度，而是有觉知地生活。", "y": "", "d": "2021-01-18"}, {"k": "h", "c": "正文", "x": "☆ 利用优势。☆ 让自己保持状态的积极（通过健身、冥想等）。☆ 养成习惯，而不是依赖意志力，在一些重要的事情上逐渐让自己不费力气（将部分日程程序化）。☆ 和情绪友好相处（提升大脑的积极率）。☆ 尊重自己的基本价值观，学会取悦自己，收获自得其乐的性格。☆ 专注于能够令我们发挥优势的事情。面对打乱我们节奏的事情，在负责任的前提下找到好的解决方法，慢慢远离。☆ 学会合理的自我放纵（建立个人滋养清单）。☆ 好好沟通，建立互相滋养的关系。☆ 在生活、工作的各个方面寻找平衡（收获蓬勃的人生）。", "y": "", "d": "2021-01-18"}]}, {"id": "937589", "title": "写出我心：普通人如何通过写作表达自己", "author": "娜塔莉·戈德堡", "cats": ["个人成长-情绪心灵"], "bmCount": 16, "rvCount": 0, "notes": [{"k": "h", "c": "初始的意念", "x": "写作练习的基本单位乃定时演练。", "y": "", "d": "2026-05-17"}, {"k": "h", "c": "初始的意念", "x": "1．手应当不停地写。（不要停下来重读你刚才写的那一行，那只是在拖时间，并在设法掌控你正在说的话。）\n2．不要删除。（那是在编辑你写的东西，就算写出来的并不是你原本打算写的东西，也随它去。）\n3．别担心拼错字、标点符号和文法。（甚至别去管是否把字写出了格子，或超出线。）\n4．放松控制。\n5．别思考，别想着要合乎逻辑。\n6．直捣要害。（倘若你写出了可怕或太过赤裸裸的东西，那就一头钻进去，其中说不定蕴藏了很多能量。）", "y": "", "d": "2026-05-17"}, {"k": "h", "c": "初始的意念", "x": "把心灵实际所见与所感都写出来", "y": "", "d": "2026-05-17"}, {"k": "h", "c": "把写作当成练习", "x": "“我有写出世上最烂的垃圾的自由。”", "y": "", "d": "2024-11-17"}, {"k": "h", "c": "把写作当成练习", "x": "写作练习的主要目的之一，就是学会信赖自己的心灵和身体，并培养耐性和不具侵略性的态度。", "y": "", "d": "2026-05-17"}, {"k": "h", "c": "把写作当成练习", "x": "艺术的世界何其辽阔，一首诗或一篇短篇小说根本无关紧要，重要的是写作的过程和人生。", "y": "", "d": "2026-05-17"}, {"k": "h", "c": "打豆腐", "x": "总之，闭嘴，坐下，写，就对了。这样做很痛苦，但写作是很单纯、基本且严苛的事，没什么有意思的小玩意儿能使它变得好玩一点。", "y": "", "d": "2026-05-20"}, {"k": "h", "c": "打豆腐", "x": "该写的时候到了，就写吧！", "y": "", "d": "2026-05-20"}, {"k": "h", "c": "明尼苏达州埃尔克顿，不论眼前是什么", "x": "如何激发写作构想，亦即要写的东西呢？凡是在你眼前的，不论是什么，都是一个好的开始。然后走出去，到大街小巷，任何地方都可以去，把你知道的都告诉我。就算你无法证明或者尚未下苦功钻研你所知的事物，都无所谓。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "明尼苏达州埃尔克顿，不论眼前是什么", "x": "用你的写作占有你想要的任何事物，然后放手，任其离去。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "汲取地下水", "x": "别担心自己的才华或能力不足：持之以恒地练习，才华便会有所增长。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "写作不是麦当劳汉堡", "x": "写作时，把一切都放开，设法用简单的文字起个简单的头，表达内心深处的想法。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "烤一个蛋糕", "x": "写作时也当如此：让写作来完成写作，让你自己消失。你只是在记录涓涓流过你身体的思绪而已。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "倾听", "x": "写作也有九成靠倾听，你是如此专注地聆听周遭的环境，以致那环境盈满你的身躯，因而当你提笔写作时，它便一发不可收拾地从你体内流泻而出。", "y": "", "d": "2026-05-29"}, {"k": "h", "c": "倾听", "x": "基本上，如果想成为好作家，就必须做三件事：多多阅读、仔细深刻地倾听，以及多多地写。同时，不要想太多，只要长驱直入文字、声音和各种知觉的核心，并且让你的笔在纸上写个不停。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "提出声明、回答问题", "x": "纵使人生并非永远清楚分明，但清楚且肯定地提出声明表达自己的见解却是件好事。“我是这么认为和感觉的”、“眼前我就是这样的人”", "y": "", "d": "2026-05-31"}]}, {"id": "843464", "title": "刻意练习：如何从新手到大师", "author": "[美]安德斯·艾利克森 [英]罗伯特·普尔", "cats": ["个人成长-人生哲学"], "bmCount": 16, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序", "x": "事实上，艾利克森的刻意练习的核心观点是，那些处于中上水平的人们，拥有一种较强的记忆能力：长时记忆。长时记忆正是区分卓越者与一般人的一个重要能力，它才是刻意练习的指向与本质。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "推荐序", "x": "刻意练习的任务难度要适中，能收到反馈，有足够的次数重复练习，学习者能够纠正自己的错误。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "推荐序", "x": "仍然是西蒙，他认为人的“有限理性”体现在学习中就是“情境理性”——在哪里用，就在哪里学。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "引言 天才存在吗", "x": "我们拥有更大的力量来掌控自己的人生，但我们以前却从来没有意识到。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "所谓“天真的练习”，基本上只是反复地做某件事情，并指望只靠那种反复，就能提高表现和水平。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "有目的的练习具有定义明确的特定目标", "y": "", "d": "2022-05-29"}, {"k": "h", "c": "第1章 有目的的练习", "x": "有目的的练习，主要是“积小胜为大胜”“积跬步以至千里”，最终达到长期目标。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "要想取得进步，必须完全把注意力集中在你的任务上。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "有目的的练习需要走出舒适区", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "对于任何类型的练习，这是一条基本的真理：如果你从来不迫使自己走出舒适区，便永远无法进步。比如，业余钢琴爱好者在十几岁的时候就开始上钢琴课，等到30年过去了，他还在以完全相同的方式弹奏着那些同样的歌曲，看起来，在那段时间里，他已经积累了数十万个小时的“练习”，但他绝不会比30年前弹得更好。事实上，可能还比年轻时弹得更差。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "走出舒适区，意味着要试着做一些你以前没做过的事情。有时候，你也许发现，做一些没做过的事情，相对较为容易，然后你会继续逼迫自己。但有时候，你偶然碰到了那些让你感到很难做好的事情，似乎你永远也做不了。想办法去逾越这些障碍，是通向有目的的练习的隐藏钥匙。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "试着做不同的事情，而非更难的事情", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "首先取得进步，然后到了一个瓶颈，被困住了，寻找不同的方法来克服障碍，最后找到了这种方法，然后又稳定地提高，直到下一个障碍出现。", "y": "", "d": "2022-05-28"}, {"k": "h", "c": "第1章 有目的的练习", "x": "有目的的练习：走出你的舒适区，但要以专注的方式制订明确的目标，为达到那些目标制订一个计划，并且想出监测你的进步的方法。还要想办法保持你的动机。", "y": "", "d": "2022-05-29"}, {"k": "h", "c": "第3章 心理表征", "x": "心理表征是一种与我们大脑正在思考的某个物体、某个观点、某些信息或者其他任何事物相对应的心理结构，或具体或抽象。一个简单的例子是视觉形象。例如，一提到蒙娜丽莎，很多人马上便会在脑海中“看到”那幅著名油画的形象；那个形象就是蒙娜丽莎在他们脑海中的心理表征。", "y": "", "d": "2022-05-29"}, {"k": "h", "c": "第3章 心理表征", "x": "将杰出人物和我们其他人区分开来的主要因素是：他们经过年复一年的练习，已经改变了大脑中的神经回路，以创建高度专业化的心理表征，这些心理表征反过来使得令人难以置信的记忆、规律的识别、问题的解决等成为可能，也使得他们能够培养和发展各种高级的能力，以便在特定的专业领域中表现卓越。", "y": "", "d": "2022-05-29"}]}, {"id": "856239", "title": "非暴力沟通", "author": "[美]马歇尔·卢森堡", "cats": ["个人成长-沟通表达"], "bmCount": 16, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "非暴力生活的一个关键就是：感激生活的赐予，而不贪心。", "y": "", "d": "2022-03-14"}, {"k": "h", "c": "人生的抉择", "x": "听到批评时，我们一般会申辩、退缩或反击。然而，一旦专注于彼此的观察、感受及需要，而不反驳他人，我们便能发现内心的柔情，对自己和他人产生全新的体会。", "y": "", "d": "2022-03-14"}, {"k": "h", "c": "人生的抉择", "x": "非暴力沟通的四个要素：1．观察2．感受3．需要4．请求", "y": "", "d": "2022-03-14"}, {"k": "h", "c": "非暴力沟通的要素", "x": "非暴力沟通过程\n·什么是我的观察\n·我的感受如何\n·哪些需要（或价值、愿望等）导致那样的感受\n·为了改善生活，我的请求是什么", "y": "", "d": "2022-03-14"}, {"k": "h", "c": "道德评判", "x": "我一心分析和确定错误的性质，而忽视自己和他人的需要。因此，如果女友想多一些体贴，那她就“太粘人了”。可是，如果我想多一些体贴，那她“冷漠得像个木头”。如果同事更关心细节，他就是“有强迫症”。反之，如果我更在乎细节，他就是“粗心大意”。\n对他人的评价实际上反映了我们的需要和价值观。", "y": "", "d": "2022-03-14"}, {"k": "h", "c": "第三章 区分观察和评论", "x": "不带评论的观察是人类智力的最高形式。", "y": "", "d": "2022-03-16"}, {"k": "h", "c": "小结", "x": "非暴力沟通的第一个要素是观察。将观察和评论混为一谈，别人就会倾向于听到批评，并反驳我们。非暴力沟通是动态的语言，不主张绝对化的结论。它提倡在特定的时间和情境中进行观察，并清楚地描述观察结果。", "y": "", "d": "2022-03-16"}, {"k": "h", "c": "被压抑的心灵", "x": "示弱有助于解决冲突。", "y": "", "d": "2022-03-16"}, {"k": "h", "c": "听到不中听的话：四种选择", "x": "非暴力沟通强调，感受的根源在于我们自身。我们的需要和期待，以及对他人言行的看法，导致了我们的感受。", "y": "", "d": "2022-03-16"}, {"k": "h", "c": "听到不中听的话：四种选择", "x": "听到不中听的话的四种选择：\n1．责备自己2．指责他人3．体会自己的感受和需要4．体会他人的感受和需要", "y": "", "d": "2022-03-16"}, {"k": "h", "c": "体会他人的感受和需要", "x": "如果我们注意的是别人的需要而非他对我们的看法，我们将发现别人并不那么可怕。我们还会发现，他不高兴是因为他的需要没有得到满足。", "y": "", "d": "2022-03-25"}, {"k": "h", "c": "体会他人的感受和需要", "x": "我把注意力放在了他现在需要什么，而不是自己做错了什么。", "y": "", "d": "2022-03-25"}, {"k": "h", "c": "给他人反馈", "x": "一般来说，如果一个人在说话时有明显的情绪，他一般会期待得到他人的反馈。如果我们自己是说话的那个人，我们不妨清楚地表明我们是否期待反馈。", "y": "", "d": "2022-03-25"}, {"k": "h", "c": "为什么我们会生气？", "x": "听到不中听的话时，我们有四种选择：1．责备自己；2．指责他人；3．体会自己的感受和需要；4．体会他人的感受和需要。", "y": "", "d": "2022-03-25"}, {"k": "h", "c": "附录：非暴力沟通模式", "x": "诚实地表达自己，而不批评、指责", "y": "", "d": "2022-03-31"}, {"k": "h", "c": "附录：非暴力沟通模式", "x": "关切地倾听他人，而不解读为批评或指责", "y": "", "d": "2022-03-31"}]}, {"id": "32012684", "title": "以极简的方式去生活", "author": "杨志华", "cats": ["个人成长-人生哲学"], "bmCount": 15, "rvCount": 0, "notes": [{"k": "h", "c": "篇一 信息极简", "x": "因为人一天就是24小时，除了吃饭、睡觉等，剩下的时间，按毛主席的话说，不被我们占领，就被敌人占领。如果你的时间不能被自己热爱的事情所占领，那么能去干吗呢？刷刷手机打发打发时间是不错的选择，可是同学们，时间是禁不起打发的啊！", "y": "", "d": "2022-10-08"}, {"k": "h", "c": "篇一 信息极简", "x": "打开台灯，躺在床上，房间里沐浴着温和的光，一天里仿佛只有这个时间是自己的，是最舒服的，没有人打扰，想做什么就做什么。", "y": "", "d": "2022-10-08"}, {"k": "h", "c": "篇一 信息极简", "x": "经过再一次的精简，繁漪的App只有不足20个了", "y": "", "d": "2022-10-08"}, {"k": "h", "c": "篇一 信息极简", "x": "1.扔掉所有不喜欢的，扔掉所有好像喜欢好像不喜欢的，只留下喜欢的，用喜欢的人事物一起，自然欢乐；2.有欢喜的知己，可以开怀大笑，可以相拥而泣，那么物品是否欢喜已经不那么重要；3.放下对一切外在的依赖，家徒四壁，席地而卧，且饮且歌，自由自在。", "y": "", "d": "2022-10-08"}, {"k": "h", "c": "篇一 信息极简", "x": "小和尚问禅师，修行之前做什么，禅师说担水吃饭。小和尚再问，修行之后做什么，禅师说还是担水吃饭。小和尚说那有什么区别啊？禅师说，修行之前，担水想着吃饭，吃饭想着担水，修行之后，吃饭就是吃饭，担水就是担水。这就是专注的力量吧！", "y": "", "d": "2022-10-08"}, {"k": "h", "c": "篇二 服装极简", "x": "此刻、喜欢、最少、自我、呼吸、深广", "y": "", "d": "2022-10-08"}, {"k": "h", "c": "篇三 空间极简", "x": "一旦我们拥有了某样东西，从那一刻起，我们也被这个东西所拥有。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "篇三 空间极简", "x": "譬如买了一件衣服，就要给它一个放置的空间、脏了要洗涤、皱了要熨烫、破了要缝补、小心的不让她沾染污渍等。一旦这些物品超过了必要的限度，我们就被拥有的物品所拥有，成了物品的奴隶。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "篇三 空间极简", "x": "我们生活在这个世界上，自然要拥有一些必要的东西。所谓必要，满足自身的衣食住行的基本需求即可，然后把大量的时间和精力投入自己认为有意义、有价值的事情当中去，让生命热烈而丰满地燃烧。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "篇三 空间极简", "x": "拥有必要的、最少的、最好的若干物品即可。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "篇四 书籍极简", "x": "1.选定一个方向，比如心理学、逻辑学、市场营销、茶、瑜伽、佛教、电工、计算机等，都可以，看自己的兴趣或者需要。2.找出这个领域的经典书籍，相信我，任何一个领域，你读了100本经典书籍，你都可以变得很优秀，这不就是你一直所要追求的吗？3.不要着急，好好地读，一年读不完就两年，两年不行就三年，日日用功，用最大的功，必有所成。如果读书只有一个秘诀的话，那就是去“用”。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "特别篇一 年中聚会", "x": "一次扔完，是彻底清理；每日一扔，是日常保养。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "特别篇一 年中聚会", "x": "买一堆衣服，不如买一两件喜欢的。买一阳台的花，不如精心培育一两盆。一屋子的廉价家具，不如换成几件实木的。几十个狐朋狗友，不如一两个知己。看什么都感兴趣，不如好好培养一个爱好。这山望着那山高，不如把手头的事情做好。", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "篇七 语言极简", "x": "不见他人过，只见自己过", "y": "", "d": "2024-05-17"}, {"k": "h", "c": "特别篇二 新生", "x": "所谓简单，就是做这件事情的时候不做别的事情。", "y": "", "d": "2022-10-08"}]}, {"id": "34260382", "title": "人生的智慧（果麦经典）", "author": "亚瑟·叔本华", "cats": ["个人成长-人生哲学"], "bmCount": 15, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 对主题的划分", "x": "人生也是如此。不同的地位和财富赋予每个人一个角色，但这绝不意味着内在幸福和快乐是相对应的。在这个意义上，所有人存在的本质也都一样——一个满是困苦和烦恼的可怜凡人。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 对主题的划分", "x": "因为一个人身上存在或发生的一切，只存在并发生于他的意识之中。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 对主题的划分", "x": "人也一样，一个人所能获得的幸福，是由他的本性事先决定的。特别是一个人的精神力量，彻底决定了一个人享受高级愉悦的能力。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 对主题的划分", "x": "健康比其他所有的福气都更重要，以至于实际上可以说，一个健康的乞丐比一位生病的国王更加幸福。温和开朗的性格，体魄完美健康而感到快乐，头脑清晰、生气勃勃，洞察事物的本来面目，温和的意志力，因此有一个好的良知——这些都是任何阶级和财富都无法弥补或取代的幸事。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 对主题的划分", "x": "一个人自己身上的东西，当他独自一人时陪伴他的东西，是没有人能给予或带走的。因此对他来说，这显然比他所拥有的一切都更为重要，甚至比他在世人眼中是什么更重要。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 对主题的划分", "x": "贺拉斯[12]是这样评价自己的：\n宝石、大理石、象牙、小雕像、画作、银器、紫色长袍，\n有人没有这些东西，有人根本就不想要。[13]", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 对主题的划分", "x": "所以，让我们生活幸福的第一个也是最重要的要素，那就是“我们是什么”——我们的人格才是最重要的，因为它是在任何情况下都会发挥作用的恒定因素。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第二章 人格，或人本身", "x": "一个人是什么、拥有什么——即人格及其所包含的一切——是唯一直接影响到其快乐和幸福的因素。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第二章 人格，或人本身", "x": "让我们快乐或痛苦的，并不是客观上事物本身是什么，而是它们对我们来说是什么，以及我们看待它们的方式。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第二章 人格，或人本身", "x": "人不受事物的影响，而是受对事物的看法的影响。", "y": "", "d": "2021-12-09"}, {"k": "h", "c": "第一章 一般规则", "x": "幸福不过是一场梦，悲伤才是真实存在的。", "y": "", "d": "2021-12-10"}, {"k": "h", "c": "第一章 一般规则", "x": "快乐的生活”仅仅意味着“生活中的不快乐少一点”，即过上一种尚可容忍的生活。", "y": "", "d": "2021-12-10"}, {"k": "h", "c": "第一章 一般规则", "x": "因为确保自己不会很痛苦，最安全的方法就是不要对自己的快乐抱有过高期望。", "y": "", "d": "2021-12-10"}, {"k": "h", "c": "第一章 一般规则", "x": "虽然世间的一切都会逃离你的掌握，\n但不要为之悲伤，因为它们毫无价值；\n虽然你拥有了整个世界，\n但不要为之欢喜，因为世间万物都毫无价值。\n既然所谓美好的世界只是由你匆匆而过，\n那就快一些吧，没有什么值得停留。[134]", "y": "", "d": "2021-12-10"}, {"k": "h", "c": "第一章 一般规则", "x": "一个人若为琐事烦恼，那他一定是富足的；因为在不幸中，人对琐事是无感的。", "y": "", "d": "2021-12-10"}]}, {"id": "27256052", "title": "人生十二法则：直面混乱与痛苦", "author": "乔丹·彼得森", "cats": ["心理-积极心理学", "个人成长-情绪心灵"], "bmCount": 12, "rvCount": 0, "notes": [{"k": "h", "c": "引言 如何抵御自我的不足与无知", "x": "人生需要更深层的意义，这种意义的本质反复出现在过去的伟大故事当中，而那些故事往往讨论的都是在痛苦中成长，而不是追求快乐。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "生物界的领地之争", "x": "富人的感冒就是穷人的肺炎。", "y": "", "d": "2022-05-04"}, {"k": "h", "c": "走出失败者模式", "x": "当你开始拥有时，就有可能拥有更多，这是普赖斯定律和帕累托分布更为积极的一面。你可以在自己的主观世界里创造这样的正向循环。", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "走出失败者模式", "x": "挺拔的你会直面人生的重负，随之你的神经系统会产生完全不同的反应，你会更加积极地迎接挑战，而不是坐等灾难降临。你会看见恶龙镇守的黄金，而不是被恶龙的存在吓退；你会在支配等级中找准自己的位置，占据领地，并且做好防守和扩张的准备。", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "走出失败者模式", "x": "谨慎对待你的体态，别再低头徘徊。\n说你所想，追你所求，\n这是你和他人同样拥有的权利。", "y": "", "d": "2022-04-28"}, {"k": "h", "c": "走出失败者模式", "x": "谨慎对待你的体态，别再低头徘徊。说你所想，追你所求，这是你和他人同样拥有的权利。挺胸迈步，直视前方，敢于冒险，这样你的神经通路才能充满急需的血清素。", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "走出失败者模式", "x": "笔挺站立，昂首挺胸。", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "自助者天助", "x": "待己如助人，\n这意味着你需要选择\n对自己真正有好处的事物，\n即使这些事物不一定是你想要的\n或是令你快乐的。", "y": "", "d": "2022-04-30"}, {"k": "h", "c": "自助者天助", "x": "19世纪伟大的哲学家尼采说过一句很精彩的话：“一个人知道自己为什么而活，就可以忍受任何一种生活。”￼", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "建立互惠关系", "x": "也许你可以这样理解，如果你都不会把某个人介绍给你的姐妹、父母或者子女，那么你为什么还要和这个人继续交往？你可能会说这是因为忠诚，但是忠诚并不等于愚蠢。", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "走出认知困局", "x": "你需要洗刷自己的精神，将它清理干净；你也需要更加谨慎，因为改善生活意味着承担更多责任；同时你也需要更努力、更用心地生活，而不是继续愚昧地活在痛苦中，自以为是、自欺欺人又满心怨恨。", "y": "", "d": "2022-05-07"}, {"k": "h", "c": "集中注意力，改善现状", "x": "生活的不顺或许不是因为生活本身，\n而是源自你的无知。", "y": "", "d": "2022-05-08"}]}, {"id": "693564", "title": "人生的智慧", "author": "叔本华", "cats": ["个人成长-人生哲学"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "译者序", "x": "作为哲学家的深思和缜密", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "译者序", "x": "浓缩、冷静的文字，加上辛辣的幽默和讽刺", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "译者序", "x": "叔本华的表述既严谨又不枯燥，既冷静又不乏想象力，既迂回曲折又不失畅快淋漓，既简朴又不失雅致", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "译者序", "x": "与生俱来的、天才的认识力", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "译者序", "x": "此时的叔本华，就像他在这部著作末尾的一首诗里所说的，“此刻的我站在路的尽头，老迈的头颅已经无力承受月桂花环。”", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "引言", "x": "“人生的智慧”在这里的意思，就是如何尽量称心、愉快地度过一生这样一门艺术。", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "再版前言", "x": "美妙、深邃的思想", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "第一章 基本的划分", "x": "亚里士多德把人生能够得到的好处分为三类——外在之物、人的灵魂和人的身体。", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "第一章 基本的划分", "x": "我们幸福的原因存在于我们的自身之内，而不是自身之外。", "y": "", "d": "2025-03-28"}, {"k": "h", "c": "第一章 基本的划分", "x": "不少人羡慕他人在生活中发现和遇到饶有趣味的事情，其实前者应该羡慕后者所具有的理解事物的禀赋才对。正是归因于他们理解事物的禀赋，他们经历过的事情，在其描绘中，都带有某种韵味", "y": "", "d": "2025-03-28"}]}, {"id": "25848846", "title": "焦虑星球笔记", "author": "马特·海格", "cats": ["心理-心理学应用"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "11 寻找绝望根源的侦探", "x": "保持冷静。保持努力。保持人性。保持前进。保持渴望。保持对完美的追求。多看看窗外。多集中注意力。远离干扰。永远无视网络骂战。永远无视弹出的广告和弹出的纷乱思绪。永远敢于冒险。永远不怕被人嘲笑。保持好奇心。保持追求真理之心。保持爱心。永远坚守人类敢于犯错的特权。永远给自己留一块空间，还要在这块空间周围树起藩篱。保持阅读。保持写作。将手机保持在一丈以外。身边的人都失去理智时，请保持镇定。保持呼吸。保持吸入生活本身。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "11 寻找绝望根源的侦探", "x": "多留意自己。做自己的朋友。做自己的家长。善待自己。监控自己的行为。你真有必要追剧追到大半夜，硬要把最后一集看完吗？你真的需要喝第三杯或第四杯酒吗？这真的符合你的最佳利益吗？", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "14 匮乏", "x": "所有的这一切都是有代价的，而且不仅仅是经济代价。买到心爱之物的那一刻，你可能会心满意足，但从长期来看，这只会让你渴望成为别人，成为某个更有魅力、更有吸引力、更有影响力的别人。媒体鼓励我们吃着碗里看着锅里，眼馋别人的生活。可殊不知，那种生活并不比彩虹尽头的黄金[插图]更真实。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "无趣不可耻。无趣很正常亦很健康。遭遇困难时，平淡无趣的情绪是非常好的避风港湾。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "这个世界有悲哀的一面。但请记住，这里每天都会新增数以百万计、未被报道或颂扬的善行。数以百万计的爱的给予。这世间人性永存，真善美永在。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "不要因为自己把生活弄得一团糟而自责，这很正常。宇宙也是一团糟。银河成天四处漂移，漫无目的。你只是在和宇宙同步而已。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "允许自己失败。允许自己怀疑。允许自己脆弱。允许自己改变主意。允许自己不完美。允许自己抗拒活力。允许自己不像一支目标明确、离弦加速的利箭一样在生活中百折不挠，一往无前。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "——唤醒意识。意识到你花了多少时间玩手机；意识到新闻有多容易扰乱心神；意识到你对待工作的态度正在如何变化；意识到你正承受着多少压力；意识到其中有多少压力源于现代生活的问题，源于你与这个世界的神经系统相连接所引发的问题。唤醒意识即解决方案。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "我尝试多接触这个世界令我们快乐的一面，我尝试与这个世界美好的一面保持一致。要想享受当下，要想让每一个时刻变为新生，我们需要唤醒意识，需要剔除不需要的杂物，找到真正需要的东西。通过唤醒意识，我们便能在设法保持本真的前提下，仍然深爱着这个世界。就是这样。我知道很难做到。这是一条荆棘之路，但它终归好过绝望。只要你能坚持下去不轻言放弃，一旦你学会坦然接受自己的缺陷和失败，走这条荆棘之路也就容易多了。", "y": "", "d": "2020-02-26"}, {"k": "h", "c": "18 你一无所缺", "x": "“下雨时，”诗人亨利·沃兹沃斯·朗费罗写道，“你所能做到的就是，让它下吧。”是的。让它下。让这颗星球就这样。你别无选择。不过，你得留意自己或好或坏的情绪。你得知道哪些方法能帮你提振情绪，并接受那些对你无效的方法。等你明白雨不过是雨，而不是世界末日时，一切就容易多了。", "y": "", "d": "2020-02-26"}]}, {"id": "33628204", "title": "认知觉醒：开启自我改变的原动力", "author": "周岭", "cats": ["心理-认知与行为"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "自序 开启自我改变的原动力", "x": "他们跳出了成长的陷阱，开始刻意提升自己，为未来美好的生活做准备。他们慢慢甩开了大队伍，走在了同龄人的前列，然而很快遇到了瓶颈：想勤奋，却总是敌不过惰性；想努力，却总是陷入低效的状态；想精进，面前却总是弯路不断；读了很多书，都忘了；付出很多努力，都白费了。他们仿佛越使劲越困惑，越努力越迷茫。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "自序 开启自我改变的原动力", "x": "在很长一段时间内，我就像一个没有睡醒的人，对自己不了解，对生活没主张，对命运无选择。那时的我，虽然对本职工作非常投入，但业余时间几乎被不需要动脑筋的事情占据：有空就找朋友们聚会，时常喝到烂醉；经常熬夜，从不主动看书、运动；打发时间的方式就是看搞笑视频、读八卦新闻、玩手机游戏；实在没事可做，就裹起被子睡大觉……下意识中，我觉得这种无忧的生活会继续下去。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "自序 开启自我改变的原动力", "x": "我发现每天有事情做不代表觉醒，每天都努力也不代表觉醒，真正的觉醒是一种发自内心的渴望，立足长远，保持耐心，运用认知的力量与时间做朋友；我发现人与人之间的根本差异是认知能力上的差异，因为认知影响选择，而选择改变命运，所以成长的本质就是让大脑的认知变得更加清晰；", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "第一章 大脑——一切问题的起源", "x": "归结起来，焦虑的原因就两条：想同时做很多事，又想立即看到效果。王小波说：人的一切痛苦，本质上都是对自己无能的愤怒。焦虑的本质也契合这一观点：自己的欲望大于能力，又极度缺乏耐心。焦虑就是因为欲望与能力之间差距过大。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "第一章 大脑——一切问题的起源", "x": "急于求成，想同时做很多事；避难趋易，想不怎么努力就立即看到效果。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "第一章 大脑——一切问题的起源", "x": "·克制欲望，不要让自己同时做很多事；·面对现实，看清自己真实的能力水平；·要事优先，想办法只做最重要的事情；·接受环境，在局限中做力所能及的事；·直面核心，狠狠逼自己一把去突破它。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "第一章 大脑——一切问题的起源", "x": "复利效应显示了价值积累的普遍规律：前期增长非常缓慢，但到达一个拐点后会飞速增长。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "第一章 大脑——一切问题的起源", "x": "因为单纯保持学习输入是简单的，而思考、行动和改变则相对困难。在缺乏觉知的情况下，我们会本能地避难趋易，不自觉地沉浸在表层的学习量中。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "第一章 大脑——一切问题的起源", "x": "这种“后娱乐”的好处是，将享乐的快感建立在完成重要任务后的成就感之上，很放松、踏实，就像一种奖赏；而“先娱乐”虽然刚开始很快活，但精力会无限发散，拖延重要的工作，随着时间的流逝，人会空虚、焦虑。", "y": "", "d": "2020-11-22"}]}, {"id": "38259780", "title": "所有问题都是可以解决的", "author": "玛丽·弗里奥", "cats": ["个人成长-人生哲学"], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "献言", "x": "活泼有趣、独立自信、懂得吃苦", "y": "", "d": "2021-06-16"}, {"k": "h", "c": "文前", "x": "力量不在外面，\n力量在你之中。”", "y": "", "d": "2021-06-16"}, {"k": "h", "c": "前言 所有问题都是可以解决的", "x": "尽力做到最好，直到你懂得更多。当懂得更多时，你就会做得更好。", "y": "", "d": "2021-06-16"}, {"k": "h", "c": "从“在弱智边缘的差生”到大学生", "x": "当你改变信念时，你便会改变一切。\n我们", "y": "", "d": "2021-07-16"}, {"k": "h", "c": "“不能”和“不会”的陷阱", "x": "你要对自己的生活负起百分之百的责任", "y": "", "d": "2021-07-29"}, {"k": "h", "c": "“不能”和“不会”的陷阱", "x": "对自己的生活负起百分之百的责任，意味着你认识到自己有责任决定自己的感受，也有责任决定自己想成为什么样的人，以应对现在和将来发生的事。", "y": "", "d": "2021-07-29"}, {"k": "h", "c": "“不能”和“不会”的陷阱", "x": "态度比事实更重要。它比过往、教育、金钱、环境、失败、成功，以及比别人怎么想、怎么说、怎么做更重要。它比外表、能力、技巧更重要。它将成就或破坏一家企业、一个家庭、一段友情、一个组织。难能可贵的是，我每天都可以选择自己的态度。我无法改变我的过去，无法改变别人的行为，也无法改变不可避免的事情。我唯一能改变的就是态度。生命的10%是发生在我身上的事，90%是我的反应。", "y": "", "d": "2021-07-29"}, {"k": "h", "c": "“不能”和“不会”的陷阱", "x": "你总是拥有远超出你想象的力量。", "y": "", "d": "2021-07-29"}]}, {"id": "22370684", "title": "精彩人生的一分钟小习惯", "author": "冲幸子", "cats": ["个人成长-认知思维"], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "发现小小的感动", "x": "幸福就是我们不经意地仰望蓝天，或者看到在河边绽放的不知名的小花时，所发出“竟然如此之美”的感慨。", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "发现小小的感动", "x": "幸福就是在漫漫旅途之中，陌生人投来的一句关怀“要保重哦”，能让我们的心灵都平和起来。", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "发现小小的感动", "x": "无论何时何地，只要我们用心感受，都会轻而易举地发现每一个小小的感动。当身体里充满这些小小的感动后，内心中那些因烦恼和悲伤所引起的惊涛骇浪竟不知何时全都平息了。我希望我的内心能永远充盈着这些小小的感动。所以我享受生活中的每一天，并精心地经营着我的小日子。", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "如何避免闷闷不乐", "x": "因为无所谓的事情而纠结，导致自己闷闷不乐是阴暗消极的，一点也不开心。自己何苦为难自己呢？今天反省一下就好，然后就将其彻底忘掉。于是我的心情一下子变得轻松起来，内心又涌起了对明天的憧憬。", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "如何避免闷闷不乐", "x": "毕竟在上了年纪后，我也渐渐掌握了粗线条生活的窍门。", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "不压抑自己的悲伤", "x": "大悲是通向大喜之路", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "一天的难处一天当", "x": "本着“车到山前必有路”的心态，无论工作还是生活我都迎难而上，所以不知不觉就渡过了一个又一个难关。", "y": "", "d": "2020-09-18"}, {"k": "h", "c": "一天的难处一天当", "x": "烦恼多了自然会感到身心俱疲。这种时候我会在晚上喝一杯红酒。然后像念咒一样对自己说：“一天的难处一天当”“烦恼和疲惫就到此为止”。", "y": "", "d": "2020-09-18"}]}, {"id": "3300029892", "title": "极简生活：断舍离的艺术（2版）", "author": "极简丹", "cats": ["个人成长-人生哲学"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "第二章 打造舒心的极简空间", "x": "在你的电脑上建一个excel表格，叫作“我所拥有的每一件东西”。", "y": "", "d": "2023-12-06"}, {"k": "h", "c": "第二章 打造舒心的极简空间", "x": "电子产品、衣服鞋子饰品、学习用品（书籍、本子、笔）、生活用品、彩妆护肤品、厨房用品", "y": "", "d": "2023-12-06"}, {"k": "h", "c": "第七节 不再为钱烦恼：你必须重视的理财习惯", "x": "不妨清点一下自己所拥有的所有东西，一颗螺丝钉都不要放过", "y": "", "d": "2023-12-06"}, {"k": "h", "c": "第八节 生活中你需要警惕的消费观念", "x": "真正对自己好是什么？是注重锻炼、保持健康、定期体检，不让自己背负不良债务，做喜欢的事，不讨好、不委曲求全、不迎合、不压抑自己。", "y": "", "d": "2023-12-06"}, {"k": "h", "c": "第四节 身穿睡衣、无所事事的一天不是休息", "x": "宁愿放空发呆，也不要拿起手机刷朋友圈、热点等消耗更多的精力。", "y": "", "d": "2023-12-06"}]}, {"id": "3300014124", "title": "亲密关系（第6版）", "author": "[美]罗兰·米勒", "cats": ["心理-亲密关系"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 人际关系的构成", "x": "相反，不安全类型的人认为他人不靠谱或不能信任，记忆中的父母也是矛盾或冷漠的。", "y": "", "d": "2022-05-19"}, {"k": "h", "c": "第1章 人际关系的构成", "x": "一种情况是人们期望和他人交往，但又对他人戒心重重，害怕被人拒绝和欺骗。", "y": "", "d": "2022-05-19"}, {"k": "h", "c": "第1章 人际关系的构成", "x": "恐惧型的人如果坚持孤僻，回避相互依赖，就可能永远不会发现有些人可以信任，不会发现亲密可以令人心安，这又加重了他们的恐惧型依恋。如果没有大起大落的新经历，人们的依恋类型可以持续数十年", "y": "", "d": "2022-05-19"}, {"k": "h", "c": "第1章 人际关系的构成", "x": "我们对紧密关系性质和价值的总看法，看来是由我们体验到的亲密关系的经验所决定的。", "y": "", "d": "2022-05-19"}, {"k": "h", "c": "第1章 人际关系的构成", "x": "我们将重点考察四种不同类型个体差异：性别差异、性认同差异、人格差异和自尊差异。", "y": "", "d": "2022-05-19"}]}, {"id": "522205", "title": "人性的弱点（果麦经典）", "author": "卡耐基", "cats": ["个人成长-沟通表达", "个人成长-励志成长"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "Chapter 01 人际关系的基本技巧", "x": "和人打交道时，请牢记这一点——人并非理性生物。他们由情感驱使，被偏见支配，傲慢与虚荣是他们的动力之源。", "y": "", "d": "2021-04-19"}, {"k": "h", "c": "Chapter 01 人际关系的基本技巧", "x": "批评、指责和抱怨是蠢材与生俱来的“才能”；理解和宽容却是对人品和自律的极大考验。", "y": "", "d": "2021-04-19"}, {"k": "h", "c": "Chapter 01 人际关系的基本技巧", "x": "“伟人的伟大之处，从他对待小人的态度中可见一斑。”", "y": "", "d": "2021-04-19"}, {"k": "h", "c": "Chapter 01 人际关系的基本技巧", "x": "「原则 1\n不要批评，不要指责，不要抱怨」", "y": "", "d": "2021-04-19"}, {"k": "h", "c": "Chapter 01 人际关系的基本技巧", "x": "「原则 2\n真心实意地感谢他人、赞美他人」", "y": "", "d": "2021-04-19"}]}, {"id": "934471", "title": "养育女孩（成长版）", "author": "史蒂夫·比达尔夫", "cats": ["教育学习-育儿"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "成年女性：女孩的好榜样", "x": "要想走向成熟，成为女人，女孩在生活中需要有阿姨或者类似的角色相伴。这可以追溯到史前时期——早在狩猎采集阶段，人类还处在以亲族为单位的氏族社会，成年女性就会陪在女孩子身边，教她们如何做女人，把日常生活中的技巧传授给她们。照顾女孩子是一项神圣的职责。不要忘记，当时可是母系社会——没人敢招惹女人。\n现在，虽然我们的生活方式改变了，但是，人类的这种心理需求未曾改变。女孩子天生需要妈妈之外的其他女性的陪伴。幸运的是，这一点并不难实现，富有爱心的成年女性天生愿意向身边的女孩子伸出援助之手，帮助她们健康成长。", "y": "", "d": "2021-02-14"}, {"k": "h", "c": "成年女性：女孩的好榜样", "x": "智慧、冷静、坚强", "y": "", "d": "2021-02-14"}, {"k": "h", "c": "第八章 内心强大", "x": "人的品格可以归结为两点——内心强大和为人友善，这两种品格成就了优秀的人。优秀的人是善良而富有爱心的，他们可靠，有毅力，信守诺言。内心强大和为人友善，二者缺一不可。内心强大却没有爱心，只能导致蛮干；有爱心却做不到内心强大，在危机时刻也是没用的，我们每个人都认识一些空谈关心他人，实际上却不可靠的人。", "y": "", "d": "2021-02-14"}, {"k": "h", "c": "不被坏情绪打败", "x": "她倾听自己内心的声音，感受自己的情绪，却不会深陷其中。所以，在感到愤怒、恐惧、悲痛、疲惫或百无聊赖的时候，她并不否认这些情感的存在。同时，她还可以超越它们，摆脱它们的束缚，做自己该做的事。", "y": "", "d": "2021-02-14"}, {"k": "h", "c": "女孩和男孩应当拥有同等的权利", "x": "如同人类的很多次运动一样，女权运动背负了太多的包袱，被挟持，被掺水，被误传，被滥用，但这些也仅仅只是围绕滚滚的巨变洪流泛起的涟漪而已，女权运动势不可当。", "y": "", "d": "2021-02-14"}]}, {"id": "573975", "title": "思考，快与慢", "author": "丹尼尔·卡尼曼", "cats": ["个人成长-认知思维"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "序言", "x": "邻居如此描述这个孩子：“史蒂夫非常腼腆，少言寡语，很乐于助人，却对他人或者这个现实世界没有兴趣。他谦恭有礼，做事井井有条，中规中矩，关注细节。”请问史蒂夫更可能从事哪种职业，图书管理员还是农民？\n很显然，史蒂夫的个性和典型的图书管理员有着惊人的相似", "y": "", "d": "2021-02-09"}, {"k": "h", "c": "序言", "x": "对经验法则的依赖必然会导致人们判断时的成见", "y": "", "d": "2021-02-09"}, {"k": "h", "c": "第1章 一张愤怒的脸和一道乘法题", "x": "这个计算过程是脑力工作，需要刻意、努力并且有序地进行——这也是慢思考的一个特征。", "y": "", "d": "2021-02-09"}, {"k": "h", "c": "第1章 一张愤怒的脸和一道乘法题", "x": "·系统1的运行是无意识且快速的，不怎么费脑力，没有感觉，完全处于自主控制状态。\n·系统2将注意力转移到需要费脑力的大脑活动上来，例如复杂的运算。系统2的运行通常与行为、选择和专注等主观体验相关联。", "y": "", "d": "2021-02-09"}, {"k": "h", "c": "第1章 一张愤怒的脸和一道乘法题", "x": "如果看书时老是重读不知所云的内容，这就说明我们在强迫自己去读一本无聊的书。", "y": "", "d": "2021-02-09"}]}, {"id": "35458981", "title": "心灵奇旅 Soul（迪士尼大电影双语阅读）", "author": "青橙英语", "cats": ["教育学习-外语", "精品小说-影视原著", "童书-儿童文学"], "bmCount": 4, "rvCount": 1, "notes": [{"k": "h", "c": "第1章", "x": "爵士乐可以大胆而自信，还可以顽皮或忧郁。有些爵士乐使人感觉站在世界之巅。而当人垂头丧气时，爵士乐也能为灵魂带来抚慰。", "y": "", "d": "2021-01-28"}, {"k": "h", "c": "第20章", "x": "就像线一圈圈绕开一样，乔生活中的种种时刻接连浮现。", "y": "", "d": "2021-01-29"}, {"k": "h", "c": "第20章", "x": "“这，”乔心中暗想，“这才是我的生活。所有独一无二、弥足珍贵的时刻。”这既不是悲哀的，也不是浪费的，而是美丽的。", "y": "", "d": "2021-01-29"}, {"k": "h", "c": "第20章", "x": "所有的微小时刻、点滴欢乐，都是使人生值得一活的事情。", "y": "", "d": "2021-01-29"}, {"k": "t", "c": "全书想法", "x": "", "y": "所有的微小时刻、点滴欢乐，都是使人生值得一活的事情。\n今年俺的学习课题之一，就是学会体验“活着”本身。", "d": "2021-01-29"}]}, {"id": "23514568", "title": "时间看得见", "author": "王潇", "cats": ["个人成长-人生哲学"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "前言 信所未见之事", "x": "在隆冬，我终于知道，我身上有一个不可战胜的夏天。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "看待关系", "x": "如果你想要日常的快乐，快乐就在那些当下细微行动的每个达成里。", "y": "", "d": "2020-12-04"}, {"k": "h", "c": "最激荡的传记", "x": "传记就是你在今生收集到的他人的活法，你会发现原来这世界真有波澜壮阔的人生。无论顺境还是逆境，它们总会到来，也总会过去。在逆境里看别人的逆境，你会非常确定，怀疑和恐惧是英雄之旅的一部分，你需要和主人公一样，接受试炼，与命运选派的一切困难交锋。俯瞰别人的故事，使你有能力跳出当下，去俯瞰自己故事中的人与事，也有能力去解释你遇到的每一张面孔的意义，无论他们是导师、敌人，还是伴侣。\n你要早一点打开传记，早一点见到里面像灯塔一样的那个主人公，因为他（她）会引领你，激荡你。", "y": "", "d": "2020-12-04"}, {"k": "h", "c": "触发心流的三个方法", "x": "上身法是有一定心理学依据的。那个在你内心阻挠你的人，让你去偷懒、去贪吃的人，是本我，代表了我们的天性，它持续存在；后面“上身”的我，它代表理想中的我，是超我。我们的人生就是一个本我和超我角力的过程，是懒惰的我、平凡的我和理想中的我角力的过程。赢得越多，赢面就越大。当超我战胜本我，你慢慢就会被换血成为那个人，形成你理想中的人格。", "y": "", "d": "2020-12-04"}, {"k": "h", "c": "流传至今的效能管理真谛", "x": "1.节制（Temperance）。食不过饱，饮不过量。\n2.沉默（Silence）。言必于人于己有益；禁止无益的闲谈。\n3.秩序（Order）。一切东西都有自己的位置；日常事务何时起、何时完，当有它们的安排。\n4.决心（Resolution）。当做必做；决心要做的事坚持不懈。\n5.俭朴（Frugality）。用钱必于人于己有益，戒除浪费。\n6.勤劳（Industry）。勿浪费时间；每时每刻做有用的事，戒除不必要的行动。\n7.诚恳（Sincerity）。不欺骗人；勿思邪恶，唯念正义，说话也应如此。\n8.正直（Justice）。不做有害他人的事，也不要忘记履行对人有益的应尽义务。\n9.中庸（Moderation）。避免极端；若受到应得的处罚，要容忍，勿发怒。\n10.清洁（Cleanliness）。身体、衣服、住所力求清洁。\n11.宁静（Tranquility）。勿因琐事或无法避免的普通小事而惊慌失措。\n12.贞洁（Chastity）。除为了健康或者生育后代，不行房事；万不可房事过度伤害身体，不要损害自己或者他人的安宁或者名誉。\n13.谦逊（Humility）。仿效耶稣和苏格拉底。", "y": "", "d": "2020-12-04"}]}, {"id": "22719593", "title": "你有多自律，就有多自由", "author": "卡西", "cats": ["个人成长-励志成长"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "自序 自律，是一场自己与自己的博弈", "x": "自律，之所以很难，是因为懒惰的诱惑太大，躺在沙发上看剧很舒服，抱着手机刷微博也很惬意，可这种短暂的欢愉其实是一种变相的沉沦，带来的只会是思维的迟钝、身体的病痛和心灵的荒芜。", "y": "", "d": "2020-06-09"}, {"k": "h", "c": "认真生活的人，生活绝不会亏待你", "x": "认真学了本事，就会带来好运", "y": "", "d": "2020-06-09"}, {"k": "h", "c": "认真生活的人，生活绝不会亏待你", "x": "真实的生活中，本不可能像电视剧里一般，时刻生离死别，随处轰轰烈烈，而是裹着琐碎的鸡毛，徒增你的郁郁不得志。", "y": "", "d": "2020-06-09"}, {"k": "h", "c": "认真生活的人，生活绝不会亏待你", "x": "与你不同的人，不同之处就在于，他能够将这鸡毛扫净，给自己一个太平，他认真做好手中的每一件小事，不为此看不起，不心生抱怨，他把每一段时光都看成磨炼。", "y": "", "d": "2020-06-09"}, {"k": "h", "c": "认真生活的人，生活绝不会亏待你", "x": "当你开始对生活认真的时候，你就会明白，一朝一夕的时光有多么重要，简直不够用，你完全不会有时间怨天尤人，你只会对生活一点一点充满敬畏。", "y": "", "d": "2020-06-09"}]}, {"id": "26678309", "title": "长大了就会变好吗？", "author": "KnowYourself主创们", "cats": ["心理-心理学应用"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "序 18—25岁：也许是一生中最困难的时候", "x": "1．接受自己对自己该负起的责任（have been accepting responsibility for one's self）\n2．独立地做出决定（making independent decisions）\n3．实现经济独立（becoming financially independent）", "y": "", "d": "2020-10-07"}, {"k": "h", "c": "序 18—25岁：也许是一生中最困难的时候", "x": "Take your time and be patient. Life itself will eventually answer all those questions it once raised for you.", "y": "", "d": "2020-10-07"}, {"k": "h", "c": "不被情绪控制，要从捕捉它们开始 你识别情绪的能力怎么样", "x": "他的情绪粒度（emotional granularity）很高。", "y": "", "d": "2020-10-07"}, {"k": "h", "c": "不被情绪控制，要从捕捉它们开始 你识别情绪的能力怎么样", "x": "“情绪粒度”：标记出不同情绪的能力", "y": "", "d": "2020-10-07"}]}, {"id": "32486647", "title": "幸福的勇气：“自我启发之父”阿德勒的哲学课2", "author": "岸见一郎 古贺史健", "cats": ["个人成长-人生哲学"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "致将要创造新时代的朋友们", "x": "请你记住，我们所拥有的时间很有限。然后，既然时间有限，那么所有人际关系的成立都是以“分别”为前提。这话并不是虚无主义，现实就是我们为了分别而相遇。", "y": "", "d": "2025-07-06"}, {"k": "h", "c": "致将要创造新时代的朋友们", "x": "如果是这样，我们能做的事情也许就只有一件。在所有的相遇与人际关系中，不断朝着“最佳分别”努力。唯有如此。", "y": "", "d": "2025-07-06"}, {"k": "h", "c": "致将要创造新时代的朋友们", "x": "不断付出努力，以便有朝一日分别的时候，可以无憾地说“与这个人相遇、一起度过的日子很对很值得”​。无论是在与学生们之间的关系中还是在与父母之间的关系中，以及与爱人之间的关系中，都是如此。", "y": "", "d": "2025-07-06"}]}, {"id": "3300027186", "title": "下班后开始新的一天", "author": "柳韩彬", "cats": ["个人成长-人在职场"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "开头语 用晚上的时间重获新生", "x": "把一天当成两天过的平凡日常", "y": "", "d": "2022-09-09"}, {"k": "h", "c": "开头语 用晚上的时间重获新生", "x": "即便如此，仍然有很多人不知道下班后要做点什么，即使准时下班了，也像加过班一样，到家就开始发呆，无所事事地打发时间。很多人觉得早早睡觉有些可惜，但是真要做些什么又觉得累，很有负担，最后经常是刷着视频、不知不觉就睡着了——本书就是为了这样的人而写的。", "y": "", "d": "2022-09-09"}, {"k": "h", "c": "探索最适合自己的副业", "x": "能够熟练使用 Excel、Photoshop 等程序。→ A 型\n·喜欢用文字整理想法。→ B 型\n·喜欢画画，喜欢可爱的东西。→ C 型\n·喜欢到处拍照。→ D 型\n·喜欢钻研某个特定领域。→ E 型", "y": "", "d": "2022-11-12"}]}, {"id": "635942", "title": "反脆弱：从不确定性中获益", "author": "纳西姆·尼古拉斯·塔勒布", "cats": ["个人成长-人生哲学"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "如何爱上风", "y": "", "d": "2022-11-10"}, {"k": "h", "c": "前言", "x": "风会熄灭蜡烛，却能使火越烧越旺。对随机性、不确定性和混沌也是一样：你要利用它们，而不是躲避它们。你要成为火，渴望得到风的吹拂。", "y": "", "d": "2022-11-10"}, {"k": "h", "c": "前言", "x": "我宁愿做愚钝但具有反脆弱性的人，也不做极其聪明但脆弱的人。", "y": "", "d": "2022-11-10"}]}, {"id": "228191", "title": "少有人走的路：每天十分钟，一学就会的心灵疗愈法", "author": "约瑟夫·查思特罗", "cats": ["个人成长-情绪心灵"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 序言 心态改变人生", "x": "不会的。因为我的内心始终都像阳光一样温暖，而且我总是热爱生活和为自己感到自豪。", "y": "", "d": "2022-01-03"}, {"k": "h", "c": "第1章 序言 心态改变人生", "x": "如果人们想使知识变得更有价值，最好时刻保持乐观的心态。", "y": "", "d": "2022-01-03"}, {"k": "h", "c": "第2章 儿童的心理", "x": "一个人长成的意思不专是说知识的增长。最大的变化便是你的感觉，你如何去对付事情，什么使你发生兴趣、感觉满足，什么使你悲伤或快乐，你是为什么目标而工作，你的希望是怎样。从这些方面便可以决定你是如何的幼稚，或是如何的成熟。", "y": "", "d": "2022-01-03"}]}, {"id": "909391", "title": "生命向前", "author": "迈克尔·海厄特 丹尼尔·哈卡维", "cats": ["个人成长-人生哲学"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "我们对你的承诺", "x": "“要想到达某地，第一步是下决心不再待在原地。”所以，前进吧。", "y": "", "d": "2021-01-08"}, {"k": "h", "c": "Part 1 认识自己的需求", "x": "漂流是被动的。人生规划则是积极主动的。", "y": "", "d": "2021-01-08"}, {"k": "h", "c": "Part 1 认识自己的需求", "x": "漂流是没有计划地生活。做人生规划是有计划并付诸实施。", "y": "", "d": "2021-01-08"}]}, {"id": "25812898", "title": "阿迪契作品系列：亲爱的安吉维拉", "author": "奇玛曼达·恩戈兹·阿迪契", "cats": ["教育学习-育儿"], "bmCount": 2, "rvCount": 1, "notes": [{"k": "h", "c": "8.", "x": "建议八：教导她不要把讨人喜欢这件事放在心上。让自己变得讨人喜欢不是她的职责，她要做的是成就完整的自我，真诚并尊重他人平等权利的自我。", "y": "", "d": "2020-11-30"}, {"k": "h", "c": "8.", "x": "所以不要教奇萨兰学会招人喜爱，而是教导她要正直，要善良，以及勇敢。鼓励她表达自己的观点，说出她真正的想法，真实地表达。", "y": "", "d": "2020-11-30"}, {"k": "t", "c": "全书想法", "x": "", "y": "不要把讨人喜欢这件事放在心上。让自己变得讨人喜欢不是你的职责，你要做的是成就完整的自我，真诚并尊重他人平等权利的自我。\n\n不用学会招人喜爱，而是要正直，要善良，以及勇敢。表达自己的观点，说出你真正的想法，真实地表达。\n\n👧✨🌌", "d": "2020-12-04"}]}, {"id": "837008", "title": "乌合之众：大众心理研究", "author": "[法]勒庞", "cats": ["心理-心理学研究"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 群体的一般特征", "x": "群体都是匿名的，因此，也不必承担责任。那些总是控制个人的责任感会消失殆尽。", "y": "", "d": "2020-06-05"}, {"k": "h", "c": "第一章 群体的一般特征", "x": "他或许是一个有教养的个人，但是他在群体里却变成了一个野蛮人——一个靠本能行动的生物。他具有自发性、生性暴躁、残忍，还拥有原始物种所具有的满腔热情和英雄主义，同原始物种更加相像的是，他愿意让自己被言语和形象所影响——这样的言语和形象在组成群体的个人孤立存在的情况下，不会产生任何效果——他被诱使去做一些同他最为明显的利益和他最熟知的习惯格格不入的行动。一个群体里的一个人，不过是众多沙粒当中的一颗，可以被大风吹到任何地方。", "y": "", "d": "2020-06-05"}, {"k": "h", "c": "第一章 群体的一般特征", "x": "法国大革命时期，议会成员如果被分开来看，他们人人都是拥有良好习惯的好市民。当他们团结在一起形成一个群体的时候，他们会毫不犹豫地支持最为恶劣的提议，把最无辜的人推上断头台，并且与他们的利益大相径庭，放弃他们神圣不可侵犯的权利，开始互相残杀。", "y": "", "d": "2020-06-05"}]}, {"id": "23364844", "title": "活下去的理由", "author": "马特·海格", "cats": ["个人成长-人生哲学"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "2 着陆", "x": "“……暴风雨结束后，你不会记得自己是怎样活下来的。你甚至不确定暴风雨真的结束了。但有一件事是确定的：当你穿过了暴风雨，你就不再是原来那个人。这就是关于暴风雨的一切。”——村上春树，《海边的卡夫卡》", "y": "", "d": "2020-03-01"}, {"k": "h", "c": "活下去的理由", "x": "有一天，你会体验到与这痛苦相等的喜悦。听海滩男孩[插图]的歌曲，你会流下欢欣的泪。你会俯身凝视怀里婴儿酣睡的脸，你会结识很多好朋友，你会品尝从没吃过的美食，你会在高处俯览美景，不去考虑从这里掉下去摔死的可能性。还有很多书你没有读过，它们会让你更充实。你会吃着超大份爆米花看很多电影。你会跳舞、大笑、做爱、沿着河岸跑步、聊天到深夜、笑到肚子疼。生活在等待着你。虽然你现在被短暂地困在这里，但世界哪儿都不去。如果可以，坚持下去。活着总是值得的。", "y": "", "d": "2020-03-01"}, {"k": "h", "c": "世界", "x": "这个世界在蓄意催人抑郁，因为快乐对经济不利。如果现有的一切就让我们很快乐，我们何必追求更多？怎样卖掉抗衰老的润肤霜？让人们担心衰老。怎样让人们为政党投票？让他们担心移民。怎样让人们买保险？让他们担心一切。怎样让人们做整容手术？突出他们的身体缺陷。怎样让人们看某个电视节目？让他们担心错过好戏。怎样让人们买新手机？让他们感觉自己落伍了。在当下这个时代，平静反而变成了一种标新立异。安于现状，满足于我们混乱的人类自我，对商业不利。可是我们没法逃到另一个世界。事实上，如果你细细看去，就会发现那个充斥着物质和广告的世界并不是真正的生活。生活是其余的东西，是你把所有这些玩意儿扯掉（或至少暂时无视）之后剩下的东西。生活的意义在于爱你的人。没有谁会为了一部苹果手机活着，手机另一端连接的人才重要。一旦我们开始复原，重新找到生命的意义，我们会长出一双全新的眼睛。我们会看得更清晰，开始察觉到过去无法察觉的东西。", "y": "", "d": "2020-03-01"}]}, {"id": "40405120", "title": "李诞工作手册（万字全新增订）", "author": "李诞", "cats": ["个人成长-沟通表达"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "3 利他心：怎么做深夜读信栏目", "x": "读的信越来越多，我发现人类的核心苦恼——爱、孤独、意义、选择、失去，是如此相似。", "y": "", "d": "2026-09-12"}, {"k": "h", "c": "3 利他心：怎么做深夜读信栏目", "x": "人类的故事早就被写完了，苦恼也千篇一律", "y": "", "d": "2026-09-12"}]}, {"id": "3300075248", "title": "存在主义心理治疗", "author": "[美]亚隆", "cats": ["心理-心理学研究"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 导论", "x": "从充斥着我们每个人经验世界的日常琐事中抽离出来，给自己以独处、沉默、时间以及自由。", "y": "", "d": "2025-10-14"}, {"k": "h", "c": "第一章 导论", "x": "如果并不存在为我们预先设计的蓝图，那么我们每个人就必须构建自己的生命意义。然而，一个人自己创造出来的意义能否坚强到令其能容忍生活？人类这种寻找意义的生物，却被投入到本身毫无意义的宇宙之中，于是，存在的动力性冲突便从进退维谷的境地中滋生出来。", "y": "", "d": "2025-10-14"}]}, {"id": "3300017126", "title": "日日滋养：365天爱自己的生活良方", "author": "周一妍", "cats": ["个人成长-情绪心灵"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "02 用“一进一出”原则管理物品", "x": "第一，从衣服开始。\n第二，化妆品。\n第三，厨房的餐具和锅具。\n第四，冰箱里的备用食材。\n第五，其他容易被囤积的杂物，比如家庭备用卷纸等。", "y": "", "d": "2022-06-29"}, {"k": "h", "c": "02 用“一进一出”原则管理物品", "x": "莫因渴望你没有的而错过你已拥有的；要知道，你现在拥有的，也曾是你渴望的", "y": "", "d": "2022-06-29"}]}, {"id": "41439374", "title": "拆掉思维里的墙（白金升级版）", "author": "古典", "cats": ["心理-认知与行为"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "拆掉思维的栅栏", "x": "如果你愿意，你总是可以掌控点什么。谁没有痛苦，谁没有纠结呢？除非你的受害者模式让你深深陷入抱怨与自怜之中。只要你愿意用一种掌控者的心态去重新面对自己的工作和生活，你就会感受到幸福。", "y": "", "d": "2022-05-16"}, {"k": "h", "c": "序言 你看世界的角度，决定了你的样子", "x": "拆掉思维里的墙》的核心思想是自我全责——如果你全然为自己负责，你就有能力改变命运；如果你不担起这个责任，任何方法论的缺陷、环境和基因的不公，都会成为你推责的对象——这样的人生只有抱怨，没法进步。", "y": "", "d": "2022-05-16"}]}, {"id": "41439366", "title": "自洽：在不确定的日子里向内看", "author": "史欣悦", "cats": ["心理-认知与行为"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "认知自己是一切的出发点", "x": "“知人者智，自知者明”。", "y": "", "d": "2021-12-27"}, {"k": "h", "c": "自洽，认识并接受自己", "x": "人是目的本身，而不能是手段和工具", "y": "", "d": "2022-02-24"}]}, {"id": "34246592", "title": "谢谢你：松浦弥太郎处世小哲学", "author": "松浦弥太郎", "cats": ["个人成长-人生哲学"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "前言 发现优点的练习", "x": "不管是朋友、恋人，还是工作上的合作对象，选择要与谁交往时，绝不能计较利害得失。\n“和这个人来往，既能填补空虚，又能扩展人脉，好处很多。”\n抱着这种期待与人来往，我想并不妥当。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "前言 发现优点的练习", "x": "“和他在一起，好好玩，很开心。”\n“他好可爱，很有趣，很温柔。”", "y": "", "d": "2021-01-23"}]}, {"id": "510689", "title": "今天也要用心过生活", "autho
