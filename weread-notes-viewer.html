r": "松浦弥太郎", "cats": ["个人成长-励志成长"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "前言 起床后的深呼吸", "x": "在看不到的地方也保持天真——我认为这就是让生活保持新鲜的方法。“没有成长也没关系，只希望常保新奇。”这是我对自己的期许。", "y": "", "d": "2019-08-21"}, {"k": "h", "c": "发现全新自己的捷径", "x": "“希望可以一直发现新的自己。”\n这是我对自己的期望。因为我并不完美，甚至还远不及理想中的自己，所以每个早晨、每一天，发现新的自己总让我很开心。", "y": "", "d": "2020-09-11"}]}, {"id": "3300172855", "title": "不要担心2小时和8公里以外的事情", "author": "李松涛", "cats": ["心理-心理学应用"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "文后", "x": "[插图]", "y": "", "d": "2025-11-03"}]}, {"id": "44966312", "title": "斯多葛生活哲学", "author": "乔纳斯·萨尔茨格伯", "cats": ["个人成长-人生哲学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "前言 preface", "x": "教人如何生活", "y": "", "d": "2024-08-12"}]}, {"id": "33889075", "title": "爱弥儿：论教育（汉译世界学术名著丛书）", "author": "[法]卢梭", "cats": ["教育学习-教育"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "出版说明", "x": "进行劳动教育和自由、平等、博爱的教育，使之学会谋生的手段，不去过那种依高官厚禄的寄生生活，不受权贵的奴役，自由自在地享受大自然赋予的权利，人人平等，互助互爱。", "y": "", "d": "2024-05-10"}]}, {"id": "3300091457", "title": "人间清醒恋爱指南", "author": "扎南", "cats": ["心理-亲密关系", "个人成长-女性成长"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 你为什么谈不好恋爱", "x": "一个能够客观认识自己的人，一定是将内在评价和外在评价都充分客观参考的人。过度依赖外在评价，容易失去自我、随波逐流；过分依赖内在评价，容易变得过于自我、墨守成规。", "y": "", "d": "2024-04-14"}]}, {"id": "25615385", "title": "被讨厌的勇气：“自我启发之父”阿德勒的哲学课", "author": "岸见一郎 古贺史健", "cats": ["心理-积极心理学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "引言", "x": "人并不是住在客观的世界，而是住在自己营造的主观世界里。你所看到的世界不同于我所看到的世界，而且恐怕是不可能与任何人共有的世界。", "y": "", "d": "2023-05-07"}]}, {"id": "32345420", "title": "我在100天内自学英文翻转人生", "author": "张同完", "cats": ["教育学习-外语"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "此刻看着英语报纸、CNN新闻的我，高中成绩可是倒数", "x": "这个方法就是“由情境掌握句子的使用方法，依靠嘴巴和耳朵记忆”。由嘴巴和耳朵反复记忆各式情境的英语句子，绝对比起你过去数十年来，依靠眼睛和手学习语法来得更有效果。", "y": "", "d": "2022-12-28"}]}, {"id": "798755", "title": "小狗钱钱", "author": "[德]博多·舍费尔", "cats": ["教育学习-育儿"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "童话与理财", "x": "真正的勇敢是在感到最恐惧的 的实验成果和趣闻逸事（其中很多是饶有趣味的）", "y": "", "d": "2019-07-02"}]}, {"id": "23437994", "title": "把时间当作朋友（第3版）", "author": "李笑来", "cats": ["个人成长-励志成长"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "1 速成绝无可能", "x": "期望速成，从微观层面上看，有两个主要原因。\n第一个原因是人希望自己的欲望马上得到满足的天性。一个确定的事实是，几乎每个人都有无穷无尽的欲望。虽然每个人都知道，不是所有欲望都能被满足，但人们仍然不会放弃追逐尽可能多的欲望。于是，不劳而获成了每个人心中的诸多愿望之一，甚至可能是其中最大的愿望。如果达不到不劳而获，少劳多获也可以接受，而且最好是“劳”尽量少，“获”尽量多，多多益善。从这个角度更进一步地说，大多数人都抱着类似这样的想法：如果收获的可能性很大，最好马上看到成果；如果收获的可能性很小，最好马上知道结果。每个人都有这种欲望，差别仅在程度或者表现上。\n这种差别也可以解释为什么一些人比另外一些人更容易迷恋赌博——因为这些人比另外那些人更想要甚至需要马上知道结果。\n在各种赌博形式中，老虎机可说是赌鬼们的最爱了。这里说的仅仅是赌鬼，赌王是不玩老虎机的，因为他们在这种纯粹的赌博中得不到乐趣，也不能保证收益。", "y": "", "d": "2019-04-15"}]}]}, {"key": "06_计算机与工程技术", "name": "计算机与工程技术", "books": [{"id": "37683761", "title": "深入浅出Vue.js", "author": "刘博文", "cats": ["计算机-理论知识"], "bmCount": 284, "rvCount": 0, "notes": [{"k": "h", "c": "第 1 章 Vue.js简介", "x": "关于什么是渐进式，其实一开始我琢磨了好久，后来才弄懂，就是说如果你已经有一个现成的服务端应用，也就是非单页应用，可以将Vue.js作为该应用的一部分嵌入其中，带来更加丰富的交互体验。", "y": "", "d": "2021-11-02"}, {"k": "h", "c": "第 1 章 Vue.js简介", "x": "所谓分层，就是说你既可以只用最核心的视图层渲染功能来快速开发一些需求，也可以使用一整套全家桶来开发大型应用。Vue.js有足够的灵活性来适应不同的需求，所以你可以根据自己的需求选择不同的层级。", "y": "", "d": "2021-11-02"}, {"k": "h", "c": "第 1 章 Vue.js简介", "x": "Vue.js 2.0引入了虚拟DOM，其渲染过程变得更快了。虚拟DOM现在已经被网上说烂了，但是我想说的是，不要人云亦云。Vue.js引入虚拟DOM是有原因的。事实上，并不是引入虚拟DOM后，渲染速度变快了。准确地说，应该是80% 的场景下变得更快了，而剩下的20% 反而变慢了。", "y": "", "d": "2021-11-02"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "Vue.js的变化侦测属于“推”。当状态发生变化时，Vue.js立刻就知道了，而且在一定程度上知道哪些状态变了。因此，它知道的信息更多，也就可以进行更细粒度的更新。", "y": "", "d": "2021-11-02"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "每个依赖表示一个具体的DOM节点", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "一个状态所绑定的依赖不再是具体的DOM节点，而是一个组件", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "状态变化后，会通知到组件，组件内部再使用虚拟DOM进行比对。这可以大大降低依赖数量，从而降低依赖追踪所消耗的内存。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "Vue.js之所以能随意调整粒度，本质上还要归功于变化侦测。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "学过JavaScript的人都知道，有两种方法可以侦测到变化：使用Object.defineProperty和ES6的Proxy。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "在getter中收集依赖，在setter中触发依赖。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "我们要通知用到数据的地方，而使用这个数据的地方有很多，而且类型还不一样，既有可能是模板，也有可能是用户写的一个watch，这时需要抽象出一个能集中处理这些情况的类。然后，我们在依赖收集阶段只收集这个封装好的类的实例进来，通知也只通知它一个。接着，它再负责通知其他地方。所以，我们要抽象的这个东西需要先起一个好听的名字。嗯，就叫它Watcher吧。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "先将keypath用 . 分割成数组，然后循环数组一层一层去读数据，最后拿到的obj就是keypath中想要读的数据。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "在ES6之前，JavaScript没有提供元编程的能力，无法侦测到一个新属性被添加到了对象中，也无法侦测到一个属性从对象中删除了。为了解决这个问题，Vue.js提供了两个API——vm.$set与vm.$delete", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "Watcher的原理是先把自己设置到全局唯一的指定位置（例如window.target），然后读取数据。因为读取了数据，所以会触发这个数据的getter。接着，在getter中就会从全局唯一的那个位置读取当前正在读取数据的Watcher，并把这个Watcher收集到Dep中去。通过这样的方式，Watcher可以主动去订阅任意一个数据的变化。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 2 章 Object的变化侦测", "x": "Data通过Observer转换成了getter/setter的形式来追踪变化。当外界通过Watcher读取数据时，会触发getter从而将Watcher添加到依赖中。当数据发生了变化时，会触发setter，从而向Dep中的依赖（Watcher）发送通知。Watcher接收到通知后，会向外界发送通知，变化通知到外界后可能会触发视图更新，也有可能触发用户的某个回调函数等。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 3 章 Array的变化侦测", "x": "上面这个例子使用了push方法来改变数组，并不会触发getter/setter。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 3 章 Array的变化侦测", "x": "Object的变化是靠setter来追踪的，只要一个数据发生了变化，一定会触发setter。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 3 章 Array的变化侦测", "x": "可以用一个拦截器覆盖Array.prototype。之后，每当使用Array原型上的方法操作数组时，其实执行的都是拦截器中提供的方法，比如push方法。然后，在拦截器中使用原生Array的原型方法去操作数组。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 3 章 Array的变化侦测", "x": "所以，Array在getter中收集依赖，在拦截器中触发依赖。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第 4 章 变化侦测相关的API实现原理", "x": "这里有一个细节需要注意，expOrFn是支持函数的", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 4 章 变化侦测相关的API实现原理", "x": "上面的代码新增了判断expOrFn类型的逻辑。如果expOrFn是函数，则直接将它赋值给getter；如果不是函数，再使用parsePath函数来读取keypath中的数据。这里keypath指的是属性路径，例如a.b.c.d就是一个keypath，说明从vm.a.b.c.d中读取数据。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 4 章 变化侦测相关的API实现原理", "x": "Vue.js中计算属性（Computed）的实现原理与expOrFn支持函数有很大的关系", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 4 章 变化侦测相关的API实现原理", "x": "在上述代码中，我们使用depIds来判断如果当前Watcher已经订阅了该Dep，则不会重复订阅。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 4 章 变化侦测相关的API实现原理", "x": "如果Watcher中的expOrFn参数是一个表达式，那么肯定只收集一个Dep，并且大部分都是这样。但凡事总有例外，expOrFn可以是一个函数，此时如果该函数中使用了多个数据，那么这时Watcher就要收集多个Dep了", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "当状态变得越来越多，DOM操作越来越频繁时，我们就会发现如果像之前那样使用jQuery来开发页面，那么代码中会有相当多的代码是在操作DOM，程序中的状态也很难管理，代码中的逻辑也很混乱。这其实是命令式操作DOM的问题，虽然简单易用，但是在业务越来越复杂的今天，它会有不好维护的问题。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "关于状态到视图的转换过程，框架会帮我们做，不需要我们自己手动去操作DOM。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "虚拟DOM的解决方式是通过状态生成一个虚拟节点树，然后使用虚拟节点树进行渲染。在渲染之前，会使用新生成的虚拟节点树和上一次生成的虚拟节点树进行对比，只渲染不同的部分。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "在Vue.js中，当状态发生变化时，它在一定程度上知道哪些节点使用了这个状态，从而对这些节点进行更新操作，根本不需要比对。事实上，在Vue.js 1.0的时候就是这样实现的。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "Vue.js 2.0开始选择了一个中等粒度的解决方案，那就是引入了虚拟DOM。组件级别是一个watcher实例，就是说即便一个组件内有10个节点使用了某个状态，但其实也只有一个watcher在观察这个状态的变化。所以当这个状态发生变化时，只能通知到组件，然后组件内部通过虚拟DOM去进行比对与渲染。这是一个比较折中的方案。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "Vue.js通过编译将模板转换成渲染函数（render），执行渲染函数就可以得到一个虚拟节点树，使用这个虚拟节点树就可以渲染页面", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "虚拟DOM的终极目标是将虚拟节点（vnode）渲染到视图上。但是如果直接使用虚拟节点覆盖旧节点的话，会有很多不必要的DOM操作。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "虚拟DOM在Vue.js中所做的事情其实并没有想象中那么复杂，它主要做了两件事。● 提供与真实DOM节点所对应的虚拟节点vnode。● 将虚拟节点vnode和旧虚拟节点oldVnode进行比对，然后更新视图。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "虚拟DOM是将状态映射成视图的众多解决方案中的一种，它的运作原理是使用状态生成虚拟节点，然后使用虚拟节点渲染视图。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "之所以需要先使用状态生成虚拟节点，是因为如果直接用状态生成真实DOM，会有一定程度的性能浪费。而先创建虚拟节点再渲染视图，就可以将虚拟节点缓存，然后使用新创建的虚拟节点和上一次渲染时缓存的虚拟节点进行对比，然后根据对比结果只更新需要更新的真实DOM节点，从而避免不必要的DOM操作，节省一定的性能开销。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "Vue.js 2.0采取了一个中等粒度的解决方案，状态侦测不再细化到某个具体节点，而是某个组件，组件内部通过虚拟DOM来渲染视图，这可以大大缩减依赖数量和watcher数量。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 5 章 虚拟DOM简介", "x": "Vue.js中通过模板来描述状态与视图之间的映射关系，所以它会先将模板编译成渲染函数，然后执行渲染函数生成虚拟节点，最后使用虚拟节点更新视图。因此，虚拟DOM在Vue.js中所做的事是提供虚拟节点vnode和对新旧两个vnode进行比对，并根据比对结果进行DOM操作来更新视图。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 6 章 VNode", "x": "变化侦测只通知到组件级别", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 6 章 VNode", "x": "只要组件使用的众多状态中有一个发生了变化，那么整个组件就要重新渲染。如果组件只有一个节点发生了变化，那么重新渲染整个组件的所有节点，很明显会造成很大的性能浪费。因此，对vnode进行缓存，并将上一次缓存的vnode和当前新创建的vnode进行对比，只更新发生变化的节点就变得尤为重要。这也是vnode最重要的一个作用。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 6 章 VNode", "x": "vnode的类型有以下几种：● 注释节点● 文本节点● 元素节点● 组件节点● 函数式组件● 克隆节点", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "之所以要这么做，主要是因为DOM操作的执行速度远不如JavaScript的运算速度快。因此，把大量的DOM操作搬运到JavaScript中，使用patching算法来计算出真正需要更新的节点，最大限度地减少DOM操作，从而显著提升性能。这本质上其实是使用JavaScript的运算成本来替换DOM操作的执行成本，而JavaScript的运算速度要比DOM快很多，这样做很划算，所以才会有虚拟DOM。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "对现有DOM进行修改需要做三件事：● 创建新增的节点；● 删除已经废弃的节点；● 修改需要更新的节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "我们知道patch的过程其实就是创建节点、删除节点和修改节点的过程，接下来主要讨论在什么情况下创建新节点，插入到什么位置；在什么情况下删除节点，删除哪个节点；在什么情况下修改节点，修改哪个节点等。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当oldVnode不存在时，直接使用vnode创建元素并渲染视图", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当新旧两个节点是相同的节点时，我们需要对这两个节点进行比较细致的比对，然后对oldVnode在视图中所对应的真实节点进行更新。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "可以发现整个patch的过程并不复杂。当oldVnode不存在时，直接使用vnode渲染视图；当oldVnode和vnode都存在但并不是同一个节点时，使用vnode创建的DOM元素替换旧的DOM元素；当oldVnode和vnode是同一个节点时，使用更详细的对比操作对真实的DOM节点进行更新。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "事实上，只有三种类型的节点会被创建并插入到DOM中：元素节点、注释节点和文本节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "而要判断vnode是否是元素节点，只需要判断它是否具有tag属性即可。如果一个vnode具有tag属性，就认为它是元素属性。接着，我们就可以调用当前环境下的createElement方法（在浏览器环境下就是document.createElement）来创建真实的元素节点。当一个元素节点被创建后，接下来要做的事情就是将它插入到指定的父节点中。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "将元素渲染到视图的过程非常简单。只需要调用当前环境下的appendChild方法（在浏览器环境下就是调用parentNode.appendChild），就可以将一个元素插入到指定的父节点中。如果这个指定的父节点已经被渲染到视图，那么把元素插入到它的下面将会自动将元素渲染到视图。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "创建子节点的过程是一个递归过程。vnode中的children属性保存了当前节点的所有子虚拟节点（child virtual node），所以只需要将vnode中的children属性循环一遍，将每个子虚拟节点都执行一遍创建元素的逻辑，就可以实现我们想要的功能。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "在创建节点时，如果vnode中不存在tag属性，那么它可能会是另外两种节点：注释节点和文本节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "注释节点有一个唯一的标识属性isComment。在所有类型的vnode中，只有注释节点的isComment属性是true，所以通过isComment属性就可以判断一个vnode是否是注释节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当发现一个vnode的tag属性不存在时，我们可以用isComment属性来判断它是注释节点还是文本节点。如果是文本节点，则调用当前环境下的createTextNode方法（浏览器环境下调用document.createTextNode）来创建真实的文本节点并将其插入到指定的父节点中；如果是注释节点，则调用当前环境下的createComment方法（浏览器环境下调用document.createComment方法）来创建真实的注释节点并将其插入到指定的父节点中。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "跨平台渲染的本质是在设计框架的时候，要让框架的渲染机制和DOM解耦。只要把框架更新DOM时的节点操作进行封装，就可以实现跨平台渲染，在不同平台下调用节点的操作。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "什么是静态节点？静态节点指的是那些一旦渲染到界面上之后，无论日后状态如何变化，都不会发生任何变化的节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "上面这个HTML就是一个静态节点，它不会因为状态的变化而发生变化。这个节点一旦被渲染到视图之后，当应用在运行时，无论状态是否发生变化，都不会影响到这个节点，这个节点永远都不需要重新渲染。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "需要判断虚拟节点是否是静态节点，从而跳过更新节点的操作", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "如果新生成的虚拟节点（vnode）有text属性，那么不论之前旧节点的子节点是什么，直接调用setTextContent方法（在浏览器环境下是node.textContent方法）来将视图中DOM节点的内容改为虚拟节点（vnode）的text属性所保存的文字。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当新虚拟节点有文本属性，并且和旧虚拟节点的文本属性不一样时，我们可以直接把视图中的真实DOM节点的内容改成新虚拟节点的文本。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当新创建的虚拟节点有children属性时，其实还会有两种情况，那就是要看旧虚拟节点（oldVnode）是否有children属性。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "如果旧虚拟节点也有children属性，那么我们要对新旧两个虚拟节点的children进行一个更详细的对比并更新。更新children可能会移动某个子节点的位置，也有可能会删除或新增某个子节点", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "如果旧虚拟节点没有children属性，那么说明旧虚拟节点要么是一个空标签，要么是有文本的文本节点。如果是文本节点，那么先把文本清空让它变成空标签，然后将新虚拟节点（vnode）中的children挨个创建成真实的DOM元素节点并将其插入到视图中的DOM节点下面。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当新创建的虚拟节点既没有text属性也没有children属性时，这说明这个新创建的节点是一个空节点，它下面既没有文本也没有子节点，这时如果旧虚拟节点（oldVnode）中有子节点就删除子节点，有文本就删除文本。有什么删什么，最后达到视图中是空标签的目的。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "对比两个子节点列表（children），首先需要做的事情是循环", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "对于新增节点，我们需要执行创建节点的操作，并将新创建的节点插入到oldChildren中所有未处理节点（未处理就是没有进行任何更新操作的节点）的前面", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "你可能会对为什么插入到oldChildren中所有未处理节点的前面感到很困惑", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "通过Node.insertBefore()方法，我们可以成功地将一个已有节点移动到一个指定的位置。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "怎样实现从两边向中间循环呢？", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "首先，我们先准备4个变量：oldStartIdx、oldEndIdx、newStartIdx和newEndIdx。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "在循环体内，每处理一个节点，就将下标向指定的方向移动一个位置，通常情况下是对新旧两个节点进行更新操作，就相当于一次性处理两个节点，将新旧两个节点的下标都向指定方向移动一个位置。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当开始位置大于等于结束位置时，说明所有节点都遍历过了，则结束循环：", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "当新子节点和旧子节点的节点数量不一致时，会导致循环结束后仍然有未处理的节点，也就是说这个循环将无法覆盖所有节点。确实是无法覆盖所有节点，但正是因为这样，才会少循环几次，提升一些性能。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 7 章 patch", "x": "在更新子节点时，需要在oldChildren中循环去找一个节点。但是如果我们在模板中渲染列表时，为子节点设置了属性key，那么在图7-26中建立key与index索引的对应关系时，就生成了一个key对应着一个节点下标这样一个对象。也就是说，如果在节点上设置了属性key，那么在oldChildren中找相同节点时，可以直接通过key拿到下标，从而获取节点。这样，我们根本不需要通过循环来查找节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第三篇 模板编译原理", "x": "但在Vue.js中创建HTML并不是只有模板这一种途径，我们既可以手动写渲染函数来创建HTML，也可以在Vue.js中使用JSX来创建HTML。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第三篇 模板编译原理", "x": "渲染函数是创建HTML最原始的方法。模板最终会通过编译转换成渲染函数，渲染函数执行后，会得到一份vnode用于虚拟DOM渲染。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "模板编译所介绍的内容是如何让虚拟DOM拿到vnode", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "模板编译在整个渲染过程中的位置", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "在底层实现上，Vue.js会将模板编译成虚拟DOM渲染函数。当应用内部的状态发生变化时，Vue.js可以结合响应式系统，聪明地找出最小数量的组件进行重新渲染以及最少量地进行DOM操作。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "平时使用模板时，可以在模板中使用一些变量来填充模板，还可以在模板中使用JavaScript表达式，又或者是使用一些指令等。这些功能在HTML语法中是不存在的，那么为什么在Vue.js的模板中就可以使用各种很灵活的语法呢？这就多亏了模板编译赋予了模板强大的功能。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "模板编译的主要目标就是生成渲染函数", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "而渲染函数的作用是每次执行它，它就会使用当前最新的状态生成一份新的vnode，然后使用这个vnode进行渲染。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "将模板编译成渲染函数可以分两个步骤，先将模板解析成AST（Abstract SyntaxTree，抽象语法树），然后再使用AST生成渲染函数。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "但是由于静态节点不需要总是重新渲染，所以在生成AST之后、生成渲染函数之前这个阶段，需要做一个操作，那就是遍历一遍AST，给所有静态节点做一个标记，这样在虚拟DOM中更新节点时，如果发现节点有这个标记，就不会重新渲染它。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "模板编译分三部分内容：● 将模板解析为AST● 遍历AST标记静态节点● 使用AST生成渲染函数", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "● 解析器● 优化器● 代码生成器", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "解析器的作用前面已经提到过，其目标很明确，只实现一个功能，那就是将模板解析成AST。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "其实文本解析器的主要作用是用来解析带变量的文本，什么是带变量的文本？下面这段代码中的name就是变量，而这样的文本叫作带变量的文本：", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "HTML解析器，它是解析器中最核心的模块，它的作用就是解析模板，每当解析到HTML标签的开始位置、结束位置、文本或者注释时，都会触发钩子函数，然后将相关信息通过参数传递出来。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "这个AST其实和vnode有点类似，都是使用JavaScript中的对象来表示节点。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "优化器的目标是遍历AST，检测出所有静态子树（永远都不会发生变化的DOM节点）并给其打标记。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "当AST中的静态子树被打上标记后，每次重新渲染时，就不需要为打上标记的静态节点创建新的虚拟节点，而是直接克隆已存在的虚拟节点。在虚拟DOM的更新操作中，如果发现两个节点是同一个节点，正常情况下会对这两个节点进行更新，但是如果这两个节点是静态节点，则可以直接跳过更新节点的流程。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "总体来说，优化器的主要作用是避免一些无用功来提升性能。因为静态节点除了首次渲染，后续不需要任何重新渲染操作。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "代码生成器是模板编译的最后一步，它的作用是将AST转换成渲染函数中的内容，这个内容可以称为“代码字符串”。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "这样一个代码字符串最终导出到外界使用时，会将代码字符串放到函数里，这个函数叫作渲染函数。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "渲染函数的作用是创建vnode", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "渲染函数之所以可以生成vnode，是因为代码字符串中会有很多函数调用", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "这些函数是虚拟DOM提供的创建vnode的方法。vnode有很多种类型，不同的类型对应不同的创建方法，所以代码字符串中的 _c和 _v其实都是创建vnode的方法，只是创建的vnode的类型不同。例如，_c可以创建元素类型的vnode，而 _v可以创建文本类型的vnode。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 8 章 模板编译", "x": "将模板编译成渲染函数有三部分内容：先将模板解析成AST，然后遍历AST标记静态节点，最后使用AST生成代码字符串。这三部分内容分别对应三个模块：解析器、优化器和代码生成器。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "解析器要实现的功能是将模板解析成AST。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "其实AST并不是什么很神奇的东西，不要被它的名字吓倒。它只是用JavaScript中的对象来描述一个节点，一个对象表示一个节点，对象中的属性用来保存节点所需的各种数据。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "解析器内部也分了好几个子解析器，比如HTML解析器、文本解析器以及过滤器解析器，其中最主要的是HTML解析器。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器的作用是解析HTML，它在解析HTML的过程中会不断触发各种钩子函数。这些钩子函数包括开始标签钩子函数、结束标签钩子函数、文本钩子函数以及注释钩子函数。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "解析器其实是从前向后解析的。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "钩子函数start有三个参数，分别是tag、attrs和unary，它们分别说明标签名、标签的属性以及是否是自闭合标签。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "而文本节点的钩子函数chars和注释节点的钩子函数comment都只有一个参数，只有text。这是因为构建元素节点时需要知道标签名、属性和自闭合标识，而构建注释节点和文本节点时只需要知道文本即可。", "y": "", "d": "2021-11-04"}, {"k": "h", "c": "第 9 章 解析器", "x": "我们需要一套逻辑来实现层级关系，让每一个AST节点都能找到它的父级。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "构建AST层级关系其实非常简单，我们只需要维护一个栈（stack）即可，用栈来记录层级关系，这个层级关系也可以理解为DOM的深度。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器在解析HTML时，是从前向后解析。每当遇到开始标签，就触发钩子函数start。每当遇到结束标签，就会触发钩子函数end。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "基于HTML解析器的逻辑，我们可以在每次触发钩子函数start时，把当前构建的节点推入栈中；每当触发钩子函数end时，就从栈中弹出一个节点。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "这样就可以保证每当触发钩子函数start时，栈的最后一个节点就是当前正在构建的节点的父节点", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "上面这个模板被解析成AST的过程如图9-2所示", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "构建AST的过程", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "中的黑底白数字表示解析的步骤，具体如下。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "模板的开始位置是div的开始标签，于是会触发钩子函数start。start触发后，会先构建一个div节点。此时发现栈是空的，这说明div节点是根节点，因为它没有父节点。最后，将div节点推入栈中，并将模板字符串中的div开始标签从模板中截取掉。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "❷ 这时模板的开始位置是一些空格，这些空格会触发文本节点的钩子函数，在钩子函数里会忽略这些空格。同时会在模板中将这些空格截取掉。❸ 这时模板的开始位置是h1的开始标签，于是会触发钩子函数start。与前面流程一样，start触发后，会先构建一个h1节点。此时发现栈的最后一个节点是div节点，这说明h1节点的父节点是div，于是将h1添加到div的子节点中，并且将h1节点推入栈中，同时从模板中将h1的开始标签截取掉。❹ 这时模板的开始位置是一段文本，于是会触发钩子函数chars。chars触发后，会先构建一个文本节点，此时发现栈中的最后一个节点是h1，这说明文本节点的父节点是h1，于是将文本节点添加到h1节点的子节点中。由于文本节点没有子节点，所以文本节点不会被推入栈中。最后，将文本从模板中截取掉。❺ 这时模板的开始位置是h1结束标签，于是会触发钩子函数end。end触发后，会把栈中最后一个节点弹出来。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "❻ 与第 ❷ 步一样，这时模板的开始位置是一些空格，这些空格会触发文本节点的钩子函数，在钩子函数里会忽略这些空格。同时会在模板中将这些空格截取掉。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "❼ 这时模板的开始位置是p开始标签，于是会触发钩子函数start。start触发后，会先构建一个p节点。由于第 ❺ 步已经从栈中弹出了一个节点，所以此时栈中的最后一个节点是div，这说明p节点的父节点是div。于是将p推入div的子节点中，最后将p推入到栈中，并将p的开始标签从模板中截取掉。❽ 这时模板的开始位置又是一段文本，于是会触发钩子函数chars。当chars触发后，会先构建一个文本节点，此时发现栈中的最后一个节点是p节点，这说明文本节点的父节点是p节点。于是将文本节点推入p节点的子节点中，并将文本从模板中截取掉。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "❾ 这时模板的开始位置是p的结束标签，于是会触发钩子函数end。当end触发后，会从栈中弹出一个节点出来，也就是把p标签从栈中弹出来，并将p的结束标签从模板中截取掉。❿ 与第 ❷ 步和第 ❻ 步一样，这时模板的开始位置是一些空格，这些空格会触发文本节点的钩子函数并且在钩子函数里会忽略这些空格。同时会在模板中将这些空格截取掉。⓫ 这时模板的开始位置是div的结束标签，于是会触发钩子函数end。其逻辑与之前一样，把栈中的最后一个节点弹出来，也就是把div弹了出来，并将div的结束标签从模板中截取掉。⓬ 这时模板已经被截取空了，也就说明HTML解析器已经运行完毕。这时我们会发现栈已经空了，但是我们得到了一个完整的带层级关系的AST语法树。这个AST中清晰写明了每个节点的父节点、子节点及其节点类型。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "构建AST非常依赖HTML解析器所执行的钩子函数以及钩子函数中所提供的参数", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器是如何解析模板", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "用HTML模板字符串来循环，每轮循环都从HTML模板中截取一小段字符串，然后重复以上过程，直到HTML模板被截成一个空字符串时结束循环", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "在截取一小段字符串时，有可能截取到开始标签，也有可能截取到结束标签，又或者是文本或者注释，我们可以根据截取的字符串的类型来触发不同的钩子函数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "为了方便理解，我们手动模拟HTML解析器的解析过程。例如，下面这样一个简单的HTML模板：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器在循环中都干了些什么事", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器可以很聪明地知道它在每一轮循环中应该截取哪些字符串，那么它是如何做到这一点的呢？", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "每一轮截取字符串时，都是在整个模板的开始位置截取。我们根据模板开始位置的片段类型，进行不同的截取操作。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "这些被截取的片段分很多种类型，示例如下。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "● 开始标签，例如 <div>。● 结束标签，例如 <\/div>。● HTML注释，例如 <!-- 我是注释 -->。● DOCTYPE，例如 <!DOCTYPE html>。● 条件注释，例如 <!--[if !IE]>-->我是注释<!--<![endif]-->。● 文本，例如我是Berwin。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "最常见的是开始标签、结束标签、文本以及注释。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "每一轮循环都是从模板的最前面截取，所以只有模板以开始标签开头，才需要进行开始标签的截取操作。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "我们需要先判断HTML模板是不是以 < 开头。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "如果模板以 < 开头，那么它有可能是以开始标签开头的模板，同时它也有可能是以结束标签开头的模板，还有可能是注释等其他标签，因为这些类型的片段都以 < 开头。那么，要进一步确定模板是不是以开始标签开头，还需要借助正则表达式来分辨模板的开始位置是否符合开始标签的特征。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "当HTML解析器解析到标签开始时，会触发钩子函数start，同时会给出三个参数，分别是标签名（tagName）、属性（attrs）以及自闭合标识（unary）。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "因此，在分辨出模板以开始标签开始之后，需要将标签名、属性以及自闭合标识解析出来。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "事实上，开始标签被拆分成三个小部分，分别是标签名、属性和结尾，如图9-3所示。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "在分辨出模板以开始标签开头之后，会将开始标签中的标签名这一小部分截取掉，因此在解析标签属性时，我们得到的模板是下面伪代码中的样子", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "属性也可以分成多个小部分，一小部分一小部分去解析与截取。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "开始标签中结尾部分解析的主要目的是解析出当前这个标签是否是自闭合标签。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "自闭合标签是没有子节点的，所以前文中我们提到构建AST层级时，需要维护一个栈，而一个节点是否需要推入到栈中，可以使用这个自闭合标识来判断。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "解析开始标签时，我们将其拆解成了三个部分，分别是标签名、属性和结尾。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "所有解析操作都运行在循环中，所以continue的意思是这一轮的解析工作已经完成，可以进行下一轮解析工作。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "那么，如何分辨模板已经截取到结束标签了呢？其道理其实和开始标签的截取相同。如果HTML模板的第一个字符不是 <，那么一定不是结束标签。只有HTML模板的第一个字符是 < 时，我们才需要进一步确认它到底是不是结束标签。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "然而文本只有一种，如果HTML模板的第一个字符不是 <，那么它一定是文本了。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "第一部分是截取文本，这在前面介绍过了。< 之前的所有字符都是文本，直接使用html.substring从模板的最开始位置截取到 < 之前的位置，就可以将文本截取出来。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "第二部分是一个条件，如果在整个模板中都找不到 <，那么说明整个模板全是文本。第三部分是触发钩子函数并将截取出来的文本放到参数中。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "关于文本，还有一个特殊情况需要处理：如果 < 是文本的一部分，该如何处理？", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "<2符合开始标签的特征么？不符合。<2符合结束标签的特征么？不符合。<2符合注释的特征么？不符合。当剩余的模板什么都不符合时，就说明 < 属于文本的一部分。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "就是每解析到开始标签，就向栈中推进去一个；每解析到标签结束，就弹出来一个。因此，想取到父元素并不难，只需要拿到栈中的最后一项即可。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器中的栈还有另一个作用，它可以检测出HTML标签是否正确闭合。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器是一个函数", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器在实现上肯定是一个函数，它有两个参数——模板和选项：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "我们的模板是一小段一小段去截取与解析的，所以需要一个循环来不断截取，直到全部截取完毕：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "在循环中，首先要判断父元素是不是纯文本内容元素，因为不同类型父节点的解析方式将完全不同：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "在这些需要处理的类型中，除了文本之外，其他都是以标签形式存在的，而标签是以 < 开头的。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "先根据 < 来判断需要解析的字符是文本还是其他", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "文本解析器是对HTML解析器解析出来的文本进行二次加工。为什么要进行二次加工？", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "文本其实分两种类型，一种是纯文本，另一种是带变量的文本。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "因为带变量的文本在使用虚拟DOM进行渲染时，需要将变量替换成变量中的值。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "每当HTML解析器解析到文本时，都会触发chars函数，并且从参数中得到解析出的文本。在chars函数中，我们需要构建文本类型的AST，并将它添加到父节点的children属性中。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "如果是带变量的文本，我们需要借助文本解析器对它进行二次加工", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "在文本解析器中，第一步要做的事情就是使用正则表达式来判断文本是否为带变量的文本，也就是检查文本中是否包含 {{xxx}} 这样的语法", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "如果是纯文本，则直接返回undefined；如果是带变量的文本，再进行二次加工。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "解析器的作用是通过模板得到AST（抽象语法树）。生成AST的过程需要借助HTML解析器，当HTML解析器触发不同的钩子函数时，我们可以构建出不同的节点。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "随后，我们可以通过栈来得到当前正在构建的节点的父节点，然后将构建出的节点添加到父节点的下面。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "最终，当HTML解析器运行完毕后，我们就可以得到一个完整的带DOM层级关系的AST。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 9 章 解析器", "x": "HTML解析器的内部原理是一小段一小段地截取模板字符串，每截取一小段字符串，就会根据截取出来的字符串类型触发不同的钩子函数，直到模板字符串截空停止运行。文本分两种类型，不带变量的纯文本和带变量的文本，后者需要使用文本解析器进行二次加工。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "解析器的作用是将HTML模板解析成AST，而优化器的作用是在AST中找出静态子树并打上标记。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "静态子树指的是那些在AST中永远都不会发生变化的节点。例如，一个纯文本节点就是静态子树，而带变量的文本节点就不是静态子树，因为它会随着变量的变化而变化。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "标记静态子树有两点好处：● 每次重新渲染时，不需要为静态子树创建新节点；● 在虚拟DOM中打补丁（patching）的过程可以跳过。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "优化器的内部实现主要分为两个步骤：(1) 在AST中找出所有静态节点并打上标记；(2) 在AST中找出所有静态根节点并打上标记。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "先标记所有静态节点，再标记所有静态根节点。那么，什么是静态节点？像下面这样永远都不会发生变化的节点属于静态节点：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "落实到AST中，静态节点指的是static属性为true的节点", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "什么是静态根节点？如果一个节点下面的所有子节点都是静态节点，并且它的父级是动态节点，那么它就是静态根节点。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "静态根节点指的是staticRoot属性为true的节点", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "找出所有静态子节点并不难，我们只需要从根节点开始，先判断根节点是不是静态根节点，再用相同的方式处理子节点，接着用同样的方式去处理子节点的子节点，直到所有节点都被处理之后程序结束，这个过程叫作递归。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "type的取值及其说明", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "不能是组件，即标签名必须是保留标签，例如<div><\/div>是保留标签，而<list><\/list>不是保留标签。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "HTML保留标签", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "SVG保留标签", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "在子节点被打完标记之后，我们需要判断它是否是静态节点，如果不是，那么它的父节点也不可能是静态节点，此时需要将父节点的static属性设置为false。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "如果一个节点被判定为静态根节点，那么将不会继续向它的子级继续寻找。因为静态子树肯定只有一个根，就是最上面的那个静态节点。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "大部分情况下，我们找到的第一个静态节点会被标记为静态根节点", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "但是有一种情况，即便它真的是静态根节点，也不会被标记为静态根节点，因为其优化成本大于收益。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "优化器的作用是在AST中找出静态子树并打上标记，这样做有两个好处：● 每次重新渲染时，不需要为静态子树创建新节点；● 在虚拟DOM中打补丁的过程可以跳过。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "优化器的内部实现其实主要分为两个步骤：(1) 在AST中找出所有静态节点并打上标记；(2) 在AST中找出所有静态根节点并打上标记。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "通过递归的方式从上向下标记静态节点时，如果一个节点被标记为静态节点，但它的子节点却被标记为动态节点，就说明该节点不是静态节点，可以将它改为动态节点。静态节点的特征是它的子节点必须是静态节点。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "标记完静态节点之后需要标记静态根节点，其标记方式也是使用递归的方式从上向下寻找，在寻找的过程中遇到的第一个静态节点就为静态根节点，同时不再向下继续查找。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 10 章 优化器", "x": "但有两种情况比较特殊：一种是如果一个静态根节点的子节点只有一个文本节点，那么不会将它标记成静态根节点，即便它也属于静态根节点；另一种是如果找到的静态根节点是一个没有子节点的静态节点，那么也不会将它标记为静态根节点。因为这两种情况下，优化成本大于收益。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "代码生成器是模板编译的最后一步，它的作用是将AST转换成渲染函数中的内容，这个内容可以称为代码字符串。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "代码字符串可以被包装在函数中执行，这个函数就是我们通常所说的渲染函数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "渲染函数被执行之后，可以生成一份VNode，而虚拟DOM可以通过这个VNode来渲染视图。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "如何使用AST生成代码字符串", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "是一个嵌套的函数调用。函数_c的参数中执行了函数 _v，而函数 _v的参数中又执行了函数 _s。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "代码字符串中的 _c其实是createElement的别名。createElement是虚拟DOM中所提供的方法，它的作用是创建虚拟节点，有三个参数，分别是：● 标签名● 一个包含模板相关属性的数据对象● 子节点列表调用createElement方法，我们可以得到一个VNode。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "这也就知道了渲染函数可以生成VNode的原因：渲染函数其实是执行了createElement，而createElement可以创建一个VNode。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "生成代码字符串是一个递归的过程，从顶向下依次处理每一个AST节点。节点有三种类型，分别对应三种不同的创建方法与别名，如表11-1所示。表11-1　三种节点对应的创建方法与别名", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "当递归结束时，我们就可以得到一个完整的代码字符串。这段代码字符串会被包裹在with语句中，其伪代码如下：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "code是我们通过递归得到的完整的代码字符串。代码生成器的作用就是生成上面伪代码中所展示的一段字符串。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "生成元素节点，其实就是生成一个 _c的函数调用字符串", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "代码中的主要逻辑是用genData和genChildren分别获取data和children，然后将它们分别拼到字符串中指定的位置，最后把拼好的 \"_c(tagName, data, children)\"返回，这样一个元素节点的代码字符串就生成好了。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "生成文本节点很简单，我们只需要把文本放在 _v这个函数的参数中即可", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "注释节点与文本节点相同，只需要把文本放在 _e的参数中即可", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "代码生成器其实就是字符串拼接的过程。通过递归AST来生成字符串，最先生成根节点，然后在子节点字符串生成后，将其拼接在根节点的参数中，子节点的子节点拼接在子节点的参数中，这样一层一层地拼接，直到最后拼接成完整的字符串。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 11 章 代码生成器", "x": "当字符串拼接好后，会将字符串拼在with中返回给调用者", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "• 完整版：构建后的文件同时包含编译器和运行时。• 编译器：负责将模板字符串编译成JavaScript渲染函数，这部分内容在第三篇中介绍过。• 运行时：负责创建Vue.js实例，渲染视图和使用虚拟DOM实现重新渲染，基本上包含除编译器外的所有部分。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "运行时 + 编译器与只包含运行时", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "如果需要在客户端编译模板（比如传入一个字符串给template选项，或挂载到一个元素上并以其DOM内部的HTML作为模板），那么需要用到编译器，因此需要完整版：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "当使用vue-loader或vueify的时候，*.vue文件内部的模板会在构建时预编译成JavaScript。所以，最终打包完成的文件实际上是不需要编译器的，只需要引入运行时版本即可。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "这两个版本同时保留原始的process.env.NODE_ENV检测，来决定它们应该在什么模式下运行。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "Vue.js的整体结构，我们可以看到它整体分为三个部分：核心代码、跨平台相关和公用工具函数", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "同时，其架构是分层的，最底层是一个普通的构造函数，最上层是一个入口，也就是将一个完整的构造函数导出给用户使用。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "在最底层和最顶层中间，我们需要逐渐添加一些方法和属性，而构造函数上一层的一些方法会最终添加到构造函数的prototype属性中，再上一层的方法最终会添加到构造函数上，这些方法叫作全局API（Global API），例如Vue.use", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "最顶层是入口，也可以叫作出口。对于构建工具和Vue.js的使用者来说，这是入口；对于Vue.js自身来说，这是出口。在构建文件时，不同平台的构建文件会选择不同的入口进行构建操作。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "程序结构2", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "先向Vue构造函数的prototype属性上添加一些方法，然后向Vue构造函数自身添加一些全局API，接着将平台特有的代码导入进来，最后将编译器导入进来。最终将所有代码同Vue构造函数一起导出去。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 12 章 架构设计与项目结构", "x": "Vue.js在大体上可以分三部分：核心代码、跨平台相关与公用工具函数。核心代码包含原型方法和全局API，它们可以在各个平台下运行，而跨平台相关的部分更多的是渲染相关的功能，不同平台下的渲染API是不同的。以Web平台为例，Web页面中的渲染操作就是操作DOM，所以在跨平台的Web环境下对DOM操作的API进行了封装，这个封装主要与虚拟DOM对接，而虚拟DOM中所使用的各种节点操作其实是调用跨平台层封装的API接口。而Weex平台对节点的操作与Web平台并不相同。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "其他4个函数也是如此，只是它们会在Vue构造函数的prototype属性上挂载不同的方法而已。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "与数据相关的实例方法有3个，分别是vm.$watch、vm.$set和vm.$delete，它们是在stateMixin中挂载到Vue的原型上的", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "当stateMixin被调用时，会向Vue构造函数的prototype属性挂载上面说的3个与数据相关的实例方法。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "与事件相关的实例方法有4个，分别是：vm.$on、vm.$once、vm.$off和vm.$emit。这4个方法是在eventsMixin中挂载到Vue构造函数的prototype属性中的", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "监听当前实例上的自定义事件，事件可以由vm.$emit触发。回调函数会接收所有传入事件所触发的函数的额外参数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "与生命周期相关的实例方法有4个，分别是vm.$mount、vm.$forceUpdate、vm.$nextTick和vm.$destroy。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "nextTick接收一个回调函数作为参数，它的作用是将回调延迟到下次DOM更新周期之后执行。它与全局方法Vue.nextTick一样，不同的是回调的this自动绑定到调用它的实例上。如果没有提供回调且在支持Promise的环境中，则返回一个Promise。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "我们在开发项目时会遇到一种场景：当更新了状态（数据）后，需要对新DOM做一些操作，但是这时我们其实获取不到更新后的DOM，因为还没有重新渲染。这个时候我们需要使用nextTick方法。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "在Vue.js中，当状态发生变化时，watcher会得到通知，然后触发虚拟DOM的渲染流程。而watcher触发渲染这个操作并不是同步的，而是异步的。Vue.js中有一个队列，每当需要渲染时，会将watcher推送到这个队列中，在下一次事件循环中再让watcher触发渲染的流程。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "Vue.js 2.0开始使用虚拟DOM进行渲染，变化侦测的通知只发送到组件，组件内用到的所有状态的变化都会通知到同一个watcher，然后虚拟DOM会对整个组件进行“比对（diff）”并更改DOM。也就是说，如果在同一轮事件循环中有两个数据发生了变化，那么组件的watcher会收到两份通知，从而进行两次渲染。事实上，并不需要渲染两次，虚拟DOM会对整个组件进行渲染，所以只需要等所有状态都修改完毕后，一次性将整个组件的DOM渲染到最新即可。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "要解决这个问题，Vue.js的实现方式是将收到通知的watcher实例添加到队列中缓存起来，并且在添加到队列之前检查其中是否已经存在相同的watcher，只有不存在时，才将watcher实例添加到队列中。然后在下一次事件循环（event loop）中，Vue.js会让队列中的watcher触发渲染流程并清空队列。这样就可以保证即便在同一事件循环中有两个状态发生改变，watcher最后也只执行一次渲染流程。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "，", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "异步任务有两种类型：微任务（microtask）和宏任务（macrotask）。不同类型的任务会被分配到不同的任务队列中。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "当执行栈中的所有任务都执行完毕后，会去检查微任务队列中是否有事件存在，如果存在，则会依次执行微任务队列中事件对应的回调，直到为空。然后去宏任务队列中取出一个事件，把对应的回调加入当前执行栈，当执行栈中的所有任务都执行完毕后，检查微任务队列中是否有事件存在。无限重复此过程，就形成了一个无限循环，这个循环就叫作事件循环。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "属于微任务的事件包括但不限于以下几种：● Promise.then● MutationObserver● Object.observe● process.nextTick属于宏任务的事件包括但不限于以下几种：● setTimeout● setInterval● setImmediate", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "● MessageChannel● requestAnimationFrame● I/O● UI交互事件", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "首先，我们知道vm.$nextTick和全局方法Vue.nextTick是相同的，所以nextTick的具体实现并不是在Vue原型上的 $nextTick方法中，而是抽象成了nextTick方法供两个方法共用。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "Vue.js内部有一个列表用来存储vm.$nextTick参数中提供的回调。在一轮事件循环中，vm.$nextTick只会向任务队列添加一个任务，多次使用vm.$nextTick只会将回调添加到回调列表中缓存起来。当任务触发时，依次执行列表中的所有回调并清空列表。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "从执行的角度回顾nextTick的流程。首先，当nextTick被调用时，会将回调函数添加到callbacks中。如果此时是本轮事件循环第一次使用nextTick，那么需要向任务队列中添加任务。因此，我们使用microTimerFunc函数封装Promise.then的作用就是将任务添加到微任务队列中。如果不是本轮事件循环中第一次调用nextTick，也就是说，此时任务队列中已经被添加了一个执行回调列表的任务，那么我们就不需要执行microTimerFunc向任务队列中添加重复的任务，因为被添加到任务队列中的任务只需要执行一次，就可以将本轮事件循环中使用nextTick方法注册的回调都依次执行一遍。图13-1给出了nextTick的内部注册流程和执行流程。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "在Vue.js 2.4版本之前，nextTick方法在任何地方都使用微任务，但是微任务的优先级太高，在某些场景下可能会出现问题。所以Vue.js提供了在特殊场合下可以强制使用宏任务的方法。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "前面我们介绍过几种属于宏任务的事件，Vue.js优先使用setImmediate，但是它存在兼容性问题，只能在IE中使用，所以使用MessageChannel作为备选方案。如果浏览器也不支持MessageChannel，那么最后会使用setTimeout来将回调添加到宏任务队列中。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "官方文档中有这样一句话：如果没有提供回调且在支持Promise的环境中，则返回一个Promise。也就是说，可以这样使用vm.$nextTick：[插图]", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "如果Vue.js实例在实例化时没有收到el选项，则它处于“未挂载”状态，没有关联的DOM元素。我们可以使用vm.$mount手动挂载一个未挂载的实例。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "完整版和只包含运行时版本之间的差异在于是否有编译器，而是否有编译器的差异主要在于vm.$mount方法的表现形式。在只包含运行时的构建版本中，vm.$mount的作用如前面介绍的那样。而在完整的构建版本中，vm.$mount的作用会稍有不同，它首先会检查template或el选项所提供的模板是否已经转换成渲染函数（render函数）。如果没有，则立即进入编译过程，将模板编译成渲染函数，完成之后再进入挂载与渲染的流程中。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "只包含运行时版本的vm.$mount没有编译步骤，它会默认实例上已经存在渲染函数，如果不存在，则会设置一个。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "面的代码对el进行类型判断，如果是字符串，则使用document.querySelector获取DOM元素，如果获取不到，则创建一个空的div元素。如果el的类型不是字符串，那么认为它是元素类型，直接返回el（如果执行vm.$mount方法时没有传递el参数，则返回undefined）。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "首先判断Vue.js实例中是否存在渲染函数，只有不存在时，才会将模板编译成渲染函数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "通过这个条件会发现，如果在实例化Vue.js时给出了render选项，那么template其实是无效的，因为不会进入模板编译的流程，而是直接使用render选项中提供的渲染函数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "结合前面的代码，整体逻辑是，如果用户没有通过template选项设置模板，那么会从el选项中获取HTML字符串当作模板。如果用户提供了template选项，那么需要对它进一步解析，因为这个选项支持很多种使用方式。template选项可以直接设置成字符串模板，也可以设置为以#开头的选择符，还可以设置成DOM元素。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "将模板编译成代码字符串并将代码字符串转换成渲染函数的过程是在compileToFunctions函数中完成的，该函数的内部实现如下：", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "挂载是持续性的，而持续性的关键就在于new Watcher这行代码。我们在第4章中介绍过，Watcher的第二个参数支持函数，并且当它是函数时，会发生很神奇的事情，会同时观察函数中所读取的所有Vue.js实例上的响应式数据。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "函数中读取的所有数据都将被watcher观察。这些数据中的任何一个发生变化时，watcher都将得到通知。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "全局API和实例方法不同，后者是在Vue的原型上挂载方法，也就是在Vue.prototype上挂载方法，而前者是直接在Vue上挂载方法。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "总体来讲，其实就是创建了一个Sub函数并继承了父级。如果直接使用Vue.extend，则Sub继承于Vue构造函数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "安装Vue.js插件。如果插件是一个对象，必须提供install方法。如果插件是一个函数，它会被作为install方法。调用install方法时，会将Vue作为参数传入。install方法被同一个插件多次调用时，插件也只会被安装一次。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "Vue.use的作用是注册插件，此时只需要调用install方法并将Vue作为参数传入即可。但在细节上其实有两部分逻辑需要处理：一部分是插件的类型，可以是install方法，也可以是一个包含install方法的对象；另一部分逻辑是插件只能被安装一次，保证插件列表中不能有重复的插件。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "plugin参数支持对象和函数类型，所以通过判断plugin.install和plugin哪个是函数，即可得知用户使用哪种方式注册的插件，然后执行用户编写的插件并将args作为参数传入。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "最后，将插件添加到installedPlugins中，保证相同的插件不会反复被注册。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "全局注册一个混入（mixin），影响注册之后创建的每个Vue.js实例。插件作者可以使用混入向组件注入自定义行为", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "实例方法是Vue.prototype上的方法，而全局API是Vue.js上的方法。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 13 章 实例方法与全局API的实现原理", "x": "实例方法又分为数据、事件和生命周期这三个类型。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "Vue.js实例的生命周期，可以分为4个阶段：初始化阶段、模板编译阶段、挂载阶段、卸载阶段。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "，在created钩子函数与beforeMount钩子函数之间的阶段是模板编译阶段。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "Vue.js会将其实例挂载到DOM元素上，通俗地讲，就是将模板渲染到指定的DOM元素中。在挂载的过程中，Vue.js会开启Watcher来持续追踪依赖的变化。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "new Vue()被调用时发生了什么", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "当new Vue()被调用时，会首先进行一些初始化操作，然后进入模板编译阶段，最后进入挂载阶段。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "Vue.js通过callHook函数来触发生命周期钩子", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "首先，我们需要理解callHook所实现的功能。callHook的作用是触发用户设置的生命周期钩子，而用户设置的生命周期钩子会在执行new Vue()时通过参数传递给Vue.js。也就是说，可以在Vue.js的构造函数中通过options参数得到用户设置的生命周期钩子。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "provide和inject主要为高阶插件/组件库提供用例，并不推荐直接用于程序代码中。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "我们知道计算属性的结果会被缓存，且只有在计算属性所依赖的响应式属性或者说计算属性的返回值发生变化时才会重新计算。那么，如何知道计算属性的返回值是否发生了变化？这其实是结合Watcher的dirty属性来分辨的：当dirty属性为true时，说明需要重新计算“计算属性”的返回值；当dirty属性为false时，说明计算属性的值并没有变，不需要重新计算。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "计算属性的内部原理", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "这个getter方法被触发时会做两件事。● 计算当前计算属性的值，此时会使用Watcher去观察计算属性中用到的所有其他数据的变化。同时将计算属性的Watcher的dirty属性设置为false，这样再次读取计算属性时将不再重新计算，除非计算属性所依赖的数据发生了变化。● 当计算属性中用到的数据发生变化时，将得到通知从而进行重新渲染操作。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "Vue.js的整体生命周期可以分为4个阶段：初始化阶段、模板编译阶段、挂载阶段和卸载阶段。初始化阶段结束后，会触发created钩子函数。在created钩子函数与beforeMount钩子函数之间的这个阶段是模板编译阶段，这个阶段在不同的构建版本中不一定存在。挂载阶段在beforeMount钩子函数与mounted期间。挂载完毕后，Vue.js处于已挂载阶段。已挂载阶段会持续追踪状态的变化，当数据（状态）发生变化时，Watcher会通知虚拟DOM重新渲染视图。在渲染视图前触发beforeUpdate钩子函数，渲染完毕后触发updated钩子函数。当vm.$destroy被调用时，组件进入卸载阶段。卸载前会触发beforeDestroy钩子函数，卸载后会触发destroyed钩子函数。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 14 章 生命周期", "x": "new Vue()被执行后，Vue.js进入初始化阶段，然后选择性进入模板编译与挂载阶段。在初始化阶段，会分别初始化实例属性、事件、provide/inject以及状态等，其中状态又包含props、methods、data、computed与watch。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "为列表渲染设置属性key", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "key这个特殊属性主要用在Vue.js的虚拟DOM算法中，在对比新旧虚拟节点时辨识虚拟节点。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "在v-if/v-if-else/v-else中使用key", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "路由切换组件不变", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "区分Vuex与props的使用边界", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "避免v-if和v-for一起使用", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "为组件样式设置作用域", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "避免在scoped中使用元素选择器", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "在scoped样式中，类选择器比元素选择器更好，因为大量使用元素选择器是很慢的。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "避免隐性的父子组件通信", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "单文件组件如何命名", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "单文件组件的文件名应该始终是单词首字母大写（PascalCase），或者始终是横线连接的（kebab-case）。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "完整单词的组件名", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "单词首字母大写比横线连接有如下优势。", "y": "", "d": "2021-11-08"}, {"k": "h", "c": "第 17 章 最佳实践", "x": "这里我们遵循每个语言的约定，在JavaScript中更多使用驼峰式命名规则，而在HTML中则是横线连接的方式。", "y": "", "d": "2021-11-08"}]}, {"id": "39546882", "title": "JavaScript悟道", "author": "道格拉斯·克罗克福德", "cats": ["计算机-编程设计"], "bmCount": 36, "rvCount": 0, "notes": [{"k": "h", "c": "第 0 章 导读 ○ ○ ○ ○ ○", "x": "虽然JavaScript表面一团糟，但其内在仍然是美好的。通过避其糟粕，你可以写出出色的JavaScript代码。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 0 章 导读 ○ ○ ○ ○ ○", "x": "做一个谦逊的程序员吧。吾日三省吾身：自身可乎？工作可乎？可有提升乎？", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 0 章 导读 ○ ○ ○ ○ ○", "x": "如果一个特性时而有用，时而是个“坑”，并且有更好的选项，那么我们就应该始终选择那个“更好的选项”。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 1 章 命名 ○ ○ ○ ○ ●", "x": "我其实还有一个诀窍：从不用new。如此一来，我甚至可以再也不用以大写字母开头去命名函数了。我推荐你也这么做，因为这个世界上每天都有成堆使用new的粗鄙代码出现，简直可怕。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 2 章 数值 ○ ○ ○ ● ○", "x": "计算机是操纵数的机器，而且溯其本质，计算机只能操纵数。还别说，它干这类活儿的确是把好手。人类要做的就只是把其他信息映射为数。人类几乎所有的活动都能借助计算机完成。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 2 章 数值 ○ ○ ○ ● ○", "x": "我真心建议你不要拿零做除数，也永远不要使用Object.is()。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 2 章 数值 ○ ○ ○ ● ○", "x": "你说怪不怪？虽然它的含义是“不是一个数”，但是typeof对它的结果又告诉大家NaN是一个数（\"number\"）。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 7 章 数组 ○ ○ ● ● ●", "x": "reduce函数用于将数组的值归约为单个值。它的参数是一个有两个参数的函数。reduce会循环调用这个传入的参数，直到遍历完整个数组。", "y": "", "d": "2021-09-02"}, {"k": "h", "c": "第 8 章 对象 ○ ● ○ ○ ○", "x": "Object.create(prototype)可以将一个已有的对象继承到一个新对象中。该已有对象将作为新对象的原型。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 8 章 对象 ○ ● ○ ○ ○", "x": "我们用原型做得最多的事情就是来存储函数。实际上，JavaScript这门语言本身的各种对象都是这么做的。当我们用对象字面量创建对象的时候，JavaScript默认其继承自Object.prototype。类似地，数组方法继承自Array.prototype；数值类型方法则继承自Number.prototype；字符串方法继承自String.prototype；甚至连函数方法也是继承自Function.prototype的。数组方法和字符串方法都比较有用，而Object.prototype的方法则比较鸡肋。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 8 章 对象 ○ ● ○ ○ ○", "x": "Object.create(null)会创建一个“纯”对象，该对象没有任何继承属性。这样一来，各种继承带来的困惑（如意外继承等）都将不复存在。在这个对象中，只有我们自己明确存进去的属性，并不会有其他多余的内容。事实上，现在的我就非常喜欢用Object.create(null)。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 9 章 字符串 ○ ● ○ ○ ●", "x": "所有字符串在创建出来的时候都被冻结了。也就是说，一旦字符串被生成，你就无法再修改它了。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 9 章 字符串 ○ ● ○ ○ ●", "x": "正则表达式简明扼要却功能强大。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 10 章 底型 ○ ● ○ ● ○", "x": "如果只保留两者之一，程序将更美好。我们虽然不可能改变JavaScript这门编程语言来只留一种底值，但是可以从自身做起，只用一种2。我个人建议淘汰null，只用undefined。2我以前也信奉这条，也是这么去做的。例如callback()约定俗成第一位是err，没有异常的时候我从来都是传undefined，用于对齐生态的偷懒写法是只写一个callback()而不传任何参数。但一个人这么写架不住整个社区都在滥用，尤其是在node_modules这个黑洞出现之后。——译者注", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 10 章 底型 ○ ● ○ ● ○", "x": "为什么我还是建议使用undefined呢？因为JavaScript自身也在用undefined。如果你用let或者var声明一个变量却没有初始化它，这个值就是undefined。这其实很神奇，你定义了一个未定义（undefined）的变量。如果你调用一个函数，却没往其中传入足量的参数，那么那些没有传参数的值就是undefined；如果你访问一个对象中不存在的属性，得到的也是undefined；数组也一样，如果你访问其中不存在的元素，得到的还是undefined。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 10 章 底型 ○ ● ○ ● ○", "x": "null和undefined都可以用全等运算符进行比较。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 10 章 底型 ○ ● ○ ● ○", "x": "你有时候可以看到一些遗留代码中有(typeof my_little_bottom ===\"undefined\")，这也可行。(typeof my_little_bottom === \"null\")则是错误的写法，因为typeof null的值是\"object\"，而不是\"null\"。更糟糕的是，(typeofmy_little_object === \"object\")这种写法在my_little_object的值为null的时候错误地返回true，这就有可能导致一些程序逻辑上的错误。这也是我认为应该避免使用null的原因之一。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 11 章 语句 ○ ● ○ ● ●", "x": "我们可以用对象来代替switch语句。为不同的case在对象中挂载函数，并在函数里实现该case需要运行的逻辑即可。[插图]case_expression会从你的对象中选择对应的函数去执行。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 11 章 语句 ○ ● ○ ● ●", "x": "当我们以纯函数式的风格编写程序时，还有一种更好的写法——三目运算。不过三目运算符也经常被滥用，以至于风评一直不好。我们应当将整个三目运算表达式以括号包围，并在左圆括号之后换行，然后将条件语句以及两个分支对齐书写。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 11 章 语句 ○ ● ○ ● ●", "x": "我个人最喜欢的中断语句是return。它会中断函数的运行，并指定返回值。学校教导我们，一个函数只应该有一个return语句。然而我从未见过任何证据表明这种理论是有益的。我认为更有意义的说法应该是在使用return的时候确信目前应当返回，而不是将所有的返回点集中到一处。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 12 章 函数 ○ ● ● ○ ○", "x": "拥有“外层函数对象所对应的活跃对象引用”的函数对象就被称为闭包（closure）。这是编程语言史上迄今为止最重要的发现。闭包在Scheme语言中被首次使用，然后通过JavaScript成为主流。JavaScript也因它而神奇。离开闭包，JavaScript就没有了灵魂", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 13 章 生成器 ○ ● ● ○ ●", "x": "想想我刚才的话，用更好的实现方式吧！", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 16 章 this ● ○ ○ ○ ○", "x": "原型上的函数如何知道自己在执行的时候应该作用于哪个对象呢？这就要用到this了。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 16 章 this ● ○ ○ ○ ○", "x": "所有变量都是静态绑定的，很棒。this则是动态绑定的，它是由调用者决定的，而不是函数的生产者。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 16 章 this ● ○ ○ ○ ○", "x": "我建议的方案是完全取消this，因为我认为它既没用又会造成问题。如果将this从JavaScript中移除，JavaScript仍是一门图灵完备的语言。所以，我自身已经开始了去this化的编程方式，这样就可以免受其害了。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 16 章 this ● ○ ○ ○ ○", "x": "因此我建议大家遵循去this化的原则。你会发现这是一个明智的决定，生活也会因此变得更加阳光明媚。我并不是要夺走你的this，只是想让你成为一个无忧无虑的程序员。用“类”写代码的程序员终将走向一片凄迷的“代码坟场”。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 17 章 非类实例对象 ● ○ ○ ○ ●", "x": "对象字面量真是JavaScript中的一个绝妙设计，是一种能优雅地表示各种聚合信息的语法。让方法可以接收对象字面量能有效地减少方法数量，提高对象的完整性。所以，我推崇两类对象：● 只包含方法的“硬对象”，它们通过闭包来捍卫私有数据的尊严，具有多态性与封装性；● 只包含数据的“软对象”，它们不具有任何行为，只是一类可以被函数处理的数据集合。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 18 章 尾调用 ● ○ ○ ● ○", "x": "当一个函数做的最后一件事是返回另一个函数的返回结果时，就出现了尾调用。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 18 章 尾调用 ● ○ ○ ● ○", "x": "减少内存分配和垃圾回收的时间非常重要，而且尾调用的优势还不只这些。有了尾调用优化，递归函数就可以跟循环一样快了。这一点很重要，因为循环天生不纯（impure），递归才纯（pure）。有了尾调用优化，递归就克服了它在性能上的缺陷。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 18 章 尾调用 ● ○ ○ ● ○", "x": "这么一来，我们就可以递归到任何深度，而不用担心调用栈溢出或者内存耗尽。书写良好的递归函数可以流畅地运行，所以“正确的尾调用”并不是一项特性，而是对bug的修复。规范之所以要求解释器实现尾调用优化，是因为拥有良好尾调用的程序值得采用它。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 18 章 尾调用 ● ○ ○ ● ○", "x": "try块中不能进行尾调用优化。为了节省内存和时间，尾调用优化不会将新调用的激活对象链接进调用栈。但try则有可能将控制权交给调用该函数作用域的catch，所以激活对象不能被缩减。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 19 章 纯度 ● ○ ○ ● ●", "x": "ECMA无法从JavaScript中移除糟粕，所以其中的糟粕越堆积越多。但从个人出发，我们可以简单地停止使用这些糟粕。我们可以自行添加各种规范来让自己用的JavaScript变纯。只要不使用不纯特性，我们的函数体就不会遭到不纯的侵害。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 19 章 纯度 ● ○ ○ ● ●", "x": "这门语言中的不纯之处吧。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 19 章 纯度 ● ○ ○ ● ●", "x": "尾递归才是最纯的迭代方式。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 22 章 JSON ● ○ ● ● ○", "x": "标准定义属性名需要以引号包裹。因为我并不想把ES3的保留字列表加到标准中来，这看起来太愚蠢了。我可以预见会有人质疑为什么一定要加引号。答案也很简单，因为JavaScript。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第 22 章 JSON ● ○ ● ● ○", "x": "JSON的本意在于让网络上用不同语言编写的程序联立起来。对于程序而言，注释并没有存在的必要，因此它会降低网络的性能。注释是多余且令人讨厌的，所以我后来将其移除了。", "y": "", "d": "2021-09-06"}]}, {"id": "26211831", "title": "Node.js实战（第2版）", "author": "亚历克斯·杨 布拉德利·马克等", "cats": ["计算机-编程设计"], "bmCount": 23, "rvCount": 0, "notes": [{"k": "h", "c": "1.1 一个典型的Node Web应用程序", "x": "Node和JavaScript的优势之一是它们的单线程编程模型。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "1.1 一个典型的Node Web应用程序", "x": "Node中的网络访问是非阻塞的，它用了一个名为libuv的库来访问操作系统的非阻塞网络调用。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "1.1 一个典型的Node Web应用程序", "x": "即便你只有一个单线程、单进程的Node Web应用，它也可以同时处理上千个网站访客发起的连接。要想知道Node是如何做到的，得先研究一下事件轮询。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "1.1 一个典型的Node Web应用程序", "x": "整个过程用了三个非阻塞网络调用：一个用于请求，一个用于数据库，还有一个用于响应。Node是如何调配这些网络操作的呢？答案是事件轮询（event loop）", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "1.4 Node自带的工具", "x": "Node不仅有文件系统库（fs、path）、TCP客户端和服务端库（net）、HTTP库（http和https）和域名解析库（dns），还有一个经常用来写测试的断言库（assert），以及一个用来查询平台信息的操作系统库（os）。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "1.5 三种主流的Node程序", "x": "Electron支持三种主流操作系统，所以你可以在Windows、Linux和macOS上重用这些代码。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "2.1 Node功能的组织及重用", "x": "Node的模块系统避免了对全局作用域的污染，从而也就避免了命名冲突，并简化了代码的重用。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "3.3 添加数据库", "x": "就往Node程序中添加数据库而言，并没有一定之规，但一般会涉及下面几个步骤。(1) 决定想要用的数据库系统。(2) 在npm上看看那些实现了数据库驱动或对象-关系映射（ORM）的热门模块。(3) 用npm --save将模块添加到项目中。(4) 创建模型，封装数据库访问API。(5) 把这些模型添加到Express路由中。", "y": "", "d": "2021-10-22"}, {"k": "h", "c": "4.4 用Webpack构建Web程序", "x": "Webpack插件是用来改变构建过程的行为的。这些行为包括自动将静态资源上传到Amazon S3或去掉输出中重复的文件等。", "y": "", "d": "2021-10-25"}, {"k": "h", "c": "4.4 用Webpack构建Web程序", "x": "与插件相反，加载器是用来转换资源文件的。比如将SASS转换为CSS，或者将ES2015转换为ES5。", "y": "", "d": "2021-10-25"}, {"k": "h", "c": "4.4 用Webpack构建Web程序", "x": "加载器是函数，负责将输入的源文本转换为特定的文本输出。它们既可以是异步的，也可以是同步的。插件是可以挂接到Webpack更底层API的类的实例。", "y": "", "d": "2021-10-25"}, {"k": "h", "c": "4.4 用Webpack构建Web程序", "x": "Webpack的重点完全放在构建打包文件上，所以生成带有CommonJS垫片的打包文件也在它的能力范围之内。打开dist/bundle.js，应该可以看到文件顶部的webpackBootstrap垫片，然后从源文件结构中过来的每个文件都被封装在了闭包内模拟模块系统中。", "y": "", "d": "2021-10-25"}, {"k": "h", "c": "第5章 服务器端框架", "x": "要回答的问题是：如何为给定项目选择最好的框架，每个框架的优缺点是什么。", "y": "", "d": "2021-10-25"}, {"k": "h", "c": "5.2 框架是什么", "x": "Koa就是一个服务器库，它独辟蹊径，用ES2015语法中新创的生成器来定义HTTP中间件。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "6.3 总结", "x": "❑ Connect是一个HTTP框架，可以在处理请求之前和之后堆叠中间件。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "7.1 用模板保持代码的整洁性", "x": "MVC的主要思想是将逻辑、数据和展示层分离。在遵循MVC模式的Web程序中，一般是用户向服务器请求资源，然后控制器向模型请求数据，得到数据后传给视图，再由视图以特定格式将数据呈现给用户。MVC中的视图部分一般会用到某种模板语言。在使用模板时，视图会将模型返回的数据传递给模板引擎，并指定用哪个模板文件展示这些数据。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "7.5 总结", "x": "模板引擎可以把程序逻辑和展示组织好。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "8.1 关系型数据库", "x": "关系型数据库以关系代数和集合论为理论基础，诞生于20世纪70年代。用模式指定各种数据类型的格式和这些数据类型之间的关系。比如说，做社交网络时会有User和Post类型，它们之间还会有一对多的关系。然后用结构化查询语言（SQL）发起数据查询，比如“给我ID为123的用户名下的所有帖子”用SQL表示就是：SELECT ＊ FROM post WHERE user_id=123。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "8.9 键/值存储", "x": "在关系型数据库中，数据一行行地存在表中，每一行都分成预先定义好的列。但键/值存储跟它相反，其把管理数据格式的任务交给了应用程序。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "10.1 安置Node程序", "x": "有了平台即服务（PaaS），程序部署的准备工作基本上就是注册个账号、创建新程序，然后给项目添加一个远程Git地址。把程序推送到那个地址就部署好了。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "10.1 安置Node程序", "x": "为有些东西是PaaS无法提供的，所以我们只能用自己的服务器。不用担心在哪里运行数据库，只要你愿意，可以把PostgreSQL、MySQL，甚至Redis装在同一台服务器上。你想在服务器上装什么就装什么：定制的日志软件、HTTP服务器、缓存层，你的机器你做主。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "10.1 安置Node程序", "x": "软件容器可以看作是将程序的部署自动化的OS虚拟化技术。Docker是其中最著名的项目，它是开源的，但也提供生产程序部署的商业性服务。", "y": "", "d": "2021-10-26"}, {"k": "h", "c": "10.1 安置Node程序", "x": "在拿到一台新机器之后，你只需要在上面装好Docker，然后把程序从库中签出来，就可以运行脚本启动程序了。因为程序有精心定义的部署配方，所以你和你的合作者们很容易理解它在开发环境之外应该如何运行。", "y": "", "d": "2021-10-26"}]}, {"id": "22806945", "title": "你不知道的JavaScript（上卷）", "author": "凯尔辛普森", "cats": ["计算机-编程设计"], "bmCount": 22, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "你们应当像我一样，不满足于只是让代码正常工作，而是想要弄清楚“为什么”。我希望你能勇于挑战这条崎岖颠簸的“少有人走的路”，拥抱整个JavaScript。掌握了这些知识之后，无论什么技术、框架和流行词语你都能轻松理解。", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "第1章 作用域是什么", "x": "需要一套设计良好的规则来存储变量，并且之后可以方便地找到这些变量。这套规则被称为作用域。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.1 编译原理", "x": "在传统编译语言的流程中，程序中的一段源代码在执行之前会经历三个步骤，统称为“编译”。", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "1.1 编译原理", "x": "分词/词法分析（Tokenizing/Lexing）", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "1.1 编译原理", "x": "解析/语法分析（Parsing）", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "1.1 编译原理", "x": "这个过程是将词法单元流（数组）转换成一个由元素逐级嵌套所组成的代表了程序语法结构的树。这个树被称为“抽象语法树”（Abstract Syntax Tree,AST）。", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "1.1 编译原理", "x": "代码生成", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "1.1 编译原理", "x": "将AST转换为可执行代码的过程被称为代码生成。", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "1.1 编译原理", "x": "比起那些编译过程只有三个步骤的语言的编译器，JavaScript引擎要复杂得多。例如，在语法分析和代码生成阶段有特定的步骤来对运行性能进行优化，包括对冗余元素进行优化等。", "y": "", "d": "2021-09-15"}, {"k": "h", "c": "1.1 编译原理", "x": "对于JavaScript来说，大部分情况下编译发生在代码执行前的几微秒", "y": "", "d": "2021-09-15"}, {"k": "h", "c": "1.1 编译原理", "x": "avaScript引擎用尽了各种办法（比如JIT，可以延迟编译甚至实施重编译）来保证性能最佳。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "2.1 词法阶段", "x": "量。但非全局的变量如果被遮蔽了，无论如何都无法被访问到。无论函数在哪里被调用，也无论它如何被调用，它的词法作用域都只由函数被声明时所处的位置决定。", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "2.2 欺骗词法", "x": "eval(..)通常被用来执行动态创建的代码", "y": "", "d": "2021-04-07"}, {"k": "h", "c": "3.2 隐藏内部实现", "x": "最小授权或最小暴露原则", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "3.2 隐藏内部实现", "x": "指在软件设计中，应该最小限度地暴露必要内容，而将其他内容都“隐藏”起来，比如某个模块或对象的API设", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "4.2 编译器再度来袭", "x": "引擎会在解释JavaScript代码之前首先对其进行编译。编译阶段中的一部分工作就是找到所有的声明，并用合适的作用域将它们关联起来。", "y": "", "d": "2021-09-18"}, {"k": "h", "c": "5.2 实质问题", "x": "闭包使得函数可以继续访问定义时的词法作用域。", "y": "", "d": "2021-05-13"}, {"k": "h", "c": "5.3 现在我懂了", "x": "本质上无论何时何地，如果将（访问它们各自词法作用域的）函数当作第一级的值类型并到处传递，你就会看到闭包在这些函数中的应用。在定时器、事件监听器、Ajax请求、跨窗口通信、Web Workers或者任何其他的异步（或者同步）任务中，只要使用了回调函数，实际上就是在使用闭包！", "y": "", "d": "2021-09-18"}, {"k": "h", "c": "1.4 小结", "x": "学习this的第一步是明白this既不指向函数自身也不指向函数的词法作用域，抛开以前错误的假设和理解。this实际上是在函数被调用时发生的绑定，它指向什么完全取决于函数在哪里被调用。", "y": "", "d": "2021-08-26"}, {"k": "h", "c": "3.2 类型", "x": "JavaScript中的函数是“一等公民”，因为它们本质上和普通的对象一样（只是可以调用），所以可以像操作其他对象一样操作函数（比如当作另一个函数的参数）。", "y": "", "d": "2021-09-01"}, {"k": "h", "c": "5.2 “类”", "x": "函数不是构造函数，但是当且仅当使用new时，函数调用会变成“构造函数调用”。", "y": "", "d": "2021-09-01"}, {"k": "h", "c": "5.2 “类”", "x": "Foo.prototype的．constructor属性只是Foo函数在声明时的默认属性。如果你创建了一个新对象并替换了函数默认的．prototype对象引用，那么新对象并不会自动获得．constructor属性。", "y": "", "d": "2021-09-01"}]}, {"id": "34232297", "title": "JavaScript重难点实例精讲", "author": "周雄", "cats": ["计算机-编程设计"], "bmCount": 11, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "我觉得最重要的是打牢基础，善于思考，提高解决问题的能力。", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "前言", "x": "而唯一真正要做的就是多敲代码！多敲代码！多敲代码！——重要的事情说3遍", "y": "", "d": "2021-09-06"}, {"k": "h", "c": "第1章 JavaScript重点概念", "x": "Undefined和Null两种类型的异同", "y": "", "d": "2021-09-07"}, {"k": "h", "c": "第1章 JavaScript重点概念", "x": "无论在什么情况下都没有必要将一个变量显式设置为undefined。如果需要定义某个变量来保存将来要使用的对象，应该将其初始化为null。这样不仅能将null作为空对象指针的惯例，还有助于区分null和undefined。", "y": "", "d": "2021-09-07"}, {"k": "h", "c": "1.2.2 Number类型转换", "x": "map()函数与parseInt()函数的隐形坑", "y": "", "d": "2021-09-07"}, {"k": "h", "c": "1.2.4 浮点型运算", "x": "0.1 + 0.2为什么不是等于0.3，而是等于0.30000000000000004呢？接下来我们一探究竟。", "y": "", "d": "2021-09-07"}, {"k": "h", "c": "1.2.4 浮点型运算", "x": "通过上面详细的讲解，相信大家已经了解了对浮点数进行运算时会存在的问题，那么我们该如何解决呢？", "y": "", "d": "2021-09-07"}, {"k": "h", "c": "3.2.2 arguments对象的性质", "x": "arguments对象的值由实参决定，而不是由定义的形参决定", "y": "", "d": "2021-09-07"}, {"k": "h", "c": "3.6 this使用详解", "x": "在JavaScript中，this指向的永远是函数的调用者。", "y": "", "d": "2021-09-14"}, {"k": "h", "c": "4.4.1 原型对象、构造函数、实例之间的关系", "x": "针对这3个概念我们会有以下3个问题，如果能将这3个问题解决了，也就基本理解了原型对象。", "y": "", "d": "2021-09-09"}, {"k": "h", "c": "7.15 Module", "x": "· CommonJS在运行时完成模块的加载，而ES6模块是在编译时完成模块的加载，效率要更高。· CommonJS模块是对象，而ES6模块可以是任何数据类型，通过export命令指定输出的内容，并通过import命令引入即可。· CommonJS模块会在require加载时完成执行，而ES6的模块是动态引用，只在执行时获取模块中的值。ES6模块核心的内容在于export命令和import命令的使用，两者相辅相成，共同为模块化服务。", "y": "", "d": "2021-09-14"}]}, {"id": "38624751", "title": "JavaScript全栈开发", "author": "凌杰", "cats": ["计算机-编程设计"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 JavaScript简介", "x": "基于原型的、解释型的高级编程语言。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.1 JavaScript的前世今生", "x": "JavaScript的历史开始于1995年", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.1 JavaScript的前世今生", "x": "JavaScript核心部分的实现也被称为ECMAScript", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.2 JavaScript的组成与特性", "x": "动态化类型。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.2 JavaScript的组成与特性", "x": "单线程执行。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.2 JavaScript的组成与特性", "x": "事件驱动。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.2 JavaScript的组成与特性", "x": "异步编程。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.3 JavaScript的适用领域", "x": "一些适合用JavaScript来解决问题的领域。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "1.3 JavaScript的适用领域", "x": "Electron框架的出现让JavaScript可以被用来实现一些适用于事件驱动、异步编程、非阻塞型I/O等特性的轻量级桌面应用。目前流行的VSCode、Atom等代码编辑器都是基于这一框架的JavaScript应用。", "y": "", "d": "2021-09-16"}, {"k": "h", "c": "第一部分 JavaScript核心", "x": "当我们说到JavaScript这个术语时，其实讨论的通常是两部分的内容：第一部分是被ECMAScript标准所规范的这门语言本身；第二部分则是该语言所在的运行环境。", "y": "", "d": "2021-09-16"}]}, {"id": "27337473", "title": "JavaScript设计模式与开发实践", "author": "曾探", "cats": ["计算机-编程设计"], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "1.2 多态", "x": "多态背后的思想是将“做什么”和“谁去做以及怎样去做”分离开来，也就是将“不变的事物”与“可能改变的事物”分离开来。", "y": "", "d": "2022-10-13"}, {"k": "h", "c": "1.2 多态", "x": "在JavaScript这种将函数作为一等对象的语言中，函数本身也是对象，函数用来封装行为并且能够被四处传递。当我们对一些函数发出“调用”的消息时，这些函数会返回不同的执行结果，这是“多态性”的一种体现，也是很多设计模式在JavaScript中可以用高阶函数来代替实现的原因。", "y": "", "d": "2022-10-13"}, {"k": "h", "c": "第4章 单例模式", "x": "单例模式的定义是：保证一个类仅有一个实例，并提供一个访问它的全局访问点。单例模式是一种常用的模式，有一些对象我们往往只需要一个，比如线程池、全局缓存、浏览器中的window对象等。在JavaScript开发中，单例模式的用途同样非常广泛。试想一下，当我们单击登录按钮的时候，页面中会出现一个登录浮窗，而这个登录浮窗是唯一的，无论单击多少次登录按钮，这个浮窗都只会被创建一次，那么这个登录浮窗就适合用单例模式来创建。", "y": "", "d": "2022-10-13"}, {"k": "h", "c": "第5章 策略模式", "x": "策略模式的定义是：定义一系列的算法，把它们一个个封装起来，并且使它们可以相互替换。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "5.1 使用策略模式计算奖金", "x": "可以发现，这段代码十分简单，但是存在着显而易见的缺点。❏ calculateBonus函数比较庞大，包含了很多if-else语句，这些语句需要覆盖所有的逻辑分支。❏ calculateBonus函数缺乏弹性，如果增加了一种新的绩效等级C，或者想把绩效S的奖金系数改为5，那我们必须深入calculateBonus函数的内部实现，这是违反开放-封闭原则的。❏ 算法的复用性差，如果在程序的其他地方需要重用这些计算奖金的算法呢？我们的选择只有复制和粘贴。因此，我们需要重构这段代码。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "5.1 使用策略模式计算奖金", "x": "策略模式指的是定义一系列的算法，把它们一个个封装起来。将不变的部分和变化的部分隔开是每个设计模式的主题，策略模式也不例外，策略模式的目的就是将算法的使用与算法的实现分离开来。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "5.1 使用策略模式计算奖金", "x": "一个基于策略模式的程序至少由两部分组成。第一个部分是一组策略类，策略类封装了具体的算法，并负责具体的计算过程。第二个部分是环境类Context, Context接受客户的请求，随后把请求委托给某一个策略类。要做到这点，说明Context中要维持对某个策略对象的引用。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "5.1 使用策略模式计算奖金", "x": "定义一系列的算法，把它们各自封装成策略类，算法被封装在策略类内部的方法里。在客户对Context发起请求的时候，Context总是把请求委托给这些策略对象中间的某一个进行计算。", "y": "", "d": "2022-10-14"}]}, {"id": "933890", "title": "深入浅出RxJS", "author": "程墨", "cats": ["计算机-编程设计"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "1.4 Reactive Extension", "x": "Reactive Extension，也叫ReactiveX，或者简称Rx，指的是实践响应式编程的一套工具，在Rx官网http://reactivex.io/上，有这样一段介绍文字：An API for asynchronous programming with observable streams.", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "1.4 Reactive Extension", "x": "Rx（包括RxJS）诞生的主要目的虽然是解决异步处理的问题，但并不表示Rx不适合同步的数据处理，实际上，使用RxJS之后大部分代码不需要关心自己是被同步执行还是异步执行，所以处理起来会更加简单。", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "1.6 函数响应式编程的优势", "x": "RxJS这套模型并不是闭门造车臆想出来的概念，这套模型已经被证明很成功，这是因为它具备下面这些特点：❑ 数据流抽象了很多现实问题。❑ 擅长处理异步操作。❑ 把复杂问题分解成简单问题的组合。", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "2.1 RxJS的版本和运行环境", "x": "这种不同倒是带来一个意外之喜，因为这是两个完全不同的npm包，互相不会干扰，所以在一个项目中可以同时安装v4和v5版，同一个源代码文件中可以同时使用v4和v5的API。当然，真正的项目中，应该尽量只使用某一个特定版本的RxJS，使用两个版本的RxJS会导致打包文件更大，混杂两种API的代码也更不容易维护。", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "2.1 RxJS的版本和运行环境", "x": "Tree-Shaking只对import语句导入产生作用，对于CommonJS的require函数导入方式不产生作用，因为Tree-Shaking的工作方式是对代码进行静态分析，import只能出现在代码的第一层，不能出现在if分支中，而且被导入的模块以字符串常量出现，所以import完全可以满足静态分析的需要；而require可以出现在if条件分支中，参数也可以是动态产生的字符串，所以只有在动态执行时才知道require函数如何执行，这样Tree-Shaking也就爱莫能助了。", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "2.2 Observable和Observer", "x": "学习RxJS一定要了解核心概念Observable，每个Observable对象，代表的就是在一段时间范围内发生的一系列事件。", "y": "", "d": "2022-09-13"}, {"k": "h", "c": "2.2 Observable和Observer", "x": "[插图]", "y": "", "d": "2022-09-13"}]}, {"id": "654105", "title": "Nginx高性能Web服务器详解", "author": "苗泽编著", "cats": ["计算机-计算机综合"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "第1章 Nginx初探", "x": "Apache，取自“apatchy server”的读音，意思是充满补丁的服务器。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第1章 Nginx初探", "x": "Apache Web服务器在各种开源的WWW服务提供工具中特性最全，并且运行速度快，性能相对稳定，而且扩展功能丰富。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第1章 Nginx初探", "x": "Nginx服务器以其功能丰富著称于世。它既可以作为HTTP服务器，也可以作为反向代理服务器或者邮件服务器；能够快速响应静态页面（HTML）的请求；支持FastCGI、SSL、Virtual Host、URL Rewrite、HTTP Basic Auth、Gzip等大量使用功能；并且支持更多的第三方功能模块的扩展。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第1章 Nginx初探", "x": "代理服务和反向代理服务是Nginx服务器作为Web服务器的主要功能之一，尤其是反向代理服务，是应用十分广泛的功能。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第1章 Nginx初探", "x": "负载均衡，一般包含两方面的含义。一方面是，将单一的重负载分担到多个网络节点上做并行处理，每个节点处理结束后将结果汇总返回给用户，这样可以大幅提高网络系统的处理能力；第二个方面的含义是，将大量的前端并发访问或数据流量分担到多个后端网络节点上分别处理，这样可以有效减少前端用户等待响应的时间。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第1章 Nginx初探", "x": "Nginx服务器的负载均衡策略可以划分为两大类：即内置策略和扩展策略。内置策略主要包含轮询、加权轮询和IP hash三种；扩展策略主要通过第三方模块实现，种类比较丰富，常见的有url hash、fair等。", "y": "", "d": "2021-11-03"}, {"k": "h", "c": "第1章 Nginx初探", "x": "负载最小怎么判断呢？Nginx通过后端节点对请求的响应时间来判断负载情况。响应时间短的节点负载相对就轻。得出判断结果后，Nginx就将前端请求转发到选中的负载最轻的节点", "y": "", "d": "2021-11-03"}]}, {"id": "26211935", "title": "深入浅出Node.js", "author": "朴灵", "cats": ["计算机-计算机综合"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "第3章 异步I/O", "x": "在众多高级编程语言或运行平台中，将异步作为主要编程方式和设计理念的，Node是首个。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "第3章 异步I/O", "x": "伴随着异步I/O的还有事件驱动和单线程，它们构成Node的基调，Ryan Dahl正是基于这几个因素设计了Node。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "3.1 为什么要异步I/O", "x": "Node在两者之间给出了它的方案：利用单线程，远离多线程死锁、状态同步等问题；利用异步I/O，让单线程远离阻塞，以更好地使用CPU。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "3.1 为什么要异步I/O", "x": "为了弥补单线程无法利用多核CPU的缺点，Node提供了类似前端浏览器中Web Workers的子进程，该子进程可以通过工作进程高效地利用CPU和I/O。", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "3.2 异步I/O实现现状", "x": "“它的优秀之处并非原创，它的原创之处并不优秀”", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "3.4 非I/O的异步API", "x": "红黑树", "y": "", "d": "2021-10-18"}, {"k": "h", "c": "11.6 稳定性", "x": "提及了稳定性。单独一台服务器满足不了业务无限增长的（如果有的话）需求，这就需要将Node按多进程的方式部署到多台机器中。这样如果某台机器出现故障，也能有其余机器为用户提供服务。", "y": "", "d": "2021-10-21"}]}, {"id": "42557145", "title": "Go语言精进之路：从新手到高手的编程思想、方法和技巧1", "author": "白明", "cats": ["计算机-编程设计"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "3.3 原生并发，轻量高效", "x": "Go果断放弃了传统的基于操作系统线程的并发模型，而采用了用户层轻量级线程或者说是类协程（coroutine），Go将之称为goroutine。goroutine占用的资源非常少，Go运行时默认为每个goroutine分配的栈空间仅2KB。goroutine调度的切换也不用陷入（trap）操作系统内核层完成，代价很低。因此，在一个Go程序中可以创建成千上万个并发的goroutine。所有的Go代码都在goroutine中执行，哪怕是Go的运行时代码也不例外。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "3.3 原生并发，轻量高效", "x": "执行单元：goroutine。创建和销毁方式：go+函数调用；函数退出即goroutine退出。并发goroutine的通信：通过语言内置的channel传递消息或实现同步，并通过select实现多路channel的并发控制。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "4.1 语言与思维——来自大师的观点", "x": "不能影响到你的编程思维方式的编程语言不值得学习和使用。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "7.1 简单且一致", "x": "我们看到了大量单字母的标识符命名，这是Go在命名上的一个惯例。一般来说，Go标识符仍以单个单词作为命名首选。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "7.1 简单且一致", "x": "循环和条件变量多采用单个字母命名（具体见上面的统计数据）；函数/方法的参数和返回值变量以单个单词或单个字母为主；由于方法在调用时会绑定类型信息，因此方法的命名以单个单词为主；函数多以多单词的复合词进行命名；类型多以多单词的复合词进行命名。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "7.1 简单且一致", "x": "变量名字中不要带有类型信息", "y": "", "d": "2024-05-27"}]}, {"id": "23914544", "title": "深入浅出 HTTPS：从原理到实战", "author": "虞卫东", "cats": ["计算机-编程设计"], "bmCount": 6, "rvCount": 0, "notes": [{"k": "h", "c": "序1", "x": "2016年苹果公告要求App Store中的所有应用在2017年1月1日之后都必须使用HTTPS加密连接；2017年1月9日微信上线小程序后，要求开发者的所有服务端请求必须为HTTPS；同时Google已调整搜索引擎算法，让采用HTTPS的网站在搜索结果中排名更靠前，并宣布从2018年7月开始所有的HTTP网站将标记为“不安全”。", "y": "", "d": "2022-01-20"}, {"k": "h", "c": "序1", "x": "在HTTP模式下，搜索或访问请求以“明文信息”，经过代理服务器、路由器、WiFi热点、服务运营商等“中间人”通路，这就形成了“中间人”获取数据、篡改数据的可能。", "y": "", "d": "2022-01-20"}, {"k": "h", "c": "序1", "x": "系统从HTTP升级到HTTPS，并不是让Web服务器支持HTTPS协议这么简单，还需要考虑CDN、负载均衡、反向代理等服务器。同时要考虑在何种设备上部署证书及私钥，涉及网络架构和应用架构的变化。这些都需要考虑合理性，尤其要兼顾访问速度与系统安全性。在部署过程中还必须保持业务的连续性，不能中断业务，要稳定地响应用户请求，做好HTTPS和HTTP的过渡和兼容。还要考虑Referer、Cookie等数据如何保持一致，如何避免出现访问故障，复杂度几乎是难以想象的。", "y": "", "d": "2022-01-20"}, {"k": "h", "c": "前言", "x": "《HTTPS权威指南》", "y": "", "d": "2022-01-20"}, {"k": "h", "c": "前言", "x": "HTTPS其实是TLS/SSL的一个最重要的子应用，任何讲解HTTPS的书籍和资料，其实都是在讲解TLS/SSL", "y": "", "d": "2022-01-20"}, {"k": "h", "c": "为什么选择本书", "x": "TLS/SSL是TCP/IP协议族中独立的一个分层协议", "y": "", "d": "2022-01-20"}]}, {"id": "858204", "title": "深入浅出React和Redux", "author": "程墨", "cats": ["计算机-编程设计"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "3.1.1 MVC框架的缺陷", "x": "但是，Facebook的工程部门逐渐发现，对于非常巨大的代码库和庞大的组织，按照他们的原话说就是“MVC真的很快就变得非常复杂”。每当工程师想要增加一个新的功能时，对代码的修改很容易引入新的bug，因为不同模块之间的依赖关系让系统变得“脆弱而且不可预测”。对于刚刚加入团队的新手，更是举步维艰，因为不知道修改代码会造成什么样的后果。如果要保险，就会发现寸步难移；如果放手去干，有可能引发很多bug。", "y": "", "d": "2022-01-04"}, {"k": "h", "c": "3.1.1 MVC框架的缺陷", "x": "在图中，我们可以看到，Model和View之间缠绕着蜘蛛网一样复杂的依赖关系，根据箭头的方向，我们知道有的是Model调用了View，有的是View调用了Model，好乱。", "y": "", "d": "2022-01-04"}, {"k": "h", "c": "3.1.3 Flux的优势", "x": "Flux带来了哪些好处呢？最重要的就是“单向数据流”的管理方式。", "y": "", "d": "2022-01-05"}, {"k": "h", "c": "3.1.3 Flux的优势", "x": "在Flux的理念里，如果要改变界面，必须改变Store中的状态，如果要改变Store中的状态，必须派发一个action对象，这就是规矩。在这个规矩之下，想要追溯一个应用的逻辑就变得非常容易。", "y": "", "d": "2022-01-05"}, {"k": "h", "c": "3.2.4 组件Context", "x": "所以，单纯来看React的这个Context功能的话，必须强调这个功能要谨慎使用，只有对那些每个组件都可能使用，但是中间组件又可能不使用的对象才有必要使用Context，千万不要滥用。", "y": "", "d": "2022-01-05"}]}, {"id": "31594821", "title": "深入解析CSS", "author": "基思·J.格兰特", "cats": ["计算机-计算机综合"], "bmCount": 5, "rvCount": 0, "notes": [{"k": "h", "c": "8.1 移动优先", "x": "然后给按钮的：:after伪元素加上一个Unicode字符（\\2261）作为内容。这个字符是一个数学符号，由三条横线组成，即汉堡包菜单。", "y": "", "d": "2021-12-06"}, {"k": "h", "c": "9.3 把模块组合成更大的结构", "x": "当我们需要使用并（或者和）来描述模块职责的时候，思考一下是不是在描述两种（甚至更多的）职责", "y": "", "d": "2021-12-06"}, {"k": "h", "c": "9.3 把模块组合成更大的结构", "x": "这是模块封装的一个非常重要的原则，我们把它叫作单一职责原则（Single Responsibility Principle）。尽可能把多种功能分散到不同的模块中，这样每个模块就可以保持精炼、聚焦，并且容易理解。", "y": "", "d": "2021-12-06"}, {"k": "h", "c": "12.1 对比最重要", "x": "最", "y": "", "d": "2021-12-06"}, {"k": "h", "c": "12.1 对比最重要", "x": "对比是设计中的一种手段，通过突出某物来达到吸引注意力的目的。我们的眼睛和思维天生对模式比较敏感，一旦某种东西破坏了模式的整体效果，我们就自然而然地注意到了它。", "y": "", "d": "2021-12-06"}]}, {"id": "22486199", "title": "云彩收集者手册", "author": "加文·普雷特-平尼", "cats": ["科学技术-科学科普"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "序言", "x": "在晴朗的天气，抬头看天是一件非常有趣的事情，晚上可以看星，白天可以看云。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "序言", "x": "收集各种各样的云是很有意思的事情", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "如何收集云彩", "x": "收集东西并不等于要拥有它。你甚至也不用去想如何抓住它。你要做的，只是去看，去记录。", "y": "", "d": "2021-01-13"}, {"k": "h", "c": "如何收集云彩", "x": "云彩体现了我们周围这个世界的变幻无常。就像拉尔夫 · 沃尔多 · 爱默生写的那样，“自然是一朵多变的云，始终一样，却又从不一样”。", "y": "", "d": "2021-01-13"}]}, {"id": "26793752", "title": "React进阶之路", "author": "徐超", "cats": ["计算机-编程设计"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "1.1 React简介", "x": "React另辟蹊径，通过引入虚拟DOM、状态、单向数据流等设计理念，形成以组件为核心，用组件搭建UI的开发模式，理顺了UI的开发过程，完美地将数据、组件状态和UI映射到一起，极大地提高了开发大型Web应用的效率。", "y": "", "d": "2021-12-22"}, {"k": "h", "c": "2.2 组件", "x": "在开发React应用时，一定要先认真思考哪些组件应该设计成有状态组件，哪些组件应该设计成无状态组件。并且，应该尽可能多地使用无状态组件，无状态组件不用关心状态的变化，只聚焦于UI的展示，因而更容易被复用。", "y": "", "d": "2021-12-22"}, {"k": "h", "c": "2.2 组件", "x": "有状态组件主要关注处理状态变化的业务逻辑，无状态组件主要关注组件UI的渲染。", "y": "", "d": "2021-12-22"}]}, {"id": "25872051", "title": "React+Redux前端开发实战", "author": "徐顺发", "cats": ["计算机-编程设计"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "4.2.2 Redux的使用场景", "x": "Dan Abramov说过“只有遇到React实在解决不了的问题，你才需要Redux。”", "y": "", "d": "2022-04-08"}, {"k": "h", "c": "4.2.2 Redux的使用场景", "x": "上面场景可以总结为：这类应用是多交互、多数据源的！", "y": "", "d": "2022-04-08"}]}, {"id": "35971867", "title": "React+Node.js开发实战：从入门到项目上线", "author": "袁林 尹皓 陈宁", "cats": ["计算机-编程设计"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第2篇 打包部署和项目开发实战", "x": "对于基于React开发的前端应用来说，将其部署到线上生产服务器的流程如下：（1）使用Webpack进行打包。（2）部署静态资源服务器。（3）配置域名DNS解析。", "y": "", "d": "2021-12-29"}, {"k": "h", "c": "第2篇 打包部署和项目开发实战", "x": "对于基于Node开发的后端应用来说，将其部署到线上生产服务器的流程如下：（1）使用进程管理工具启动服务。（2）使用Nginx做反向代理，并配置CORS跨域。（3）配置域名DNS解析。", "y": "", "d": "2021-12-29"}]}, {"id": "3300069919", "title": "代码整洁之道：程序员的职业素养", "author": "[美]罗伯特 C. 马丁", "cats": ["计算机-计算机综合"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "译者序1：享受职业素养", "x": "因为素养强调的并不是天赋的神秘，也不是技艺的高深，而是持续积淀的结晶", "y": "", "d": "2021-12-06"}, {"k": "h", "c": "第1章 专业主义", "x": "“专业主义”就意味着担当责任。", "y": "", "d": "2021-12-06"}]}, {"id": "32517945", "title": "HTTP/2 in Action 中文版", "author": "Barry Pollard", "cats": ["计算机-理论知识"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "1.1 万维网的原理", "x": "1.1.2 打开网页时会发生什么", "y": "", "d": "2021-09-14"}, {"k": "h", "c": "9.1 TCP的低效率因素，以及HTTP", "x": "[插图]", "y": "", "d": "2021-09-15"}]}, {"id": "31486649", "title": "联邦学习", "author": "杨强 刘洋 程勇 康焱 陈天健 于涵", "cats": ["计算机-人工智能"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "6.2 联邦迁移学习的分类与定义", "x": "对于横向联邦学习，可以通过最小化参与方样本之间的最大平均差异（Maximum Mean Discrepancy，MMD）[254]来学习共同的表征空间。", "y": "", "d": "2020-07-11"}, {"k": "h", "c": "6.2 联邦迁移学习的分类与定义", "x": "横向联邦学习本身就是一种基于模型的联邦迁移学习。因为在每个通信回合中，各参与方会协同训练一个全局模型（基于所有数据），并且各参与方把该全局模型作为初始模型进行微调（基于本地数据）[12]。", "y": "", "d": "2020-07-11"}]}, {"id": "3300055557", "title": "极限黑客攻防：CTF赛题揭秘", "author": "天融信阿尔法实验室", "cats": ["计算机-计算机综合"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "1.9 综合渗透", "x": "[插图]", "y": "", "d": "2024-06-30"}]}, {"id": "30179184", "title": "操作系统导论", "author": "雷姆兹·H.阿帕希杜塞尔 安德莉亚·C.阿帕希杜塞尔", "cats": ["计算机-计算机综合"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第2章 操作系统介绍", "x": "操作系统将物理（physical）资源（如处理器、内存或磁盘）转换为更通用、更强大且更易于使用的虚拟形式。因此，我们有时将操作系统称为虚拟机（virtual machine）。", "y": "", "d": "2024-03-18"}]}, {"id": "3300025096", "title": "前端跨界开发指南：JavaScript工具库原理解析与实战", "author": "史文强", "cats": ["计算机-计算机综合"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第3章 ESLint：你的代码里藏着你的优雅", "x": "一天，我路过一座桥，碰巧看见一个人想跳河自杀。我跑过去对他大喊道：“别跳，别死啊。”“为什么不让我跳？”他说。“因为还有很多东西值得我们活下去啊。”“有吗？比如说？”“呃……你做什么工作？”“程序员。”我说：“我也是！瞧，有共同点了吧。你是软件还是硬件？”“软件。”“我也是！PC还是移动？”“PC。”“我也是！Vue还是React？”“Vue。”“我也是！那你用Vscode还是Sublime？”“Vscode。”“我也是。缩进用Tab还是空格？”“Tab。”“你这个另类！”我一把将他推下桥去。", "y": "", "d": "2023-08-22"}]}, {"id": "34336683", "title": "JavaScript高级程序设计（第4版）", "author": "马特·弗里斯比", "cats": ["计算机-编程设计"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "3.4 数据类型", "x": "Number()函数基于如下规则执行转换。❑ 布尔值，true转换为1，false转换为0。❑ 数值，直接返回。❑ null，返回0。❑ undefined，返回NaN。❑ 字符串，应用以下规则。", "y": "", "d": "2021-12-11"}]}, {"id": "22806967", "title": "未来世界的幸存者", "author": "阮一峰", "cats": ["计算机-计算机综合"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "软件工程师的职业建议", "x": "你要想通，这一切并不重要。有人提交了烂代码，网站下线了，又怎么样？工作并不是你的整个生活。它们不是真正的问题，只是工作上的问题。真正重要的事情都发生在工作以外。我回到家，家里人正在等我，这才重要啊。\n \n从此，他就把工作和生活分开了，只把它当作“工作问题”看待。这样一来，对工作就总能心平气和，与人交流也更顺利了。\n自己找到道路", "y": "", "d": "2021-11-09"}]}, {"id": "31732769", "title": "JavaScript语言精髓与编程实践（第3版）", "author": "周爱民", "cats": ["计算机-编程设计"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "3.2 JavaScript的原型继承", "x": "原型继承的实质是“复制”", "y": "", "d": "2021-09-15"}]}, {"id": "22692265", "title": "JavaScript忍者秘籍（第2版）", "author": "John Resig", "cats": ["计算机-编程设计"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第4章 函数进阶：理解函数调用", "x": "[插图]", "y": "", "d": "2021-09-01"}]}, {"id": "22806928", "title": "你不知道的JavaScript（中卷）", "author": "凯尔·辛普森", "cats": ["计算机-编程设计"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第一部分 类型和语法", "x": "这些工具库之所以功能强大，正是因为它们的开发者理解这门语言的本质和优点，并将它们运用到了极致。", "y": "", "d": "2021-08-30"}]}, {"id": "25462658", "title": "Vue.js快跑：构建触手可及的高性能Web应用", "author": "卡勒姆·麦克雷", "cats": ["计算机-编程设计"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "译者序", "x": "如果没有深厚的编程功底以及设计能力，想要优雅地使用React会存在一些障碍；而对于Angular来说，对于个人开发者和中小型的应用又略显得“重”了，学习曲线也比较陡峭。但Vue对于个人开发者和中小型应用更友好，学习曲线也是渐进性的，非常适合用来入门和学习MVVM框架中所涉及的通用知识和开发理念。\n说到底，JavaScript是一门特殊的语言，自诞生二十几年来，不断被赋予更多的责任，谓之为移动互联网浪潮的支柱之一不足为过。而在前端开发领域中，从jQuery的插件化开发，到模块化和组件化；从刀耕火种的“蛮荒时代”，到愈加完善的工程化时代；前端开发的质量和效率有了飞跃式的提升，对前端开发从业者的职业素养要求也不断提高。", "y": "", "d": "2021-03-15"}]}]}, {"key": "07_医学健康与生活美学", "name": "医学健康与生活美学", "books": [{"id": "40055613", "title": "曲黎敏精讲《黄帝内经》（套装4册）", "author": "曲黎敏", "cats": ["医学健康-健康", "医学健康-医学"], "bmCount": 136, "rvCount": 0, "notes": [{"k": "h", "c": "一 昔在黄帝，生而神灵", "x": "养生大道有一句话，叫“忧喜不留于意”。小孩的情绪像天空一样，说变就变，一会儿晴了，一会儿下雨了，小孩的情绪只有“当下”，没有持续。\n我们所有大人最大的问题是什么？情绪的偏与执，“偏”，是不守正道，比如，小喜怡人，大喜伤身；小小的忧伤会给生命带来沉静，而大忧伤、大焦虑，则伤害生命。“执”，是持续，是固守，是淤滞。把“偏”与“执”放到生命里，人就会得病。", "y": "", "d": "2023-11-14"}, {"k": "h", "c": "二 法于阴阳，和于术数", "x": "如果阴历的十五、十六赶上经期，这说明你身体绝佳，之所以叫“月经”，就说明这事跟月亮的潮汐有关。满月之时来月经的人才叫身体好，月黑风高夜你来月经了，身体就不太好。", "y": "", "d": "2023-11-14"}, {"k": "h", "c": "二 法于阴阳，和于术数", "x": "我们现代人追求的是什么？就是心里当下痛快就行了，就叫作“务快其心”。生命是一条长长的线，而不是一段一段的。我们现在只求一段一段的快乐，不知何为终极的快乐。最终的快乐一定是一种稳定的快乐，也就是“法喜悠然”。所谓“法喜”，就是不再“心随境转”。所谓心随境转，就是看见下雨了，心就悲伤；天晴了，心就喜悦。而是要“境随心转”，无论看见什么，都保持内心的稳定，温度是恒定的，色彩是协调的，心境是澄净的……", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "二 法于阴阳，和于术数", "x": "“法于阴阳，和于术数”，是《黄帝内经》一书的纲领，通篇都在讲这八个字。也就是——人生，既要符合天道，又得有具体方法；既要有天地阴阳的丰富多彩，又要有落地的平凡的生活。然后，你才能得到气血的柔和、身心的平静，以及时时刻刻的吉祥。", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "三 何谓“朴”", "x": "“妄”是什么呢？从甲骨文里面讲，亡、女，就是逃跑的女人，逃跑的女奴，亡就是走失了，这个女人逃亡了，就是“妄”。在远古时代，最狂妄和胆大妄为的事就是女人居然跑了，这是男权文明无法容忍的事情，你怎么敢跑？在男人的眼里只要是逃跑的女人都是属于胆大妄为，属于非法的，所以都是属于胡来，一定要被抓回来。\n被抓回来的女人，又用哪个字表现呢？是“妥”，上面是手爪的“爪”，下面是“女”，即抓住了女人，为“妥”。你不是跑吗？抓住你就妥妥的了。\n所以你看中国社会是怎么对待女人，就是裹小脚，让你跑不了。男人可以四处游走，但女人不行。", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "三 何谓“朴”", "x": "妄”就是胡来，就是迷失的女人。天底下迷失的女人其实是最糟糕的，我同意逃跑的女人，我不同意迷失的女人，女人一旦迷失是挺糟糕的，但是你可以逃跑。知道中国第一个逃跑的女人是谁吗？是嫦娥。嫦娥是第一个离丈夫远去的，而且一逃就逃到月亮上，就是宁守千年之孤独，我也不跟你玩了。你们现在天天纠缠跟男人这个那个，你跟嫦娥比一比，跟人家学学，要不然，就守在家里，要不然，就像嫦娥似的跑得远远的，让男的根本就找不着，或抓不回来。", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "三 何谓“朴”", "x": "人心惟危，道心惟微。”事情只有到了危险临近时，人才会惊醒、恐慌、害怕。此时，事，必有不可救；命，也有不可拯。而圣人的心，看蛛丝马迹，看曲水微澜，看云卷云舒之无常，故，不立危墙，不惹尘埃烦扰，悠然常在。“惟精惟一，允执厥中。”人心在于适可而止，道心却是中庸常在。所以说修行，首先是要有一颗警惕的、安稳的心。\n人呢，不怕形劳，就怕心倦。在阳光下伺候花草，人的心不会倦，因为那些生命可以滋补你。愉快，心就不倦。心不倦，气就顺，这就是“气从以顺”。顺，是我们中国人最喜欢的生活状态。“顺”字有“页”部，指的是头。所以“顺”，首先要头脑清楚，精神愉悦，怎么才能愉悦呢？关键在于下面两句：“各从其欲，皆得所愿。”各从其什么欲，各得什么愿？圣人怕你不懂，就在下面特地举了例子：“故美其食，任其服，乐其俗，高下不相慕，其民故曰朴。”", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "三 何谓“朴”", "x": "高下不相慕”。人间所有的错误都在于：以他人之食为美，总想穿更高级的官服，以他人之俗为乐。于是，人性就乱了，人性大多数都在反本性，而只有生命是尊崇本性的，比如心脏不羡慕大肠，大肠也不羡慕心肺，各受各的累，各享各的福。", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "三 何谓“朴”", "x": "“朴”是生命的本真，“实”就是让本真落地。不朴实就是增添生命的复杂性，就是较劲，谁较劲谁难受。脏腑顺应本性，就各有其乐。心以疏布为乐，所以到目前为止，只有心不生癌，因为它的本性就是散，而癌的本性是凝聚。肝以生发为乐，知道肝的生发力有多强吗？肝被切掉一部分的话，还会自己长出来。肺以肃降为乐，肺气沉不下去就会得病。脾以运化为乐，肾以收藏为乐，肾有点傻，见东西就藏，但再好的东西你也得吸收，吸收不了就得病，所以脾土克肾水，能消化吸收，肾才有“精”可藏。", "y": "", "d": "2023-11-15"}, {"k": "h", "c": "五 男八", "x": "肝经的保养，主要在于情绪的中庸，不急不躁，不怨不怒，温柔和平，才是最重要的。", "y": "", "d": "2023-11-16"}, {"k": "h", "c": "六 天寿", "x": "所以气血不怕明耗，为什么？耗尽了就歇着，就怕暗耗，所谓暗耗肾精就是“想”，所以大家别忘了，“想”这件事，太可怕了。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "六 天寿", "x": "“想”这件事可怕在哪儿？用中医的话来说，一句话，思伤脾，你看有的男孩精瘦精瘦的，你就知道他思伤脾，暗耗就是“痴”，痴念不断。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "七 真人、至人、圣人、贤人", "x": "女子命本，在肝在血", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "七 真人、至人、圣人、贤人", "x": "阴阳和平之人，居处安静，无为惧惧，无为欣欣，婉然从物，或与不争，与时变化，尊则谦谦，谭而不治，是谓至治。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "七 真人、至人、圣人、贤人", "x": "“无为惧惧，无为欣欣”——不惧怕，也不狂喜，在一个通透的人眼里，这世界有什么可怕的呢，又有什么可狂喜的呢？在世界的本来面目里，保持微笑和悠然是多么重要和高级的品质啊。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "七 真人、至人、圣人、贤人", "x": "什么是“婉然从物”呢？好比“水”，你拿一个圆盘子来，这水放到里面就是圆的，拿一个方碗来，水就是方的，这，就是婉然从物。我永远是我，但我不跟环境较劲，什么环境我都能适应，这不就是“和光同尘”吗？别总指望改变环境，保持自我的本性的始终如一，才是最主要的。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "七 真人、至人、圣人、贤人", "x": "婉然从物”比“随遇而安”的境界要高，一个是主动，一个是被动。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "七 真人、至人、圣人、贤人", "x": "形容阴阳平和之人的最后一句是：“尊则谦谦，谭而不治，是谓至治。”\n这是说这种人虽然很尊贵，脸上有威仪，但内心一定要谦虚。从来不摆架子，没什么架子好摆，这世界离了谁都行。“谭而不治”，谭是深，通“水潭”，这句是说，这种人总是深邃而不乱，对事物不干预，只静观，这就是最高的境界。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "下篇 四气调神大论", "x": "在中医里，肝对应木性，肝的运动方式就是“曲直”，如果一味地生发，里面则缺乏营养，里面就是空的，就是“肝阳上亢”，人就会头晕。所以，所有的成长，都应该是攒着劲儿往上长的。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "下篇 四气调神大论", "x": "水的润，在于温。不是水能润你，而是水产生的气才能润你。泡在冷水里，人就润不了，只有温润之气才能让你毛窍全开。在中医里，水对应肾，肾在我们人体的最下部，肾水像《易经》之坎水，坎卦是上下两个阴爻，中间一根阳爻，阴爻代表水，阳爻则代表真阳之气，所以坎卦的真正意义是外阴而内阳，没有阳气的鼓荡，水就没有灵性。肾水若一直“下”，人就特别容易腿肿脚肿，但生命的本性是不允许这种病态的，改变这种病态的就是水的温润之性。水温润，则上行，人就不会腿肿脚肿。小孩阳气在腿脚，所以小孩没有这毛病。人老了，阳气不足，且阳气全在上面保护五脏，所以就顾不得下面，就会出现腿脚肿胀。还有一句话就是“男怕穿靴、女怕戴帽”，是说男人阳气一旦不足了，就固摄不住水的下流，生命就会出危险。女怕戴帽，是说女子阴重，一旦阴邪上侵“诸阳之会”的头部，也就危险了。这就是为什么女子怕脸肿、头肿，男子怕腿肿、脚肿的原因。我们懂得了这些医学常识，才能照顾父母，否则就是瞎忙。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "下篇 四气调神大论", "x": "人生不过“气血”二字。你太过，是你收不住；不及，是你提不起来。只有恰到好处，才是生命的最好状态，就这么简单。", "y": "", "d": "2023-11-17"}, {"k": "h", "c": "一 春三月", "x": "子时，半夜11点到次日1点，胆经当令，主生发。", "y": "", "d": "2023-11-18"}, {"k": "h", "c": "一 春三月", "x": "1点到3点是丑时，肝经当令，肝主藏血，人体要发挥“肝藏血”的功能就得睡觉。肝主目，闭眼即养肝，深睡则养魂，不睡则魂飞。3点到5点是寅时，肺经当令，此时失眠则魄散，也就是说，子时丑时不睡，伤阳；寅时不睡，伤阴。肺主肃降，肺为相傅之官，此时开始重新分配全身气血，如果这时候你哪个器官醒着，哪个器官就会多耗气血。深睡则得滋养多，不眠则大伤身体。", "y": "", "d": "2023-11-18"}, {"k": "h", "c": "一 春三月", "x": "5点到7点是卯时，大肠经当令， 5点以后醒来是没有什么问题的", "y": "", "d": "2023-11-18"}, {"k": "h", "c": "二 夏三月", "x": "灸中脘呢，可以治疗中焦一切病，比如腹胀、气喘、隔噎、食不下、食不化、胃疼、脸色差（因为胃经主要走脸部）、肚子疼，甚至癫痫等症，都可以灸中脘。因为中脘属任脉，又是足阳明胃经的募穴，又是八会穴之一（腑会中脘，也就是六腑的病根都在中脘），所以这个穴位可以治疗一切脾胃病，髌骨软化症（胃经走膝盖），重灸中脘穴，可以快速恢复脾胃的功能。", "y": "", "d": "2023-11-18"}, {"k": "h", "c": "三 秋三月", "x": "当归生姜羊肉汤的材料为：当归150克，生姜250克，羊肉500克。此汤温经补血，温中止痛，又可祛寒。", "y": "", "d": "2023-11-19"}, {"k": "h", "c": "四 冬三月",
