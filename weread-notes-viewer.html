  <style>

      padding: 9px 18px;

    }

  <script>
    const DATA = [{"key": "01_散文游记与非虚构", "name": "散文游记与非虚构", "books": [{"id": "37700262", "title": "反与正·婚礼集·夏天集（郭宏安译加缪文集）", "author": "[法]阿尔贝·加缪", "cats": ["文学-散文杂著"], "bmCount": 64, "rvCount": 0, "notes": [{"k": "h", "c": "反与正", "x": "这样，每一个艺术家便在他的内心深处保留着唯一的一眼泉水，在其一生中滋润着他之所是和他之所说。", "y": "", "d": "2025-04-16"}, {"k": "h", "c": "反与正", "x": "我的泉水在《反与正》之中，在这个交织着贫穷和光明的世界之中", "y": "", "d": "2025-04-16"}, {"k": "h", "c": "反与正", "x": "贫穷对我来说从来就不是一种不幸：光明在其中播撒着它的财富。甚至我的反抗也被照亮了。", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "反与正", "x": "为了打破一种自然的冷漠，我被置于苦难和阳光之间。苦难使我不能认为阳光下和历史中一切都是好的，阳光告诉我历史并不就是一切。改变生活，是的，但是不要改变赋予我神性的世界。", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "反与正", "x": "我生活在窘迫之中，但也生活在某种快乐之中。", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "反与正", "x": "大海和阳光不费分文。障碍反倒在于偏见或愚蠢。", "y": "", "d": "2025-03-30"}, {"k": "h", "c": "反与正", "x": "免除嫉妒，我首先要归功于我的亲人，他们几乎什么都缺，却几乎什么也不羡慕。这个家庭甚至不识字，它以沉默、谨慎、自然而朴素的骄傲给了我最高的教诲，我毕生受用不尽", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "反与正", "x": "我自己忙于感觉，无暇梦及其他", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "反与正", "x": "我什么也不羡慕，这是我的权利", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "反与正", "x": "在我身上，我所说的慈悲还是叫冷漠为好。", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "反与正", "x": "我爱的人永远比我好，比我高大。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "反与正", "x": "我所经历的贫穷从未教会我怨恨，相反，它教会了我某种忠诚和无言的坚忍。如果有一天我忘记了这些，只能怪我自己或我的缺点，而不能怪我生于斯的世界。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "反与正", "x": "对于生活本身，我所知道的不会多于《反与正》笨拙地说出的东西。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "反与正", "x": "说到底，这就是生活，无论是好还是坏。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "反与正", "x": "常常是我以为前进了，可实际上后退了。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "反与正", "x": "在某个阿尔及尔的早晨，我总是带着轻微的醉意往前走着。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "讥讽", "x": "但是他认为成为别人的负担总比死强。这一点只证明了一件事情：显然他还从未成为任何人的负担。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "讥讽", "x": "他又孤独了。没有人听他说话：人老了，这才是可怕的。人们迫使他沉默、孤独。人们让他知道他很快就要死了。而一个要死的老人是没有用的，甚至是碍手碍脚的，潜伏着危险的。让他走吧。如果不走，就让他沉默，这是最大的敬重了。他是痛苦的，因为他不能不想到老而不说话。于是，他站起身来，对周围每一个人都报以微笑。但是他遇到的每每是冷漠的面孔，或者因快乐而抽动的面孔，而这种快乐他是没有权利参与的。", "y": "", "d": "2025-02-21"}, {"k": "h", "c": "讥讽", "x": "人是建构在未来的衰老之上的。对于这个无可救药的衰老，", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "讥讽", "x": "人皆有一死，但每个人的死不同。无论如何，太阳还是温暖着我们。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "世界对着我叹息，节奏悠长，带给我对于一切不死之物的冷漠和平静。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "在贫穷中有孤独，一种给每一件事物以价值的孤独。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "天空本身和布满星星的夜似乎是一种自然的财富。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "一个人痛苦着，接二连三地经受不幸。他承受了，在他的命运中安顿下来。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "每当我似乎感觉到这世界的深刻的意义的时候，总是它的简单震撼了我。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "我感觉到的不是对于更好的日子的希望，而是对一切和对我本人的一种宁静的、原始的冷漠。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "是与否之间", "x": "是的，一切都是简单的。是人把事情弄复杂了。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "灵魂中的死亡", "x": "我在这里没有任何修饰。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "灵魂中的死亡", "x": "这种内在的寂静陪伴着我，生出了缓慢的步伐，从一天到另一天。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "灵魂中的死亡", "x": "我还要什么呢？我面前有整个的天空和回旋的日子，我似乎可以不断地跟随着它，一动不动地跟着它回旋。我呼吸着我所能有的唯一的幸福—一种专注的、友好的意识。", "y": "", "d": "2025-02-25"}, {"k": "h", "c": "反与正", "x": "这就足够了：只一缕微露的光亮，我的心头就充满了一种模糊的、使人昏昏然的快乐。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "反与正", "x": "使我面对世界的反面", "y": "", "d": "2025-04-13"}, {"k": "h", "c": "反与正", "x": "我是谁？我能做什么？我只能投入这枝叶和阳光的游戏之中。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "反与正", "x": "让我从时间之布上剪下这一分钟吧", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "反与正", "x": "我以我所有的姿态眷恋着世界，我以我所有的怜悯和感激眷恋着人", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "蒂巴萨的婚礼", "x": "微风是清凉的，天空是蔚蓝的。我无保留地爱这生命", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "蒂巴萨的婚礼", "x": "人们常常对我说：没有什么可骄傲的。不，确有可以骄傲的东西：这阳光，这大海，我的洋溢着青春的心，我的满是盐味儿的身体，还有那温情和光荣在黄色和蓝色中相会的广阔的背景。我必须运用我的力量和才能来获取的正是这一切。这里的一切都使我完整无损，我什么也不抛弃，我任何假面也不戴，我只需耐心地学习那困难的生活本领，这抵得上所有那些生活艺术。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "蒂巴萨的婚礼", "x": "我的心中涌起一种奇特的快乐，就是那种产生于良心安宁的快乐。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "蒂巴萨的婚礼", "x": "于是，我们又感到了孤独，然而是在满足之中。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "蒂巴萨的婚礼", "x": "大海、原野、寂静、土地的芬芳，我周身充满着香气四溢的生命，我咬住了世界的这枚金色的果子，心潮澎湃，感到它那甜而浓的汁液顺着嘴唇流淌。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "蒂巴萨的婚礼", "x": "我不算什么，世界也不算什么，重要的仅仅是使我们之间产生爱情的那种和谐与寂静", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "杰米拉[18]的风", "x": "通过皮肤来辨认世界的文字的", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "杰米拉[18]的风", "x": "人是怀着几个熟悉的观念活着的。两个或三个吧。碰到人和事，就打磨之，改变之。要有一个确属自己的、可以谈谈的观念，非十年不行。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "阿尔及尔的夏天", "x": "敏感的人拥有感性的财富", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "阿尔及尔的夏天", "x": "人们很年轻就结婚。工作很早，十年就穷尽了一生的经验。一个三十岁的工人就把一辈子的牌打光了。他守着老婆和孩子等着生命的结束。他的幸福是短暂的、无情的。他的生命也是一样。", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "夏天集", "x": "太阳、轻轻的风、白色的阿福花、强烈地蓝的天空，一切都让人想到夏天", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "夏天集", "x": "夏天的每一个早晨都好像是世界上第一个早晨。所有的晚霞都好像是最后一个", "y": "", "d": "2025-03-22"}, {"k": "h", "c": "巴旦杏树", "x": "征服者有时也难免伤感。虚妄的荣耀何其多也，总要付出些代价。", "y": "", "d": "2025-03-31"}, {"k": "h", "c": "普罗米修斯在地狱", "x": "实际上，今天的人乃是一种以大得出奇的群体在这片土地的狭窄表面上受苦的人，没有火，没有食物，自由在他只是一种可以等待的奢侈；对于这个人来说，问题只在于受的苦更多些，正如对自由及其最后的见证来说，问题只能是消失得更快些。", "y": "", "d": "2025-03-31"}, {"k": "h", "c": "普罗米修斯在地狱", "x": "使人的痛苦的心灵与世界的春天达成和解。", "y": "", "d": "2025-04-01"}, {"k": "h", "c": "没有过去的城市之小指南", "x": "阿尔及尔的温柔挺意大利的。", "y": "", "d": "2025-04-01"}, {"k": "h", "c": "没有过去的城市之小指南", "x": "阿尔及尔有长长的大道，直通大海；应该晚上到那儿去散步。", "y": "", "d": "2025-04-01"}, {"k": "h", "c": "没有过去的城市之小指南", "x": "我建议敏感的游客，如果他去阿尔及尔，到海港的拱顶下去喝茴香酒，早晨去渔场吃刚打上来、在煤炭炉子上烤熟的鱼；到竖琴街上的小咖啡馆去听阿拉伯音乐，我忘了小咖啡馆的名字", "y": "", "d": "2025-04-01"}, {"k": "h", "c": "没有过去的城市之小指南", "x": "关于阿尔及利亚，我永远可以用力按这根内心之弦，它在我的内心与之呼应，我也知道这首盲目而沉重的歌。", "y": "", "d": "2025-04-01"}, {"k": "h", "c": "没有过去的城市之小指南", "x": "千万个孤独从人群中升起", "y": "", "d": "2025-04-01"}, {"k": "h", "c": "谜", "x": "我生于这种光明，几千年来，人类通过这种光明学会了哪怕在痛苦中也欢呼生命", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "五天来，阿尔及尔一直下雨，最后竟连大海也打湿了。下不完的大雨，厚得发黏，从仿佛永不干涸的天空的高处，朝着海湾扑下来。大海像一块灰色的、柔软的海绵，在迷茫的海湾里隆起。但是，在持续的雨中，水面看起来似乎并不动；只是远远地有一种不易察觉的、宽阔的鼓荡，在海上掀起一片朦胧的水汽，朝着被围在湿漉漉的林阴道之中的港口漫去。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "十二月的阿尔及尔，对于我仍然是一座夏天的城市。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "睁着眼睛躺在繁星密布的天空下", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "那时候，我是在生活。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "一个水淋淋的清晨从纯净的海上升起，光彩照人。天空像眼睛一样新鲜，被水洗了又洗，露出最细最疏的经纬，从那儿射下一道颤动的光，给了每幢屋、每棵树一个鲜明的轮廓、一种令人赞叹的新奇。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "必须在自己身上保留一种新鲜和一股快乐的源泉", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "重返蒂巴萨", "x": "在隆冬，我终于知道，我身上有一个不可战胜的夏天。", "y": "", "d": "2025-04-12"}, {"k": "h", "c": "贴近大海", "x": "月亮升起来了。它首先稍微照亮了水面，继续上升，然后写在柔软的水上，最后到了中天，照亮了整整一道海水，像是水量丰沛的牛奶河，在黑暗的大洋中，伴随着船向我们不断地倾泻。这就是一个忠诚的夜、清凉的夜，我称之为喧闹光明中的烧酒，汹涌的欲望。", "y": "", "d": "2025-04-12"}]}, {"id": "26797704", "title": "一间只属于自己的房间（果麦经典）", "author": "[英]弗吉尼亚·伍尔夫", "cats": ["文学-散文杂著"], "bmCount": 46, "rvCount": 1, "notes": [{"k": "h", "c": "1", "x": "她必须拥有两样东西，一样是金钱，另一样是一间自己的房间。", "y": "", "d": "2025-02-28"}, {"k": "h", "c": "1", "x": "在任何一个极具争议的话题上，谁也不要指望自己的观点能够抵达真理，而性别就是这样一个话题。我们能做的只有去表达", "y": "", "d": "2025-02-28"}, {"k": "h", "c": "1", "x": "女性与小说，是一个会引起各种偏见和激愤的话题", "y": "", "d": "2025-02-28"}, {"k": "h", "c": "1", "x": "如果这世上真有宁静的心绪，那它一定存在于一个晴好的10月早上", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "2", "x": "一想到那么多妇女年复一年的工作，却连两千英镑都很难攒下，一想到学校的创办人费这么大的劲才筹到三万英镑，让人忍不住嘲讽一番，我们这个性别的人活该如此贫穷，太不应该了。我们的母亲不去给我们挣钱，都在忙活些什么？忙着往脸上擦粉？看商店橱窗？在蒙特卡洛的阳光下花枝招展？", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "2", "x": "如果她去做生意，经营一家人造丝厂，或者当个证券大亨，如果她能给芬汉姆学院留下二三十万英镑，我们今天晚上就能舒舒服服地坐着，谈论考古学、植物学、人类学、物理、原子的性质、数学、天文、相对论和地理。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "2", "x": "我们有机会去探索，去写作；我们可以去圣地游荡；可以坐在帕特农神庙的台阶上沉思；可以上午10点钟才到办公室，下午4点半就舒舒服服地回家写点小诗。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "2", "x": "要想有钱资助学校，就注定顾不上家庭。一边抚养十三个孩子一边挣大钱——这根本没人能做到。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "2", "x": "首先，生孩子要怀胎九个月。孩子生下来后，哺乳期又要耽误三或四个月。孩子大点之后，当然还要付出五年时间陪孩子玩。", "y": "", "d": "2025-03-01"}, {"k": "h", "c": "1", "x": "有学识但无偏见的人", "y": "", "d": "2025-03-03"}, {"k": "h", "c": "2", "x": "对于一位要征服、要统治的大家长来说，想象世界上一半的人天生比自己劣等是一件有重要意义的事。这种想法一定是他力量的主要来源之一", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "发现一份稳定的收入竟然能给人的心境带来这么大的变化。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "世界上没有任何力量可以夺走我手中的五百英镑。我将永远拥有食物、房子和衣物。我不需要付出精力和苦力，心中的憎恨和痛苦也消失了", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "我不恨任何男人，反正他们无法伤害我；我不用取悦任何男人，反正他们无法给我什么。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "完全否定某个阶级或性别都是一件很荒唐的事情。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "可每年五百英镑就足够一个人在阳光下活得好好的。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "意识到这些问题之后，我的恐惧和酸楚就化为了怜悯和宽容，又过了一两年，怜悯和宽容也消失了，我获得了一种最大的解脱，那是客观看待事物的自由。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "弥尔顿建议女人寻找一位高大威猛的绅士，用永恒的爱慕换来自己的归宿。而我不用这么做，因为我姑姑的遗产为我开辟了一片广阔的新天地。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "1", "x": "于是，一种诡异的混合体诞生了。在人们的想象中，她地位极高；而在实际生活中，她根本微不足道。她的身影遍布诗歌的字里行间，却在历史中缺席。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "1", "x": "莎士比亚这样的天才，不会从没受过教育的、被奴役的劳动人民中诞生，不会从撒克逊人和布立吞人中诞生，不会从现在的工人阶级中诞生。", "y": "", "d": "2025-03-04"}, {"k": "h", "c": "2", "x": "这种物质上的难处已经很难克服，但更可怕的是无形之物。济慈、福楼拜和那些男性天才无法忍受的冷漠，到了女性身上，全都变成了敌意。世界对男人们说，你们爱写就写，我无所谓，但却对女性发出一串大笑：写作？你写作有什么好处？", "y": "", "d": "2025-03-06"}, {"k": "h", "c": "1", "x": "因为女性从此拥有思想的自由，随着时间的推移，她们还将拥有想写什么就写什么的自由。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "人总得行动；即使找不到方向，也得自己创造。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "那个时代整个女性群体的缺憾", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "反复告诫——你得这么写，你得那么想。那些声音喋喋不休，时而怨声载道，时而居高临下，时而盛气凌人，时而悲痛，时而震惊，时而愤怒，时而和蔼，让女性没有片刻安宁", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "男作家能给我们带来很多乐趣，但不能给我们提供任何帮助。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "请大家注意，对将来的女性来说，物质条件至关重要。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "如果女性像男性一样写作，像男性一样生活，甚至长得也和男性一样，那更是一万个可惜，因为世界那么大那么丰富，两种性别都有不完善的地方，只剩一种性别怎么行呢？我们的教育难道不是应该凸显和强化两个性别的不同，而不是相似之处吗？", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "世界上有那么多新的事等待她去发现，她不用把自己禁锢在中上流家庭的大房子里。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "这一切都等着你去探索，攥紧你手中的火炬，首先照亮自己的灵魂，发现其中的深刻与肤浅、虚荣与慷慨，认清自己的意义，无论你美或平凡。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "对她来说，男性不再是“敌人”；她不再浪费自己的时间责骂他们；她不用爬上屋顶，渴望旅行、经验、了解世界和人，不再因为得不到这些而烦扰。恐惧和憎恨几乎消散，它们留下的痕迹之上，显露出一种自由看待异性的快乐", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "我对她说，如果停下来咒骂，你就输了；停下来笑，也是一样。如果你犹豫，慌乱，你就完蛋了。我央求她，只管跳你的", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "轻盈得像只鸟儿", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "1", "x": "显然，这是因为对于两种性别来说，和睦相处才是自然的状态。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "1", "x": "拥有一颗滋润、教养良好和自由的心灵，未遭遇挫折和反对，一生下来就享有充分的自由，可以朝任何自己喜欢的方向发展，这种感觉太幸福了。所有这些都令人羡慕", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "1", "x": "我们这个时代里，普鲁斯特是完全雌雄同体的，或者说女性气质稍多", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "1", "x": "因为任何带有意识偏见的文字都注定消亡。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "写自己想写的东西", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "请大家去写各种各样的书，不管书的主题多大或多小，都不要犹豫。我希望，大家无论通过什么方法，都能挣到足够的钱，去旅行，去闲着，去思考世界的过去和未来，去看书做梦，去街角闲逛，让思绪的钓线深深沉入街流之中。", "y": "", "d": "2025-03-07"}, {"k": "t", "c": "2", "x": "请大家去写各种各样的书，不管书的主题多大或多小，都不要犹豫。我希望，大家无论通过什么方法，都能挣到足够的钱，去旅行，去闲着，去思考世界的过去和未来，去看书做梦，去街角闲逛，让思绪的钓线深深沉入街流之中。", "y": "好！谢谢弗吉尼亚女士～ 👌", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "它照亮了房间里的一群人，铭刻下某些平常的话语", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "读这些书，就像给感官做一台奇妙的除障手术，让人变得更敏锐；就像揭去世界的遮罩，让生命变得更强烈", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "因此，我让你们去挣钱、去拥有一间自己的房间，就是让你们去面对现实，那种生活一定充满了活力", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "请大家一定记住自己的责任，要努力提高自己，追求精神世界", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "我想说的很简单、很平淡：没有什么比做自己更重要。如果我能把话说得更漂亮，我要说，别做梦了，人不能影响其他人。要思考事物本身。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "我相信，这位从未写下一字、葬在十字路口的诗人还活着。她活在你我之中，活在许多其他女性心中，她们今晚不在这儿，而是在刷洗碗筷、哄孩子睡觉。", "y": "", "d": "2025-03-07"}, {"k": "h", "c": "2", "x": "等我们有了一年五百英镑和自己的房间；等我们养成了自由的习惯，勇于写下自己心中所想；等我们稍微逃离公用的起居室，学会通过人与人之间的关系，而不是人与现实的关系看人；等我们学会从事物本身看天、看树、看一切；等我们越过弥尔顿的亡灵，再也没有人能遮挡我们的视线；等我们面对现实，因为这就是现实，我们没有臂膀可以依靠，只能自己前进，我们的关系不仅仅是男人和女人之间的关系，而是人和真实世界的关系，等到那时机会就来了，莎士比亚死去的诗人妹妹就会唤醒她沉睡的躯壳。她会像他哥哥那样，从默默无闻的先驱者的生命中汲取力量，然后重生。", "y": "", "d": "2025-03-07"}]}, {"id": "244004", "title": "冬牧场（阿勒泰冬季游牧生活与真实旷野）", "author": "李娟", "cats": ["文学-散文杂著"], "bmCount": 39, "rvCount": 0, "notes": [{"k": "h", "c": "二 三天的行程", "x": "太阳未出时，全世界都像一个梦，唯有月亮是真实的；太阳出来后，全世界都真实了，唯有月亮像一个梦。", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "二 三天的行程", "x": "一个人牵着驼队，孤独、微弱地走在沙漠中。整面大地空空荡荡，天似穹庐，唯一的云停在天空正中央。那是一团台阶状的梯云。前后无人，四顾茫茫……那感觉既非凄凉也非激越，说不出的怅然，又沉静。千百年来，有多少牧人们以同样的心情孤独地经过同一片大地啊。", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "二 三天的行程", "x": "长达半年的冬季以及土地的贫瘠，使哈萨克人的祖先不得不选择了“游牧”这种艰辛动荡的生产生活方式，年复一年恪守自然的规律在大地上穿梭。", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "四 冬牧场", "x": "走在这样的大地中央，才感觉到地球真的是圆的——我们甚至可以看到大地真的在往四面八方微微下沉", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "四 冬牧场", "x": "而现实中更多的却是荒凉和贫瘠，寂寞和无助。现实中，大家还是得年复一年地服从自然的意志，南北折返不已。", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "四 冬牧场", "x": "春天接羔，夏天催膘，秋天配种，冬天孕育。羊的一生是牧人的一年", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "四 冬牧场", "x": "我这样一个软弱单薄的人，有什么可依赖的呢？", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "四 冬牧场", "x": "进入荒野，当你微弱得只剩呼吸时，感到什么也无法填满眼前的空旷与阔大时，就只好唱起歌来。只好用歌声去放大自己的气息，用歌声去占据广阔的安静。", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "四 冬牧场", "x": "这是荒野，什么样的挫折都得接受，什么样的灾难都得吞咽。", "y": "", "d": "2024-03-10"}, {"k": "h", "c": "五 地下的家", "x": "曾经作为孩子的夏衣玛尔旦已经长大了吧？他的家庭远离了羊群，他也永远离开了冬窝子。他把这个曾经珍爱过的家抛弃在了沙漠深处。他的丰茂拥挤的童年，他的强盛有力的成长，他的浓墨重彩的欢喜悲伤……全无踪影。只剩这两行汉字。歪歪扭扭，仍富于希望。", "y": "", "d": "2024-03-13"}, {"k": "h", "c": "六 冬宰", "x": "那么羊听到了吗？羊谅解了吗？这是一个被宰杀者看着长大的生命。宰杀它的人，曾亲手把它从春牧场上的胎盘旁拾起，小心装进准备已久的温暖的毡袋，再小心系在马鞍后带回家……宰杀它的人，曾漫山遍野带着它四处寻找最茂盛多汁的青草，当它迷路时，冒着雨把它找回……曾一次又一次给它抹灭虱的药水，处理发炎的伤口……寒冷季节到来之前，领它去往开阔暖和的南方旷野……这些羊都记得吗？宰杀它的人，又有什么仇恨和恶意呢？大约生命的事情就是这样的吧：终究各归其途，只要安心就好。", "y": "", "d": "2024-03-14"}, {"k": "h", "c": "六 冬宰", "x": "我喜欢的哈萨克作家叶尔克西姐姐的文章里提到过宰羊之前的一些巴塔。她翻译如下：你不因有罪而死，我们不为挨饿而生。", "y": "", "d": "2024-03-14"}, {"k": "h", "c": "八 冷", "x": "无论如何，寒冷的日子总是意味着寒冷的“正在过去”。我们生活在四季的正常运行之中——这寒冷并不是晴天霹雳，不是莫名天灾，不是不知尽头的黑暗。它是这个行星的命运，是万物已然接受的规则。鸟儿远走高飞，虫蛹深眠大地。其他留在大地上的，无不备下厚实的皮毛和脂肪。连我不是也啰里八嗦围裹了重重物什吗？寒冷痛苦不堪。寒冷却理所应当。寒冷可以抵抗。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "八 冷", "x": "差不多每年的十二月下旬到一月中旬总会是冬天里最难熬的日子，无可躲避。再往后，随着白昼的变长，气温总会渐渐缓过来。一切总会过去的。是的，“一切总会过去”。人之所以能够感到“幸福”，不是因为生活得舒适，而是因为生活得有希望。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "九 羊的冬天", "x": "牧人的冬天艰辛寂寞，羊的冬天同样漫长难捱。从十二月到次年三四月间，每一天，每一个清晨，羊群准时出发，在荒野中四处徘徊，寻食枯草。羊群刚刚离开的空羊圈尚存羊久卧后的余温，潮湿而温热，在冷空气中蒸腾着白茫茫的水汽。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "九 羊的冬天", "x": "羊的生命多么微弱痛苦。羊的灾难那么多：长途跋涉，寒冷，饥饿，病痛……但千百年来，羊还是生存了下来。我们看到的情景大多是羊群充满希望地经过大地。就不说那些痛苦了——那是生命的必经之途吧。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "九 羊的冬天", "x": "羊多像植物！在春天里生发，夏天里繁茂，在秋天留下种子，又以整个冬天收藏着这枚种子，孕育、等待", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "九 羊的冬天", "x": "寂静温暖的夜里，我们吃饭、聊天，它在一米远处“刷刷刷”地尿尿。相安无事，其乐融融。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "十 加玛苏鲁", "x": "加玛的嗓音虽然不是很明亮，却真挚动人，唱出的旋律婉转又惆怅。我默默听着。炉火闪烁在她的脸庞上，她的身体消融在黑暗中。青春多么美好，却再无人看到。", "y": "", "d": "2024-03-24"}, {"k": "h", "c": "十四 梅花猫和熊猫狗", "x": "生命远比所看到、所了解的更结实，更顽强。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "十四 梅花猫和熊猫狗", "x": "为了让它们在夜里更警觉地听到羊群里的动静，牧人往往会在狗很小的时候削去它们的耳朵。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "十四 梅花猫和熊猫狗", "x": "能活多久呢？人不也是这样的吗？付出生的努力就是了。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "十六 荒野漫步", "x": "我开始观察经过这片大地的所有痕迹。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "十六 荒野漫步", "x": "捧起沙子在夕阳中仔细观察的话，却发现沙粒们其实大都是半透明的粉色和黄色。", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "十六 荒野漫步", "x": "实在着迷于在这样的大地上无穷无尽地走动", "y": "", "d": "2024-05-27"}, {"k": "h", "c": "十九 热合买得罕和努儿赛拉西", "x": "小伙子回来后，见妹妹馋成那个德行，只吃了一小半就全让给了她，令她欢呼。看她吃得那么高兴，又做出不屑的样子。", "y": "", "d": "2024-05-28"}, {"k": "h", "c": "二十二 暮色中", "x": "天上是深蓝的星空，地上是洁白的星空。", "y": "", "d": "2024-05-30"}, {"k": "h", "c": "二十四 食物", "x": "食物的力量所支撑起来的，肯定不只是肠胃的享受。刺激着旺盛食欲的，也肯定不只是生活的单调。大约所有敞露野外的生命都是如此吧。", "y": "", "d": "2024-06-05"}, {"k": "h", "c": "二十四 食物", "x": "若是在城市里，若是在人群中，当生活陷入绝境时，还能伸手乞讨，还能在垃圾箱里翻找弃物。在那里，人永远都有最低限度的生存保障，永远都有无数活下去的机会——在那些地方，“活下去”并不是最重要的事，最重要的事是“活得更好一些”。可荒野不。在荒野里，人需得抛弃多余的欲望，向动物靠拢，向植物靠拢。荒野没有侥幸，没有一丝额外之物。", "y": "", "d": "2024-06-05"}, {"k": "h", "c": "二十八 最大的宁静", "x": "这是沙漠之中，然而无论条件再艰辛再局促，也不能委屈死者。他披星戴月、风吹雨淋，一生穿梭在这大地上，南北奔波。后来他死了，从此再也不用搬家了，再也不用转场了。他永远停止了在此处，此处才是他真正的家，一辈子的家，永远的栖身地……为这个永别的人营造最后的住所，则是他悲痛的亲人们所能为他做的最后一件事，所以，要极尽全力来经营。", "y": "", "d": "2024-06-06"}, {"k": "h", "c": "二十九 雪灾之年", "x": "不管怎样，我们都感激着这个平安的冬天", "y": "", "d": "2024-06-06"}, {"k": "h", "c": "三十 我在体验什么", "x": "那时的我只想全情投入眼下的生活。只在尴尬和冷清的失意时分，我才会取出那本子，记录不久前发生过的欢乐和惊奇。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "三十 我在体验什么", "x": "我还在看，还在马不停蹄地发现和见证。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "三十一 迅速消失的一切", "x": "但又怎能说大家不爱惜物品呢？衣物总是补了又补，鞋子没有一双不曾打过补丁。穿坏的衣服就剪开，拼补成大块布料，缝成结实的大包搬家时使用，或给骆驼做外套。或裁成条儿，编成结实的绳子。鲜艳颜色的衣服则剪出花样子缝进花毡。衣服的碎片也剪成均匀的小布块，再细细拼成斑斓又结实的一整幅百衲布，用来缝制坐垫或布袋……总之，一件衣服被淘汰后还要在这个家中存在很长时间，才一点点消散。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "三十一 迅速消失的一切", "x": "我发现，牧业上的孩子，小的时候总是显得比实际年龄小；一旦长大了，又总显得比实际年龄大。如此缓慢的成长，如此迅速的衰老。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "三十一 迅速消失的一切", "x": "但是，草畜平衡，这是牧业生产的一个基本道理，也是牧人们自觉恪守的古老准则。是哪里出了问题？是什么导致失控？……想来想去，大约是我们每一个人的心最先失控了。每一个人，每一个在餐桌上吃半份羊肉剩半份羊肉的贪婪又狂妄的人。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "三十五 回家的路", "x": "我笑而不语，心里却终于滋生离别的惆怅。", "y": "", "d": "2024-06-13"}, {"k": "h", "c": "后记", "x": "正是在那里，我积累了一些新鲜而复杂的体会", "y": "", "d": "2024-06-13"}, {"k": "h", "c": "后记", "x": "每到心浮气躁的时候，总算还有磐石镇放胸间，总算不至迷惘。", "y": "", "d": "2024-06-13"}]}, {"id": "840919", "title": "傅雷家书", "author": "傅雷 朱梅馥 傅聪", "cats": ["文学-散文杂著"], "bmCount": 37, "rvCount": 0, "notes": [{"k": "h", "c": "第二通", "x": "他是一片海洋，他也是无边无际的天空", "y": "", "d": "2021-04-24"}, {"k": "h", "c": "一九五四年", "x": "人生的关是过不完的，等到过得差不多的时候，又要离开世界了。", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "这幸福不知应当向谁感谢，即使我没宗教信仰，至此也不由得要谢谢上帝了！", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "虽是我们将来在一起的时候不会多，但是凭了回忆，宝贵的回忆，我也会破涕而笑了。", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "今天是除夕了，想到你在远方用功，努力，我心里说不尽的欢喜。别了，孩子，我在心里拥抱你！", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "但若你缺少勇气的时候，尽管来信告诉我，我可以替你打气。倘若你心绪不好，也老老实实和我谈谈，我可以安慰安慰你，代你解决一些或大或小的烦恼。", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "人生没有一桩幸福不要付代价的。东边占了便宜，西边就得吃亏些", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "爱情的苦汁早尝，壮年中年时代可以比较冷静。古语说得好，塞翁失马，未始非福。", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "一个又一个的筋斗栽过去，只要爬得起来，一定会逐渐攀上高峰，超脱在小我之上。辛酸的眼泪是培养你心灵的酒浆。不经历尖锐的痛苦的人，不会有深厚博大的同情心。", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "无论如何要克制，以前途为重，以健康为重。在外好好利用时间，不但要利用时间来工作，还要利用时间来休息", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "人一辈子都在高潮低潮中浮沉", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "人家拉你出去，你事后要补足功课，这个对你精力是有妨碍的。还是以练琴的理由，多推辞几次吧。要不紧张，就不宜于太忙；宁可空下来自己静静的想想，念一两首诗玩味一下。切勿一味重情，不好意思。工作时间不跟人出去，做成了习惯，也不会得罪人的。人生精力有限，谁都只有二十四小时；", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五四年", "x": "这是你一生之中的黄金时代，希望你好好的享受、体验，给你一辈子做个最精彩的回忆的底子！眼看自己一天天的长大成熟，进步，了解的东西一天天的加多，精神领域一天天的加阔，胸襟一天天的宽大，感情一天天的丰满深刻：这不是人生最美满的幸福是什么！这不是最隽永最迷人的诗歌是什么！孩子，你好福气！", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五五年", "x": "不要在已经觉得疲倦的时候再force [勉强]自己。多留一分元气，在长里看还是占便宜的。尤其在比赛以前半个月，工作时间要减少一些，最要紧的是保养身心的新鲜，元气充沛，那么你的演奏也一定会更丰满，更fresh [清新]！", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五五年", "x": "成就的大小、高低，是不在我们掌握之内的，一半靠人力，一半靠天赋，但只要坚强，就不怕失败，不怕挫折，不怕打击——不管是人事上的，生活上的，技术上的，学习上的——打击；从此以后你可以孤军奋斗了。何况事实上有多少良师益友在周围帮助你，扶掖你。还加上古今的名著，时时刻刻给你精神上的养料！孩子，从今以后，你永远不会孤独的了，即使孤独也不怕的了！", "y": "", "d": "2021-04-25"}, {"k": "h", "c": "一九五六年", "x": "以后即使心情有波动，工作可不能松弛。", "y": "", "d": "2021-04-27"}, {"k": "h", "c": "一九五六年", "x": "你跟我两人的思想和感情，不正是我自己的思想和感情吗？清清楚楚的，我跟你的讨论与争辩，常常就是我跟自己的讨论与争辩。父子之间能有这种境界，也是人生莫大的幸福", "y": "", "d": "2021-04-27"}, {"k": "h", "c": "一九五六年", "x": "尽管人生那么无情，我们本人还是应当把自己尽量改好，少给人一些痛苦，多给人一些快乐", "y": "", "d": "2021-04-28"}, {"k": "h", "c": "一九五七年", "x": "自己先要锻炼得坚强，才不会被环境中的消极因素往下拖，才有剩余的精力对朋友们喊“加油加油”", "y": "", "d": "2021-04-28"}, {"k": "h", "c": "一九五七年", "x": "万一有什么低潮来，想想你的爸爸举着他一双瘦长的手臂远远的在支撑你；", "y": "", "d": "2021-04-28"}, {"k": "h", "c": "一九六〇年", "x": "多多锻炼你的意志吧。", "y": "", "d": "2021-04-30"}, {"k": "h", "c": "一九六〇年", "x": "对终身伴侣的要求，正如对人生一切的要求一样不能太苛。事情总有正反两面：追得你太迫切了，你觉得负担重；追得不紧了，又觉得不够热烈。温柔的人有时会显得懦弱，刚强了又近乎专制。幻想多了未免不切实际，能干的管家太太又觉得俗气。只有长处没有短处的人在哪儿呢？世界上究竟有没有十全十美的人或事物呢？抚躬自问，自己又完美到什么程度呢？这一类的问题想必你考虑过不止一次。我觉得最主要的还是本质的善良，天性的温厚，开阔的胸襟。有了这三样，其他都可以逐渐培养；而且有了这三样，将来即使遇到大大小小的风波也不致变成悲剧。", "y": "", "d": "2021-05-07"}, {"k": "h", "c": "一九六〇年", "x": "只有平静、含蓄、温和的感情方能持久", "y": "", "d": "2021-05-07"}, {"k": "h", "c": "一九六〇年", "x": "人需要不时跳出自我的牢笼，才能有新的感觉、新的看法，也能有更正确的自我批评。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六〇年", "x": "节约时间，挤出时间来！要不工作，就痛快休息，切勿拖拖拉拉在日常猥琐之事上浪费光阴。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六〇年", "x": "生活要过得体面而省俭；要小心而勿小气；慷慨而勿易于上当；享受生活乐趣，但切勿为满足一时欲望而过分奢侈，即使当时觉得这种欲念不可或缺也罢", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六一年", "x": "使自己的思想松弛平静下来，并且大量减少内心的冲突。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六一年", "x": "我猜想最可能是因为时常郁郁寡欢的缘故。为了抵制这种倾向，你最好少沉浸在自己内心的理想及幻想中，多生活在外在的世界里。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六一年", "x": "人没有苦闷，没有矛盾，就不会进步。有矛盾才会逼你解决矛盾，解决一次矛盾即往前迈进一步。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六一年", "x": "我认为生活越紧张越需要这一类的调剂，多亲近大自然倒是维持身心平衡最好的办法。近代人的大病即在于拼命损害了一种机能（或一切机能）去发展某一种机能，造成许多畸形与病态。我不断劝你去郊外散步，也是此意。幸而你东西奔走的路上还能常常接触高山峻岭，海洋流水，日出日落，月色星光，无形中更新你的感觉，解除你的疲劳。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六一年", "x": "终日在琐碎家务与世俗应对中过生活的人，也该时时到野外去洗掉一些尘俗气，别让这尘俗气积聚日久成为宿垢。", "y": "", "d": "2021-05-08"}, {"k": "h", "c": "一九六一年", "x": "人的发展总是波浪式的，和自然界一样：低潮之后还有高潮再起的可能，峰回路转，也许“柳暗花明又一村”，又来一个新天地呢！所以古人说对人要“盖棺论定”。", "y": "", "d": "2021-05-13"}, {"k": "h", "c": "一九六一年", "x": "现在弥拉还年轻，有幻想，有热情，多少应该满足她活跃的青春的梦，偶尔看看电影，上博物馆，陶醉在过去的历史的成果中，欣赏体会；周末去郊外或公园散步闲游，吸收自然界的美，要过这种有计划有调节的生活，人生才有意思。", "y": "", "d": "2021-05-13"}, {"k": "h", "c": "一九六三年", "x": "对文学艺术的热爱并未稍减，只是常有一种“废然而返”“怅然若失”的心情。也许是中国人气质太重，尤其是所谓“洒脱”与“超然物外”的消极精神影响了我，也许是童年的阴影与家庭历史的惨痛经验无形中在我心坎里扎了根，年纪越大越容易人格分化，好像不时会置身于另外一个星球来看尘世，也好像自己随时随地会失去知觉，化为物质的元素。天文与地质的宇宙观常常盘踞在我脑子里，像服尔德某些短篇所写的那种境界，使我对现实多多少少带着detached [超然]的态度。可是在工作上，日常生活上，斤斤较量的认真还是老样子，正好和上述的心情相反——可以说人格分化；", "y": "", "d": "2021-05-16"}, {"k": "h", "c": "一九六三年", "x": "历史上受莫名其妙的指摘的人不知有多少，连伽利略、服尔德、巴尔扎克辈都不免，何况区区我辈！主要还是以君子之心度人，作为借鉴之助，对自己只有好处。老话说得好：是非自有公论，日子久了自然会黑白分明！", "y": "", "d": "2021-05-16"}, {"k": "h", "c": "一九六四年", "x": "孩子的名字，我们俩常在商量，因为今年是龙年，就根据龙的特性来想，前两星期去新城隍庙看看花草，有一种叫凌霄的花，据周朝桢先生说，此花开在初夏，色带火黄，非常艳丽，我们就买了一棵回来，后来我灵机一动，“凌霄”作为男孩子的名字不是很好么？声音也好听，意义有高翔的意思；传说龙在云中，那么女孩子叫“凌云”再贴切没有了，我们就这么决定了。", "y": "", "d": "2021-05-16"}, {"k": "h", "c": "一九六四年", "x": "一点不想是不负责任，当然不好；想得过分也徒然自苦，问题是彻底考虑一番，下决心把每个阶段的事情做好，想好办法实行就是了。", "y": "", "d": "2021-05-16"}]}, {"id": "845307", "title": "一个孤独漫步者的遐想（果麦经典）", "author": "[法]卢梭", "cats": ["文学-散文杂著"], "bmCount": 31, "rvCount": 0, "notes": [{"k": "h", "c": "导读", "x": "这样的卢梭，不会再因命运的大起大落而大悲大喜。他变得坦然而平静，无论是回首往事还是审视当下，都能够以一种冷静而不冷漠的心境泰然处之。", "y": "", "d": "2024-04-16"}, {"k": "h", "c": "导读", "x": "无比坦诚地表达了自己的遗憾：“我被创造出来，是为了度过一生，然而现在还没有真正活过就即将死去。”", "y": "", "d": "2024-04-16"}, {"k": "h", "c": "导读", "x": "这一生中的每一天，都是用来体验和生活的，而不是用来等闲虚度的。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "导读", "x": "在这本书里，卢梭终于走下了神坛，他与我们每个人一样，有痛苦彷徨，有孤独寂寥，有无奈悲伤……而卢梭的伟大之处在于，他最终在遐想中与自己的命运达成了和解——拥抱孤独，拥抱疼痛，拥抱生命中的每一天。", "y": "", "d": "2024-04-16"}, {"k": "h", "c": "一 命运", "x": "于是，我做出了最后一个决定，那就是顺随自己的命运，不再抗拒必然到来的定数。这样的顺从使我获得了安宁，一种在艰难又无益的反抗挣扎中不可能有的安宁，也正是这种安宁，让我所有的伤痛都得到了补偿。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "在我草木皆兵的想象中，种种未来的苦难纠缠在一起，盘根错节，不断被放大，不断地增长。对我而言，等待痛苦来临比痛苦本身残忍千百倍，被枪口对准胸膛对我而言远比枪击本身可怕得多。灾厄一朝临头，事实便失去了想象的空间，只留下原本的内容。于是我发现，真实的痛苦与我所臆想的相比简直微不足道，这甚至让我在种种苦难中感到一丝轻松和慰藉。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "在这样的状态下，我不再受制于新的恐惧，从焦灼的期待中解脱出来，唯一剩下的只是习惯，这让我越来越能够忍受自己的处境，因为确实也没有什么能让这种处境更糟了。而我的感受力也随着时间流逝变得日渐迟钝，他们也没有办法让我的感官重新恢复敏锐的知觉。这就是迫害我的人们在不遗余力的憎恨中，给我留下的唯一好处。他们对我的一切影响都已消失，我从此可以尽情嘲笑他们了。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "他们在我心中激发的情感只有鄙夷，他们的蝇营狗苟在我看来索然无味，甚至多此一举，我一人独处要比生活在众人之中幸福百倍。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "他们给我定的罪并不公正，但是出于自尊，他们永远不会原谅我。在他们的鼓动下，公众也站在他们那一边，对我的憎恶永远都无法平息。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "对我而言，尘世间的一切都已经结束了。人们再也不会给我幸福抑或伤害了。在这世界上，我再也没有期待，也没有了恐惧。我在深渊里，感觉很平静。命途多舛的可怜人啊，却像神明一样无喜无悲。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "所以，还是让我的心灵远离一切对我来说既折磨人又毫无用处的事物吧。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "一 命运", "x": "我只应该，也只愿意过好自己的生活。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "二 意外", "x": "我从自己的亲身经历中悟出了一个道理：真正的幸福之源就是我们自身，如果一个人懂得如何感受幸福，那么旁人便无法真正使之陷入悲惨境地。四五年来，我已经习惯于品味来自内心的愉悦，那是美好而温柔的灵魂在凝思默想中获得的美妙感受。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "二 意外", "x": "所以说，对一切事物秉承直率和坦诚的态度，在这个世界上就是最可恶的罪行，在我的同时代人看来，我恶毒又残忍，而他们眼中能看到的我的唯一罪过，就是不像他们一样虚伪又狡黠。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "二 意外", "x": "我的心灵和理智向我大声昭告：我的信念绝不会欺骗我。所以，人类也好，命运也好，都随他们去吧。我要学会默不作声地忍受痛苦。最终，一切都会恢复秩序，走上正轨，或早或迟，总会轮到我。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "三 知识", "x": "而我呢，我渴望学习是为了认知自我，不是为了教育他人；我一直认为在教导他人之前必须足够了解自己。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "三 知识", "x": "无论我处境如何，我都决心顺其自然过好每一天，不再为摆脱困境而挣扎，也绝不再为未来操心。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "三 知识", "x": "终于，我对自己说：难道要让自己永远在这些能说会道之人的诡辩中晕头转向吗？我甚至都不确定他们津津乐道地鼓吹和无比热忱兜售的观点是否是他们自己的真实想法。他们用激情来驾驭理论学说，用利益蒙蔽人们相信这个或那个，别人根本不可能看穿他们自己真正相信什么。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "三 知识", "x": "我决意好好关注那些在我看来重要且值得评价的事物，在将过去的行为准则与自身的处境相比时，我发现自己对他人荒谬无稽的评判和短短一生中的诸多小事赋予了过分重要的意义。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "三 知识", "x": "人的一生中充满了种种苦难的考验，这些苦难具体是什么样子并不十分重要，只要能够达到预期的效果就好。所以说，苦难越是苦，越是难，越是层出不穷，懂得如何承受它就越有好处。在能够从不幸中意识到苦尽甘来的重要性和必然性的人面前，任何最强烈的苦痛都会失去杀伤力；坚信苦尽甘来，这就是我在之前的静默思考中得出的最重大的成果。", "y": "", "d": "2020-06-06"}, {"k": "h", "c": "五 岛上的日子", "x": "无所事事的珍贵时刻", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "五 岛上的日子", "x": "晚餐之后，如果夜色晴朗，我们会一起到台地上散散步，呼吸来自湖面的清新空气，感受夜晚的凉爽。我们在凉亭里休息，谈笑风生，唱起古老的歌谣，跳起现代的摇摆舞步，之后欣然入睡——对结束的一天心满意足，对第二天没有更多的期望，只期待它与今天一样美好。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "八 苦难", "x": "时过境迁，我只能回忆起这些美好的情感，不再记得与之同时加诸我身的折磨。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "八 苦难", "x": "忆", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "八 苦难", "x": "当我周围的一切都井然有序时，当我对身边的一切和自己生活的氛围心满意足时，我便对这一切都饱含眷恋之情。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "八 苦难", "x": "这份超然心境从何而来？只来自一点，那就是我学会了毫无怨言地承担客观必然的压迫。我曾努力让自己仍然心系于千百种事物，然而所有的依恋一一落空，我只能依靠自己，还好我最后终于找回了踏实的感觉。尽管在各个方面都受到压迫，我仍然在勉力维持着自己的平衡，因为我不再牵挂任何事物，我所依靠的只有自己。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "八 苦难", "x": "一切都将我带回到我为之而生的幸福而甜美的生活中。我已经走过了人生四分之三的旅程，时而沉浸在富有教育意义、令人愉悦的事物中，满怀欣喜地调动我的头脑和感官；时而与我在幻想中所创造的孩子们相处，它们为我的情感提供了养分；时而与自己独处，对自己感到心满意足，心中充满了我认为自己理应获得的幸福。在这三种情况下，爱都是最重要的，而自负之心则没有任何意义。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "八 苦难", "x": "所有一切都来自我摇摆不定的秉性，一阵疾风就能在我心里掀起波澜，风一吹过才会重归宁静。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "九 幸福", "x": "在精神的满足到来时，就尽情享受吧，小心守护它，不要失手让它远去；", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "九 幸福", "x": "万事有失便有得。", "y": "", "d": "2020-06-07"}, {"k": "h", "c": "九 幸福", "x": "我不断地回忆，反复咀嚼回味这些快乐；尽管罕有，但只要它们这样纯洁不掺杂质，或许会让我比生活在繁荣之中更加幸福。", "y": "", "d": "2020-06-07"}]}, {"id": "674044", "title": "我与地坛", "author": "史铁生", "cats": ["文学-散文杂著"], "bmCount": 28, "rvCount": 1, "notes": [{"k": "h", "c": "第1章 我与地坛", "x": "一个人，出生了，这就不再是一个可以辩论的问题，而只是上帝交给他的一个事实；上帝在交给我们这件事实的时候，已经顺便保证了它的结果，所以死是一件不必急于求成的事，死是一个必然会降临的节日。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第1章 我与地坛", "x": "只是在她猝然去世之后，我才有余暇设想。当我不在家里的那些漫长的时间，她是怎样心神不定坐卧难宁，兼着痛苦与惊恐与一个母亲最低限度的祈求。", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第1章 我与地坛", "x": "在那些空落的白天后的黑夜，在那不眠的黑夜后的白天", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第1章 我与地坛", "x": "那时她的儿子还太年轻，还来不及为母亲想，他被命运击昏了头，一心以为自己是世上最不幸的一个，不知道儿子的不幸在母亲那儿总是要加倍的。", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第1章 我与地坛", "x": "坐在小公园安静的树林里，我闭上眼睛，想：上帝为什么早早地召母亲回去呢？很久很久，迷迷糊糊地，我听见了回答：‘她心里太苦了。上帝看她受不住了，就召她回去。’我似乎得到一点儿安慰，睁开眼睛，看见风正从树林里穿过。", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第1章 我与地坛", "x": "摇着轮椅在园中慢慢走，又是雾罩的清晨，又是骄阳高悬的白昼，我只想着一件事：母亲已经不在了。在老柏树旁停下，在草地上在颓墙边停下，又是处处虫鸣的午后，又是鸟儿归巢的傍晚，我心里只默念着一句话：可是母亲已经不在了。", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第1章 我与地坛", "x": "秋天是从外面买一棵盆花回家的时候，把花搁在阔别了的家中，并且打开窗户把阳光也放进屋里，慢慢回忆慢慢整理一些发过霉的东西；冬天伴着火炉和书，一遍遍坚定不死的决心，写一些并不发出的信。", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第1章 我与地坛", "x": "谁又能把这世界想个明白呢？世上的很多事是不堪说的。你可以抱怨上帝何以要降诸多苦难给这人间，你也可以为消灭种种苦难而奋斗，并为此享有崇高与骄傲，但只要你再多想一步你就会坠入深深的迷茫了：假如世界上没有了苦难，世界还能够存在么？要是没有愚钝，机智还有什么光荣呢？要是没了丑陋，漂亮又怎么维系自己的幸运？要是没有了恶劣和卑下，善良与高尚又将如何界定自己又如何成为美德呢？要是没有了残疾，健全会否因其司空见惯而变得腻烦和乏味呢？我常梦想着在人间彻底消灭残疾，但可以相信，那时将由患病者代替残疾人去承担同样的苦难。如果能够把疾病也全数消灭，那么这份苦难又将由（比如说）相貌丑陋的人去承担了。就算我们连丑陋，连愚昧和卑鄙和一切我们所不喜欢的事物和行为，也都可以统统消灭掉，所有的人都一样健康、漂亮、聪慧、高尚，结果会怎样呢？怕是人间的剧目就全要收场了，一个失去差别的世界将是一潭死水，是一块没有感觉没有肥力的沙漠。", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第1章 我与地坛", "x": "看来差别永远是要有的。看来就只好接受苦难——人类的全部剧目需要它，存在的本身需要它。看来上帝又一次对了。", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第1章 我与地坛", "x": "我常以为是丑女造就了美人。我常以为是愚氓举出了智者。我常以为是懦夫衬照了英雄。我常以为是众生度化了佛祖。", "y": "", "d": "2025-11-07"}, {"k": "h", "c": "第1章 我与地坛", "x": "有时候是轻松快乐的，有时候是沉郁苦闷的，有时候优哉游哉，有时候恓惶落寞，有时候平静而且自信，有时候又软弱，又迷茫。其实总共只有三个问题交替着来骚扰我，来陪伴我。", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第1章 我与地坛", "x": "时间不早了可我一刻也不想离开你，一刻也不想离开你可时间毕竟是不早了。", "y": "", "d": "2025-06-13"}, {"k": "h", "c": "第1章 我与地坛", "x": "但是太阳，它每时每刻都是夕阳也都是旭日。当它熄灭着走下山去收尽苍凉残照之际，正是它在另一面燃烧着爬上山巅布散烈烈朝辉之时。那一天，我也将沉静着走下山去，扶着我的拐杖。有一天，在某一处山洼里，势必会跑上来一个欢蹦的孩子，抱着他的玩具。\n当然，那不是我。\n但是，那不是我吗？\n宇宙以其不息的欲望将一个歌舞炼为永恒。这欲望有怎样一个人间的姓名，大可忽略不计。", "y": "", "d": "2024-01-26"}, {"k": "h", "c": "第2章 我二十一岁那年", "x": "但是有一天我认识了神，他有一个更为具体的名字——精神。在科学的迷茫之处，在命运的混沌之点，人惟有乞灵于自己的精神。", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第3章 合欢树", "x": "我摇着车在街上慢慢走，不急着回家。人有时候只想独自静静地待一会儿。悲伤也成享受。", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第5章 墙下短记", "x": "流动不居的生命", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第5章 墙下短记", "x": "晚风轻柔得让人无可抱怨", "y": "", "d": "2023-06-30"}, {"k": "h", "c": "第7章 我的梦想", "x": "上帝从来不对任何人施舍“最幸福”这三个字，他在所有人的欲望前面设下永恒的距离，公平地给每一个人以局限。", "y": "", "d": "2025-11-05"}, {"k": "h", "c": "第8章 好运设计", "x": "所谓好运，所谓幸福，显然不是一种客观的程序，而完全是心灵的感受，是强烈的幸福感罢了。幸福感，对了。没有痛苦和磨难你就不能强烈地感受到幸福，对了。那只是舒适只是平庸，不是好运不是幸福，这下对了。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "接下来你会发现你还缺乏勇气，缺乏同情，缺乏感觉，遇事永远不会激动，美好不能使其赞叹，丑恶也不令其憎恶，你既不懂得感动也不懂得愤怒，你不怎么会哭又不大会笑，这怎么能行？你还是活的吗？你还能爱吗？你还会为了爱而痛苦而幸福吗？不行。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "你能够不断地克服困难，你能够不断地跨越距离，你能够不断地实现你的愿望，这就行了。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "过程。对，过程，只剩了过程。对付绝境的办法只剩它了。不信你可以慢慢想一想，什么光荣呀，伟大呀，天才呀，壮烈呀，博学呀，这个呀那个呀，都不行，都不是绝境的对手，只要你最最关心的是目的而不是过程你无论怎样都得落入绝境，只要你仍然不从目的转向过程你就别想走出绝境。过程——只剩了它了。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "一个只想（只想！）使过程精彩的人是无法被剥夺的，因为死神也无法将一个精彩的过程变成不精彩的过程，因为坏运也无法阻挡你去创造一个精彩的过程，相反你可以把死亡也变成一个精彩的过程，相反坏运更利于你去创造精彩的过程。于是绝境溃败了，它必然溃败。你立于目的的绝境却实现着、欣赏着、饱尝着过程的精彩，你便把绝境送上了绝境。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "当生命以美的形式证明其价值的时候，幸福是享受，痛苦也是享受。现在你说你是一个幸福的人你想你会说得多么自信，现在你对一切神灵鬼怪说谢谢你们给我的好运，你看看谁还能说不。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "过程！对，生命的意义就在于你能创造这过程的美好与精彩，生命的价值就在于你能够镇静而又激动地欣赏这过程的美丽与悲壮。", "y": "", "d": "2023-06-29"}, {"k": "h", "c": "第8章 好运设计", "x": "永远欣赏到人类的步伐和舞姿，赞美着生命的呼喊与歌唱，从不屈获得骄傲，从苦难提取幸福，从虚无中创造意义", "y": "", "d": "2024-04-11"}, {"k": "h", "c": "第8章 好运设计", "x": "如果为了使你幸福，我们不仅得给你小痛苦，还得给你大痛苦，不仅得给你一时的痛苦，还得给你永远的痛苦，我们到底帮了你什么忙呢？", "y": "", "d": "2024-04-11"}, {"k": "h", "c": "第9章 记忆与印象1", "x": "一些人真实的困苦变成了另一些人编织的愉快，一个时代的绝望与祈告，变成了另一个时代的潇洒的文字调遣，不能说这不正当，但其间总似拉开着一个巨大的空当，从中走漏了更要紧的东西。", "y": "", "d": "2024-01-09"}, {"k": "t", "c": "全书想法", "x": "", "y": "“一个只想（只想！）使过程精彩的人是无法被剥夺的，因为死神也无法将一个精彩的过程变成不精彩的过程，因为坏运也无法阻挡你去创造一个精彩的过程，相反你可以把死亡也变成一个精彩的过程，相反坏运更利于你去创造精彩的过程。于是绝境溃败了，它必然溃败。你立于目的的绝境却实现着、欣赏着、饱尝着过程的精彩，你便把绝境送上了绝境。”\n\n我大受震撼！😭", "d": "2023-08-09"}]}, {"id": "CB_1mH3dt3bHFHJ6xB6x85Q31fx", "title": "《最好金龟换酒》---傅真", "author": "傅真", "cats": [], "bmCount": 28, "rvCount": 0, "notes": [{"k": "h", "c": "目录", "x": "希望有一天能够怀抱着踏实的心情重新回到茫茫人海，\n那时的我或许已经找到了那座福山。", "y": "", "d": "2025-07-08"}, {"k": "h", "c": "序 福山", "x": "然而开始上班之后，几乎是立刻就体会到“上了贼船”的感觉。好像一个刚学会狗刨式游泳的人就被扔进大海里，我手忙脚乱地应付着一波又一波汹涌的浪头。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "生活在那样一个五光十色的大都市，住在繁华热闹的百老汇，我的世界却是一片荒芜。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "人真是至贱的物种。经受过最为残酷的剥削之后，残酷程度稍有下降便觉得是种恩赐。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "是的，我并不十分热爱自己的工作，但我非常感激和珍惜它。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "一年又一年，时间就这样从键盘间溜走。回首时觉得时光飞逝，可是落实到每一天又好似度日如年——每天都望眼欲穿地盼望着周末，盼望着假期，而这一姿态本身又让我觉得心酸而惶惑，仿佛是在盼望着时间的飞速流逝，盼望着自己的生命早日终结。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "它是一个非自然的社会，在这里长大的孩子永远不会爬树，也无法识别天上的星星；对物质的信仰超过了诗歌，做梦是不切实际的表现；活着的纯粹的快乐早已消失不见，取而代之的是组装宜家家具的快乐，拥有名牌包的快乐，在五星级酒店的泳池边喝鸡尾酒的快乐……不，我可不想让一个公司或一群人的价值观变成我的价值观，", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "我也无法为大房子、职业生涯和退休金而兴奋。我真正想要的，是一串火花，一次远行，一场思考。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "然而经历过很多同事的离别，我非常清楚大家很快就会把我忘记。没有人是不可替代的。少了我地球照样运转，说不定运转得更好。风调雨顺，五谷丰登。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "佛经里说：“舍得”者，实无所舍，亦无所得，是谓“舍得”。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "过长的工作时间导致了私人生活的贫乏，而我们将这一缺憾变本加厉地投射在对物质的欲望中。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "我们越来越胆怯懒惰，因为这份工作使我们丧失了那种使人变得勇猛无畏的生机和活力。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "如果从来不曾拥有过，舍弃的时候就不会有那么多挣扎吧？", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "斯宾诺莎说，人类所能希望达到的最高极限就是自我满足，而没有对自我的了解，满足又从何谈起。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "序 福山", "x": "希望有一天能够怀抱着踏实的心情重新回到茫茫人海，那时的我或许已经找到了那座福山。", "y": "", "d": "2025-07-09"}, {"k": "h", "c": "PART2 不可能更好的起点", "x": "旅行总会促使你正视你与这个世界的关系。", "y": "", "d": "2025-07-10"}, {"k": "h", "c": "PART2 不可能更好的起点", "x": "我爱他们淡雅的风度，也敬重他们在物质贫乏的情况下仍能保持对美的追求和丰富的灵魂。", "y": "", "d": "2025-07-12"}, {"k": "h", "c": "PART2 不可能更好的起点", "x": "世间的际遇多么神奇，而人生又到底有多少种活法？", "y": "", "d": "2025-07-12"}, {"k": "h", "c": "PART2 不可能更好的起点", "x": "你并不一定会从此拥有更美好的人生，可你仍然感谢天地和人世所带来的这些变化和发生。", "y": "", "d": "2025-07-12"}, {"k": "h", "c": "PART2 不可能更好的起点", "x": "他说很遗憾人们非常容易拥有两种紧密相连的情绪——恐惧和厌恶。我们很容易厌恶我们所恐惧的事物，也常常恐惧我们所厌恶的事物。", "y": "", "d": "2025-07-12"}, {"k": "h", "c": "PART2 不可能更好的起点", "x": "从生活中提炼出来的朴素哲学", "y": "", "d": "2025-07-12"}, {"k": "h", "c": "PART4 山中日记", "x": "我的确相信人可以改变自己的命运，可是既然能做到的只有极少数的人，你不得不承认这也还是需要某种运气。我想所谓命运，对于大多数的人来说，大概就是杯子是什么形状，水就是什么形状。", "y": "", "d": "2025-07-13"}, {"k": "h", "c": "PART5 这么近那么远", "x": "时时提醒自己要加倍珍惜", "y": "", "d": "2025-07-13"}, {"k": "h", "c": "PART5 这么近那么远", "x": "不知是“人穷志短”还是年岁渐长的关系，我们好像越来越宽容，看什么都觉得挺好。", "y": "", "d": "2025-07-13"}, {"k": "h", "c": "PART6 反正现在是夏天嘛", "x": "人的故乡，并不止于一块特定的土地，而是一种辽阔无比的心情，不受空间和时间的限制；这心情一经唤起，就是你已经回到了故乡。", "y": "", "d": "2025-07-15"}, {"k": "h", "c": "PART6 反正现在是夏天嘛", "x": "在这里的日子像是坐在流星上度过的。", "y": "", "d": "2025-07-15"}, {"k": "h", "c": "PART7 Pura Vida！", "x": "有一丝愉悦悄悄在心中升起，像一滴墨汁溶入水中，然后渐渐晕染开来", "y": "", "d": "2025-07-15"}, {"k": "h", "c": "PART8 Up！", "x": "愿人人都能拥有不为他人所愚弄的智慧，愿我们不因周遭的扭曲而失去理智和善意", "y": "", "d": "2025-07-28"}]}, {"id": "3300119491", "title": "我用中文做了场梦", "author": "亚历", "cats": ["文学-散文杂著"], "bmCount": 26, "rvCount": 2, "notes": [{"k": "h", "c": "过日子的老外", "x": "这个世界无疑简单，有时狭窄又无聊，却熟悉到令人欣慰。在两千多万人的城市里挖掘出一种小镇般的错觉，还挺奇妙。", "y": "", "d": "2025-01-22"}, {"k": "h", "c": "过日子的老外", "x": "不管如何决定，你总会牺牲点什么。", "y": "", "d": "2025-01-22"}, {"k": "h", "c": "过日子的老外", "x": "我们选择抗拒和怨恨，还是包容和好奇，会决定我们的生活体验。我要努力做后者；如果发现做不到，就回家。", "y": "", "d": "2025-01-23"}, {"k": "h", "c": "再来一条", "x": "给我提供了上班间隙的精神滋养", "y": "", "d": "2025-01-23"}, {"k": "h", "c": "再来一条", "x": "和阿姨的对话包含着一个我自己最近一年忽略的问题：想好好创作，需要关注周边的世界，而不是关在房间里。", "y": "", "d": "2025-01-24"}, {"k": "t", "c": "北京，北京", "x": "走出学校，到西土城站坐上地铁，我感觉自己在北京了。", "y": "巧了，我刚刚也从西土城站坐上了地铁，在车厢混杂的噪音中翻开这本书来读～", "d": "2025-01-24"}, {"k": "h", "c": "北京，北京", "x": "迷失在人流中，被城市的齿轮所吞噬", "y": "", "d": "2025-01-24"}, {"k": "h", "c": "北京，北京", "x": "我用它来探索这座城市。", "y": "", "d": "2025-01-24"}, {"k": "h", "c": "北京，北京", "x": "保持流动，就能继续穿越。", "y": "", "d": "2025-01-24"}, {"k": "h", "c": "北京，北京", "x": "我们的生活在平行的轨道上进行，却总是有交叉。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "北京，北京", "x": "What an age to be alive!", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "北京，北京", "x": "为了每一天而活着", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "北京，北京", "x": "你交了张门票钱，梦幻岛负责幻想，可不管别的。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "北京，北京", "x": "在梦幻岛上，你能感到每天的匆忙，却感觉不到每一年逝去的必然。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "坐后排", "x": "融入了，不就没有梦幻岛了吗？", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "坐后排", "x": "我喜欢这个国家的大，大到能够让自己在其中消失，在上千里的铁路上漂泊。我不带任何目的或需求，迎接路上所有的偶遇。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "坐后排", "x": "在路上，每一次的交集都让我觉得我属于这个混杂、不完美、让人又爱又恨的世界。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "和人交流", "x": "似乎任何生活的痕迹都能吸引我，甚至打动我。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "和人交流", "x": "晒着知春路的太阳", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "海边的老师", "x": "只要我能够在空旷的城市流动，就不会有让我烦躁的事情。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "海边的老师", "x": "我知道这些周末、这些人、这一切都是暂时的。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "外籍群演大酒店", "x": "我学会了在持续的压力之下管理自己的情绪", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "外籍群演大酒店", "x": "为了表现出一副滴水不漏的样子，挣扎隐藏在我的内心深处，别人是看不见的。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "何处才是家？", "x": "离开了剧组，我失去了归属感，不知道去哪里才算是家。没剩下几个朋友的北京吗，还是已经离开了五年的意大利？似乎两个都不是。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "何处才是家？", "x": "最后能让我鼓起勇气迈出这一步的，是把它当作一次尝试，而不是一个重大的人生选择。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "何处才是家？", "x": "我觉得也许这里有我的地方。在北京，我更多的是在被动地接受那座城市。这次到上海，我想试试成为它的一部分。", "y": "", "d": "2025-01-25"}, {"k": "h", "c": "花园坊的春天", "x": "“你知道什么是今天吗？”\n“不知道。”\n“今天是明天。它已经发生了。”", "y": "", "d": "2025-01-25"}, {"k": "t", "c": "全书想法", "x": "", "y": "被书名吸引，整个阅读过程也很愉快，在回家过年的飞机上看完了。\n亚历用生动的文字记录了在中国的生活经历，细腻、幽默又不失深刻。\n好喜欢这样的人啊，浑身长满感知世界的触角，不麻木，不冷漠，观察世界，探索世界，尝试各种新鲜事物，打开自己的天地。\n读完这本书，我也想再多记录一些生活了。\n远离西北，北京也称得上是我的“梦幻岛”，在这里我没几个朋友，没有家人，和周围的人只有一点点微弱的连接，没人在意我每天都在干什么，没人评判我的生活方式。\n“梦幻岛”并不长久，在北京的生活也许脆弱又短暂，说不定哪天就离开了。在此之前，多写点东西记录吧。", "d": "2025-01-26"}]}, {"id": "3300044710", "title": "瓦尔登湖", "author": "[美]亨利·戴维·梭罗", "cats": ["文学-散文杂著"], "bmCount": 21, "rvCount": 1, "notes": [{"k": "h", "c": "1", "x": "你们不管藏在哪里，不管藏的是多还是少，反正就是想存点钱。", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "大多数人生活在无言的绝望中。所谓的委曲求全其实是积重难返的绝望。你们从绝望的城市走进绝望的乡村，只能以水貂皮和麝鼠皮做成的华贵服装来自我安慰。就连各种所谓的游戏和娱乐，也隐藏着一种反复出现然而谁也没有察觉的绝望。这些游戏和娱乐并不愉快，因为它们是在工作之后才出现的。但智慧的特征之一就是不去做绝望的事。", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "但聪敏而健康的人记得太阳每天都会升起。", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "我想我们完全可以放心地去做更多的事。要是把心思花在别的地方，我们也许就不会如此庸人自扰。大自然既为强者提供用武之地，也为弱者提供容身之所。有些人总是忧心忡忡，简直像患了不可治愈的绝症。我们天生爱夸大自己所从事工作的重要性，不停地担心还有很多工作尚未完成！或者忧虑万一我们生病了怎么办？我们真是太过多虑了！我们并没有怀着信仰去生活；白天时提心吊胆，到了晚上不情不愿地祷告，丝毫没有坚定的信念。我们就这样谨小慎微地活着，对我们的生活充满了敬畏之情，顽固地认为它没有改变的可能性。这是唯一的生活方式，我们说；但你能从圆心画出多少半径，生活就有多少种方式。所有的改变都是奇迹，但这种奇迹时时刻刻都在发生。孔子说过：“要知道我们只知道我们知道的，不知道我们不知道的，那才是真正的知道。”[插图]既然已经有人把一切未知事物排除在他的认知之外，那么人们不敢去尝试新的生活方式也就不难理解了。", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "说到奢侈和舒适，最聪明的人往往过着比穷人还要简单和俭朴的生活", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "人们交口称赞和认为成功的生活，无非是生活的一种而已。我们为什么要夸耀一种，而牺牲其他各种呢？", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "拥有房子之后，农夫也许不是变得更富裕了，而是变得更贫穷了，实际上是房子拥有了他。", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "一个阶级的奢靡，需要另一个阶级的穷苦来支撑。", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "1", "x": "我们总是想要学会如何得到更多的东西，但有时候应该学学如何满足于更少的东西吧？", "y": "", "d": "2023-10-06"}, {"k": "h", "c": "2", "x": "把人生中最美好的阶段用来赚钱，以便能够在人生中最没有价值的阶段享受一点值得怀疑的自由", "y": "", "d": "2023-10-08"}, {"k": "t", "c": "2", "x": "把人生中最美好的阶段用来赚钱，以便能够在人生中最没有价值的阶段享受一点值得怀疑的自由", "y": "🕸️", "d": "2023-10-08"}, {"k": "h", "c": "2", "x": "唉，我们为什么要搬走而不是丢弃我们的家具、我们的负累呢？既然我们最终都要离开这个世界，去往另外一个拥有新家具的世界，那么何不就把旧家具付诸一炬呢？这些身外之物就好像是陷阱，如果有人随身带着它们，走在崎岖的乡间，那是难免要陷进去的。", "y": "", "d": "2023-10-08"}, {"k": "h", "c": "2", "x": "由于我知所取舍，尤其重视我的自由，也由于我能够忍受艰苦的生活，而且还能过得很好，所以我并不想浪费时间去谋取华美的地毯或者其他高级的家具，或者佳肴美食，或者希腊式、哥特式的房子[插图]。如果有人能够不费吹灰之力就获得这些东西，并且获得后知道合理地使用它们，那么我也并不反对他们的追求。", "y": "", "d": "2023-10-08"}, {"k": "h", "c": "2", "x": "总而言之，信念和经验都让我深深地相信，只要朴素地、明智地生活，在这世间谋生并非痛苦的差事，而是欢快的娱乐", "y": "", "d": "2023-10-08"}, {"k": "h", "c": "2", "x": "别让你的心牵挂那些短暂易变的东西", "y": "", "d": "2023-10-08"}, {"k": "h", "c": "居所和生活的目标", "x": "别去做成百上千件事，只要做两三件就好；别追求上百万种东西，只要追求五六种就好", "y": "", "d": "2023-10-08"}, {"k": "h", "c": "居所和生活的目标", "x": "让我们该起床时就赶紧起床，该休息时就安心休息，保持安宁而没有烦扰的心态；身边的人要来就让他来，要去就让他去，让钟声回荡，让孩子哭喊——下定决心好好地过一天。我们为什么要轻言放弃和随波逐流呢？让我们别为一日三餐烦恼，别被如此可怕湍急的漩涡吞没。只要涉过这段险滩，你就会安然无恙，因为剩下的都是容易走的下山路。振作起来，带着早晨的活力，启航前进吧，寻找其他的航路，像尤利西斯那样，把自己绑在桅杆上￼。如果火车头突突地吼叫，就让它吼到嘶哑吧。如果钟声响起，我们为什么要匆匆赶路呢？我们倒不如仔细听听它像是哪种音乐。让我们把自己安顿下来，好好地工作，用力去踩踏脚下的烂泥，那由成见、偏见、传统、谎言和表象搅成的烂泥，去踩那遍布全球的脏水，那污染了伦敦和巴黎、纽约和波士顿和康科德、教会和国家、诗歌和哲学和宗教的脏水，直到我们的脚触及坚硬的底部和安稳的岩石，也就是我们所说的现实，然后我们说：“没错，就是这里。”有了这个立足点，你也许可以在洪水、迷雾和烈焰之下，建立一面墙壁或者一个国家，或者安全地竖起一根灯柱，又或者可以安个测量仪，不是测量尼罗河水位那种，而是测量现实的，以便将来的世代能够知道，谎言和表象的洪水曾经积聚得有多深。如果你敢于面对各种事实，你将发现太阳的两面都会发光，仿佛它是一把双刃剑，而且你将感受到它那美妙的锋刃正在剖开你的心和髓，到时你会快乐地结束你在俗世的事业。不管生还是死，我们只渴求现实。如果我们真的就要死亡，让我们聆听自己喉咙里的咔嗒声，感受自己四肢的寒冷吧；如果我们还活着，让我们为自己的事情奔忙吧。", "y": "", "d": "2023-10-08"}, {"k": "h", "c": "声音", "x": "它是一部有许多场而且永远不会落幕的戏剧。假如我们总是真正地去生活，根据刚刚了解到的最好方式去调节我们的生活，那么沉闷乏味将和我们无缘。只要紧紧地跟随你的天赋，它每时每刻都将让你看到全新的景色。哪怕是做家务，也将是一种消遣。", "y": "", "d": "2023-10-18"}, {"k": "h", "c": "孤寂", "x": "然而我有时候深切地感受到，最美好、最温柔、最纯洁、最鼓舞人心的相处，很可能是人和自然的相处，哪怕对可怜的厌世者和最忧郁的人来说，情况也是如此。人只要心智健全，又生活在大自然里，那就不会为任何事物感到忧伤。", "y": "", "d": "2023-10-18"}, {"k": "h", "c": "孤寂", "x": "只要把四季当作朋友，我相信没有任何事情能让生活成为我的负担。", "y": "", "d": "2023-10-18"}, {"k": "h", "c": "孤寂", "x": "我们寄居的这个地球无非是太空中的一点。和浩茫无际、连我们的仪器都测量不出其直径有多大的宇宙相比，在这个星球上居住的两个人，哪怕隔得再远，又能有多远呢？", "y": "", "d": "2023-10-18"}, {"k": "h", "c": "孤寂", "x": "所有的事情，无论是好是坏，就像河流般从我们身边流过。", "y": "", "d": "2023-10-18"}]}, {"id": "923096", "title": "生活教会我", "author": "埃莉诺·罗斯福", "cats": ["文学-散文杂著"], "bmCount": 20, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "或许人们其实只能从自己的错误中学习。无论如何，生活的关键在于不断学习。", "y": "", "d": "2020-12-10"}, {"k": "h", "c": "前言", "x": "归根结底，生命的目的，就在于生活其中，在于尽可能地去体验，去热情探索，毫不畏惧更新和更丰富的经历。", "y": "", "d": "2020-12-10"}, {"k": "h", "c": "导读 该怎样生活？", "x": "怎样生活，怎样工作，怎样在最困难的时刻坚持下去，怎样在我们短暂也漫长的生命里活出意义", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "01 学会学习", "x": "从身边的每件事情学习，从习得的每个知识中学习，从拥有的每段经历中学习，从遇见的每个人身上学习。你所学的每样东西都不会白费。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "01 学会学习", "x": "在我看来，教育最重要的成果体现在这样一种学习能力：从身边的每件事情学习，从习得的每个知识中学习，从拥有的每段经历中学习，从遇见的每个人身上学习。无论学到的知识多么零碎，无论看上去距离最终目标多么遥远，你所学的每样东西都不会白费。我学过的东西最后都派上了用场，而且往往是在意想不到的场合，以始料未及的方式发挥作用。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "02 恐惧——伟大的敌人", "x": "正如每个人或早或晚都会发现的，我意识到自己有两个选择：要么学会处理这些状况，要么被它们打败，整天提心吊胆有问题发生。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "02 恐惧——伟大的敌人", "x": "我只好学会用自我克制来保护自己，如果不想失望，就不要告诉别人自己想要什么。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "02 恐惧——伟大的敌人", "x": "好在，每当我们与恐惧作战时，哪怕当时认为它不可战胜，哪怕在过程中受尽折磨，只要经受住痛苦，克服了恐惧，你会发现获得了更大的自由。一个人只要经受住一次这种考验，就可以经受住任何事情。每一次与恐惧的正面对决都会让我们收获力量、勇气与自信。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "02 恐惧——伟大的敌人", "x": "放下自我。如果你能放下自我，不去想是否给别人留下好印象，不去管人们怎么看你，反过来替别人着想，你就不会再感到胆怯。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "02 恐惧——伟大的敌人", "x": "恐惧在很大程度上是由于缺乏了解。我们不知道在新环境会发生什么，也不知道自己能否应对。越早知道会发生什么，就能越早从恐惧中解脱出来。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "02 恐惧——伟大的敌人", "x": "勇气比恐惧要振奋人心，从长远来说，也更容易做到。拥有勇气并不是要一夜之间变英雄，而是只需每次都比以前有一点进步，只需正面应对每个问题，不被表面的困难吓倒，发掘出我们克服困难的内心力量。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "03 如何利用时间", "x": "该如何最有效地利用时间呢？我自己一般有三种办法：第一，保持内心平静，以使工作时不受周围环境影响；第二，专注在手头的事情上；第三，建立起生活规律，分配好时间，提前计划每件事情，同时又留有余地以备不患。除此之外，还有一点也很重要：那就是保持身体健康，保证有充沛的精力可用。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "03 如何利用时间", "x": "一个人只要有自我放松的能力，有使自己内心平静下来的能力，无论有多忙，都能随时休息。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "03 如何利用时间", "x": "世上最不开心的人就是那些整天无所事事的人。如果你手上的项目忙得转不过来，你不会感到不高兴。这不仅是生活规划的问题，也是有没有想象力和好奇心的问题。如果你怀有兴趣，事情会自己找上门来。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "04 成熟的不易", "x": "“成熟的人是思考问题并不极端的人，是即使情绪激动也能保持客观的人，是认识到所有人、所有事都有好坏两面的人，是谦逊、宽厚，知道每个人都需要爱与宽容的人。”", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "04 成熟的不易", "x": "首先，成熟意味着有自知之明。一个人必须愿意了解他自己，必须对自己诚实，必须了解自己的真实动机和感受。一个人除非能真实面对自己，否则很难真正去体谅和理解他人。当然，面对自我、接纳自己的真实动机需要勇气。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "05 永无止境的自我调整", "x": "自我调整是一种内在革命。你每学到一些新的东西，就需要对自己的知识结构做出调整。在我看来，人的一生必须不断做出内在和外在的调整，这一过程永无止境。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "06 成为有用之材", "x": "曾有人问我获得快乐最重要的三个条件是什么。我的回答是：“对自己和身边的人诚实以待；在生活和工作中竭尽全力；拥有爱别人的能力。”", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "07 成为独立个体的权利", "x": "生活是你自己的——但只有在你使其成为自己的生活时才是如此。你遵从的应当是自己的原则，自己的行为标准，自己对于对错、真假以及重要与否的判断。当你采纳了别人的原则和标准，或是某个团体或利益集团的原则和标准，你就放弃了独立自我。就你放弃的那部分而言，你变成了一个空心人。", "y": "", "d": "2020-12-11"}, {"k": "h", "c": "07 成为独立个体的权利", "x": "有勇气保持独立是勇敢的，也是孤独的。但这总比放弃自我要好得多，放弃自我意味着谁也不是。", "y": "", "d": "2020-12-11"}]}, {"id": "3300078574", "title": "沿着季风的方向（《失落的卫星》作者刘子超代表作）", "author": "刘子超", "cats": ["文学-纪实文学"], "bmCount": 19, "rvCount": 0, "notes": [{"k": "h", "c": "8104号快车：瓦拉纳西—格雅", "x": "痛苦并非从外在的源头降临到我们身上，而是我们自己情绪反应的产物。不论我们受了多少痛苦，不论我们感觉痛苦及其原因有多么真实，它其实是一种幻象，并非真实存在。佛陀告诉他的信徒，这个真谛是我们完全可以自己领悟的", "y": "", "d": "2025-04-17"}, {"k": "h", "c": "8104号快车：瓦拉纳西—格雅", "x": "精神松绑", "y": "", "d": "2025-04-17"}, {"k": "h", "c": "登山火车：大吉岭—古姆", "x": "1898年戊戌变法失败后，康有为曾避居大吉岭，于1901年至1902年间完成《大同书》的著述。\n对于印度人和大吉岭，这段插曲无足轻重。我站在古姆车站的茶铺外，喝下第一杯大吉岭红茶。", "y": "", "d": "2025-12-19"}, {"k": "h", "c": "“首都”特快：新德里—孟买", "x": "我抬起头，看到了到印度以后的第一朵积雨云。大片灰白色的云，带着黑色边缘，堆积在天际线处。", "y": "", "d": "2025-12-23"}, {"k": "h", "c": "“首都”特快：新德里—孟买", "x": "天空亮起一道道闪电，像有人不断划着火柴。雨斜劈在窗户上，外面是一片令人窒息的空旷。", "y": "", "d": "2025-12-23"}, {"k": "h", "c": "“首都”特快：新德里—孟买", "x": "对遥远的事物津津乐道，对近在咫尺的苦难却视而不见。", "y": "", "d": "2025-12-23"}, {"k": "h", "c": "“首都”特快：新德里—孟买", "x": "我想起一名印度教徒对我说的话：“生命是一场幻觉。”", "y": "", "d": "2025-12-27"}, {"k": "h", "c": "印度尼西亚 死在爪哇也不错", "x": "对旅行者来说，如果纽约是“大苹果”，那么雅加达就是“大榴梿”。它表皮坚硬、带刺，幽幽地散发出腥臭的甜香，让习惯者欲罢不能，却令初来者难以下咽。", "y": "", "d": "2026-01-01"}, {"k": "h", "c": "印度尼西亚 死在爪哇也不错", "x": "走在雅加达，你或许可以偶然观察到一股热气流从铁皮屋顶卷起，或在夜晚开窗时，感到一阵空气轻微的抽搐——但仅此而已，那决然算不上风，也没有风理应带给人的舒爽。", "y": "", "d": "2026-01-01"}, {"k": "h", "c": "老挝 白色大象", "x": "老挝人崇尚无须提高生产力的经济发展，由此也衍生出一套独特的生活美学。他们强调清心寡欲，忌讳强烈的感情。不以物喜，不以己悲，像一朵低空开放的花儿，朴素清丽。", "y": "", "d": "2026-01-03"}, {"k": "h", "c": "马尼拉的枪声", "x": "人们面无表情，目光空洞，就像铁轨下面的墓园。火车呼啸而过，在不远处的站台上吐出疲惫不堪的人群。", "y": "", "d": "2026-01-03"}, {"k": "h", "c": "河谷深处", "x": "清晨的河谷弥漫着淡淡的薄雾，两岸的丛林里传来各种各样的鸟鸣。微风拂过下垂的椰树叶，好像一只看不见的手，弹奏琴键。", "y": "", "d": "2026-01-22"}, {"k": "h", "c": "泰国 曼谷下大城", "x": "如毛姆所说“终究会给你些能吸收的东西”", "y": "", "d": "2026-01-22"}, {"k": "h", "c": "孟买的清晨", "x": "我走过一座破烂的石桥，从洞穴一样的窗口中伸出一根根晾衣杆，上面挂着花花绿绿的衣服，好像废品联合国的旗帜。炙热的阳光使空气发生波浪式的晃动，一团团蚊子在热空气中起舞。", "y": "", "d": "2026-01-24"}, {"k": "h", "c": "小村亨比", "x": "我问她以什么为生。她说这里几乎用不到什么钱。决定搬到亨比后，她就带上在比利时的所有积蓄，在这里买地，盖房。“我吃素，这里的蔬菜很便宜。有时我也给亨比的餐厅做做室内设计。如果生活在比利时，钱或许是很重要的东西。但在这里，钱对我来说只是数字。生活中有很多比数字更有意思的事情，不是吗？​”", "y": "", "d": "2026-01-24"}, {"k": "h", "c": "小村亨比", "x": "最重要的是明白自己想要什么，并且执着地坚持下去。", "y": "", "d": "2026-01-24"}, {"k": "h", "c": "泰米尔的世界", "x": "我似乎仍能闻到小庙中那股檀香的味道，看到在风中舞蹈的火苗，舔舐着耶尔的轮廓。", "y": "", "d": "2026-01-25"}, {"k": "h", "c": "母亲和乌托邦", "x": "对我来说，乌托邦就是无条件地超脱于恶劣环境，从而获得一种内心的澄澈。", "y": "", "d": "2026-01-25"}, {"k": "h", "c": "金奈的傍晚", "x": "晚风从摇下的车窗中灌进来", "y": "", "d": "2026-01-25"}]}, {"id": "28221039", "title": "此生未完成：增订新版", "author": "于娟", "cats": ["文学-散文杂著"], "bmCount": 19, "rvCount": 0, "notes": [{"k": "h", "c": "序1", "x": "在生死临界点的时候，你会发现，任何的加班（长期熬夜等于慢性自杀），给自己太多的压力，买房买车的需求，这些都是浮云。如果有时间，好好陪陪你的孩子，把买车的钱给父母亲买双鞋子，不要拼命去换什么大房子，和相爱的人在一起，蜗居也温暖。", "y": "", "d": "2020-05-31"}, {"k": "h", "c": "序2", "x": "我们俩经常因为小儿的点滴趣事开怀畅笑，数次憧憬着将来再多生几个小孩，分别取名为阿尔法、贝塔、伽马。", "y": "", "d": "2020-05-31"}, {"k": "h", "c": "01 “为啥是我得癌症”的非学术报告", "x": "熬夜直接危害肝脏。熬夜时，人体中的血液都供给了脑部，内脏供血就会相应减少，导致肝脏乏氧，长此以往，就会对肝脏造成损害。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "01 “为啥是我得癌症”的非学术报告", "x": "因此我每天都很早睡觉，然后每天开始喝绿豆水、吃天然维生素B、吃杂粮粥。然后非常神奇的是，别的病友化疗会导致肝功能越来越差，我居然养好了，第二次化疗时，肝功能完全恢复正常了。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "01 “为啥是我得癌症”的非学术报告", "x": "希望这些文字，对需要帮助的人有所贡献。也真心希望我的朋友们，相信“千里之堤，毁于蚁穴”这句古话。我们是现代人，不可能脱离社会发展的轨迹、现代的生活节奏，以及身边的干扰，那么在能控制的时候多控制，在能早睡的时候尽量善待自己的身体。有些事情，电影也好，BBS也好，K歌也好，想想无非是感官享受，过了那一刻，都是浮云。唯一踩在地上的，是你健康的身体。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "01 “为啥是我得癌症”的非学术报告", "x": "生不如死、九死一生、死里逃生、死死生生之后，我突然觉得一身轻松。不想去控制大局小局，不想去多管闲事淡事，我不再有对手，不再有敌人，我也不再关心谁比谁强，课题也好，任务也罢，暂且放着。世间的一切，隔岸看花，云淡风轻。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "透过生死，你会觉得名利权情都很虚无，尤其是排列第一位的名，说穿了，无非是别人茶余饭后的谈资。无论你名声四海皆知响彻云天，也无非是一时猎奇，各种各样的人揣着各种各样的心态唾沫四溅过后，你仍然是你。其实，你一直是你，只是别人在谈论你的时候，你忘记了你自己是谁而已。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "每逢岁末年初，我总会给自己半天时间，沉浸在书房里，点灯如豆，任思潮如水，翻卷回荡。一年总是需要一次面对自我的反省，想想得失。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "我尽量不去写苦难，因为现在的我，内心深处依然有那么一点试图回避回忆苦痛的懦弱，虽然我可以大声说我已足够坚强，但是，那种黑暗的疼痛实在太可怕了，我不敢不能也不想去把它化为文字。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "其实我写这些，只想告诉所有人：再大的苦痛，都会过去。失恋也好，事业失败也好，婚姻破裂也好，哪怕得绝症也好，神马（什么）都是浮云。 我不太喜欢尼采，但是我喜欢他那句——凡是不能杀死你的，最终都会让你更强。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "我嘱咐她，土豆每年生日的时候，带他去看看我，顺便也去过过村野田园的生活。我让他们一定照顾好自己，只有照顾好自己，才能在关键时刻替我照顾土豆。说这个的时候我有些控制不住，我在拷问自己，究竟放不下的是土豆还是自己的父母。我知道土豆会有很多人爱，光头会照顾好他，而妈妈和爸爸是我最不放心的，但是不懂为什么，我却最不舍得那个刚刚学会叫妈妈的胖滚滚的娃娃。那一刻突然想到了《红楼梦》里的《好了歌》，想到那两句“世人都晓神仙好，只有儿孙忘不了”。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "我甚至想，哪怕就让我那般痛，痛得不能动，每日像个瘫痪病人，污衣垢面趴在国泰路、政立路的十字路口上，任千人唾骂万人践踏，只要能看着我爸妈牵着土豆的手蹦蹦跳跳去幼儿园上学，我也是愿意的。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "02 我的二〇一〇", "x": "世上很多事，没有经历之时，你会认为非常可怕惊骇，而确确实实落在你头上，需要你迎头赶上，你要知道，万事无非如此。世上万事并不可怕，你认为可怕的次数多了，也就成了可怕。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "03 写给我的宝贝", "x": "许是太苍老，该经历的都经历了；许是太年轻，该经历的都还没有去经历。因为不再青葱，所以不会再故作沧桑想什么是岁月、什么是人生；因为还没有成熟，所以也不会那般总结性地去想什么是成就、什么是得失。该有的日子会那么一天天过去，现世安稳，岁月静好，理应是现实生活最平稳的底色。至于人生梦想，且做个信念，有如锦上添花的金丝线，若不得机会绣上去，不添花也没有啥，也罢了。毕竟，人不能没有心气儿，却不是仅仅活那口子心气儿。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "03 写给我的宝贝", "x": "不由得感叹中国汉语文化的博大精深。分，就是把刀插在人心里，硬生生把原本连在一起的东西分开。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "03 写给我的宝贝", "x": "人之一生，犹如赶路，背负行囊，马不停蹄，从起点到终点，从生到死，奔波劳碌中也遇人无数。能有缘遇到，同路，并肩走上一程，即算缘分和幸事。然而人生的残酷在于，绝少或者没有人能一路相陪。如果有，那么其中一个为了对方而付出了自己的一生。因此，哪怕是父母、夫妻、挚友都难逃此局。所以，人，注定了要学会一个人走。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "04 碎落在身后的时光", "x": "有太多的计划要完成，有太多的事情要应付，总是觉得等做好了手头的事情，陪父母也是来得及的。反正人生很长，时间很多。现在想想并不尽然，只有一天天地过，才是一年年，才是一辈子。无头绪地追逐与奔忙，一旦站定思考，发现半辈子已经过去，自己手里的成败并无多少意义。然后转身，才发现陪伴父母亲人的时间已然无多，发现最重要的幸福已然没有时间享用。人生最大的悲哀莫过于此。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "04 碎落在身后的时光", "x": "有太多的计划要完成，有太多的事情要应付，总是觉得等做好了手头的事情，陪父母也是来得及的。反正人生很长，时间很多。现在想想并不尽然，只有一天天地过，才是一年年，才是一辈子。无头绪地追逐与奔忙，一旦站定思考，发现半辈子已经过去，自己手里的成败并无多少意义。然后转身，才发现陪伴父母亲人的时间已然无多，发现最重要的幸福已然没有时间享用。人生最大的悲哀莫过于此。", "y": "", "d": "2020-06-01"}, {"k": "h", "c": "05 远在天涯", "x": "有些特质你一直假装一直假装，最后会变成真正拥有那种特质。比方勇敢，比方独立，比方聒噪。", "y": "", "d": "2020-06-01"}]}, {"id": "3300069211", "title": "成为作家（创意写作书系）", "author": "多萝西娅·布兰德", "cats": ["文学-文学鉴赏"], "bmCount": 15, "rvCount": 0, "notes": [{"k": "h", "c": "译者序 作家是可以培养的", "x": "大作家的作品万变不离其宗，都是各种传记和回忆录的变体。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "译者序 作家是可以培养的", "x": "写作的独特性在于：你的经验和道理可以与人分享。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "第一个练习", "x": "另找一个时间，尽量做到镇静放松——不要有任何手势——告诉自己是如何一步一步梳理自己的头发。（你会发现这比你想象的困难。）再次，描述一下自己做的任何一件日常小事。再往后，想一件前天的小事：看看自己如何开始做这件事，又是如何从中脱身，就好像自己在亲眼看一个陌生人一样。再换一个时间，想想如果你能跟随自己一整天，你看起来是什么模样。运用写小说的眼睛观察自己，看看你如何走进走出房间，走到街上，走进商店，在天黑时又回到家中，这一天你的表现如何。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "朝不费劲的写作努力", "x": "要做到这一点最好的方法是：比你习惯的起床时间早起半小时或一个小时。尽可能地早起——不要说话，不要读报纸，不要抓起你前一天晚上放在身旁的书来读——立即开始写作。想到什么写什么：昨夜的梦，如果你还能记得的话；前天的活动；真实的或虚构的谈话；对意识的检查。将清晨的记忆快速而不加评判地写下来。你写得好坏或有用与否并不重要。事实上，在这种素材中你的发现会比你预期的更有价值。但是现在你的基本目的不是写出不朽的文字，而是写下任何文字，只要不是一派胡言就行。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "你的承诺事关荣誉", "x": "写什么都行。不管内容有没有意思，不管是押韵的五行打油诗还是无韵诗；写写你对上司、秘书或老师的看法；写一个故事大纲或对话片段，或描写一个你最近注意到的人。不管写得多么缺乏连贯、马虎潦草，都要坚持写下去。如果你必须写，你就能写。“我发现这个练习相当困难”，那么写出来你认为造成这种困难的理由。一天一天地改变抱怨，直到你再也不会觉得困难。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "要么成功，要么放弃", "x": "早晨写作和预先安排时间进行写作——应该一直保持下去，直到你能够随心所欲地写出流畅的文字。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "读两遍", "x": "要像作家那样阅读，唯一的途径就是任何东西都要读两遍。对于需要研究的故事、文章或小说，都要很快地不加评论地读上一遍，就像当你对一本书没有要求而只是欣赏它的时候一样。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "总结判断与细节分析", "x": "对刚读过的书写一个简短的大纲，做一个总结评价：你喜欢它，或不喜欢它；相信它，或留有疑问；你喜欢其中的一部分，而对其余部分不感兴趣。（以后如果你喜欢，也可以对它做一个道德评判，但是现在你只要能够辨明就行，最好把你的判断力限制在作者意图上。）对刚读过的书写一个简短的大纲，做一个总结评价。继续扩大这些单调的问题。如果你喜欢，为什么喜欢？如果你开始给出的答案含糊不清，也不要气馁。你还要再读一遍那本书，这样就会有第二次机会看看你能否发现原因所在。如果你觉得这本书只有一部分是好的，而其余部分相对较弱，看看你是否能够看出来这个作者什么地方让你不满意：是因为人物雷同描写得不好，还是偶尔出现了情节不连贯呢？你是否知道你之所以有这种感觉的原因是什么？", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "对抗单调", "x": "挑选一位作家，他的风格要对你自己有帮助。这样无论从句子构成、文风节奏等方面，你都能从中受益良多。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "再次体验纯真的眼神", "x": "每天抽出半个小时，让你自己返回到五岁孩子时的状态，睁大眼睛，充满兴趣地打量这个世界。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "再次体验纯真的眼神", "x": "在你经过的大街上，让自己像一个陌生人一样睁大眼睛。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "大街上的陌生人", "x": "提醒你自己，在十五分钟的时间内，目光所及，你都要专心致志，并且要描述你看到的每一件事和每一样东西。比如，大街上的车辆：外表是什么颜色？（不仅仅说出绿色还是红色，而要说出是正绿色还是橄榄绿，是猩红色还是褐紫色。）车门入口在什么地方？它有一个售票员和一个司机，还是只有一个司机兼售票员？车的里面是什么颜色？车身、地板、座位还有广告招贴画是什么颜色？座位朝哪个方向？坐在你对面的人是谁？坐在你身边的人穿什么衣服？他们坐着或站着的样子如何？他们在读什么书？他们是否在打瞌睡？你听到了什么声音，闻到了什么味道？你手握扶手是什么感觉？或者从你身边蹭过去的人所穿的大衣是什么料子？过一会儿你就可以暂停一下你这种密切的观察，但是要做好准备，等到场景变化之后再重新开始。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "大街上的陌生人", "x": "下一次把注意力集中在你对面的人身上。她从哪里来？要到哪里去？从她的面庞、态度和衣着上，你能对她了解多少？发挥你的想象力，她的家是什么样？[插图]", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "难以捉摸的品质", "x": "从某种意义上说，每个人都是独一无二的。在那个国家的那个特定的历史时刻，你的父母只生下你一个；没有人的经历恰好和你相同，没有人的结论和你一模一样，没有人面对这个世界的想法和你分毫不差。如果你能够和自己友好相处，能够而且愿意精确地说出你对任何一种情形或一个人的看法，如果你能够讲出一个好像包括地球上所有人在内只有你自己看到的故事，你自然而然地就有了一篇原创作品。", "y": "", "d": "2024-06-07"}, {"k": "h", "c": "“你的愤怒和我的愤怒”", "x": "赋予你的写作以最终价值的是你的洞察力和真知灼见；只要你写作时头脑清晰、思想诚实，就不会落入俗套。", "y": "", "d": "2024-06-07"}]}, {"id": "3300084127", "title": "人生实难，大道多歧：书信里的中国文学巨匠（微信读书出品）", "author": "张春田", "cats": ["文学-散文杂著"], "bmCount": 14, "rvCount": 0, "notes": [{"k": "h", "c": "第1讲 陈独秀致胡适：可与共事之人，虽殊途亦神交颇契", "x": "它至少揭示了陈、胡二人性格上的巨大差异。然而，正是性格如此迥异的两个人，最初能够互相欣赏，共同发出“将令”；后来又能坦诚相待，惺惺相惜。这完全印证了陈独秀在信中所说的“神交颇契”。或许这既体现了中国文化传统中的“友道”，也证明了他们对生命中理想主义的忠诚。", "y": "", "d": "2024-02-12"}, {"k": "h", "c": "第2讲 鲁迅致许广平：跨入穷途，在刺丛里姑且走走", "x": "跨入穷途，在刺丛里姑且走走", "y": "", "d": "2024-02-12"}, {"k": "h", "c": "第2讲 鲁迅致许广平：跨入穷途，在刺丛里姑且走走", "x": "但是鲁迅也明确表示：人生的歧路和穷途众多，重要的是拥有一种韧性，不被困难击垮，不轻言放弃，要像大象一样结实，流点血也不要紧，反而要跳到刺丛中闯一闯。在进取与超脱、奋进与虚无、执着与散淡之间寻得一种平衡。\n在漫长的人生旅途中，我们何不学一学迅哥儿的智慧？", "y": "", "d": "2024-02-12"}, {"k": "h", "c": "第3讲 鲁迅致台静农：人生实难，大道多歧", "x": "自己的记忆“好像被刀刮过了的鱼鳞”", "y": "", "d": "2024-02-12"}, {"k": "h", "c": "第3讲 鲁迅致台静农：人生实难，大道多歧", "x": "台静农写过一篇《酒旗风暖少年狂》，是我读过的关于陈独秀晚年生活最优秀的纪念文章。", "y": "", "d": "2024-02-12"}, {"k": "h", "c": "第3讲 鲁迅致台静农：人生实难，大道多歧", "x": "台静农晚年最常引用的一句话是“人生实难，大道多歧”。前半句因陶渊明的引用而广为人知，表达了对人生无常的感慨；后半句则出自《列子》中的寓言，描述了竹林七贤之一的阮籍驾车出行，“车迹所穷，辄痛哭而返”。", "y": "", "d": "2024-02-12"}, {"k": "h", "c": "第13讲 张爱玲致胡适：沉溺世俗，但追求平淡而近自然", "x": "摇摆着，轻倩地掠过。", "y": "", "d": "2024-02-14"}, {"k": "h", "c": "第20讲 周作人的东京记忆：我爱好那个地方，有第二故乡之感", "x": "《诗经》中说：“东有启明，西有长庚。”现代天文学证实，它们实际上是同一颗星——金星，然而古人误认为它们是两颗星，一个出现在早上，一个出现在晚上。所以，有人将后来鲁迅和周作人兄弟失和，终身不再相见，归因于他们的名字已经预示了这种分道扬镳的命运。当然，这只是一种附会。尽管如此，他们在决裂后，各自将性格、才华和观点发挥到了极致，引领了现代文化的两个方向和范式，从这个角度来看，这种说法也不失为准确。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第20讲 周作人的东京记忆：我爱好那个地方，有第二故乡之感", "x": "性格中的好静以及平和冲淡", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第22讲 “大正浪漫”中的中国留学生（下）", "x": "易漱瑜", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第23讲 理想的校长蒋梦麟：开眼界看世界的实践者", "x": "蒋梦麟", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第23讲 理想的校长蒋梦麟：开眼界看世界的实践者", "x": "在急遽递嬗的历史中，我自觉只是时代巨轮上一颗小轮齿而已。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第23讲 理想的校长蒋梦麟：开眼界看世界的实践者", "x": "只要能够找到听众，谁都可以评论古今，臧否时政。”这些其实就是今天我们经常会提到的所谓“公私界限”、所谓“消极自由”，蒋梦麟在当时就有了深刻的体会。", "y": "", "d": "2024-02-19"}, {"k": "h", "c": "第24讲 斜杠青年赵元任：好的人生，都是玩儿出来的！", "x": "赵元任曾遍访中国各地考察方言。他的语言能力优秀到什么程度呢？有一个例子可以说明一切。1920年，英国哲学家罗素在中国讲学，赵元任一路陪同担任翻译。每到一个地方，赵元任都能用当地方言帮罗素进行翻译。而这些方言，多数都是他途中新学的，然后现学现卖，竟然特别地道。", "y": "", "d": "2024-02-19"}]}, {"id": "928782", "title": "人生如逆旅，我亦是行人", "author": "余光中", "cats": ["文学-散文杂著"], "bmCount": 14, "rvCount": 0, "notes": [{"k": "h", "c": "四月，在古战场", "x": "春天来齐的时候，这一带的花树将盛放如放烟火", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "四月，在古战场", "x": "浪费昂贵的晴日，独自坐在夕照里，数那边哥特式塔楼的钟声，敲奏又一个下午的死亡。然而春天，史前而又年轻的春天，是不可抗拒的。知更说，春从空中来。鲈鱼说，春从海底来。土拨鼠说，春是从地底来的，不信，我掘给你看。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "可是他的兴奋，是记忆，而不是展望。记忆里，有许多云、许多风，许多风筝在风中升起。至渺至茫，逝去的风中逝去那些鸟的游伴，精灵的降落伞，天使的驹。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "最漂亮的天空，是风筝季的天空。无意间发现远方的地平线上浮着一只风筝，那感觉，总是令人惊喜的。只要有一只小小的风筝，立刻显得云树皆有情，整幅风景立刻富有牧歌的韵味。如果你是孩子，那惊喜必然加倍。如果那风筝是你自己放上天去的，而且越放越高，风力越强，那种胜利的喜悦，当然也就加倍亲切而且难忘。他永远忘不了在四川的那几年。丰硕而慈祥的四川，山如摇篮水如奶，取之不尽，用之不竭。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "男孩的意向是风的意向，少年时的思想是长长的思想。”", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "看地图，是梦的延长。看厚厚的翻译小说，喃喃咀嚼那些多音节的奇名怪姓，是梦的延长。放风筝也是。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "你真是笨屁瓜！", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "放风筝的人应该是哲学家，还是诗人？这件事，人做一半，风做一半，谋事在人，成事在天。表面上，人和自然是对立的，因为人要拉住风筝，而风要推走风筝，但是在一拉一推之间，人和自然的矛盾竟形成新的和谐。这种境界简直有点形而上了。但这种经验也是诗人的经验，他想。一端是有限，一端是无垠。一端是微小的个人，另一端，是整个宇宙，是整个太空的广阔与自由。你将风筝，不，自己的灵魂放上去，放上去，上去，更上去，去很冷很透明的空间，鸟的青衢云的千叠蜃楼和海市，最后，你的感觉是和天使在通电话，和风在拼合，和迷迷茫茫的一切在心神交驰。这真是最最快意的逍遥游了。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "焚鹤人", "x": "一瞬间，分不清是风云攫去了你的心，还是你掳获了长长的风云，而风云固仍在天上，你仍然立在地上。你把自己放出去，你把自己收回来，你是诗人。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "金陵子弟江湖客", "x": "掉头一去是风吹黑发，回首再来已雪满白头。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "开卷如开芝麻门", "x": "一个人的经验当然以亲身得来的最为真切可靠，可是直接的经验毕竟有限。读书，正是吸收间接的经验。生活至上论者说读书是逃避现实，其实读书是扩大现实，扩大我们的精神世界。就算是我们的亲身经验，也不妨多听听别人对相似的经验有什么看法，以资印证。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "开卷如开芝麻门", "x": "空间。英国文豪约翰生说：“写作的唯一目的，是帮助读者更能享受或忍受人生。”倒过来说，读书的目的也在加强对人生的享受，如果你得意；或是对人生的忍受，如果你失意。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "娓娓与喋喋", "x": "发现自己内心的真相，需要性格的力量。唯勇者始敢单独面对自己；唯智者才能与自己为伴。一般人的心灵承受不了多少静默，总需要有一点声音来解救。所以卡莱尔说：“语言属于时间，静默属于永恒。”可惜这妙念也要言诠。", "y": "", "d": "2020-06-08"}, {"k": "h", "c": "猛虎和蔷薇", "x": "“我心里有猛虎在细嗅蔷薇。”人生原是战场，有猛虎才能在逆流里立定脚跟，在逆风里把握方向，做暴风雨中的海燕，做不改颜色的孤星。有猛虎，才能创造慷慨悲歌的英雄事业；蕴涵耿介拔俗的志士胸怀，才能做到孟郊所谓的“镜破不改光，兰死不改香！”同时人生又是幽谷，有蔷薇才能烛隐显幽，体贴入微；有蔷薇才能看到苍蝇控脚，蜘蛛吐丝，才能听到暮色潜动，春草萌芽，才能做到“一沙一世界，一花一天国”。", "y": "", "d": "2020-06-08"}]}, {"id": "914624", "title": "羊道三部曲：春牧场+前山夏牧场+深山夏牧场", "author": "李娟", "cats": ["文学-散文杂著"], "bmCount": 12, "rvCount": 1, "notes": [{"k": "h", "c": "自序", "x": "所有的文字都在制造距离，所有的文字都在强调他们的与众不同。而我，更感动于他们与世人相同的那部分，那些相同的欢乐、相同的忧虑与相同的希望。", "y": "", "d": "2022-05-19"}, {"k": "h", "c": "春牧场(3)", "x": "童年是漫无边际的，劳动是光荣的，长大成人是迫切的。胡安西的世界只有这么大的时候，他的心也安安静静地只有这么大。他静止在马不停蹄的成长之中，反复揉搓这颗心，像卡西反复揉面一样，越揉越筋道。他无意识地在为将来成为一个合格的牧人而宽宽绰绰地做准备。", "y": "", "d": "2022-06-21"}, {"k": "h", "c": "春牧场(3)", "x": "这是世上最古老的牧场。在这里，活着与死亡的事情都会被打磨去尖锐突兀的棱角。在这里，无论一个生命是最终获救还是终于死亡，痛苦与寒冷最后一定会远远离它而去。都一样的，其实都一样的吧？其实到头来所有的牵挂都是无用的……又似乎更多的，我不是为着怜悯那马而难过，而是为自己的微弱无力而难过。", "y": "", "d": "2022-06-21"}, {"k": "h", "c": "春牧场(4)", "x": "节制情感并不是麻木冷漠的事情。我知道他们才不是残忍的人，他们的确没我那么着急、难过，但到头来却做得远远比我多。只有他们才真正地付出了努力和善意。", "y": "", "d": "2022-06-21"}, {"k": "h", "c": "春牧场(4)", "x": "“一切总会过去”——我仅仅是能想通这个道理而已，却不能坚守那样的态度。", "y": "", "d": "2022-06-21"}, {"k": "h", "c": "春牧场(4)", "x": "他们一开始就知道悲伤徒劳无用，知道叹息无济于事，知道“怜悯”更是可笑的事情——“怜悯”是居高临下的懦弱行为。他们可能还知道，对于所有将死的事物不能过于惋惜和悲伤，否则这片大地将无法沉静、永不安宁。", "y": "", "d": "2022-06-21"}, {"k": "t", "c": "春牧场(4)", "x": "告别寒冷空旷的冬牧场当然是快乐的事。做一只春羔看上去远比冬羔幸福——能够降生在温暖又干燥的春牧场，白天被太阳烤得浑身暖烘烘的，柔软的小卷毛喜悦地蓬松着，黑眼睛那么的美，那么的宁静。夜里则和小朋友们挤在一起，紧紧蜷着身子，沉入平安的睡眠中，深深地、浓黏地成长。不远处的星空下，母亲们静默跪卧，头朝东方，等待天亮。", "y": "工作日的中午，短暂逃离到春牧场。🐑🍃", "d": "2022-06-23"}, {"k": "h", "c": "春牧场(9)", "x": "看来生活再艰辛也不能将就着过日子啊……漂漂亮亮、从从容容地出现在大家面前，不仅是虚荣的事，更是庄重与自信的事。", "y": "", "d": "2022-07-13"}, {"k": "h", "c": "春牧场(12)", "x": "她从容地立足于宽广的陌生之中，生活得看起来有条有理。她更像是这个传统家庭小心地伸往外部世界的柔软触角。大家都暗地里钦佩她，信任她，并且微妙地依赖着她。", "y": "", "d": "2022-07-21"}, {"k": "h", "c": "春牧场(14)", "x": "像我这样懦弱的人，总是不停地担忧这担忧那的人，过得好辛苦啊。这也是我的命运。", "y": "", "d": "2022-08-08"}, {"k": "h", "c": "春牧场(14)", "x": "旷野中，小羊凄惨悠长地咩叫，大羊听到的话一定会心碎的。但如果那时大羊已经静悄悄地在这原野中的某个角落死去，它就再也不会悲伤了。小羊也会很快忘记一切，埋首于新牧场的青草丛中，头也不抬，像被深深满足了一切的愿望。", "y": "", "d": "2022-08-08"}, {"k": "h", "c": "春牧场(14)", "x": "然而这世上所有一出生就承受着缺憾的生命，在终日忍受疼痛之外，同样也需要体会完整的成长过程，同样需要领略活着的幸福。", "y": "", "d": "2022-09-15"}, {"k": "h", "c": "春牧场(14)", "x": "现实的痛苦让人一句话也说不出口。除了忍受，只能忍受。", "y": "", "d": "2022-09-15"}]}, {"id": "39303162", "title": "最好的决定（知更鸟系列）", "author": "梅根·多姆", "cats": ["文学-散文杂著"], "bmCount": 12, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "走蜿蜒往复甚至常会带来痛苦的道路向自己认定的终点进发", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "前言", "x": "勇敢，有思想深度，带着毫无保留的坦诚", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "前言", "x": "和女性相比，男性在生儿育女之事上（至少在孩子出生之前）鲜有严肃思考，而女性自打出生就要面临这个问题，耳濡目染之下，一辈子都会对这件事有所思量。", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "前言", "x": "在婚姻和生养的藩篱之外找到了幸福", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "前言", "x": "愿你和我一样，觉得这些文章迷死人又气死人，让人愉快又给人启迪。", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "森林里的孩子们", "x": "关心和担忧没完没了，操不完的心至死方休。我不确定自己有这种本事。也许，我是某种人形的水晶洞：晶晶闪亮，但空空如也。", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "母性", "x": "社会性本身就具有可变性。", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "母性", "x": "新工业时代的劳工分类依据性别而定，男性去工作，女性在家养育子女（在此之前，几乎所有人都在家工作）", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "母性", "x": "女人们总会忘记去声张，去索求补偿，因为女人们过于确信：这种社会安排是符合“自然”规律的。心甘情愿地把不公正称作“自然”现象，我们就这样把自己送进了当今社会的傻瓜专用通道。", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "母性", "x": "当妈，还是当职业女性？但这并不是两难选择，而是伪装成自然性的社会性选择，是社会组织的产物。", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "母性", "x": "我总觉得那种生活方式太束手束脚，太按部就班，哪怕我也见过有些辣妈一边带孩子一边维持优雅时髦（通常来讲，这些妈妈都有大把的育儿资源可用）", "y": "", "d": "2025-04-10"}, {"k": "h", "c": "别的事，成百上千", "x": "我没有孩子，也庆幸自己没有，哪怕曾有一度无比期盼如云霓之望。", "y": "", "d": "2025-04-10"}]}, {"id": "CB_E9L3h53fOFTU6sq6sv74x9NR", "title": "写下来，痛苦就会过去", "author": "弗吉尼亚·伍尔夫", "cats": [], "bmCount": 12, "rvCount": 0, "notes": [{"k": "h", "c": "1918", "x": "我从此书中没能得到什么启迪以镜鉴生活。", "y": "", "d": "2024-12-18"}, {"k": "h", "c": "1919", "x": "肆意和杂乱", "y": "", "d": "2024-12-18"}, {"k": "h", "c": "1919", "x": "现在我可以夸赞一下日记的长处了。它具有一种蜻蜓点水的活力，有时候言必有中。更佳之处在于，这于我而言是种很好的练习，能助我表达自如。", "y": "", "d": "2024-12-19"}, {"k": "h", "c": "1919", "x": "所以，别在意那些瑕疵和失误。", "y": "", "d": "2024-12-19"}, {"k": "h", "c": "1919", "x": "说真的，外界褒贬无常，一个人的境界该是宠辱不惊。", "y": "", "d": "2024-12-19"}, {"k": "h", "c": "1919", "x": "能够浅斟慢酌的快乐", "y": "", "d": "2024-12-19"}, {"k": "h", "c": "1919", "x": "那感觉就像是我在柔韧的云朵和软绵绵的山坡之间舒舒服服地打了个滚，又一下子回到了人间。", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "1920", "x": "说真的，三十八岁的我无疑要比二十八岁时快乐得多，今日更胜昨日", "y": "", "d": "2024-12-20"}, {"k": "h", "c": "1925", "x": "现在我早起之后最喜欢一个人待一整天。我会以一种轻松自然的姿势，做一点点印刷工作；会安静地潜入思维深处，遨游在我的思想世界；也会在晚间读斯威夫特，这使我的思维充盈而丰富。", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "1926", "x": "思想的丰富与语言的流畅就是写作的目的。", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "1926", "x": "炽热的夏天已经有迹可循", "y": "", "d": "2025-02-20"}, {"k": "h", "c": "1926", "x": "夏天总是很热的，只是云朵很少见。", "y": "", "d": "2025-02-20"}]}, {"id": "3300072988", "title": "庆祝什么也不干的一天：智利生活手记", "author": "园有桃", "cats": ["文学-散文杂著"], "bmCount": 12, "rvCount": 0, "notes": [{"k": "h", "c": "在一群油腻的人之间，他是个少年", "x": "他不是打量你，而是看着你的眼睛、表情、头发和手。他完全不在意你在宇宙中的位置，不在意你是不是失业了，是不是背着一只昂贵的包，他不在意这些社会性的你，他只在意你本身。面对这样一种态度，你愿意毫不羞涩地敞开自己，不会担心跌入什么陷阱或者人际的圈套。他的诚意完全让人释放心中的疑虑。", "y": "", "d": "2024-08-08"}, {"k": "h", "c": "在一群油腻的人之间，他是个少年", "x": "无论在多混乱、嘈杂的情况下，他永远坐得住，书也读得进，该干吗干吗，完全不受影响。", "y": "", "d": "2024-08-08"}, {"k": "h", "c": "在一群油腻的人之间，他是个少年", "x": "别人生活什么样，他从不关心，也似乎从未羡慕过别人的生活。要是朋友得到好消息，他也真诚地感到高兴。他不是靠制定目标去生活，也不攀比，而是靠愉悦、正义和意义来生活。", "y": "", "d": "2024-08-08"}, {"k": "h", "c": "在一群油腻的人之间，他是个少年", "x": "对消费主义的厌恶", "y": "", "d": "2024-08-08"}, {"k": "h", "c": "在一群油腻的人之间，他是个少年", "x": "我每天看书，但享受只是一部分，另外一大半是填满我茁壮的好奇心。我觉得我需要这个知识，要搞明白一些事情，搞明白自己，总是有个目的。因此有的书是使劲啃下来的，啃的时候未必愉悦，是饿了知道自己必须吃，不爱吃也得吃下去。", "y": "", "d": "2024-08-08"}, {"k": "h", "c": "在一群油腻的人之间，他是个少年", "x": "他从不做“大的计划”​，不列“大的意义”​。他", "y": "", "d": "2024-08-08"}, {"k": "h", "c": "第三部分 一个智利家庭的缩影", "x": "那颗浪漫的、感情充沛的心", "y": "", "d": "2024-08-09"}, {"k": "h", "c": "第三部分 一个智利家庭的缩影", "x": "美得像只小鹿，轻盈、开朗", "y": "", "d": "2024-08-09"}, {"k": "h", "c": "第三部分 一个智利家庭的缩影", "x": "只要在创作，谁都是艺术家", "y": "", "d": "2024-08-09"}, {"k": "h", "c": "我那“自私”的智利婆婆", "x": "你真像只漂亮的鸟儿啊！", "y": "", "d": "2024-08-09"}, {"k": "h", "c": "庆祝什么也不干的一天", "x": "天空总是很好看，月亮挂在天上也好看，云就更别提了，云彩上才是天上人间。", "y": "", "d": "2024-08-09"}, {"k": "h", "c": "庆祝什么也不干的一天", "x": "去爬山，骑自行车，去一些郊区的寺庙，傍晚一身是汗才回家。", "y": "", "d": "2024-08-09"}]}, {"id": "651125", "title": "龙应台“人生三书”之二：亲爱的安德烈", "author": "龙应台", "cats": ["文学-散文杂著"], "bmCount": 12, "rvCount": 0, "notes": [{"k": "h", "c": "第5封信 对玫瑰花的反抗", "x": "人生，其实像一条从宽阔的平原走进森林的路。在平原上同伴可以结伙而行，欢乐地前推后挤、相濡以沫；一旦进入森林，草丛和荆棘挡路，情形就变了，各人专心走各人的路，寻找各人的方向。那推推挤挤同唱同乐的群体情感，那无忧无虑无猜忌的同侪深情，在人的一生中也只有少年期有。离开这段纯洁而明亮的阶段，路其实可能愈走愈孤独。你将被家庭羁绊，被责任捆绑，被自己的野心套牢，被人生的复杂和矛盾压抑，你往丛林深处走去，愈走愈深，不复再有阳光似的伙伴。到了熟透的年龄，即使在群众的怀抱中，你都可能觉得寂寞无比。", "y": "", "d": "2018-02-19"}, {"k": "h", "c": "第6封信 一切都是小小的", "x": "我们这个年龄的人啊，每个人都在走自己的路，每个人都在选择自己的品味，搞自己的游戏，设定自己的对和错的标准。一切都是小小的、个人的，因为，我们的时代已经不再有“伟大”的任何特征。", "y": "", "d": "2018-02-19"}, {"k": "h", "c": "第11封信 阳光照亮你的路", "x": "这段路上，两旁全是麦田，麦田边满满是野生的罂粟花，在苹果树下，开得火红。我开得很慢，秋夜的空气里，流荡着酸酸的苹果香。", "y": "", "d": "2018-02-19"}, {"k": "h", "c": "第11封信 阳光照亮你的路", "x": "我们自己心里的痛苦不会因为这个世界有更大或者更“值得”的痛苦而变得微不足道；它对别人也许微不足道，对我们自己，每一次痛苦都是绝对的，真实的，很重大，很痛。", "y": "", "d": "2018-02-19"}, {"k": "h", "c": "第17封信 你是哪国人？", "x": "和你的缘分，在这一生中，将是一次又一次地看着你离开，对着你的背影默默挥手。", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第17封信 你是哪国人？", "x": "陌生人，很快可以变成朋友，问题是，朋友，更快地变成陌生人，因为你不断地离开。", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第21封信 文化，因为逗留", "x": "亲爱的安德烈：我是多么地享受你和你母亲的对话。而且，我是多么、多么地羡慕你和自己的母亲可以这样开放地沟通。", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第22封信 谁说香港没文化？——菲力普给安德烈的信", "x": "只有我们了解和认可的文化，才是文化吗？要不然，就是不入流的文化吗？谁定的标准呢？为何我们都应该遵守这样的标准呢？", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第28封信 给河马刷牙", "x": "可是，很多人在内心深处其实都藏着一小片泥土和部落——我们土里土气的、卑微朴素的原乡。表面上也许张牙舞爪，心里其实深深呵护着一个青涩而脆弱的起点。", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第28封信 给河马刷牙", "x": "我怕你变成画长颈鹿的提摩，不是因为他没钱没名，而是因为他找不到意义。我也要求你读书用功，不是因为我要你跟别人比成就，而是因为，我希望你将来会拥有选择的权利，选择有意义、有时间的工作，而不是被迫谋生。如果我们不是在跟别人比名", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第32封信 政府的手可以伸多长？", "x": "如果媒体不维持一种高度的批判精神，一个社会是可以集体变“笨”的是不是？香港的媒体在做什么呢？我看见很多香港人很辛苦地在争取普选，可是，媒体还是把最大的力气跟钱花在影星八卦上。那些力气那些钱，为什么不拿来为香港的民主做点努力呢？提供公开论坛，激发公众辩论，挑战政府决策，培养年轻人独立批判精神……老天，不要再讨论禁烟区要多大、准烟牌照要多少钱，比这重要的事，太多了吧。", "y": "", "d": "2018-02-20"}, {"k": "h", "c": "第33封信 人生诘问", "x": "第二天，你们天亮时继续上路，充满了勇气和力量。柴火其实已经灭了，你们带着走、永不磨灭的，是心中的热度和光，去面对前头的冰霜路。谁需要记得柴火呢？柴火本身，又何尝在乎你们怎么记得它呢？", "y": "", "d": "2018-02-20"}]}, {"id": "3300090972", "title": "我走入宁静蔚蓝的日子", "author": "[德]赫尔曼·黑塞", "cats": ["文学-散文杂著"], "bmCount": 10, "rvCount": 1, "notes": [{"k": "h", "c": "山隘", "x": "然而，世界上所有的川流，最后总会汇集在一起，北极冰海与尼罗河终会一起转为潮湿的云。这古老又美丽的平衡，平添此刻的神圣之感；对于像我这样的游子而言，每一条路都是回家的路。", "y": "", "d": "2024-12-21"}, {"k": "h", "c": "山隘", "x": "如今，我已不再如痴如醉，也不再想将远方的美丽及自己的快乐和所爱的人分享。", "y": "", "d": "2024-12-21"}, {"k": "h", "c": "山隘", "x": "我的眼光满足于所见的事物；因为学会了看，从此世界变美了。", "y": "", "d": "2024-12-21"}, {"k": "h", "c": "山隘", "x": "世界变美了。我孤独，但不为寂寞所苦。我别无所求。我乐于让阳光将我完全晒熟，我渴望成熟。我迎接死亡，乐于重生。世界变美了。", "y": "", "d": "2024-12-21"}, {"k": "h", "c": "农庄", "x": "过去，凡尘俗事浪费了我太多的心神，在那样的生活中，即使困难重重，仍不得不为生存寻找理由。然而，还有不同的生活方式吗？", "y": "", "d": "2024-12-21"}, {"k": "h", "c": "南方夏日", "x": "太阳无视这些琐事，依旧东升；", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "南方夏日", "x": "纵有再多愿望，最后总是成空；生命何其可悲，我们何其愚痴地忍着悲哀过日子。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "南方夏日", "x": "人生苦短，我们却费尽思量，无所不用其极地丑化生命，让生命更为复杂。仅有的好时光，仅有的温暖夏日与夏夜，我们当尽情享受。", "y": "", "d": "2024-12-22"}, {"k": "h", "c": "提契诺夏夜", "x": "这些令我们如痴如醉的人、事、物，是平台下面的人们所忽视的。对于村民习以为常的东西，我们既羡又爱，但他们却羡慕某些我们早已厌烦的奇怪事物和习惯。", "y": "", "d": "2024-12-24"}, {"k": "h", "c": "夏日终曲", "x": "老者何等幸福\n炉热，酒红\n甚至平静地迎接死神——\n只是，且慢，不在今朝！", "y": "", "d": "2024-12-25"}, {"k": "t", "c": "全书想法", "x": "", "y": "“我别无所求，只想被阳光晒透。”", "d": "2025-01-21"}]}, {"id": "3300102674", "title": "好运设计（独家首发）", "author": "史铁生", "cats": ["文学-散文杂著", "文学-经典作品"], "bmCount": 11, "rvCount": 0, "notes": [{"k": "h", "c": "1", "x": "生在穷乡僻壤，有孤陋寡闻之虞，不好。生在贵府名门，又有骄狂愚妄之险，也不好。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "1", "x": "既知晓人类文明的丰富璀璨，又懂得生命路途的坎坷艰难，这样的位置怎么样？嗯，不错。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "3", "x": "没有挫折，没有坎坷，没有望眼欲穿的企盼，没有撕心裂肺的煎熬，没有痛不欲生的痴癫与疯狂，没有万死不悔的追求与等待，当成功到来之时你会有感慨万端的喜悦吗？在成功到来之后还会不会有刻骨铭心的幸福？或者，这喜悦能到什么程度？这幸福能被珍惜多久？会不会因为顺利而冲淡其魅力？会不会因为圆满而阻塞了渴望，而限制了想象，而丧失了激情，从而在以后漫长的岁月中只是遵从了一套经济规律、一种生理程序、一个物理时间，心路却已荒芜，然后是腻烦，然后靠流言蜚语排遣这腻烦，继而是麻木，继而用插科打诨加剧这麻木——会不会？会不会是这样？", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "3", "x": "所谓好运，所谓幸福，显然不是一种客观的程序，而完全是心灵的感受，是强烈的幸福感罢了。幸福感，对了。没有痛苦和磨难你就不能强烈地感受到幸福", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "4", "x": "苦尽甜来，对，只要是苦尽甜来其实怎么都行，生生病呀，失失恋呀，要要饭呀，挨挨揍呀（别揍坏了），被抄抄家呀，坐坐冤狱呀，只要能苦尽甜来其实都不是坏事。怕只怕苦也不尽，甜也不来。其实都用不着甜得很厉害，只要苦尽也就够了。其实都用不着什么甜，苦尽了也就很甜了。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "4", "x": "不过这样你就仍然要有痛苦，一直要有。是的是的，一时没有了痛苦的衬照便一时没有了幸福感。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "4", "x": "你能够不断地克服困难，你能够不断地跨越距离，你能够不断地实现你的愿望，这就行了。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "4", "x": "痛苦可以让它不断地有，但你总是能把它消灭，这就行了", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "5", "x": "过程。对，过程，只剩了过程。对付绝境的办法只剩它了。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "5", "x": "过程——只剩了它了。事实上你唯一具有的就是过程。一个只想（只想！）使过程精彩的人是无法被剥夺的，因为死神也无法将一个精彩的过程变成不精彩的过程，因为坏运也无法阻挡你去创造一个精彩的过程，相反你可以把死亡也变成一个精彩的过程，相反坏运更利于你去创造精彩的过程。于是绝境溃败了，它必然溃败。你立于目的的绝境却实现着、欣赏着、饱尝着过程的精彩，你便把绝境送上了绝境。梦想使你迷醉，距离就成了欢乐；追求使你充实，失败和成功都是伴奏；当生命以美的形式证明其价值的时候，幸福是享受，痛苦也是享受。现在你说你是一个幸福的人你想你会说得多么自信，现在你对一切神灵鬼怪说谢谢你们给我的好运，你看看谁还能说不。", "y": "", "d": "2024-07-08"}, {"k": "h", "c": "5", "x": "过程！对，生命的意义就在于你能创造这过程的美好与精彩，生命的价值就在于你能够镇静而又激动地欣赏这过程的美丽与悲壮。", "y": "", "d": "2024-07-08"}]}, {"id": "26278248", "title": "去来集", "author": "史铁生", "cats": ["文学-散文杂著"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "我与地坛", "x": "一个人，出生了，这就不再是一个可以辩论的问题，而只是上帝交给他的一个事实；上帝在交给我们这件事实的时候，已经顺便保证了它的结果，所以死是一件不必急于求成的事，死是一个必然会降临的节日。这样想过之后我安心多了，眼前的一切不再那么可怕。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "我与地坛", "x": "剩下的就是怎样活的问题了。这却不是在某一个瞬间就能完全想透的，不是能够一次性解决的事，怕是活多久就要想它多久了，就像是伴你终生的魔鬼或恋人。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "二", "x": "那时她的儿子还太年轻，还来不及为母亲想，他被命运击昏了头，一心以为自己是世上最不幸的一个，不知道儿子的不幸在母亲那儿总是要加倍的。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "二", "x": "坐在小公园安静的树林里，我闭上眼睛，想：上帝为什么早早地召母亲回去呢？很久很久，迷迷糊糊地，我听见回答：‘她心里太苦了。上帝看她受不住了，就召她回去。’我似乎得到一点儿安慰，睁开眼睛，看见风正从树林里穿过。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "五", "x": "假如世界上没有了苦难，世界还能够存在么？要是没有愚钝，机智还有什么光荣呢？要是没了丑陋，漂亮又怎么维系自己的幸运？要是没有了恶劣和卑下，善良与高尚又将如何界定自己又如何成为美德呢？要是没有了残疾，健全会否因其司空见惯而变得腻烦和乏味呢？", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "五", "x": "看来差别永远是要有的。看来就只好接受苦难", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "五", "x": "——人类的全部剧目需要它，存在的本身需要它。看来上帝又一次对了。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "五", "x": "于是就有一个最令人绝望的结论等在这里：由谁去充任那些苦难的角色？又有谁去体现这世间的幸福、骄傲和快乐？只好听凭偶然，是没有道理好讲的。\n就命运而言，休论公道。", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "六", "x": "你看穿了死是一件无需乎着急去做的事，是一件无论怎样耽搁也不会错过的事，便决定活下去试试", "y": "", "d": "2025-01-29"}, {"k": "h", "c": "六", "x": "消灭恐慌的最有效的办法就是消灭欲望。", "y": "", "d": "2025-01-29"}]}, {"id": "3300063647", "title": "东京八平米", "author": "吉井忍", "cats": ["文学-散文杂著"], "bmCount": 9, "rvCount": 1, "notes": [{"k": "h", "c": "没有冰箱的日子", "x": "我们眼前的“平常”是很脆弱的，总有一天我也得离开八平米，那我想尽量享受目前东京这个城市所提供的便利性。", "y": "", "d": "2024-07-04"}, {"k": "h", "c": "错过“终电”的夜晚", "x": "人生多一分选择，你就多一分自由。", "y": "", "d": "2024-07-04"}, {"k": "h", "c": "错过“终电”的夜晚", "x": "每个人的人生都很有意思", "y": "", "d": "2024-07-04"}, {"k": "h", "c": "错过“终电”的夜晚", "x": "这才是人生嘛，每部电影、每种人生都那么不一样，每个作品都那么好看。那你也一样，和别人不一样没关系，这是好事。", "y": "", "d": "2024-07-04"}, {"k": "h", "c": "听落语，找幸福", "x": "中年人听到这里很想知道抓住“幸福”的感觉到底如何，老太太想了想说，这很难说明，实在要说起来是这样的：“天上有太阳，这些山里头的树木也好，小鸟、昆虫也好，都活得好好的呢，我也活着。然后就觉得这一切非常难得，内心感到庆幸。”", "y": "", "d": "2024-07-05"}, {"k": "h", "c": "代后记 在“小”和“大”之间", "x": "像一根被连根拔起的野草", "y": "", "d": "2024-07-05"}, {"k": "h", "c": "代后记 在“小”和“大”之间", "x": "东西本身，并不能给你带来幸福。", "y": "", "d": "2024-07-05"}, {"k": "h", "c": "代后记 在“小”和“大”之间", "x": "谁不是那么脆弱呢，我们就是靠着这些细节，甚至是幻觉，顽强地找出快乐并继续往前走。", "y": "", "d": "2024-07-05"}, {"k": "h", "c": "代后记 在“小”和“大”之间", "x": "你的“小”不成问题，因为外面的世界足够大。", "y": "", "d": "2024-07-05"}, {"k": "t", "c": "全书想法", "x": "", "y": "你的“小”不成问题，因为外面的世界足够大。", "d": "2024-07-07"}]}, {"id": "34657828", "title": "目光（2026全新增订版）", "author": "陶勇 李润", "cats": ["文学-散文杂著"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "03 一个医生的生死观", "x": "法国思想家蒙田就说过，生命的用途并不在长短，而在我们怎样利用它。", "y": "", "d": "2021-02-08"}, {"k": "h", "c": "03 一个医生的生死观", "x": "所以，死亡可怕吗？并不可怕。作为尘埃的我们有幸来此世间走一遭，重要的是你的过程和感受。", "y": "", "d": "2021-02-08"}, {"k": "h", "c": "05 所谓少年气", "x": "于我而言，童心大概就是对世界万物充满好奇，遵循自己的内心去做事，容易在一些小事上找到快乐，不会长时间陷入一种忧郁的情绪中。", "y": "", "d": "2021-02-08"}, {"k": "h", "c": "05 所谓少年气", "x": "读到一本有趣的书，听到一句有启发性的话，甚至和一个能有思想碰撞的人聊天，都是非常值得开心的事儿。简单的快乐源于精神，源于对这个世界更多元的理解。", "y": "", "d": "2021-02-08"}, {"k": "h", "c": "05 所谓少年气", "x": "仰望星空，脚踏实地，心怀美好愿景，一步步向前走吧。", "y": "", "d": "2021-02-08"}, {"k": "h", "c": "08 暗黑王国的小小人", "x": "我在盲人图书馆遇到过一个工作人员，她就是一名盲人，每天家人会把她送到地铁站，然后她自己搭乘地铁上班，到站后会有同事再把她接到工作的地方，就这么简单的一件事情，让她感到无比满足与幸福。有时候坐地铁时看着地铁里熙熙攘攘的人群，好多人垂头丧气，麻木的脸上见不到一丝光亮，我总会想起她，和这个女孩比起来，他们拥有的已足够多。", "y": "", "d": "2021-02-10"}, {"k": "h", "c": "08 暗黑王国的小小人", "x": "在我受伤的那段时间，其实真正让我想开的就是这些患者朋友。有时我很庆幸自己是医生，因为这个职业，我接触到了形形色色的人。人间百态，众生万象，因为疾病汇集到我的面前，透过疾病我了解到了各种各样的人生，能够帮到他们，我感觉特别幸福。", "y": "", "d": "2021-02-10"}, {"k": "h", "c": "08 暗黑王国的小小人", "x": "“读万卷书，行万里路，胸中脱去尘浊，自然丘壑内营。”当一个人见识越多，眼界越宽广，心胸就越慈悲。", "y": "", "d": "2021-02-10"}, {"k": "h", "c": "08 暗黑王国的小小人", "x": "凭借这种触觉和记忆的能力，他又学会了盲文，现在上了当地的盲人学校，父亲也在北京扎根下来，在医院里面做全职护工，一家人的生活走向了正轨。", "y": "", "d": "2021-02-10"}, {"k": "h", "c": "08 暗黑王国的小小人", "x": "薇薇也是在很小的年纪就查出了白血病，为了给她治病，父母卖房子卖家产，家境同样陷入深渊。\n但薇薇妈妈也从来没有想过放弃，她用最大的爱给了薇薇希望，陪着她常年辗转于广西与北京之间，她还教薇薇不抱怨生活和社会，要反过来去爱、去拥抱现在拥有的一切。", "y": "", "d": "2021-02-10"}]}, {"id": "28070306", "title": "平均分", "author": "康辉", "cats": ["文学-散文杂著"], "bmCount": 10, "rvCount": 0, "notes": [{"k": "h", "c": "自序", "x": "这样平凡却又努力不平凡的人生，或许才是大多数人可参考的人生范本。", "y": "", "d": "2020-05-17"}, {"k": "h", "c": "自序", "x": "若论起天分，我便是那平凡中不能再平凡的一个。在人生的赛场上、职业的赛场上，想不甘人后，也只有努力地去试每一个选项，在每一个选项上都能及格，在及格之上再努力，也许就能再站上一级台阶。一项一项，才能给自己拿到一个高一点的平均分。", "y": "", "d": "2020-05-17"}, {"k": "h", "c": "自序", "x": "我是如此平凡，却又如此幸运，在一个和平安宁的时代与国度，可以选择，可以努力，可以好好书写自己的人生。", "y": "", "d": "2020-05-17"}, {"k": "h", "c": "广院断章", "x": "十八岁，那是北京漫天黄沙的春日，那是校园里到处飘着姜育恒《驿动的心》的日子，那是日记中常常无端地冒出一丝感伤的日子，当然，那也是永远觉得明天的太阳会更明亮的日子。", "y": "", "d": "2020-05-17"}, {"k": "h", "c": "康老师", "x": "第一，成长是一个不断认识自己的过程，通过认识自己去认识这个世界。", "y": "", "d": "2020-05-21"}, {"k": "h", "c": "康老师", "x": "最终，一切在于你内心之中对自己有怎样的认知，你内心的力量到底有多大。", "y": "", "d": "2020-05-21"}, {"k": "h", "c": "康老师", "x": "第二，成长是一个逐渐学会、懂得承担责任的过程。我们来到这个世界上，在慢慢长大的过程中，身上的责任就在一点一点地累加。", "y": "", "d": "2020-05-21"}, {"k": "h", "c": "康老师", "x": "第三，成长是一个慢慢懂得什么是“尊重”的过程。学会真正尊重别人，是成长的一个非常重要的标志。这种尊重一定是完全发自内心的，而不仅仅是做出来的一种礼貌性姿态。", "y": "", "d": "2020-05-21"}, {"k": "h", "c": "康老师", "x": "第四，成长是一个逐渐学会质疑、不再盲从的过程。", "y": "", "d": "2020-05-21"}, {"k": "h", "c": "与妻书：万千荣耀，不及日日晨昏间的琐细", "x": "曾经，我有一种不知从何而来的执念，认为人终究是一种孤独的生物，一个人来到世上，就要一个人面对所有。也因此，生日于我，只不过是提醒自己与这世界存在着某种关联而已，似乎并没那么重要。那时的我完全无法想象，我的生命还可以与另一个毫无血缘的生命融合在一起，我的生日还可以成为父母姐妹之外另一人的生命密码。", "y": "", "d": "2020-05-21"}]}, {"id": "3300206503", "title": "喜剧：灵感、技巧、突破瓶颈的创作原理", "author": "[美]斯科特·迪克斯", "cats": ["文学-语言文字"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 概述", "x": "或许是因为标题、基调，或开头几行里那个精彩的段子。又或许是因为那些疯狂的角色、逐渐升级的荒诞，在作者巧妙的串联下扭转了读者的视角，让你以从未体验过的观感重新审视世界和自我。", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "第一章 概述", "x": "世间罕有的美味——喜剧写作大师精心雕琢的作品。", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "第一章 概述", "x": "佳作", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "第一章 概述", "x": "写出真正令人捧腹大笑的文本，是文学创作中最难也最具挑战性的技能之一。", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "第一章 概述", "x": "催泪文学也不难。把宠物狗或爱马写死，让情侣分手，硬生生将孩子从母亲的怀里夺走，拆散一对命中注定的情侣，或让人在被依赖之时英年早逝。写一篇让读者泪流满面的故事就像按个按钮一样简单。", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "第一章 概述", "x": "事实上，所有可以轻易套用的段子模板都早已被用烂：踩到香蕉皮、我的奇葩岳母、三种人或动物走进一间酒吧￼……如何原创新鲜笑料？如何凭空打造新笑点，并让它们完美跃然纸上？", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "第一章 概述", "x": "喜剧就像青蛙，解剖了就不好笑了。", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "何为好笑", "x": "一个能力不足的接地气角色面对无法战胜的艰难险阻依然不懈努力的故事。", "y": "", "d": "2026-07-02"}, {"k": "h", "c": "喜剧写作工具箱", "x": "喜剧写作指南第一条：概念先行", "y": "", "d": "2026-07-02"}]}, {"id": "22737189", "title": "病隙碎笔", "author": "史铁生", "cats": ["文学-散文杂著"], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "四", "x": "漂流是自觉的勇猛，生病是被迫的抵抗", "y": "", "d": "2023-11-06"}, {"k": "h", "c": "十一", "x": "重病之时，我总想起已故好友周郿英，想起他躺在病房里，瘦得只剩一副骨架，高烧不断，溃烂的腹部不但不愈合反而在扩展……窗外阳光灿烂，天上流云飞走，他闭上眼睛，从不呻吟，从不言死，有几次就那么昏过去。就这样，三年，他从未放弃希望。现在我才看见那是多么了不起的信心。三年，那是一分钟一分钟连接起来的，漫漫长夜到漫漫白昼，每一分钟的前面都没有确定的许诺，无论科学还是神明，都没给他写过保证书。我曾像他所有的朋友一样赞叹他的坚强，却深藏着迷惑：他在想什么，怎样想？\n可能很简单：他要活下去，他不相信他不能够好起来。从约伯故事的启示中我知道：真正的信心前面，其实是一片空旷，除了希望什么也没有，想要也没有。", "y": "", "d": "2023-11-06"}, {"k": "h", "c": "十二", "x": "生而为人，终难免苦弱无助，你便是多么英勇无敌，多么厚学博闻，多么风流倜傥，世界还是要以其巨大的神秘置你于无知无能的地位。", "y": "", "d": "2023-11-06"}, {"k": "h", "c": "十四", "x": "他把行与路做同一种解释，就是他保证了与你同在。路的没有尽头，便是他遥遥地总在前面，保佑着希望永不枯竭。他所以不能亲临俗世，在于他要在神界恪尽职守，以展开无限时空与无限的可能，在于他要把完美解释得不落俗套、无与伦比，不至于还俗成某位强人的名号。他总不能为解救某处具体的疾苦，而置那永恒的距离失去看管。", "y": "", "d": "2023-11-06"}, {"k": "h", "c": "病隙碎笔4", "x": "看见苦难的永恒，实在是神的垂怜——唯此才能真正断除迷执，相信爱才是人类唯一的救助。这爱，不单是友善、慈悲、助人为乐，它根本是你自己的福。这爱，非居高的施舍，乃谦恭的仰望，接受苦难，从而走向精神的超越。", "y": "", "d": "2024-09-08"}, {"k": "h", "c": "七", "x": "不许诺实际的福乐，只给人以智慧、勇气和无形的爱的精神。", "y": "", "d": "2024-09-08"}, {"k": "h", "c": "二十一", "x": "你要是悲哀于这世界上终有一天会没有了你，你要是恐惧于那无限的寂灭，你不妨想一想，这世界上曾经也没有你，你曾经就在那无限的寂灭之中。你所忧虑的那个没有了的你，只是一具偶然的肉身。所有的肉身都是偶然的肉身，所有的爹娘都是偶然的爹娘，是那亘古不灭的消息使生命成为可能，是人间必然的爱愿使爹娘相遇，使你诞生。", "y": "", "d": "2024-09-09"}, {"k": "h", "c": "二十四", "x": "人不是苟活苟死的物类，不是以过程的漫长为自豪，而是以过程的精彩、尊贵和独具爱愿为骄傲的。", "y": "", "d": "2024-09-10"}]}, {"id": "3300082724", "title": "不忙不慌", "author": "林桂枝", "cats": ["文学-散文杂著"], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "5 错位与工作", "x": "的工作状态相当简单：工作时工作。我的非工作状态同样简单：休息时休息。", "y": "", "d": "2024-04-07"}, {"k": "h", "c": "5 错位与工作", "x": "工作时工作，工作时不去做跟工作无关的事，这是基本的职业素养。休息时休息，休息时不再想工作的事情，这是爱护自己的身体。", "y": "", "d": "2024-04-07"}, {"k": "h", "c": "7 这块寿司，快长毛了", "x": "就这样，我在循环中无意识地返回。天天在电梯里上上下下，像一块寿司在循环的输送带上回转：黯淡无光不新鲜，连我自己都嗅到一股腐朽的味道。", "y": "", "d": "2024-04-08"}, {"k": "h", "c": "11 很多事情很基本", "x": "身边多少事，都是ABC。A是事情本身，B是你对事情的想法，C是你对事情的反应。如欲平静与安宁，请将事情回归到A。", "y": "", "d": "2024-04-08"}, {"k": "h", "c": "12 广告是广告，音乐是音乐", "x": "“不管我们今天占有的财物有多丰富
