"d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "幸福的人并不是时时刻刻都快乐的人。\n幸福的人是可以轻松地以特定的方式诠释事件、保持内心平和的人。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "从自身以外的事物中寻求幸福，本身就是缘木求鱼。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "如果认为通过改变外部世界就能获得内心的平静、永久的开心、应得的幸福，那本质上就是痴心妄想。每个人都深受这种想法的毒害，包括我自己。我们一遍又一遍地坚持着自己的执念，认为“等得到那个东西，我就快乐了”。这就是一个我们时时刻刻都在犯的根本错误。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "年轻的时候有时间、有健康，但没有钱。到了中年，有钱、有健康，但没有时间。老了以后，有钱、有时间，但没了健康。人生的大赢家就是同时拥有时间、健康和金钱。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "幸福是一种内在感受。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "他内心平静，身体健康，无论赚的钱跟别人相比是多还是少，他的心理状态都不会受到影响。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "平和是静态的幸福，幸福是动态的平和。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "人们以为，获得平和心境的方式是解决所有的外部问题。但外部问题是无穷无尽的。\n因此，获得内心平静的唯一方法是摒弃“问题”这个概念。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "现实是，生活就是一场单人游戏。人独自出生，独自死亡，独自解读人世间的一切。你的记忆只属于你一个人。你出生前无人在意，你离开人世后也无人在意，你存在于人世间只是短短几十年，人生就是一场单人游戏。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "工作时，和比自己更成功的人在一起。\n玩耍时，和比自己更快乐的人在一起。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "不喝酒、不吃糖可以提高情绪的稳定性，远离社交媒体（脸书，Snapchat和推特）也可以提高情绪的稳定性。玩电子游戏会带来短暂的快乐（我一度痴迷于游戏），但会摧毁长期的幸福。喝咖啡也属于用长期健康换取短期兴奋。这些不受你控制的外界因素会刺激你体内多巴胺的分泌，刺激因素一旦消失，多巴胺水平就会下降。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "如果你问贝赫扎德有什么幸福的秘诀，他只会抬头望天，然后说：“停止追问，开始欣赏。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "在生活中，无论面对何种状况，你都有三种选择：改变现状，接受现状，逃避现状。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "如何学会接受无法改变的事情？\n从根本上说，就是学会坦然面对死亡。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第四章 自我救赎", "x": "我生活中的第一要务是我的身体健康。对我来说，健康的重要性高于幸福，高于家庭，高于工作。我的身体健康是一切的起点，排在第一位，紧随其后的是我的心理健康和精神健康。接着是家人的健康和幸福。在确保了这些之后，我就可以按照自己的意志在这个世界上自由活动了。[4]", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第四章 自我救赎", "x": "世界上最简单的饮食原则：食物加工程度越深，就应该越少摄入。", "y": "", "d": "2024-08-30"}, {"k": "h", "c": "第四章 自我救赎", "x": "有想法就直接采取行动，就是这么简单。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第四章 自我救赎", "x": "无忧无虑即自由", "y": "", "d": "2024-08-30"}, {"k": "h", "c": "第四章 自我救赎", "x": "从愤怒中解脱的自由，从悲伤中解脱的自由，无须做出反应的自由，无须被迫做事的自由", "y": "", "d": "2024-08-30"}, {"k": "h", "c": "第四章 自我救赎", "x": "只要是做自己想做的事情，你就不是在浪费时间。但是，如果没有把时间花在想做的事情上，既没有赚到钱，也没有学到东西，你就要问问自己到底在瞎忙什么。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第四章 自我救赎", "x": "我能做到偶尔抬头看看天上的云。", "y": "", "d": "2024-08-30"}, {"k": "h", "c": "第五章 哲学", "x": "执怒就像握了一把要丢向他人的热煤炭，被烫伤的人反而是你。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《无穷的开始：世界进步的本源》", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《理性乐观派：一部人类经济进步史》，马特·里德利", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《非对称风险》，纳西姆·塔勒布", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《随机生存的智慧：黑天鹅语录》", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《万物解释者：复杂事物的极简说明书》", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《历史的教训》，威尔·杜兰特、阿里尔·杜兰特", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《生命之书》，吉杜·克里希那穆提", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《清醒地活》，迈克·辛格", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《沉思录》，马可·奥勒留", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "我曾经问一个和尚，他是如何找到内心的平静的。\n他说：“无论发生什么，我都说‘好的’。”", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《醒思录：李小龙的生活智慧》", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《瑞克和莫蒂》（电视节目+漫画书）", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的推荐读物", "x": "《银河系漫游指南》", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "纳瓦尔的写作", "x": "观察每一个想法。（自问：“为什么我会有这个想法？”）", "y": "", "d": "2022-11-28"}]}, {"id": "3300019336", "title": "制造消费者：消费主义全球史", "author": "安东尼·加卢佐", "cats": ["经济理财-财经"], "bmCount": 57, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "产品的生产环节和消费环节曾经是一体化的，而如今，五花八门的市场媒介已经把生产和消费远远分开了，两者可能既不在同一时间、也不在同一地点。在复杂的生产全球化的环境下，我们日常所使用的东西或许没有一样是我们自己生产的，这让我们每个人都成了消费者。我们身边的新产品层出不穷，琳琅满目，但我们离它们的生产环节却越来越远。", "y": "", "d": "2022-10-11"}, {"k": "h", "c": "前言", "x": "消费方式是社会模式的体现。如今我们每个人都不由自主地依赖着市场，这种依赖不仅仅是物质上的，也是精神上的。由于经济社会环境的发展，人们的思想变化了，这也改变了人与物、人与世界的关系。对人们来说，消费不再意味着消耗和挥霍，而是正常心态下再自然不过的行为活动。", "y": "", "d": "2022-10-11"}, {"k": "h", "c": "前言", "x": "我们就像鱼，消费心理就像水，我们游在其中觉得十分平常，几乎感受不到它的存在。", "y": "", "d": "2022-10-11"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "消费者不了解商品的生产过程，也就无法衡量其成本、构造、所需劳动力以及生产背后的困难，人们只能以一种虚幻的方式去理解它们，在幻想中，商品仿佛不属于任何社会网络，而是独立地存在着。当商品被摆上商店货架供人们挑选时，它们显得遗世独立、纯粹得令人愉悦，它们进入了消费者的幻想，在人们欣赏的眼光下变成了奇妙之物。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "品牌的首要功能就是给消费者安全感，让消费者感到产品不是来自无名的陌生公司，而是来自某个有温度的“家庭”。品牌的任务就是让顾客不需通过触觉、视觉、气味来评估产品，而是试过某个品牌，觉得满意后就可以一直购买下去，成为其忠实客户。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "“商品拜物的思想使交换价值不仅以事物本身的自然属性来决定，还掺杂了一系列社会和文化价值。这也是广告的常见表现手法，广告里的汽车不是一件实际生活中有使用价值的人类劳动产物，而是阳刚、刺激、地位和新潮的载体。消费者要想成为那样的人，无须做出任何自我提升的努力，只需要通过抽象化的购买和占有就能让自己拥有这些特质。”", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "在市场和消费的环境下，符号工程创造了富有联想力的意义，商家得以人为地为产品注入符号。有了符号资本和品牌资本，一家公司就可以把成本只有几便士的衣服卖到几百美元。品牌使商家得以重塑社会市场关系，并从中获利。品牌打造（Branding）就是为品牌找到化身，让那些离消费者很遥远的生产商显得有血有肉，从而扎根在消费者心中。虽然这种化身是虚构的，但在消费者的想象中却可以逐渐强烈且鲜明起来。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "人们发现品牌不仅仅能给人安全感，还有其神秘的力量，能通过符号工程将商品与社会文化价值联系起来。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "品牌给了水以价值和力量，它代表着青春、美丽、健康、力量、自然。品牌效应之所以能唬住人，是因为它基于我们的神经机制。当我们消费时，不同产品的品牌形象和价格会造成先入为主的不同观感，这种观感会影响我们实际使用产品时的感觉。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "品牌的效力就是带来这种“先入为主”的区别。更文雅一点来说：品牌帮助消费者将产品差异化。“品牌”一词从词源上来看，最初指的就是人们把一个标志挂在自家的牲畜身上，以免与别家的牲畜弄混。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "在品牌的影响下，产品的使用价值不再取决于产品成分，我们并不深究买来清洁瓷砖的产品是白醋和小苏打的混合物，我们在乎的是这种产品强大的清洁力在媒体上是如何广受赞誉的，我们不再注意商品成分，而是深陷品牌的奇妙魔力。德国批评家沃尔夫冈·弗里茨·豪格（Wolfgang Fritz Haug）指出：“人们的实践知识急剧减少……大企业把最基本的技术和化学知识通过品牌垄断了。……商品的符号和商品宣称拥有的使用价值不再受制于商品的构成，甚至可以与其内容物完全无关。”[插图]人们从此在拜物的路上越走越远。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "对于大型公司来说，把产品和其生产者分开来是一件好事。他们可以把生产委托给很多分包公司，尽管生产工艺可能非常不同，但是一旦它们归属于同一品牌，这些消费品便被统一化了。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第一章 商品的降生：市场的形成和商品拜物教", "x": "以1990至2000年代的两个香氛品牌凌仕（Axe）和多芬（Dove）为例，它们的品牌文化就截然相反。凌仕是个有大男子主义色彩的品牌，它号称可以使男性更具有诱惑力，甚至用了它就能遇到放纵的艳遇。而多芬则是一个具有女性主义色彩的品牌，宣称要尊重所有的美丽，不以固定规范来禁锢审美的标准。这两个品牌的消费者对产品抱有的想象是截然相反甚至互相矛盾的，而这两个品牌却同时属于联合利华（Unilever）一家公司旗下。就像这样，大型公司通过多元化的一系列品牌来覆盖所有细分市场，于是他们在符号领域便无所不能。当多种文化同时盛行、竞争、对抗的时候，它能够同时为交战的每一方提供武装，从而战无不胜。品牌给人的联想力量也可以让产品远离负面影响。即使在产生了大量污染的情况下，大型公司仍然能通过对环保项目的支持和赞助，打造环保自然的品牌形象[插图]。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "城市居民们每天路过无数广告牌，随处可见各类海报，各种传单、涂鸦和电子标牌充斥四周，人们吸收着品牌和商店的信息。商家们在店铺临街过道的橱窗里摆满了商品。许多商店组成了一条条玻璃隧道，穿过一栋栋建筑物。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "当商业空间和商业符号在城市中扩散的时候，专门用于消费的大型场所“百货商店”出现了。这种大型功能性建筑物是专门为商品售卖所设计的，有多个楼层，摆满丰富多样的货品，可以同时完成大量交易活动。百货商店既是城市化的产物，也是城市化的表征，更是城市化的放大镜。它打破了传统的销售模式，让资产阶级的有闲人士们离商品更近，从而成为消费者。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "无穷无尽地购物，即使买下了想要的东西，也只是暂时平息了欲望之火，很快另一件宝贝又会出现在眼前。回家以后人们还是无法抑制再次回到商店的欲望。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "百货商店这一座虚幻而繁华的宫殿，为了让顾客沉浸在对奇迹的惊叹中，把商品背后的烦琐生产过程掩盖了起来。在这出华丽戏剧的背后，有许多顾客从未见过的“隐形员工”，比如会计和仓库员工，他们会在消费者看不到的楼层里办公。这种设置也是为了满足拜物心理，把商品和其产地、生产者、工艺技术、所需劳动时间分离开，让商品成为一种神奇而独立存在的宝贝。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "当百货商店模仿异国风情的时候，古董商店则在模仿旧时情怀，他们搭建这些虚构幻影的目的都是要引发顾客的想象，要让顾客深深陷入这场梦境。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "百货商店表现种种奢华和专业，都是为了更好地吸引和留住顾客，让顾客沉浸在白日梦中无法自控，从而屈服于消费欲望。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "经营者为了让女士们在百货商店里不知疲倦地逛下去，做了十分周全的考虑。这里有她们可以休息、阅读、通信和解渴的去处，周围都是友好可亲的面孔。百货商店的目的就是要让女人们把这里视为第二个家，甚至比家更大、更漂亮、更豪华。这里所有的雇员和经营模式都是为了吸引和留住女性。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "在实用主义的消费模式中，消费者去商店是为了买某件必需的产品，顾客到商店是有目的性的，会直奔主题地完成购买计划。而百货商店的模式不是如此，这里到处都摆满了商品，消费者是在逛的过程中由于接收到周遭商品的吸引，才慢慢产生需求的。因此，这里的消费者并不是抱有计划性、来完成某件“采购任务”的人，而是那些爱闲逛又爱娱乐的人。“逛街”一词指的就是这种在商店里闲逛的活动。百货商店很支持逛街行为，并把它推行成了一种社交活动，就像逛博物馆或去剧院一样。伦敦赛弗吉百货（Selfridges）的广告这样说：“在赛弗吉百货逛街是快活、消遣、娱乐的活动……日常乐趣的重要组成部分。”[插图]", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "经常逛百货商店的消费者就会变得更加感性，习惯性地欣赏新的商品，一旦发现样式、颜色和布置有了改变，就会感觉自己之前买的东西过时了，迫切需要更新，这又加速了物品符号价值的贬值。百货商店急于培养消费者对时尚的敏感度，因为他们要想经营下去，就得一直保持大量的业务。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "百货商店“成为资产阶级的社会同化工具，在整个中产阶级中传播着巴黎上层资产阶级的价值观和生活方式。乐蓬马歇就像一部守则，告诉人们如何着装，如何打扮，如何度过休闲时光。……它展示着成功人生的生活方式”。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "百货商店贩卖的是一种阶级身份，它们提供符合资产阶级生活方式的商品，并让人们认为购买某些衣服或家具就可以获得资产阶级的象征。通过购买一件商品，人们就可以假装加入了某个令人羡慕的群体。百货商店有意传播着这种阶级身份的体现。这种理念的受众群体是小资产阶级，他们经济实力或文化底蕴还不足以加入贵族或大资产阶级，因而百货商店所传达的这一切，就成了他们信奉的权威。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "在20世纪末的宜家（IKEA）商店中，商品在仿真的房间里呈现，这和一个世纪前的陈列室用的是一样的模式，每件家具，每个物件都完美地嵌入了模型场景里，顾客会把这些场景投射到自己的家中。在宜家，固定的浏览路线也使人们的沉浸感得到了增强。从进门到出门，顾客都被迫沿着固定的路线走，也就连续性地浏览了所有商品。这延长了消费者的沉浸感，也增加了购买的可能", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第二章 商品大观：百货商店和逛街", "x": "一些连锁面包店常用橘色的灯光和木质的装潢，天花板上挂着旧吊灯和木梁，模仿出古老面包铺的场景。店员像快餐店里一样站在柜台后为顾客提供服务，尽管他们穿着类似面包师的服装——白色围裙和厨师帽，却并不会揉面团做面包，他们卖的面包都是在工厂批量生产出来的。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第三章 商品动力学：“同与不同”概念下的矩阵传播", "x": "资产阶级的物质文化是消费社会的起源。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第三章 商品动力学：“同与不同”概念下的矩阵传播", "x": "客厅里的一切布置都遵循着与实用主义背道而驰的逻辑，无用的东西大量散布，房间像剧场一样展览着各种物品。", "y": "", "d": "2022-10-14"}, {"k": "h", "c": "第三章 商品动力学：“同与不同”概念下的矩阵传播", "x": "在这种基于能力和品味的社会竞争下，人们过度追求靠真实的物品来证明自己、彰显自己，这样的竞争传递着大量的物品、符号和行为。因此，在资产阶级的消费逻辑下，大众化是注定的，它不断传播和扩张，直到几乎席卷整个社会。", "y": "", "d": "2022-10-17"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "杂志会倡导以市场方式——即购买某种类型的服装和化妆品——来表达理想的女性美，并借此引起读者的消费欲望", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "这些手段淡化了广告的动机，让它们更好地融进杂志的内容里，并减弱了读者对商家广告的抗拒情绪。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "通过一连串的讲述，广告和文章共同塑造了宏观的故事，并为读者树立了新的标准。文章影响人们的认知、改变人们的视野、引起人们的焦虑、让人们想要修正和改变，这时广告就会为人们提供解决方案，带来慰藉。如果撰写文章的就是广告商本人，那这一切就更具凝聚力和协调性了。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "媒体对大众发挥的三大功能：消费教育、社会想象的植入、商品平常化。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "尽管大多数读者在物质和经济上还不能支持昂贵的购物，但是杂志让购物行为变得自然化和平常化，人们可以轻而易举地窥见曾经难以想象的昂贵的新事物、新生活。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "杂志还会灌输给人们新词汇、新标准和新焦虑，例如，在20世纪初，杂志文章和广告开始大量使用“灭菌”“杀菌”“微生物”或“表皮”等高深的生物学和药理学术语，目的就是促进人们对洗护用品和化妆品的需求。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "杂志不是为了反映社会和日常生活，而是为了向消费者提供丰富的图像，用以投射自我、用以提供幻想。杂志让人们对富裕的生活抱有梦想，插图中的人就像是代表读者在体验着奢华。同时，它构建了一个海市蜃楼，把资产阶级的价值观和生活方式变得“大众化”。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "这个更广博的世界强烈吸引着人们的眼球，给人以感官上的刺激，令人身临其境、浮想联翩。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第四章 商品的幻影：图像在日常生活中的入侵和扩散", "x": "随着媒体的传播，消费文化也更加完备了，一些品牌名称直接代替了物品本来的名称，一些商业口号成为耳熟能详的谚语。商品的幽灵进入了人们的日常对话。最重要的是，它潜移默化地进入了人们的精神。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第五章 消费心态：商品化带来的心理变化", "x": "商家在营销中暗示人们，要想娱乐就得有预算，要玩得开心就要花钱。金钱侵入了年轻人的浪漫关系里，以至于约会变成了豪掷（mercenaire）￼的游戏。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第五章 消费心态：商品化带来的心理变化", "x": "现代消费者在意的是一种符号，这种符号表示他们可以通过拥有某些东西来使得自己成为某一种人。在这种心态下，相比在生产链条中所处的位置，人自身价值的高低更多的是通过商品来表达。因此，现代消费者也常被认为是“他者导向”￼的：与上一代人相比，他们更加关注所购商品的符号价值。", "y": "", "d": "2022-10-22"}, {"k": "h", "c": "第五章 消费心态：商品化带来的心理变化", "x": "这种不断消费的心理产生的前提是在人心中建立一种持续不断的投射活动，让人们永远对所拥有的物品不满意，而斥资购买新物品。理想化的消费对象总是会比我们所拥有的要稍微好一点，欲望的张力￼使我们努力想达到理想化。一件产品在人类眼中的形象是不断变化的，它们先是被购买然后被嫌弃，先是令人趋之若鹜很快又令人嗤之以鼻。那些一度被认为是具有突破性的、新颖的、有创意的、引人注目的产品，一旦被市场传播开来，在消费者眼中也就变得习以为常了。人的需求就是这样被无限扩展。欲望的张力不断朝着新的产品进发，那种没有得到满足的感觉一次又一次地被重新激起，成为这种商品经济的核心。", "y": "", "d": "2022-10-18"}, {"k": "h", "c": "第六章 社会工程：意识管理与商业秩序合法化", "x": "其公关的一个理念就是，并不直接反驳攻击言论，而是给大众更有意思的想法，讲述另外的故事，使他们的存在和行为显得合理。", "y": "", "d": "2022-10-19"}, {"k": "h", "c": "第六章 社会工程：意识管理与商业秩序合法化", "x": "这一切都证明了，要将一个想法强加于人们的头脑中，并不一定要让人们理解和掌握它，而是只需要充分地重复信息，使其融入人们周遭的环境，便能实现扎根的目的。", "y": "", "d": "2022-10-19"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "广告就像品牌一样，可以为缺乏意义的物品注入意义。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "如何推广如此普通且替代性强的产品？如何区分某种肥皂，让它显得与众不同？第一个策略是为产品增加与奢侈相关的联想", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "广告不仅贩卖奢华和尊贵，还贩卖浪漫。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "在广告的暗示下，观众也把自己投射到广告所表达的那种爱情和家庭中，这种投射时而像田园诗般美妙，时而令人不安。这是因为广告旨在让它的观众（也就是消费者）对自己进行批判性的审视，也就是所谓的“引起焦虑”。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "这些引发焦虑的广告有固定的结构，故事的结尾也总是大同小异，主人公因自身的“小毛病”被嘲笑、羞辱而感到羞耻，他的“小毛病”（狐臭、口臭、头皮屑等）阻碍了他的爱情、家庭或职业的成功。然后一位朋友介绍给他一款产品（除臭剂、牙膏、洗发水等）帮助他走出困境，恢复了正常的社交生活，最后，故事总在幸福快乐的情节中结束。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "许多广告都运用了这种三段式（问题/耻辱—产品出现—解决/恢复）的脚本结构，它暗示消费者要意识到自己的错误和不足，还要通过采取正确的消费行为来“自我救赎”。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "各种抢眼的图像吸引着人们的注意，娱乐着人们的生活，也激发了人们的幻想，最重要的是，教会了人们消费。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "简明扼要地说，这些媒体想表达的意思就是：“用钱换一件产品，再用这件产品换幸福。”", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "要理解商业兜售的意识形态，我们必须先去思考它故意忽视的是什么。他们从不谈生产和劳作，而大量去讲休闲和财富，刻意过度曝光那些有利于商业利益的态度、行为和价值观。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "消费者的自由不过是在他人强加的一堆东西中进行选择的自由。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "女人要是不自我拯救，就会被抛弃。所以在这种论点下，女人必须努力让自己的形象引人注目、惹人喜爱。化妆品行业及整形业也一样，都是用了这一套论点，让人的身体成为被加工、被物化的对象。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "这种“买东西补偿自我缺陷”的幻觉是卖出商品的关键。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第七章 符号工程：广告的力量与弱点", "x": "广告旨在让群众一直对他们当下的生活方式不满意，要让人们无法忍受丑陋的事物。因为令人看了以后觉得心满意足的广告是赚不到钱的，令人不满才能招揽更多顾客。", "y": "", "d": "2022-10-24"}, {"k": "h", "c": "第十章 超级消费者：呈指数增长的未来", "x": "消费史就是商品及其商品图像流通加速的历史，是市场和媒体相互关联发展的历史。流通着的除了商品本身，还有商品的象征", "y": "", "d": "2022-10-26"}]}, {"id": "26843113", "title": "定投十年财务自由", "author": "银行螺丝钉", "cats": ["经济理财-财经"], "bmCount": 43, "rvCount": 0, "notes": [{"k": "h", "c": "序言", "x": "就像“股神”沃伦·巴菲特（Warren Buffett）说的，“通过定投指数基金，一个什么都不懂的业余投资者，竟然能够战胜大部分专业投资者。”", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "序言", "x": "定投是分散投资，定投的投资者不可能在牛市高位投入全部资金，风险自然大大降低。能长期坚持定投，最后大概率是赚钱的。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "引子 “不上班，也有钱”，真的能做到！", "x": "主要有三点：节流、开源、依靠基金分红建立被动收入来源。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "引子 “不上班，也有钱”，真的能做到！", "x": "•认真工作，用双手创造价值，把自己打造成“获取稳定提升现金流”的资产，同时用保险保驾护航，这是我们的防御武器。•将现金流定投到低估值的指数基金上，依靠低估值的指数基金来放大收益，这是我们的进攻武器。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "如何省时省力打理好自己的财富", "x": "因为投资需要时间，长期投资才能享受到复利的威力。投资要趁早。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "如何省时省力打理好自己的财富", "x": "投资指数基金的最佳策略，就是定投。每个月定期投入一定金额到指数基金，长期来看，让财富稳稳增长不是一件难事。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "养成3个理财好习惯，受益终身", "x": "好习惯一：把每月开支分成4份，避免把钱早早花完", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "养成3个理财好习惯，受益终身", "x": "好习惯二：养成记账的习惯", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "养成3个理财好习惯，受益终身", "x": "好习惯三：做好预算", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "30岁之前，要不要买房、买车", "x": "车子是消费品", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "30岁之前，要不要买房、买车", "x": "汽车是消费品。从买来开始使用算起，汽车就在不断贬值。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "30岁之前，要不要买房、买车", "x": "30岁之前，优先提升自己", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "30岁之前，要不要买房、买车", "x": "对年轻人来说，如果要租房，就选择在单位附近租住。如果不舍得花太多钱，那宁可面积小一点。通勤路上花太长时间，虽然可能会节约几百元，但浪费的时间是弥补不回来的。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "30岁之前，要不要买房、买车", "x": "住得离工作近一点，住得离钱近一点。在你觉得最重要的事情上，全力以赴！这，就是螺丝钉眼中租房的秘诀。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "人到中年，如何规划好家庭消费", "x": "可选消费，是用来提高生活质量的。例如汽车、化妆品、最新款的手机、最新款的电脑，花费非常大的出境旅游等，都属于可选消费。有了它们，可以让我们更好地享受生活。但是如果经济能力达不到，没有它们，我们也可以继续生活。很多时候，可选消费都是可以降级的。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "人到中年，如何规划好家庭消费", "x": "由俭入奢易，由奢入俭难。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "穷人思维和富人思维，决定你一生的财富", "x": "•投资要趁早。•30岁之前，优先提升自己。如果要租房，尽量住得离工作近一点，住得离钱近一点。•人到中年，规划好家庭消费的核心在于：可选消费降级，必需消费走量。•人性的不耐和懒惰，是人们陷入贫穷的根本原因。我们想要变得富有，就不能犯同样的错误。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "穷人思维和富人思维，决定你一生的财富", "x": "投资要趁早", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "什么是定投", "x": "能够产生现金流的才是资产，它就是我们的“鹅”，可以源源不断地给我们产生现金流。在日常生活中能产生现金流的资产有很多，像股票、债券、基金、房地产、自己的公司等，这些都是“鹅”。只要这只“鹅”可以产生不错的现金流，它就是在下“金蛋”。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "什么是定投", "x": "能产生现金流的资产通常比不能产生现金流的资产长期收益高；能产生现金流的资产中，现金流越高，长期收益越高。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "定投的好处", "x": "定投其实有两个非常重要的作用。第一个作用，是强制储蓄，克服穷人思维。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "定投的好处", "x": "第二个作用，是保值增值，化解人力资产的风险。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "定投的心态，就像还房贷", "x": "定投是一种被动投资理念：不要去预测市场", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "定投的心态，就像还房贷", "x": "首先，每个月到了时间点就进行定投。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "我们自己值多少钱", "x": "上班后，努力学习、认真工作也可以显著提升收入。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "我们自己值多少钱", "x": "第一种风险，主要是意外、疾病等导致的。比如说不幸遇到车祸、身染重疾。这种情况下我们无法到岗工作，会对我们的劳动能力产生非常大的影响。对于这些风险，我们可以依靠保险来化解。例如不幸得了癌症重疾，不仅无法上班获得收入，还需要家庭花费大量的钱去治疗，严重拖累家庭的生活质量。但是如果配置了重疾险，确诊重疾险里所包含的重疾，就可以先行得到一大笔赔付，抵抗这种风险。意外、重疾、医疗开销等风险，都可以通过保险来对冲。不过这些风险也不是每个人都会遇到的。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "攒多少资产，才能实现财务自由", "x": "4%法则是麻省理工学院的学者威廉·班根（William Bengen）在1994年提出的理论。通过投资一组资产，每年从退休金中提取不超过4%的金额用来支付生活所需，那直到自己去世，退休金都花不完。因为，资产自己会增值。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "攒多少资产，才能实现财务自由", "x": "持有优质的可以抵抗通货膨胀的资产。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "基金，是一种间接的投资工具。我们把钱交给基金公司，基金公司拿着这些钱，去投资各种资产。如果基金赚了钱，我们也就赚了钱；如果基金亏损，我们也要承担亏损。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "为什么说基金最适合普通投资者呢？主要是基金有如下三大好处。第一个好处，每一只基金都有专门的基金经理来为我们打理，他们可以帮我们投资一些我们不熟悉的品种，另外，基金也降低我们的投资门槛。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "第二个好处，基金可以很方便地分散风险。我们都知道，不要把鸡蛋放在同一个篮子里。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "第三个好处，投资基金不需要频繁操作，比较省心省力。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "（1）按照投资方向，基金可以分为：股票基金、债券基金、混合基金、货币基金。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "（2）按照投资理念，基金可以分为：主动型基金、被动型基金。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "（3）按照销售渠道，基金可以分为：场内基金、场外基金。先来说一下基金的销售方式。我们普通投资者，常见的交易基金的方式，主要是两种：申购赎回；买入卖出。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "基金，最适合普通投资者的工具", "x": "虽然基金的分类有很多种，但是对普通投资者来说，最常用的基金主要就是三类：货币基金、债券基金、股票基金。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "B类货币基金，长期收益更高", "x": "货币基金是专门投资那些安全又具有很高流动性的货币市场工具的基金。货币市场工具这个名词可能比较拗口，一般来说货币市场工具包括期限小于1年的短期国库券、政府公债、大额可转让定期存单、商业本票、银行承兑汇票等。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "B类货币基金，长期收益更高", "x": "费率越低的货币基金，越划算", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "B类货币基金，长期收益更高", "x": "很明显，费率越低的货币基金，对投资者越划算。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "B类货币基金，长期收益更高", "x": "所以，我们挑选货币基金的时候，有一个非常重要的技巧，就是要选长期费率最低的，总费率最好控制在0.3%以下。这样的货币基金，长期收益更有优势。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "B类货币基金，长期收益更高", "x": "这就是货币基金。货币基金的投资特点是：几乎不会亏损，买卖方便，长期收益较低，适合打理短期零钱。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "如何判断债券基金是否值得投资", "x": "债券基金是以债券为主要投资对象的基金，它主要投资的是国债、金融债、企业债等固定收益类金融工具。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "秘诀三：选择追踪误差较小的基金", "x": "定投指数基金", "y": "", "d": "2021-12-04"}]}, {"id": "26551029", "title": "零浪费生活", "author": "安妮塔·梵戴克", "cats": ["经济理财-管理"], "bmCount": 37, "rvCount": 0, "notes": [{"k": "h", "c": "第二天 做一次垃圾桶彻查", "x": "塑料是用石油制作的", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第三天 做一个零浪费套包", "x": "减少浪费。直接拒绝！减少“四大件”的第一步就是拒绝使用吸管、塑料袋、咖啡杯和塑料水杯。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第五天 给自己设置消费禁令", "x": "一个月消费禁令规则1. 不买多余的东西。这包括衣服、鞋子、化妆品、护肤品，也意味着无论如何都不要买这些物品，哪怕它们在打折！2. 可以买食物和必需品！3. 可以花钱去体验新事物、看朋友、看电影、吃午饭。如果你可以用免费活动代替上面这几项就更好了，比如远足、野餐、在家喝茶。这些活动都不需要新设备，你只需要利用手头现有的东西就可以了。4. 了解自己事情的轻重缓急。如果你想知道自己的真正价值在哪里，就看看自己的银行账户。这个消费禁令将会帮助你把自己的金钱定位在那些对你而言真正重要的事情上（具有讽刺意味的是，它们通常不是物品）。5. 基本原则就是“不买新东西”，但你得决定你的重点是什么。你是不是有太多还没读过的书？是不是有大堆标签都还没剪掉的新衣服？十种不同色号的口红？你自己来决定最应该停止购买的东西。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十一天 自制美容产品", "x": "用块状或有机产品替换你所有的美容产品。ⅰ 沐浴露→用一块香皂替换。ⅱ 洗发水→用洗头膏替换。ⅲ 护发素→用护发膏替换。ⅳ 润肤霜→用椰子油替换。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十二天 自制清洁产品", "x": "其实没必要害怕日常细菌，因为我们的身体天生就有一种细菌免疫功能。唯一需要我们去除99.99%以上细菌的地方是医院！", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十二天 自制清洁产品", "x": "· 将1：1比例的白醋和水装入一个空喷雾瓶里（玻璃瓶最好，但在你买新的瓶子之前记得先利用家里已有的旧喷雾清洁瓶）。如果你家没有白醋，用1：5比例的苹果醋和水也可以。· 喷洒在你需要清洁的地方。然后用旧毛巾或旧T恤衫改造的抹布或棉布毛巾擦干。· 加入10—15滴精油来增添香气！", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十二天 自制清洁产品", "x": "绝不再买纸巾。用旧的棉布毛巾和T恤衫代替吧。做一个破布篮子，贴上标签以供居家使用。用这些破布来做清洁，等它们变脏了就丢进洗衣机里。特别简单！", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十五天 清理你的住所（第二部分）", "x": "让我们拥有更少，以得到更多。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十五天 清理你的住所（第二部分）", "x": "任何一件相同的物品，我最多能拥有两件", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十五天 清理你的住所（第二部分）", "x": "包括毛巾、床上用品、杯子和盘子等。挪亚方舟毛巾原则=2×家里的人数", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "反思&复习 第16—30天", "x": "在我的零浪费生活中，我给自己最好的礼物就是重新找回与大自然的接触。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "反思&复习 第16—30天", "x": "在澳大利亚原始林区或加利福尼亚红杉林中远足时，我感觉最自在", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "反思&复习 第16—30天", "x": "走出家门，脱掉你的鞋子，感受一下双脚之下的草地，体验一下弄脏双手的感觉。这一切都是真实的，既不像你钱包里的塑料信用卡，也不像你一直渴望买到的新款鞋，更不像你眼红已久的邻居车库里的闪亮汽车。我们用来种植食物的土壤、我们饮用的水、我们呼吸的空气、我们生态系统里的动植物——这一切都是真实的。要是没有这一切，其他的一切就都毫无意义。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "反思&复习 第16—30天", "x": "尽量一周至少逛一次国家公园、花园或海滩", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "反思&复习 第16—30天", "x": "周六下午不要再去逛街了，和朋友一起去远足吧。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十七天 购买真正的食品", "x": "多投资你的长期健康吧，而不是又一个手提包！", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十九天 学会接受极简主义", "x": "我心中的极简主义的定义很简单——用最少的物质来生活，这样你才能够体会生活中最多的快乐。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第十九天 学会接受极简主义", "x": "通往极简主义生活的三个步骤1. 减少物品", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十一天 清理你的思绪", "x": "创造一些关爱自我的仪式。开一份“乐事清单”，上面写上五到十种能滋养你心灵的活动。当你哪天太累了或感到茫然无助了，就用这些活动中的一个或多个来好好犒劳一下自己。这些活动也许是一次泡泡浴、一次悠闲的晨间读报时光，或到你最爱的咖啡馆里看书以寻求安慰。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十一天 清理你的思绪", "x": "练习冥想。这个练习真正改变了我。独自静坐很难，却是你能建立的最有收获的日常习惯。我建议初学者用应用软件来尝试一次时间较短的引导式冥想。从十天冥想这个目标开始，你很快就能体会到冥想的好处。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十三天 重视体验而不是拥有", "x": "重视体验而不是拥有", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十三天 重视体验而不是拥有", "x": "我们想要被别人记住的是我们的品格，我们的经历以及我们分享过的爱，那么为什么在有生之年，我们却总是如此在意日常生活中的“所有物”呢？", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十三天 重视体验而不是拥有", "x": "我现在不再那么在意我穿的衣服牌子，我是否住在“对”的郊区和我开的是哪种车。但我更在意以目的为导向的工作，我丈夫的爱、我家人和朋友的快乐。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十三天 重视体验而不是拥有", "x": "旅行教育了我，使我在大自然面前时刻保持谦卑，它让我意识到，获得经验比获得更多物质更有价值。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十三天 重视体验而不是拥有", "x": "做一个简单快乐的极简主义旅行者", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十四天 理性消费", "x": "金钱不是一个肮脏的词，它只是一个工具。我们都需要钱来维持生存，但我们也需要明白，它是一种珍贵的资源。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十四天 理性消费", "x": "我们生活在一个快餐、快时尚和人际关系泛滥的社会中——重视数量而不是质量，速度而不是价值。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十四天 理性消费", "x": "质疑你的消费。在你买任何新东西之前，考虑一下消费的层次结构（详见第十四天里我的消费原则）：ⅰ 我真的需要它吗？ⅱ 我可以借用吗？ⅲ 我可以买二手产品吗？ⅳ 如果我真的要买，生产这件商品的厂家的理念与我的价值观相符吗？", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十五天 服务他人", "x": "2.一个需要帮助的朋友。奉献自己的时间来帮助一个朋友或家庭成员，比如帮忙带小孩或整理住所，不要要求任何回报。3.报名参加一个活动。查看当地有没有任何清洁活动或可持续发展工作坊，报名参加志愿服务。让你的朋友和家人也加入进来！4.随机做三件善事。可以是任何事情，为邻居做一顿饭、为一位陌生人买咖啡或为当地养老院买花。这些小善举可以让一个人快乐一整天。5.送出感谢卡。你上次收到邮件是什么时候？给某人寄一张卡片，让他知道你在思念他。你的留言不需要有什么目的，只是提醒收到卡片的人有人爱着他。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十七天 创造而非消费", "x": "现在回想起来，我能想到的就是我因为浪费性消费失去了大量时间——为了拥有更多而盲目购物，消耗大量的空热量食物（即含高热量而营养成分近乎为零的食物）和放纵自己迷失在社交媒体和电视垃圾的旋涡里。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十七天 创造而非消费", "x": "我们为何不停止浪费时间被动消费，而改为主动创造呢？有多少次，你拒绝一些项目、爱好和兴趣是因为自己没有时间呢？真实情况是，我们都有时间，只是我们没有优先考虑这些事情。就像爆红的网络流行语说的那样，“你一天中拥有的时间和碧昂丝一样多”。我们必须转换观念，把自己从消费的奴隶变成创造者。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十七天 创造而非消费", "x": "用一支荧光笔标记出你所有盲目浪费的时间，这包括所有毫无目的的活动，比如：• 看电视• 浏览社交媒体• 盲目上网• 因无聊而购物• 因无聊而吃东西", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十八天 保持极简主义风格", "x": "一口咬下一片好吃的酸面包，我欣喜；闻到我居住的街道上桉树散发的味道，我愉悦；看见日出时分透过玻璃窗照进来的一缕柔和的桃红色光线，我快乐。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十八天 保持极简主义风格", "x": "保持极简主义生活的五种方法", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十八天 保持极简主义风格", "x": "5.直接拒绝！保持极简主义生活的最简单方法就是一开始就拒绝一些不必要的物品以各种形式进入你家。记住，别让你的东西吞噬你！", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "第二十九天 参与进来", "x": "拥有洁净的水、空气和土壤是所有生物与生俱来的权利。当人们问我“零浪费生活最难的部分是什么”时，我的答案永远都是一样的——那就是我无法再像以前一样对地球的状态一无所知了。", "y": "", "d": "2024-05-16"}, {"k": "h", "c": "结语", "x": "我们生活在一个废话连篇、轻视人际关系和把地球当垃圾一样对待的社会中。我们浪费人类的基本生活单位——土地、水和空气——仿佛它们取之不尽用之不竭。我们每天制造大量垃圾并随意倾倒在地球上，仿佛地球上有无穷无尽的空间来当垃圾场。是时候终止这些行为了。我们都可以从拒绝这样做开始。", "y": "", "d": "2024-05-16"}]}, {"id": "40055543", "title": "置身事内：中国政府与经济发展", "author": "兰小欢", "cats": ["经济理财-财经"], "bmCount": 29, "rvCount": 1, "notes": [{"k": "h", "c": "第一节 政府治理的特点", "x": "在任何体制下，权力运作都受到两种约束：做事的能力及做事的意愿。前者取决于掌握的资源，后者取决于各方的积极性和主动性。", "y": "", "d": "2025-11-19"}, {"k": "h", "c": "第二节 外部性与规模经济", "x": "一件事情该不该由地方自主决定，可以从外部性的角度来考虑。若此事只影响本地，没有外部性，就该由本地全权处理；若还影响其他地方，那上级就该出面协调。", "y": "", "d": "2025-10-31"}, {"k": "h", "c": "第三节 复杂信息", "x": "有信息优势的一方，或者说能以更低代价获取信息的一方，自然就有决策优势。", "y": "", "d": "2025-10-31"}, {"k": "h", "c": "第三节 复杂信息", "x": "上级虽然名义上有最终决定权，拥有“形式权威”​，但由于信息复杂、不易处理，下级实际上自主性很大，拥有“实际权威”​。维护两类权威的平衡是政府有效运作的关键。若下级有明显信息优势，且承担主要后果，那就该自主决策。若下级虽有信息优势，但决策后果对上级很重要，上级就可能多干预。但上级干预可能会降低下级的工作积极性，结果不一定对上级更有利。(22)", "y": "", "d": "2025-11-19"}, {"k": "h", "c": "第三节 复杂信息", "x": "无论如何，信息优势始终是权力运作的关键要素。", "y": "", "d": "2025-11-19"}, {"k": "h", "c": "第三节 复杂信息", "x": "如果下级不想办某事，就可以拖一拖，或者干脆把皮球踢给上级，频繁请示，让没有信息优势的上级来面对决策的困难和风险，最终很可能就不了了之。", "y": "", "d": "2025-10-31"}, {"k": "h", "c": "第三节 复杂信息", "x": "即使是上级明确交代的事情，如果下级不想办，那办事的效果也会有很大的弹性，所谓“上有政策，下有对策”。", "y": "", "d": "2025-10-31"}, {"k": "h", "c": "第三节 复杂信息", "x": "实际权威来自信息优势，这一逻辑也适用于单位内部。", "y": "", "d": "2025-10-31"}, {"k": "h", "c": "第三节 复杂信息", "x": "所谓权力，实质就是在说不清楚的情况下由谁来拍板决策的问题。", "y": "", "d": "2025-11-02"}, {"k": "h", "c": "第四节 激励相容", "x": "如果一方想做的事，另一方既有意愿也有能力做好，就叫激励相容。", "y": "", "d": "2025-11-20"}, {"k": "h", "c": "第四节 激励相容", "x": "做任何事都有代价，最优的结果是让效果和代价匹配，而不是不计代价地达成目标", "y": "", "d": "2025-11-02"}, {"k": "h", "c": "第一节 分税制改革", "x": "成功的政策背后是成功的协商和妥协，而不是机械的命令与执行，所以理解利益冲突，理解协调和解决机制，是理解政策的基础。", "y": "", "d": "2025-11-03"}, {"k": "h", "c": "第二节 光伏发展与政府补贴", "x": "但正是这种“离土不离乡”的工厂，让当地农民熟悉了工业和工厂，培养了大量工人，为后来我国加入WTO后真正利用劳动力优势成为世界工厂奠定了基础。", "y": "", "d": "2025-11-27"}, {"k": "h", "c": "下篇 宏观现象", "x": "地方政府推动经济发展的模式。这种模式的第一个特点是城市化过程中“重土地、轻人”​，优点是可以快速推进城市化和基础设施建设，缺点是公共服务供给不足，推高了房价和居民债务负担，拉大了地区差距和贫富差距。", "y": "", "d": "2025-12-01"}, {"k": "h", "c": "第五章 城市化与不平衡", "x": "城市化需要投入大量资金建设基础设施，​“土地财政”和“土地金融”是非常有效的融资手段。通过出让城市土地使用权，可以积累以土地为信用基础的原始资本，推动工业化和城市化快速发展。中国特有的城市土地国有制度，为政府垄断土地一级市场创造了条件，将这笔隐匿的财富变成了启动城市化的巨大资本，但也让地方财源高度依赖土地价值，依赖房地产和房价。房价连着地价，地价连着财政，财政连着基础设施投资，于是经济增长、地方财政、银行、房地产之间就形成了“一荣俱荣，一损俱损”的复杂关系。", "y": "", "d": "2025-12-01"}, {"k": "h", "c": "第一节 房价与居民债务", "x": "房价短期内受很多因素影响，但中长期主要由供求决定。", "y": "", "d": "2025-12-03"}, {"k": "h", "c": "第二节 不平衡与要素市场改革", "x": "让更多人进入城市，尤其是大城市，逻辑上的好处是清楚的，但在现实中尚有很多争议，主要是担心人口涌入会造成住房、教育、医疗、治安等资源紧张。这种担心可以理解，任何城市都不可能无限扩张。劳动力自由流动意味着有人来也有人走，若拥挤带来的代价超过收益，自会有人离开。至于教育、医疗等公共服务，缓解压力的根本之道是增加供给，而不是限制需求。涌入城市的人是来工作和谋生的，他们不仅分享资源，也会创造资源。", "y": "", "d": "2025-12-03"}, {"k": "h", "c": "第三节 经济发展与贫富差距", "x": "并没有什么神秘的经济力量会自动降低收入不平等，“先富带动后富”也不会自然发生，而需要政策的干预。不断扩大的不平等会让社会付出沉重的代价，必须小心谨慎地对待。", "y": "", "d": "2025-12-04"}, {"k": "h", "c": "第六章 债务与风险", "x": "人们在乐观时往往会低估负债的风险，过多借债。", "y": "", "d": "2025-12-04"}, {"k": "h", "c": "第一节 债务与经济衰退", "x": "债务常常把风险集中到承受能力最弱的穷人身上。", "y": "", "d": "2025-12-04"}, {"k": "h", "c": "第二节 债台为何高筑：欧美的教训", "x": "债务源于人性：总想尽早满足欲望，又对未来盲目乐观，借钱时总觉得将来能还上。但人性亘古不变，债务周期却有起有落，每一次起伏都由特定的外部因素推动，这些因素会引发乐观情绪、刺激人们借债，也会增加资金供给、为借债大开方便之门。", "y": "", "d": "2025-12-04"}, {"k": "h", "c": "扩展阅读", "x": "其中见识，胜过无数东拼西凑的见闻。", "y": "", "d": "2025-12-07"}, {"k": "h", "c": "第一节 地区间竞争", "x": "但地方官员任期有限，必须在任期内干出政绩，且新官往往不理旧账，因此会刺激大干快上的投资冲动，拉动地区GDP数字快速上涨，不惜忽视长期风险和债务负担。", "y": "", "d": "2025-12-08"}, {"k": "h", "c": "第二节 政府的发展与转型", "x": "经济富裕、社会安定、政府得力是国家繁荣的三大支柱，缺一不可", "y": "", "d": "2025-12-08"}, {"k": "h", "c": "第二节 政府的发展与转型", "x": "扩大民生支出的瓶颈是地方政府的收入。第一章分析了事权划分的逻辑，这些逻辑决定了民生支出的主力必然是地方政府而不是中央政府。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "第三节 发展目标与发展过程", "x": "当下最重要的问题不是我国的GDP总量哪年能超过美国，而是探讨我国是否具备了下一步发展的基础和条件：产业升级和科技进步还能继续齐头并进吗？还有几亿的农民能继续城市（镇）化吗？贫富差距能控制在社会可承受的范围内吗？在现有的基础上，下一步改革的重点和具体政策是什么？因此本书在每个重要议题之后，都尽量介绍了当下正在实施的政策和改革，以便读者了解政策制定者对现实的把握和施政思路。有经济史学家在研究美国崛起的过程时曾言：​“在成功的经济体中，经济政策一定是务实的，不是意识形态化的。是具体的，不是抽象的。​”", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "结语", "x": "经济学是对经济现象的解读。现象复杂多变，偶然因素非常重要，过往并非必然，未来也不能确定。但经济学研究依然是有意义的。它能从过往事件的来龙去脉中提取一些因素，思考这些因素的不同组合，形成对事件的多种解读，给人启发。但什么是相关因素？怎么组合？又如何解读？这些都与所研究事件的所在环境密不可分。任何合格的理论当然都能自圆其说，但应用理论要跳出理论本身，才能审视其适用性和实用性，这种应用因时、因地、因人而异。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "结语", "x": "发现和提出好的问题，是解决问题的第一步，且“提问”本身，往往已蕴含了对解决思路的探索。切中要害的问题，必然基于对现实情况的深刻理解。因此，无论是理论家还是实践者，​“实事求是”和“具体问题具体分析”都是不会过时的精神。", "y": "", "d": "2025-12-09"}, {"k": "h", "c": "结束语", "x": "如果能帮助读者理解身边的一些事情，从热闹的政经新闻中看出些门道，从严肃的政府文件中觉察出些机会，争取改善一下生活，哪怕只是增加些谈资，也足够了。我是个经济学家，基于专业训练的朴素信念也有一个：生活过得好一点，比大多数宏伟更宏伟。", "y": "", "d": "2025-12-09"}, {"k": "t", "c": "结束语", "x": "我是个经济学家，基于专业训练的朴素信念也有一个：生活过得好一点，比大多数宏伟更宏伟。", "y": "看完这本书，对于宏大的政治经济学概念有所了解，虽然只是皮毛，但如作者所说，能更理解身边的一些事情，从热闹的政经新闻里读出些门道了。\n而这些抽象、冰冷的概念落到实处，是老百姓过好自己的生活。一本专业的政治经济学书籍的结尾，是这样一句充满人文关怀的话，好感动。\n生活过得好一点，是一切的答案。", "d": "2025-12-09"}]}, {"id": "928738", "title": "财务自由之路Ⅰ：7年内赚到你的第一个1000万", "author": "[德]博多·舍费尔", "cats": ["经济理财-理财"], "bmCount": 27, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "财富是你们与生俱来的权利；", "y": "", "d": "2021-12-03"}, {"k": "h", "c": "序", "x": "．储蓄一定比例的金钱。\n2．使用储蓄资金进行投资。\n3．提高自己的收入。\n4．从每次加薪中提取一定比例进行储蓄。", "y": "", "d": "2021-12-03"}, {"k": "h", "c": "第一章 你真正想要的是什么", "x": "我将生活简化为5个领域：健康、财务、关系、情感和人生意义。5个领域都同等重要。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第一章 你真正想要的是什么", "x": "健康是革命的本钱。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第一章 你真正想要的是什么", "x": "优化自己指的是，学习如何以最佳的方式来运用时间、方法、才能、金钱以及与他人合作，其目的是达到最优结果。如果你想优化你的生活，你就应该不断努力成为你能成为的最优秀的人。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第一章 你真正想要的是什么", "x": "相反，大多数人都毫无计划地生活着，同时也削弱了自己。他们尝试过一种得过且过的生活。5天的工作日对他们来说，是两个周末之间的令人不快的打扰。他们工作只是为了挣钱，并非为了一种满足感。他们不了解自己的天赋，当机会出现时，他们也识别不出来。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第一章 你真正想要的是什么", "x": "这世上只有两种可能性：不是你自己规划你的生活，就是别人来规划你的生活。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第三章 100万欧元是难以企及的奇迹吗", "x": "第一层次：你意识到自己对现状感到不满意。为了改变现状，你开始采取行动。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第三章 100万欧元是难以企及的奇迹吗", "x": "对我来说，持续不断地学习和成长已经成为我的人生信条。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第三章 100万欧元是难以企及的奇迹吗", "x": "将自己看作一个足够重要的人物，开始记录关于自己的日记。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第七章 如何增加自己的收入", "x": "你的付出应该多于别人对你的期望。让你周围所有人都感到惊喜吧。超出别人对你的所有期望吧。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第八章 储蓄——支付自己", "x": "“鹅”代表资本，金蛋代表利息。没有资本就没有利息。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第八章 储蓄——支付自己", "x": "没有人能仅仅通过挣很多钱就变得富有。财富产生于你对金钱的留存。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第九章 复利的奇迹", "x": "影响复利的，只有三个重要因素：时间、利润率和投入。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第九章 复利的奇迹", "x": "尽早开始是好事。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第九章 复利的奇迹", "x": "利润率很重要。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十一章 投资者和股民应遵从的原则", "x": "原则一：识别什么时候投资，什么时候投机", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十一章 投资者和股民应遵从的原则", "x": "就算你还清了房贷，你的房子还是一种债务。因为你需要不停地缴一些费用：税费，保险费，维修费，装饰费，置物费。最好不要把房子看作投资资产，而应看作奢侈资产。把房子看作投资资产让你安心，而奢侈资产是很费钱的。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十一章 投资者和股民应遵从的原则", "x": "如果你在投资之前就先买房，你也许就没有足够的余钱来投资了。相反，如果你选择先投资，你也许会因此获得额外收益，从而轻松购买一套房。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十一章 投资者和股民应遵从的原则", "x": "哪一个对你而言更重要：尽快拥有一处富丽堂皇的住所，还是先达到一定的财务目标。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "汽车不是一项投资，它只属于消耗品。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "要么开源，要么节流", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "：", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "“有两条通向幸福的道路：降低要求或者增加财富。两者导向的目标是相同的。不同的只是每个人会根据自身习惯选择出最适合自己的捷径。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "专业的处理方式就完全不同了。他们活在当下，同时也为未来做准备。因此他们首先支付自己。你也会变成一名理财专家！", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "我们必须澄清一条重要的原则：你永远不能杀你的“鹅”。你也不能将它切割成小块。绝不能动用你的本金。你所有的梦想，能借助金蛋来满足。这也意味着，你的金蛋必须大到足以承担你的梦想。", "y": "", "d": "2021-12-04"}, {"k": "h", "c": "第十二章 财务保障、财务安全和财务自由", "x": "你千万不能将用于保证你财务安全的金钱投进高风险或是投机性质的项目。你千万不要动用这笔钱。你进行的投资必须保证你的财务安全永远不会受到影响。", "y": "", "d": "2021-12-04"}]}, {"id": "23914703", "title": "理财就是理生活", "author": "艾玛·沈", "cats": ["经济理财-理财"], "bmCount": 18, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "钱不是最重要的，但当你缺钱的时候，它就如同一条粗粗的麻绳，捆绑住了你自由的灵魂。只有当你成为这条绳索的掌控者时，你才能随心所欲，做你想做的事。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "前言", "x": "让大家不会一提到“理财”，就只会联想到赚钱、投资和买保险，明白理财是一个集认识自身、设定目标、控制消费、管理债务、职业发展、购入和盘活资产、配置与风险、架构设计和传承规划于一体的系统工程。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "前言", "x": "人与人的差距，除了运气和努力，更重要的是，在认知差距影响下的一次次选择所造成的距离。自你翻开这本书起，我相信，你这一次的选择绝对没有错。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "第1篇 概述", "x": "“草帽曲线”把人生比喻成一条射线。人一出生，就如同开弓，没有回头箭，一路急匆匆地奔向死亡。我们不得不面对迎面而来的各种问题。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "第1篇 概述", "x": "25～60岁，是我们的黄金期。我们毕业后，步入社会。我们充满力量和希望，我们相信靠自己能够改变自己和家人的命运。这一时期是我们的黄金期，也是我们从梦想的云端跌入凡尘的时期。理想很丰满，现实很骨感。我们努力工作、创业，赚得越来越多，负担却也越来越重。我们成家立业、买房买车、养儿育女、赡养老人，收入越来越高，支出也越来越多。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "第1篇 概述", "x": "（1）开源：拓宽财富蓄水池。\n（2）节流：适当控制支出。\n（3）分配：合理调配，以支付一生的费用。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "第1篇 概述", "x": "逝者已去，来者可追。种一棵树，最好的时机是在十年前，其次就是现在。现在开始还不晚。", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "第2章 鸭舌帽曲线", "x": "‘财务安全’是指，财务状况足以应付未来所有的财务支出和其他生活目标的实现，不会出现大的财务危机。在理财界，衡量是否达到财务安全有八个指标：", "y": "", "d": "2021-09-25"}, {"k": "h", "c": "第2章 鸭舌帽曲线", "x": "当你每月的被动收入超过了每月支出时，我们就说你达到了财务自由。", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第2章 鸭舌帽曲线", "x": "‘被动收入’，是指不需要你付出大量时间和精力，就能不断将钱放入你口袋的收入。你每天去上班，赚的工资不是被动收入。因为只要你停止工作，收入也就没了。”", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第2章 鸭舌帽曲线", "x": "实现财务自由有两个因素，即被动收入和日常支出。要想实现财务自由，需要从两个方向去努力。其一，增加被动收入；其二，缩减日常支出。两者并举，就比较容易实现财务自由。”", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第3章 时间就是金钱，一寸光阴一寸金", "x": "所谓单利，就是一笔钱无论存多久，只有本金计算利息。", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第3章 时间就是金钱，一寸光阴一寸金", "x": "爱因斯坦曾说，复利是世界第八大奇迹，知之者赚、不知之者被赚。”", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第3章 时间就是金钱，一寸光阴一寸金", "x": "如果年利率一样，每月结算一次利息已是最优。”", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第3章 时间就是金钱，一寸光阴一寸金", "x": "银行理财产品，如果年利率一样，就买每月结算一次的。", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第3章 时间就是金钱，一寸光阴一寸金", "x": "72法则，是以复利为原理，用以估算投资翻倍或货币贬值减半所需要的时间的。”", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第3章 时间就是金钱，一寸光阴一寸金", "x": "记住影响复利的四个因素。时间就是金钱，一寸光阴一寸金。从现在开始，多存钱、多学习，提高投资收益率，并一直坚持下去。你做得越好，收获就越多。”", "y": "", "d": "2021-09-26"}, {"k": "h", "c": "第4章 理财是一个系统工程", "x": "之所以理财知识了解容易操作难，最重要的症结是，大家总想着学习，想从外部找到一个标准答案，却很少仔细地分析自己的收支情况、优劣势和拥有的资源。", "y": "", "d": "2021-09-26"}]}, {"id": "3300083150", "title": "时间贫困", "author": "[英]凯茜·霍姆斯", "cats": ["经济理财-管理", "个人成长-励志成长"], "bmCount": 11, "rvCount": 0, "notes": [{"k": "h", "c": "将幸福科学运用于人生设计", "x": "你要有意识地规划时间，而不是漫无目的地任凭时间流逝。", "y": "", "d": "2026-09-05"}, {"k": "h", "c": "将幸福科学运用于人生设计", "x": "你每天拥有的时间是有限的。", "y": "", "d": "2026-09-05"}, {"k": "h", "c": "将幸福科学运用于人生设计", "x": "将自己的日程表看作一幅美丽多彩的组合画，而你就是创作这幅画的艺术家。", "y": "", "d": "2026-09-05"}, {"k": "h", "c": "将幸福科学运用于人生设计", "x": "“时间贫困”是一种普遍存在的感觉，即要做的事情太多而时间太少。", "y": "", "d": "2026-09-05"}, {"k": "h", "c": "时间贫困的后果", "x": "深陷时间贫困时，我们只是在勉强度日。", "y": "", "d": "2026-09-07"}, {"k": "h", "c": "时间贫困是一种主观感受", "x": "时间贫困是一种主观感受", "y": "", "d": "2026-09-07"}, {"k": "h", "c": "时间贫困是一种主观感受", "x": "时间贫困指的是“感觉”没有充足的时间去完成需要做和想要做的事情。但是需要注意的是，这一定义中的两个组成部分具有主观性：一是你想要做的，以及你认为自己需要做的事情，二是在已有的时间内，你完成所有事情的信心。", "y": "", "d": "2026-09-07"}, {"k": "h", "c": "时间贫困是一种主观感受", "x": "从主观和客观上增加你的可用时间的方法之一，是减少花在屏幕上的时间。这样你就不会那么羡慕别人多姿多彩（而又精心编织）的生活了。同时，你也会真正拥有更多的时间，对许多人来说，每周这样的时间加起来就会有好几个小时。", "y": "", "d": "2026-09-07"}, {"k": "h", "c": "时间贫困是一种主观感受", "x": "自我效能感(self-efficacy)[插图]这一术语常被用来描述你在何种程度上相信自己能完成所有想做之事与应做之事。我们的一项研究表明，当人们感受到更强的自我效能感时，他们也会认为自己拥有更多时间。[插图]这一发现意义重大，因为它意味着你可以有意识且有效地操纵你的时间宽裕度。通过采取一些手段增强你的自信心，你就会大大缓解时间贫困的困境。因此，下面让我们探索一些行之有效的策略来增强我们的自我效能感，从而让我们感到时间宽裕些。", "y": "", "d": "2026-09-07"}, {"k": "h", "c": "增强自我效能感的策略", "x": "增强自我效能感的策略自我扩容", "y": "", "d": "2026-09-07"}, {"k": "h", "c": "练习：随机行善", "x": "眺望海上的地平线，仰望繁星点点的夜空，在秋高气爽的日子里沉醉于枝叶扶疏的温暖色彩，大自然的丰富让我们能换个角度看待一天中的压力。", "y": "", "d": "2026-09-07"}]}, {"id": "3300010436", "title": "爆款小红书：从零到百万粉丝的玩赚策略", "author": "吕白", "cats": ["经济理财-商业"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "第一节 做内容不要自我陶醉", "x": "第一，找到自我表达与用户需求之间的交集。", "y": "", "d": "2023-02-03"}, {"k": "h", "c": "第一节 做内容不要自我陶醉", "x": "第二，没人关心你的内容多完美，他们只关心自己的需求是否被满足。", "y": "", "d": "2023-02-03"}, {"k": "h", "c": "第三节 要非常专一", "x": "做小红书，你要非常专一，选择一个细分领域，把它做到最好，成为这个领域的头部，这样你才有可能成为大V。不信你看那些已经成为小红书大V的博主，都非常专一。", "y": "", "d": "2023-02-03"}]}, {"id": "3300034329", "title": "稀缺：为什么穷人逆天改命这么难？", "author": "塞德希尔·穆来纳森  埃尔德·沙菲尔", "cats": ["经济理财-商业"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "赞誉", "x": "穷人思维植根于人类的基因，率先用理性击碎它的人，也将率先获得身与灵的富足。", "y": "", "d": "2025-05-02"}, {"k": "h", "c": "引言 资源稀缺不可怕，就怕有稀缺心态", "x": "稀缺，是“拥有”少于“需要”的感觉", "y": "", "d": "2025-05-02"}]}, {"id": "857393", "title": "互联网产品修炼手册", "author": "刘显铭等", "cats": ["经济理财-商业"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "第1节 产品经理学习技术的4个必要性", "x": "[插图]\nH5前端工程师的成果\n2．必备核心技术：HTML5开发语言\nHTML5是一种用于Web应用程序开发、具有变革意义的网络技术。HTML5是HTML的第五次重大修改，在原来HTML的标准上，增加了很多多媒体的特性，以及针对移动设备的支持，目前很多移动设备上的网页都采用HTML5协议标准来进行开发。\n【案例】", "y": "", "d": "2019-03-13"}, {"k": "h", "c": "第1节 数据的基础认知", "x": "❑ 页面流：页面的分工与内容呈现，页面之间的层次关系，跳转方式等。\n❑ 权限：不同关注维度的数据呈现与数据安全的管理方式。\n❑ ETL：数据从数据源同步到分析系统的频率与规则。\n❑ 集成：界面、预警等层面与其他系统的集成关系与方式。\n❑ 性能：结合使用习惯和不同角色的使用频率，对性能的要求。\n（5）系统实施\n输出《数据运营系统需求文档/实施方案》后，经过评审，将由开发工程师依据需求实施开发，交付产品。系统实施的环节，产品经理需要重点关注和跟进测试。\n练习\n以互联网产品腾讯视频为例，分析腾讯视频的用户活跃情况及营收情况，尝试拆解其产品目标与细分指标。", "y": "", "d": "2019-03-15"}]}, {"id": "3300054564", "title": "当世界停止消费", "author": "J.B.麦金农", "cats": ["经济理财-财经"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第一部分 起初", "x": "在消费文化中，你绝不能承认你卖的东西可能不值得买。", "y": "", "d": "2026-03-11"}]}]}];

    let activeMacro = 'ALL';
    let searchQuery = '';
    let thoughtOnly = false;
    let selectedBookId = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlightText(text, query) {
      const safe = escapeHtml(text);
      if (!query) return safe;
      const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>');
    }

    function getFilteredMacros() {
      const q = searchQuery.trim().toLowerCase();
      return DATA.map(macro => {
        if (activeMacro !== 'ALL' && macro.key !== activeMacro) {
          return { ...macro, books: [] };
        }
        const books = macro.books.filter(b => {
          if (thoughtOnly && b.rvCount === 0) return false;
          if (!q) return true;
          if (b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)) return true;
          return b.notes.some(n => (n.x && n.x.toLowerCase().includes(q)) || (n.y && n.y.toLowerCase().includes(q)));
        });
        return { ...macro, books };
      }).filter(m => m.books.length > 0);
    }

    function renderMacroTabs() {
      const box = document.getElementById('macroTabs');
      const totalBooks = DATA.reduce((s, m) => s + m.books.length, 0);
      const chips = [
        `<button class="macro-chip ${activeMacro === 'ALL' ? 'active' : ''}" data-key="ALL">全部 (${totalBooks})</button>`
      ];
      DATA.forEach(m => {
        chips.push(`<button class="macro-chip ${activeMacro === m.key ? 'active' : ''}" data-key="${m.key}">${m.name} (${m.books.length})</button>`);
      });
      box.innerHTML = chips.join('');
      box.querySelectorAll('.macro-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeMacro = btn.dataset.key;
          renderAll();
        });
      });
    }

    function renderBookList(macros) {
      const box = document.getElementById('bookList');
      if (macros.length === 0) {
        box.innerHTML = '<div class="empty-state">没有匹配的书籍或笔记</div>';
        return;
      }

      // Ensure selectedBookId exists in current filtered list
      const allVisibleBooks = macros.flatMap(m => m.books.map(b => ({ ...b, macroName: m.name })));
      if (!selectedBookId || !allVisibleBooks.some(b => b.id === selectedBookId)) {
        selectedBookId = allVisibleBooks[0].id;
      }

      box.innerHTML = macros.map(m => `
        <div class="cat-group-title">
          <span>${m.name}</span>
          <span>${m.books.length} 本</span>
        </div>
        ${m.books.map(b => `
          <div class="book-item ${b.id === selectedBookId ? 'active' : ''}" data-id="${b.id}" tabindex="0" role="button">
            <div class="book-item-title">${highlightText(b.title, searchQuery.trim())}</div>
            <div class="book-item-meta">
              <span>${escapeHtml(b.author)}</span>
              <span>${b.bmCount} 划${b.rvCount > 0 ? ` · 💭${b.rvCount}` : ''}</span>
            </div>
          </div>
        `).join('')}
      `).join('');

      box.querySelectorAll('.book-item').forEach(el => {
        const pick = () => {
          selectedBookId = el.dataset.id;
          renderBookList(macros);
          renderDetail(allVisibleBooks.find(b => b.id === selectedBookId));
        };
        el.addEventListener('click', pick);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            pick();
          }
        });
      });
    }

    function renderDetail(book) {
      const main = document.getElementById('mainContent');
      if (!book) {
        main.innerHTML = '<div class="empty-state">请从左侧选择一本书查看划线与想法</div>';
        return;
      }

      const q = searchQuery.trim().toLowerCase();
      let notes = book.notes;
      if (thoughtOnly) {
        notes = notes.filter(n => n.k === 't');
      }
      if (q && !book.title.toLowerCase().includes(q) && !book.author.toLowerCase().includes(q)) {
        notes = notes.filter(n => (n.x && n.x.toLowerCase().includes(q)) || (n.y && n.y.toLowerCase().includes(q)));
      }

      let html = `
        <div class="book-header">
          <div>
            <span class="book-macro-badge">${escapeHtml(book.macroName)}</span>
            <h1 class="book-title">《${escapeHtml(book.title)}》</h1>
            <div class="book-meta-line">
              作者：${escapeHtml(book.author)} · ${book.cats.length ? escapeHtml(book.cats.join(' / ')) : '未分类'} · 共 ${book.bmCount} 条划线${book.rvCount ? `、${book.rvCount} 条想法` : ''}
            </div>
          </div>
          <button id="copyBookMd" class="copy-btn" type="button">复制本书 Markdown</button>
        </div>
      `;

      let curChap = null;
      notes.forEach(n => {
        const chap = n.c || '正文';
        if (chap !== curChap) {
          curChap = chap;
          html += `<h2 class="chapter-heading">${escapeHtml(chap)}</h2>`;
        }
        const isThought = n.k === 't';
        html += `
          <article class="note-card ${isThought ? 'is-thought' : ''}">
            ${n.x ? `<div class="note-text">${highlightText(n.x, searchQuery.trim())}</div>` : ''}
            ${isThought && n.y ? `<div class="thought-box"><strong>💭 个人想法：</strong>${highlightText(n.y, searchQuery.trim())}</div>` : ''}
            <div class="note-foot">
              <span>${isThought ? '划线 + 想法' : '划线'}</span>
              <span>${n.d || ''}</span>
            </div>
          </article>
        `;
      });

      main.innerHTML = html;

      document.getElementById('copyBookMd').addEventListener('click', async () => {
        const lines = [`# 《${book.title}》`, `- 作者：${book.author}`, `- 大类：${book.macroName}`, ''];
        let prevChap = null;
        book.notes.forEach(n => {
          const ch = n.c || '正文';
          if (ch !== prevChap) {
            prevChap = ch;
            lines.push(`## ${ch}`, '');
          }
          if (n.x) lines.push(`> ${n.x}`);
          if (n.k === 't' && n.y) lines.push(`- **💭 想法**：${n.y}`);
          lines.push('');
        });
        try {
          await navigator.clipboard.writeText(lines.join('\n'));
          showToast(`已复制《${book.title}》全部笔记 Markdown`);
        } catch {
          showToast('剪贴板写入受限，请手动选择复制');
        }
      });
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function renderAll() {
      renderMacroTabs();
      const macros = getFilteredMacros();
      renderBookList(macros);
      const allBooks = macros.flatMap(m => m.books.map(b => ({ ...b, macroName: m.name })));
      renderDetail(allBooks.find(b => b.id === selectedBookId) || null);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderAll();
    });

    const thoughtBtn = document.getElementById('thoughtOnlyBtn');
    const thoughtBookCount = DATA.reduce((s, m) => s + m.books.filter(b => b.rvCount > 0).length, 0);
    thoughtBtn.textContent = `仅看有💭想法的书 (${thoughtBookCount})`;
    thoughtBtn.addEventListener('click', () => {
      thoughtOnly = !thoughtOnly;
      thoughtBtn.classList.toggle('active', thoughtOnly);
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
