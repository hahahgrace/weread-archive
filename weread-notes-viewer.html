 "x": "“水冰地坼”之时，最重要的是“无扰乎阳”，什么叫扰乎阳气？比如冬天过分地洗澡，就等于你毛孔不断地宣开，就伤精。过去都是澡堂子，冬天基本上是一礼拜洗一次，这是最合理的。还有一个中医里面讲叫“冬不按跷”，就是冬天一定不要多按摩、刮痧等，这些都相当于扰乎阳，过分洗澡啊，做爱啊，都相当于扰乎阳，所以这些事都得节制。", "y": "", "d": "2023-11-19"}, {"k": "h", "c": "六 贼风数至", "x": "“道法自然”就是叫你别较劲，只是用一颗安静的心，去听、去观、去照、去觉知", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "七 四气", "x": "脾胃是生气、生血之所，别总想着让什么东西来给你补气补血，只要脾胃好，气和血都能慢慢恢复，脾胃一坏，气血的源头就出问题了。现在很多人一旦有点不舒服就求药，可就是好好吃饭、好好睡觉这两种最上等的药，不肯好好服用。更何况，很多病就是因为不好好吃饭、不好好睡觉得的。再说了，脾胃最容易消化的就是“饭”，若是吃饭都成问题了，吃药又有什么用呢？", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "八 道者，圣人行之，愚者佩之", "x": "春夏养阳，是指春夏养生发、生长之气；秋冬养阴，是指秋冬要养收敛、收藏之气。所谓养阳就是别憋着，所谓养阴就是该眯着就眯着。", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "一 生之本，本于阴阳", "x": "以身体论，不算脑子，身体的前面一律为阴，背部为阳。手臂内侧全为阴，手臂的外侧全为阳。大腿内侧为阴，其余三面皆为阳。大腿后面是足太阳膀胱经，锻炼膀胱经，可以靠压腿；侧面是足少阳胆经，可以敲打胆经；大腿正面整个区域，包括膝盖、脚面，是足阳明胃经。", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "一 生之本，本于阴阳", "x": "锻炼胃经的方法比较奇特，就是跪着，保护膝盖最好的方法也是跪着，即屁股坐在脚后跟上，脚面便得到了拉伸，才是正确的方法。大家今天回去跪一下，很疼，会出汗。跪法，是锻炼胃经的上上法。", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "一 生之本，本于阴阳", "x": "阳虚，就是阴气（邪）盛，以及血盛气衰。", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "一 生之本，本于阴阳", "x": "肝开窍于目", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "一 生之本，本于阴阳", "x": "天圆地方，人头圆、足方以应之。天有日月，人有两目。地有九州，人有九窍。天有风雨，人有喜怒。天有雷电，人有音声。天有四时，人有四肢。天有五音，人有五藏。天有六律，人有六府。天有冬夏，人有寒热。天有十日，人有手十指。", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "四 精与神", "x": "一定要记住，人不是靠指标活着，而是靠感觉活着。", "y": "", "d": "2023-11-21"}, {"k": "h", "c": "五 卫气", "x": "心主血脉，肾主骨，肝主筋，脾主肌肉，肺主皮毛", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "五 卫气", "x": "生气伤阳，受寒也伤阳，阳气销伐，阴就不长；阴精销伐，阳也不生。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "五 卫气", "x": "天亮不醒，就压抑了卫气巡行于阳；天黑不睡，又使得卫气无法入于阴，长此以往，气血就乱了，气血一乱，身心都会出问题，就是病，就会形成睡眠障碍。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "五 卫气", "x": "白天过劳、过虑，伤阳；晚上过熬，伤阴。把这一段听懂了，也就明白了《黄帝内经》为什么说“机在目”，卫气出阳入阴的机关，就在眼睛的开合——睁眼，启动阳；\n闭眼，启动阴。睁眼，气血就上头，就没有所谓心识的放下；眼一闭，万物消息，神气内敛。所以养生第一大法是常闭眼。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "六 阳气", "x": "烦，是心病，烦就是心里乱；躁，是肾病，躁就是腿脚躁动不安。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "七 情志伤阳及皮肤症状", "x": "年轻人呢？我建议多抱抱，别把生活过得那么紧张严肃无聊。当下肺心舒缓，则皮毛舒缓，通体舒缓，则心生宽容，宽容则生和谐。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "七 情志伤阳及皮肤症状", "x": "把情绪调好了，休息好了，皮肤病必然变轻。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "七 情志伤阳及皮肤症状", "x": "皮肤病和节气相关，跟肺相关，肺的病变源于忧思和焦虑；肺又跟肝肾相关（金克木、金生水），肝肾又关涉到元气和免疫力，所以，皮肤病的总根源有三：一是焦虑，二是乱服药，三是免疫力低下。如果病都长在皮肤上了，那身体里面一定有点儿虚", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "七 情志伤阳及皮肤症状", "x": "忧伤肺，你别老焦虑，就不得这病。肺与大肠相表里，你代谢好，身体内部和体表就没有垃圾。肺为娇脏，你别让孩子从小一得感冒就乱吃药，让孩子多晒太阳、多锻炼，肺气就强大。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "七 情志伤阳及皮肤症状", "x": "如何养皮肤呢？首先要知道：1.肺主皮毛，皮肤称玄府，是人体隐秘的呼吸系统，忧伤肺，忧虑则伤皮毛之开合，舒缓呼吸则养之。2.脾主肌肉，脾虚则面黄肌瘦，或面庞浮肿，没有弹性。3.面部主要是胃经巡行，胃生气生血，胃不好则脸不润泽。4.小肠经过颧，心与小肠相表里，心情不好则颧生斑。故养皮肤在于养心、肺、脾、胃。心情愉悦，呼吸舒缓，好好吃饭，适当运动，则唇红齿白，明眸异彩。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "八 阳气者，精则养神，柔则养筋", "x": "平时拉筋，产生的痛感其实也是辛散的力量，但过度拉伸则伤血，拉筋出汗更伤血，所以，最好慢慢来，不要急于求成。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "八 阳气者，精则养神，柔则养筋", "x": "总之，要想不得这一系列的病，先要阳气足。阳气怎样才能足呢？首先，先别损伤阳气。什么损伤阳气呢？寒凉损阳。外寒为风湿，内寒为寒凉药物和精神郁闷；生气憋阳，所以还要少生气。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "八 阳气者，精则养神，柔则养筋", "x": "其次，要血足。久视伤血，天天捧着手机电脑不放，就伤血。而且肝主筋，肝病，血不濡筋。总之，养骨的秘密在于养血，养血的秘密在于养肝，养肝的秘密在于睡眠好、吃得好和心情愉悦。所以养生不过就是睡觉吃饭罢了。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "八 阳气者，精则养神，柔则养筋", "x": "刚生完孩子坐月子的产妇，不是不让你洗澡，而是不让你着风。因为生育不仅是阴道骨盆全开，而且全身，包括玄府也都开了。这时一旦着风，尤其是寒风，就是久治不愈的“产后风”。怎么能不着风？特简单，就是你在浴室里把身体完全擦干，同时穿上衣服，穿上袜子，把脚踝处包好再出来，你就不会得月子病。", "y": "", "d": "2023-11-23"}, {"k": "h", "c": "十一 阴平阳秘", "x": "痛经是寒凝", "y": "", "d": "2023-12-06"}, {"k": "h", "c": "五 阴中有阴，阳中有阳", "x": "过去和尚讲究“过午不食”，他们认为傍晚以后再吃东西，就等于是吃鬼食了。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "五 阴中有阴，阳中有阳", "x": "中午到下午2点左右，是心经和小肠经当令的时候，吃多了，会增加心脏的负担。别忘了，化食物也是个体力活，吃完饭人犯困，就是自保，调元气化食物时，人就索性眯一觉。中午，哪怕只睡10分钟，对心脏也是修复。\n上午，", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "六 藏者为阴，府者为阳", "x": "怎么揉呢？双手相叠，放在肚脐上，先逆时针揉49下，这叫先泄，然后顺时针揉49下，这叫后补。大肚子都会消掉。又有人问了：为什么是49下啊？先前讲过，气血都与7数有关，七七四十九是至阴之数，脾也为至阴，故取这个数。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "七 东方", "x": "没有错误的婚姻，她不会肝郁至此，腿上的筋结、痔疮、子宫肌瘤都是因肝郁所致，这一系列的病，包括情绪，包括她的生活，都是肝系统的毛病。假如你懂了这个，将来她还会得什么病，你照样可以推算出来，比如肝不好，将来心脏一定出问题，血压一定出问题", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "八 南方", "x": "人生于火，生于阳气，我们所做的一切，都应该是培火、壮火，而不宜损火。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "八 南方", "x": "羊肉热性、精美，养心。所以老祖宗让我们冬至、夏至都吃羊肉、喝羊汤。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "九 中央", "x": "甘，我们讲过，不是甜，而是不酸、不苦、不辛、不咸的一种淡淡的味道。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "九 中央", "x": "土爰稼穑。因为有种植、有收获，所以土德为信用。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "十一 北方", "x": "北方黑色，入通于肾”，首先大家要记住凡是黑色的都入肾，黑芝麻、黑豆。腊八，多煮豆类的粥，就是要强壮你的肾，因为豆类的东西长得就像腰子。", "y": "", "d": "2023-12-21"}, {"k": "h", "c": "二 应象", "x": "意动火功寒，就是欲念会燃起大火，然后人的阳气就衰微了。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "二 应象", "x": "我们的人性也被提前设计好了，人性如何，会决定人生的路会怎么走，但无论怎么走，所有人，都会随着生命走到终点，于是，水寂山寥，人性也会随之淹没，水波很快就抹平了我们曾经来过的痕迹……", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "二 应象", "x": "但上窍，一天当中，除非睡觉了，分分钟在耗散着我们，哪怕闭着眼睛，我们还是在想事，只要在想事，就耗散着阳气。看手机、看微信，耗眼窍；\n说话，耗口窍；听别人说话，耗耳窍；一紧张、一焦虑，就呼吸急促，耗鼻窍；\n脑子总想事，耗脑窍……总之，这些都是在耗散阳气，而且阳气比阴气耗散的要多得多！", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "三 壮火之气衰，少火之气壮", "x": "疼和痛有轻微差别，疼是寒邪，喜欢人用手热敷，所以可以用热敷法；而痛，一定害怕人碰，一碰就烦躁，并大呼小叫，比如妇女经前乳房胀痛，碰不得，所以调理要用轻轻的疏通法。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "三 壮火之气衰，少火之气壮", "x": "大病，都关乎情志，天天高兴着，少吃点，没事。都说要跟喜欢的人在一起，其实，是要跟人的长处在一起，短处吗，你可以化他，而不能说他，化不了的，就任凭老天处置，犯不着我们多嘴。好多事，让老天去管吧，我们少管闲事。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "以生喜怒悲忧恐。\n这句的要点是，性情都是从脏腑发出来的。这颠覆了我们以往的认知，即，认为性情皆源于环境和教育。《黄帝内经》告诉我们，之所以叫“本性”，是本性源于肉身，源于五脏。情是天性，不学而能。藏在心里为性，发出来为情。心在志为喜，肺在志为忧，肝在志为怒，脾在志为思，肾在志为恐。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "大家不要小瞧生气这件事，生气是最堵经脉的，凡大病，一定跟情志有关。你看，人生气时，会说：气得我胃疼，气得我肝疼，这就是生气对我们生命的损害，生气就会把我们经脉全堵上。而自救就是捶胸顿足，甚至号啕大哭，就是用肺的悲伤来对治愤怒。\n不要小瞧生气这件事，生气是最堵经脉的。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "大家一定要明白，所谓“贪嗔痴慢疑”和“仁义礼智信”，都不是老祖宗凭空想象出来的东西或概念，而是我们五脏本性的外显，这就是《黄帝内经》最了不起的地方，也就是说：你的五脏什么样，你的德行就是什么样。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "过去，我们总觉得德行都是外在环境造就的，而对天性所知甚少。学《黄帝内经》最大的益处，是让我们重新觉知了自我，原来，贪嗔痴慢疑、仁义礼智信，都源于我们的肉身，一切好与坏，我们通通本性“具足”。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "关于情绪，我们要深知喜乐对我们的人生意义。这两年，我对一个词体会特别深，叫“法喜”。什么叫“法喜”？其实就是得道的喜悦。三年前，我开始讲《黄帝内经》和《诗经》，天天沉浸其中，我相信现在每天听《黄帝内经》和《诗经》的人，会跟我一样，情绪特别稳定和欢快。我们原先是“心随境转”，也就是说外面微小的变化都可能改变我们的情绪，今天有人说爱我了我就高兴，明天有人说我不好了我就生气，哪怕别人一个眼神都会让我们不安。如此这般，生活就有无限烦扰，不仅我们的心不定，更可怕的是，我们无法掌控命运，谁都可以左右我们。\n而“法喜”，就是“境随心转”。甭管天冷了还是天热了，甭管有人爱我了还是没人爱我了，我都保持着时时不变的喜悦。这种恒定的喜悦，可以让我对外境有着无限的宽容、同情和理解。他不爱我了，是跟我没缘；你没听《黄帝内经》，是跟《黄帝内经》无缘；你没听《诗经》，是跟《诗经》没缘……我看万物都婆娑，万物看我亦曼妙。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "法喜，就是无论出现了什么事，我们都能保持每时每刻的安宁与喜悦，这种不间断的安宁与喜悦，不是大喜，而是“若有私意，若己有得”。时时刻刻，都充盈着，都满足着，都赞叹着，因为生命太美好了，因为听闻了真理，太美好了。有人会说：难道你对世上的那些苦难视而不见吗？见啊，怎么能不见呢？那些苦难自身也有啊，也深深感知啊，不见自己，怎能见众生、见天地！", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "是不是神仙，要看他身上有没有源源不断的动力和生命力，要看他能不能在孤独寂寞当中保持持久的快乐和信念。我倒觉得，我们现在能每天离群索居，读那么几小时的经典，并且从中得到安宁与快乐，已经算是有点神仙境界了，当这种快乐能在我们的生命里持续存在时，我们就有了法喜。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "四 喜怒悲忧恐", "x": "女孩就一条，无论春夏秋冬都最好穿袜子，因为“寒从脚下起”。", "y": "", "d": "2024-01-08"}, {"k": "h", "c": "五 重阴必阳，重阳必阴", "x": "在圣人为我们成就的经典中，有着两大特性：一个是自足，一个是具足。自足，就是它不需要借助外力而圆满；具足，就是它本身就是一切。", "y": "", "d": "2024-01-09"}, {"k": "h", "c": "六 五方应象（一）", "x": "人这一辈子，活的就是这肉身", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "肝气最怕被憋，一憋就瘀。治肝，只有一个方法：疏泄法，叫疏肝理气，如果有人跟你说我给你补补肝吧，补不了。肝，只有疏泄法，怎么疏泄肝郁呢？如果生气了，就赶紧两臂上举，因为肝郁在两腋，先把两腋宣开，吐出两口恶气，就会舒服很多。要不，就用暖肝法，憋，不就是寒吗，泡泡温泉，流流眼泪也成。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "这世上，谁都难保证不生气。现在我对不愉快的事情的处理方式是，若与家人生气了，我会说：有话不能好好说吗？！跟外人，索性不生气了，耶稣还被自己的心腹犹大背叛呢！有几个人祸害你不是正常吗？索性“扶上马送一程”，好聚好散就成，远远地不再见面就是了。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "鲁迅先生对悲剧有一句精辟的概括：悲剧是把人生有价值的东西毁灭给人看。人类精神的所有苦难，在悲剧中都有体现，相形之下，我们小小的精神困顿又算得了什么呢？！总之，知其渺小，方能放下。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "在古人的眼里，人最贵，生命最贵。是人发现了这个世界，赞美这个世界，如若不慎，人也会毁灭这个世界。所以，没有比探索人类更为有趣而深刻的事了。于是，谈东西南北，谈自然，谈声，谈色，谈味道，都是在谈人。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "要想理解南方，先要理解夏天，“夏”这个字，甲骨文里画了个“蝉”，就是知了。\n夏，假也。夏天，就是在给生命放假，放假，就是让生命放松、快活、慵懒，好好地让生命休息和成长。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "说来说去，天底下什么最傻？脑子最傻，脑子想得最多，一旦想当然了，脑子最容易犯傻劲儿；什么最不傻？肉身最不傻，肉身的第一原则，就是自保。自保，就是天热了，就把气血拿出去抵抗热，天冷了就要让气血全部内收，保生命之根，保五脏六腑，皮肤、手指冻烂了，都不会管。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（一）", "x": "心，本性为散，你若憋着了，就忤逆了它的本性。", "y": "", "d": "2024-01-12"}, {"k": "h", "c": "六 五方应象（二）", "x": "《黄帝内经》最朴实的态度，是对肉身及人性的尊重。她不要求人绝欲，也不要求人禁欲，而是让人学会降低欲望，就像五脏六腑那样各安其位。美女是用来倾国的，你若非要娶美女，非要担当国运，那就只有倒霉。生存是可以降低成本的，我们要学会对别人的生活视而不见，否则，一切攀比攀缘都会导致痛苦。", "y": "", "d": "2024-01-15"}, {"k": "h", "c": "六 五方应象（二）", "x": "让杂乱思绪停止的方法是“没心没肺”——没心，是来去不留于意，圣人之用心若镜，来了，就来了；走了，就走了。死活拽别人来，或死活留别人不走，都是无聊的自私。没肺，就是从关注呼吸下手，当你屏住呼吸的那一瞬，你只能关注当下，这也是所有静心技巧先从呼吸下手的原因。\n没心，是你的人生境界；没肺，则需要训练。", "y": "", "d": "2024-01-15"}, {"k": "h", "c": "六 五方应象（二）", "x": "中国的白酒是粮食的精华，比如粮食发酵后反蒸上去的水汽，用竹筒收起，就叫一锅头，再蒸一遍叫二锅头，据说三遍之后就无酒力了，就改做醋了，可见醋也化肉食。", "y": "", "d": "2024-01-15"}, {"k": "h", "c": "六 五方应象（二）", "x": "保持一颗欢喜心，就能克服忧伤和焦虑。人间不值得，再愤懑忧虑，其实也于事无补。", "y": "", "d": "2024-01-15"}, {"k": "h", "c": "六 五方应象（二）", "x": "湿就是囊肿，湿兼寒凝，就是肌瘤。", "y": "", "d": "2024-01-15"}, {"k": "h", "c": "六 五方应象（二）", "x": "“寒伤血，燥胜寒”。寒邪凝滞就会调动元气破瘀而损伤精血。燥胜寒，燥气可以使肾精精炼到极致，精足则能胜寒凝。", "y": "", "d": "2024-01-15"}, {"k": "h", "c": "八 七损八益", "x": "是以圣人为无为之事”。“无为之事”，就是用身子别用脑子，我们跟圣人的区别，就在于天天过度用脑子。用脑子，就是“想当然”，就是一个“妄”字。妄，就是成天到晚胡思乱想。比如有人看了你一眼，你就想：他是不是看上我了？我们俩结婚后会美满吗？生的孩子长什么样呢？孩子将来会娶什么样的姑娘呢？就这样，一个妄念接着一个妄念，一分钟的时间完成了一万年。所谓虚妄，就是什么都不存在，却浪费了你无数的精气神。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "八 七损八益", "x": "圣人就是没有妄念，就是处无为之事，不浪费一丝一毫的精气神，让生命照它的本来面目去运化生长。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "八 七损八益", "x": "普通人的一生，可以过得很苦，如果有一天你在大雪纷飞中跳起了年轻时的舞蹈，就像贾樟柯在《山河故人》中的结尾那样，那你一生的苦，就得到了救赎。终其一生，人只活自己这点醒悟，最终，人人都是一无所有，那就举起两只空空的手，在风中起舞。人生，不过是不断地迎来送往，我们，作为这生命链条上的一节，如果没有恬淡之能，该怎么应对这一生？", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "八 七损八益", "x": "虚无，不是什么都不干，而是顺应生命，让生命自己去运化。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "八 七损八益", "x": "知道欲望害人，就恬淡无欲；知道多情恼人，就无情。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "八 七损八益", "x": "肉身终有完结的一天，人生如果不明朗、不快乐，灵魂就下地狱，怎么跟天地终啊；快乐明朗的灵魂都是往上走，天活一天，你的灵魂就活一天，这才叫“与天地终”。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "九 左右上下", "x": "女人找伴侣，一定要明白，你不是找爹，也不是找妈，更不是找圣人、贤人，想在一个陌生人身上得到一切疼爱、一切关怀、一切人生指导，怎么可能呢？他是人，是人就有缺陷，你用你的突出优点去磨他的缺点，最后两人好像还能圆乎些，你若用你的缺点去磨他的缺点，最后两人都是坑，谁也救不了谁！", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "十 治病次第", "x": "比如肩膀受寒了，用热毛巾热敷下，如果肩背紧得要命，可能吃服葛根汤，就松快了。或者刚刚觉出自己要感冒时，喝碗姜糖水，睡一觉，也成。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "十 治病次第", "x": "怎么避开地邪呢？就高、就燥、追阳光，总是对的，就好比古代堪舆风水等，一定是要让人活得更舒服，更有能量。", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "十一 四诊", "x": "总之，“圣人视其颜色，黄赤者多热气，青白者少热气，黑色者多血少气”", "y": "", "d": "2024-01-16"}, {"k": "h", "c": "十一 四诊", "x": "听觉是地方的心灵——\n川剧不叫、秦腔不吼、越剧不“淫”，就没有民俗性。川剧得西南气，不叫不足以祛湿；秦腔得西北气，不吼不足以宣志；越剧得东南气，不柔不足以浪漫。", "y": "", "d": "2024-01-17"}, {"k": "h", "c": "二 人体生物钟", "x": "中医认为夜里23点到次日1点是子时胆经当令。胆为少阳，《黄帝内经》说“凡十一藏取决于胆”，看来人体细胞修复工作，与胆经的少阳初起密切相关，有阳气的生发，才可以修复人体细胞，此时不睡，不仅耗散了阳气，还会干扰身体的修复。", "y": "", "d": "2024-01-17"}, {"k": "h", "c": "三 五藏神与灵魂", "x": "对付长期睡眠质量差，如果能找到好中医，就吃药。找不到好中医，也有办法，比如转脚腕、转手腕法。“手足天地机”，经脉终始点都在手足，所以转动手足后，人就容易入睡。还可以用从头到脚放松法：我们躺在床上，先放松头部，然后放松眼眉（当你有意识地注意到这一点的时候，你常会发现，刚才的眉头都是锁紧）。眼眉放松后做深呼吸，慢慢地深呼吸。深呼吸不好掌握，可以在吸气时默数1、2、3、4，然后慢慢地出气，并放松肩膀。我们最不容易放松的地方就是肩膀，因为压力和精神紧张，经常这个部位是抽紧的，现在我们要让自己的肩膀有意识地放松。就这么一直想下去，想到最后，每一根手指头和每一只脚指头就都放松了。一般没等你想到脚呢，就已经进入到睡眠当中了。", "y": "", "d": "2024-01-17"}, {"k": "h", "c": "三 五藏神与灵魂", "x": "所谓的睡眠一定要先睡心，后睡身，一定先让心静下来。", "y": "", "d": "2024-01-17"}, {"k": "h", "c": "四 三阳、三阴", "x": "古人用天干来表述太阳的运行周期及其对地球的影响，用木、火、土、金、水五运来表示其阶段性特征；用十二地支来表述月亮的运行周期及其对地球的影响，用三阴三阳六气表示其阶段性特征。", "y": "", "d": "2024-01-17"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "这也是所有的人都喜欢春天的原因，因为生机就在春天里。这个气是往上升的气，是有希望的气，是让所有生命都得以轮回的气。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "网上曾说过一个实验，说养生组的人都早死了，而吃喝玩乐组却还高高兴兴地活着。这只能说养生组没有得到养生的真谛，而是只拘泥于几两几克的吃食与生活克制。养生的真谛就是给生命放假，就是跳出俗常生活，把俗常名利、功德放在一边，听风、听雨，日出而作，日入而息。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "中医认为：喜极损肺，怒极损肝，哀极损肠，惧极损胆，饱极损胃，饿极损脾，情极损肾，动极损阴，静极损阳。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "我们现在基本都是在家里自己洗澡了，我建议您买个天然纤维的毛刷子或搓澡巾，多刺激皮肤，这比拍拍打打的锻炼法对肌肤更有益。用西医的话来说，会使我们的微循环系统好起来。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "现在一提起锻炼，很多人立刻会想到健身房，觉得既花时间又花钱。其实，我们不必把运动当成一种负担，健身并不一定要抽出专门的时间来进行，它可以在我们的生活当中每时每刻地进行。比如，在等公交车时，在超市买东西排队结款时，坐在办公桌前……我们都可以做一些简单的导引动作，达到养生锻炼的目的。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "东晋道教学者、著名炼丹家、医药学家葛洪曾说：“行走坐卧皆导引。”一语道破了养生的真谛。武术家的行话是“拳打卧牛之地”，就是一头卧牛那么大的地方就可以练出花样来。生活处处可健身，我们一定要深刻地认识到这点，才会挤出更多的时间来锻炼，而不再把时间与金钱当成不能锻炼的借口。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "比如，就拿“五趾上扬”这个小动作来说，我们随时都可以做。“五趾上扬”就是使劲地上抬我们的五个脚趾，让它们都往上翘。注意，脚掌不动，只是立五个脚趾。我们在办公桌前、在看电脑时、看电视时、开会时，都可以做这个动作，既不耽误时间，又能锻炼身体。因为大脚趾走脾经肝经，二脚趾、三脚趾走肝经胃经，四脚趾走胆经，小脚趾走膀胱经，脚趾既是阴经的起点，又是阳经的终点，所以这个动作最大的好处是可以让气沉下去，可以降血压，可以聪耳宁神，舒筋活络，对强健腰脊也有好处。如果觉得自己气机上不来，也可以练习五趾抓地，但这个就要站着练习了。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "出", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "五 阳予之正，阴为之主", "x": "我一再强调，天底下最好的药，就是自我锻炼。现在我们都有医疗保险，可难道有医疗保险，身体就真“保险”了？其实还是不保险的。真正要把身体调养好，首先对自己的身体要有自觉的意识。我认为，世上最好的医疗保险，一个是道德修为，另一个就是健身锻炼。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "六 三阴三阳之离合", "x": "中国人讲究房屋坐北朝南，坐北，就是以肾为根基，肾精足的话，才有东西可生发，南向为心，主散。中国的房屋建筑，最初都面向西南，因为这样可以更多地得到阳光。后来又改成正南正北向，而门开东南为最吉。", "y": "", "d": "2024-01-18"}, {"k": "h", "c": "七 开阖枢", "x": "养生方法：第一，去思虑，人生苦短，要率真地表达自己。第二，不食寒凉，也不必吃含营养物质太高的食物。因为化不掉，则更调元气，且伤阳。第三，生活规律些，脾肾肺肝强大了，自然化万物。", "y": "", "d": "2024-01-19"}, {"k": "h", "c": "七 开阖枢", "x": "其实呢，有工夫参与无谓的争辩，不如站桩锻炼一会儿。", "y": "", "d": "2024-01-19"}, {"k": "h", "c": "七 开阖枢", "x": "无论你是站着，还是坐着，只要你有意识地做提肛这个动作，就是在提拉、紧闭会阴穴。久练回春术，我们就能保持一个年轻态，不只是心理上的年轻，更重要的是生理上的年轻。", "y": "", "d": "2024-01-19"}, {"k": "h", "c": "七 开阖枢", "x": "道教丹道家视五窍为元气之贼，因此强调对眼、耳、鼻、口、意的修炼。主张目不外视而视内，则魂在肝而不从眼漏（肝神为魂）；鼻不闻香而呼吸在内，则魄在肺而不从鼻漏（肺神为魄）；口不开而默内守，则意在脾而不从口漏（脾神为意）；心不妄想，则神在心而不从想漏（心神为神）。如此，则五藏神攒簇在腹部坤位，为不漏境界，这也是老子“君子为腹不为目”的真义。耳听声则肾精动摇；目视色则心神驰越；口多言则肺气散乱。", "y": "", "d": "2024-01-19"}, {"k": "h", "c": "二 脉有阴阳", "x": "人生，没有比了无情趣更伤人的了。当然，还有污染过度的食材、不良的饮食习惯，比如辛辣刺激等，胃，就像一口大锅，盛纳着百味，也盛纳着痛苦，于是，患胃癌的人越来越多，而且越来越年轻化，所以保持情绪的快乐才是养生的最好方法。所有的长寿之人之所以能活得那么长久，就是心态好，根本就不跟普通人一般见识。长寿之人不见得有钱，甚至可能都没钱治病，但心态绝对与常人不同。相比之下，我们活得太脆弱，别人一个眼神、一句话，就能让我们不舒服好久，甚至死的心都有。至于吗？！世上总有恶毒的人、狭隘的人、嫉妒的人，人干吗跟负能量较劲呢？！不知大家发现没有，所有的负能量大多鬼鬼祟祟，总是玩背地里的把戏，不太敢明目张胆，那你理他干吗呢？干吗非得把阴暗的东西挖出来折磨自己呢？好好行在光明地上，骄傲地活着，那些阴暗的东西不值得你有一丝一毫的回应！生命如此可贵甜美，岂容浪费？！", "y": "", "d": "2024-01-19"}, {"k": "h", "c": "三 谨熟阴阳，无与众谋", "x": "这段写得多形象啊，写出了读书学习，每每有得道的欢喜时，却发现只是自身的愉悦与升华，家人、朋友虽然可以得到你的分享和照顾，但得不到你自身的那种经脉欢畅的大愉悦、大快乐。这大概就是自我学习的意义吧！这世上，没有谁可以把他五百年的功力传给谁，唯有自己学、自己习，自己长自己的功力、本事，其功力、本事，子孙尚不能传，况他人乎？！", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "十二地支以“子”开头，“子”字是个婴儿的大头像，这是胎儿从母腹里出来的第一印象，先出头。又代表十一月，阳气动，万物滋生。子部字有：孕；文字的“字”；乳，指在房子里哺育小孩；孤，无父也；季，少子；孟，长也。古代有“子时一阳生”的说法，而用胆气对应之，胆气此时虽弱，却是生命的生机。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "十二地支所描述的就是人出生—长大—变老—死亡—重生的一个过程。在中国文化里，一切都有生命的底子在里面，生老病死，就是生命的常态。尊重这种常态，就能努力地活在当下。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "是中国人就有属相，为什么属相是按地支编排呢？因为天干动而不息，而地支静而有常。天干为气，地支为根。所以，我们每个人都要守住这个根。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "十二时辰与这些动物的相关性吧，其实，这些源于对动物习性的观察。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "中国人为什么总结出这些东西呢？因为，人对自己的命运有永久的好奇，中国人试图用各种方式来探究或改变自己的命运，这就是中国人探究八字、名字、属相、风水、易经占卜等的原因。比如名字，名者命也，所以赐子千金，不如教子一艺；教子一艺，不如赐子好名。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "子未相害：俗语说，子鼠见羊万年愁。老鼠活跃，对应胆，胆虽然为少阳，但生发力旺，就像老鼠，生存能力极强；羊倔强，古书说“狠如羊”是说羊有狠劲，无所不用其极，连草根都要啃光。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "丑午相害：俗语说，不叫白马见青牛。马，性子烈；牛，性子沉稳。所以老子骑青牛西行，就有讲究了。烈性则易折，韧性则长久，就是马与牛的根本不同。马对应心，牛对应肝，前者快速生发，后者缓慢生发。这些，在身体里都是对的，在生活中就难免互相嫌弃。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "寅巳相害：俗语说，蛇见猛虎如刀锉。就是属蛇的和属虎的不能在一起，一个至阴，一个至阳，难免相爱相杀。在身体上呢，蛇对应脾，主运化；虎对应肺，主肃降。二者同属于太阴。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "卯辰相害：俗语说，兔子见龙不长久。兔子精明，龙大气。在身体上呢，卯兔对应大肠，主宣；辰龙对应胃，主合。所以兔子与龙不是不能相配，而是看能不能配合好。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "申亥相害：俗语说，猪见婴猴泪长流。猪懒，猴好动。两者相配好比猪八戒和孙悟空，一路打，一路合。在身体上呢，亥猪对应三焦，水道出焉；申猴对应膀胱，主气化。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "酉戌相害：俗语说，酉鸡不与犬相见，见了就是鸡飞狗跳。鸡稳定，狗警觉焦虑。在身体上，酉鸡对应肾，主藏；戌狗对应心包，主出。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "四 十二地支", "x": "隔三为合。\n申子辰合水：属猴、属鼠、属龙三个属相相合。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "六 阴阳发病之征象", "x": "为什么易筋经是传统功法里的经典？因为它启动经脉最快、最显著。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "六 阴阳发病之征象", "x": "胀是由于水湿泛滥，“心满”就是胸胁胀满，“善气”就是胸闷气短，没事总要叹口气。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "六 阴阳发病之征象", "x": "让大家锻炼，是最经济的养生方法。打易筋经，每天两次，顶多一小时就够了。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "六 阴阳发病之征象", "x": "说实在的，好多活得特精致的、天天养生的人，也不见得长寿，太过细致了，反而拘束了人生。我从没有要求自己和别人养什么生，我只求大家小时候尽情享受玩乐，年轻的时候尽情享受爱情，中年时尽情享受事业，年老的时候尽情享受艺术。只是大多数人，小时候没玩痛快，年轻时没爱痛快，中年时没干痛快，老年时没悟痛快。只要没痛快过，生命就没的养，就是万般遗憾。年轻的时候没好好恋爱，年老的时候又活得特无聊，那就悔死了。年轻时，啥都没见过，玩点低级的没问题；到老时，眼睛就得毒点，玩点高级的东西。", "y": "", "d": "2024-01-22"}, {"k": "h", "c": "八 各种病症", "x": "怀孕了呢，胎儿从本性上就自私，跟母亲抢营养，所以孕妈妈若吃多了，调元气来化食物的话，小胎儿就不干，因为他更需要元气元精，于是孕妈妈无力化食物，只好恶心呕吐以自保。所以不太强壮的孕妈怀孕之初，会有两个现象，要么呕吐，要么嗜睡，其实都跟中焦阻隔有关。怀孕时安静、多睡，就养胎儿。", "y": "", "d": "2024-01-22"}]}, {"id": "37647944", "title": "真原医：21世纪完整的预防医学", "author": "杨定一", "cats": ["医学健康-医学"], "bmCount": 86, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序一 路程", "x": "而更进一步，则是要追求如何在平常就保持健康的身体，有良好的防御能力，使随时都会在体内形成的病变细胞无法在体内生存。", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "推荐序二 科学的先行者——杨定一博士", "x": "并取名“真原医”，也就是真正原本的医学的意思", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "自序", "x": "包括饮食、运动、呼吸、思想与情绪管理。", "y": "", "d": "2022-06-27"}, {"k": "h", "c": "自序", "x": "健康是要主动追求而无法被动获得。", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "壹 重返完美平衡的原始", "x": "过量且失衡的饮食导致我们的消化系统长期过度负担，慢慢影响到体内各个器官，进而引发种种慢性病如高血压、类风湿性关节炎、糖尿病、动脉硬化等，很多人称之为“文明病”。", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "壹 重返完美平衡的原始", "x": "马耶尔医师呼吁，应从消化系统开始进行所谓身体的“内在清洁”", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "壹 重返完美平衡的原始", "x": "你必然也会拥有一颗充满希望、宽容、悔悟及慈悲的心", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "02 从分子矫正医学到真原医", "x": "分子矫正医学的核心观念是，提供身体大量天然营养素，便能预防并矫正各种身体缺陷或疾病。", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "02 从分子矫正医学到真原医", "x": "借助自身防御系统和痊愈机制来达到健康", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "02 从分子矫正医学到真原医", "x": "对身体而言，拥有足够的天然物质，如维生素、氨基酸、微量元素、脂肪酸等，就能营造出支持细胞正常功能的最佳环境，而用适量的天然物质来预防并治疗疾病，就是最好的治疗方法。", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "02 从分子矫正医学到真原医", "x": "天然、未加工食品", "y": "", "d": "2026-02-04"}, {"k": "h", "c": "03 中西医合璧的整体疗法", "x": "中医重视人与自然间的完美和谐，认为自然环境与气候变化会直接或间接地影响人体健康", "y": "", "d": "2026-02-05"}, {"k": "h", "c": "贰 环境与健康", "x": "阳光具有红、橙、黄、绿、青、蓝、紫均衡且完整的波长和能量，可以穿透人体皮肤，进入人体内与各种化学物质、矿物质发生互动及反应，协助体内各项必需营养物质的合成，以及各种不同类型废物的分解与排出体外。因此，除了对植物生长与光合作用的影响，阳光对于人体的健康也具有相当的关键性。", "y": "", "d": "2022-08-19"}, {"k": "h", "c": "贰 环境与健康", "x": "阳光对人体健康到底有哪些影响呢？现代科学的研究结果证明自然的阳光会增加人体对氧气的吸收、降低心跳的速度、加速皮肤的新陈代谢，调节人体免疫功能，甚至改善肌肉的能量。", "y": "", "d": "2022-08-19"}, {"k": "h", "c": "贰 环境与健康", "x": "晒太阳可以促进钙质吸收，那是因为人体对于钙质的吸收主要靠维生素D。", "y": "", "d": "2026-02-05"}, {"k": "h", "c": "贰 环境与健康", "x": "适当接受自然光的照射，保持正常昼夜节律以获得足够睡眠和维持精神健康，是十分重要的。", "y": "", "d": "2022-08-19"}, {"k": "h", "c": "贰 环境与健康", "x": "对于想要追求健康的现代人来说，尽量把握与自然阳光接触的机会，多从事户外活动，每天最好能够接受一到两个小时的自然光照，如此不论对于情绪或是生理健康都会有很大帮助。", "y": "", "d": "2022-08-19"}, {"k": "h", "c": "06 微量元素与全面有机耕种", "x": "人体每日需要达100毫克以上者称为大量元素，包括钙（calcium）​、氯（chlorine）​、钠（sodium）​、钾（potassium）​、磷（phosphorus）​、镁（magnesium）及硫（sulfur）等7种；而人体每日需要达100mg以下者则称为微量元素。", "y": "", "d": "2026-02-05"}, {"k": "h", "c": "叁 活食材与健康饮食", "x": "人体具有惊人的适应力，即使每天吃得极差还是能存活下来，但活着不代表健康。", "y": "", "d": "2026-02-05"}, {"k": "h", "c": "叁 活食材与健康饮食", "x": "酶可分为三大类，分别是参与代谢的酶、消化酶、生机食物中的酶。参与代谢的酶让身体能正常运作，消化酶与生机食物中的酶都是帮助人体消化作用的酶。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "叁 活食材与健康饮食", "x": "吃富含酶的生机饮食，能帮人体做好大半的消化工作。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "摄取天然新鲜蔬果对人体保健的重要性，均衡且多样地摄取各类植物性食物不仅让我们能够获得丰富的蛋白质、酶、膳食纤维、维生素与矿物质，同时也让人体能够有效地利用植物中的特殊成分来帮助身体达到预防与治疗疾病的目的。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "由于不同颜色的蔬果含有不同种类的植化素，可以提供人体不同的营养价值与生理保健功效，这也就是我一直强调“彩虹饮食”观念的原因之一。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "由于大部分的植化素都是天然的抗氧化剂并且能够保护细胞避免氧化伤害，因此植化素也往往能够保护人体降低心血管疾病与癌症的发生率。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "蓝紫色植物如蓝莓、葡萄、紫色卷心菜、茄子等则含有大量的花青素（anthocyanin）。花青素是一种强而有力的抗氧化剂，同时具有改善视力、抗发炎、抗菌、抗病毒等功效。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "白色植物如大蒜、大葱、菜花、卷心菜等含有丰富的硫化物（sulfide），有助于提高免疫力、降低胆固醇、抗菌与预防癌症。研究发现，菜花中含有一种称为萝卜硫素（sulforaphane）的植化素，具有良好的抗氧化以及提升免疫的功能，并能有效抑制幽门螺旋杆菌", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "彩虹般的新鲜蔬果具有特殊的保健功效，就像是上天为人类准备好的最佳医药，每日摄取自然可以让身体远离疾病与衰老。然而因为每一种植化素对人体都具有不同的保护功效，所以建议日常蔬果摄取应尽量多样化，并且最好完整食用整个蔬菜或水果，才能将所有植物菁华同时吸收。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "食材挑选上也尽量以符合当令、当地取材为原则，如此才可以获得最佳质量的营养素。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "一般人每天至少要摄取三份蔬菜、二份水果，如果可以的话，蔬菜摄取到五份以上对身体的帮助会更大，最新预防高血压、癌症的疾病的饮食指南都建议将蔬菜的摄取量提高到五份以上。", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "09 蔬果中的植化素", "x": "我建议读者朋友在饮食中提高生食蔬菜的比例", "y": "", "d": "2026-02-06"}, {"k": "h", "c": "10 蔬菜汁好处多", "x": "蔬菜汁由于去除了难以消化的粗膳食纤维，保留了汁液最丰富的营养，因此在所有的生鲜食材中具有最高的营养价值。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "10 蔬菜汁好处多", "x": "蔬菜要打汁、水果要生吃", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "10 蔬菜汁好处多", "x": "饮用新鲜蔬菜汁，可以供给人体所需要的所有维生素和酶，不仅能提供人体所需，而且效果还比人工合成的维生素来得好。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "10 蔬菜汁好处多", "x": "提供身体足够的养分和材料，让身体自己发挥治疗的能力。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "11 最佳蛋白质来源", "x": "已经有愈来愈多医学和营养学专家认同最佳蛋白质来源是植物，而非动物。长久以来，不少民众都误认为奶、蛋、鱼、肉类才是最佳蛋白质来源。其实，除了奶、蛋、鱼、肉类，众多植物性食物是更优质的蛋白质选择，相反地，动物性蛋白质如果摄取过量也可能会造成身体负担。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "11 最佳蛋白质来源", "x": "蛋白质由氨基酸组成，在建造人体组织的23种氨基酸中，有15种能由人体自行合成，其余8种则称为“必需氨基酸”，必须自食物中取得。不同于一般想法的是，这8种必需氨基酸都可以由蔬果中取得！\n同时拥有这8种必需氨基酸的蔬果包括胡萝卜、抱子甘蓝、芽菜、甘蓝菜、白色菜花、玉米、小黄瓜、茄子、羽衣甘蓝、秋葵、豆类、马铃薯、节瓜、地瓜、西红柿以及香蕉。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "11 最佳蛋白质来源", "x": "当今杰出的营养学家都倡导三餐应该简单，食材并不需要搭配得很复杂，例如摄取淀粉类食物同时搭配蛋白质，反而会干扰正常的消化过程。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "11 最佳蛋白质来源", "x": "其实人体的消化系统设计，并不是为了消化动物性蛋白质。举例来说，人类的牙齿与肉食性动物构造上不同，唾液也不一样。我们的口水偏碱，正好能消化来自植物的碳水化合物；而肉食性动物的口水是酸性，酸度足以溶解骨头。此外，荤食所产生的胆固醇和尿酸，始终对人体是一大负担。", "y": "", "d": "2026-02-07"}, {"k": "h", "c": "12 素食与荤食", "x": "希望读者们能以开放的心胸亲身体验，让身体告诉您究竟是素食还是荤食为您带来活力。只要愿意倾听身体的声音，必能得到解答。", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "13 健康饮食有诀窍", "x": "不再渴望重口味的菜肴点心、咖啡、茶、酒，开始偏好各种简单、天然的食物", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "13 健康饮食有诀窍", "x": "只要细嚼慢咽，让食物得到唾液充分浸润，就可以减轻消化系统的负担，改善健康！一旦采用这个简单的消化机制，自然就会减少食物量，永远不用再担心吃得太多。因为身体自然会让我们知道该吃多少，什么时候该停下来了。", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "13 健康饮食有诀窍", "x": "需要均衡的营养而非过食，尤其在晚上人体代谢逐渐缓慢，过食容易成为身体负担。夜间原本就是让身体各个系统休息的时间，而消化系统也不该在晚上过度操劳。有足够的休息时间，身体才有机会从疲劳中恢复过来，并设法清除累积一整天的毒素。", "y": "", "d": "2026-02-08"}, {"k": "h", "c": "肆 饮食科学新概念", "x": "动物性蛋白质（特别是红肉）容易造成身体的负担，因此最好是以植物性蛋白质，如豆类作为主要蛋白质来源，或以鱼、鸡、鸭等低饱和性脂肪酸的白肉来取代红肉。此外，建议每天喝一杯豆浆来补充每日所需钙质。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "肆 饮食科学新概念", "x": "所谓的酸性食物是指食物在经过代谢以后产生如磷酸根、硫酸根、氯离子等阴离子。因为过多的阴离子在体内容易形成酸而造成酸性体质，通常肉类、淀粉类、加工食品等都是属于酸性食物；碱性食物则是食物在经过代谢后，阳离子（如钠离子、钾离子、镁离子、钙离子）多于阴离子，使身体保留较多的重碳酸根离子，所以造成碱性体质。绝大多数的蔬菜、水果和豆类食物都是属于碱性食物。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "肆 饮食科学新概念", "x": "尽量只吃简单完整的食物，多食高膳食纤维的谷类、生菜水果，避免过度烹调及过度加工的食物，口味清淡、细嚼慢咽，并以专心且自在悠闲的心情进食。如此一来，吃出健康活力绝对不是件困难的事。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "肆 饮食科学新概念", "x": "每日摄取量指南", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "15 大自然的恩赐——调理素", "x": "现代医学之父希波克拉底在2500年前就曾说过：​“让你的食物成为你的药，你的药就是你每天吃的食物。​”这观念和中国人所说的“医食同源”是相同的。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "15 大自然的恩赐——调理素", "x": "正确饮食、适当运动、呼吸调和、充足睡眠、有效因应生活中的压力", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "15 大自然的恩赐——调理素", "x": "因为每个人的体质差异，也就更没有一套标准公式能一视同仁地套用在每个人身上。我们必须秉持着实验精神，找出自己的健康特质及最合适自己的方式。一定要切记，人体内的生化反应随时在微调，所以对别人有效的饮食，不见得对自己也最好。这是传统医学课本上还没有触及的领域，所以每个人都应该多了解健康领域的最新发展，每天为自己的健康打好底子。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "伍 消化系统与健康", "x": "毒素可能因累积而产生慢性退化，引发各种表面看起来好像不相关的疾病，从皮肤痤疮、老化到肝脏问题，影响到其他器官及各种代谢和心血管疾病。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "17 结肠影响整体健康", "x": "想要结肠健康，一定要从正确的饮食着手，也就是以高膳食纤维、低脂、蔬果为主的饮食。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "17 结肠影响整体健康", "x": "高脂、低膳食纤维的肉食还会导致许多结肠相关的问题，包括便秘、结肠憩室症、痔疮、肠易激综合征、痉挛性结肠炎和阑尾炎。这都是因为干硬的粪便在肠道中移动缓慢所引起，但借由改吃高膳食纤维、低脂的生机饮食和素食，就可因粪便软化、水分增加而改善。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "17 结肠影响整体健康", "x": "过量摄取外来的食物刺激物，包括烟草、咖啡、酒精、巧克力、精制糖和其他精制食品，对消化和排便都有不良影响，会阻碍肠胃道的正常生理机能和神经反应。抗生素则已知会摧毁肠道内的正常菌落，使害菌和病毒大举入侵。缺乏运动会导致腹部肌肉无力，也使身体更无力负荷因不良饮食习惯而增加的负担。而情绪和心理方面的压力和紧张，会使肠道无法正常蠕动排便。此外，在忙碌的生活中，多数人的水都喝太少，身体处在长期缺水的状态，体液也会变黏稠，包括润滑肠道的黏液也是。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "17 结肠影响整体健康", "x": "适度断食。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "17 结肠影响整体健康", "x": "提高生食蔬菜和水果的比例、摄取足够的矿物质、减少加工或过度烹煮食物的比例，落实细嚼慢咽的习惯，使肠道菌落恢复正常。最后饮用足量的优质饮水，搭配正确的运动，相信可以帮助大多数人恢复结肠的健康。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "18 姿势与肠道健康", "x": "螺旋形态的扭转运动或拉伸运动，虽然动作简单，却有一般直线运动所无法达到的结构调整效果，只要持续每天做，必能感觉不同！", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "陆 运动与呼吸", "x": "运动时会刺激大脑分泌一种称为“内啡肽”​（endorphins）的激素，使身体获得舒适与愉快的感受，让人产生欣快感，甚至提高对疼痛的耐受力。执行规律的运动并配合正确呼吸方式，不仅能舒缓紧张与压力，还具有许多健康效益如促进心肺功能、增强免疫力、改善睡眠质量、维持体态匀称等等，更能启发身心的自我疗愈。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "陆 运动与呼吸", "x": "许多东方的古老运动系统，如瑜伽、太极拳、柔软体操、气功、道功等，都是科学且内外兼修的运动，运用“螺旋”​（vortex）运动原理而活动到身体全部的关节。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "20 深层的呼吸方式", "x": "利用腹式呼吸，身体内的能量不但增加，且能改善许多慢性病，降低身体体温，达到促进健康的效果。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "柒 身心灵的全面诊治", "x": "从因果业力的定律来看，万事万物都不过是作用力和反作用力的无尽序曲，直至时间终止方休。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "22 完全的疗愈", "x": "引发出许多所谓的“文明病”​，包括高血压、心脏病、糖尿病、纤维肌痛症（fibromyalgia）​、抑郁症、癌症以及其他许多慢性病。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "24 身心清净", "x": "将皮肤适当地暴露在日光和空气中是对健康有帮助的", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "24 身心清净", "x": "正确的饮食，不要吃加工以及调味过度的食物，以避免加重肾脏负担；第三步则是不要滥用药物、酗酒，对内脏来说，酒精是非常难以处理的物质。当然，咖啡、香烟的使用量是愈少愈好，这些物质会使身体正常运作机能下降，加速器官退化。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "24 身心清净", "x": "正确的思考就是以清晰、冷静的方式思考，让生命因为宽容与善意而充满活力。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "24 身心清净", "x": "学会冷静思考的心理态度，并培养善念", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "26 体内净化", "x": "建议朋友们以开放的心胸面对断食观念，不妨试着了解温和断食所带来的身心转变。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "捌 身心和谐与静坐", "x": "克服压力最主要的方法不是去减少造成压力的事务，而是如何改变对事情的认知。唯一解决压力的长期、有效办法，是彻底改变心念，从一个更宽阔的角度去看待生命", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "捌 身心和谐与静坐", "x": "国际压力调查中心总裁伯罗斯医师（Professor Grabam Burrows）综合长期以来有关压力的研究报告后，得到两点减压结论：（1）问题出现时所持的认知角度。（2）问题出现时的沟通方式。我们往往不能改变生命中所发生的事情，但却可以放宽心胸来面对，这才是减轻压力的不二法门。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "捌 身心和谐与静坐", "x": "压力往往来自我们对事情的观感，而非事情的本身。压力通常并非来自生命中的重大问题，而是日常生活中未妥善处理的小事所累积。怨恨、愤怒、沮丧、失望，这些负面情绪一旦产生，是会在心、脑甚至全身通行无阻的。以更宽广、体谅的心去观看各种事物，可以帮助身体重回平衡、协调的状态。这种心灵的转换可以改变压力，引领我们进入崭新快乐的生命世界。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "28 心脑相依", "x": "心率变异事实上测量了我们心脏与神经系统间的弹性，并反应出我们的健康状况与弹性，也可以说是身、心、灵间平衡状态的简单测试。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "29 同步性与合一性", "x": "仔细观察这些变化会发现一个有趣现象：当身心处于安定和谐的状态，体内所有的基本频率会完全自然同步。反之，当身体异常或是常处于压力状态，频率就会呈现失衡混乱。", "y": "", "d": "2026-02-11"}, {"k": "h", "c": "29 同步性与合一性", "x": "如果一个人可以调整自己的心境成为一个体谅、感恩且慈悲的人，他就已经活在合一的状态。在这种认知下，不需任何训练、技巧，人们即可以达到合一状态，一个完全有益于身心健康的状态，这正是我想与大家分享的简单真理。", "y": "", "d": "2026-02-13"}, {"k": "h", "c": "30 静坐的科学", "x": "静坐不仅可以提升人体各种生理机能，更可以改善忧郁、焦虑、愤怒和压力感，让行为表现更稳定成熟。", "y": "", "d": "2026-02-13"}, {"k": "h", "c": "31 静坐与健康", "x": "至于用什么方法来建立新的回路呢？可以先守住某些“觉”​“受”相关的方法，例如数呼吸、持咒或是观想等都可以，就看个人喜好或习惯。当新的神经回路建立后，经过不断练习与尝试，将可以体验到以上各种静坐所带给身心的改变。", "y": "", "d": "2026-02-13"}, {"k": "h", "c": "33 静坐的方法", "x": "第一个方法是“数息”，也就是数自己的呼吸。\n轻轻松松地感觉自己的呼吸，吸气时不理会它，只在每次吐气时数吐气的次数，从1数到10之后，再回到1数到10，如此反复地数。吐气的时候，尤其注意到吐气快要停的那个刹那，把注意力集中在上面。", "y": "", "d": "2026-02-15"}, {"k": "h", "c": "33 静坐的方法", "x": "第二个方法是“观息”，也就是观察自己的呼吸。\n把自己的呼吸当作一部电影在看。轻轻松松地看着自己的呼吸，看看自己的呼吸是长还是短，观察自己每一个吸气吐气有什么不同。", "y": "", "d": "2026-02-15"}, {"k": "h", "c": "36 关注法则", "x": "对万事万物不起分别心，如实且完整、深刻地体验一切情感觉受，不妄加分别善恶，不迎不拒，即知即行，接受生命所有色彩、形式和起伏的原貌，无条件地接受它。", "y": "", "d": "2026-02-16"}, {"k": "h", "c": "拾 如何改变习惯", "x": "总而言之，第一，我们应避免压抑旧习惯；第二，与其去想与过去有何相似，不如想或许有新的变化、机会或不同的发现，这就是轻松改变旧习惯的心理基础；多想象想做的事，而非我们想停止的事。", "y": "", "d": "2026-02-16"}, {"k": "h", "c": "39 用行为改变行为", "x": "有一天，有人教她不要再去想怎么改变生活方式了，回过头来好好想想她最想要做什么。", "y": "", "d": "2026-02-22"}, {"k": "h", "c": "39 用行为改变行为", "x": "她的人生需要奋斗，而她也度过了每个艰难的考验，这本身已是值得赞赏的了", "y": "", "d": "2026-02-22"}, {"k": "h", "c": "39 用行为改变行为", "x": "既然习惯不过是经常使用的行为，我们就应该用行为去改变行为。", "y": "", "d": "2026-02-22"}, {"k": "h", "c": "拾壹 身心共舞", "x": "恐惧的另一面：慈悲", "y": "", "d": "2026-02-26"}, {"k": "h", "c": "拾壹 身心共舞", "x": "慈悲是人类所能产生的最高层的谐振觉受，只有慈悲所产生的谐振，力量足以穿透所有身体层次。无论何时何地，慈悲都是人类自由选择的最高表现。", "y": "", "d": "2026-02-26"}, {"k": "h", "c": "41 回到慈悲", "x": "心灵的平和是幸福，身体的平和是健康，而灵魂的平和则是自由。最真实的自由就是自在的流动。​”唯", "y": "", "d": "2026-02-26"}, {"k": "h", "c": "后记", "x": "视健康为自己的责任，而非将健康交予他人之手。唯有身体力行均衡的生活方式，包括饮食、运动、呼吸、睡眠等，预防医学才不会仅是理论而已。", "y": "", "d": "2026-02-26"}, {"k": "h", "c": "后记", "x": "让我们自在看待无常的顺逆境，虽然身在红尘俗世中，心却澄净不惹尘埃。", "y": "", "d": "2026-02-26"}]}, {"id": "26867621", "title": "学会吃饭", "author": "珍·克里斯特勒 艾莉莎·鲍曼", "cats": ["医学健康-健康"], "bmCount": 70, "rvCount": 0, "notes": [{"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "我们可以通过训练培养自己的内在美食家，帮自己享受喜爱的食物、选择自己享受的食物，以及在自己不需要或不想吃的时候，将食物留在餐盘里。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "我开始在自己身上尝试。我允许自己在白天吃想吃的食物，并留意自己的味觉感受。当我没那么饥饿的时候，我是否能从适量的食物中感到满足？如果真正地留意这些经验，放慢节奏充分享受我所吃的食物，这个食物会带来更大的满足吗？", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "当我允许自己无罪恶感地吃自己喜欢、而原本不敢吃的食物后，我轻松地减少了夜间的进食。我不仅能享受这些食物，而且减少了对它们的渴望，也不会想要不停地吃它们。很快地，这些我原本以为没有意志力及自制力来抵抗的食物，已经失去了它们的诱惑力，这让我大开眼界。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "等你学会自我调节，你就能对眼前的饼干做出合理的取舍。你会聆听内心的想法，做出回应。你可以选择在感到饥饿时充分享受这块饼干的美味，也可以选择只吃几口然后把剩下的部分留到下次再吃。当你启动了自我调节的力量，你就能敞开迎接任何事物。你可选择拿起饼干，或将它留在那儿。一切都十分简单。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "你所做出的饮食决定会滋养你而不是折磨你。你会学习停下来聆听你的选择，并不会感到无法抵抗，也不需建立起不必要的围墙。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "你并不孤单，而且你可以从挣扎中释放自己。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "每个人可以改善自己与食物的关系，更加享受美食，找到让自己减重的方法，而且渐渐地愈来愈少挣扎。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第一部分 吃饭，不那么简单", "x": "与其建立疼痛及焦虑的关系，不如培养一个与味觉、滋养及满足感有关的关系。你会重新享受放下挣扎，迎接饮食所带来的味道及愉悦。本书会告诉你怎么做。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "我们可能大部分的进食都是盲目的。经过同事的零食罐时，顺手拿走一块巧克力。家人坐在身旁吃薯片的时候，顺便吃几片，然后愈吃愈多。我们经常吃下很大分量的意大利宽面条，只因为它在我们面前。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "盲目饮食最糟糕的一点是，它让你吃更多，享受更少。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "《一个新世界》（A New Earth）的作者艾克哈特·托勒（Eckhart Tolle）写道：“你所对抗的，会增强；你所抗拒的，会持续。”", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "原则一 只有你了解自己的身心需求", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "一旦深入自己的内在智慧（了解自己的饥饿感、饱足感以及对食物的享受），也与自己的外在智慧取得平衡（了解食物热量及营养成分的知识），你就会为自己的健康、体重、人生做出弹性的抉择。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "原则二 你可以利用想法及感受来了解自己，而不是惩罚自己", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "原则三 没有不好的食物", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "原则四 计算热量是重要的", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "期待通过此书的练习，让你这一辈子都能与食物建立一个滋养平衡的关系。不再持续地挣扎，你会体验到解放的感觉。你知道自己是主导者，体认到饮食体重的担忧只占生命的一小部分。生命中还有更多层面值得你去察觉、留意及欣赏。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二章 培养正念习惯：食物不分好坏", "x": "正念饮食是——·刻意以不批判的方式，留意自己与食物以及进食的当下所带来的经验。·渐渐察觉到每个当下的内在（想法、情绪、饥饿、味觉、饱足感等）以及外在（各种食物的营养价值）。·学习分辨生理饥饿感与其他进食的诱发因子（例如强烈的情绪、想法以及社交压力）。·尽可能选择自己喜爱又能够滋养身体的食物。·感觉每一口食物所带来的味觉变化。·察觉肚子如何渐渐饱足，吃饱的时候又是怎么样的感觉。·利用营养成分及热量的知识来选择吃什么、吃多少，以满足个人的健康需求。·将对食物的担忧所消耗的能量，转移至生命中重要的事物。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "生活充满无数种诱发进食的因子，尝试去除或避开它们，最终会失败。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "也许你可以选择聆听自己身体的讯息，告诉你什么时候细胞需要能量，并在真正饥饿的时候再进食。联结真正的生理饥饿感，是盲目饮食最强大的刹车系统。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "通过正念练习，她发现其实自己把工作的焦虑与饥饿感搞混了，而且把吃东西当作拖延时间的一个方法。吃东西可以暂时让她避开困难的工作事务，同时也避开对这些事务的焦虑感。有此洞察以后，她开始在浮现拖延时间想法的时候，安排简短的自我照顾休息时间。与其吃东西，不如做一些不一样的选择，例如看书放松心情，或是在办公室走走，让灵感浮现。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "正念练习首先协助我们了解，什么让我们困扰。它协助我们放下暴力的自我批判。这并不代表我们可以立刻完全去除这些批判性的想法，但是可以减少它对我们的影响，一直到智慧心智找到一个更平衡的响应方式。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "失衡者总是在过度节制及过度放纵之间来回摆荡。失衡者面对低落情绪、压力、事情不顺、生气的时候，通常只有有限的因应方法。有些人甚至只有一种方法：食物。当他们选择食物这个方法时，总是吃过量，感到罪恶，然后隔天尝试通过“一些优良行为”来过度补偿。他们可能会跳过早餐，中餐少吃些，但是傍晚时却因为过度饥饿、劳累及对食物渴望（还有更多的压力）而崩溃。他们不断吃东西，然后又感到罪恶。他们继续进食，无法停下来。结果整晚感到过饱、腹胀、罪恶感，隔天又重新开始循环。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "平衡饮食者面对压力时，拥有各种不同的应对方法。当然，食物是其中一个方式，但是它只是很多方式中的其中一项。他们可能为了抚慰伤痛吃冰激凌，但是不会利用罪恶感来破坏抚慰的效果。他们接着进行一些跟食物无关的应对方法，可能会跟朋友联络、出去散步、上网或做些其他的事情，不会继续吃东西。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "平衡饮食者知道食物无法解决问题。他们也吃饼干，接着去做些其他事情。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第三章 真正的饥饿感：是什么让你咬下第一口", "x": "正念觉察教导你提出好的问题：我的身体真的饿了吗？我上一次进食是多久以前？这是我真正喜欢的食物吗？我对这个食物有多强烈的渴望？为什么？我吃这一点点会感到满足吗？我吃够了吗？", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第四章 你为什么不满足：什么让你继续吃第二口", "x": "在咬下第一口时，留意味道如何出现。这味道可能是细微却令人满足的，或是很强烈但不太美味的，也可能是两者的混合。可能第一口你就给它打了八分高分。再吃一小口。味道如何变化？满足感有增加吗？或是满足感往下降？什么时候开始发现味道下降？第三口如何？第四口呢？也许分数会降到五分，然后再到三分。当然，你可以选择继续吃，看看味道如何变化。你可以把当下的经验和过去吃这种食物或是很久以前的回忆所产生的经验做个比较，体会一下两者之间的不同。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第四章 你为什么不满足：什么让你继续吃第二口", "x": "每一个当下都是很好的机会，正念觉察自己放慢、停下、转换方向的能力。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第四章 你为什么不满足：什么让你继续吃第二口", "x": "饮食练习可以帮你决定什么时候停止进食（无论是一份点心、一餐或是某个特定食物），而不是依赖意志力来鞭策自己。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第五章 培养外在智慧：让你吃得自在", "x": "若不能持续的话，改变又有何意义呢？", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第五章 培养外在智慧：让你吃得自在", "x": "对于大部分久坐不动的人来说，每周只需增加七十五分钟快走就能增加两年的寿命，每天只需花十分钟。如果你花两倍的时间（每周一百五十~二百九十九分钟，每日二十~四十分钟），就能增加三年的寿命。每日六十分钟，你就为自己增加超过四年的寿命。不管体重多少都可适用，而且你的生活质量也会随之改善。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第五章 培养外在智慧：让你吃得自在", "x": "活着就要动，多动身体会更舒适。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第二部分 好好吃饭的练习", "x": "每天，你都有上百次的机会来鼓励自己。把多余的精力花在生活中更重要的事上。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第七章 改变你的饮食模式", "x": "食物是我们给予身体的礼物。食物滋养你的细胞，提供维持健康所需的原料，它滋养你的感官。我们生活的世界有各种食物供你选择。你可以盲目及焦虑地看待这些选择，也可以敬重且愉悦地面对这一切的可能性。当你能正念地选择食物，你会无须挣扎，无须过量进食，便能成功转变未来的每一餐。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第八章 你是真的饿了还是想吃", "x": "尝试将生理饥饿感受与任何脑海中浮现的情绪性饥饿或食物渴望，区隔开来。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第八章 你是真的饿了还是想吃", "x": "不要过度苛责自己。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第八章 你是真的饿了还是想吃", "x": "经过这些练习，你可以对自己与他人说：“哇，这看起来很美味，但是我目前并不饿。”而且说到做到。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第九章 唤醒你的内在美食家", "x": "一旦开始留意味觉的经验，你也许会发现有些食物（特别是不健康的食物），不如你想象的那么美味。也许觉察到加工食品的化学味道、过甜过咸的食物，不如它们所宣传的那么好吃。你可能因此喜欢上健康全谷的味道、少了人工添加物的自然味道，以及新鲜蔬菜的鲜美味道，而倾向选择较健康的食物。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第九章 唤醒你的内在美食家", "x": "当你持续培养自己的内在美食家，你会不再成瘾于这些高糖高脂食物。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第九章 唤醒你的内在美食家", "x": "培养你的内在美食家", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第九章 唤醒你的内在美食家", "x": "如果你已经能留意如何重质而非量，那么，你可以开始挑战任何一种易成瘾、易致胖的食物。不妨将这个练习运用在牛排、酒精、意大利面、面包或其他你会害怕过度放纵的食物上。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第九章 唤醒你的内在美食家", "x": "思考：吃这个食物，你的愉悦感有增加吗？再来一口呢？味道及满足感什么时候开始变得没那么好？满足感什么时候转变成不愉悦感？不要忘记，除了味道觉知，你还可以在过程中留意饥饿感的变化。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第九章 唤醒你的内在美食家", "x": "允许自己停下来。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十章 开心享受！但不一定要吃完", "x": "就算只多吃了三口主食、小菜、甜点，还是会为你带来额外的100多大卡。如果你日复一日每一餐都这么做，它们加起来等同于你想要减掉的那五公斤体重。这小分量的食物也许不足以构成一餐，但积少成多，却可以成为令人满足的午餐。与其现在就塞进肚子，不如之后再享受。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十章 开心享受！但不一定要吃完", "x": "当你有机会吃自助餐时，可以放下“吃够本”的心态。与其尽可能多吃些，不妨把它视为少量品尝多种食物的机会。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十一章 告别焦虑！不再执着热量", "x": "小心不要掉入“补偿效应”的陷阱（我运动了，所以可以再多吃一份）。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十二章 选择真正想吃的，重质不重量", "x": "你只需停下来思考：什么吸引我？我真正想要吃什么？", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十二章 选择真正想吃的，重质不重量", "x": "在伸手取用食物时思考：我真的想要它吗？我想要其他的食物吗？哪样食物会让我感到最满足？我想吃多少？", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十二章 选择真正想吃的，重质不重量", "x": "当你开始做选择，你会发现自己变得更挑剔。也许你会选择只吃自己最喜欢的饼干或某种特定薯片。你会发现，无论何时，你都能真正享受你的选择，而不会感到罪恶。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十二章 选择真正想吃的，重质不重量", "x": "通过正念抉择，你真的可以走入任何地方，选择最好的食物，享受吃下的每一口。在你走出餐厅时，你会充满成就、愉悦、满足感，而不是吃太多导致的不适。这特别的机会，能让你少量品尝不同的食物、只取用真正想吃的食物。它能让你找出自己真正喜爱或不喜欢的食物。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十二章 选择真正想吃的，重质不重量", "x": "也许有一天，你看到美食时会对自己说：“我想要吃它，但不是现在。”这可以运用在各种不同的场合：在家中、聚餐、派对或餐厅。善用抉择的力量，不但可以选择自己最想要的美食，还可以选择什么时候，在哪里，到底吃多少。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "·学会分辨情绪与真正的饥饿。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "·有更大的自由选择吃或不吃。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "·让安抚性的食物真正带来安抚的感觉。当你利用食物来安抚自己时，不要这样想：“我很糟糕，真的无法相信自己又再重犯。”你可以食用让自己满足的合适分量：“真的很棒。我感觉好多了。我可以迈向下一步，解决这个问题。”", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "习惯随着冲动的海浪漂浮后，你会善用冲动为聆听自己的一个警惕讯息。发现自己伸手想拿薯片时，不妨问问自己：“到底发生了什么事？”", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "以少量食物安抚自己是正常的，但是你不会希望食物成为唯一或主要的自我安抚方法。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "当你随着冲动的海浪漂浮，你能察觉自己的连锁反应，并学习善用自我安抚技巧，重获自由。你会停止自动化的反应，然后做出正念的饮食决定。有时冲动在一阵子后就会消失。有时你决定给自己一份小点心，并充分享受每一口。渐渐地，你可以有效面对小的压力源，然后建立起较平衡的习惯模式。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "你可以让自己重获自由：可以在连锁反应的任一阶段停止这个恶性循环，在任一阶段决定重新开始。没有事情是无法挽救的，你总是来得及停止进食，就算你已经吃下了七块饼干，此时停止总比继续把整盒饼干吃完来得好。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "·压力事件发生时：察觉当下的想法、情绪、感受及体内的反应。检查这些反应是否引起进食的冲动。想出安抚自己的替代方法，这没有绝对的对错。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十三章 告别压力型进食", "x": "善待自己。练习的原意不是让你指责自己，而是让你认识自己及自己的想法，情绪和进食习惯。一旦了解这些模式，你就可以很有自信地告诉自己：“我不需要这样做，我可以终止这个循环。”", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "当你发现愈来愈多的决定是健康且平衡时，你应该每日都有一些成就感。你也许发现自己可以在社交情况下享受一整餐，而不会过量进食，且吃完后感觉舒适。良好饮食关系的建立会带来健康的体重，因此体重迟早会下降。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "·大部分只在真正生理饥饿时才进食。然而，你不会因此拒吃难得出现的稀有食物，或是姐姐的感恩节手工派。健康进食者是具有弹性的。你也许下一餐会少吃一些或不再吃点心。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "·充分享受每一口食物。你会珍惜味蕾的强大功能。无法带来愉悦感的食物何必继续吃呢？", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "·正念察觉诱发盲目过量进食的想法及情绪。不含负面自我批评的觉知，能够带来智慧及自由。以好奇而非恐惧懊悔的心态、单纯观察心智的旧有习惯模式，会让自己成长许多。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "·尝试各种不同的健康选择。多阅读健康饮食的文章，学习其中的智能。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "·运用正念停顿片刻，找到内在智慧。每当你感到焦虑、分心或做白日梦时，你正处于浮动心智中。有时候这个状态是愉悦且有用的，不妨就让自己停留在那儿。然而，浮动心智也会让你过度执着于饮食体重，这有时候是不必要且无助于事的。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "持续庆祝自己的小改变。每天都有很多机会庆祝并奖励自己。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "你也许还记得以往体重增加的反应，可能会感到恐慌，然后买下收银柜台架上写着“如何在七天减三公斤”的杂志。其实，这是一个停下来思考的好机会。你可以做哪些改变来达到更好的平衡，这可能很麻烦，但是我们其实在生活中的其他方面，不断地重复检视自己。我们这个月的花费是否超过了定的预算？较少跟朋友或家人联系？几个工作事项没有在时限内完成？你可以退一步想想到底是哪些事情打乱了我们原有的意图，考虑可以做哪些调整，让我们回到整体价值及健康的平衡。我们也可以利用这个方式来应对食物饮食相关的选择、习惯模式及抉择。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "成功的平衡进食者是弹性的，他们不会选择遵循死板的规范，而是会创造适合自己喜好及生活的指引，然后根据不同的状况进行调整。他们会找寻中庸之道，运用这种智慧来让他们享受美食以及滋养身心。", "y": "", "d": "2020-10-06"}, {"k": "h", "c": "第十四章 享受你和食物之间的新关系", "x": "通过正念练习，你与食物的关系会慢慢地改变。它不再是一段充满焦虑的关系，而是一段充满喜悦的关系。放下挣扎，取而代之的是你一直以来想要的：享受及自由。", "y": "", "d": "2020-10-06"}]}, {"id": "43222185", "title": "黄帝内经：上古天真", "author": "徐文兵 梁冬", "cats": ["医学健康-健康", "医学健康-医学"], "bmCount": 55, "rvCount": 0, "notes": [{"k": "h", "c": "6.生命的强大在于“虚其心，实其腹”", "x": "我甚至想过，若是我以后有儿子，就叫“梁敦敏”，因为我觉着“敦敏”这两个字，实在是太优雅、太漂亮了。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "6.生命的强大在于“虚其心，实其腹”", "x": "“敦敏”是说心、肾的状态。“敦”是肾精很足，“敏”是指“心”虚时感觉就非常的敏锐。这种状态下容易出“慧”，这叫“长而敦敏”。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.越“天真”，越成功", "x": "所以，如果你想健康养生，就要识别出谁在煽你的情，谁让你欲火焚身。很多人在大病快死，或者锒铛入狱的时候，才知道自己追求的东西是那么奇怪、那么不切实际，才终于明白自己当时热血沸腾地追求那些东西，其实是一种病态。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.物无美恶，过则为灾", "x": "物无美恶，过则为灾", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.物无美恶，过则为灾", "x": "健康人的生物钟和天地是同步的，所以他会在早晨七点到九点—胃经当令的时候，觉得饿，觉得饥，此时正好吃早餐。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.物无美恶，过则为灾", "x": "和饿也不一样，饥是胃肠空了，饿是内心的一种感觉，想吃东西了。到了中午，也就是心经当令的时候，我们会觉得饥饿，要吃午饭；到了晚上七点到九点，心包经当令的时候，我们还会觉得饿。这说的是健康人，所以健康人会按点儿吃饭。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.物无美恶，过则为灾", "x": "水是阴寒的东西，喝多了就会坏事儿。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.物无美恶，过则为灾", "x": "黄帝内经》里有一句话叫“形寒饮冷则伤肺”，是说你身体本来已经受凉了，还老喝冷饮，让胃再将冷饮加温到36.5℃，这就需要耗费你的能量。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "4.起居顺应昼夜和四季的变化，你就能“走运”", "x": "如果你顺应这个规律，恭喜你，你有运气了。我们经常说祝你好运，这好运气是谁给你带来的？是天地！天地的运化过程有节奏，有规律，你跟着它走，就会走运；你要违背它，就会走背运、要倒霉。可现在，我们不少人都过着昼夜颠倒的生活，日出而睡，日落而作。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "4.起居顺应昼夜和四季的变化，你就能“走运”", "x": "人跟天地变化的规律相背就会背运。而春生夏长秋收冬藏就是顺应天地变化的。照着做就会走运，走天地的运。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "4.起居顺应昼夜和四季的变化，你就能“走运”", "x": "比如广州没有冬天，就缺少了一个闭藏的过程，总是处于一种开泄状态。生活在广州的人阴津、阴液的损失比较大，需要补足，所以广州人或香港人会经常煲汤，通过喝汤来滋阴。如果不滋阴的话，人就受不了，精力也跟不上。实际上，很多长寿的人都生活在一些偏寒的地方。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "10.人没必要追求超凡脱俗", "x": "人没有必要追求那种超凡脱俗的东西；即使身为一个普通人，我们依然可以过得很快乐，很健康，一直活到一百二十岁。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "第三章：为什么“虚邪”害人不浅", "x": "引起你情绪波动的能量或信息，都叫“邪气”。让你大喜、大悲、大怒、大惊、大恐的东西，都是虚邪。所以“虚邪”后面接着一句话叫“避之有时”，教你不要迎上去，要躲着它。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "2.你会避“虚邪贼风”吗", "x": "李光耀曾经说过，空调是人类最大的发明，但是，空调也是导致现代很多人在夏天生病的主要原因。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "2.你会避“虚邪贼风”吗", "x": "所谓“避之有时”，第一要避之，第二要有时。我们刚才讲了贼风容易在睡觉的时候进入身体，那么就是说即便在午休时你也不应该吹电扇或空调。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "2.你会避“虚邪贼风”吗", "x": "我总是劝病人睡觉时要拔座机、关手机，因为在熟睡的时候突然惊醒是最伤神的，这种“贼”“虚邪”更厉害。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.眼神迷离不是美，是一种病态", "x": "有人“忧”，有人“虑”，“忧”是老担心一件坏事要发生，“虑”是老期待一件好事要发生，但都没发生。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.眼神迷离不是美，是一种病态", "x": "“忧”是老担心一件坏事要发生，“虑”是老期待一件好事要发生，但都没发生。他本来应该把心神收在体内，结果却“志发于四野”，全发在外面，惦记这个人、那件事。这种人都“神不守舍”。“精神内守”的反义词叫“魂不守舍”，严重点叫“魂飞魄散”，身体在这儿，心思根本没在这儿。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "第四章：怎么才叫活得舒服", "x": "不要老纠缠于过去，特别是那些不好的事情或者是很牛的事情，正所谓好汉不提当年勇。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "1.不纠缠过去，不幻想将来", "x": "所以《黄帝内经》告诫大家，想身心健康，活得愉快一些，就把过去和将来的东西都放一放，认真面对现在的生活。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "1.不纠缠过去，不幻想将来", "x": "佛家讲“活在当下”，《黄帝内经》是道家的理论，说“志闲”。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "1.不纠缠过去，不幻想将来", "x": "“志闲而少欲”，其实就是要强调，大家该吃饭的时候认真吃好这口米饭，该去洗澡的时候，认真洗好自己的澡。你吃饭、洗澡的时候，就不要想未来、想过去，而要认真看看现在这一秒钟到底怎么样。其实道家聪明的地方就在于，如果我们把每一秒都能够过得还不错，那这辈子就活得不错了。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "9.别人能伤害你，是因为你本身有能被伤害的地方", "x": "一个德全的人，或者一个身心健康的人，是内求的人。他不会借助于外力，对别人的行为没有仇恨的感觉，也不期望别人给他什么，因此他不会怨。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.“7岁”到底是多大", "x": "“两精相搏谓之神”，就是父亲和母亲的精血结合的那一瞬间，这个人的神就诞生了，从那时候开始你就是人了，而怀胎十月直至出生时，你已经将近一岁了。所以我们说的7岁是指虚岁，女子7岁，实际上是说她实岁6岁，虚岁7岁。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "11.丹田温暖，脸色才好看", "x": "她自己还挺高兴，该干嘛干嘛。可却不知道，那个寒气已经顺着脚上的经络进入了她的卵巢和子宫，聚到那儿把它们冰镇住了，所以例假就不来了。但这还不算完，以后会怎么着？极度的痛经，如果只是痛经也还不错，说明你的血要出来但是出不来，在斗争。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "2.由美少女变成黄脸婆的“诀窍”是肠胃功能不好", "x": "所以说擦再多护肤品都没用，要脸色好，还是得吃饭。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.精血不足就会脱发", "x": "“发为血之余”，精血富余了才会长头发，精血不足了，为了保证内脏、身体的需要，它就要舍去末梢，于是头发就开始脱落。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "5.42岁时请一定照顾好小肠经、膀胱经、胆经和三焦经", "x": "不要为生命的远去感到悲哀。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "6.42岁仍然可以面如桃花", "x": "我们经常说人的心肠要热就是这个原因，因为小肠温度一低，“化”的功能就发挥不了。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "6.42岁仍然可以面如桃花", "x": "女性的保养尤其要注意饮食的温度和性质。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "6.42岁仍然可以面如桃花", "x": "很多女青年喜欢吃冷饮，其实非常危险。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "6.42岁仍然可以面如桃花", "x": "为什么女孩子爱吃冰？因为当一个人的胃消化不好、动力不足，吃的东西不往下走的时候，她的上面就觉得热、燥，要靠吃冰来缓解。实际上，她胃以下的部分都是冰凉的。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.成年人应该少喝牛奶", "x": "我劝各位爱美的女性朋友，一定要注意饮食的温度和它的本性。有的食物虽然是温的，但它本性是凉的。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.成年人应该少喝牛奶", "x": "牛奶是特别阴寒的东西", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.成年人应该少喝牛奶", "x": "痛风的病人最怕吃毛血旺了，因为这种内脏、血的制品都是阴寒的，消化它要消耗掉人体很多阳气和能量。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.成年人应该少喝牛奶", "x": "阴寒的东西化不了，最后就会集结成一种负面的能量，集聚到内心，人就常常觉得活着没意思，想死。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.成年人应该少喝牛奶", "x": "如果一定要喝牛奶，可以在牛奶里面加点热性的中药，把它的阴寒化一下，比如加点干姜、肉桂或荜拨。注意，一定是干姜，不能是生姜。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.成年人应该少喝牛奶", "x": "有人说不喝奶就缺钙，那其实也是一种商业阴谋。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "1. 为什么男人叫“丈夫”", "x": "中国的哲学，以及道家的这种思想，更接近于母性的思维。梁冬：林语堂就说过，女人更适合去做政治家。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "2.男孩子的变化首先表现在头发上", "x": "甜的东西对肾气的伤害是最大的", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "9.你吃饭，饭也在吃你", "x": "你吃得越多，元气消耗得也就越多。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "10.真正懂得吃水果的人，吃的都是坚果、硬果", "x": "而真正对人体有益的果仁，是核桃、杏仁儿、瓜子、花生等之类的坚果。你看，植物都把它最精华、宝贵的东西包裹在那硬硬的壳里，不让你吃。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "11.如何知道自己的身体里有邪气聚集", "x": "首先要恢复知觉，你得把心神收回来，自我关爱。当你忙着工作或者其他事情的时候，对身体是没感觉的。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "11.如何知道自己的身体里有邪气聚集", "x": "作为女性来讲，你想预防这种乳腺癌、乳腺增生或者卵巢囊肿，首先就必须调理好自己的情绪。我们说先有气滞，也就是先有能量的停滞，后有物质的停滞，这样才会长出东西来。之前它那儿是什么都没有的，它聚的就是一口气。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "11.如何知道自己的身体里有邪气聚集", "x": "经常摁一摁膻中穴，如果觉得痛的话，那就说明你不开心了，把它揉开之后，就会开心了。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.做“金鸡独立”就能“守神”", "x": "建议大家做什么事情都要全神贯注、聚精会神地去做。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.做“金鸡独立”就能“守神”", "x": "建议大家有空除了读《黄帝内经》之外，还可以读一下道家的经典著作《庄子》", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "第十二章：大多数的人都是死于内心的忧患", "x": "道家讲的是内求，要独立。这种独立首先是指靠自己谋生，不依附于任何人，是生活上的独立。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "第十二章：大多数的人都是死于内心的忧患", "x": "第二点就是经济上的独立。第三，要达到精神上的独立。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "第十二章：大多数的人都是死于内心的忧患", "x": "任何事情发生了，都是可以理解、可以接受的，把可以理解放在第一位，可以接受放在第二位，然后淡然一笑，坦然面对，一切不快就过去了。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "5.想不开的人叫“愚”，想不通的人叫“患”", "x": "思想之患开始是个无形的存在，是个念头，时间长了，就开始有气，变成气郁了。气郁时间长了身体就开始有结了，成了能摸到的有形物质，可能是个良性的瘤，以后可能变成一个恶性的肿瘤。这个肿瘤从哪儿来？人的疾病从哪儿来的？都来自于内在的“患”。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "5.想不开的人叫“愚”，想不通的人叫“患”", "x": "他者即地狱，人跟人没有可比性。你是天造地化出来的这么一个优秀的产物，你有你的个性，你有你的独立性。但是，很多人陷入了集体无意识之中，跟着潮流走，人云亦云。我们经常把一些客观存在当成了主观感觉，不对！只有人的心神对物质的体会才是最接近真相的，所以大家要相信自己的心。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "2.缺什么不能缺“自得”", "x": "自得是什么？自己精神独立、经济独立，能够赡养自己。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "3.他者即地狱，人跟人没有可比性", "x": "坐在那里，既不瞻天望地，又不看手机，更没有手足无措，她就那样舒服而安静地坐着。", "y": "", "d": "2023-12-15"}, {"k": "h", "c": "7.仰观于天文，俯察于地理", "x": "俗语说“二月二，龙抬头”，什么叫“龙抬头”？就是二月二正赶上开春接近惊蛰的这个节气，东方的这个星宿也就是青龙星，它的“龙角”刚刚露出地平线，就好像这个龙要抬起头来，由此中国人就说“二月二龙抬头”。", "y": "", "d": "2023-12-16"}]}, {"id": "23691273", "title": "驾驭情绪的力量", "author": "珍妮弗·泰兹", "cats": ["医学健康-医学"], "bmCount": 30, "rvCount": 0, "notes": [{"k": "h", "c": "译者序 食物爆炸时代的饮食和身心健康", "x": "欧洲人却不太一样：细嚼慢咽、边吃边聊，一顿午饭加上咖啡，能聊上两个小时。所有的食物分量都很小，盘子和勺子更小，虽然价格并不便宜。每道菜都要一点一点慢慢品，咖啡也是一口一口慢慢喝，仿佛生怕错过了某一口食物的味道、某一句聊天的感觉。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "译者序 食物爆炸时代的饮食和身心健康", "x": "因为不开心，吃了个冰激凌，在吃的时候感到畅快淋漓、忘乎所以，但是吃过之后，不仅原来的不开心依然阴魂不散，又增加了吃垃圾食品的负罪感、对发胖或者生病的恐惧感，以及解决问题失败的无力感……于是得过且过，再来一个巧克力，余下的明天再说。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "译者序 食物爆炸时代的饮食和身心健康", "x": "这种“观其所是，但不为所动”的态度，就是接纳，而“带着情绪该干吗干吗”，就是正念。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "译者序 食物爆炸时代的饮食和身心健康", "x": "这里的关键词，就是“专注”和“好奇”：不去评判臆断或者先入为主，而是充满好奇地去观察事情的过程本身，每一个变化，每一个不同，每一种可能性。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "译者序 食物爆炸时代的饮食和身心健康", "x": "不断提升的那种“观其所是、泰然处之”的宁静。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "译者序 食物爆炸时代的饮食和身心健康", "x": "每读一本好书，就开启了一种新的可能。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "引言", "x": "我希望大家在任何评判升起的时刻都能注意到自己心中的欢喜、厌恶或不偏不倚的中立，并轻松地抱持着它们，不要轻易地陷入或拒绝任何东西，直到你去体验和品味这些不一样的生活姿态。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "01 情绪与饮食 心情不好，吃一顿就好了吗", "x": "人们总是沉湎于痛苦而不能自拔，宁愿安于熟悉的苦难，也不愿面对未知的恐惧。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "01 情绪与饮食 心情不好，吃一顿就好了吗", "x": "在获得奖金欣喜若狂的时刻过去之后，六合彩中奖者并不比没中过六合彩的普通人活得更快乐。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "01 情绪与饮食 心情不好，吃一顿就好了吗", "x": "“人们对于未来的事情能带来多少快乐和痛苦的预期常常很不靠谱，结果就是，很多时候他们费尽心机却事与愿违。”", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "01 情绪与饮食 心情不好，吃一顿就好了吗", "x": "独自进食以躲避他人的目光。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "01 情绪与饮食 心情不好，吃一顿就好了吗", "x": "一些心理学家提出的理论认为，暴饮暴食和神经性贪食背后共通的深层原因，是不能有效管理自己的情绪。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "01 情绪与饮食 心情不好，吃一顿就好了吗", "x": "唯一的出路就是从中穿行。”", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "02 接纳 没有人的身体是完美的", "x": "减少痛苦煎熬的唯一手段是与痛苦共处。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "02 接纳 没有人的身体是完美的", "x": "恰恰是不愿意接纳瑕疵本身，滋生了更多瑕疵。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "02 接纳 没有人的身体是完美的", "x": "很多人都会把自己跟那些必须符合某种特殊标准，否则就没饭吃的专业模特或者电影演员进行比较，而演员和模特往往都长期忍饥挨饿、拼命锻炼，而且通常会用整容手术来维持自己的容貌和外形。我们经常把很小一撮极为纤瘦或者“美丽”的人作为自己的比较对象，而不是把自己跟平均水平或者日常生活中的人进行对照。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "02 接纳 没有人的身体是完美的", "x": "提醒自己接纳自己的体形，并且接纳另一个事实，就是他还有很多体形之外的东西。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "03 正念 怎么吃比吃什么更重要", "x": "练习正念可能会从几个方面改变你的饮食。它可以增加你对自己的情绪、想法和感受的觉察，你可能会觉得自己更能体验生命中所发生的事情，而不是用食物去应对。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "03 正念 怎么吃比吃什么更重要", "x": "正念能够减轻痛苦、增加快乐，并更能让我们在每一个当下体验生活的现实。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "03 正念 怎么吃比吃什么更重要", "x": "关注、带有目标、此时此刻，以及不加评判", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "03 正念 怎么吃比吃什么更重要", "x": "在开始大嚼之前，花点时间注视你的食物，在酒足饭饱之后，再花点时间关注自己的躯体感受，这样做可能会给你带来意义感甚至是庄严神圣的感受，而不是之前有可能产生的羞耻感。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "03 正念 怎么吃比吃什么更重要", "x": "1．当你如此专心致志地去吃一种食物的时候，发现了什么？2．你觉得做这个练习的时候跟你平时吃饭的时候有什么不同？3．你是否愿意用整整一顿饭或者一次加餐的时间来实践这种带着觉察和正念的吃法？如果愿意，请描述一下这餐饭的内容、桌椅座位的摆放，以及你打算用怎样的行动来关注你的食物以及吃的过程。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "04 管理情绪 与自己的情绪好好相处", "x": "在我的生活里，我注意到即使在脑海中翻江倒海的时候，早起做瑜伽，然后“睡过头”，闲庭信步慢慢走到我最喜欢的咖啡馆，就能让我每天紧张的生活里出现片刻安宁。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "04 管理情绪 与自己的情绪好好相处", "x": "情绪就像海浪一样总是起起伏伏的。你不会一直停留在一个固定的感受上，甚至连一个小时都做不到。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "04 管理情绪 与自己的情绪好好相处", "x": "关注你的情绪，不去评判，不去压制，也不沉溺其中。温和地给它们贴上标签，或许会对你有帮助，默默地或者小声地说：“悲伤、焦虑。”", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "05 驾驭欲望 你想要不代表你需要", "x": "用你的判断力来找到一个中间点，让你既可以尽情享受，又能够适度节制。", "y": "", "d": "2020-10-12"}, {"k": "h", "c": "05 驾驭欲望 你想要不代表你需要", "x": "这个世界就是你的马拉松，日复一日，你每天都可以做出决定去精进一公里路程，或者去驾驭一个痛苦的感受。", "y": "", "d": "2020-10-13"}, {"k": "h", "c": "06 跳出思维陷阱 你以为你以为的就是你以为的吗", "x": "你可曾尝试去压制自己与食物相关的想法呢？那些节食的人往往会这么做，但这最终会起到相反的作用。事实上，压抑跟食物有关的想法会导致你对食物产生更多的渴求和暴饮暴食。", "y": "", "d": "2020-10-13"}, {"k": "h", "c": "07 练习痛苦耐受 不在情绪糟糕时做决定", "x": "实践正念的目的，是让自己意识到试图控制自己是无济于事的，而逐渐增加对感受的觉察，并心甘情愿地跟出现的任何东西共处要好得多。接纳对食物的渴求，包括在遇到任何食物时，不去控制自己，也不试图减弱对欲望本身的体验。", "y": "", "d": "2020-10-13"}, {"k": "h", "c": "10 坚持到底 让正念成为一种生活方式", "x": "我们可以自怨自艾，也可以愈挫愈勇。反正都要花一样的力气。\n——卡洛斯·卡斯塔尼达（Carols Castaneda）", "y": "", "d": "2020-10-13"}]}, {"id": "920661", "title": "你是你吃出来的：吃对少生病，病了这样吃", "author": "夏萌", "cats": ["医学健康-健康"], "bmCount": 29, "rvCount": 0, "notes": [{"k": "h", "c": "前言", "x": "高血压患者大多最爱的食物有两种：面条和咸菜。当我让他们把面条和咸菜都戒掉之后，血压开始明显下降。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "我们活在快餐当道的世界，身体却困在了石器时代", "x": "当一个人长时间坐在电脑前的时候，一根又一根抽着烟感觉自己像活神仙的时候，无限制追求美味而乐此不疲的时候，熬夜加班加点创造人生辉煌的时候，健康状态正在一点点偏离正常轨道。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "能量平衡：比例合理更重要", "x": "饮食中一定要增加肉、蛋、奶、鱼，不能吃这么多碳水化合物，要注意给大脑补足营养，才能有效地治疗消化不良和预防老年痴呆。她认识到了问题的严重性，连声说着回去就要每天订鲜奶，天天吃鸡蛋。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "蛋白质平衡：选对优质蛋白，事半功倍", "x": "蛋白质的摄入：动物类蛋白价值优于植物类蛋白", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "蛋白质平衡：选对优质蛋白，事半功倍", "x": "如果他最近用脑多或者运动多，就要增加蛋白质类的摄入量。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "七大营养素平衡小结：学会听懂身体的语言", "x": "人的身体状况平衡可分为两种：高平衡和低平衡。运动多，思考多，饮食不挑嘴，荤素通吃，能够保持标准的体重和旺盛的工作精力，这叫高平衡。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "七大营养素平衡小结：学会听懂身体的语言", "x": "学会倾听自己身体的语言特别重要", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "全世界平衡膳食标杆——地中海式饮食", "x": "现在人们常用“地中海式饮食”代指有利于健康，简单、清淡以及富含营养的饮食。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "全世界平衡膳食标杆——地中海式饮食", "x": "1990年，世界卫生组织（WHO）提倡“地中海式饮食”，地中海式饮食最重要的特点是——既简单清淡，又富含营养", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "全世界平衡膳食标杆——地中海式饮食", "x": "第一，粮食类。以五谷杂粮为主，包括各种全麦、玉米、土豆、豆类、薯类、根茎类。虽然意大利人也吃面食，比如大家熟知的意大利面，但是在地中海地区人们的典型食谱中，面条通常只是前菜和头盘，并不当作主食吃，三明治吃得也很少。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "全世界平衡膳食标杆——地中海式饮食", "x": "第二，蔬菜类。吃新鲜的蔬菜，很少加工。比如西红柿、洋葱、柿子椒等。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "全世界平衡膳食标杆——地中海式饮食", "x": "第三，水果类。各种新鲜水果，柠檬、葡萄、蓝莓等。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "全世界平衡膳食标杆——地中海式饮食", "x": "除平衡的膳食结构之外，地中海式饮食还强调适量、平衡的原则，健康的生活方式，乐观的生活态度，同时每天坚持运动。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "世上最好的药：早餐、午餐和晚餐", "x": "好了，一切准备就绪，早餐就可以做得非常快：用微波炉把主食热一下，牛奶用电磁炉加热，烧开后立即离开电磁炉，然后从冰箱里拿出煮鸡蛋剥好扔到牛奶里，这样鸡蛋吃起来不会太凉，牛奶还能迅速降温。牛奶里除了放鸡蛋，还要放坚果，最后还要放一勺蜂蜜。再加上半根黄瓜或者一个小苹果，也可能是一根香蕉。这份早餐只需要十分钟就能解决，而且一上午不觉得饿，精力充沛。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "世上最好的药：早餐、午餐和晚餐", "x": "如果大家没有条件，做不到每天都达到“早餐100分”的标准，那么周末有时间时，完全可以吃得比这还丰盛。平时上班早晨最紧张，没时间做早餐，但至少要保证吃够碳水化合物和蛋白质，比如吃个汉堡包或者肉夹馍，再加杯牛奶或豆浆。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "世上最好的药：早餐、午餐和晚餐", "x": "第一种：包子（碳水化合物）+鸡蛋（蛋白质）+果蔬汁（维生素+膳食纤维）。第二种：烙饼（碳水化合物）+鸡蛋、牛奶（蛋白质）+水果（维生素+膳食纤维）。第三种：火烧（碳水化合物）+鸡蛋、肉类、豆浆（蛋白质）+ 蔬菜（维生素+膳食纤维）。第四种：五谷杂粮饭（碳水化合物）+鸡蛋、牛奶（蛋白质）+水果（维生素+膳食纤维）。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "世上最好的药：早餐、午餐和晚餐", "x": "此时中午的三种成分成了三足鼎立状态：蔬菜最好占1/2，蛋白质类食物（肉类、鱼类、蛋类）占1/4，粮食类占1/4。如果你的运动量比较大，可以把粮食类的比例加大。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "世上最好的药：早餐、午餐和晚餐", "x": "太辣的菜肴容易使食道发热，破坏味蕾细胞，伤害我们的肠胃。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "选对食物是一门技术活儿", "x": "为了让食品味道更好，便添加增鲜剂或其他提高口味的化学物质；为了让颜色看起来促进食欲，便添加色素；为了让香味更吸引人，便添加人工香料；为了避免腐烂，则添加防腐剂。这些添加成分含有多种人体较难分解的化学物质，进入人体后会增加肝脏解毒的负担，诱发肝脏损伤。这类食物最为常见的有方便面、果冻、奶茶、薯片、即食谷物、腌制肉类、饼干等。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "选对食物是一门技术活儿", "x": "所以大家对天然食物要有敬畏之心，那是大自然赐予的。我们的身体也是大自然的产物，摄取天然食物要比加工食物好得多。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "没有放之四海而皆准的食谱", "x": "女士每个月有月经血的输出，所以应该更多地补充些动物肝脏、血制品和有补铁效果的植物性食物，比如猪肝、猪血、鸭血、芝麻、蘑菇、木耳、海带、紫菜、桂圆等。补铁同时补充维生素C，可以促进铁吸收，所以要多吃水果。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "PART 04 我们到底应该怎么吃", "x": "现在的你是过去每一餐的积累；未来的你能够拥有什么样的健康状态，由从今往后的每一餐决定。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "肉蛋奶类：普遍吃得太少而不是过多", "x": "大家千万别因为食品安全问题，就完全舍弃肉类、蛋类，动物类食物和植物类食物都要吃。人体有自己的排毒能力，如果我们能做到不挑食不偏食，少吃多餐，即便是吃进去一点有害物质，我们的身体也是能够排出去一部分的。对身体来讲，做任何选择都要考虑风险收益，吃获得的好处比坏处要大得多，事关健康，不可因小失大。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "肉蛋奶类：普遍吃得太少而不是过多", "x": "贫血人群要特别注意肉食摄入", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "肉蛋奶类：普遍吃得太少而不是过多", "x": "建议多吃畜禽类红肉，还要吃肝和鸭血。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "肉蛋奶类：普遍吃得太少而不是过多", "x": "在所有食物当中，红肉是铁元素的重要来源，其中牛肉中铁含量尤其丰富，每100克牛肉中铁元素的含量为3.3毫克，是相同质量猪肉的2倍，也高于羊肉中的铁含量。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "肉蛋奶类：普遍吃得太少而不是过多", "x": "值得一提的是，牛肉遇到西红柿后，可以使牛肉中的铁更好地被人体吸收，有效预防缺铁性贫血。而且在炖牛肉时，加上些西红柿，能帮助牛肉更快软烂，两者是很好的组合。此外，鸭血也不错，在开水里煮一煮，捞出来，放点作料，既快捷又好咀嚼，不仅女性，老年人和小孩子都可以经常吃，预防贫血。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "水果：吃得实在太少了", "x": "正常人一天一个苹果，基本上能保证维生素C的需要", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "肌肉组织：肠胃、心脏等器官动力不足都可以由此入手", "x": "便秘很可能因为身体缺肉", "y": "", "d": "2020-10-25"}]}, {"id": "915522", "title": "范志红写给女人的美丽健康书", "author": "范志红", "cats": ["医学健康-两性"], "bmCount": 24, "rvCount": 0, "notes": [{"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "保养皮肤经验谈｜1.健康饮食。2.充足睡眠。3.有氧运动。4.心情愉快。5.体重稳定。6.适当保湿。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "多睡觉，多运动｜如果睡眠充足、质量好，脸颊就是微微鼓起的，饱满有弹性。这样人看起来就年轻。如果睡眠不好，或过度疲劳，脸颊是下垂的，人就会在一天中看起来老几岁。锻炼健身，提高肌肉力量，也能让人显得年轻，因为身体和脸颊都不那么容易松弛。所以，到了各种节假日，一定要多睡觉，多运动，别再熬夜。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "饿了就要及时吃，困了就要及时睡，感冒了就要马上卧床休息，少用空调多运动，不吃冷饮和甜食，每天都喝大枣杂粮粥，还有足够多的蔬菜。健康生活后，不仅皮肤好了，多年的痛经也一去不返。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "掉头发，先要找到原因｜掉头发原因很多，缺蛋白质只是原因之一。常见于长期节食或食量太小的女性。女性还有因为精神压力或睡眠不足导致的脱发，缺乏某些维生素导致的脂溢性皮炎脱发，贫血、缺锌导致的头发干枯、发脆、变少等。一些疾病和药物反应也会导致脱发。至于中年男性的谢顶，和营养问题之间的关系并不明确。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "所以，无论怎么忙，都不能一边看电脑一边吃东西，不要在饭桌上谈工作，更不要在饭桌上教训孩子。要放下工作，忘记烦恼，放松心情，专心吃饭。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "无论压力多大，都要按时睡觉，睡前半小时要放松心情，忘记休息以外的其他事情。把8小时觉睡好，身体就有足够的时间和精力来做好内部修复工作，胃肠细胞3～4天就要更新，所以能够推测，胃肠的修复对睡眠情况非常敏感。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "不要吃煎炸熏烤食品，不要吃那些口感黏腻的炒菜，以及各种不知放了什么油的小摊面点。烹调方法尽量采用蒸、煮、炖等，不要过于担心加热到软会破坏营养素，因为即便损失一点维生素，也比吃了不消化要好。维生素可以用丰富食物品种的方法来弥补。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "一个贫血的人不可能有红润的脸色", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "护肤品只是一种外在保护，它们不可能改善皮肤内部的机能，各种夸大宣传都不必相信。我选择日用护肤品的原则是，凡是声称有美白作用的不买，凡是声称有杀菌作用的也不买。前者担心对皮肤有刺激或堵塞作用，后者担心引起皮肤表面菌群的紊乱。隔离霜基本上不用，即便有空气污染，我也认为皮肤能自由呼吸是最重要的。至于粉底霜之类的化妆品，只有在录电视节目的时候才会接触它。夏天如果不是出远门或去海边，连防晒霜也不用，只戴上遮阳帽就好了。当然，如果防晒霜不油腻，我并不拒绝在面部使用，但我也不怕夏天过后皮肤微微晒黑，因为全身接受阳光，能得到更多的维生素D。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "个人体会，睡觉是最好的美容方法。人们都知道皮肤在夜里进行组织更新和修复，如果能在晚上11点前入睡，而且睡到自然醒的话，皮肤就会发亮、紧绷。什么高档美容品都不可能达到这样的效果。很多女性一边每月花上千块钱来护肤美容，一边天天熬夜，远不如用几十块钱的面霜，同时早点睡觉。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "一般而言，少吃油腻，少吃辛辣，少吃太咸和太甜的东西，少吃加工食品，饮食清淡天然，是必需的条件。没有哪一种食品能够像灵丹妙药一样让皮肤快速改善，长期的健康生活才能让身体一直保持活力，从而透过皮肤表现出来。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 做美丽女人，先树立正确的健康观念", "x": "另一方面，营养不良也会引起脱发。比如说，在明显缺乏蛋白质的情况下，头发不仅生长缓慢，还容易脱落，而且发质变差，头发变细、发脆、枯干、颜色变浅。这是因为，头发的本质是角蛋白，它就是一种蛋白质；头发黑色素的形成，还需要一种叫做“酪氨酸”的氨基酸作为原料。而制造黑色素和角蛋白的过程中，又需要多种B族维生素和微量元素的帮助，这些营养都来自于食物。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "选择可持续的方法｜不论别人怎么说，自己的身体感受始终是最正确的。身体感觉舒服的事情要多做，感觉不舒服的事情要尽量避免，比如做熬夜，比如暴饮暴食，比如残酷节食，比如做让人关节不适的运动。减肥也好，塑形也好，改善“三高”也好，都要选择你最乐于接受、能够长期坚持的方法。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "减肥饮食的关键是可持续｜如果希望别人给你把每一顿的餐单都写出来，成功减肥的希望就不大。因为没人能按别人的餐单吃一辈子。靠外力，靠短期措施，总是难以持续的，必须自己懂得如何在各种情况下坚持健康饮食才能成功。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "成年女性一天的合适食量｜粮食150～200克（生重，包括大米、面粉、小米、燕麦片等），加上杂豆50克或薯类200克（生重），瘦肉50克，蛋1个，酸奶1杯，水果半斤多，蔬菜1斤。推荐再加1小把坚果（去壳约25克），油不超25克为好。减肥时主食要减量。如果运动量大，或工作中体力活动较多，则需要加量。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "食品美味公式｜糖+油脂+酥/脆/软的口感＝美味。符合这个公式的食物必然诱惑力无穷，令人爱不释口。比如蛋糕，比如蛋挞，比如曲奇，比如派，比如糖霜油条。但这也是个不健康食品公式——营养素密度低，饱腹感差。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "豆浆是好的疗饥食物｜晚上饿了不吃很难受。我最推荐的扑灭饥火的食品是豆浆。做过相关测试，按同样能量来计算，它带来的饱腹感最强。不信大家试试，喝一杯并不浓厚的豆浆之后，急迫寻求食物的感觉立刻就消退了，一个小时都不会觉得饿。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "成功关键在于养成好习惯｜只需养成好的习惯，完全无需用毅力来克制。对油腻和甜点无需求，大鱼大肉有一两样就足够，饭吃到饱就正好，一点都不悲惨。相反，身心感觉都很幸福，也没有节食减肥的麻烦。减肥真的就是这样简单。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "只问耕耘，莫问收获很多人运动没多久，就因为体重下降不明显而放弃，却不考虑自己是否在体型上有了好的改善。如果抱着“只问耕耘不问收获”的心情，切实把每天的饮食、运动、心情都调整好，踏踏实实追求健康生活，不用常称体重，赘肉自然逐渐远离，身材自然越来越好。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 肥胖问题，该引起重视了", "x": "减肥一定要踏踏实实｜有些人只愿意看一句话的结论，不愿意看道理和分析过程。然而，不肯思考的人，就无法避免被忽悠、被蒙骗、被误导的悲剧。我也不相信，一个浮躁到连点击一下链接都嫌麻烦、连一千字以上的文章都读不下去的人，能够踏踏实实地把减肥和保持健康的事情做成功。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 你是慢性病的候选人吗", "x": "为了健康，远离甜饮料｜甜饮料可口美味，很多人都很喜欢，但是却会害孩子虚胖、缺钙、缺维生素，害成人易患肥胖、糖尿病、心脑血管病，害女性增加子宫内膜癌风险，害男人容易得肾结石和痛风。因此，还是要远离甜饮料，这样才会让自己更加健康", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 你是慢性病的候选人吗", "x": "小心那些精白淀粉加油脂的小吃｜各地都有不少大量油脂+大量精白淀粉的传统小吃。比如蒸饭包油条、糯米烧卖、咸肉粽子等，从升高血糖血脂、促进糖尿病和冠心病的角度来说，均属于“黄金组合”。贫困时代，人们身体消瘦，每天流汗干活，偶尔食之并无妨碍。如今体脂过多，运动太少，还经常享用这种食物，就很危险了。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 你是慢性病的候选人吗", "x": "只要是油炸和熏烤食物，就含有多种有害致癌物质，常吃都会增加多种疾病风险，包括胃癌、食管癌、肠癌、痴呆、2型糖尿病等。别以为自制的食品就没事。因为无知，在自家厨房里制造致癌物的事情很多见呢。", "y": "", "d": "2020-11-22"}, {"k": "h", "c": "1 你是慢性病的候选人吗", "x": "我的饮食原则｜我的饮食很简单。不吃油炸食品，不吃熏烤食品，几乎不吃加工肉制品，不吃咸鱼腊肉，不吃饼干零食，不喝甜饮料。每天吃1斤蔬菜（其中包括半斤绿叶菜）半斤奶或酸奶，1个鸡蛋，每餐都有优质蛋白质，豆制品和肉类、鱼类等换着吃。粮食平均每天四两多（生重），其中含有粗粮、豆类和薯类。烹调油、盐偏少。", "y": "", "d": "2020-11-22"}]}, {"id": "3300052873", "title": "徐文兵：黄帝内经的智慧+明哲保身+中医的常识（全3册）", "author": "徐文兵", "cats": ["医学健康-健康"], "bmCount": 22, "rvCount": 0, "notes": [{"k": "h", "c": "第一章 中国人的活法", "x": "关于职业，古人认为，你如果选择跟自己内心相矛盾、相抵触的职业，就是最下贱的职业，而不以收入来衡量。如果选择了喜欢的工作，而且不压抑自己的情绪，不跟自己拧巴，就能活得长久。", "y": "", "d": "2024-01-02"}, {"k": "h", "c": "第一章 中国人的活法", "x": "形寒饮冷则伤肺”，意思是说你的身体受凉了，还总喝冷饮，这个冷饮喝到胃里后，得靠你的胃，靠你的热乎气儿，把冷饮温到跟人的体温36.5℃一样，这就需要消耗你的能量，日积月累，胃当然会受不了。肺胃相关，所以时间长了，肺也受不了。", "y": "", "d": "2024-01-02"}, {"k": "h", "c": "第一章 中国人的活法", "x": "平时饮水，渴了再喝，喝的时候一定要喝热水，而且每次喝三口，三“口”加起来叫什么？“有品”。不是这么喝的人，喝冰水、喝冷水、喝碳酸饮料的人，全不符合养生之道。", "y": "", "d": "2024-01-02"}, {"k": "h", "c": "第二章 生病都是自作自受", "x": "经过发酵的酸奶比牛奶的寒性要弱一些、温一些，大家可以喝一些。", "y": "", "d": "2024-01-02"}, {"k": "h", "c": "第三章 自《黄帝内经》出现的两千多年以来，人的病理情况没有太大的变化", "x": "什么是“贼风”？它有两个含义，一种是趁你不注意的时候出现的风。人们什么时候不注意？就是大大咧咧的时候，比如，炒菜的时候开冰箱，夏天骑摩托车兜风，睡着的时候……这时身体的防御能力很差。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第三章 自《黄帝内经》出现的两千多年以来，人的病理情况没有太大的变化", "x": "“恬惔”不是没有欲望，而是没有太多、太强的欲望，要寻找到一个平衡点。现在很多人都在追求更高、更快、更强，最后却累死在奔跑的路上。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第三章 自《黄帝内经》出现的两千多年以来，人的病理情况没有太大的变化", "x": "如果我们能做到保持自己的精，不让它随意流失，守着我们的神，让它关爱自己，“病安从来”。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第四章 做一个走运的人，做一个尽可能全乎的人", "x": "《黄帝内经》中说，“因思远慕谓之虑”，就是说我已经形成了固定的思维模式，就觉得这事儿必定要发生，然后就焦急地等待着，但这事儿又没发生，这个状态就叫“虑”。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第四章 做一个走运的人，做一个尽可能全乎的人", "x": "禅宗有一个故事说得非常好，“人生就像一个人摔下了山崖，万幸的是，你攀住了一根树藤，你往下看，是万丈深渊；你往上看，有两只老鼠在啃树藤。”意思是，随着时间的推移，你还是要往下掉。在这种状态下，你该怎么办？应该欣赏周围的风景，边上有草莓，摘下来尝一尝，很甜。\n人都是要死的，迟早而已，你总想这件事，会影响你活在当下。其实，我们把每个今天都过好了，生活质量就有保障了。\n忘掉该忘的事，留下空间记点儿该记的事。俗话说：“不痴不聋，不做家翁。”意思是，有些话是我想听的，就听见了；不想听的就假装没听见，学会屏蔽，学会忘记。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第四章 做一个走运的人，做一个尽可能全乎的人", "x": "如果你能做到“志闲而少欲”，你的心神是在心里待着的，而且被保护得好好的。你不会对过去的记忆念念不忘，也不会对将来的事没完没了地焦虑，就会做到“心安而不惧”。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第四章 做一个走运的人，做一个尽可能全乎的人", "x": "中国人的饮食观是什么？以人为本。谁吃？什么心情下吃？怎么吃？狼吞虎咽和细嚼慢咽一样吗？吃进去的感觉美吗？……", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第四章 做一个走运的人，做一个尽可能全乎的人", "x": "道家认为，每个人都是天造地化、独一无二的精华，每个人都跟别人是不一样的。尺有所短，寸有所长。你这儿比我强，你那儿就比我短。所以，我们要有一种心平气和的状态，各吃一碗饭。也别光看贼吃饭，不看贼挨打。先了解自己能吃几碗干饭，了解自己的内心适合做什么工作，然后自得其乐。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第四章 做一个走运的人，做一个尽可能全乎的人", "x": "现代社会物欲横流，物欲横流的结果是什么？我们成了物质的奴隶，买辆车伺候车，买栋房子伺候房子，所以，很多人受累于物，把自己宝贵的生命牺牲在不同的物中。有几千间房子，一夜能睡几间？十间房子轮着睡，你不就睡一张床吗？你有那么多好吃好喝的，你一天吃几顿饭？你不就吃三顿饭吗？", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第五章 关爱身边的女人，从了解她的生理变化特点开始", "x": "所以，如果太冲脉被冰水一激、一闭，它就下不来了，也冲不上去。之后就是严重的痛，什么时候把它冲开了，就不痛了；冲不开，永远会痛。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第五章 关爱身边的女人，从了解她的生理变化特点开始", "x": "我为什么要强调晚上十一点前睡觉呢？按照中医理论，半夜子时就是晚上十一点到凌晨一点，这是胆经所主的时间。也就是说你的气血在养胆，你那会儿睡着了，胆有气血养；你那会儿不睡，胆就没人照顾。所以，一定要睡子午觉，子时之前要睡觉。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第五章 关爱身边的女人，从了解她的生理变化特点开始", "x": "怎么能让自己的阳明脉不衰呢？有没有办法？当然有。首先，胃是阳性的，它最怕阴寒的东西。你想让自己面不焦、发不堕，就不要让寒凉的东西伤胃。所以，我反复强调，中国人的体质跟西方人不一样，不要跟人家学，要喝热水，每次喝三口；要少吃生冷的东西，应该吃一些温暖的食物。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "第五章 关爱身边的女人，从了解她的生理变化特点开始", "x": "放十二枚枣，生姜大拇指这么一块，切成几片煮。先用大火把水烧开，然后用小火慢慢炖十五到二十分钟。在温的状态下喝姜枣茶，常喝的结果是什么？面不焦了，发也不堕了。为什么？因为把自己的胃调养好了。\n枣最难消化的是它的皮，所以一定要把它掰开。枣吃多了会伤牙，直接煎汤喝就少了副作用。推荐脾胃比较寒的，尤其是平时爱吃生冷，以及出现了面焦发堕的人喝姜枣茶。", "y": "", "d": "2024-01-03"}, {"k": "h", "c": "认识中医", "x": "养心是什么？养的意思就是顺应，养心就是发现自己的本心，知道自己最需要的东西。带孩子也是一样，老话说：“三岁看大，七岁看老。”三岁之前观察孩子的天性，他是什么样的人，他对什么有兴趣，他讨厌什么，然后你再教育他。我们现在不是这样教育，而是爹妈喜欢什么就给孩子什么。", "y": "", "d": "2024-01-04"}, {"k": "h", "c": "认识中医", "x": "压的繁体字是“壓”，上面是讨厌的“厌”，首先，说明从事自己不喜欢做的事才会觉得有压力；其次，患得患失才有压力。道家让人独立守神，“以恬愉为务，以自得为功”，不依赖身外之物，就没有压力。", "y": "", "d": "2024-01-04"}, {"k": "h", "c": "认识中医", "x": "你现在把我的一切都拿走，我依旧活得挺好，做人必须想得开，很多人都是“死”过一次才想开的，之所以现在有压力，就是因为还没有想开，心态没放开。内心想得开，如果你的经络通畅，压力在你的身体里通行，它有进出的渠道，这就没事。就怕人纠结，在纠结的状态下再有压力，有两个可能，一个是爆炸，是身体内的；另一个就是爆发，这是向外的。", "y": "", "d": "2024-01-04"}, {"k": "h", "c": "认识中医", "x": "大家都知道“康庄大道”，五曰康、六曰庄，意思是五个方向都通叫康，六个方向都通叫庄；最高境界是几个方向？中国数字最大数是九，九个方向都通叫什么？馗。这就是极大的开通。", "y": "", "d": "2024-01-04"}, {"k": "h", "c": "徐公释疑", "x": "工作是谋生手段，用意识去解决就够了，没必要投入感情和神，让你欢喜让你忧。那你的神往哪儿投？往家庭和爱好上投。", "y": "", "d": "2024-01-05"}]}, {"id": "917444", "title": "你的身体，是一切美好的开始", "author": "卡梅隆˙迪亚茨 桑德拉˙巴克", "cats": ["医学健康-两性"], "bmCount": 16, "rvCount": 0, "notes": [{"k": "h", "c": "引言 知识就是力量", "x": "学会如何照顾你的身体，是你能学到的最重要的知识，永远都是。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "引言 知识就是力量", "x": "你有多关心它，决定了你能生活得多好。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "引言 知识就是力量", "x": "如果你真的希望到达这些美好的目的地，你就应该尽力去锻炼身体，让它强健结实、充满力量、无所不能。你一定要学会，如何在你的这副独一无二、美妙无比的身体中好好生活。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "引言 知识就是力量", "x": "我希望你能明白，用健康精美的食物滋润自己、自如地运动和流汗、真心真意地关心自己的健康，是怎样一种美妙的感觉。", "y": "", "d": "2022-02-08"}, {"k": "h", "c": "引言 知识就是力量", "x": "但是这样的转变不是在一天之内就能发生的，也不是只要你把这本书瞄上一两眼，或者怀有一点希望，就能发生的。事实是，那种能让你一夜之间变得健健康康、快快乐乐的速效良方、魔力药丸是不存在的。如果你希望自己能获得健康，你就不能满足于了解人体的运行机制、了解健康需要什么，你必须尽你所能不断应用那些知识，做出你能做出的最佳决策，才能得到你想要的健康身体。这需要你不断付出努力，不是能一蹴而就、一举成功的。这就是为何知识拥有强大力量的原因——在你自内而外真正掌握了那些知识后，你就不会错过一切机会，你就能日复一日地将知识运用于实践中。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "第1章 人如其食", "x": "你的健康状况取决于你每次进食时，提供给身体的营养。", "y": "", "d": "2022-02-08"}, {"k": "h", "c": "第1章 人如其食", "x": "如果我吃下去的是垃圾，我就会感觉自己是垃圾；如果我吃下去的是富含能量的健康食品，我就会精力充沛。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "第1章 人如其食", "x": "我指的健康，是拥有一个能够发挥最佳效能的身体、一个拥有精力可以全天运转而不致崩溃的身体、一个能够击退各种疾病并让人保持强壮的身体。我指的健康，是在你早上醒来、起床、做早餐、动起来时，感觉自己的身体棒极了。我指的健康，是拥有敏锐、清晰、缜密的头脑，还有快乐的心灵。", "y": "", "d": "2022-02-08"}, {"k": "h", "c": "第2章 食物，美好的食物！", "x": "我们应该避免食用那些速食食品和加工食品。我们可以选择全谷物、蔬菜和水果，越原生态越好。", "y": "", "d": "2021-01-23"}, {"k": "h", "c": "第2章 食物，美好的食物！", "x": "随着我饮食风格的变化，随着我不再将加工食品塞入口中，一件有意思的事发生了——我的皮肤开始清爽起来。", "y": "", "d": "2022-02-08"}, {"k": "h", "c": "第3章 狩猎者，采集者，汽车餐厅常客", "x": "产生的可怕后果是：很多人每天吃着那些引起他们恶心、饱胀、倦怠的食物；吃着那些让他们体重增加、皮肤变差、头疼心慌的食物；吃着那些让他们因为尿频、腹泻而不断跑洗手间，或者因为尿闭、便秘而完全不需要去洗手间的食物。", "y": "", "d": "2022-02-08"}, {"k": "h", "c": "第3章 狩猎者，采集者，汽车餐厅常客", "x": "就因为你能把一样东西放到嘴中，咀嚼、吞下，然后排泄出来，并不意味着这东西就是食物。这只能说明，这东西你咬得动、吞得下、拉得出而已。", "y": "", "d": "2022-02-08"}, {"k": "h", "c": "第21章 女性的身体", "x": "一个正常的生理周期，标志着你的身体健康、身体功能良好。", "y": "", "d": "2021-01-25"}, {"k": "h", "c": "第23章 你能行", "x": "现在你该行动起来，将信息变成行动，将知识变成实践，将梦想变成现实。你能做到的，因为你能行。", "y": "", "d": "2021-01-25"}, {"k": "h", "c": "第23章 你能行", "x": "你越能坚持健康的选择，你离你想成为的那个快乐、健康、美丽、全身洋溢着光彩的女人就越近。活得健康和幸福，需要你付出一生的努力。和你身体建立友谊、了解你身体的需求、知道自己该如何满足这些需求，是非常重要的。了解你的选择将如何从生理上、心理上和情绪上影响你，是非常重要的。", "y": "", "d": "2021-01-25"}, {"k": "h", "c": "第23章 你能行", "x": "人们都喜欢一成不变的生活，但如果我们希望做出改变，如果我们愿意敞开自我，学习新鲜事物并建立新的生活习惯和生活模式，我们就会发现：尽管我们以为自己连一个蛋都不会煎，但其实我们厨艺一流；或者，我们能够做10个引体向上，虽然我们以为自己只能做上1个；或者，完成许多只有我们自己才能做到的事情。", "y": "", "d": "2021-01-25"}]}, {"id": "23071744", "title": "分手后，成为更好的自己", "author": "布鲁斯·费希尔 罗伯特·艾伯蒂", "cats": ["生活百科-情感"], "bmCount": 9, "rvCount": 0, "notes": [{"k": "h", "c": "序言 维吉尼亚·萨提亚", "x": "离婚后自我会受到伤害，自我价值感会降低，内心会不断纠结到底出了什么错，对未来会有很多恐惧。", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "序言 维吉尼亚·萨提亚", "x": "他让人们认识到离婚是一个过程，在这期间人们可以从过去学到新的东西，可以更加了解自己，还可以获得成长，找到之前未知的新自我。有人说这一过程就像手术之后的恢复期，这一比喻非常恰当。", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "引言 罗伯特·艾伯蒂博士", "x": "你走的每一步都是有价值的人生经历和教训。不要着急，给自己足够的时间，充分了解自己的痛苦，重建自己的能力，让自己得以前行。", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "第一章 重建方块", "x": "虽然分手给你带来了感情创伤，但你却可以找到极大的个人成长空间。", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "否认：“我不相信这件事发生在了我身上”", "x": "“凡是我们能感受到的，都是我们可以治愈的。”", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "爱：“会有人真的在乎我吗？”", "x": "重建过程中重要的一点就是学会爱自己。如果你不爱自己，不能接受自己的本来面目，不能“完完全全地接受自己”，你又怎么能期待别人爱你呢？", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "为什么非要分手呢？", "x": "我们活在世上，需要学习两个最为重要的能力：一是如何建立并且维护爱情关系中两人之间的桥梁；二是如何做父母。", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "为什么非要分手呢？", "x": "坦然一些", "y": "", "d": "2022-06-06"}, {"k": "h", "c": "为什么非要分手呢？", "x": "在你发现爱情存在问题后，你对生活和自己会有了更多的了解。你的觉悟和见地都有了很大的提高。为什么不把自己的新觉悟和见地用于将来的成长呢？为以后的生活做些什么吧，不要沉溺于后悔", "y": "", "d": "2022-06-06"}]}, {"id": "CB_9bb3DD3CXGoO71Q71HGhC2nd", "title": "精神健康讲记_9787515218885", "author": "未知作者", "cats": [], "bmCount": 8, "rvCount": 0, "notes": [{"k": "h", "c": "觉察的三个面向:身体一情感一-思想", "x": "一个中医眼中的心身调适与精神发展", "y": "", "d": "2026-01-26"}, {"k": "h", "c": "人不可能永远快乐", "x": "第一，接纳自己正处于不佳的状态;第二，学习带着这个痛苦在生活中做力所能及的事，带着痛苦跟外界交流，小心地处在自己可以接纳应对的范围内，逐渐等待自己恢复。", "y": "", "d": "2026-02-02"}, {"k": "h", "c": "人不可能永远快乐", "x": "如实地、充分地体验自己的痛苦，如实地了知自己有多难受，内心的焦躁不安", "y": "", "d": "2026-02-02"}, {"k": "h", "c": "人不可能永远快乐", "x": "学习带着痛苦做一些简单的事", "y": "", "d": "2026-02-02"}, {"k": "h", "c": "人不可能永远快乐", "x": "当我们遇到任何突然发生的人生危机，或者陷入长期的心理困境的时候，很重要的一点是要接纳当下的现实--我目前处在很低的状态中，我接受这个状态。", "y": "", "d": "2026-02-02"}, {"k": "h", "c": "人不可能永远快乐", "x": "不硬撑着，不在外围造一个“还不错”的自己。然后再看看，我在这个很低的状态下还能做什么，能做什么就做什么。只要这样慢慢地去行动，自己就会恢复，而且会恢复得相对快一些，因为没有太多内心的抵抗，也没有太多思维缠绕和情绪上的干扰来消耗自己仅存的精、气、神。", "y": "", "d": "2026-02-02"}, {"k": "h", "c": "人不可能永远快乐", "x": "毋意，毋必，毋固，毋我:不要主观臆测，不要认定理所当然，不要固执己见，不要以为自己的观点、感觉总是对的。", "y": "", "d": "2026-02-02"}, {"k": "h", "c": "心定好看病", "x": "Tip4:保持精神稳定的建议和方法\n1.放松与觉察的练习(打坐或站桩)。2.尽量避免看恐怖片或恐怖小说。\n3.如果身形比较单薄，肌肉不足，需要适度的体能练习，强壮身体会帮助我们的保护层厚一些。\n每天下蹲30~60个，俯卧撑10~30个，或平板支撑一分钟。\n4.减少不必要的社会交往和闲聊、熬夜。\n5.增加独处、休息和睡眠的时间，接触大自然。", "y": "", "d": "2026-02-03"}]}, {"id": "22606337", "title": "好好吃饭：无须自控力，三观最正的瘦身指南", "author": "布莱恩·万辛克", "cats": ["生活百科-时尚", "生活百科-体育"], "bmCount": 7, "rvCount": 0, "notes": [{"k": "h", "c": "1 无意识额度", "x": "拿到的容器越大，人们吃得就更多。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "1 无意识额度", "x": "这毋庸置疑。不管爆米花是现做的、还是放了两星期的，不管观众坐下看电影时是饿的、还是饱的，都无关紧要。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "1 无意识额度", "x": "大家吃爆米花是因为爱吃吗？不是。他们是因为饿了才会吃吗？不是。他们吃，是因为周围的所有暗示——不单是爆米花桶大小，还有其他一些后面要讨论的因素，比如分散注意力的电影、周围观众嚼爆米花的声响，还有看电影吃零食的习惯。这些都是暗示，让我们心安理得地吃个不停。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "1 无意识额度", "x": "这就是卡路里积少成多的危险所在。每天只是多摄取了10个卡路里（也就是一片绿箭口香糖，或是三颗小糖豆），一年之后的今天，你就会胖了一磅￼。只需每天三颗糖豆。\n所幸，反过来也是一样的道理。", "y": "", "d": "2020-10-25"}, {"k": "h", "c": "2 被遗忘的食物", "x": "越重的人（无论是美国人还是法国人），越会依赖于外部信号来告诉自己停止进食的时间，而较少依赖于是否有饱腹感￼。", "y": "", "d": "2020-10-26"}, {"k": "h", "c": "5 无意识饮食脚本", "x": "电视对饮食有三重危害。除了让人贪吃之外，它还会害你不注意自己吃了多少东西，使你吃的时间过久。这是一个预设的、惯性的仪式：我们打开电视机，坐在自己喜欢的位子上，嘴巴馋了，然后去拿零食。吃吃喝喝，让我们手上有事可做，它让我们忙着边吃边关注电视剧剧情，并发出相关疑问：“还有什么节目？”“我看过这个吗？”“《摩登原始人》（The Flintstones）是真人真事吗？”并且，因为胃不会算数，我们越关注所看的节目，最终更加会忘掉自己吃掉多少食物￼。", "y": "", "d": "2020-10-26"}, {"k": "h", "c": "5 无意识饮食脚本", "x": "任何分散我们对食物注意力的事情，都使我们更有可能不自觉地多吃。", "y": "", "d": "2020-10-26"}]}, {"id": "27328324", "title": "想瘦：很享受的高效减肥法", "author": "许梦然", "cats": ["生活百科-时尚", "生活百科-体育"], "bmCount": 4, "rvCount": 0, "notes": [{"k": "h", "c": "减肥人的嘴，骗人的鬼", "x": "成功的减肥方式一定是要顺应身体的规律，跟身体做朋友。", "y": "", "d": "2021-03-10"}, {"k": "h", "c": "减肥人的嘴，骗人的鬼", "x": "找到一个中间点，保持固定的饮食，少吃多餐，进行适当的体育运动。", "y": "", "d": "2021-03-10"}, {"k": "h", "c": "减肥人的嘴，骗人的鬼", "x": "（1）少吃多餐。这样不仅可以刺激新陈代谢，还可以防止过度饥饿。\n（2）每餐摄入蛋白质。因为消化蛋白质需要更多的热量。\n（3）早餐要吃饱。丰盛的早餐会让身体更快醒来。\n（4）能站着就站着，不要坐着。这样能帮助身体机能更加活跃。\n（5）喝冷水，调低室内温度。这样一来，身体需要消耗更多热量来维持我们的体温。\n（6）喝绿茶。\n（7）喝咖啡。", "y": "", "d": "2021-03-10"}, {"k": "h", "c": "没有一顿火锅解决不了的不开心", "x": "最常见的触发暴饮暴食的负面情绪有五种：无聊、抑郁、焦虑、紧张和悲伤。", "y": "", "d": "2021-03-10"}]}, {"id": "23402170", "title": "怦然心动的人生整理魔法", "author": "近藤麻理惠", "cats": ["生活百科-居家"], "bmCount": 2, "rvCount": 1, "notes": [{"k": "h", "c": "前言 请你一起来体会整理的魔法", "x": "只被喜爱事物围绕的幸福场景", "y": "", "d": "2025-05-02"}, {"k": "h", "c": "碰触到的瞬间，是否感觉“怦然心动”？", "x": "整理时只考虑“丢弃”是不行的，因为整理的本意不是选择“要丢的东西”，而是选择“要留下来的东西”。", "y": "", "d": "2025-05-02"}, {"k": "t", "c": "全书想法", "x": "", "y": "全书有点啰嗦，但其中方法值得借鉴。总结来说：\n1. 不要“每天整理一点”，而是一次性彻底整理到位，后续的整理工作只是“把东西放回原位”。\n2. 整理时需要做两件事，一是确定物品的去留，二是为每件物品确定放置的位置。\n3. 按物品的类别整理，而不是按场所整理（因为某一类物品往往会分散在不同场所）。掌握每类物品的数量，做到心中有数。\n4. 确定物品去留时，不是选择“要丢弃的东西”，而是选择“要留下的东西”。（这个思维转换很重要！） 打开你的感官，去接触物品，觉察身体的反应，留下让你心动的物品。\n整理的本质在于建立秩序：清楚地知道自己拥有什么，才能更好践行“一进一出”的理性消费原则。这种对物品的梳理，也是在重构人与物品的情感联结 —— 慈心于物，珍惜珍爱你拥有的每一件物品，认真感恩地将每一件物品物尽其用。正如作者所言，当你周围全是让你心动的物品时，空气都会变得轻盈，内心也会澄澈通透。\n只拥有让自己心动的物品，在我看来也是一种极简主义，因为极简的反面不是极繁，而是混沌，即你从来没审视过你拥有多少东西。这种极简生活的核心在于，我们最宝贵的东西是我们的健康、时间和注意力，我们需要主动排除干扰，远离诱惑，打破消费主义营造的幻觉。\n“谨慎地拥有、珍惜地使用、勇敢地舍弃。”", "d": "2025-05-05"}]}, {"id": "3300030583", "title": "中里巴人教您养生系列：求医不如求己+极简养生法+活学活用黄帝内经（全4册）", "author": "中里巴人", "cats": ["医学健康-健康"], "bmCount": 3, "rvCount": 0, "notes": [{"k": "h", "c": "1 护命门，守丹田，让身体总有使不完的劲", "x": "那后天又是什么因素在削弱我们肾的精力呢？主要有两个原因：一个是外来的寒气。通常从皮肤和饮食侵入人体。人体要产热，把这些寒气中和或排出，否则就会影响血液的正常流动，造成“寒凝血滞”，形成瘀血。产热的过程要耗费大量的原动力。所以要想使肾精充足，就要尽量避免寒气的侵入。如冬天还穿着短裙，平常总是冰块冷饮，这些都是耗伤肾精的元凶。另一个是内生的恐惧。恐惧最耗肾精，有时甚至比寒气更厉害。但二者通常是互相影响的。如果身体温暖了，血液循环就畅通，我们就不会恐惧，如果，您总是勇气十足，必然热血沸腾，寒气也就不易侵入您的身体。", "y": "", "d": "2023-12-06"}, {"k": "h", "c": "7 会打哈欠，才补肾", "x": "每天有意识地多打哈欠能消除您的失眠问题和烦躁，另外，它还能把气血引到肝、肾上去，达到补肾、补肝的效果。", "y": "", "d": "2024-01-05"}, {"k": "h", "c": "1 用手指肚来梳头，为身体打好地基", "x": "每天梳头多长时间为好呢？坚持每天300次就非常好了。有人说我有的是时间，梳3000次怎么样？那当然更好。头不怕多梳，您只要记住，梳头好处很大，就可以了。", "y": "", "d": "2024-01-05"}]}, {"id": "3300027822", "title": "幸福之路：爱自己，和谁结婚都一样+感恩日记（套装共2册）", "author": "[美]贾尼斯·卡普兰 [德]爱娃－玛丽亚·楚尔霍斯特", "cats": ["生活百科-情感"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序", "x": "我们所有对待外在世界的态度，都来自我们内在世界的投射。", "y": "", "d": "2022-11-20"}, {"k": "h", "c": "前言 为什么写这本书", "x": "过去的每一次循环，开始时都令我忧虑、不安和震惊。随后我便确信，新事物必将随之到来。我学会了清醒地保持对生活走向的敏锐判断，学会了防止陈规陋习阻止我去选择，还学会了相信眼前和下一个岔路口，并重新把握生命中真正重要的东西。一个循环的结束，永远不会是终结，总会有新东西从我内心深处破茧而出，那些表面上的缺陷和障碍都会成为指引方向的路标。一次又一次，我不得不忍痛割舍一些固有习惯，腾出空间接受新事物。这些表面上看起来新的事物，在更深的层面上是相通的。", "y": "", "d": "2022-11-20"}]}, {"id": "31936815", "title": "曲黎敏精讲黄帝内经系列（套装1-3册）", "author": "曲黎敏", "cats": ["医学健康-健康", "医学健康-医学"], "bmCount": 2, "rvCount": 0, "notes": [{"k": "h", "c": "二 法于阴阳，和于术数", "x": "人生，既要符合天道，又得有具体方法；既要有天地阴阳的丰富多彩，又要有落地的平凡的生活。然后，你才能得到气血的柔和、身心的平静，以及时时刻刻的吉祥。", "y": "", "d": "2022-04-29"}, {"k": "h", "c": "三 何谓“朴”", "x": "女人宁可不嫁也不能嫁给抖腿的男人，首先，他的神儿收不住，心神不宁怎能养家？！其次，他身体差，精不足，阴阳肝肾俱不足。", "y": "", "d": "2022-04-29"}]}, {"id": "3300085869", "title": "控糖革命", "author": "[法]杰西·安佐斯佩", "cats": ["医学健康-健康"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "前言 聆听来自身体的声音", "x": "事实证明，我们的身体一直在和我们进行“对话”，只是我们不知道怎样去“倾听”它。", "y": "", "d": "2025-10-13"}]}, {"id": "3300139906", "title": "我被行走治愈了", "author": "[英]安娜贝尔·斯特里茨", "cats": ["生活百科-体育"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "第2周 改善步态", "x": "久坐使人的髋部屈肌缩短并收紧，致使腹部下垂。对着电脑工作迫使人的颈部和头部不自然地前倾，脊柱变得僵直，背部肌肉受到限制。颈部和头部长期前倾会损伤控制脊柱曲线的小型姿态肌，导致腰背疼痛。", "y": "", "d": "2025-04-18"}]}, {"id": "3300129303", "title": "读者（2025年第1期）", "author": "读者", "cats": ["期刊杂志-文学"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "心怀希望的现实主义", "x": "尝试各种微小的生活实验，不自欺、不合谋，寻找新的生活方式和生活美学。\n做到以上三点，或许", "y": "", "d": "2025-01-21"}]}, {"id": "26924455", "title": "极简护肤：你的皮肤需要断舍离", "author": "张娟", "cats": ["生活百科-时尚"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "观念错，过度依赖护肤品", "x": "强调一次，正确的洗脸方式应该是：每天早上用清水洗脸，晚上先卸妆再用洗面奶洗脸。", "y": "", "d": "2022-02-26"}]}, {"id": "33800854", "title": "女性养生三步走：疏肝、养血、心要修", "author": "罗大伦", "cats": ["医学健康-两性"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "前言 女人懂点中医，保自己和家人一生平安", "x": "肝属木，脾胃属土，肝气郁结会导致“木不疏土”，或“肝木横逆克脾土”。脾胃受伤，变得虚弱之后，就会引发食欲不振、消化不良、便秘、胃痛、胃酸、胃溃疡等疾病。", "y": "", "d": "2022-02-26"}]}, {"id": "813440", "title": "中国居民膳食指南（彩图精装）", "author": "翁良", "cats": ["医学健康-健康"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "上篇 营养膳食总则", "x": "进食定量，饥饱适中，恰到好处，则脾胃足以承受，消化、吸收功能正常，人便可及时得到营养供应。", "y": "", "d": "2021-11-11"}]}, {"id": "35575687", "title": "南方人物周刊（2020年第39期）", "author": "南方人物周刊", "cats": ["期刊杂志-生活"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "世界观·记者眼 / REPORTER'S VIEW", "x": "似乎都用自己的方式消解了对未来无着的恐惧感", "y": "", "d": "2021-07-23"}]}, {"id": "29336362", "title": "科学变美的100个基本", "author": "J小姐", "cats": ["生活百科-时尚"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "11 医美选择：可行与不可行的项目", "x": "针对痘坑、痘印和毛孔粗大，最有效的是微针 微针的作用是让皮肤表层的受损细胞排列重组，它的恢复效果是最明显的。", "y": "", "d": "2020-10-11"}]}, {"id": "935068", "title": "东京咖啡时间", "author": "一居生活", "cats": ["生活百科-美食"], "bmCount": 1, "rvCount": 0, "notes": [{"k": "h", "c": "前言 我们是谁？为什么做这件事", "x": "他们沉下心来去对抗人生的焦虑、精神的荒芜，他们有着自己独特的爱好，有自己的一套生活美学，也有忠于自我的生活态度，以有趣、快乐、丰盈作为自己的生活哲学。在他们身上，体现着城市生活带给他们的滋养，浪漫的、沉静的或厚重的。", "y": "", "d": "2020-02-13"}]}]}, {"key": "08_经济商业与理财", "name": "经济、商业与理财", "books": [{"id": "44026191", "title": "纳瓦尔宝典", "author": "埃里克·乔根森", "cats": ["经济理财-理财"], "bmCount": 68, "rvCount": 0, "notes": [{"k": "h", "c": "推荐序一 财富与幸福源自选择", "x": "自由和幸福并不来自外在物质的满足，而是来自我们自身所做出的选择。放低自我是获得幸福的最有效方法，你越是喂养自己的自大，你对生活和整个世界的不满就越会吞噬你", "y": "", "d": "2024-08-28"}, {"k": "h", "c": "推荐序二 一场反直觉的精神瑜伽", "x": "阅读数学、科学和哲学领域的经典作品。不要读畅销书，不要看新闻。避免加入任何所谓的“读书俱乐部”，避免追求任何的社群认同。把真理置于社群认同之上。", "y": "", "d": "2022-11-16"}, {"k": "h", "c": "推荐序二 一场反直觉的精神瑜伽", "x": "阅读纳瓦尔的文字，就如经历一场精神上的瑜伽。你能时常在他富于节奏感的文字间隙，引入某个反直觉的思考角度，在一番修性吐纳之后，思绪更趋宁静。", "y": "", "d": "2024-08-28"}, {"k": "h", "c": "推荐序二 一场反直觉的精神瑜伽", "x": "他是费曼的超级粉丝，推崇费曼学习法——通过公开教授输出来巩固自己所学。", "y": "", "d": "2022-11-16"}, {"k": "h", "c": "第一章 积累财富", "x": "人生的三大要素是财富、健康和幸福。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第一章 积累财富", "x": "培养迭代思维。生活中所有的回报，无论是财富、人际关系，还是知识，都来自复利。", "y": "", "d": "2022-11-16"}, {"k": "h", "c": "第一章 积累财富", "x": "总结：把自己产品化", "y": "", "d": "2022-11-16"}, {"k": "h", "c": "第一章 积累财富", "x": "无论是创业、健身还是恋爱、交友，我始终都认为生命的意义在于专注于事情本身，体验过程，享受当下。", "y": "", "d": "2022-11-18"}, {"k": "h", "c": "第一章 积累财富", "x": "无论处于人生的哪个阶段，努力的目标都是不断提高自己的独立性，而不是升职加薪。拥有独立性，为自己独特的产出成果负责（而不是像打工一样为投入的时间负责），这才是最理想的状态。[10]", "y": "", "d": "2022-11-18"}, {"k": "h", "c": "第一章 积累财富", "x": "只关注工作本身，效率就会变得极高。你可以合理调配自己的工作，在精力充沛的时候工作，不在状态不佳的时候做无用功。", "y": "", "d": "2022-11-18"}, {"k": "h", "c": "第一章 积累财富", "x": "退休就是不再为了想象中的明天而牺牲今天。当你能活在当下，内心充盈地度过每一天时，你就达到了退休的状态。", "y": "", "d": "2022-11-18"}, {"k": "h", "c": "第一章 积累财富", "x": "毫无保留地爱，随心所欲地创造，无忧无虑地玩耍。", "y": "", "d": "2022-11-18"}, {"k": "h", "c": "第一章 积累财富", "x": "不停地折腾，直到撞上大运。", "y": "", "d": "2022-11-18"}, {"k": "h", "c": "第二章 增强判断力", "x": "长大成人后，我们会用一生的时间追求幸福，希望自我能够得到满足。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "承受痛苦也是人生的必修课，它可以带来两大收获：一是痛苦可以让人接受世界的本来面目；二是痛苦可以大大改变一个人的自我，虽然过程非常煎熬。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "具体地表扬，泛泛地批评。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "如果要提出批评意见，不要批评某个人，可以批评工作方法，或者批评某一类行为。如果要表扬，那就找到一个榜样，表扬这个特定的人。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "如果面临艰难选择，比如：\n我应该跟这个人结婚吗？\n我应该接受这份工作吗？\n我应该买这栋房子吗？\n我应该搬到这个城市吗？\n我应该和这个人做生意吗？\n如果你难以抉择，答案就是否定的。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "前提条件是，两个选择利弊相当，但如果一条道路会带来短期痛苦，那么它也会带来长期收益。而根据复利效应，长期收益才是你想要的。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "先读达尔文，再读道金斯。", "y": "", "d": "2024-08-29"}, {"k": "h", "c": "第二章 增强判断力", "x": "如果想学宏观经济学，就先读亚当·斯密、冯·米塞斯或哈耶克，从最早的那批经济哲学家读起。如果喜欢共产主义或社会主义思想，可以从卡尔·马克思的作品读起。", "y": "", "d": "2024-08-29"}, {"k": "h", "c": "第二章 增强判断力", "x": "我没有从网络上学到任何东西。上网的每一天我都是在吃多巴胺零食，每块零食就是140个字符。我每次做的就是发推文，然后看看谁转发了我的推文。这件事很美妙很有趣，却只是个游戏。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第二章 增强判断力", "x": "任何流传了两千年的图书都经过了许多代人的甄别和筛选，其中的一般性原则更有可能是正确的。我想重新开始阅读这类书", "y": "", "d": "2024-08-29"}, {"k": "h", "c": "第三章 学习幸福", "x": "万物皆有二元性和极性。如果我说现在我很开心，那就意味着在某个时刻我很伤心。如果我说一个人有魅力，意思就是其他人没有魅力。每一个积极想法都有一个消极想法的种子蕴含其中，反之亦然，这就是为什么生命的伟大在很大程度上源于苦难。人必须先看到消极的一面，才能去憧憬和欣赏积极的一面。", "y": "", "d": "2024-08-29"}, {"k": "h", "c": "第三章 学习幸福", "x": "欲望越少，越能接受事物的当前状态，头脑越平静。所谓“万般烦恼皆因心动”，就是头脑在一刻不停地设计未来或追忆过去。我越是活在当下，越能感受到快乐，感受到满足。而如果我试图抓住当下快乐的感受，想要一直保持快乐的状态，快乐就不会持久。因为，这时我的心在动，欲念在动，希望依附于一个外部事物，欲将一个短暂的情景变成永恒。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "对我来说，幸福的含义主要是没有痛苦，没有欲望，不沉溺于对未来或过去的思考，真正拥抱当下，拥抱现状，拥抱现实的一切。[4]", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "世界只是折射个人感受的一面镜子。现实是中性的，现实不做评判。一棵树没有对与错、好与坏的概念。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "但如果你把自己看成一个细菌或变形虫，把自己毕生的努力都看成在水上写字、在沙滩上建城堡，你就不会对生活“本来该有”的模样抱有期待。", "y": "", "d": "2024-08-29"}, {"k": "h", "c": "第三章 学习幸福", "x": "生活就是这样，现实就是如此。接受了这一点，就无所谓幸不幸福。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "真正的幸福只是内心平和的副产品，主要还是源于接受现实，而不是改变外部环境。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "幸福是一种选择，是一种可以培养的技能。", "y": "", "d": "2022-11-28"}, {"k": "h", "c": "第三章 学习幸福", "x": "过去就是过去了，没有回忆，没有遗憾，没有放不下的人，没有忘不掉的旅行。既往不恋。", "y": "",
